제한）\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 적극목적 → 「현저히 불합리한 것이 명백한 경우」에 한해 위헌이라는 정식 제시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（신 판결）\u003c/td>\u003ctd>最二小判平元.1.20 / 刑集43巻1号1頁\u003c/td>\u003ctd>공중목욕탕 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 적극목적으로 재구성하여 명백성의 원칙 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西陣ネクタイ事件（니시진 넥타이）\u003c/td>\u003ctd>最三小判平2.2.6\u003c/td>\u003ctd>생사 일원 수입 조치\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 소매시장 판결을 인용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>堀木訴訟（호리키 소송）\u003c/td>\u003ctd>最大判昭57.7.7\u003c/td>\u003ctd>장애복지연금과 아동부양수당의 병급 금지 규정\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 25조의 구체화는 입법부의 광범한 재량. 「현저히 합리성을 결여하여 명백히 재량 일탈·남용」인 경우만 위헌\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>핵심 문구 그대로 외울 것\u003c/strong>: 「\u003cstrong>현저히 불합리한 것이 명백한 경우에 한하여\u003c/strong>」. 「명백」이 빠지거나 「불합리하면 위헌」으로 완화된 지문은 오답이다.\u003c/li>\u003cli>「明白性の原則(명백성)」과 「\u003cstrong>\u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>(명확성)\u003c/strong>」은 한 글자 차이지만 완전히 다른 개념이다. 明白性 = 심사 강도(완만). 明確性 = 정신적 자유를 규제하는 법률의 문언이 통상의 판단능력으로 읽힐 만큼 명확해야 한다는 요청. \u003cstrong>이름이 비슷해 바꿔치기 지문이 자주 나온다.\u003c/strong>\u003c/li>\u003cli>「\u003ca href=\"#/e/%E4%B8%80%E8%A6%8B%E6%98%8E%E7%99%BD%E3%81%AE%E5%8E%9F%E5%89%87\">一見明白の原則\u003c/a>」(砂川事件의 조약 심사)과도 다르다. 이쪽은 통치행위론 계열의 이야기다.\u003c/li>\u003cli>대비: \u003cstrong>明白性の原則(적극목적·완만) ↔ \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(소극목적·중간) ↔ \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>(정신적 자유·엄격)\u003c/strong>. 세 기준의 서열과 적용 대상을 세트로 정리해 두면 어떤 조합 지문도 처리된다.\u003c/li>\u003cli>이 기준은 \u003cstrong>경제적 자유뿐 아니라 생존권(25조)\u003c/strong>에도 쓰인다는 점을 기억할 것. 「명백성의 원칙은 경제적 자유에만 적용된다」는 지문은 좁게 잘라 낸 함정이다.\u003c/li>\u003cli>이 기준이 적용된 사건 중 \u003cstrong>위헌이 된 예는 사실상 없다\u003c/strong>. 문제에서 「명백성의 원칙을 적용하여 위헌으로 했다」는 조합이 보이면 일단 의심하라.\u003c/li>\u003c/ul>","search":"明白性の原則 めいはくせいのげんそく 항목 내용 ------ ------ 읽기 めいはくせいのげんそく（명백성의 원칙） 과목 헌법（위헌심사기준） 한줄 정의 입법부의 재량적 판단을 존중하여, 당해 규제조치가 현저히 불합리한 것이 명백한 경우에 한해 위헌으로 하는 가장 완만한 심사기준 통설·판례 積極目的規制 용어/積極目的規制.md 와 사회보장 입법에 적용. 小売市場距離制限事件 最大判昭47.11.22 이 정식화 개념 明白性の原則 明白の原則이라고도 한다 은 위헌심사기준 중 가장 완만한 기준이다. 법원은 규제의 당부를 스스로 판단하지 않고, 국회의 판단이 「 현저히 불합리한 것이 명백 」한 경우에만 위헌으로 한다. 바꿔 말하면 합헌성 추정 合憲性推定 이 매우 강하게 작동 하며, 이 기준이 적용되는 순간 결론은 사실상 합헌으로 기운다. 정식화한 것이 小売市場距離制限事件 最大判昭47.11.22 이다. 「개인의 경제활동에 대한 법적 규제조치에 관해서는, 국회의 재량적 판단을 존중하는 것을 원칙으로 하고, 재판소는 입법부가 그 재량권을 일탈하여 당해 법적 규제조치가 현저히 불합리한 것이 명백한 경우에 한하여 이를 위헌으로 한다」는 판시가 그것이다. 적용 국면은 크게 둘이다. ① 적극목적의 경제규제 헌법 22조 1항·29조 — 사회경제 정책의 당부는 국회가 정할 일이라는 이유. ② 사회보장 입법 헌법 25조 — 「건강하고 문화적인 최저한도의 생활」이라는 추상적 개념의 구체화는 국회의 광범한 재량에 맡겨져 있다는 이유. 堀木訴訟 最大判昭57.7.7 은 아동부양수당과 장애복지연금의 병급조정 규정을 두고, 25조의 구체화는 입법부의 광범한 재량에 위임되어 있으며 그것이 현저히 합리성을 결여하여 명백히 재량의 일탈·남용이라고 볼 수밖에 없는 경우 를 제외하고는 사법심사의 대상이 되지 않는다고 하여 합헌으로 판단했다. 근거가 되는 사고는 이중의 기준론 二重の基準論 이다. 경제적 자유에 대한 규제는 민주적 정치과정을 통해 시정할 수 있고, 정책적·전문기술적 판단을 요하므로 법원이 나설 필요와 능력이 모두 적다. 반대로 정신적 자유 특히 표현의 자유 는 정치과정 자체를 지탱하는 권리여서 일단 봉쇄되면 민주적 시정이 불가능하므로, 그쪽에는 lra基準 용어/lra基準.md 같은 훨씬 엄격한 기준이 요구된다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 小売市場距離制限事件（소매시장 거리제한） 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 개설 허가의 거리제한 합헌 . 적극목적 → 「현저히 불합리한 것이 명백한 경우」에 한해 위헌이라는 정식 제시 公衆浴場距離制限事件（신 판결） 最二小判平元.1.20 / 刑集43巻1号1頁 공중목욕탕 거리제한 합헌 . 적극목적으로 재구성하여 명백성의 원칙 적용 西陣ネクタイ事件（니시진 넥타이） 最三小判平2.2.6 생사 일원 수입 조치 합헌 . 소매시장 판결을 인용 堀木訴訟（호리키 소송） 最大判昭57.7.7 장애복지연금과 아동부양수당의 병급 금지 규정 합헌 . 25조의 구체화는 입법부의 광범한 재량. 「현저히 합리성을 결여하여 명백히 재량 일탈·남용」인 경우만 위헌 💡 수험 팁 - 핵심 문구 그대로 외울 것 : 「 현저히 불합리한 것이 명백한 경우에 한하여 」. 「명백」이 빠지거나 「불합리하면 위헌」으로 완화된 지문은 오답이다. - 「明白性の原則 명백성 」과 「 明確性の原則 용어/明確性の原則.md 명확성 」은 한 글자 차이지만 완전히 다른 개념이다. 明白性 = 심사 강도 완만 . 明確性 = 정신적 자유를 규제하는 법률의 문언이 통상의 판단능력으로 읽힐 만큼 명확해야 한다는 요청. 이름이 비슷해 바꿔치기 지문이 자주 나온다. - 「 一見明白の原則 용어/一見明白の原則.md 」 砂川事件의 조약 심사 과도 다르다. 이쪽은 통치행위론 계열의 이야기다. - 대비: 明白性の原則 적극목적·완만 ↔ 厳格な合理性の基準 용어/厳格な合理性の基準.md 소극목적·중간 ↔ lra基準 용어/lra基準.md 정신적 자유·엄격 . 세 기준의 서열과 적용 대상을 세트로 정리해 두면 어떤 조합 지문도 처리된다. - 이 기준은 경제적 자유뿐 아니라 생존권 25조 에도 쓰인다는 점을 기억할 것. 「명백성의 원칙은 경제적 자유에만 적용된다」는 지문은 좁게 잘라 낸 함정이다. - 이 기준이 적용된 사건 중 위헌이 된 예는 사실상 없다 . 문제에서 「명백성의 원칙을 적용하여 위헌으로 했다」는 조합이 보이면 일단 의심하라."},"厳格な合理性の基準":{"type":"term","subject":"용어","id":"厳格な合理性の基準","title":"厳格な合理性の基準","sub":"げんかくなごうりせいのきじゅん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>げんかくなごうりせいのきじゅん（엄격한 합리성의 기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>규제의 목적이 \u003cstrong>중요\u003c/strong>하고, \u003cstrong>더 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다\u003c/strong>고 인정될 때에만 합헌으로 하는 중간 강도의 심사기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>에 적용. 薬事法距離制限事件(最大判昭50.4.30)이 실제로 이 심사로 \u003cstrong>위헌\u003c/strong> 결론을 냄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>厳格な合理性の基準\u003c/strong>은 이름 그대로 「합리성의 기준」을 한 단계 강화한 것이다. 가장 완만한 \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>이 「현저히 불합리함이 명백한가」만 보는 데 비해, 이 기준은 법원이 \u003cstrong>입법의 근거가 된 사실(立法事実, りっぽうじじつ) 자체를 검증\u003c/strong>한다. 국회가 「이런 위험이 있으니 규제한다」고 말한 그 위험이 정말로 존재하는지, 그리고 그 규제가 아니면 막을 수 없는지를 법원이 따진다.\u003c/p>\n\u003cp>요건은 두 단계다. ① 규제의 \u003cstrong>목적이 중요\u003c/strong>한 공공의 이익일 것. ② 그 목적을 달성하기 위한 수단으로서 \u003cstrong>필요하고 합리적\u003c/strong>일 것 — 특히 소극목적 규제에서는 「\u003cstrong>보다 완화된 규제수단(직업 활동의 자유를 덜 제한하는 수단)으로는 그 목적을 충분히 달성할 수 없다\u003c/strong>고 인정될 것」이 요구된다. 그리고 이 점의 \u003cstrong>논증 책임은 사실상 규제하는 측(국가)에 있다\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>薬事法距離制限事件\u003c/strong>(最大判昭50.4.30)이 이 기준을 실제로 작동시킨 판결이다. 최고재는 허가제가 직업의 자유에 대한 강력한 제한임을 전제로, 약국 개설의 거리제한에 대해 「경쟁 격화 → 경영 불안정 → 불량의약품 공급」이라는 국가 측 논리를 검토한 뒤, 이는 \u003cstrong>관념적인 가능성에 그치고 확실한 근거가 없다\u003c/strong>고 판단했다. 나아가 불량의약품 방지라면 개설 후의 감독·행정단속이라는 \u003cstrong>덜 제한적인 수단\u003c/strong>으로 충분하다고 보아, 거리제한 규정을 헌법 \u003cstrong>22조 1항\u003c/strong> 위반으로 위헌이라 했다.\u003c/p>\n\u003cp>여기서 나오는 「\u003cstrong>보다 완화된 수단\u003c/strong>」이라는 표현 때문에 \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>과 혼동하기 쉽다. 발상은 같지만 \u003cstrong>강도와 적용 영역이 다르다\u003c/strong>. LRA는 정신적 자유(특히 표현의 자유) 영역의 엄격한 기준으로, 「같은 목적을 달성할 덜 제한적인 수단이 상정될 수 있으면 그것만으로 위헌」에 가깝다. 반면 엄격한 합리성의 기준은 어디까지나 \u003cstrong>경제적 자유의 틀 안\u003c/strong>에 있어, 「완화된 수단으로는 목적을 \u003cstrong>충분히 달성할 수 없다\u003c/strong>」는 점만 인정되면 합헌이 된다. 즉 국가에 요구되는 논증의 수준이 LRA보다 낮다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限事件（약사법 거리제한）\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설 허가에 적정배치(거리제한) 요건\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（22조 1항）. 「난립 → 불량의약품」은 관념적 추론에 불과. 행정단속이라는 완화된 수단으로 목적 달성 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>森林法共有林事件（삼림법 공유림）\u003c/td>\u003ctd>最大判昭62.4.22 / 民集41巻3号408頁\u003c/td>\u003ctd>지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（29조 2항）. 목적을 이분론으로 분류하지 않고 수단의 필요성·합리성을 실질 심사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件（대비용）\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 적극목적 → 이쪽은 \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>핵심 문구\u003c/strong>: 「\u003cstrong>보다 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다고 인정될 것\u003c/strong>」. 薬事法 판결의 이 표현을 그대로 기억해 두면 지문 대조가 쉽다.\u003c/li>\u003cli>\u003cstrong>함정\u003c/strong>: 薬事法距離制限事件의 위헌 대상은 「\u003cstrong>거리제한(적정배치) 요건\u003c/strong>」이지 \u003cstrong>허가제 자체가 아니며\u003c/strong>, 근거 조문은 \u003cstrong>22조 1항\u003c/strong>(29조 아님)이다.\u003c/li>\u003cli>대비: \u003cstrong>厳格な合理性の基準(\u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>) ↔ \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>(\u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>)\u003c/strong>. 목적과 기준을 엇갈리게 붙여 놓은 선택지가 최다 출제 패턴이다.\u003c/li>\u003cli>대비: \u003cstrong>厳格な合理性の基準(경제적 자유·중간) ↔ \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>(정신적 자유·엄격)\u003c/strong>. 둘 다 「덜 제한적인 수단」을 말하지만, LRA 쪽이 더 강하다. 「엄격한 합리성의 기준은 표현의 자유 제한에 적용되는 기준이다」라는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>이름에 「엄격」이 들어가지만 \u003cstrong>엄격심사기준(厳格審査基準)과는 다르다\u003c/strong>. 진짜 엄격심사는 정신적 자유·후천적으로 바꿀 수 없는 사유에 의한 차별 등에 쓰이는 최상급 기준이다. 서열은 \u003cstrong>엄격심사·\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a> &gt; 厳格な合理性 &gt; \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>\u003c/strong> 순으로, 이 기준은 \u003cstrong>한가운데\u003c/strong>에 위치한다.\u003c/li>\u003cli>「立法事実(입법사실)」이라는 용어와 세트로 출제된다. 법원이 입법의 전제가 된 사회적·경제적 사실을 직접 검증한다는 점이 이 기준의 특징이며, \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>에서는 그 검증을 하지 않는다.\u003c/li>\u003c/ul>","search":"厳格な合理性の基準 げんかくなごうりせいのきじゅん 항목 내용 ------ ------ 읽기 げんかくなごうりせいのきじゅん（엄격한 합리성의 기준） 과목 헌법（위헌심사기준） 한줄 정의 규제의 목적이 중요 하고, 더 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다 고 인정될 때에만 합헌으로 하는 중간 강도의 심사기준 통설·판례 消極目的規制 용어/消極目的規制.md 에 적용. 薬事法距離制限事件 最大判昭50.4.30 이 실제로 이 심사로 위헌 결론을 냄 개념 厳格な合理性の基準 은 이름 그대로 「합리성의 기준」을 한 단계 강화한 것이다. 가장 완만한 明白性の原則 용어/明白性の原則.md 이 「현저히 불합리함이 명백한가」만 보는 데 비해, 이 기준은 법원이 입법의 근거가 된 사실 立法事実, りっぽうじじつ 자체를 검증 한다. 국회가 「이런 위험이 있으니 규제한다」고 말한 그 위험이 정말로 존재하는지, 그리고 그 규제가 아니면 막을 수 없는지를 법원이 따진다. 요건은 두 단계다. ① 규제의 목적이 중요 한 공공의 이익일 것. ② 그 목적을 달성하기 위한 수단으로서 필요하고 합리적 일 것 — 특히 소극목적 규제에서는 「 보다 완화된 규제수단 직업 활동의 자유를 덜 제한하는 수단 으로는 그 목적을 충분히 달성할 수 없다 고 인정될 것」이 요구된다. 그리고 이 점의 논증 책임은 사실상 규제하는 측 국가 에 있다 . 薬事法距離制限事件 最大判昭50.4.30 이 이 기준을 실제로 작동시킨 판결이다. 최고재는 허가제가 직업의 자유에 대한 강력한 제한임을 전제로, 약국 개설의 거리제한에 대해 「경쟁 격화 → 경영 불안정 → 불량의약품 공급」이라는 국가 측 논리를 검토한 뒤, 이는 관념적인 가능성에 그치고 확실한 근거가 없다 고 판단했다. 나아가 불량의약품 방지라면 개설 후의 감독·행정단속이라는 덜 제한적인 수단 으로 충분하다고 보아, 거리제한 규정을 헌법 22조 1항 위반으로 위헌이라 했다. 여기서 나오는 「 보다 완화된 수단 」이라는 표현 때문에 lra基準 용어/lra基準.md 과 혼동하기 쉽다. 발상은 같지만 강도와 적용 영역이 다르다 . lra는 정신적 자유 특히 표현의 자유 영역의 엄격한 기준으로, 「같은 목적을 달성할 덜 제한적인 수단이 상정될 수 있으면 그것만으로 위헌」에 가깝다. 반면 엄격한 합리성의 기준은 어디까지나 경제적 자유의 틀 안 에 있어, 「완화된 수단으로는 목적을 충분히 달성할 수 없다 」는 점만 인정되면 합헌이 된다. 즉 국가에 요구되는 논증의 수준이 lra보다 낮다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 薬事法距離制限事件（약사법 거리제한） 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설 허가에 적정배치 거리제한 요건 위헌 （22조 1항）. 「난립 → 불량의약품」은 관념적 추론에 불과. 행정단속이라는 완화된 수단으로 목적 달성 가능 森林法共有林事件（삼림법 공유림） 最大判昭62.4.22 / 民集41巻3号408頁 지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조 위헌 （29조 2항）. 목적을 이분론으로 분류하지 않고 수단의 필요성·합리성을 실질 심사 小売市場距離制限事件（대비용） 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 개설 허가의 거리제한 합헌 . 적극목적 → 이쪽은 明白性の原則 용어/明白性の原則.md 💡 수험 팁 - 핵심 문구 : 「 보다 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다고 인정될 것 」. 薬事法 판결의 이 표현을 그대로 기억해 두면 지문 대조가 쉽다. - 함정 : 薬事法距離制限事件의 위헌 대상은 「 거리제한 적정배치 요건 」이지 허가제 자체가 아니며 , 근거 조문은 22조 1항 29조 아님 이다. - 대비: 厳格な合理性の基準 消極目的規制 용어/消極目的規制.md ↔ 明白性の原則 용어/明白性の原則.md 積極目的規制 용어/積極目的規制.md . 목적과 기준을 엇갈리게 붙여 놓은 선택지가 최다 출제 패턴이다. - 대비: 厳格な合理性の基準 경제적 자유·중간 ↔ lra基準 용어/lra基準.md 정신적 자유·엄격 . 둘 다 「덜 제한적인 수단」을 말하지만, lra 쪽이 더 강하다. 「엄격한 합리성의 기준은 표현의 자유 제한에 적용되는 기준이다」라는 지문은 오답 . - 이름에 「엄격」이 들어가지만 엄격심사기준 厳格審査基準 과는 다르다 . 진짜 엄격심사는 정신적 자유·후천적으로 바꿀 수 없는 사유에 의한 차별 등에 쓰이는 최상급 기준이다. 서열은 엄격심사· lra基準 용어/lra基準.md 厳格な合理性 明白性の原則 용어/明白性の原則.md 순으로, 이 기준은 한가운데 에 위치한다. - 「立法事実 입법사실 」이라는 용어와 세트로 출제된다. 법원이 입법의 전제가 된 사회적·경제적 사실을 직접 검증한다는 점이 이 기준의 특징이며, 明白性の原則 용어/明白性の原則.md 에서는 그 검증을 하지 않는다."},"LRA基準":{"type":"term","subject":"용어","id":"LRA基準","title":"LRA基準","sub":"えるあーるえーきじゅん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>えるあーるえーきじゅん（LRA 기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（위헌심사기준·표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>같은 입법목적을 \u003cstrong>더 적게 제한하는 다른 수단\u003c/strong>으로 달성할 수 있다면, 현재의 규제는 필요 최소한도를 넘어 위헌이 된다는 엄격한 심사기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>학설상 \u003cstrong>정신적 자유(특히 표현의 자유)\u003c/strong>에 타당한 기준으로 지지. 다만 \u003cstrong>최고재는 정면으로 채택하지 않았다\u003c/strong>（猿払事件에서 하급심의 LRA 판단을 뒤집음）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>LRA\u003c/strong>는 \u003cstrong>Less Restrictive Alternative\u003c/strong>의 약자로, 일본어로는 「\u003cstrong>より制限的でない他の選びうる手段\u003c/strong>」(더 제한적이지 않은, 다른 선택 가능한 수단)이라 옮긴다. 미국 헌법 판례에서 발달한 기준을 일본 학설이 도입한 것이다.\u003c/p>\n\u003cp>작동 방식은 단순하다. ① 입법목적 자체는 정당하다고 인정한 뒤, ② 그 목적을 달성하면서도 \u003cstrong>표현의 자유를 덜 제한하는 대체수단\u003c/strong>이 있는지를 묻는다. ③ 그런 수단이 있다면 현재의 규제는 「필요 최소한도」를 넘은 것이므로 \u003cstrong>위헌\u003c/strong>이 된다. 목적을 부정할 필요 없이 수단만으로 위헌을 이끌어 낼 수 있어, 실무적으로 매우 강력하다.\u003c/p>\n\u003cp>적용 영역은 \u003cstrong>정신적 자유\u003c/strong>, 그 가운데서도 표현의 \u003cstrong>내용중립규제\u003c/strong>(시간·장소·방법의 규제)라는 것이 학설의 정리다. 표현의 자유는 민주적 정치과정 자체를 지탱하는 권리여서 일단 봉쇄되면 정치과정을 통한 시정이 불가능하므로, 경제적 자유보다 훨씬 엄격하게 심사해야 한다는 \u003cstrong>이중의 기준론(二重の基準論)\u003c/strong>이 근거다. \u003ca href=\"#/e/%E8%A1%A8%E7%8F%BE%E5%86%85%E5%AE%B9%E8%A6%8F%E5%88%B6\">表現内容規制\u003c/a>에는 LRA보다 더 강한 「明白かつ現在の危険」의 기준 등이 논의된다.\u003c/p>\n\u003cp>그러나 \u003cstrong>최고재는 LRA를 채택하지 않았다\u003c/strong>. \u003cstrong>猿払事件\u003c/strong>에서 제1심(旭川地判昭43.3.25)과 항소심(札幌高裁)은 LRA의 발상에 서서, 우편국 직원이 선거 포스터를 게시한 행위까지 일률적으로 처벌하는 것은 필요 최소한도를 넘는다며 무죄로 했다. 그러나 최고재(最大判昭49.11.6)는 이를 파기하고, ① 금지의 목적이 정당한가, ② 목적과 금지되는 정치적 행위 사이에 \u003cstrong>합리적 관련성\u003c/strong>이 있는가, ③ 금지에 의해 얻는 이익과 잃는 이익이 균형을 이루는가라는 이른바 \u003cstrong>合理的関連性の基準(猿払基準)\u003c/strong>을 써서 \u003cstrong>합헌\u003c/strong>이라 했다. 이 기준은 LRA보다 훨씬 완만하다.\u003c/p>\n\u003cp>\u003cstrong>戸別訪問\u003c/strong>(호별방문) 금지 사건(最判昭56.6.15 / 刑集35巻4号205頁)에서도 최고재는, 호별방문 금지가 표현의 내용이 아니라 그 \u003cstrong>수단·방법에 대한 간접적·부수적 제약\u003c/strong>에 그친다고 보아, 금지로 얻는 이익과 잃는 이익을 견주는 방식으로 \u003cstrong>합헌\u003c/strong> 판단을 내렸다. 「전화나 문서로도 의사를 전달할 수 있다」는 식의 대체수단 논의를 국민 측이 아니라 \u003cstrong>규제를 정당화하는 방향으로\u003c/strong> 쓴 셈이다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>LRA 지지설\u003c/strong>\u003c/td>\u003ctd>표현의 자유 제한은 필요 최소한도여야 하므로, 덜 제한적인 대체수단이 상정 가능하면 위헌으로 해야 한다\u003c/td>\u003ctd>학설상 유력. 猿払事件 제1심·항소심이 채택\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례（合理的関連性の基準）\u003c/td>\u003ctd>목적의 정당성 + 목적과 수단의 합리적 관련성 + 얻는 이익과 잃는 이익의 균형, 이 세 가지로 충분하다\u003c/td>\u003ctd>👉 \u003cstrong>최고재의 실제 입장\u003c/strong>(猿払事件). LRA보다 훨씬 완만하며 사실상 합헌 결론으로 이어진다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>절충（영역 한정설）\u003c/td>\u003ctd>LRA는 표현의 \u003cstrong>내용중립규제\u003c/strong>에 한해 타당하고, 내용규제에는 더 엄격한 기준을, 경제적 자유에는 적용하지 않는다\u003c/td>\u003ctd>기준의 서열을 정리하는 통설적 이해\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>猿払事件（사루후쓰 사건）\u003c/td>\u003ctd>最大判昭49.11.6 / 刑集28巻9号393頁\u003c/td>\u003ctd>우편국 직원이 선거 포스터를 게시·배포하여 국가공무원법 위반으로 기소\u003c/td>\u003ctd>\u003cstrong>합헌·유죄\u003c/strong>. 제1심·항소심의 \u003cstrong>LRA에 의한 위헌 판단을 배척\u003c/strong>하고 合理的関連性の基準 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>猿払事件 제1심\u003c/td>\u003ctd>旭川地判昭43.3.25\u003c/td>\u003ctd>위와 같음\u003c/td>\u003ctd>\u003cstrong>무죄\u003c/strong>. LRA를 정면으로 적용해 국가공무원법의 적용을 위헌이라 함（適用違憲）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>戸別訪問禁止事件（호별방문 금지）\u003c/td>\u003ctd>最判昭56.6.15 / 刑集35巻4号205頁\u003c/td>\u003ctd>공직선거법 138조의 호별방문 전면 금지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 표현 수단·방법에 대한 \u003cstrong>간접적·부수적 제약\u003c/strong>에 불과하다고 봄\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「최고재는 LRA 기준을 채택하고 있다」는 지문은 \u003cstrong>오답\u003c/strong>. LRA는 \u003cstrong>학설·하급심\u003c/strong>의 것이고, 최고재는 猿払事件에서 이를 물리치고 \u003cstrong>合理的関連性の基準\u003c/strong>을 썼다. 「LRA를 쓴 것은 1심·2심, 뒤집은 것은 최고재」로 외운다.\u003c/li>\u003cli>猿払事件은 \u003cstrong>결론이 유죄(합헌)\u003c/strong>라는 점을 반드시 붙여 둘 것. 「LRA로 무죄가 확정되었다」는 지문은 심급을 바꿔치기한 함정이다.\u003c/li>\u003cli>대비: \u003cstrong>LRA基準(정신적 자유·엄격) ↔ \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(경제적 자유의 \u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>·중간)\u003c/strong>. 둘 다 「덜 제한적인 수단」을 문제 삼지만, \u003cstrong>적용 영역과 강도가 다르다\u003c/strong>. 薬事法 사건을 「LRA를 적용한 판례」라고 부르는 지문에 주의.\u003c/li>\u003cli>심사 강도 서열은 \u003cstrong>엄격심사·LRA(정신적 자유) &gt; \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(소극목적) &gt; \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>(적극목적)\u003c/strong>. 이 3단 서열과 \u003ca href=\"#/e/%E8%A6%8F%E5%88%B6%E7%9B%AE%E7%9A%84%E4%BA%8C%E5%88%86%E8%AB%96\">規制目的二分論\u003c/a>의 관계를 그림으로 정리해 두면 조합 문제가 전부 풀린다.\u003c/li>\u003cli>LRA는 \u003cstrong>목적을 인정한 뒤 수단만 문제 삼는\u003c/strong> 구조라는 점이 특징이다. 「목적 자체가 부당하므로 위헌」이라는 논법은 LRA가 아니다.\u003c/li>\u003c/ul>","search":"lra基準 えるあーるえーきじゅん 항목 내용 ------ ------ 읽기 えるあーるえーきじゅん（lra 기준） 과목 헌법（위헌심사기준·표현의 자유） 한줄 정의 같은 입법목적을 더 적게 제한하는 다른 수단 으로 달성할 수 있다면, 현재의 규제는 필요 최소한도를 넘어 위헌이 된다는 엄격한 심사기준 통설·판례 학설상 정신적 자유 특히 표현의 자유 에 타당한 기준으로 지지. 다만 최고재는 정면으로 채택하지 않았다 （猿払事件에서 하급심의 lra 판단을 뒤집음） 개념 lra 는 less restrictive alternative 의 약자로, 일본어로는 「 より制限的でない他の選びうる手段 」 더 제한적이지 않은, 다른 선택 가능한 수단 이라 옮긴다. 미국 헌법 판례에서 발달한 기준을 일본 학설이 도입한 것이다. 작동 방식은 단순하다. ① 입법목적 자체는 정당하다고 인정한 뒤, ② 그 목적을 달성하면서도 표현의 자유를 덜 제한하는 대체수단 이 있는지를 묻는다. ③ 그런 수단이 있다면 현재의 규제는 「필요 최소한도」를 넘은 것이므로 위헌 이 된다. 목적을 부정할 필요 없이 수단만으로 위헌을 이끌어 낼 수 있어, 실무적으로 매우 강력하다. 적용 영역은 정신적 자유 , 그 가운데서도 표현의 내용중립규제 시간·장소·방법의 규제 라는 것이 학설의 정리다. 표현의 자유는 민주적 정치과정 자체를 지탱하는 권리여서 일단 봉쇄되면 정치과정을 통한 시정이 불가능하므로, 경제적 자유보다 훨씬 엄격하게 심사해야 한다는 이중의 기준론 二重の基準論 이 근거다. 表現内容規制 용어/表現内容規制.md 에는 lra보다 더 강한 「明白かつ現在の危険」의 기준 등이 논의된다. 그러나 최고재는 lra를 채택하지 않았다 . 猿払事件 에서 제1심 旭川地判昭43.3.25 과 항소심 札幌高裁 은 lra의 발상에 서서, 우편국 직원이 선거 포스터를 게시한 행위까지 일률적으로 처벌하는 것은 필요 최소한도를 넘는다며 무죄로 했다. 그러나 최고재 最大判昭49.11.6 는 이를 파기하고, ① 금지의 목적이 정당한가, ② 목적과 금지되는 정치적 행위 사이에 합리적 관련성 이 있는가, ③ 금지에 의해 얻는 이익과 잃는 이익이 균형을 이루는가라는 이른바 合理的関連性の基準 猿払基準 을 써서 합헌 이라 했다. 이 기준은 lra보다 훨씬 완만하다. 戸別訪問 호별방문 금지 사건 最判昭56.6.15 / 刑集35巻4号205頁 에서도 최고재는, 호별방문 금지가 표현의 내용이 아니라 그 수단·방법에 대한 간접적·부수적 제약 에 그친다고 보아, 금지로 얻는 이익과 잃는 이익을 견주는 방식으로 합헌 판단을 내렸다. 「전화나 문서로도 의사를 전달할 수 있다」는 식의 대체수단 논의를 국민 측이 아니라 규제를 정당화하는 방향으로 쓴 셈이다. 학설 학설 내용 비고 ------ ------ ------ lra 지지설 표현의 자유 제한은 필요 최소한도여야 하므로, 덜 제한적인 대체수단이 상정 가능하면 위헌으로 해야 한다 학설상 유력. 猿払事件 제1심·항소심이 채택 판례（合理的関連性の基準） 목적의 정당성 + 목적과 수단의 합리적 관련성 + 얻는 이익과 잃는 이익의 균형, 이 세 가지로 충분하다 👉 최고재의 실제 입장 猿払事件 . lra보다 훨씬 완만하며 사실상 합헌 결론으로 이어진다 절충（영역 한정설） lra는 표현의 내용중립규제 에 한해 타당하고, 내용규제에는 더 엄격한 기준을, 경제적 자유에는 적용하지 않는다 기준의 서열을 정리하는 통설적 이해 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 猿払事件（사루후쓰 사건） 最大判昭49.11.6 / 刑集28巻9号393頁 우편국 직원이 선거 포스터를 게시·배포하여 국가공무원법 위반으로 기소 합헌·유죄 . 제1심·항소심의 lra에 의한 위헌 판단을 배척 하고 合理的関連性の基準 적용 猿払事件 제1심 旭川地判昭43.3.25 위와 같음 무죄 . lra를 정면으로 적용해 국가공무원법의 적용을 위헌이라 함（適用違憲） 戸別訪問禁止事件（호별방문 금지） 最判昭56.6.15 / 刑集35巻4号205頁 공직선거법 138조의 호별방문 전면 금지 합헌 . 표현 수단·방법에 대한 간접적·부수적 제약 에 불과하다고 봄 💡 수험 팁 - 최대 함정 : 「최고재는 lra 기준을 채택하고 있다」는 지문은 오답 . lra는 학설·하급심 의 것이고, 최고재는 猿払事件에서 이를 물리치고 合理的関連性の基準 을 썼다. 「lra를 쓴 것은 1심·2심, 뒤집은 것은 최고재」로 외운다. - 猿払事件은 결론이 유죄 합헌 라는 점을 반드시 붙여 둘 것. 「lra로 무죄가 확정되었다」는 지문은 심급을 바꿔치기한 함정이다. - 대비: lra基準 정신적 자유·엄격 ↔ 厳格な合理性の基準 용어/厳格な合理性の基準.md 경제적 자유의 消極目的規制 용어/消極目的規制.md ·중간 . 둘 다 「덜 제한적인 수단」을 문제 삼지만, 적용 영역과 강도가 다르다 . 薬事法 사건을 「lra를 적용한 판례」라고 부르는 지문에 주의. - 심사 강도 서열은 엄격심사·lra 정신적 자유 厳格な合理性の基準 용어/厳格な合理性の基準.md 소극목적 明白性の原則 용어/明白性の原則.md 적극목적 . 이 3단 서열과 規制目的二分論 용어/規制目的二分論.md 의 관계를 그림으로 정리해 두면 조합 문제가 전부 풀린다. - lra는 목적을 인정한 뒤 수단만 문제 삼는 구조라는 점이 특징이다. 「목적 자체가 부당하므로 위헌」이라는 논법은 lra가 아니다."},"比較衡量論":{"type":"term","subject":"용어","id":"比較衡量論","title":"比較衡量論","sub":"ひかくこうりょうろん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ひかくこうりょうろん（비교형량론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（위헌심사기준·인권총론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>인권을 제한함으로써 \u003cstrong>얻어지는 이익\u003c/strong>과 제한하지 않을 경우에 유지되는 \u003cstrong>잃는 이익\u003c/strong>을 비교하여, 전자가 클 때 그 제한을 합헌으로 하는 판단방법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>최고재가 널리 쓰는 기법\u003c/strong>. 博多駅テレビフィルム提出命令事件(最大決昭44.11.26) 등. 다만 기준이 애매하다는 비판이 강하다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>比較衡量論\u003c/strong>(利益衡量論이라고도 한다)은 「공공의 복지」라는 추상적 문구만으로 인권 제한을 정당화하던 초기 판례를 극복하기 위해 등장했다. 인권을 제한해서 얻는 이익과 잃는 이익을 \u003cstrong>저울에 올려\u003c/strong> 어느 쪽이 큰지를 따지므로, 적어도 「공공의 복지에 반하므로 위헌이 아니다」는 식의 논증 없는 결론보다는 진전이다.\u003c/p>\n\u003cp>\u003cstrong>博多駅テレビフィルム提出命令事件\u003c/strong>(最大決昭44.11.26 / 刑集23巻11号1490頁)이 전형이다. 최고재는 취재 필름의 제출명령이 허용되는지에 대해, 「\u003cstrong>한편으로\u003c/strong> 심판 대상이 된 범죄의 성질·태양·경중과 취재한 것의 증거로서의 가치, 나아가 공정한 형사재판을 실현함에 있어서의 필요성의 유무를 고려하고, \u003cstrong>다른 한편으로\u003c/strong> 취재한 것을 증거로 제출하게 함으로써 보도기관의 취재의 자유가 방해되는 정도 및 이것이 보도의 자유에 미치는 영향의 정도 그 밖의 제반 사정을 \u003cstrong>비교형량하여 결정해야 한다\u003c/strong>」고 판시했다. 이 사건에서는 재판의 필요성이 우월하다고 보아 제출명령을 적법하다고 했다(항고 기각). 같은 결정에서 「보도의 자유는 21조의 보장 아래에 있고, 취재의 자유도 21조의 정신에 비추어 \u003cstrong>충분히 존중할 만하다\u003c/strong>」고 한 부분도 함께 출제된다.\u003c/p>\n\u003cp>문제는 \u003cstrong>비교의 척도가 없다\u003c/strong>는 점이다. 어느 쪽 이익이 무거운지를 재는 공통 단위가 없으므로, 결국 재판관의 직관에 맡겨진다. 특히 \u003cstrong>국가의 이익 vs 개인의 인권\u003c/strong>이라는 구도에서 형량하면, 국가 측 이익은 「공정한 재판의 실현」, 「행정의 중립성」, 「시설의 규율 유지」처럼 크고 추상적으로 제시되는 반면 개인의 이익은 구체적이고 작아 보이므로, \u003cstrong>처음부터 국가 측이 유리해지기 쉽다\u003c/strong>는 비판이 강하다. 실제로 よど号ハイジャック新聞記事抹消事件(最大判昭58.6.22)이나 猿払事件(最大判昭49.11.6)의 형량은 결과적으로 모두 국가 측 손을 들어 주었다.\u003c/p>\n\u003cp>그래서 학설은 두 방향의 보완을 제시한다. ① \u003cstrong>이중의 기준론(二重の基準論)\u003c/strong>에 따라 인권의 유형별로 심사 강도를 미리 정해 두고, 그 틀 안에서만 형량하게 하는 것 — \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>, \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>, \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a> 같은 유형화된 기준이 그 산물이다. ② \u003cstrong>定義づけ衡量(정의부여 형량)\u003c/strong> — 개별 사건마다 저울질하는 대신, 미리 「이러이러한 요건을 갖춘 경우에만 제한이 허용된다」는 형태로 형량 결과를 규범화해 두는 방식이다. \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>의 요건을 정식화한 北方ジャーナル事件(最大判昭61.6.11)이 그 예로 자주 거론된다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>個別的比較衡量（개별적 비교형량）\u003c/td>\u003ctd>사건마다 얻는 이익과 잃는 이익을 저울질해 결론을 낸다\u003c/td>\u003ctd>👉 최고재가 실제로 쓰는 방식. \u003cstrong>기준이 애매하고 국가 측에 유리\u003c/strong>하다는 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定義づけ衡量（정의부여 형량）\u003c/td>\u003ctd>형량을 개별 사건이 아니라 \u003cstrong>미리 규범의 형태로\u003c/strong> 해 두어, 적용 단계에서는 요건 충족 여부만 보게 한다\u003c/td>\u003ctd>예측 가능성 확보. 사전억제 요건(北方ジャーナル事件)이 예\u003c/td>\u003c/tr>\u003ctr>\u003ctd>유형화된 심사기준으로의 이행\u003c/td>\u003ctd>인권의 성질에 따라 심사 강도를 미리 서열화(이중의 기준론)하고, 그 안에서 형량한다\u003c/td>\u003ctd>\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>·\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>·\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>이 그 결과물\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>博多駅テレビフィルム提出命令事件（하카타역 TV 필름 제출명령）\u003c/td>\u003ctd>最大決昭44.11.26 / 刑集23巻11号1490頁\u003c/td>\u003ctd>법원이 방송국에 취재 필름의 제출을 명함. 취재의 자유와 공정한 형사재판의 충돌\u003c/td>\u003ctd>\u003cstrong>제출명령 적법\u003c/strong>. 재판의 필요성과 취재의 자유에 대한 지장을 \u003cstrong>비교형량\u003c/strong>. 취재의 자유는 21조의 정신에 비추어 「\u003cstrong>충분히 존중할 만하다\u003c/strong>」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>全逓東京中郵事件（전체 도쿄중우 사건）\u003c/td>\u003ctd>最大判昭41.10.26\u003c/td>\u003ctd>공무원의 노동기본권 제한\u003c/td>\u003ctd>노동기본권 제한은 \u003cstrong>필요 최소한도\u003c/strong>여야 한다며 이익형량으로 접근（후에 全農林警職法事件에서 판례 변경）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>猿払事件（사루후쓰 사건）\u003c/td>\u003ctd>最大判昭49.11.6 / 刑集28巻9号393頁\u003c/td>\u003ctd>우편국 직원의 선거 포스터 게시\u003c/td>\u003ctd>\u003cstrong>합헌·유죄\u003c/strong>. 금지로 얻는 이익과 잃는 이익의 균형을 형량 요소의 하나로 삼음（合理的関連性の基準）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>よど号ハイジャック新聞記事抹消事件（요도호 기사 말소）\u003c/td>\u003ctd>最大判昭58.6.22\u003c/td>\u003ctd>미결구금자가 구독하는 신문의 하이잭 기사를 구치소장이 먹칠하여 말소\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 시설 내 규율·질서 유지의 필요와 열람의 자유를 비교형량. 「\u003cstrong>상당한 개연성\u003c/strong>」이 있으면 제한 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件（홋포 저널）\u003c/td>\u003ctd>最大判昭61.6.11\u003c/td>\u003ctd>잡지 기사에 대한 출판 사전 금지 가처분\u003c/td>\u003ctd>\u003cstrong>가처분 적법\u003c/strong>. 사전억제는 원칙 허용되지 않지만, 표현 내용이 진실이 아니고 오로지 공익 목적이 아님이 명백하며 피해자가 중대·현저히 회복 곤란한 손해를 입을 우려가 있는 때는 예외적으로 허용 → \u003cstrong>定義づけ衡量\u003c/strong>의 예\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>博多駅事件의 두 문구를 세트로 암기\u003c/strong>: ① 취재의 자유는 21조의 정신에 비추어 「\u003cstrong>충분히 존중할 만하다\u003c/strong>」(「보장된다」가 아니다 — 이 한 글자 차이가 단골 함정), ② 결론은 「\u003cstrong>제출명령은 적법\u003c/strong>」이다.\u003c/li>\u003cli>「비교형량론은 인권을 두텁게 보호하기 위한 기준이다」는 지문은 위험하다. 실제로는 \u003cstrong>국가 측 이익이 커 보이기 쉬워 인권 측이 지기 쉽다\u003c/strong>는 비판이 핵심 출제 포인트다.\u003c/li>\u003cli>대비: \u003cstrong>比較衡量論(사건마다 저울질·기준 애매) ↔ 유형화된 심사기준(\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>·\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>·\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>)\u003c/strong>. 후자는 전자의 \u003cstrong>자의성을 통제하기 위해\u003c/strong> 발전한 것이라는 관계를 기억하라.\u003c/li>\u003cli>대비: \u003cstrong>個別的比較衡量 ↔ 定義づけ衡量\u003c/strong>. 전자는 사후·개별, 후자는 사전·규범화. 北方ジャーナル事件의 사전억제 3요건이 후자의 대표 예다.\u003c/li>\u003cli>심사기준의 서열 정리: 정신적 자유는 엄격심사·\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>, 경제적 자유의 \u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>는 \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>, \u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>는 \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>. \u003cstrong>비교형량론은 이 서열 어디에도 속하지 않는 「기법」\u003c/strong>이며, 유형화 이전 단계의 판단방법이라는 위치를 잡아 두면 헷갈리지 않는다.\u003c/li>\u003cli>「공공의 복지」로 뭉뚱그리던 초기 판례 → 비교형량론 → 유형화된 심사기준이라는 \u003cstrong>역사적 흐름\u003c/strong>으로 정리하면 서술형·조합형 모두 대응된다.\u003c/li>\u003c/ul>","search":"比較衡量論 ひかくこうりょうろん 항목 내용 ------ ------ 읽기 ひかくこうりょうろん（비교형량론） 과목 헌법（위헌심사기준·인권총론） 한줄 정의 인권을 제한함으로써 얻어지는 이익 과 제한하지 않을 경우에 유지되는 잃는 이익 을 비교하여, 전자가 클 때 그 제한을 합헌으로 하는 판단방법 통설·판례 최고재가 널리 쓰는 기법 . 博多駅テレビフィルム提出命令事件 最大決昭44.11.26 등. 다만 기준이 애매하다는 비판이 강하다 개념 比較衡量論 利益衡量論이라고도 한다 은 「공공의 복지」라는 추상적 문구만으로 인권 제한을 정당화하던 초기 판례를 극복하기 위해 등장했다. 인권을 제한해서 얻는 이익과 잃는 이익을 저울에 올려 어느 쪽이 큰지를 따지므로, 적어도 「공공의 복지에 반하므로 위헌이 아니다」는 식의 논증 없는 결론보다는 진전이다. 博多駅テレビフィルム提出命令事件 最大決昭44.11.26 / 刑集23巻11号1490頁 이 전형이다. 최고재는 취재 필름의 제출명령이 허용되는지에 대해, 「 한편으로 심판 대상이 된 범죄의 성질·태양·경중과 취재한 것의 증거로서의 가치, 나아가 공정한 형사재판을 실현함에 있어서의 필요성의 유무를 고려하고, 다른 한편으로 취재한 것을 증거로 제출하게 함으로써 보도기관의 취재의 자유가 방해되는 정도 및 이것이 보도의 자유에 미치는 영향의 정도 그 밖의 제반 사정을 비교형량하여 결정해야 한다 」고 판시했다. 이 사건에서는 재판의 필요성이 우월하다고 보아 제출명령을 적법하다고 했다 항고 기각 . 같은 결정에서 「보도의 자유는 21조의 보장 아래에 있고, 취재의 자유도 21조의 정신에 비추어 충분히 존중할 만하다 」고 한 부분도 함께 출제된다. 문제는 비교의 척도가 없다 는 점이다. 어느 쪽 이익이 무거운지를 재는 공통 단위가 없으므로, 결국 재판관의 직관에 맡겨진다. 특히 국가의 이익 vs 개인의 인권 이라는 구도에서 형량하면, 국가 측 이익은 「공정한 재판의 실현」, 「행정의 중립성」, 「시설의 규율 유지」처럼 크고 추상적으로 제시되는 반면 개인의 이익은 구체적이고 작아 보이므로, 처음부터 국가 측이 유리해지기 쉽다 는 비판이 강하다. 실제로 よど号ハイジャック新聞記事抹消事件 最大判昭58.6.22 이나 猿払事件 最大判昭49.11.6 의 형량은 결과적으로 모두 국가 측 손을 들어 주었다. 그래서 학설은 두 방향의 보완을 제시한다. ① 이중의 기준론 二重の基準論 에 따라 인권의 유형별로 심사 강도를 미리 정해 두고, 그 틀 안에서만 형량하게 하는 것 — lra基準 용어/lra基準.md , 厳格な合理性の基準 용어/厳格な合理性の基準.md , 明白性の原則 용어/明白性の原則.md 같은 유형화된 기준이 그 산물이다. ② 定義づけ衡量 정의부여 형량 — 개별 사건마다 저울질하는 대신, 미리 「이러이러한 요건을 갖춘 경우에만 제한이 허용된다」는 형태로 형량 결과를 규범화해 두는 방식이다. 事前抑制 용어/事前抑制.md 의 요건을 정식화한 北方ジャーナル事件 最大判昭61.6.11 이 그 예로 자주 거론된다. 학설 학설 내용 비고 ------ ------ ------ 個別的比較衡量（개별적 비교형량） 사건마다 얻는 이익과 잃는 이익을 저울질해 결론을 낸다 👉 최고재가 실제로 쓰는 방식. 기준이 애매하고 국가 측에 유리 하다는 비판 定義づけ衡量（정의부여 형량） 형량을 개별 사건이 아니라 미리 규범의 형태로 해 두어, 적용 단계에서는 요건 충족 여부만 보게 한다 예측 가능성 확보. 사전억제 요건 北方ジャーナル事件 이 예 유형화된 심사기준으로의 이행 인권의 성질에 따라 심사 강도를 미리 서열화 이중의 기준론 하고, 그 안에서 형량한다 lra基準 용어/lra基準.md · 厳格な合理性の基準 용어/厳格な合理性の基準.md · 明白性の原則 용어/明白性の原則.md 이 그 결과물 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 博多駅テレビフィルム提出命令事件（하카타역 tv 필름 제출명령） 最大決昭44.11.26 / 刑集23巻11号1490頁 법원이 방송국에 취재 필름의 제출을 명함. 취재의 자유와 공정한 형사재판의 충돌 제출명령 적법 . 재판의 필요성과 취재의 자유에 대한 지장을 비교형량 . 취재의 자유는 21조의 정신에 비추어 「 충분히 존중할 만하다 」 全逓東京中郵事件（전체 도쿄중우 사건） 最大判昭41.10.26 공무원의 노동기본권 제한 노동기본권 제한은 필요 최소한도 여야 한다며 이익형량으로 접근（후에 全農林警職法事件에서 판례 변경） 猿払事件（사루후쓰 사건） 最大判昭49.11.6 / 刑集28巻9号393頁 우편국 직원의 선거 포스터 게시 합헌·유죄 . 금지로 얻는 이익과 잃는 이익의 균형을 형량 요소의 하나로 삼음（合理的関連性の基準） よど号ハイジャック新聞記事抹消事件（요도호 기사 말소） 最大判昭58.6.22 미결구금자가 구독하는 신문의 하이잭 기사를 구치소장이 먹칠하여 말소 합헌 . 시설 내 규율·질서 유지의 필요와 열람의 자유를 비교형량. 「 상당한 개연성 」이 있으면 제한 가능 北方ジャーナル事件（홋포 저널） 最大判昭61.6.11 잡지 기사에 대한 출판 사전 금지 가처분 가처분 적법 . 사전억제는 원칙 허용되지 않지만, 표현 내용이 진실이 아니고 오로지 공익 목적이 아님이 명백하며 피해자가 중대·현저히 회복 곤란한 손해를 입을 우려가 있는 때는 예외적으로 허용 → 定義づけ衡量 의 예 💡 수험 팁 - 博多駅事件의 두 문구를 세트로 암기 : ① 취재의 자유는 21조의 정신에 비추어 「 충분히 존중할 만하다 」 「보장된다」가 아니다 — 이 한 글자 차이가 단골 함정 , ② 결론은 「 제출명령은 적법 」이다. - 「비교형량론은 인권을 두텁게 보호하기 위한 기준이다」는 지문은 위험하다. 실제로는 국가 측 이익이 커 보이기 쉬워 인권 측이 지기 쉽다 는 비판이 핵심 출제 포인트다. - 대비: 比較衡量論 사건마다 저울질·기준 애매 ↔ 유형화된 심사기준 lra基準 용어/lra基準.md · 厳格な合理性の基準 용어/厳格な合理性の基準.md · 明白性の原則 용어/明白性の原則.md . 후자는 전자의 자의성을 통제하기 위해 발전한 것이라는 관계를 기억하라. - 대비: 個別的比較衡量 ↔ 定義づけ衡量 . 전자는 사후·개별, 후자는 사전·규범화. 北方ジャーナル事件의 사전억제 3요건이 후자의 대표 예다. - 심사기준의 서열 정리: 정신적 자유는 엄격심사· lra基準 용어/lra基準.md , 경제적 자유의 消極目的規制 용어/消極目的規制.md 는 厳格な合理性の基準 용어/厳格な合理性の基準.md , 積極目的規制 용어/積極目的規制.md 는 明白性の原則 용어/明白性の原則.md . 비교형량론은 이 서열 어디에도 속하지 않는 「기법」 이며, 유형화 이전 단계의 판단방법이라는 위치를 잡아 두면 헷갈리지 않는다. - 「공공의 복지」로 뭉뚱그리던 초기 판례 → 비교형량론 → 유형화된 심사기준이라는 역사적 흐름 으로 정리하면 서술형·조합형 모두 대응된다."},"目的効果基準":{"type":"term","subject":"용어","id":"目的効果基準","title":"目的効果基準","sub":"もくてきこうかきじゅん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>もくてきこうかきじゅん（목적효과기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（정교분리 · 20조 3항 「종교적 활동」）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>어떤 국가행위가 20조 3항이 금지하는 「종교적 활동」에 해당하는지를, \u003cstrong>행위의 목적이 종교적 의의를 갖는가\u003c/strong> + \u003cstrong>효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭이 되는가\u003c/strong>로 판단하는 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>（最大判昭52.7.13）이 확립. 의례 참가·공금지출형 사안에서 사용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 20조 3항은 「국가 및 그 기관은 종교교육 그 밖에 어떠한 종교적 활동도 해서는 안 된다」고 규정한다. 그런데 종교는 교육·복지·문화 등 사회생활 전반과 접점을 갖기 때문에 국가와 종교의 \u003cstrong>완전한 분리는 실제상 불가능\u003c/strong>하다. 그래서 최고재는 20조 3항의 「종교적 활동」을 국가와 종교의 관계를 갖는 모든 행위가 아니라, 그 관계가 \u003cstrong>상당하다고 인정되는 한도를 넘는 것\u003c/strong>으로 한정 해석했다.\u003c/p>\n\u003cp>그 한도 초과 여부를 가리는 도구가 목적효과기준이다. \u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>은 「종교적 활동」을\u003c/p>\n\u003cblockquote>그 행위의 \u003cstrong>목적이 종교적 의의\u003c/strong>를 가지고, 그 \u003cstrong>효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭\u003c/strong> 등이 되는 행위\u003c/blockquote>\n\u003cp>라고 정식화했다. 목적과 효과는 \u003cstrong>양쪽 다 충족되어야\u003c/strong> 위헌이 된다는 것이 판례의 읽기다.\u003c/p>\n\u003cp>판단 방법도 함께 판시했다. 행위의 외형적 측면만이 아니라 \u003cstrong>① 행위가 행해지는 장소, ② 그 행위에 대한 일반인의 종교적 평가, ③ 행위자가 그 행위를 하는 의도·목적 및 종교적 의식(意識)의 유무·정도, ④ 그 행위가 일반인에게 주는 효과·영향\u003c/strong> 등 제반 사정을 고려하여, \u003cstrong>「사회통념에 따라 객관적으로」\u003c/strong> 판단한다. 행위자의 주관적 의도만으로도, 문언의 형식만으로도 결정되지 않는다는 뜻이다.\u003c/p>\n\u003cp>다만 이 기준은 만능이 아니다. 국공유지를 종교시설 부지로 \u003cstrong>무상 제공\u003c/strong>하는 유형에서는 최고재가 목적효과기준을 쓰지 않고 \u003ca href=\"#/e/%E7%B7%8F%E5%90%88%E8%80%83%E6%85%AE%E5%9F%BA%E6%BA%96\">総合考慮基準\u003c/a>(空知太神社事件의 틀)으로 갈아탔다. 목적효과기준은 \u003cstrong>「국가가 어떤 행위를 했는가」(의례 참가·공금지출)\u003c/strong> 국면에서 쓰이는 기준으로 자리가 좁아졌다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>\u003c/td>\u003ctd>最大判昭52.7.13 / 民集31巻4号533頁\u003c/td>\u003ctd>시립체육관 기공식을 神式 지진제로 거행하고 공금 7,663엔 지출\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 세속화된 관습적 의례로 목적은 세속적, 효과는 원조·조장이 아님（기준의 원조 판례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\">愛媛玉串料訴訟\u003c/a>\u003c/td>\u003ctd>最大判平9.4.2\u003c/td>\u003ctd>愛媛県이 야스쿠니 신사·현 호국신사에 다마구시료(玉串料) 등을 공금으로 지출\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（20조 3항·89조）. 목적은 종교적 의의를 갖고, 효과는 특정 종교에 대한 원조·조장\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>箕面忠魂碑訴訟\u003c/span>\u003c/td>\u003ctd>最三小判平5.2.16\u003c/td>\u003ctd>시가 충혼비 이전을 위해 부지를 무상 대여하고 시 교육장이 위령제에 참석\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 충혼비는 전몰자 기념비이지 종교시설이 아니고, 참석 목적은 사회적 의례\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>殉職自衛官合祀拒否訴訟\u003c/span>\u003c/td>\u003ctd>最大判昭63.6.1\u003c/td>\u003ctd>자위대 지방연락부 직원이 대우회의 호국신사 합사 신청에 협력\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 종교적 관심이 낮고 효과도 원조·조장에 이르지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>문구 자체가 출제된다.\u003c/strong> 「목적이 종교적 의의를 가지고, 효과가 원조·조장·촉진 또는 압박·간섭」 + 「\u003cstrong>사회통념에 따라 객관적으로\u003c/strong>」. 「행위자의 주관적 의도만으로 판단한다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>목적효과기준을 적용해 위헌이 된 대표례는 \u003ca href=\"#/e/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\">愛媛玉串料訴訟\u003c/a> 하나\u003c/strong>로 기억. 津地鎮祭·箕面忠魂碑·殉職自衛官合祀는 모두 합헌 → \u003cstrong>위헌 1 : 합헌 3\u003c/strong> 구도로 외운다.\u003c/li>\u003cli>\u003cstrong>대비: 目的効果基準 ↔ \u003ca href=\"#/e/%E7%B7%8F%E5%90%88%E8%80%83%E6%85%AE%E5%9F%BA%E6%BA%96\">総合考慮基準\u003c/a>\u003c/strong> — 의례 참가·공금지출형은 목적효과기준, \u003cstrong>국공유지 무상제공형은 종합고려\u003c/strong>. 空知太神社事件·\u003cspan>孔子廟訴訟\u003c/span>에 「목적효과기준을 적용했다」고 쓰면 함정 지문이다.\u003c/li>\u003cli>목적효과기준은 \u003cstrong>20조 3항의 「종교적 활동」 해당성\u003c/strong>을 가리는 도구다. 89조(공금지출) 위반은 함께 판단되지만, 기준의 본적지는 20조 3항이라는 점을 놓치지 말 것.\u003c/li>\u003cli>\u003cstrong>완전분리 불가론\u003c/strong>(사립 종교계 학교 조성·문화재 신사 사찰 보조를 부정할 수 없다)이 이 기준의 전제 논거로 세트 출제된다.\u003c/li>\u003c/ul>","search":"目的効果基準 もくてきこうかきじゅん 항목 내용 ------ ------ 읽기 もくてきこうかきじゅん（목적효과기준） 과목 헌법（정교분리 · 20조 3항 「종교적 활동」） 한줄 정의 어떤 국가행위가 20조 3항이 금지하는 「종교적 활동」에 해당하는지를, 행위의 목적이 종교적 의의를 갖는가 + 효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭이 되는가 로 판단하는 기준 통설·판례 津地鎮祭事件 헌법/津地鎮祭事件.md （最大判昭52.7.13）이 확립. 의례 참가·공금지출형 사안에서 사용 개념 헌법 20조 3항은 「국가 및 그 기관은 종교교육 그 밖에 어떠한 종교적 활동도 해서는 안 된다」고 규정한다. 그런데 종교는 교육·복지·문화 등 사회생활 전반과 접점을 갖기 때문에 국가와 종교의 완전한 분리는 실제상 불가능 하다. 그래서 최고재는 20조 3항의 「종교적 활동」을 국가와 종교의 관계를 갖는 모든 행위가 아니라, 그 관계가 상당하다고 인정되는 한도를 넘는 것 으로 한정 해석했다. 그 한도 초과 여부를 가리는 도구가 목적효과기준이다. 津地鎮祭事件 헌법/津地鎮祭事件.md 은 「종교적 활동」을 그 행위의 목적이 종교적 의의 를 가지고, 그 효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭 등이 되는 행위 라고 정식화했다. 목적과 효과는 양쪽 다 충족되어야 위헌이 된다는 것이 판례의 읽기다. 판단 방법도 함께 판시했다. 행위의 외형적 측면만이 아니라 ① 행위가 행해지는 장소, ② 그 행위에 대한 일반인의 종교적 평가, ③ 행위자가 그 행위를 하는 의도·목적 및 종교적 의식 意識 의 유무·정도, ④ 그 행위가 일반인에게 주는 효과·영향 등 제반 사정을 고려하여, 「사회통념에 따라 객관적으로」 판단한다. 행위자의 주관적 의도만으로도, 문언의 형식만으로도 결정되지 않는다는 뜻이다. 다만 이 기준은 만능이 아니다. 국공유지를 종교시설 부지로 무상 제공 하는 유형에서는 최고재가 목적효과기준을 쓰지 않고 総合考慮基準 용어/総合考慮基準.md 空知太神社事件의 틀 으로 갈아탔다. 목적효과기준은 「국가가 어떤 행위를 했는가」 의례 참가·공금지출 국면에서 쓰이는 기준으로 자리가 좁아졌다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 津地鎮祭事件 헌법/津地鎮祭事件.md 最大判昭52.7.13 / 民集31巻4号533頁 시립체육관 기공식을 神式 지진제로 거행하고 공금 7,663엔 지출 합헌 . 세속화된 관습적 의례로 목적은 세속적, 효과는 원조·조장이 아님（기준의 원조 판례） 愛媛玉串料訴訟 헌법/愛媛玉串料訴訟.md 最大判平9.4.2 愛媛県이 야스쿠니 신사·현 호국신사에 다마구시료 玉串料 등을 공금으로 지출 위헌 （20조 3항·89조）. 목적은 종교적 의의를 갖고, 효과는 특정 종교에 대한 원조·조장 箕面忠魂碑訴訟 헌법/箕面忠魂碑訴訟.md 最三小判平5.2.16 시가 충혼비 이전을 위해 부지를 무상 대여하고 시 교육장이 위령제에 참석 합헌 . 충혼비는 전몰자 기념비이지 종교시설이 아니고, 참석 목적은 사회적 의례 殉職自衛官合祀拒否訴訟 헌법/殉職自衛官合祀拒否訴訟.md 最大判昭63.6.1 자위대 지방연락부 직원이 대우회의 호국신사 합사 신청에 협력 합헌 . 종교적 관심이 낮고 효과도 원조·조장에 이르지 않음 💡 수험 팁 - 문구 자체가 출제된다. 「목적이 종교적 의의를 가지고, 효과가 원조·조장·촉진 또는 압박·간섭」 + 「 사회통념에 따라 객관적으로 」. 「행위자의 주관적 의도만으로 판단한다」는 지문은 오답. - 목적효과기준을 적용해 위헌이 된 대표례는 愛媛玉串料訴訟 헌법/愛媛玉串料訴訟.md 하나 로 기억. 津地鎮祭·箕面忠魂碑·殉職自衛官合祀는 모두 합헌 → 위헌 1 : 합헌 3 구도로 외운다. - 대비: 目的効果基準 ↔ 総合考慮基準 용어/総合考慮基準.md — 의례 참가·공금지출형은 목적효과기준, 국공유지 무상제공형은 종합고려 . 空知太神社事件· 孔子廟訴訟 헌법/孔子廟訴訟.md 에 「목적효과기준을 적용했다」고 쓰면 함정 지문이다. - 목적효과기준은 20조 3항의 「종교적 활동」 해당성 을 가리는 도구다. 89조 공금지출 위반은 함께 판단되지만, 기준의 본적지는 20조 3항이라는 점을 놓치지 말 것. - 완전분리 불가론 사립 종교계 학교 조성·문화재 신사 사찰 보조를 부정할 수 없다 이 이 기준의 전제 논거로 세트 출제된다."},"総合考慮基準":{"type":"term","subject":"용어","id":"総合考慮基準","title":"総合考慮基準","sub":"そうごうこうりょきじゅん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>そうごうこうりょきじゅん（종합고려기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（정교분리 · 20조 1항 후단·3항, 89조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국공유지를 종교시설 부지로 무상 제공하는 유형에서, \u003cstrong>시설의 성격·무상 제공에 이른 경위·제공의 태양·일반인의 평가\u003c/strong> 등 제반 사정을 고려해 \u003cstrong>사회통념에 비추어 총합적으로\u003c/strong> 상당한 한도 초과 여부를 판단하는 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>空知太神社事件（最大判平22.1.20）이 확립, \u003cspan>孔子廟訴訟\u003c/span>（最大判令3.2.24）이 답습. \u003cstrong>\u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">目的効果基準\u003c/a>을 쓰지 않는다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>「総合考慮基準」은 학계·수험계의 통칭이고, 판결문 자체가 이런 이름을 붙인 것은 아니다. 空知太神社事件(最大判平22.1.20 / 民集64巻1号1頁)에서 최고재가 \u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">目的効果基準\u003c/a>을 \u003cstrong>한 번도 언급하지 않은 채\u003c/strong> 새로운 판단 틀을 제시한 데서 붙은 명칭이다.\u003c/p>\n\u003cp>空知太神社事件은 北海道 砂川市가 시유지를 연합정내회(町内会)에 \u003cstrong>무상으로 제공\u003c/strong>해 그 위에 신사 시설(鳥居·社殿 등)이 서 있던 사안이다. 최고재는 이런 사안이 「국가가 어떤 행위를 했는가」가 아니라 \u003cstrong>「종교시설에 대한 국공유지 제공이라는 상태가 계속되고 있다」\u003c/strong>는 성질을 가진다고 보고, 다음과 같은 틀을 제시했다.\u003c/p>\n\u003cblockquote>당해 \u003cstrong>종교적 시설의 성격\u003c/strong>, 당해 토지가 무상으로 당해 시설의 부지로 제공되기에 이른 \u003cstrong>경위\u003c/strong>, 당해 \u003cstrong>무상 제공의 태양\u003c/strong>, 이에 대한 \u003cstrong>일반인의 평가\u003c/strong> 등 \u003cstrong>제반 사정을 고려하고 사회통념에 비추어 총합적으로 판단\u003c/strong>해야 한다\u003c/blockquote>\n\u003cp>결론은 헌법 \u003cstrong>89조 전단\u003c/strong>이 금지하는 공적 재산의 이용 제공에 해당하고 동시에 \u003cstrong>20조 1항 후단\u003c/strong>이 금지하는 종교단체에 대한 특권 부여에도 해당한다는 \u003cstrong>위헌\u003c/strong> 판단이었다. 다만 최고재는 시설 철거·토지 명도만이 해결책은 아니라며, \u003cstrong>위헌 상태 해소 수단\u003c/strong>(유상 대여, 부지 일부 양도 등)을 심리하도록 원심에 파기환송했다 — 위헌이라고 곧바로 철거를 명하지 않은 점이 특징이다.\u003c/p>\n\u003cp>\u003cspan>孔子廟訴訟\u003c/span>(最大判令3.2.24)은 那覇市가 시립공원 내 공자묘(久米至聖廟)의 \u003cstrong>공원 사용료를 전액 면제\u003c/strong>한 사안에서 이 틀을 그대로 이어받아 \u003cstrong>20조 3항 위반\u003c/strong>으로 위헌 판단했다. 空知太는 89조·20조 1항 후단, 孔子廟는 20조 3항으로 \u003cstrong>적용 조문이 다르다\u003c/strong>는 점이 자주 출제된다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>空知太神社事件\u003c/td>\u003ctd>最大判平22.1.20 / 民集64巻1号1頁\u003c/td>\u003ctd>砂川市가 시유지를 정내회에 \u003cstrong>무상 대여\u003c/strong>해 그 위에 신사 시설이 설치됨\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（89조 전단·20조 1항 후단）. 다만 철거 이외의 위헌상태 해소 수단을 심리하도록 \u003cstrong>파기환송\u003c/strong>（기준의 원조 판례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>富平神社事件\u003c/td>\u003ctd>最大判平22.1.20 / 民集64巻1号128頁\u003c/td>\u003ctd>같은 砂川市가 신사 부지인 시유지를 정내회에 \u003cstrong>무상 양도\u003c/strong>（감사위원 지적을 받아 위헌상태를 해소하려는 조치）\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>（전원일치）. 같은 날 선고된 짝 판결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>孔子廟訴訟\u003c/span>\u003c/td>\u003ctd>最大判令3.2.24 / 民集75巻2号29頁\u003c/td>\u003ctd>那覇市가 시립공원 내 공자묘의 공원 \u003cstrong>사용료를 전액 면제\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（\u003cstrong>20조 3항\u003c/strong>）. 空知太의 틀을 답습하되 조문이 다름\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비: \u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">目的効果基準\u003c/a> ↔ 総合考慮基準\u003c/strong> — 이 저장소 최대 빈출 구별.\u003c/li>\u003cli>\u003cstrong>의례 참가·공금지출형\u003c/strong>(지진제·다마구시료·위령제 참석) → \u003cstrong>목적효과기준\u003c/strong>\u003c/li>\u003cli>\u003cstrong>국공유지 무상제공·사용료 면제형\u003c/strong>(空知太·孔子廟) → \u003cstrong>종합고려\u003c/strong>\u003c/li>\u003cli>「空知太神社事件은 목적효과기준을 적용해 위헌으로 했다」는 지문은 \u003cstrong>오답\u003c/strong>. 최고재는 이 판결에서 목적효과기준을 \u003cstrong>언급조차 하지 않았다\u003c/strong>.\u003c/li>\u003cli>판단 요소 4개(\u003cstrong>성격·경위·태양·일반인의 평가\u003c/strong>)를 순서대로 암기. 「사회통념에 비추어 \u003cstrong>총합적으로\u003c/strong>」라는 마무리 문구까지 세트.\u003c/li>\u003cli>\u003cstrong>결론의 조문 구별\u003c/strong>: 空知太 = \u003cstrong>89조 전단 + 20조 1항 후단\u003c/strong> / \u003cspan>孔子廟訴訟\u003c/span> = \u003cstrong>20조 3항\u003c/strong>. 「둘 다 20조 3항」이라고 쓰면 함정에 걸린다.\u003c/li>\u003cli>空知太는 위헌 인정에도 \u003cstrong>곧바로 철거를 명하지 않고 파기환송\u003c/strong>해 해소 수단을 심리시켰다 — 「위헌이면 즉시 철거·명도」라는 지문은 오답.\u003c/li>\u003cli>같은 날 선고된 \u003cstrong>富平神社事件\u003c/strong>(시가 신사 부지를 정내회에 무상 양도)은 \u003cstrong>합헌\u003c/strong>이었다. 공유지 관련이라도 결론이 갈릴 수 있다는 점을 짝으로 기억.\u003c/li>\u003c/ul>","search":"総合考慮基準 そうごうこうりょきじゅん 항목 내용 ------ ------ 읽기 そうごうこうりょきじゅん（종합고려기준） 과목 헌법（정교분리 · 20조 1항 후단·3항, 89조） 한줄 정의 국공유지를 종교시설 부지로 무상 제공하는 유형에서, 시설의 성격·무상 제공에 이른 경위·제공의 태양·일반인의 평가 등 제반 사정을 고려해 사회통념에 비추어 총합적으로 상당한 한도 초과 여부를 판단하는 기준 통설·판례 空知太神社事件（最大判平22.1.20）이 확립, 孔子廟訴訟 헌법/孔子廟訴訟.md （最大判令3.2.24）이 답습. 目的効果基準 용어/目的効果基準.md 을 쓰지 않는다 개념 「総合考慮基準」은 학계·수험계의 통칭이고, 판결문 자체가 이런 이름을 붙인 것은 아니다. 空知太神社事件 最大判平22.1.20 / 民集64巻1号1頁 에서 최고재가 目的効果基準 용어/目的効果基準.md 을 한 번도 언급하지 않은 채 새로운 판단 틀을 제시한 데서 붙은 명칭이다. 空知太神社事件은 北海道 砂川市가 시유지를 연합정내회 町内会 에 무상으로 제공 해 그 위에 신사 시설 鳥居·社殿 등 이 서 있던 사안이다. 최고재는 이런 사안이 「국가가 어떤 행위를 했는가」가 아니라 「종교시설에 대한 국공유지 제공이라는 상태가 계속되고 있다」 는 성질을 가진다고 보고, 다음과 같은 틀을 제시했다. 당해 종교적 시설의 성격 , 당해 토지가 무상으로 당해 시설의 부지로 제공되기에 이른 경위 , 당해 무상 제공의 태양 , 이에 대한 일반인의 평가 등 제반 사정을 고려하고 사회통념에 비추어 총합적으로 판단 해야 한다 결론은 헌법 89조 전단 이 금지하는 공적 재산의 이용 제공에 해당하고 동시에 20조 1항 후단 이 금지하는 종교단체에 대한 특권 부여에도 해당한다는 위헌 판단이었다. 다만 최고재는 시설 철거·토지 명도만이 해결책은 아니라며, 위헌 상태 해소 수단 유상 대여, 부지 일부 양도 등 을 심리하도록 원심에 파기환송했다 — 위헌이라고 곧바로 철거를 명하지 않은 점이 특징이다. 孔子廟訴訟 헌법/孔子廟訴訟.md 最大判令3.2.24 은 那覇市가 시립공원 내 공자묘 久米至聖廟 의 공원 사용료를 전액 면제 한 사안에서 이 틀을 그대로 이어받아 20조 3항 위반 으로 위헌 판단했다. 空知太는 89조·20조 1항 후단, 孔子廟는 20조 3항으로 적용 조문이 다르다 는 점이 자주 출제된다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 空知太神社事件 最大判平22.1.20 / 民集64巻1号1頁 砂川市가 시유지를 정내회에 무상 대여 해 그 위에 신사 시설이 설치됨 위헌 （89조 전단·20조 1항 후단）. 다만 철거 이외의 위헌상태 해소 수단을 심리하도록 파기환송 （기준의 원조 판례） 富平神社事件 最大判平22.1.20 / 民集64巻1号128頁 같은 砂川市가 신사 부지인 시유지를 정내회에 무상 양도 （감사위원 지적을 받아 위헌상태를 해소하려는 조치） 합헌 （전원일치）. 같은 날 선고된 짝 판결 孔子廟訴訟 헌법/孔子廟訴訟.md 最大判令3.2.24 / 民集75巻2号29頁 那覇市가 시립공원 내 공자묘의 공원 사용료를 전액 면제 위헌 （ 20조 3항 ）. 空知太의 틀을 답습하되 조문이 다름 💡 수험 팁 - 대비: 目的効果基準 용어/目的効果基準.md ↔ 総合考慮基準 — 이 저장소 최대 빈출 구별. - 의례 참가·공금지출형 지진제·다마구시료·위령제 참석 → 목적효과기준 - 국공유지 무상제공·사용료 면제형 空知太·孔子廟 → 종합고려 - 「空知太神社事件은 목적효과기준을 적용해 위헌으로 했다」는 지문은 오답 . 최고재는 이 판결에서 목적효과기준을 언급조차 하지 않았다 . - 판단 요소 4개 성격·경위·태양·일반인의 평가 를 순서대로 암기. 「사회통념에 비추어 총합적으로 」라는 마무리 문구까지 세트. - 결론의 조문 구별 : 空知太 = 89조 전단 + 20조 1항 후단 / 孔子廟訴訟 헌법/孔子廟訴訟.md = 20조 3항 . 「둘 다 20조 3항」이라고 쓰면 함정에 걸린다. - 空知太는 위헌 인정에도 곧바로 철거를 명하지 않고 파기환송 해 해소 수단을 심리시켰다 — 「위헌이면 즉시 철거·명도」라는 지문은 오답. - 같은 날 선고된 富平神社事件 시가 신사 부지를 정내회에 무상 양도 은 합헌 이었다. 공유지 관련이라도 결론이 갈릴 수 있다는 점을 짝으로 기억."},"明確性の原則":{"type":"term","subject":"용어","id":"明確性の原則","title":"明確性の原則","sub":"めいかくせいのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>めいかくせいのげんそく（명확성의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유 · 적정절차 — 21조·31조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>형벌법규나 정신적 자유를 규제하는 법령은, \u003cstrong>통상의 판단능력을 가진 일반인\u003c/strong>이 그 적용 여부를 판단할 수 있는 기준을 읽어낼 수 있을 정도로 명확해야 한다는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>徳島市公安条例事件（最大判昭50.9.10 / 刑集29巻8号489頁）이 판단 정식을 확립. 불명확한 법규는 \u003cstrong>헌법 31조 위반\u003c/strong>으로 무효\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>법률의 문언이 애매하면 두 가지 폐해가 생긴다. 첫째, 무엇이 금지되는지 국민이 알 수 없어 \u003cstrong>고지(告知) 기능\u003c/strong>이 무너진다. 둘째, 판단이 수사기관·행정청의 자의에 맡겨져 \u003cstrong>자의적 집행\u003c/strong>을 낳는다. 셋째, 처벌될지 모른다는 불안 때문에 본래 자유로운 표현까지 스스로 삼가는 \u003ca href=\"#/e/%E8%90%8E%E7%B8%AE%E7%9A%84%E5%8A%B9%E6%9E%9C\">萎縮的効果\u003c/a>가 발생한다.\u003c/p>\n\u003cp>그래서 형벌법규는 \u003cstrong>헌법 31조\u003c/strong>(적정절차)의 요청으로서 명확할 것이 요구되고, 표현의 자유를 규제하는 법령은 \u003cstrong>21조\u003c/strong>의 요청으로서도 한층 엄격한 명확성이 요구된다(정신적 자유의 우월적 지위).\u003c/p>\n\u003cp>徳島市公安条例事件은 이 원칙의 \u003cstrong>판단 정식\u003c/strong>을 제시했다.\u003c/p>\n\u003cblockquote>어떤 형벌법규가 애매불명확하기 때문에 헌법 31조에 위반한다고 인정해야 하는지 여부는, \u003cstrong>통상의 판단능력을 가진 일반인의 이해에 있어서, 구체적 경우에 당해 행위가 그 적용을 받는지 여부의 판단을 가능하게 하는 기준을 읽어낼 수 있는지 여부\u003c/strong>에 의해 이를 결정해야 한다\u003c/blockquote>\n\u003cp>주체가 \u003cstrong>법률 전문가가 아니라 「통상의 판단능력을 가진 일반인」\u003c/strong>이라는 점, 그리고 요구되는 것이 완벽한 일의성(一義性)이 아니라 \u003cstrong>「기준을 읽어낼 수 있을 것」\u003c/strong>이라는 점이 핵심이다. 실제로 최고재는 이 정식을 적용하면서 \u003cstrong>한정해석(限定解釈)\u003c/strong>을 덧붙여 대부분의 규정을 합헌으로 구제해 왔다.\u003c/p>\n\u003cp>다만 표현규제 법령의 한정해석에는 조건이 붙는다. 税関検査事件은 「표현의 자유를 규제하는 법률의 규정에 대해 한정해석이 허용되는 것은, 그 해석에 의해 \u003cstrong>규제 대상이 되는 것과 그렇지 않은 것이 명확히 구별\u003c/strong>되고, 또한 \u003cstrong>합헌적으로 규제할 수 있는 것만이 규제 대상이 됨이 명백해지는 경우\u003c/strong>여야 하며, 나아가 일반 국민의 이해에서 판단을 가능하게 하는 기준을 그 규정으로부터 읽어낼 수 있어야 한다」고 판시했다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>徳島市公安条例事件\u003c/td>\u003ctd>最大判昭50.9.10 / 刑集29巻8号489頁\u003c/td>\u003ctd>집단행진 허가조건의 「\u003cstrong>교통질서를 유지할 것\u003c/strong>」이라는 문언이 불명확한가\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「특별히 교통질서를 저해할 우려가 있는 행위(사행진 등)를 피하라는 취지」로 읽을 수 있어 일반인도 판단 가능（\u003cstrong>판단 정식의 원조\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>税関検査事件（札幌税関検査事件）\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>관세정률법의 「\u003cstrong>풍속을 해할 서적·도화\u003c/strong>」가 광범·불명확한가\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「음란한 서적·도화」로 한정해석 가능하므로 광범하지도 불명확하지도 않음. 세관검사는 \u003cstrong>검열에 해당하지 않음\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>福岡県青少年保護育成条例事件\u003c/td>\u003ctd>最大判昭60.10.23 / 刑集39巻6号413頁\u003c/td>\u003ctd>조례의 「\u003cstrong>음행(淫行)\u003c/strong>」이라는 문언이 불명확한가\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 청소년에 대한 성행위 일반이 아니라, 심신의 미성숙을 이용한 부당한 수단에 의한 것 또는 단지 성적 욕망 충족의 대상으로 취급한 것으로 \u003cstrong>한정해석\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>広島市暴走族追放条例事件\u003c/td>\u003ctd>最三小判平19.9.18 / 刑集61巻6号601頁\u003c/td>\u003ctd>「누구든지」에 적용될 듯한 집회 금지 규정\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>합헌한정해석\u003c/strong>으로 폭주족 및 이에 준하는 집단에만 적용 → \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">過度の広汎性の法理\u003c/a>와도 걸치는 판례\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>판단 정식을 문언 그대로.\u003c/strong> 「\u003cstrong>통상의 판단능력을 가진 일반인의 이해\u003c/strong>에 있어서, 당해 행위가 그 적용을 받는지 판단을 가능하게 하는 \u003cstrong>기준을 읽어낼 수 있는지\u003c/strong>」. 주체를 「법률 전문가」로 바꾼 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>근거 조문 = 31조\u003c/strong>(형벌법규의 명확성)가 정면. 표현규제인 경우 21조도 함께 문제된다. 「명확성은 21조에서만 도출된다」는 지문에 주의.\u003c/li>\u003cli>\u003cstrong>대비: 明確性の原則 ↔ \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">過度の広汎性の法理\u003c/a>\u003c/strong> — 명확성은 규제 경계선이 \u003cstrong>흐릿한\u003c/strong> 문제, 과도한 광범성은 경계선은 읽히지만 그 범위가 \u003cstrong>너무 넓은\u003c/strong> 문제. 헷갈리면 「보이지 않는가(明確性) / 너무 넓은가(広汎性)」로 나눈다.\u003c/li>\u003cli>\u003cstrong>결론은 거의 다 합헌.\u003c/strong> 최고재가 명확성 위반으로 법령을 무효로 한 예는 사실상 없고, \u003cstrong>한정해석으로 구제\u003c/strong>하는 것이 판례의 패턴이다. 「〜는 불명확하여 위헌으로 되었다」는 지문은 일단 의심할 것.\u003c/li>\u003cli>徳島市公安条例事件은 \u003cstrong>조례와 법률의 관계\u003c/strong>(법률선점론·조례의 상한 문제)에서도 리딩 케이스다. 명확성 논점과 조례 논점 \u003cstrong>두 얼굴\u003c/strong>을 가진 판례로 기억해 둔다.\u003c/li>\u003c/ul>","search":"明確性の原則 めいかくせいのげんそく 항목 내용 ------ ------ 읽기 めいかくせいのげんそく（명확성의 원칙） 과목 헌법（표현의 자유 · 적정절차 — 21조·31조） 한줄 정의 형벌법규나 정신적 자유를 규제하는 법령은, 통상의 판단능력을 가진 일반인 이 그 적용 여부를 판단할 수 있는 기준을 읽어낼 수 있을 정도로 명확해야 한다는 원칙 통설·판례 徳島市公安条例事件（最大判昭50.9.10 / 刑集29巻8号489頁）이 판단 정식을 확립. 불명확한 법규는 헌법 31조 위반 으로 무효 개념 법률의 문언이 애매하면 두 가지 폐해가 생긴다. 첫째, 무엇이 금지되는지 국민이 알 수 없어 고지 告知 기능 이 무너진다. 둘째, 판단이 수사기관·행정청의 자의에 맡겨져 자의적 집행 을 낳는다. 셋째, 처벌될지 모른다는 불안 때문에 본래 자유로운 표현까지 스스로 삼가는 萎縮的効果 용어/萎縮的効果.md 가 발생한다. 그래서 형벌법규는 헌법 31조 적정절차 의 요청으로서 명확할 것이 요구되고, 표현의 자유를 규제하는 법령은 21조 의 요청으로서도 한층 엄격한 명확성이 요구된다 정신적 자유의 우월적 지위 . 徳島市公安条例事件은 이 원칙의 판단 정식 을 제시했다. 어떤 형벌법규가 애매불명확하기 때문에 헌법 31조에 위반한다고 인정해야 하는지 여부는, 통상의 판단능력을 가진 일반인의 이해에 있어서, 구체적 경우에 당해 행위가 그 적용을 받는지 여부의 판단을 가능하게 하는 기준을 읽어낼 수 있는지 여부 에 의해 이를 결정해야 한다 주체가 법률 전문가가 아니라 「통상의 판단능력을 가진 일반인」 이라는 점, 그리고 요구되는 것이 완벽한 일의성 一義性 이 아니라 「기준을 읽어낼 수 있을 것」 이라는 점이 핵심이다. 실제로 최고재는 이 정식을 적용하면서 한정해석 限定解釈 을 덧붙여 대부분의 규정을 합헌으로 구제해 왔다. 다만 표현규제 법령의 한정해석에는 조건이 붙는다. 税関検査事件은 「표현의 자유를 규제하는 법률의 규정에 대해 한정해석이 허용되는 것은, 그 해석에 의해 규제 대상이 되는 것과 그렇지 않은 것이 명확히 구별 되고, 또한 합헌적으로 규제할 수 있는 것만이 규제 대상이 됨이 명백해지는 경우 여야 하며, 나아가 일반 국민의 이해에서 판단을 가능하게 하는 기준을 그 규정으로부터 읽어낼 수 있어야 한다」고 판시했다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 徳島市公安条例事件 最大判昭50.9.10 / 刑集29巻8号489頁 집단행진 허가조건의 「 교통질서를 유지할 것 」이라는 문언이 불명확한가 합헌 . 「특별히 교통질서를 저해할 우려가 있는 행위 사행진 등 를 피하라는 취지」로 읽을 수 있어 일반인도 판단 가능（ 판단 정식의 원조 ） 税関検査事件（札幌税関検査事件） 最大判昭59.12.12 / 民集38巻12号1308頁 관세정률법의 「 풍속을 해할 서적·도화 」가 광범·불명확한가 합헌 . 「음란한 서적·도화」로 한정해석 가능하므로 광범하지도 불명확하지도 않음. 세관검사는 검열에 해당하지 않음 福岡県青少年保護育成条例事件 最大判昭60.10.23 / 刑集39巻6号413頁 조례의 「 음행 淫行 」이라는 문언이 불명확한가 합헌 . 청소년에 대한 성행위 일반이 아니라, 심신의 미성숙을 이용한 부당한 수단에 의한 것 또는 단지 성적 욕망 충족의 대상으로 취급한 것으로 한정해석 広島市暴走族追放条例事件 最三小判平19.9.18 / 刑集61巻6号601頁 「누구든지」에 적용될 듯한 집회 금지 규정 합헌 . 합헌한정해석 으로 폭주족 및 이에 준하는 집단에만 적용 → 過度の広汎性の法理 용어/過度の広汎性の法理.md 와도 걸치는 판례 💡 수험 팁 - 판단 정식을 문언 그대로. 「 통상의 판단능력을 가진 일반인의 이해 에 있어서, 당해 행위가 그 적용을 받는지 판단을 가능하게 하는 기준을 읽어낼 수 있는지 」. 주체를 「법률 전문가」로 바꾼 지문은 오답 . - 근거 조문 = 31조 형벌법규의 명확성 가 정면. 표현규제인 경우 21조도 함께 문제된다. 「명확성은 21조에서만 도출된다」는 지문에 주의. - 대비: 明確性の原則 ↔ 過度の広汎性の法理 용어/過度の広汎性の法理.md — 명확성은 규제 경계선이 흐릿한 문제, 과도한 광범성은 경계선은 읽히지만 그 범위가 너무 넓은 문제. 헷갈리면 「보이지 않는가 明確性 / 너무 넓은가 広汎性 」로 나눈다. - 결론은 거의 다 합헌. 최고재가 명확성 위반으로 법령을 무효로 한 예는 사실상 없고, 한정해석으로 구제 하는 것이 판례의 패턴이다. 「〜는 불명확하여 위헌으로 되었다」는 지문은 일단 의심할 것. - 徳島市公安条例事件은 조례와 법률의 관계 법률선점론·조례의 상한 문제 에서도 리딩 케이스다. 명확성 논점과 조례 논점 두 얼굴 을 가진 판례로 기억해 둔다."},"萎縮的効果":{"type":"term","subject":"용어","id":"萎縮的効果","title":"萎縮的効果","sub":"いしゅくてきこうか","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>いしゅくてきこうか（위축적 효과）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유 — 21조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>처벌·규제의 범위가 불명확하거나 지나치게 넓으면, 본래 처벌되지 않을 표현까지 스스로 삼가게 되어 표현활동 전반이 움츠러드는 효과（chilling effect）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>미국 헌법판례의 \u003cstrong>chilling effect\u003c/strong>를 옮긴 개념이다. 어떤 법률이 「무엇을 하면 처벌되는지」 를 명확히 말해 주지 않으면, 일반인은 안전한 쪽으로 물러서서 \u003cstrong>적법한 표현까지 포기\u003c/strong>한다. 규제 자체가 위헌이 아니어도, 규제가 만들어 내는 이 \u003cstrong>간접적·심리적 억제\u003c/strong>가 21조가 보호하는 표현의 자유를 실질적으로 갉아먹는다는 것이 이 개념의 취지다.\u003c/p>\n\u003cp>위축효과의 핵심은 \u003cstrong>피해가 보이지 않는다\u003c/strong>는 데 있다. 실제로 처벌된 사람은 다툴 기회라도 있지만, 겁을 먹고 발언을 접은 사람은 사건이 되지 않으므로 법정에 나타나지 않는다. 그래서 위축효과가 문제되는 국면에서는 \u003cstrong>당해 사안에서 자신에게 합헌적으로 적용될 수 있는 자에게도 법령 자체의 위헌 주장을 허용\u003c/strong>하고(제3자의 권리 원용), \u003cstrong>적용위헌이 아니라 문면상 무효\u003c/strong>로 처리하는 것이 정당화된다. \u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>과 \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">過度の広汎性の法理\u003c/a>가 \u003cstrong>문면심사(文面審査)\u003c/strong>의 법리로 세워지는 이유가 바로 여기에 있다.\u003c/p>\n\u003cp>위축효과가 특히 문제되는 국면은 다음 셋이다.\u003c/p>\n\u003col>\u003cli>\u003cstrong>불명확한 형벌법규\u003c/strong> — 경계선을 몰라 안전지대까지 물러선다 → \u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>\u003c/li>\u003cli>\u003cstrong>과도하게 광범한 규제\u003c/strong> — 경계선은 알지만 그 안에 적법한 표현이 대량으로 들어와 있다 → \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">過度の広汎性の法理\u003c/a>\u003c/li>\u003cli>\u003cstrong>\u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">사전억제\u003c/a>·사전규제\u003c/strong> — 발표 전에 막히면 표현자는 아예 시도하지 않게 된다 → \u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">검열\u003c/a>의 절대금지(21조 2항), 사전억제의 원칙적 금지\u003c/li>\u003c/ol>\n\u003cp>한편 판례는 위축효과를 이유로 법령을 무효로 하기보다 \u003cstrong>한정해석으로 경계선을 그어 주는\u003c/strong> 방식을 택해 왔다. 그러나 \u003cstrong>한정해석 자체가 사후에 이루어지는 이상, 행위 시점의 표현자에게는 여전히 경계선이 보이지 않는다\u003c/strong>는 비판(학설)이 강하다 — 판례의 처리방식에 대한 대표적 비판 논점이므로 함께 정리해 둔다.\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>위축효과는 「법령의 문언」이 낳는 효과다.\u003c/strong> 개별 처분이 가혹했다는 이야기가 아니라, 규정의 애매함·광범함 자체가 문제라는 점에서 \u003cstrong>문면심사\u003c/strong>로 이어진다.\u003c/li>\u003cli>\u003cstrong>대비: \u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>(경계선이 흐릿) ↔ \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">過度の広汎性の法理\u003c/a>(경계선이 너무 넓음)\u003c/strong> — 둘 다 위축효과를 근거로 문면상 무효를 정당화하는 자매 법리.\u003c/li>\u003cli>위축효과 논의에서 \u003cstrong>제3자의 권리 원용이 허용\u003c/strong>된다는 점이 시험 포인트. 「자신에게는 합헌적으로 적용될 수 있으므로 다툴 수 없다」는 지문은 이 국면에서는 틀린다.\u003c/li>\u003cli>\u003cstrong>정신적 자유 &gt; 경제적 자유\u003c/strong>의 심사밀도 차이(이중의 기준)를 뒷받침하는 논거 중 하나가 위축효과다. 경제적 규제에는 이 논거가 잘 쓰이지 않는다.\u003c/li>\u003cli>판례는 위축효과를 정면으로 내세워 법령을 무효로 한 적이 거의 없고 \u003cstrong>한정해석으로 처리\u003c/strong>한다 — 「최고재가 위축효과를 이유로 위헌 무효로 했다」는 지문은 의심할 것.\u003c/li>\u003c/ul>","search":"萎縮的効果 いしゅくてきこうか 항목 내용 ------ ------ 읽기 いしゅくてきこうか（위축적 효과） 과목 헌법（표현의 자유 — 21조） 한줄 정의 처벌·규제의 범위가 불명확하거나 지나치게 넓으면, 본래 처벌되지 않을 표현까지 스스로 삼가게 되어 표현활동 전반이 움츠러드는 효과（chilling effect） 개념 미국 헌법판례의 chilling effect 를 옮긴 개념이다. 어떤 법률이 「무엇을 하면 처벌되는지」 를 명확히 말해 주지 않으면, 일반인은 안전한 쪽으로 물러서서 적법한 표현까지 포기 한다. 규제 자체가 위헌이 아니어도, 규제가 만들어 내는 이 간접적·심리적 억제 가 21조가 보호하는 표현의 자유를 실질적으로 갉아먹는다는 것이 이 개념의 취지다. 위축효과의 핵심은 피해가 보이지 않는다 는 데 있다. 실제로 처벌된 사람은 다툴 기회라도 있지만, 겁을 먹고 발언을 접은 사람은 사건이 되지 않으므로 법정에 나타나지 않는다. 그래서 위축효과가 문제되는 국면에서는 당해 사안에서 자신에게 합헌적으로 적용될 수 있는 자에게도 법령 자체의 위헌 주장을 허용 하고 제3자의 권리 원용 , 적용위헌이 아니라 문면상 무효 로 처리하는 것이 정당화된다. 明確性の原則 용어/明確性の原則.md 과 過度の広汎性の法理 용어/過度の広汎性の法理.md 가 문면심사 文面審査 의 법리로 세워지는 이유가 바로 여기에 있다. 위축효과가 특히 문제되는 국면은 다음 셋이다. 1. 불명확한 형벌법규 — 경계선을 몰라 안전지대까지 물러선다 → 明確性の原則 용어/明確性の原則.md 2. 과도하게 광범한 규제 — 경계선은 알지만 그 안에 적법한 표현이 대량으로 들어와 있다 → 過度の広汎性の法理 용어/過度の広汎性の法理.md 3. 사전억제 용어/事前抑制.md ·사전규제 — 발표 전에 막히면 표현자는 아예 시도하지 않게 된다 → 검열 용어/検閲.md 의 절대금지 21조 2항 , 사전억제의 원칙적 금지 한편 판례는 위축효과를 이유로 법령을 무효로 하기보다 한정해석으로 경계선을 그어 주는 방식을 택해 왔다. 그러나 한정해석 자체가 사후에 이루어지는 이상, 행위 시점의 표현자에게는 여전히 경계선이 보이지 않는다 는 비판 학설 이 강하다 — 판례의 처리방식에 대한 대표적 비판 논점이므로 함께 정리해 둔다. 💡 수험 팁 - 위축효과는 「법령의 문언」이 낳는 효과다. 개별 처분이 가혹했다는 이야기가 아니라, 규정의 애매함·광범함 자체가 문제라는 점에서 문면심사 로 이어진다. - 대비: 明確性の原則 용어/明確性の原則.md 경계선이 흐릿 ↔ 過度の広汎性の法理 용어/過度の広汎性の法理.md 경계선이 너무 넓음 — 둘 다 위축효과를 근거로 문면상 무효를 정당화하는 자매 법리. - 위축효과 논의에서 제3자의 권리 원용이 허용 된다는 점이 시험 포인트. 「자신에게는 합헌적으로 적용될 수 있으므로 다툴 수 없다」는 지문은 이 국면에서는 틀린다. - 정신적 자유 경제적 자유 의 심사밀도 차이 이중의 기준 를 뒷받침하는 논거 중 하나가 위축효과다. 경제적 규제에는 이 논거가 잘 쓰이지 않는다. - 판례는 위축효과를 정면으로 내세워 법령을 무효로 한 적이 거의 없고 한정해석으로 처리 한다 — 「최고재가 위축효과를 이유로 위헌 무효로 했다」는 지문은 의심할 것."},"過度の広汎性の法理":{"type":"term","subject":"용어","id":"過度の広汎性の法理","title":"過度の広汎性の法理","sub":"かどのこうはんせいのほうり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>かどのこうはんせいのほうり（과도한 광범성의 법리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유 — 21조·31조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>규제의 범위가 지나치게 넓어 \u003cstrong>합헌적으로 규제할 수 있는 표현을 넘어 규제해서는 안 될 표현까지 삼켜 버리는\u003c/strong> 법령은, 당해 사안에서의 적용 결과를 묻지 않고 \u003cstrong>문면상 무효\u003c/strong>가 된다는 법리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>미국 판례법(overbreadth doctrine) 유래. 최고재는 이 법리를 정면으로 적용해 법령을 무효로 하기보다 \u003cstrong>합헌한정해석\u003c/strong>으로 구제하는 태도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>어떤 법령의 문언이 명확하더라도, 그 명확한 경계선이 \u003cstrong>너무 넓은 곳에\u003c/strong> 그어져 있을 수 있다. 예컨대 「공공장소에서의 모든 집회를 금지한다」는 규정은 무엇이 금지되는지 아주 명확하지만, 그 안에는 헌법상 당연히 보호되어야 할 집회가 대량으로 들어와 있다. 이런 법령을 개별 사안마다 「이 사람에게 적용한 것은 위헌」이라고 잘라 내는 방식(적용위헌)으로만 처리하면, 법령이 살아 있는 한 다른 사람들은 계속 겁을 먹고 표현을 접는다. 그 \u003ca href=\"#/e/%E8%90%8E%E7%B8%AE%E7%9A%84%E5%8A%B9%E6%9E%9C\">萎縮的効果\u003c/a>를 단번에 제거하기 위해, \u003cstrong>법령 자체를 문면상 무효\u003c/strong>로 선언한다는 것이 이 법리다.\u003c/p>\n\u003cp>그 결과 이 법리에서는 소송법상의 예외가 인정된다. \u003cstrong>자기 행위에 대해서는 합헌적으로 규제될 수 있는 자라도 법령이 광범하다는 이유로 그 무효를 주장할 수 있다\u003c/strong>(제3자의 권리 원용). 통상의 위헌 주장 적격 법리에 대한 예외라는 점이 시험에서 다루어진다.\u003c/p>\n\u003cp>\u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>과의 관계는 반드시 정리해 두어야 한다. 둘은 모두 \u003ca href=\"#/e/%E8%90%8E%E7%B8%AE%E7%9A%84%E5%8A%B9%E6%9E%9C\">萎縮的効果\u003c/a>를 이유로 \u003cstrong>문면심사\u003c/strong>를 정당화하지만, 결함의 소재가 다르다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>\u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>\u003c/th>\u003cth>過度の広汎性の法理\u003c/th>\u003c/tr>\u003ctr>\u003ctd>결함\u003c/td>\u003ctd>경계선이 \u003cstrong>흐릿\u003c/strong>하다（どこまでが規制対象か読み取れない）\u003c/td>\u003ctd>경계선은 읽히지만 그것이 \u003cstrong>너무 넓다\u003c/strong>（読み取れるが範囲が広すぎる）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문제 조문\u003c/td>\u003ctd>\u003cstrong>31조\u003c/strong>（적정절차·형벌법규의 명확성）, 표현규제면 21조도\u003c/td>\u003ctd>\u003cstrong>21조\u003c/strong>（실체적으로 규제할 수 없는 표현까지 규제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>성질\u003c/td>\u003ctd>\u003cstrong>형식적\u003c/strong> 결함（문언의 불명확）\u003c/td>\u003ctd>\u003cstrong>실체적\u003c/strong> 결함（규제 범위의 과대）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판단 방법\u003c/td>\u003ctd>통상의 판단능력을 가진 일반인이 기준을 읽어낼 수 있는가\u003c/td>\u003ctd>합헌적으로 규제할 수 있는 부분을 넘는 규제가 포함되어 있는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>공통점\u003c/td>\u003ctd>둘 다 \u003cstrong>문면상 무효\u003c/strong>의 근거, 둘 다 \u003cstrong>제3자의 권리 원용\u003c/strong>을 허용\u003c/td>\u003ctd>〃\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>일본 최고재의 실제 태도는 소극적이다. 광범해 보이는 규정도 \u003cstrong>합헌한정해석\u003c/strong>을 가해 「그렇게 넓게 읽지 않으면 된다」며 합헌으로 처리해 왔다. 다만 표현규제에 대한 한정해석에는 税関検査事件이 제시한 조건이 붙는다 — 그 해석에 의해 \u003cstrong>규제 대상과 비대상이 명확히 구별\u003c/strong>되고, \u003cstrong>합헌적으로 규제할 수 있는 것만이 규제 대상이 됨이 명백\u003c/strong>해져야 한다. 결국 광범성 문제를 한정해석으로 푸는 순간, 그 해석이 명확성 요건을 만족하는지가 다시 검토되는 구조다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>広島市暴走族追放条例事件\u003c/td>\u003ctd>最三小判平19.9.18 / 刑集61巻6号601頁\u003c/td>\u003ctd>조례가 문언상 「누구든지」의 집합·집회에 적용될 듯 규정되어 규제 범위가 광범\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>폭주족 및 사회통념상 이와 동일시할 수 있는 집단\u003c/strong>에만 적용된다고 \u003cstrong>합헌한정해석\u003c/strong> → 21조 1항·31조 위반 아님（광범성이 정면으로 다루어진 대표례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>税関検査事件（札幌税関検査事件）\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>「풍속을 해할 서적·도화」의 광범·불명확성\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「음란한 것」으로 한정해석. 아울러 \u003cstrong>표현규제 법령의 한정해석이 허용되는 요건\u003c/strong>을 제시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>福岡県青少年保護育成条例事件\u003c/td>\u003ctd>最大判昭60.10.23 / 刑集39巻6号413頁\u003c/td>\u003ctd>「음행」이 청소년과의 성행위 일반을 포괄할 만큼 광범한가\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 부당한 수단에 의한 것 등으로 \u003cstrong>한정해석\u003c/strong>（광범성을 해석으로 좁힌 전형）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>徳島市公安条例事件\u003c/td>\u003ctd>最大判昭50.9.10 / 刑集29巻8号489頁\u003c/td>\u003ctd>「교통질서를 유지할 것」\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 명확성 정식의 원조이자, 한정해석으로 규제 범위를 좁힌 예\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비의 핵심 한 줄: 明確性 = 「어디까지인지 안 보인다」, 過度の広汎性 = 「보이는데 너무 넓다」.\u003c/strong> 이 한 줄만 정확히 잡으면 대부분의 지문이 풀린다.\u003c/li>\u003cli>조문 대응도 짝으로: \u003cstrong>明確性 → 31조\u003c/strong>(형벌법규), \u003cstrong>過度の広汎性 → 21조\u003c/strong>(실체적 과잉규제). 다만 표현규제에서는 둘이 겹쳐 함께 주장되는 일이 많다.\u003c/li>\u003cli>\u003cstrong>공통점을 묻는 문제\u003c/strong>에 주의: 둘 다 \u003cstrong>문면상 무효\u003c/strong>의 법리이고, 둘 다 \u003cstrong>자신에게는 합헌적으로 적용될 수 있는 자의 위헌 주장(제3자의 권리 원용)\u003c/strong>을 허용한다.\u003c/li>\u003cli>\u003cstrong>일본 최고재는 광범성을 이유로 법령을 무효로 한 예가 사실상 없다.\u003c/strong> 広島市暴走族追放条例事件처럼 \u003cstrong>합헌한정해석으로 구제\u003c/strong>하는 것이 패턴. 「최고재는 과도한 광범성의 법리에 따라 조례를 무효로 했다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>「한정해석을 하면 언제나 합헌이 된다」는 것도 오답. 税関検査事件의 요건(\u003cstrong>규제 대상과 비대상의 명확한 구별 + 합헌적으로 규제 가능한 것만 대상이 됨이 명백\u003c/strong>)을 충족해야 한다.\u003c/li>\u003cli>広島市暴走族追放条例事件은 \u003cstrong>3 대 2의 아슬아슬한 판단\u003c/strong>으로, 반대의견(한정해석이 조례의 문언을 지나치게 벗어난다는 비판)이 붙어 있다. 「전원일치의 합헌 판단」이라고 단정하는 지문에 주의.\u003c/li>\u003c/ul>","search":"過度の広汎性の法理 かどのこうはんせいのほうり 항목 내용 ------ ------ 읽기 かどのこうはんせいのほうり（과도한 광범성의 법리） 과목 헌법（표현의 자유 — 21조·31조） 한줄 정의 규제의 범위가 지나치게 넓어 합헌적으로 규제할 수 있는 표현을 넘어 규제해서는 안 될 표현까지 삼켜 버리는 법령은, 당해 사안에서의 적용 결과를 묻지 않고 문면상 무효 가 된다는 법리 통설·판례 미국 판례법 overbreadth doctrine 유래. 최고재는 이 법리를 정면으로 적용해 법령을 무효로 하기보다 합헌한정해석 으로 구제하는 태도 개념 어떤 법령의 문언이 명확하더라도, 그 명확한 경계선이 너무 넓은 곳에 그어져 있을 수 있다. 예컨대 「공공장소에서의 모든 집회를 금지한다」는 규정은 무엇이 금지되는지 아주 명확하지만, 그 안에는 헌법상 당연히 보호되어야 할 집회가 대량으로 들어와 있다. 이런 법령을 개별 사안마다 「이 사람에게 적용한 것은 위헌」이라고 잘라 내는 방식 적용위헌 으로만 처리하면, 법령이 살아 있는 한 다른 사람들은 계속 겁을 먹고 표현을 접는다. 그 萎縮的効果 용어/萎縮的効果.md 를 단번에 제거하기 위해, 법령 자체를 문면상 무효 로 선언한다는 것이 이 법리다. 그 결과 이 법리에서는 소송법상의 예외가 인정된다. 자기 행위에 대해서는 합헌적으로 규제될 수 있는 자라도 법령이 광범하다는 이유로 그 무효를 주장할 수 있다 제3자의 권리 원용 . 통상의 위헌 주장 적격 법리에 대한 예외라는 점이 시험에서 다루어진다. 明確性の原則 용어/明確性の原則.md 과의 관계는 반드시 정리해 두어야 한다. 둘은 모두 萎縮的効果 용어/萎縮的効果.md 를 이유로 문면심사 를 정당화하지만, 결함의 소재가 다르다. 明確性の原則 용어/明確性の原則.md 過度の広汎性の法理 --- --- --- 결함 경계선이 흐릿 하다（どこまでが規制対象か読み取れない） 경계선은 읽히지만 그것이 너무 넓다 （読み取れるが範囲が広すぎる） 문제 조문 31조 （적정절차·형벌법규의 명확성）, 표현규제면 21조도 21조 （실체적으로 규제할 수 없는 표현까지 규제） 성질 형식적 결함（문언의 불명확） 실체적 결함（규제 범위의 과대） 판단 방법 통상의 판단능력을 가진 일반인이 기준을 읽어낼 수 있는가 합헌적으로 규제할 수 있는 부분을 넘는 규제가 포함되어 있는가 공통점 둘 다 문면상 무효 의 근거, 둘 다 제3자의 권리 원용 을 허용 〃 일본 최고재의 실제 태도는 소극적이다. 광범해 보이는 규정도 합헌한정해석 을 가해 「그렇게 넓게 읽지 않으면 된다」며 합헌으로 처리해 왔다. 다만 표현규제에 대한 한정해석에는 税関検査事件이 제시한 조건이 붙는다 — 그 해석에 의해 규제 대상과 비대상이 명확히 구별 되고, 합헌적으로 규제할 수 있는 것만이 규제 대상이 됨이 명백 해져야 한다. 결국 광범성 문제를 한정해석으로 푸는 순간, 그 해석이 명확성 요건을 만족하는지가 다시 검토되는 구조다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 広島市暴走族追放条例事件 最三小判平19.9.18 / 刑集61巻6号601頁 조례가 문언상 「누구든지」의 집합·집회에 적용될 듯 규정되어 규제 범위가 광범 합헌 . 폭주족 및 사회통념상 이와 동일시할 수 있는 집단 에만 적용된다고 합헌한정해석 → 21조 1항·31조 위반 아님（광범성이 정면으로 다루어진 대표례） 税関検査事件（札幌税関検査事件） 最大判昭59.12.12 / 民集38巻12号1308頁 「풍속을 해할 서적·도화」의 광범·불명확성 합헌 . 「음란한 것」으로 한정해석. 아울러 표현규제 법령의 한정해석이 허용되는 요건 을 제시 福岡県青少年保護育成条例事件 最大判昭60.10.23 / 刑集39巻6号413頁 「음행」이 청소년과의 성행위 일반을 포괄할 만큼 광범한가 합헌 . 부당한 수단에 의한 것 등으로 한정해석 （광범성을 해석으로 좁힌 전형） 徳島市公安条例事件 最大判昭50.9.10 / 刑集29巻8号489頁 「교통질서를 유지할 것」 합헌 . 명확성 정식의 원조이자, 한정해석으로 규제 범위를 좁힌 예 💡 수험 팁 - 대비의 핵심 한 줄: 明確性 = 「어디까지인지 안 보인다」, 過度の広汎性 = 「보이는데 너무 넓다」. 이 한 줄만 정확히 잡으면 대부분의 지문이 풀린다. - 조문 대응도 짝으로: 明確性 → 31조 형벌법규 , 過度の広汎性 → 21조 실체적 과잉규제 . 다만 표현규제에서는 둘이 겹쳐 함께 주장되는 일이 많다. - 공통점을 묻는 문제 에 주의: 둘 다 문면상 무효 의 법리이고, 둘 다 자신에게는 합헌적으로 적용될 수 있는 자의 위헌 주장 제3자의 권리 원용 을 허용한다. - 일본 최고재는 광범성을 이유로 법령을 무효로 한 예가 사실상 없다. 広島市暴走族追放条例事件처럼 합헌한정해석으로 구제 하는 것이 패턴. 「최고재는 과도한 광범성의 법리에 따라 조례를 무효로 했다」는 지문은 오답 . - 「한정해석을 하면 언제나 합헌이 된다」는 것도 오답. 税関検査事件의 요건 규제 대상과 비대상의 명확한 구별 + 합헌적으로 규제 가능한 것만 대상이 됨이 명백 을 충족해야 한다. - 広島市暴走族追放条例事件은 3 대 2의 아슬아슬한 판단 으로, 반대의견 한정해석이 조례의 문언을 지나치게 벗어난다는 비판 이 붙어 있다. 「전원일치의 합헌 판단」이라고 단정하는 지문에 주의."},"検閲":{"type":"term","subject":"용어","id":"検閲","title":"検閲","sub":"けんえつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>けんえつ（검열）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>행정권(行政権)\u003c/strong>이 주체가 되어 사상 내용 등의 표현물을 대상으로, \u003cstrong>발표 전\u003c/strong>에 그 내용을 망라적·일반적으로 심사한 뒤 부적당하다고 인정되는 것의 발표를 금지하는 것\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>헌법 21조 2항 전단에 의해 \u003cstrong>절대적 금지\u003c/strong>(공공복지에 의한 예외조차 인정되지 않음). 최고재는 그 대신 검열의 정의를 \u003cstrong>매우 좁게\u003c/strong> 잡았고, 지금까지 검열에 해당한다고 인정한 사례는 \u003cstrong>하나도 없다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>일본국헌법 \u003cstrong>21조 1항\u003c/strong>이 표현의 자유 일반을 보장하는 것과 별도로, \u003cstrong>21조 2항\u003c/strong> 전단은 「検閲は、これをしてはならない」라고 규정한다(같은 항 후단은 통신의 비밀). 21조 1항의 표현의 자유가 「公共の福祉」에 의한 제약을 받는 것과 달리, 검열 금지에는 \u003cstrong>어떠한 예외도 없다\u003c/strong>는 것이 통설·판례다. 전쟁 전 出版法·新聞紙法 아래에서 내무성이 행하던 사전 검열에 대한 반성이 그 배경이다.\u003c/p>\n\u003cp>최고재는 \u003cstrong>札幌税関検査事件（最大判昭59.12.12）\u003c/strong>에서 검열의 정의를 다음과 같이 확립했다.\u003c/p>\n\u003cblockquote>行政権が主体となつて、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止すること\u003c/blockquote>\n\u003cp>여기서 검열의 요건은 네 가지로 분해되며, \u003cstrong>하나라도 빠지면 검열이 아니다\u003c/strong>.\u003c/p>\n\u003col>\u003cli>\u003cstrong>주체\u003c/strong> = 行政権（재판소·입법부는 제외. 법원의 가처분은 정의상 검열이 아님）\u003c/li>\u003cli>\u003cstrong>대상\u003c/strong> = 思想内容等の表現物\u003c/li>\u003cli>\u003cstrong>목적\u003c/strong> = 그 전부 또는 일부의 \u003cstrong>발표 금지\u003c/strong>를 목적으로 할 것\u003c/li>\u003cli>\u003cstrong>시기·방법\u003c/strong> = \u003cstrong>발표 전\u003c/strong>에, \u003cstrong>망라적·일반적\u003c/strong>으로 내용을 심사할 것\u003c/li>\u003c/ol>\n\u003cp>절대적 금지라는 강한 효과를 붙인 대가로 개념을 좁힌 구조이므로, 실제 사건에서는 언제나 「검열에는 해당하지 않는다」는 결론이 나오고, 대신 보다 넓은 \u003cstrong>\u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>\u003c/strong> 법리(원칙 금지·예외 허용)로 위헌 여부를 심사하게 된다. 검열과 사전억제의 관계를 「원 안의 원」으로 기억하면 좋다.\u003c/p>\n\u003cp>\u003cstrong>대비: 検閲 ↔ \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>検閲\u003c/th>\u003cth>事前抑制\u003c/th>\u003c/tr>\u003ctr>\u003ctd>근거 조문\u003c/td>\u003ctd>21조 \u003cstrong>2항\u003c/strong>\u003c/td>\u003ctd>21조 \u003cstrong>1항\u003c/strong>(2항의 취지 참조)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주체\u003c/td>\u003ctd>\u003cstrong>行政権\u003c/strong>에 한정\u003c/td>\u003ctd>\u003cstrong>공권력 일반\u003c/strong>(재판소 포함)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>범위\u003c/td>\u003ctd>망라적·일반적 심사\u003c/td>\u003ctd>개별적 억제도 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효과\u003c/td>\u003ctd>\u003cstrong>절대적 금지\u003c/strong>(예외 없음)\u003c/td>\u003ctd>\u003cstrong>원칙 금지·예외적 허용\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>협의설（최고재 판례）\u003c/strong>\u003c/td>\u003ctd>주체를 \u003cstrong>行政権\u003c/strong>에 한정하고, 「발표 전」의 「망라적·일반적」 심사만을 검열로 봄\u003c/td>\u003ctd>👉 \u003cstrong>판례\u003c/strong>. 절대적 금지이므로 정의를 좁게 설정. 결과적으로 검열 인정례 0건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>광의설（유력 학설）\u003c/td>\u003ctd>검열의 주체를 \u003cstrong>공권력 일반\u003c/strong>으로 넓게 파악하고, 재판소에 의한 사전 차지도 검열 문제로 다룸\u003c/td>\u003ctd>정의를 넓히는 대신 절대적 금지의 범위를 조정하려는 입장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>札幌税関検査事件（삿포로 세관검사 사건）\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>수입 영화·서적이 관세정률법의 「風俗を害すべき書籍、図画」에 해당한다는 세관장 통지\u003c/td>\u003ctd>\u003cstrong>검열 아님·합헌\u003c/strong>. ① 국외에서 \u003cstrong>이미 발표를 마친\u003c/strong> 표현물이어서 발표 기회가 전면 박탈되지 않고 ② 사상 내용 자체를 망라적으로 심사·규제하려는 것이 아니며 ③ 세관장의 통지에 \u003cstrong>사법심사의 기회\u003c/strong>가 있어 행정권의 판단이 최종적이지 않다. \u003cstrong>검열의 정의를 확립한 리딩 케이스\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第一次家永教科書訴訟（제1차 이에나가 교과서 소송）\u003c/td>\u003ctd>最三小判平5.3.16 / 民集47巻5号3483頁\u003c/td>\u003ctd>문부대신의 교과서 검정 불합격 처분\u003c/td>\u003ctd>\u003cstrong>검열 아님·합헌\u003c/strong>. 검정에 불합격해도 \u003cstrong>일반 도서로는 출판할 수 있으므로\u003c/strong> 「발표 금지를 목적으로」 한 것이 아니다. 사전억제로서도 합리적·필요한 제한이며 학문의 자유(23조)에도 반하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件（북방저널 사건）\u003c/td>\u003ctd>最大判昭61.6.11 / 民集40巻4号872頁\u003c/td>\u003ctd>지사 후보 비판 기사에 대한 법원의 출판 사전 차지 가처분\u003c/td>\u003ctd>\u003cstrong>검열 아님\u003c/strong>(주체가 \u003cstrong>재판소\u003c/strong>이므로 정의상 제외). 다만 사전억제에 해당하므로 엄격한 요건 아래에서만 허용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>岐阜県青少年保護育成条例事件（기후현 청소년보호육성조례 사건）\u003c/td>\u003ctd>最三小判平1.9.19\u003c/td>\u003ctd>「有害図書」의 자동판매기 수납 금지\u003c/td>\u003ctd>\u003cstrong>검열 아님·합헌\u003c/strong>. 지정이 발표 자체를 금지하는 것이 아니라 판매 방법을 제한하는 데 그침\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「검열의 주체는 공권력이다」는 지문은 오답.\u003c/strong> 최고재의 정의는 \u003cstrong>행정권\u003c/strong>에 한정된다. 따라서 \u003cstrong>재판소의 사전 차지는 어떤 경우에도 검열이 아니다\u003c/strong>(北方ジャーナル).\u003c/li>\u003cli>\u003cstrong>검열 금지에는 「公共の福祉」에 의한 예외가 없다.\u003c/strong> 「공공복지를 위해 필요한 검열은 허용된다」는 지문은 무조건 오답. 대신 \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>는 예외가 있다.\u003c/li>\u003cli>\u003cstrong>최고재가 검열을 인정한 판례는 아직 없다.\u003c/strong> 税関検査·教科書検定·有害図書指定 모두 「검열이 아님」. 「〜은 검열에 해당하여 위헌」이라는 지문이 보이면 일단 의심하라.\u003c/li>\u003cli>부정 이유를 사건별로 짝지어 암기: \u003cstrong>税関検査 = 이미 국외에서 발표됨\u003c/strong> / \u003cstrong>教科書検定 = 일반 도서로는 출판 가능\u003c/strong> / \u003cstrong>裁判所の差止め = 주체가 행정권이 아님\u003c/strong>.\u003c/li>\u003cli>21조 2항은 검열 금지와 \u003cstrong>통신의 비밀\u003c/strong>을 함께 규정한다. 조문 위치를 묻는 문제(「검열 금지는 21조 1항이다」→ 오답)에 주의.\u003c/li>\u003c/ul>","search":"検閲 けんえつ 항목 내용 ------ ------ 읽기 けんえつ（검열） 과목 헌법（표현의 자유） 한줄 정의 행정권 行政権 이 주체가 되어 사상 내용 등의 표현물을 대상으로, 발표 전 에 그 내용을 망라적·일반적으로 심사한 뒤 부적당하다고 인정되는 것의 발표를 금지하는 것 통설·판례 헌법 21조 2항 전단에 의해 절대적 금지 공공복지에 의한 예외조차 인정되지 않음 . 최고재는 그 대신 검열의 정의를 매우 좁게 잡았고, 지금까지 검열에 해당한다고 인정한 사례는 하나도 없다 개념 일본국헌법 21조 1항 이 표현의 자유 일반을 보장하는 것과 별도로, 21조 2항 전단은 「検閲は、これをしてはならない」라고 규정한다 같은 항 후단은 통신의 비밀 . 21조 1항의 표현의 자유가 「公共の福祉」에 의한 제약을 받는 것과 달리, 검열 금지에는 어떠한 예외도 없다 는 것이 통설·판례다. 전쟁 전 出版法·新聞紙法 아래에서 내무성이 행하던 사전 검열에 대한 반성이 그 배경이다. 최고재는 札幌税関検査事件（最大判昭59.12.12） 에서 검열의 정의를 다음과 같이 확립했다. 行政権が主体となつて、思想内容等の表現物を対象とし、その全部又は一部の発表の禁止を目的として、対象とされる一定の表現物につき網羅的一般的に、発表前にその内容を審査した上、不適当と認めるものの発表を禁止すること 여기서 검열의 요건은 네 가지로 분해되며, 하나라도 빠지면 검열이 아니다 . 1. 주체 = 行政権（재판소·입법부는 제외. 법원의 가처분은 정의상 검열이 아님） 2. 대상 = 思想内容等の表現物 3. 목적 = 그 전부 또는 일부의 발표 금지 를 목적으로 할 것 4. 시기·방법 = 발표 전 에, 망라적·일반적 으로 내용을 심사할 것 절대적 금지라는 강한 효과를 붙인 대가로 개념을 좁힌 구조이므로, 실제 사건에서는 언제나 「검열에는 해당하지 않는다」는 결론이 나오고, 대신 보다 넓은 事前抑制 용어/事前抑制.md 법리 원칙 금지·예외 허용 로 위헌 여부를 심사하게 된다. 검열과 사전억제의 관계를 「원 안의 원」으로 기억하면 좋다. 대비: 検閲 ↔ 事前抑制 용어/事前抑制.md 구분 検閲 事前抑制 ------ ------ ---------- 근거 조문 21조 2항 21조 1항 2항의 취지 참조 주체 行政権 에 한정 공권력 일반 재판소 포함 범위 망라적·일반적 심사 개별적 억제도 포함 효과 절대적 금지 예외 없음 원칙 금지·예외적 허용 학설 학설 내용 비고 ------ ------ ------ 협의설（최고재 판례） 주체를 行政権 에 한정하고, 「발표 전」의 「망라적·일반적」 심사만을 검열로 봄 👉 판례 . 절대적 금지이므로 정의를 좁게 설정. 결과적으로 검열 인정례 0건 광의설（유력 학설） 검열의 주체를 공권력 일반 으로 넓게 파악하고, 재판소에 의한 사전 차지도 검열 문제로 다룸 정의를 넓히는 대신 절대적 금지의 범위를 조정하려는 입장 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 札幌税関検査事件（삿포로 세관검사 사건） 最大判昭59.12.12 / 民集38巻12号1308頁 수입 영화·서적이 관세정률법의 「風俗を害すべき書籍、図画」에 해당한다는 세관장 통지 검열 아님·합헌 . ① 국외에서 이미 발표를 마친 표현물이어서 발표 기회가 전면 박탈되지 않고 ② 사상 내용 자체를 망라적으로 심사·규제하려는 것이 아니며 ③ 세관장의 통지에 사법심사의 기회 가 있어 행정권의 판단이 최종적이지 않다. 검열의 정의를 확립한 리딩 케이스 第一次家永教科書訴訟（제1차 이에나가 교과서 소송） 最三小判平5.3.16 / 民集47巻5号3483頁 문부대신의 교과서 검정 불합격 처분 검열 아님·합헌 . 검정에 불합격해도 일반 도서로는 출판할 수 있으므로 「발표 금지를 목적으로」 한 것이 아니다. 사전억제로서도 합리적·필요한 제한이며 학문의 자유 23조 에도 반하지 않음 北方ジャーナル事件（북방저널 사건） 最大判昭61.6.11 / 民集40巻4号872頁 지사 후보 비판 기사에 대한 법원의 출판 사전 차지 가처분 검열 아님 주체가 재판소 이므로 정의상 제외 . 다만 사전억제에 해당하므로 엄격한 요건 아래에서만 허용 岐阜県青少年保護育成条例事件（기후현 청소년보호육성조례 사건） 最三小判平1.9.19 「有害図書」의 자동판매기 수납 금지 검열 아님·합헌 . 지정이 발표 자체를 금지하는 것이 아니라 판매 방법을 제한하는 데 그침 💡 수험 팁 - 「검열의 주체는 공권력이다」는 지문은 오답. 최고재의 정의는 행정권 에 한정된다. 따라서 재판소의 사전 차지는 어떤 경우에도 검열이 아니다 北方ジャーナル . - 검열 금지에는 「公共の福祉」에 의한 예외가 없다. 「공공복지를 위해 필요한 검열은 허용된다」는 지문은 무조건 오답. 대신 事前抑制 용어/事前抑制.md 는 예외가 있다. - 최고재가 검열을 인정한 판례는 아직 없다. 税関検査·教科書検定·有害図書指定 모두 「검열이 아님」. 「〜은 검열에 해당하여 위헌」이라는 지문이 보이면 일단 의심하라. - 부정 이유를 사건별로 짝지어 암기: 税関検査 = 이미 국외에서 발표됨 / 教科書検定 = 일반 도서로는 출판 가능 / 裁判所の差止め = 주체가 행정권이 아님 . - 21조 2항은 검열 금지와 통신의 비밀 을 함께 규정한다. 조문 위치를 묻는 문제 「검열 금지는 21조 1항이다」→ 오답 에 주의."},"事前抑制":{"type":"term","subject":"용어","id":"事前抑制","title":"事前抑制","sub":"じぜんよくせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>じぜんよくせい（사전 억제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>표현물이 사상의 자유시장에 나오기 \u003cstrong>전\u003c/strong>에 공권력이 그 표현을 억제하는 것\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>원칙적으로 금지\u003c/strong>되지만, \u003cstrong>엄격하고 명확한 요건\u003c/strong> 아래에서는 예외적으로 허용된다（北方ジャーナル事件）. \u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">検閲\u003c/a>의 절대적 금지와는 다르다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>사전 억제란 표현이 세상에 나오기 전에 공권력이 이를 막는 것을 말한다. 헌법에 명문 규정은 없고, \u003cstrong>21조 1항\u003c/strong>의 표현의 자유와 \u003cstrong>21조 2항\u003c/strong>의 검열 금지의 취지로부터 도출되는 법리다.\u003c/p>\n\u003cp>\u003cstrong>北方ジャーナル事件（最大判昭61.6.11）\u003c/strong>은 사전 억제가 사후 제재보다 위험한 이유를 이렇게 설명한다. 표현물이 「その自由市場に出る前に抑止してその内容を読者ないし聴視者の側に到達させる途を閉ざし」기 때문에 ① 공적 비판의 기회가 사라지고 ② 규제가 사후 제재보다 \u003cstrong>광범위해지기 쉬우며\u003c/strong> ③ 남용의 우려가 있고 ④ 실제 억지 효과도 크다. 그래서 사전 억제는 「表現の自由を保障し検閲を禁止する憲法21条の趣旨に照らし、\u003cstrong>厳格かつ明確な要件のもとにおいてのみ許容されうる\u003c/strong>」고 판시했다.\u003c/p>\n\u003cp>여기서 핵심은 \u003cstrong>\u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">検閲\u003c/a>보다 넓은 개념\u003c/strong>이라는 점이다. 검열은 주체가 행정권에 한정되고 절대적으로 금지되지만, 사전 억제는 \u003cstrong>재판소의 가처분에 의한 출판 차지\u003c/strong>처럼 사법권이 행하는 것도 포함하며, 절대 금지가 아니라 \u003cstrong>원칙 금지·예외 허용\u003c/strong>이다. 실제 사건에서는 「검열에는 해당하지 않는다 → 그러나 사전 억제이므로 엄격한 요건으로 심사한다」는 2단 구성으로 논의가 진행된다.\u003c/p>\n\u003cp>\u003cstrong>北方ジャーナル事件이 제시한 예외적 허용 요건\u003c/strong>(공무원 또는 공직선거 후보자에 대한 평가·비판 등에 관한 출판물의 사전 차지)은 다음과 같다. 사전 차지는 \u003cstrong>원칙적으로 허용되지 않으며\u003c/strong>, 아래 두 요건을 \u003cstrong>모두\u003c/strong> 충족할 때에 한해 예외적으로 허용된다.\u003c/p>\n\u003col>\u003cli>그 \u003cstrong>표현 내용이 진실이 아니거나\u003c/strong>, 또는 \u003cstrong>오로지 공익을 도모할 목적의 것이 아님이 명백\u003c/strong>할 것\u003c/li>\u003cli>피해자가 \u003cstrong>중대하고 현저히 회복 곤란한 손해\u003c/strong>를 입을 우려가 있을 것\u003c/li>\u003c/ol>\n\u003cp>절차 면에서도 판시가 있다. 공공의 이해에 관한 사항에 대한 표현행위의 사전 차지를 가처분으로 명할 때에는 \u003cstrong>원칙적으로 구두변론 또는 채무자 심문(債務者の審尋)을 거쳐야\u003c/strong> 한다. 다만 채권자가 제출한 자료로 위 실체 요건이 명백히 인정되는 때에는 심문을 거치지 않아도 헌법 21조의 취지에 반하지 않는다.\u003c/p>\n\u003cp>\u003cstrong>대비: \u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">検閲\u003c/a> ↔ 事前抑制\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>検閲\u003c/th>\u003cth>事前抑制\u003c/th>\u003c/tr>\u003ctr>\u003ctd>주체\u003c/td>\u003ctd>\u003cstrong>行政権\u003c/strong>에 한정\u003c/td>\u003ctd>\u003cstrong>공권력 일반\u003c/strong>(재판소 포함)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>방식\u003c/td>\u003ctd>망라적·일반적 심사\u003c/td>\u003ctd>개별적 억제도 포함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효과\u003c/td>\u003ctd>\u003cstrong>절대적 금지\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>원칙 금지·예외 허용\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 판례\u003c/td>\u003ctd>税関検査事件\u003c/td>\u003ctd>\u003cstrong>北方ジャーナル事件\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件（북방저널 사건）\u003c/td>\u003ctd>最大判昭61.6.11 / 民集40巻4号872頁\u003c/td>\u003ctd>홋카이도 지사 선거 입후보 예정자를 비판하는 잡지 기사에 대해, 인격권(명예권)을 근거로 법원이 인쇄·판매 금지 가처분을 발령\u003c/td>\u003ctd>\u003cstrong>검열 아님\u003c/strong>(주체가 재판소). 사전 억제는 원칙 금지이나 \u003cstrong>① 내용이 진실이 아니거나 오로지 공익 목적이 아님이 명백하고 ② 중대·현저히 회복 곤란한 손해의 우려\u003c/strong>가 있으면 예외적으로 허용 → 본건 가처분은 \u003cstrong>적법\u003c/strong>. \u003cstrong>인격권에 기한 차지청구권\u003c/strong>을 인정한 리딩 케이스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>札幌税関検査事件（삿포로 세관검사 사건）\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>수입 서적·영화에 대한 세관검사\u003c/td>\u003ctd>\u003cstrong>검열 아님·합헌\u003c/strong>. 국외에서 \u003cstrong>이미 발표를 마친\u003c/strong> 표현물이므로 발표 기회가 전면 박탈되지 않는다는 점이 결정적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第一次家永教科書訴訟（제1차 이에나가 교과서 소송）\u003c/td>\u003ctd>最三小判平5.3.16 / 民集47巻5号3483頁\u003c/td>\u003ctd>교과서 검정 불합격\u003c/td>\u003ctd>\u003cstrong>검열 아님·합헌\u003c/strong>. 사전 억제로서도 합리적이고 필요한 제한\u003c/td>\u003c/tr>\u003ctr>\u003ctd>「石に泳ぐ魚」事件（「돌에서 헤엄치는 물고기」 사건）\u003c/td>\u003ctd>最三小判平14.9.24\u003c/td>\u003ctd>모델이 된 실재 인물의 프라이버시·명예를 침해하는 소설의 출판 차지 청구\u003c/td>\u003ctd>\u003cstrong>차지 인용\u003c/strong>. 피해자의 사회적 지위·피해의 성질과 피고 측 불이익을 비교형량하여, 사후 회복이 곤란한 중대한 침해가 예상되면 출판 차지가 가능하다고 판시. \u003cstrong>사전 억제가 실제로 인정된 드문 예\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「사전 억제는 절대적으로 금지된다」는 지문은 오답.\u003c/strong> 절대적 금지는 \u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">検閲\u003c/a>뿐이고, 사전 억제는 \u003cstrong>원칙 금지·예외 허용\u003c/strong>이다. 이 둘을 바꿔 놓은 지문이 최다 빈출.\u003c/li>\u003cli>北方ジャーナル의 예외 요건은 \u003cstrong>「진실이 아님 or 오로지 공익 목적이 아님이 \u003c/strong>명백\u003cstrong>」 + 「중대하고 현저히 회복 곤란한 손해」\u003c/strong> — 두 요건을 \u003cstrong>모두\u003c/strong>(かつ) 충족해야 한다. 「어느 하나라도 충족하면」이라는 지문은 오답.\u003c/li>\u003cli>「\u003cstrong>명백\u003c/strong>であって」라는 문언이 핵심. 「진실이 아닐 우려가 있으면」 정도로 낮춰 쓴 지문은 오답.\u003c/li>\u003cli>절차 요건도 출제된다: \u003cstrong>원칙적으로 구두변론 또는 채무자 심문 필요\u003c/strong>, 다만 실체 요건이 자료상 명백하면 심문 없이도 가능.\u003c/li>\u003cli>北方ジャーナル은 \u003cstrong>인격권에 기한 차지청구권을 인정\u003c/strong>했다는 점에서도 중요. 「법률에 명문 규정이 없으므로 차지청구는 인정되지 않는다」는 지문은 오답.\u003c/li>\u003cli>「검열이 아니면 곧 합헌」이 아니다. 검열 부정 → \u003cstrong>사전 억제 법리로 다시 엄격 심사\u003c/strong>라는 2단 구성을 기억하라.\u003c/li>\u003c/ul>","search":"事前抑制 じぜんよくせい 항목 내용 ------ ------ 읽기 じぜんよくせい（사전 억제） 과목 헌법（표현의 자유） 한줄 정의 표현물이 사상의 자유시장에 나오기 전 에 공권력이 그 표현을 억제하는 것 통설·판례 원칙적으로 금지 되지만, 엄격하고 명확한 요건 아래에서는 예외적으로 허용된다（北方ジャーナル事件）. 検閲 용어/検閲.md 의 절대적 금지와는 다르다 개념 사전 억제란 표현이 세상에 나오기 전에 공권력이 이를 막는 것을 말한다. 헌법에 명문 규정은 없고, 21조 1항 의 표현의 자유와 21조 2항 의 검열 금지의 취지로부터 도출되는 법리다. 北方ジャーナル事件（最大判昭61.6.11） 은 사전 억제가 사후 제재보다 위험한 이유를 이렇게 설명한다. 표현물이 「その自由市場に出る前に抑止してその内容を読者ないし聴視者の側に到達させる途を閉ざし」기 때문에 ① 공적 비판의 기회가 사라지고 ② 규제가 사후 제재보다 광범위해지기 쉬우며 ③ 남용의 우려가 있고 ④ 실제 억지 효과도 크다. 그래서 사전 억제는 「表現の自由を保障し検閲を禁止する憲法21条の趣旨に照らし、 厳格かつ明確な要件のもとにおいてのみ許容されうる 」고 판시했다. 여기서 핵심은 検閲 용어/検閲.md 보다 넓은 개념 이라는 점이다. 검열은 주체가 행정권에 한정되고 절대적으로 금지되지만, 사전 억제는 재판소의 가처분에 의한 출판 차지 처럼 사법권이 행하는 것도 포함하며, 절대 금지가 아니라 원칙 금지·예외 허용 이다. 실제 사건에서는 「검열에는 해당하지 않는다 → 그러나 사전 억제이므로 엄격한 요건으로 심사한다」는 2단 구성으로 논의가 진행된다. 北方ジャーナル事件이 제시한 예외적 허용 요건 공무원 또는 공직선거 후보자에 대한 평가·비판 등에 관한 출판물의 사전 차지 은 다음과 같다. 사전 차지는 원칙적으로 허용되지 않으며 , 아래 두 요건을 모두 충족할 때에 한해 예외적으로 허용된다. 1. 그 표현 내용이 진실이 아니거나 , 또는 오로지 공익을 도모할 목적의 것이 아님이 명백 할 것 2. 피해자가 중대하고 현저히 회복 곤란한 손해 를 입을 우려가 있을 것 절차 면에서도 판시가 있다. 공공의 이해에 관한 사항에 대한 표현행위의 사전 차지를 가처분으로 명할 때에는 원칙적으로 구두변론 또는 채무자 심문 債務者の審尋 을 거쳐야 한다. 다만 채권자가 제출한 자료로 위 실체 요건이 명백히 인정되는 때에는 심문을 거치지 않아도 헌법 21조의 취지에 반하지 않는다. 대비: 検閲 용어/検閲.md ↔ 事前抑制 구분 検閲 事前抑制 ------ ------ ---------- 주체 行政権 에 한정 공권력 일반 재판소 포함 방식 망라적·일반적 심사 개별적 억제도 포함 효과 절대적 금지 원칙 금지·예외 허용 대표 판례 税関検査事件 北方ジャーナル事件 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 北方ジャーナル事件（북방저널 사건） 最大判昭61.6.11 / 民集40巻4号872頁 홋카이도 지사 선거 입후보 예정자를 비판하는 잡지 기사에 대해, 인격권 명예권 을 근거로 법원이 인쇄·판매 금지 가처분을 발령 검열 아님 주체가 재판소 . 사전 억제는 원칙 금지이나 ① 내용이 진실이 아니거나 오로지 공익 목적이 아님이 명백하고 ② 중대·현저히 회복 곤란한 손해의 우려 가 있으면 예외적으로 허용 → 본건 가처분은 적법 . 인격권에 기한 차지청구권 을 인정한 리딩 케이스 札幌税関検査事件（삿포로 세관검사 사건） 最大判昭59.12.12 / 民集38巻12号1308頁 수입 서적·영화에 대한 세관검사 검열 아님·합헌 . 국외에서 이미 발표를 마친 표현물이므로 발표 기회가 전면 박탈되지 않는다는 점이 결정적 第一次家永教科書訴訟（제1차 이에나가 교과서 소송） 最三小判平5.3.16 / 民集47巻5号3483頁 교과서 검정 불합격 검열 아님·합헌 . 사전 억제로서도 합리적이고 필요한 제한 「石に泳ぐ魚」事件（「돌에서 헤엄치는 물고기」 사건） 最三小判平14.9.24 모델이 된 실재 인물의 프라이버시·명예를 침해하는 소설의 출판 차지 청구 차지 인용 . 피해자의 사회적 지위·피해의 성질과 피고 측 불이익을 비교형량하여, 사후 회복이 곤란한 중대한 침해가 예상되면 출판 차지가 가능하다고 판시. 사전 억제가 실제로 인정된 드문 예 💡 수험 팁 - 「사전 억제는 절대적으로 금지된다」는 지문은 오답. 절대적 금지는 検閲 용어/検閲.md 뿐이고, 사전 억제는 원칙 금지·예외 허용 이다. 이 둘을 바꿔 놓은 지문이 최다 빈출. - 北方ジャーナル의 예외 요건은 「진실이 아님 or 오로지 공익 목적이 아님이 명백 」 + 「중대하고 현저히 회복 곤란한 손해」 — 두 요건을 모두 かつ 충족해야 한다. 「어느 하나라도 충족하면」이라는 지문은 오답. - 「 명백 であって」라는 문언이 핵심. 「진실이 아닐 우려가 있으면」 정도로 낮춰 쓴 지문은 오답. - 절차 요건도 출제된다: 원칙적으로 구두변론 또는 채무자 심문 필요 , 다만 실체 요건이 자료상 명백하면 심문 없이도 가능. - 北方ジャーナル은 인격권에 기한 차지청구권을 인정 했다는 점에서도 중요. 「법률에 명문 규정이 없으므로 차지청구는 인정되지 않는다」는 지문은 오답. - 「검열이 아니면 곧 합헌」이 아니다. 검열 부정 → 사전 억제 법리로 다시 엄격 심사 라는 2단 구성을 기억하라."},"表現内容規制":{"type":"term","subject":
