003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>暴利行為 사건\u003c/strong>（폭리행위의 요건을 정식화）\u003c/td>\u003ctd>大判昭9.5.1 / 民集13巻875頁\u003c/td>\u003ctd>금전소비대차에 부수하여, 변제하지 못하면 \u003cstrong>대여금의 5배에 달하는 채권을 몰수\u003c/strong>한다는 특약을 붙임\u003c/td>\u003ctd>\u003cstrong>주관적 요건(타인의 궁박·경솔·무경험의 이용) + 객관적 요건(현저히 과당한 이익의 취득)\u003c/strong>을 모두 충족 → \u003cstrong>민법 90조 위반으로 무효\u003c/strong>. 폭리행위 법리의 리딩 케이스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>芸娼妓契約事件\u003c/td>\u003ctd>最判昭30.10.7 / 民集9巻11号1616頁\u003c/td>\u003ctd>딸의 작부 취업계약과 부모에 대한 전차금 소비대차를 세트로 체결\u003c/td>\u003ctd>두 계약은 \u003cstrong>불가분 일체\u003c/strong>로서 전체가 90조 위반 무효, 나아가 전차금은 \u003cstrong>불법원인급여(708조)로 반환 청구도 불가\u003c/strong> → 궁박을 이용한 인신구속적 거래의 대표례\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>1순위 함정\u003c/strong>: 「폭리행위를 무효로 하는 \u003cstrong>명문 규정이 민법에 있다\u003c/strong>」 → \u003cstrong>오답\u003c/strong>. 근거는 \u003cstrong>90조 + 판례법리\u003c/strong>뿐이다.\u003c/li>\u003cli>\u003cstrong>2순위 함정\u003c/strong>: 「2020년 개정민법으로 폭리행위가 \u003cstrong>명문화되었다\u003c/strong>」 → \u003cstrong>오답\u003c/strong>. 중간시안에 안이 있었으나 \u003cstrong>견송\u003c/strong>되었다. 마찬가지로 견송된 것이 \u003cstrong>事情変更の法理·権利失効の原則\u003c/strong>（→ \u003ca href=\"#/e/%E4%BF%A1%E7%BE%A9%E8%AA%A0%E5%AE%9F%E3%81%AE%E5%8E%9F%E5%89%87\">信義誠実の原則\u003c/a>）이니 \u003cstrong>「명문화 견송 3종 세트」로 묶어 암기\u003c/strong>하라.\u003c/li>\u003cli>요건은 \u003cstrong>주관 + 객관의 양쪽이 모두 필요\u003c/strong>하다. 「대가가 현저히 불균형하면 그것만으로 폭리행위」라는 지문은 \u003cstrong>오답\u003c/strong>（객관적 요건만으로는 부족）.\u003c/li>\u003cli>「窮迫・軽率・無経験」 \u003cstrong>세 단어를 그대로 외워라\u003c/strong>. 大判昭9.5.1의 판시 문언이 그대로 지문에 쓰인다（참고로 한국 민법 104조 「불공정한 법률행위」는 「궁박·경솔 또는 무경험」을 \u003cstrong>명문\u003c/strong>으로 두고 있어 일본과 정반대다 — 한국법 감각으로 「조문이 있겠지」라고 넘기면 그대로 오답이 된다）.\u003c/li>\u003cli>\u003cstrong>효과 대비: 폭리행위(90조) = 無効 ↔ 소비자계약법 4조 = 取消し ↔ 이자제한법 = 초과분만 無効\u003c/strong>. 「폭리행위이므로 취소할 수 있다」는 지문은 함정.\u003c/li>\u003cli>\u003cstrong>대비: 暴利行為 ↔ \u003ca href=\"#/e/%E5%85%AC%E5%BA%8F%E8%89%AF%E4%BF%97\">公序良俗\u003c/a>\u003c/strong>. 폭리행위는 공서양속의 \u003cstrong>하위 유형\u003c/strong>이지 병렬 개념이 아니다. 「90조와 별개의 무효 원인」이라는 서술은 오답.\u003c/li>\u003c/ul>","search":"暴利行為 ぼうりこうい 항목 내용 ------ ------ 읽기 ぼうりこうい（폭리행위） 과목 민법（총칙 — 법률행위· 公序良俗 용어/公序良俗.md ） 한줄 정의 상대방의 궁박 窮迫 ·경솔 軽率 ·무경험 無経験 을 이용하여 현저히 과당한 이익을 얻는 법률행위 통설·판례 민법에 폭리행위를 정면으로 규정한 조문은 없다. 90조 공서양속 의 한 유형으로 무효가 된다는 판례법리 （大判昭9.5.1） 개념 폭리행위란 상대방이 처한 열악한 상황을 이용해 균형을 잃은 이익을 챙기는 거래 를 말한다. 대심원은 大判昭9.5.1에서 그 요건을 두 가지로 정식화했다. ① 주관적 요건 — 타인의 窮迫（궁박, 경제적·정신적으로 몰린 상태）·軽率（경솔）·無経験（무경험）을 이용할 것 , ② 객관적 요건 — 그 결과 현저히 과당한 이익을 얻는 것을 내용으로 할 것 . 두 요건이 모두 갖추어지면 그 법률행위는 公序良俗 용어/公序良俗.md 에 반하여 무효 가 된다. 시험의 최대 함정은 「조문의 유무」다. 폭리행위는 민법전에 명문 규정이 없다 . 근거 조문은 어디까지나 90조 이고, 폭리행위는 그 해석으로 형성된 판례법리 에 지나지 않는다. 「민법 ○조는 폭리행위를 무효로 한다」는 식의 지문이 나오면 조문 번호가 무엇이든 일단 의심해야 하며, 정답은 「90조의 공서양속 위반의 한 유형으로 무효」 다. 2020년 4월 시행 개정민법 기준의 포인트가 둘 있다. 첫째, 개정 논의 과정 중간시안 에서 폭리행위를 90조와 별도로 명문화하자는 안이 제시되었으나, 요건의 경직화와 남용 우려 등을 이유로 최종적으로 견송 見送り 되었다 . 따라서 개정 후에도 폭리행위 규정은 신설되지 않았다 . 「개정민법으로 폭리행위가 명문화되었다」는 지문은 오답 이다. 둘째, 그럼에도 개정 90조가 「 事項を目的とする 」라는 문언을 삭제 한 결과, 법률행위의 내용 뿐 아니라 체결 과정·상황 의 반사회성도 90조로 포섭됨이 조문상 분명해졌다. 폭리행위는 전형적으로 「과정」에 문제가 있는 유형이므로, 개정 90조의 문언 정비가 폭리행위 법리의 조문상 근거를 오히려 다지는 방향으로 작용했다 고 설명된다. 한편 폭리행위에 이르지 못하는 사안이라도 개인은 다른 수단으로 구제받을 수 있다. 소비자계약법 4조 부실고지·단정적 판단 제공·불퇴거·과량계약 등에 의한 취소 , 이자제한법 제한 초과 이자의 무효 , 할부판매법·특정상거래법의 클링오프 가 그것이다. 즉 폭리행위 무효 와 이들 특별법 취소·일부 무효 은 효과가 다른 별개의 트랙 이다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 暴利行為 사건 （폭리행위의 요건을 정식화） 大判昭9.5.1 / 民集13巻875頁 금전소비대차에 부수하여, 변제하지 못하면 대여금의 5배에 달하는 채권을 몰수 한다는 특약을 붙임 주관적 요건 타인의 궁박·경솔·무경험의 이용 + 객관적 요건 현저히 과당한 이익의 취득 을 모두 충족 → 민법 90조 위반으로 무효 . 폭리행위 법리의 리딩 케이스 芸娼妓契約事件 最判昭30.10.7 / 民集9巻11号1616頁 딸의 작부 취업계약과 부모에 대한 전차금 소비대차를 세트로 체결 두 계약은 불가분 일체 로서 전체가 90조 위반 무효, 나아가 전차금은 불법원인급여 708조 로 반환 청구도 불가 → 궁박을 이용한 인신구속적 거래의 대표례 💡 수험 팁 - 1순위 함정 : 「폭리행위를 무효로 하는 명문 규정이 민법에 있다 」 → 오답 . 근거는 90조 + 판례법리 뿐이다. - 2순위 함정 : 「2020년 개정민법으로 폭리행위가 명문화되었다 」 → 오답 . 중간시안에 안이 있었으나 견송 되었다. 마찬가지로 견송된 것이 事情変更の法理·権利失効の原則 （→ 信義誠実の原則 용어/信義誠実の原則.md ）이니 「명문화 견송 3종 세트」로 묶어 암기 하라. - 요건은 주관 + 객관의 양쪽이 모두 필요 하다. 「대가가 현저히 불균형하면 그것만으로 폭리행위」라는 지문은 오답 （객관적 요건만으로는 부족）. - 「窮迫・軽率・無経験」 세 단어를 그대로 외워라 . 大判昭9.5.1의 판시 문언이 그대로 지문에 쓰인다（참고로 한국 민법 104조 「불공정한 법률행위」는 「궁박·경솔 또는 무경험」을 명문 으로 두고 있어 일본과 정반대다 — 한국법 감각으로 「조문이 있겠지」라고 넘기면 그대로 오답이 된다）. - 효과 대비: 폭리행위 90조 = 無効 ↔ 소비자계약법 4조 = 取消し ↔ 이자제한법 = 초과분만 無効 . 「폭리행위이므로 취소할 수 있다」는 지문은 함정. - 대비: 暴利行為 ↔ 公序良俗 용어/公序良俗.md . 폭리행위는 공서양속의 하위 유형 이지 병렬 개념이 아니다. 「90조와 별개의 무효 원인」이라는 서술은 오답."},"意思能力":{"type":"term","subject":"용어","id":"意思能力","title":"意思能力","sub":"いしのうりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>いしのうりょく（의사능력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>자기 행위의 법적 결과를 판단할 수 있는 최소한의 정신능력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>의사능력을 결여한 상태에서 한 법률행위는 \u003cstrong>무효\u003c/strong>. 2020년 4월 시행 개정민법이 \u003cstrong>3조의2\u003c/strong>로 명문화（구법에는 조문이 없었고 판례·학설상 인정）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>의사능력(意思能力)\u003c/strong>이란 자기 행위의 결과가 어떤 의미를 갖는지를 변별·판단할 수 있는 정신적 능력을 말한다. 개정민법 \u003cstrong>3조의2\u003c/strong>는 「法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とする」라고 정하여, 의사무능력자의 법률행위가 \u003cstrong>무효\u003c/strong>임을 조문으로 확인하였다.\u003c/p>\n\u003cp>판단 기준은 \u003cstrong>연령이 아니라 행위 시점의 구체적 정신 상태\u003c/strong>다. 일률적인 나이 기준은 없고, 통설은 대체로 \u003cstrong>7~10세 정도의 판단력\u003c/strong>을 기준으로 하되, 문제된 법률행위의 복잡성·중대성에 따라 개별적으로 판단한다고 본다. 따라서 성년자라도 중증 치매·만취·혼수 상태에서 한 계약은 의사무능력으로 무효가 될 수 있고, 반대로 성년후견 심판을 받지 않았더라도 무효 주장이 가능하다.\u003c/p>\n\u003cp>\u003cstrong>대비: 意思能力 흠결 = 무효 / 行為能力 제한 = 취소.\u003c/strong> 행위능력(行為能力)은 「단독으로 유효한 법률행위를 할 수 있는 자격」을 획일적 기준(연령·가정법원의 심판)으로 정해 둔 제도이고, 그 제한을 위반한 행위는 \u003cstrong>취소할 수 있는 행위\u003c/strong>에 그친다(5조 2항, 9조, 13조 4항, 17조 4항). 취소에는 취소권자의 제한(120조)과 기간 제한(126조 — 추인할 수 있는 때부터 \u003cstrong>5년\u003c/strong>, 행위 시부터 \u003cstrong>20년\u003c/strong>)이 붙지만, 무효에는 이런 제한이 없다.\u003c/p>\n\u003cp>의사무능력으로 무효가 된 경우의 \u003cstrong>반환범위\u003c/strong>는 121조의2 3항에 따라 \u003cstrong>현존이익(現に利益を受けている限度)\u003c/strong>에 한정된다. 같은 항은 행위 시에 제한행위능력자였던 자에 대해서도 동일하게 규정하여, 두 제도의 보호 수준을 맞추고 있다. 이 조문 역시 2020년 개정으로 신설되었다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>절대적 무효설\u003c/td>\u003ctd>무효인 이상 누구든지, 언제든지 주장할 수 있다\u003c/td>\u003ctd>조문 문언에 충실\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>상대적 무효설\u003c/strong>\u003c/td>\u003ctd>의사무능력자 보호를 위한 무효이므로 \u003cstrong>표의자 측(본인·상속인 등)만\u003c/strong> 무효를 주장할 수 있다\u003c/td>\u003ctd>👉 다수설. 상대방이 무효를 주장해 계약에서 벗어나는 것을 막기 위함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「意思能力 = 무효 / 行為能力 제한 = 취소」\u003c/strong>의 짝이 최빈출. 「의사능력이 없는 자의 행위는 취소할 수 있다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>개정 전에는 3조의2가 없었다.\u003c/strong> 「구법에도 의사능력에 관한 명문 규정이 있었다」는 지문은 오답. 구법 하에서는 판례·통설로 무효 처리했다.\u003c/li>\u003cli>의사무능력과 제한행위능력은 \u003cstrong>양립 가능\u003c/strong>(이중효). 예컨대 성년피후견인이 의사무능력 상태에서 계약했다면 \u003cstrong>무효를 주장해도 되고 취소를 주장해도 된다\u003c/strong>. 무효 쪽이 기간 제한이 없어 유리한 경우가 많다.\u003c/li>\u003cli>반환범위는 의사무능력자·제한행위능력자 모두 \u003cstrong>현존이익 한도\u003c/strong>(121조의2 3항). 「받은 이익 전부를 반환해야 한다」는 지문은 오답.\u003c/li>\u003cli>의사능력의 유무는 \u003cstrong>의사표시를 한 시점\u003c/strong>을 기준으로 판단한다. 계약 후에 정신능력을 회복했는지 여부는 무효 판단과 무관하다.\u003c/li>\u003c/ul>\n\u003ch2>관련 용어\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#/e/%E5%88%B6%E9%99%90%E8%A1%8C%E7%82%BA%E8%83%BD%E5%8A%9B%E8%80%85\">制限行為能力者\u003c/a>\u003c/li>\u003c/ul>","search":"意思能力 いしのうりょく 항목 내용 ------ ------ 읽기 いしのうりょく（의사능력） 과목 민법（총칙） 한줄 정의 자기 행위의 법적 결과를 판단할 수 있는 최소한의 정신능력 통설·판례 의사능력을 결여한 상태에서 한 법률행위는 무효 . 2020년 4월 시행 개정민법이 3조의2 로 명문화（구법에는 조문이 없었고 판례·학설상 인정） 개념 의사능력 意思能力 이란 자기 행위의 결과가 어떤 의미를 갖는지를 변별·판단할 수 있는 정신적 능력을 말한다. 개정민법 3조의2 는 「法律行為の当事者が意思表示をした時に意思能力を有しなかったときは、その法律行為は、無効とする」라고 정하여, 의사무능력자의 법률행위가 무효 임을 조문으로 확인하였다. 판단 기준은 연령이 아니라 행위 시점의 구체적 정신 상태 다. 일률적인 나이 기준은 없고, 통설은 대체로 7~10세 정도의 판단력 을 기준으로 하되, 문제된 법률행위의 복잡성·중대성에 따라 개별적으로 판단한다고 본다. 따라서 성년자라도 중증 치매·만취·혼수 상태에서 한 계약은 의사무능력으로 무효가 될 수 있고, 반대로 성년후견 심판을 받지 않았더라도 무효 주장이 가능하다. 대비: 意思能力 흠결 = 무효 / 行為能力 제한 = 취소. 행위능력 行為能力 은 「단독으로 유효한 법률행위를 할 수 있는 자격」을 획일적 기준 연령·가정법원의 심판 으로 정해 둔 제도이고, 그 제한을 위반한 행위는 취소할 수 있는 행위 에 그친다 5조 2항, 9조, 13조 4항, 17조 4항 . 취소에는 취소권자의 제한 120조 과 기간 제한 126조 — 추인할 수 있는 때부터 5년 , 행위 시부터 20년 이 붙지만, 무효에는 이런 제한이 없다. 의사무능력으로 무효가 된 경우의 반환범위 는 121조의2 3항에 따라 현존이익 現に利益を受けている限度 에 한정된다. 같은 항은 행위 시에 제한행위능력자였던 자에 대해서도 동일하게 규정하여, 두 제도의 보호 수준을 맞추고 있다. 이 조문 역시 2020년 개정으로 신설되었다. 학설 학설 내용 비고 ------ ------ ------ 절대적 무효설 무효인 이상 누구든지, 언제든지 주장할 수 있다 조문 문언에 충실 상대적 무효설 의사무능력자 보호를 위한 무효이므로 표의자 측 본인·상속인 등 만 무효를 주장할 수 있다 👉 다수설. 상대방이 무효를 주장해 계약에서 벗어나는 것을 막기 위함 💡 수험 팁 - 「意思能力 = 무효 / 行為能力 제한 = 취소」 의 짝이 최빈출. 「의사능력이 없는 자의 행위는 취소할 수 있다」는 지문은 오답 . - 개정 전에는 3조의2가 없었다. 「구법에도 의사능력에 관한 명문 규정이 있었다」는 지문은 오답. 구법 하에서는 판례·통설로 무효 처리했다. - 의사무능력과 제한행위능력은 양립 가능 이중효 . 예컨대 성년피후견인이 의사무능력 상태에서 계약했다면 무효를 주장해도 되고 취소를 주장해도 된다 . 무효 쪽이 기간 제한이 없어 유리한 경우가 많다. - 반환범위는 의사무능력자·제한행위능력자 모두 현존이익 한도 121조의2 3항 . 「받은 이익 전부를 반환해야 한다」는 지문은 오답. - 의사능력의 유무는 의사표시를 한 시점 을 기준으로 판단한다. 계약 후에 정신능력을 회복했는지 여부는 무효 판단과 무관하다. 관련 용어 - 制限行為能力者 制限行為能力者.md"},"制限行為能力者":{"type":"term","subject":"용어","id":"制限行為能力者","title":"制限行為能力者","sub":"せいげんこういのうりょくしゃ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>せいげんこういのうりょくしゃ（제한행위능력자）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>단독으로 완전한 법률행위를 할 수 없어 법이 보호하는 자 — 미성년자·성년피후견인·피보좌인·피보조인의 4유형\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>제한을 위반한 행위는 \u003cstrong>무효가 아니라 취소\u003c/strong> 가능. 취소 시 반환범위는 \u003cstrong>현존이익\u003c/strong> 한도(121조의2 3항)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>행위능력(行為能力)\u003c/strong>이란 단독으로 유효하게 법률행위를 할 수 있는 자격을 말한다. 개별 사안마다 정신 상태를 따지는 \u003ca href=\"#/e/%E6%84%8F%E6%80%9D%E8%83%BD%E5%8A%9B\">意思能力\u003c/a>과 달리, 행위능력 제도는 \u003cstrong>연령과 가정법원의 심판이라는 획일적 기준\u003c/strong>으로 보호 대상을 미리 정해 둔다. 이로써 본인은 「의사능력이 없었음」을 입증하지 않고도 행위를 \u003cstrong>취소\u003c/strong>할 수 있고, 거래 상대방도 누가 보호 대상인지 미리 알 수 있다.\u003c/p>\n\u003cp>제한행위능력자는 \u003cstrong>미성년자(未成年者)·성년피후견인(成年被後見人)·피보좌인(被保佐人)·피보조인(被補助人)\u003c/strong>의 4유형이다. 뒤의 3유형은 \u003cstrong>성년후견제도\u003c/strong>(法定後見)로 묶이며, 판단능력의 저하 정도에 따라 후견(결여)→보좌(현저히 불충분)→보조(불충분)의 순서로 가벼워진다.\u003c/p>\n\u003cp>제한을 위반한 행위의 효과는 일률적으로 \u003cstrong>취소할 수 있는 행위\u003c/strong>다(5조 2항, 9조 본문, 13조 4항, 17조 4항). 취소권자는 제한행위능력자 본인·대리인·승계인·동의권자(120조 1항)이며, \u003cstrong>본인도 단독으로 취소할 수 있다\u003c/strong>(취소 자체는 보호자의 동의 불요, 120조 1항). 취소하면 소급하여 무효가 되지만(121조), 제한행위능력자의 반환의무는 \u003cstrong>현존이익 한도\u003c/strong>로 축소된다(121조의2 3항).\u003c/p>\n\u003cp>한편 이 제도는 상대방을 불안정한 지위에 두므로, 민법은 \u003cstrong>최고권(20조)\u003c/strong>과 \u003cstrong>사술(詐術)에 의한 취소권 배제(21조)\u003c/strong>로 상대방을 보호한다.\u003c/p>\n\u003ch2>4유형 비교표\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>유형\u003c/th>\u003cth>대상（조문）\u003c/th>\u003cth>보호자\u003c/th>\u003cth>동의가 필요한 행위\u003c/th>\u003cth>취소할 수 있는 범위\u003c/th>\u003cth>보호자의 권한\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>未成年者\u003c/strong>（미성년자）\u003c/td>\u003ctd>18세 미만（4조. 2022.4.1부터 성년 = 18세）\u003c/td>\u003ctd>법정대리인（친권자·미성년후견인）\u003c/td>\u003ctd>\u003cstrong>원칙 모든 법률행위\u003c/strong>（5조 1항 본문）\u003c/td>\u003ctd>동의 없이 한 행위 전부（5조 2항）. \u003cstrong>예외 3가지는 취소 불가\u003c/strong> ①단순히 권리를 얻거나 의무를 면하는 행위（5조 1항 단서） ②목적을 정해/정하지 않고 처분을 허락한 재산（5조 3항） ③영업을 허락받은 영업에 관한 행위（6조 1항）\u003c/td>\u003ctd>동의권·대리권·취소권·추인권 \u003cstrong>모두 있음\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>成年被後見人\u003c/strong>（성년피후견인）\u003c/td>\u003ctd>사리를 변식할 능력을 \u003cstrong>결여한 상황\u003c/strong>에 있어 후견개시 심판을 받은 자（7조）\u003c/td>\u003ctd>성년후견인\u003c/td>\u003ctd>— \u003cstrong>동의권 자체가 없음\u003c/strong>\u003c/td>\u003ctd>한 행위 \u003cstrong>전부\u003c/strong>（9조 본문）. \u003cstrong>예외: 일용품 구입 등 일상생활에 관한 행위\u003c/strong>（9조 단서）는 취소 불가\u003c/td>\u003ctd>\u003cstrong>동의권 없음\u003c/strong>. 대리권·취소권·추인권 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>被保佐人\u003c/strong>（피보좌인）\u003c/td>\u003ctd>사리를 변식할 능력이 \u003cstrong>현저히 불충분\u003c/strong>하여 보좌개시 심판을 받은 자（11조）\u003c/td>\u003ctd>보좌인\u003c/td>\u003ctd>\u003cstrong>13조 1항 각호의 중요 재산행위\u003c/strong> + 심판으로 추가된 행위（13조 2항）\u003c/td>\u003ctd>동의 없이 한 위 행위（13조 4항）. 그 밖의 행위는 \u003cstrong>자유롭게 단독 가능\u003c/strong>\u003c/td>\u003ctd>동의권·취소권·추인권 있음. \u003cstrong>대리권은 원칙 없음\u003c/strong> → 876조의4 심판으로 특정 행위에 부여（본인 이외의 청구 시 \u003cstrong>본인 동의 필요\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>被補助人\u003c/strong>（피보조인）\u003c/td>\u003ctd>사리를 변식할 능력이 \u003cstrong>불충분\u003c/strong>하여 보조개시 심판을 받은 자（15조 1항）\u003c/td>\u003ctd>보조인\u003c/td>\u003ctd>\u003cstrong>17조 1항 심판으로 정한 특정 법률행위만\u003c/strong>. 그 대상은 \u003cstrong>13조 1항 행위의 「일부」에 한정\u003c/strong>（17조 1항 단서）\u003c/td>\u003ctd>동의(또는 이에 갈음하는 허가) 없이 한 위 행위（17조 4항）\u003c/td>\u003ctd>심판으로 정해진 범위의 동의권·취소권. 대리권은 876조의9 심판으로 부여. \u003cstrong>본인 이외의 청구로 심판할 때는 본인의 동의 필수\u003c/strong>（15조 2항, 17조 2항）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>13조 1항 각호 — 보좌인의 동의를 요하는 행위\u003c/h3>\n\u003col>\u003cli>원본을 영수하거나 이용하는 것\u003c/li>\u003cli>차재(借財) 또는 보증을 하는 것\u003c/li>\u003cli>부동산 그 밖의 중요한 재산에 관한 권리의 득실을 목적으로 하는 행위\u003c/li>\u003cli>소송행위를 하는 것\u003c/li>\u003cli>증여, 화해 또는 중재합의를 하는 것\u003c/li>\u003cli>상속의 승인·포기 또는 유산분할을 하는 것\u003c/li>\u003cli>증여의 청약을 거절하거나, 유증을 포기하거나, 부담부 증여의 청약을 승낙하거나, 부담부 유증을 승인하는 것\u003c/li>\u003cli>신축·개축·증축 또는 대수선을 하는 것\u003c/li>\u003cli>602조에 정한 기간을 초과하는 임대차를 하는 것\u003c/li>\u003cli>위 각호의 행위를 제한행위능력자의 법정대리인으로서 하는 것（2020년 개정으로 신설）\u003c/li>\u003c/ol>\n\u003ch2>상대방의 보호\u003c/h2>\n\u003ch3>최고권（催告権, 20조）\u003c/h3>\n\u003cp>상대방은 \u003cstrong>1개월 이상\u003c/strong>의 기간을 정하여 추인 여부의 확답을 촉구할 수 있다. 확답이 없을 때의 효과가 \u003cstrong>누구에게 최고했는가\u003c/strong>에 따라 정반대로 갈리는 것이 함정이다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>최고의 상대방\u003c/th>\u003cth>근거\u003c/th>\u003cth>기간 내 확답이 없을 때\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>능력자가 된 본인\u003c/strong>\u003c/td>\u003ctd>20조 1항\u003c/td>\u003ctd>\u003cstrong>추인 간주（追認擬制）\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>법정대리인·보좌인·보조인\u003c/strong>（권한 내 행위에 관하여）\u003c/td>\u003ctd>20조 2항\u003c/td>\u003ctd>\u003cstrong>추인 간주\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위 두 경우 중 \u003cstrong>특별한 방식을 요하는 행위\u003c/strong>로서 방식을 갖추었다는 통지가 없을 때\u003c/td>\u003ctd>20조 3항\u003c/td>\u003ctd>\u003cstrong>취소 간주（取消擬制）\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>피보좌인 본인 / 17조 1항 심판을 받은 피보조인 본인\u003c/strong>（보좌인·보조인의 추인을 받으라는 최고）\u003c/td>\u003ctd>20조 4항\u003c/td>\u003ctd>\u003cstrong>취소 간주\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>함정:\u003c/strong> 미성년자·성년피후견인 \u003cstrong>본인\u003c/strong>에게 한 최고는 \u003cstrong>효력이 없다\u003c/strong>. 이들은 수령능력이 없으므로(98조의2), 아무리 기간이 지나도 추인·취소 어느 쪽으로도 간주되지 않는다.\u003c/p>\n\u003ch3>사술（詐術, 21조）\u003c/h3>\n\u003cp>제한행위능력자가 \u003cstrong>능력자임을 믿게 하기 위하여 사술을 쓴 때\u003c/strong>에는 그 행위를 \u003cstrong>취소할 수 없다\u003c/strong>. 스스로 상대방을 속인 자까지 보호할 필요는 없기 때문이다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>무능력자의 묵비와 「詐術」\u003c/td>\u003ctd>最一小判昭44.2.13 / 民集23巻2号291頁\u003c/td>\u003ctd>제한행위능력자가 자신이 무능력자임을 \u003cstrong>말하지 않은 것\u003c/strong>이 21조(구 20조)의 사술에 해당하는지\u003c/td>\u003ctd>\u003cstrong>묵비(黙秘)만으로는 사술이 아니다.\u003c/strong> 다만 \u003cstrong>다른 언동과 어우러져\u003c/strong> 상대방을 오신시키거나 오신을 강화한 것으로 인정되는 때에는 사술에 해당\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>성년피후견인에게는 후견인의 동의권이 없다.\u003c/strong> 「후견인의 동의를 얻어 한 행위는 취소할 수 없다」는 지문은 \u003cstrong>오답\u003c/strong> — 동의를 얻었어도 취소할 수 있다. 4유형 중 유일한 특징이다.\u003c/li>\u003cli>\u003cstrong>최고의 상대방과 효과를 세트로 암기\u003c/strong>: 능력자 본인·법정대리인·보좌인·보조인 → \u003cstrong>추인 간주\u003c/strong> / 피보좌인·피보조인 \u003cstrong>본인\u003c/strong>, 특별방식 미구비 → \u003cstrong>취소 간주\u003c/strong>. 미성년자·성년피후견인 본인에게 한 최고는 \u003cstrong>애초에 무효\u003c/strong>.\u003c/li>\u003cli>미성년자가 단독으로 할 수 있는 행위 3종(권리만 얻는 행위·처분 허락 재산·허락된 영업)을 정확히. 「부담부 증여를 받는 것」은 의무를 부담하므로 \u003cstrong>단독 불가\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>피보조인은 「13조 1항의 일부」만\u003c/strong> 동의 대상이 될 수 있다(17조 1항 단서). 「13조 1항 전부」나 「그 밖의 행위」로 정할 수 있다는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>본인의 동의\u003c/strong>가 필요한 국면을 구별: 보조개시 심판(15조 2항)·17조 1항 심판·보좌인/보조인에 대한 대리권 부여 심판(876조의4, 876조의9)은 \u003cstrong>본인 이외의 자가 청구할 때 본인 동의 필요\u003c/strong>. 반면 \u003cstrong>후견개시·보좌개시 심판은 본인의 동의가 불요\u003c/strong>.\u003c/li>\u003cli>사술은 「\u003cstrong>묵비만으로는 부족\u003c/strong>」(最判昭44.2.13)이 결론. 「무능력자임을 밝히지 않은 것만으로 사술이 된다」는 지문은 오답.\u003c/li>\u003c/ul>\n\u003ch2>관련 용어\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"#/e/%E6%84%8F%E6%80%9D%E8%83%BD%E5%8A%9B\">意思能力\u003c/a>\u003c/li>\u003c/ul>","search":"制限行為能力者 せいげんこういのうりょくしゃ 항목 내용 ------ ------ 읽기 せいげんこういのうりょくしゃ（제한행위능력자） 과목 민법（총칙） 한줄 정의 단독으로 완전한 법률행위를 할 수 없어 법이 보호하는 자 — 미성년자·성년피후견인·피보좌인·피보조인의 4유형 통설·판례 제한을 위반한 행위는 무효가 아니라 취소 가능. 취소 시 반환범위는 현존이익 한도 121조의2 3항 개념 행위능력 行為能力 이란 단독으로 유효하게 법률행위를 할 수 있는 자격을 말한다. 개별 사안마다 정신 상태를 따지는 意思能力 意思能力.md 과 달리, 행위능력 제도는 연령과 가정법원의 심판이라는 획일적 기준 으로 보호 대상을 미리 정해 둔다. 이로써 본인은 「의사능력이 없었음」을 입증하지 않고도 행위를 취소 할 수 있고, 거래 상대방도 누가 보호 대상인지 미리 알 수 있다. 제한행위능력자는 미성년자 未成年者 ·성년피후견인 成年被後見人 ·피보좌인 被保佐人 ·피보조인 被補助人 의 4유형이다. 뒤의 3유형은 성년후견제도 法定後見 로 묶이며, 판단능력의 저하 정도에 따라 후견 결여 →보좌 현저히 불충분 →보조 불충분 의 순서로 가벼워진다. 제한을 위반한 행위의 효과는 일률적으로 취소할 수 있는 행위 다 5조 2항, 9조 본문, 13조 4항, 17조 4항 . 취소권자는 제한행위능력자 본인·대리인·승계인·동의권자 120조 1항 이며, 본인도 단독으로 취소할 수 있다 취소 자체는 보호자의 동의 불요, 120조 1항 . 취소하면 소급하여 무효가 되지만 121조 , 제한행위능력자의 반환의무는 현존이익 한도 로 축소된다 121조의2 3항 . 한편 이 제도는 상대방을 불안정한 지위에 두므로, 민법은 최고권 20조 과 사술 詐術 에 의한 취소권 배제 21조 로 상대방을 보호한다. 4유형 비교표 유형 대상（조문） 보호자 동의가 필요한 행위 취소할 수 있는 범위 보호자의 권한 ------ ------ ------ ------ ------ ------ 未成年者 （미성년자） 18세 미만（4조. 2022.4.1부터 성년 = 18세） 법정대리인（친권자·미성년후견인） 원칙 모든 법률행위 （5조 1항 본문） 동의 없이 한 행위 전부（5조 2항）. 예외 3가지는 취소 불가 ①단순히 권리를 얻거나 의무를 면하는 행위（5조 1항 단서） ②목적을 정해/정하지 않고 처분을 허락한 재산（5조 3항） ③영업을 허락받은 영업에 관한 행위（6조 1항） 동의권·대리권·취소권·추인권 모두 있음 成年被後見人 （성년피후견인） 사리를 변식할 능력을 결여한 상황 에 있어 후견개시 심판을 받은 자（7조） 성년후견인 — 동의권 자체가 없음 한 행위 전부 （9조 본문）. 예외: 일용품 구입 등 일상생활에 관한 행위 （9조 단서）는 취소 불가 동의권 없음 . 대리권·취소권·추인권 있음 被保佐人 （피보좌인） 사리를 변식할 능력이 현저히 불충분 하여 보좌개시 심판을 받은 자（11조） 보좌인 13조 1항 각호의 중요 재산행위 + 심판으로 추가된 행위（13조 2항） 동의 없이 한 위 행위（13조 4항）. 그 밖의 행위는 자유롭게 단독 가능 동의권·취소권·추인권 있음. 대리권은 원칙 없음 → 876조의4 심판으로 특정 행위에 부여（본인 이외의 청구 시 본인 동의 필요 ） 被補助人 （피보조인） 사리를 변식할 능력이 불충분 하여 보조개시 심판을 받은 자（15조 1항） 보조인 17조 1항 심판으로 정한 특정 법률행위만 . 그 대상은 13조 1항 행위의 「일부」에 한정 （17조 1항 단서） 동의 또는 이에 갈음하는 허가 없이 한 위 행위（17조 4항） 심판으로 정해진 범위의 동의권·취소권. 대리권은 876조의9 심판으로 부여. 본인 이외의 청구로 심판할 때는 본인의 동의 필수 （15조 2항, 17조 2항） 13조 1항 각호 — 보좌인의 동의를 요하는 행위 1. 원본을 영수하거나 이용하는 것 2. 차재 借財 또는 보증을 하는 것 3. 부동산 그 밖의 중요한 재산에 관한 권리의 득실을 목적으로 하는 행위 4. 소송행위를 하는 것 5. 증여, 화해 또는 중재합의를 하는 것 6. 상속의 승인·포기 또는 유산분할을 하는 것 7. 증여의 청약을 거절하거나, 유증을 포기하거나, 부담부 증여의 청약을 승낙하거나, 부담부 유증을 승인하는 것 8. 신축·개축·증축 또는 대수선을 하는 것 9. 602조에 정한 기간을 초과하는 임대차를 하는 것 10. 위 각호의 행위를 제한행위능력자의 법정대리인으로서 하는 것（2020년 개정으로 신설） 상대방의 보호 최고권（催告権, 20조） 상대방은 1개월 이상 의 기간을 정하여 추인 여부의 확답을 촉구할 수 있다. 확답이 없을 때의 효과가 누구에게 최고했는가 에 따라 정반대로 갈리는 것이 함정이다. 최고의 상대방 근거 기간 내 확답이 없을 때 ------ ------ ------ 능력자가 된 본인 20조 1항 추인 간주（追認擬制） 법정대리인·보좌인·보조인 （권한 내 행위에 관하여） 20조 2항 추인 간주 위 두 경우 중 특별한 방식을 요하는 행위 로서 방식을 갖추었다는 통지가 없을 때 20조 3항 취소 간주（取消擬制） 피보좌인 본인 / 17조 1항 심판을 받은 피보조인 본인 （보좌인·보조인의 추인을 받으라는 최고） 20조 4항 취소 간주 함정: 미성년자·성년피후견인 본인 에게 한 최고는 효력이 없다 . 이들은 수령능력이 없으므로 98조의2 , 아무리 기간이 지나도 추인·취소 어느 쪽으로도 간주되지 않는다. 사술（詐術, 21조） 제한행위능력자가 능력자임을 믿게 하기 위하여 사술을 쓴 때 에는 그 행위를 취소할 수 없다 . 스스로 상대방을 속인 자까지 보호할 필요는 없기 때문이다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 무능력자의 묵비와 「詐術」 最一小判昭44.2.13 / 民集23巻2号291頁 제한행위능력자가 자신이 무능력자임을 말하지 않은 것 이 21조 구 20조 의 사술에 해당하는지 묵비 黙秘 만으로는 사술이 아니다. 다만 다른 언동과 어우러져 상대방을 오신시키거나 오신을 강화한 것으로 인정되는 때에는 사술에 해당 💡 수험 팁 - 성년피후견인에게는 후견인의 동의권이 없다. 「후견인의 동의를 얻어 한 행위는 취소할 수 없다」는 지문은 오답 — 동의를 얻었어도 취소할 수 있다. 4유형 중 유일한 특징이다. - 최고의 상대방과 효과를 세트로 암기 : 능력자 본인·법정대리인·보좌인·보조인 → 추인 간주 / 피보좌인·피보조인 본인 , 특별방식 미구비 → 취소 간주 . 미성년자·성년피후견인 본인에게 한 최고는 애초에 무효 . - 미성년자가 단독으로 할 수 있는 행위 3종 권리만 얻는 행위·처분 허락 재산·허락된 영업 을 정확히. 「부담부 증여를 받는 것」은 의무를 부담하므로 단독 불가 . - 피보조인은 「13조 1항의 일부」만 동의 대상이 될 수 있다 17조 1항 단서 . 「13조 1항 전부」나 「그 밖의 행위」로 정할 수 있다는 지문은 오답. - 본인의 동의 가 필요한 국면을 구별: 보조개시 심판 15조 2항 ·17조 1항 심판·보좌인/보조인에 대한 대리권 부여 심판 876조의4, 876조의9 은 본인 이외의 자가 청구할 때 본인 동의 필요 . 반면 후견개시·보좌개시 심판은 본인의 동의가 불요 . - 사술은 「 묵비만으로는 부족 」 最判昭44.2.13 이 결론. 「무능력자임을 밝히지 않은 것만으로 사술이 된다」는 지문은 오답. 관련 용어 - 意思能力 意思能力.md"},"無権代理":{"type":"term","subject":"용어","id":"無権代理","title":"無権代理","sub":"むけんだいり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>むけんだいり（무권대리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙 — 대리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>대리권을 갖지 않는 자가 타인의 대리인으로서 한 행위로, 본인이 \u003cstrong>추인(追認)\u003c/strong>하지 않는 한 본인에게 효력이 생기지 않는 상태\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>무권대리 행위는 \u003cstrong>무효가 아니라 「효력 불발생(유동적 무효)」\u003c/strong>. 「무권대리와 상속」은 \u003cstrong>누가 누구를 상속했는가\u003c/strong>에 따라 판례가 결론을 달리한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>대리가 성립하려면 ① 현명(顕名), ② 대리권의 존재, ③ 대리인의 의사표시라는 세 요소가 필요하다. 이 중 \u003cstrong>② 대리권만 빠진 경우\u003c/strong>가 무권대리다. 대리권이 처음부터 없었던 경우뿐 아니라, 대리권은 있었지만 그 \u003cstrong>권한을 넘어선 경우(권한유월)\u003c/strong>나 \u003cstrong>대리권이 이미 소멸한 경우\u003c/strong>도 모두 무권대리에 해당한다.\u003c/p>\n\u003cp>\u003cstrong>민법 113조 1항\u003c/strong>은 「대리권을 갖지 않는 자가 타인의 대리인으로서 한 계약은, 본인이 그 추인을 하지 않으면 본인에 대하여 그 효력을 발생하지 않는다」고 정한다. 즉 \u003cstrong>처음부터 확정적으로 무효인 것이 아니라, 본인의 추인이 있으면 유효로 되고 추인거절이 있으면 무효로 확정되는 「유동적(浮動的) 상태」\u003c/strong>에 놓인다. 추인·추인거절은 상대방에게 하지 않으면 그 상대방에게 대항할 수 없다(113조 2항 본문). 추인이 있으면 \u003cstrong>별단의 의사표시가 없는 한 계약 시로 소급\u003c/strong>하여 효력이 생기되, 제3자의 권리를 해할 수는 없다(\u003cstrong>116조\u003c/strong>).\u003c/p>\n\u003cp>상대방은 언제까지고 불안정한 지위에 놓이므로, 민법은 상대방에게 두 가지 무기와 하나의 청구권을 준다. \u003cstrong>최고권(114조)\u003c/strong>, \u003cstrong>철회권(115조)\u003c/strong>, 그리고 \u003cstrong>무권대리인에 대한 책임 추궁(117조)\u003c/strong>이다. 각각의 요건에서 \u003cstrong>상대방이 선의여야 하는지\u003c/strong>가 갈리므로 표로 정리해 두어야 한다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>제도\u003c/th>\u003cth>조문\u003c/th>\u003cth>내용\u003c/th>\u003cth>상대방의 선의 요부\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>최고권\u003c/strong>（催告権）\u003c/td>\u003ctd>114조\u003c/td>\u003ctd>상당한 기간을 정하여 본인에게 추인 여부의 확답을 촉구. 기간 내에 확답이 없으면 \u003cstrong>「추인을 거절한 것」으로 간주\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>불요 — 악의의 상대방도 행사 가능\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>철회권\u003c/strong>（撤回権）\u003c/td>\u003ctd>115조\u003c/td>\u003ctd>본인이 추인하지 않는 동안 상대방이 계약을 철회\u003c/td>\u003ctd>\u003cstrong>필요 — 계약 당시 대리권 없음을 알았던(악의) 자는 불가\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>무권대리인의 책임\u003c/strong>\u003c/td>\u003ctd>117조 1항\u003c/td>\u003ctd>대리권을 증명하지 못하고 본인의 추인도 얻지 못한 때, \u003cstrong>상대방의 선택\u003c/strong>에 따라 \u003cstrong>이행 또는 손해배상\u003c/strong>（\u003cstrong>무과실책임\u003c/strong>）\u003c/td>\u003ctd>아래 117조 2항 참조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본인의 추인·추인거절\u003c/td>\u003ctd>113조\u003c/td>\u003ctd>추인하면 계약 시로 소급하여 유효(116조), 거절하면 무효 확정\u003c/td>\u003ctd>—\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>117조 2항\u003c/strong>은 무권대리인이 책임을 면하는 세 경우를 정한다. ① 상대방이 대리권 없음을 \u003cstrong>알고 있었던 때(악의)\u003c/strong>, ② 상대방이 \u003cstrong>과실로 몰랐던 때\u003c/strong> — 다만 \u003cstrong>무권대리인 자신이 자기에게 대리권이 없음을 알고 있었던 경우에는 면책되지 않는다\u003c/strong>(2020년 개정으로 추가된 단서로, \u003cstrong>자주 출제되는 신설 포인트\u003c/strong>), ③ 무권대리인이 \u003cstrong>행위능력의 제한을 받고 있었던 때\u003c/strong>. 한편 계약이 아닌 \u003cstrong>단독행위\u003c/strong>의 무권대리는 원칙적으로 무효이며, 상대방이 동의했거나 다투지 않은 경우 등 예외적으로만 113조~117조가 준용된다(\u003cstrong>118조\u003c/strong>).\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cp>무권대리인과 본인의 지위가 상속으로 한 사람에게 합쳐졌을 때 어떻게 처리할 것인가를 둘러싸고 다음과 같은 대립이 있다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>자격융합설\u003c/strong>（資格融合説）\u003c/td>\u003ctd>상속으로 무권대리인의 지위와 본인의 지위가 \u003cstrong>하나로 융합\u003c/strong>되어, 본인이 스스로 법률행위를 한 것과 같은 지위가 된다\u003c/td>\u003ctd>무권대리인이 본인을 상속한 경우의 결론(당연 유효)을 설명하기 쉬움. 다만 공동상속의 경우 설명이 곤란\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>자격병존설（신의칙설）\u003c/strong>\u003c/td>\u003ctd>두 자격은 \u003cstrong>병존\u003c/strong>하나, 무권대리인이 본인의 지위에서 추인을 거절하는 것은 \u003cstrong>신의칙(1조 2항)에 반하여 허용되지 않는다\u003c/strong>\u003c/td>\u003ctd>👉 현재의 \u003cstrong>유력설\u003c/strong>. 공동상속·쌍방상속 등 응용 사안까지 통일적으로 설명 가능\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>한편 \u003cstrong>표현대리가 성립하는 경우에도 상대방은 이를 주장하지 않고 곧바로 117조의 책임을 물을 수 있는가\u003c/strong>에 대해, 판례·통설은 \u003cstrong>긍정\u003c/strong>한다. 표현대리 규정은 \u003cstrong>상대방을 보호하기 위한 것\u003c/strong>이므로, \u003cstrong>무권대리인 쪽에서 「내 행위는 표현대리가 성립하니 117조 책임은 없다」고 주장하여 책임을 면할 수는 없다\u003c/strong>.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cp>「무권대리와 상속」은 \u003cstrong>철판(鉄板) 논점\u003c/strong>이다. 아래 5개 유형을 결론과 함께 통째로 외운다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>무권대리인이 본인을 \u003cstrong>단독상속\u003c/strong>\u003c/td>\u003ctd>最判昭40.6.18 / 民集19巻4号986頁\u003c/td>\u003ctd>무권대리로 본인의 부동산을 매도한 자가, 본인 사망 후 단독으로 상속\u003c/td>\u003ctd>\u003cstrong>본인이 스스로 법률행위를 한 것과 같은 법률상의 지위\u003c/strong>가 생김. \u003cstrong>추인거절 불가 → 무권대리행위는 당연히 유효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>본인\u003c/strong>이 \u003cstrong>무권대리인\u003c/strong>을 상속\u003c/td>\u003ctd>最判昭37.4.20 / 民集16巻4号955頁\u003c/td>\u003ctd>무권대리인이 먼저 사망하고 본인이 그를 상속\u003c/td>\u003ctd>\u003cstrong>당연히 유효로 되지는 않는다.\u003c/strong> 본인이 자기 지위에서 \u003cstrong>추인을 거절해도 신의칙에 반하지 않는다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>본인이 무권대리인을 상속한 경우의 \u003cstrong>117조 책임\u003c/strong>\u003c/td>\u003ctd>最判昭48.7.3 / 民集27巻7号751頁\u003c/td>\u003ctd>위 유형에서 상대방이 무권대리인의 117조 채무를 상속인(＝본인)에게 청구\u003c/td>\u003ctd>\u003cstrong>117조의 채무는 상속으로 승계된다.\u003c/strong> 추인을 거절할 수 있는 지위에 있었다는 이유로 \u003cstrong>그 채무를 면할 수 없다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무권대리인이 본인을 \u003cstrong>공동상속\u003c/strong>\u003c/td>\u003ctd>最判平5.1.21 / 民集47巻1号265頁\u003c/td>\u003ctd>무권대리인이 다른 상속인과 함께 본인을 공동상속\u003c/td>\u003ctd>추인권은 \u003cstrong>공동상속인 전원에게 불가분적으로 귀속\u003c/strong>. \u003cstrong>전원이 공동으로 추인하지 않는 한\u003c/strong>, \u003cstrong>무권대리인 자신의 상속분에 상당하는 부분에서도\u003c/strong> 당연히 유효로 되지 않는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>추인거절 후\u003c/strong>의 상속\u003c/td>\u003ctd>最判平10.7.17 / 民集52巻5号1296頁\u003c/td>\u003ctd>본인이 생전에 추인을 거절한 뒤 사망하고, 무권대리인 측이 본인을 상속\u003c/td>\u003ctd>추인거절로 \u003cstrong>무효가 이미 확정\u003c/strong>되었으므로, \u003cstrong>그 후 무권대리인이 본인을 상속해도 유효로 되지 않는다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비: 최고권(114조) ↔ 철회권(115조).\u003c/strong> 최고권은 \u003cstrong>악의의 상대방도 행사 가능\u003c/strong>, 철회권은 \u003cstrong>선의의 상대방만\u003c/strong> 가능. 「악의의 상대방은 최고할 수 없다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>114조의 「확답 없음 = 추인 거절 간주」\u003c/strong>를 「추인한 것으로 간주」로 뒤집은 지문이 단골 함정. \u003cstrong>침묵은 거절\u003c/strong>이라고 외운다. (참고: 제한행위능력자의 최고 20조는 원칙적으로 「추인 간주」이므로 \u003cstrong>정반대\u003c/strong>다.)\u003c/li>\u003cli>무권대리와 상속은 \u003cstrong>「무권대리인 → 본인 상속 = 유효 / 본인 → 무권대리인 상속 = 거절 가능」\u003c/strong>의 한 줄로 방향을 먼저 잡고, \u003cstrong>공동상속이면 전원 추인 필요(平5.1.21)\u003c/strong>, \u003cstrong>추인거절이 선행했으면 그 후엔 뒤집지 못함(平10.7.17)\u003c/strong>을 덧붙인다.\u003c/li>\u003cli>「본인이 무권대리인을 상속하면 추인을 거절할 수 있으므로 아무 책임도 지지 않는다」는 지문은 \u003cstrong>오답\u003c/strong>. \u003cstrong>추인거절은 가능하지만 117조의 채무는 상속으로 승계\u003c/strong>한다(昭48.7.3). \u003cstrong>「거절은 되지만 돈은 물어야 한다」\u003c/strong>로 기억.\u003c/li>\u003cli>117조 1항의 책임은 \u003cstrong>무과실책임\u003c/strong>이며, \u003cstrong>이행 또는 손해배상 중 선택권은 상대방\u003c/strong>에게 있다. 「무권대리인이 선택한다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>개정 포인트:\u003c/strong> 상대방에게 과실이 있어도 \u003cstrong>무권대리인이 대리권 없음을 알고 있었다면 면책되지 않는다\u003c/strong>(117조 2항 2호 단서). 개정 전 교재에는 없는 내용이다.\u003c/li>\u003cli>116조의 소급효는 \u003cstrong>제3자의 권리를 해하지 못한다\u003c/strong>는 제한이 붙는다. 「추인은 언제나 계약 시로 완전히 소급한다」는 단정적 지문에 주의.\u003c/li>\u003cli>대비: \u003cspan>表見代理\u003c/span> — 무권대리 중에서 \u003cstrong>본인에게 책임을 지울 만한 외관 사정\u003c/strong>이 있는 경우가 표현대리다. 표현대리가 성립하면 본인이 책임을 지고, 성립하지 않으면 협의의 무권대리로서 117조 문제가 된다.\u003c/li>\u003c/ul>","search":"無権代理 むけんだいり 항목 내용 ------ ------ 읽기 むけんだいり（무권대리） 과목 민법（총칙 — 대리） 한줄 정의 대리권을 갖지 않는 자가 타인의 대리인으로서 한 행위로, 본인이 추인 追認 하지 않는 한 본인에게 효력이 생기지 않는 상태 통설·판례 무권대리 행위는 무효가 아니라 「효력 불발생 유동적 무효 」 . 「무권대리와 상속」은 누가 누구를 상속했는가 에 따라 판례가 결론을 달리한다 개념 대리가 성립하려면 ① 현명 顕名 , ② 대리권의 존재, ③ 대리인의 의사표시라는 세 요소가 필요하다. 이 중 ② 대리권만 빠진 경우 가 무권대리다. 대리권이 처음부터 없었던 경우뿐 아니라, 대리권은 있었지만 그 권한을 넘어선 경우 권한유월 나 대리권이 이미 소멸한 경우 도 모두 무권대리에 해당한다. 민법 113조 1항 은 「대리권을 갖지 않는 자가 타인의 대리인으로서 한 계약은, 본인이 그 추인을 하지 않으면 본인에 대하여 그 효력을 발생하지 않는다」고 정한다. 즉 처음부터 확정적으로 무효인 것이 아니라, 본인의 추인이 있으면 유효로 되고 추인거절이 있으면 무효로 확정되는 「유동적 浮動的 상태」 에 놓인다. 추인·추인거절은 상대방에게 하지 않으면 그 상대방에게 대항할 수 없다 113조 2항 본문 . 추인이 있으면 별단의 의사표시가 없는 한 계약 시로 소급 하여 효력이 생기되, 제3자의 권리를 해할 수는 없다 116조 . 상대방은 언제까지고 불안정한 지위에 놓이므로, 민법은 상대방에게 두 가지 무기와 하나의 청구권을 준다. 최고권 114조 , 철회권 115조 , 그리고 무권대리인에 대한 책임 추궁 117조 이다. 각각의 요건에서 상대방이 선의여야 하는지 가 갈리므로 표로 정리해 두어야 한다. 제도 조문 내용 상대방의 선의 요부 ------ ------ ------ -------------------- 최고권 （催告権） 114조 상당한 기간을 정하여 본인에게 추인 여부의 확답을 촉구. 기간 내에 확답이 없으면 「추인을 거절한 것」으로 간주 불요 — 악의의 상대방도 행사 가능 철회권 （撤回権） 115조 본인이 추인하지 않는 동안 상대방이 계약을 철회 필요 — 계약 당시 대리권 없음을 알았던 악의 자는 불가 무권대리인의 책임 117조 1항 대리권을 증명하지 못하고 본인의 추인도 얻지 못한 때, 상대방의 선택 에 따라 이행 또는 손해배상 （ 무과실책임 ） 아래 117조 2항 참조 본인의 추인·추인거절 113조 추인하면 계약 시로 소급하여 유효 116조 , 거절하면 무효 확정 — 117조 2항 은 무권대리인이 책임을 면하는 세 경우를 정한다. ① 상대방이 대리권 없음을 알고 있었던 때 악의 , ② 상대방이 과실로 몰랐던 때 — 다만 무권대리인 자신이 자기에게 대리권이 없음을 알고 있었던 경우에는 면책되지 않는다 2020년 개정으로 추가된 단서로, 자주 출제되는 신설 포인트 , ③ 무권대리인이 행위능력의 제한을 받고 있었던 때 . 한편 계약이 아닌 단독행위 의 무권대리는 원칙적으로 무효이며, 상대방이 동의했거나 다투지 않은 경우 등 예외적으로만 113조~117조가 준용된다 118조 . 학설 무권대리인과 본인의 지위가 상속으로 한 사람에게 합쳐졌을 때 어떻게 처리할 것인가를 둘러싸고 다음과 같은 대립이 있다. 학설 내용 비고 ------ ------ ------ 자격융합설 （資格融合説） 상속으로 무권대리인의 지위와 본인의 지위가 하나로 융합 되어, 본인이 스스로 법률행위를 한 것과 같은 지위가 된다 무권대리인이 본인을 상속한 경우의 결론 당연 유효 을 설명하기 쉬움. 다만 공동상속의 경우 설명이 곤란 자격병존설（신의칙설） 두 자격은 병존 하나, 무권대리인이 본인의 지위에서 추인을 거절하는 것은 신의칙 1조 2항 에 반하여 허용되지 않는다 👉 현재의 유력설 . 공동상속·쌍방상속 등 응용 사안까지 통일적으로 설명 가능 한편 표현대리가 성립하는 경우에도 상대방은 이를 주장하지 않고 곧바로 117조의 책임을 물을 수 있는가 에 대해, 판례·통설은 긍정 한다. 표현대리 규정은 상대방을 보호하기 위한 것 이므로, 무권대리인 쪽에서 「내 행위는 표현대리가 성립하니 117조 책임은 없다」고 주장하여 책임을 면할 수는 없다 . 관련 판례 「무권대리와 상속」은 철판 鉄板 논점 이다. 아래 5개 유형을 결론과 함께 통째로 외운다. 판례 인용 사안 결론 ------ ------ ------ ------ 무권대리인이 본인을 단독상속 最判昭40.6.18 / 民集19巻4号986頁 무권대리로 본인의 부동산을 매도한 자가, 본인 사망 후 단독으로 상속 본인이 스스로 법률행위를 한 것과 같은 법률상의 지위 가 생김. 추인거절 불가 → 무권대리행위는 당연히 유효 본인 이 무권대리인 을 상속 最判昭37.4.20 / 民集16巻4号955頁 무권대리인이 먼저 사망하고 본인이 그를 상속 당연히 유효로 되지는 않는다. 본인이 자기 지위에서 추인을 거절해도 신의칙에 반하지 않는다 본인이 무권대리인을 상속한 경우의 117조 책임 最判昭48.7.3 / 民集27巻7号751頁 위 유형에서 상대방이 무권대리인의 117조 채무를 상속인 ＝본인 에게 청구 117조의 채무는 상속으로 승계된다. 추인을 거절할 수 있는 지위에 있었다는 이유로 그 채무를 면할 수 없다 무권대리인이 본인을 공동상속 最判平5.1.21 / 民集47巻1号265頁 무권대리인이 다른 상속인과 함께 본인을 공동상속 추인권은 공동상속인 전원에게 불가분적으로 귀속 . 전원이 공동으로 추인하지 않는 한 , 무권대리인 자신의 상속분에 상당하는 부분에서도 당연히 유효로 되지 않는다 추인거절 후 의 상속 最判平10.7.17 / 民集52巻5号1296頁 본인이 생전에 추인을 거절한 뒤 사망하고, 무권대리인 측이 본인을 상속 추인거절로 무효가 이미 확정 되었으므로, 그 후 무권대리인이 본인을 상속해도 유효로 되지 않는다 💡 수험 팁 - 대비: 최고권 114조 ↔ 철회권 115조 . 최고권은 악의의 상대방도 행사 가능 , 철회권은 선의의 상대방만 가능. 「악의의 상대방은 최고할 수 없다」는 지문은 오답 . - 114조의 「확답 없음 = 추인 거절 간주」 를 「추인한 것으로 간주」로 뒤집은 지문이 단골 함정. 침묵은 거절 이라고 외운다. 참고: 제한행위능력자의 최고 20조는 원칙적으로 「추인 간주」이므로 정반대 다. - 무권대리와 상속은 「무권대리인 → 본인 상속 = 유효 / 본인 → 무권대리인 상속 = 거절 가능」 의 한 줄로 방향을 먼저 잡고, 공동상속이면 전원 추인 필요 平5.1.21 , 추인거절이 선행했으면 그 후엔 뒤집지 못함 平10.7.17 을 덧붙인다. - 「본인이 무권대리인을 상속하면 추인을 거절할 수 있으므로 아무 책임도 지지 않는다」는 지문은 오답 . 추인거절은 가능하지만 117조의 채무는 상속으로 승계 한다 昭48.7.3 . 「거절은 되지만 돈은 물어야 한다」 로 기억. - 117조 1항의 책임은 무과실책임 이며, 이행 또는 손해배상 중 선택권은 상대방 에게 있다. 「무권대리인이 선택한다」는 지문은 오답. - 개정 포인트: 상대방에게 과실이 있어도 무권대리인이 대리권 없음을 알고 있었다면 면책되지 않는다 117조 2항 2호 단서 . 개정 전 교재에는 없는 내용이다. - 116조의 소급효는 제3자의 권리를 해하지 못한다 는 제한이 붙는다. 「추인은 언제나 계약 시로 완전히 소급한다」는 단정적 지문에 주의. - 대비: 表見代理 용어/表見代理.md — 무권대리 중에서 본인에게 책임을 지울 만한 외관 사정 이 있는 경우가 표현대리다. 표현대리가 성립하면 본인이 책임을 지고, 성립하지 않으면 협의의 무권대리로서 117조 문제가 된다."},"対抗要件主義":{"type":"term","subject":"용어","id":"対抗要件主義","title":"対抗要件主義","sub":"たいこうようけんしゅぎ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>たいこうようけんしゅぎ（대항요건주의）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（물권）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>물권변동은 당사자의 \u003cstrong>의사표시만으로 효력이 생기지만\u003c/strong>(176조), 이를 \u003cstrong>제3자에게 주장(대항)하려면\u003c/strong> 부동산은 \u003cstrong>등기\u003c/strong>(177조), 동산은 \u003cstrong>인도\u003c/strong>(178조)라는 공시방법을 갖추어야 한다는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>177조의 「제3자」는 \u003cstrong>「등기의 결여를 주장할 정당한 이익을 가진 자」\u003c/strong>로 한정된다（\u003cstrong>제한설\u003c/strong>, 大連判明41.12.15）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>일본 민법 \u003cstrong>176조\u003c/strong>는 「物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる」라고 하여 \u003cstrong>의사주의(意思主義)·불요식주의\u003c/strong>를 채택했다. 즉 매매계약이 성립하면 그 순간 소유권은 매수인에게 넘어간다. 등기나 인도는 \u003cstrong>효력요건이 아니다\u003c/strong>(등기를 효력요건으로 삼는 독일식 \u003cstrong>形式主義\u003c/strong>와 정반대).\u003c/p>\n\u003cp>그러나 의사표시만으로 물권이 움직인다면 밖에서 보는 제3자는 누가 소유자인지 알 수 없다. 그래서 민법은 \u003cstrong>177조\u003c/strong>(부동산: 「その登記をしなければ、第三者に対抗することができない」)와 \u003cstrong>178조\u003c/strong>(동산: 「その動産の引渡しがなければ、第三者に対抗することができない」)로 \u003cstrong>공시방법을 갖추지 못하면 제3자에게 주장할 수 없다\u003c/strong>는 제동을 걸었다. 이것이 대항요건주의다.\u003c/p>\n\u003cp>여기서 \u003cstrong>「대항할 수 없다」는 「무효」가 아니다.\u003c/strong> 당사자 사이(A와 B 사이)에서는 등기가 없어도 완전히 유효하게 소유권이 이전되어 있다. 다만 그 취득을 \u003cstrong>제3자에게 들이밀 수 없을 뿐\u003c/strong>이다.\u003c/p>\n\u003cp>\u003cstrong>「이중양도」의 처리\u003c/strong> — A가 자기 토지를 B에게 팔고, 다시 C에게도 판 경우.\u003c/p>\n\u003cp>176조만 보면 B가 이미 소유권을 취득했으므로 A는 무권리자이고 C는 아무것도 얻지 못해야 한다. 그런데 177조가 「B는 등기 없이는 C에게 대항할 수 없다」고 하므로, \u003cstrong>A는 아직 C에 대한 관계에서는 소유자로 취급되어 C에게도 유효하게 처분할 수 있다.\u003c/strong> 결과적으로 B와 C는 서로 상대방의 등기 결여를 주장할 수 있는 \u003cstrong>대항관계\u003c/strong>에 서고, \u003cstrong>먼저 등기를 갖춘 쪽이 완전한 소유권을 취득\u003c/strong>한다(등기를 얻지 못한 쪽은 확정적으로 권리를 잃고, 매도인에 대한 채무불이행·부당이득 문제만 남는다).\u003c/p>\n\u003cp>이때 \u003cstrong>C가 B의 매수 사실을 알고 있었더라도(단순 악의) C가 승리한다.\u003c/strong> 자유경쟁의 범위 내이기 때문이다. 다만 그 악의의 정도가 신의칙에 현저히 반하는 수준이면 \u003cstrong>\u003cspan>背信的悪意者\u003c/span>\u003c/strong>로서 177조의 제3자에서 제외된다.\u003c/p>\n\u003cp>\u003cstrong>177조의 「제3자」 — 누가 포함되고 누가 빠지는가\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>예\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>제3자에 포함（등기 없으면 대항 불가）\u003c/strong>\u003c/td>\u003ctd>이중양수인, 저당권자·지상권자 등 물권 취득자, \u003cstrong>단순 악의자\u003c/strong>, 부동산의 압류채권자, 임차인\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>제3자에서 제외（등기 없어도 대항 가능）\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>불법점거자·불법행위자\u003c/strong>(最判昭25.12.19), 무권리자 및 그로부터의 양수인, \u003cstrong>\u003cspan>背信的悪意者\u003c/span>\u003c/strong>, 전전(前主)·후주 등 당사자와 포괄승계인, 실체 없는 허위 등기명의인, 사기·강박으로 등기를 방해한 제3자(\u003cstrong>부동산등기법 5조\u003c/strong>)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>178조의 「인도」 — 네 가지 모두 포함된다\u003c/strong>\u003c/p>\n\u003cp>동산에 대해서는 인도가 대항요건이며, ① 현실의 인도(182조 1항) ② 간이의 인도(182조 2항) ③ \u003cstrong>점유개정(占有改定, 183조)\u003c/strong> ④ 지시에 의한 점유이전(指図による占有移転, 184조) 어느 것이라도 \u003cstrong>178조의 「인도」로 충분하다\u003c/strong>.\u003c/p>\n\u003cblockquote>\u003cstrong>대비: 178조의 「인도」 ↔ \u003cspan>即時取得\u003c/span>(192조)의 「점유를 시작」\u003c/strong>\u003cbr>178조는 \u003cstrong>점유개정으로도 OK\u003c/strong>이지만, 192조의 즉시취득은 \u003cstrong>점유개정으로는 성립하지 않는다\u003c/strong>(最判昭35.2.11). 같은 「인도」라는 말이 조문에 따라 요구 수준이 다르다는 점이 최대 함정.\u003c/blockquote>\n\u003ch2>학설\u003c/h2>\n\u003cp>\u003cstrong>177조의 「제3자」의 범위\u003c/strong>를 둘러싼 대립이다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>무제한설（文言説）\u003c/td>\u003ctd>조문에 아무 제한이 없으므로 \u003cstrong>당사자와 포괄승계인 이외의 모든 자\u003c/strong>가 제3자다\u003c/td>\u003ctd>불법점거자에게도 대항하지 못하게 되어 부당\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>제한설（正当利益説）\u003c/strong>\u003c/td>\u003ctd>제3자란 \u003cstrong>「당사자 또는 그 포괄승계인 이외의 자로서, 부동산 물권의 득실변경의 등기의 결여를 주장할 정당한 이익을 가진 자」\u003c/strong>를 말한다\u003c/td>\u003ctd>👉 \u003cstrong>판례·통설\u003c/strong>（大連判明41.12.15）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>선의자 한정설\u003c/td>\u003ctd>제3자를 \u003cstrong>선의자로 한정\u003c/strong>하고 악의자는 모두 제외해야 한다\u003c/td>\u003ctd>✕ \u003cstrong>판례는 채택하지 않음\u003c/strong>. 판례는 \u003cstrong>단순 악의자도 제3자에 포함\u003c/strong>시키고, 배신적 악의자만 예외적으로 제외한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>177조의 제3자의 의의\u003c/td>\u003ctd>大連判明41.12.15\u003c/td>\u003ctd>등기 없는 물권취득자에게 대항할 수 있는 자의 범위\u003c/td>\u003ctd>\u003cstrong>제한설 확립\u003c/strong>. 제3자란 「당사자 또는 그 포괄승계인 이외의 자로서 \u003cstrong>등기의 결여를 주장할 정당한 이익을 가진 자\u003c/strong>」를 말한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>불법점거자와 177조\u003c/td>\u003ctd>最判昭25.12.19\u003c/td>\u003ctd>등기를 갖추지 못한 매수인이 불법점거자에게 명도를 청구\u003c/td>\u003ctd>\u003cstrong>불법점거자는 177조의 제3자가 아니다.\u003c/strong> 등기 없이도 소유권을 주장하여 명도를 청구할 수 있다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>배신적 악의자의 배제\u003c/td>\u003ctd>最判昭43.8.2 / 民集22巻8号1571頁\u003c/td>\u003ctd>미등기 매수인의 점유를 알면서 비싸게 되팔 목적으로 매수 후 등기\u003c/td>\u003ctd>\u003cstrong>배신적 악의자는 「정당한 이익」이 없어 177조의 제3자에 해당하지 않는다\u003c/strong> → \u003cspan>背信的悪意者\u003c/span>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>점유개정과 즉시취득\u003c/td>\u003ctd>最判昭35.2.11 / 民集14巻2号168頁\u003c/td>\u003ctd>무권리자로부터 동산을 매수하고 점유개정으로 점유 취득\u003c/td>\u003ctd>외관상 종래의 점유 상태에 변경이 없는 \u003cstrong>점유개정으로는 192조가 적용되지 않는다\u003c/strong>（단, 178조의 대항요건으로는 충분）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「등기하지 않으면 소유권이 이전되지 않는다」는 지문은 오답.\u003c/strong> 176조의 의사주의에 의해 \u003cstrong>의사표시만으로 이미 이전\u003c/strong>되어 있다. 등기는 \u003cstrong>효력요건이 아니라 대항요건\u003c/strong>이다. 「대항할 수 없다 ≠ 무효」를 항상 되뇌라.\u003c/li>\u003cli>\u003cstrong>이중양도에서 제2양수인이 「악의」여도 등기를 먼저 하면 이긴다.\u003c/strong> 「악의의 제2양수인은 보호되지 않는다」는 지문은 \u003cstrong>오답\u003c/strong>. 보호되지 않는 것은 \u003cstrong>배신적\u003c/strong> 악의자뿐이다. → \u003cspan>背信的悪意者\u003c/span>\u003c/li>\u003cli>\u003cstrong>불법점거자·무권리자에게는 등기 없이도 이긴다.\u003c/strong> 「등기가 없으면 누구에게도 소유권을 주장할 수 없다」는 지문은 오답. 상대가 「정당한 이익」이 있는 자인지를 먼저 확인하라.\u003c/li>\u003cli>\u003cstrong>대비: 176조(효력) ↔ 177·178조(대항)\u003c/strong> / \u003cstrong>대비: 意思主義(일본·프랑스) ↔ 形式主義(독일, 등기가 효력요건)\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>동산은 점유개정으로도 대항요건 OK, 그러나 \u003cspan>即時取得\u003c/span>은 점유개정으로는 불가.\u003c/strong> 이 한 줄이 178조와 192조를 가르는 시험의 급소다.\u003c/li>\u003cli>부동산 이외의 공시방법도 함께: 수목·미분리 과실은 \u003cstrong>明認方法\u003c/strong>, 채권양도는 \u003cstrong>확정일자 있는 통지·승낙\u003c/strong>(467조), 법인의 동산양도는 \u003cstrong>동산양도등기\u003c/strong>(動産債権譲渡特例法). 조문 대상별로 대항요건이 다르다.\u003c/li>\u003c/ul>","search":"対抗要件主義 たいこうようけんしゅぎ 항목 내용 ------ ------ 읽기 たいこうようけんしゅぎ（대항요건주의） 과목 민법（물권） 한줄 정의 물권변동은 당사자의 의사표시만으로 효력이 생기지만 176조 , 이를 제3자에게 주장 대항 하려면 부동산은 등기 177조 , 동산은 인도 178조 라는 공시방법을 갖추어야 한다는 원칙 통설·판례 177조의 「제3자」는 「등기의 결여를 주장할 정당한 이익을 가진 자」 로 한정된다（ 제한설 , 大連判明41.12.15） 개념 일본 민법 176조 는 「物権の設定及び移転は、当事者の意思表示のみによって、その効力を生ずる」라고 하여 의사주의 意思主義 ·불요식주의 를 채택했다. 즉 매매계약이 성립하면 그 순간 소유권은 매수인에게 넘어간다. 등기나 인도는 효력요건이 아니다 등기를 효력요건으로 삼는 독일식 形式主義 와 정반대 . 그러나 의사표시만으로 물권이 움직인다면 밖에서 보는 제3자는 누가 소유자인지 알 수 없다. 그래서 민법은 177조 부동산: 「その登記をしなければ、第三者に対抗することができない」 와 178조 동산: 「その動産の引渡しがなければ、第三者に対抗することができない」 로 공시방법을 갖추지 못하면 제3자에게 주장할 수 없다 는 제동을 걸었다. 이것이 대항요건주의다. 여기서 「대항할 수 없다」는 「무효」가 아니다. 당사자 사이 a와 b 사이 에서는 등기가 없어도 완전히 유효하게 소유권이 이전되어 있다. 다만 그 취득을 제3자에게 들이밀 수 없을 뿐 이다. 「이중양도」의 처리 — a가 자기 토지를 b에게 팔고, 다시 c에게도 판 경우. 176조만 보면 b가 이미 소유권을 취득했으므로 a는 무권리자이고 c는 아무것도 얻지 못해야 한다. 그런데 177조가 「b는 등기 없이는 c에게 대항할 수 없다」고 하므로, a는 아직 c에 대한 관계에서는 소유자로 취급되어 c에게도 유효하게 처분할 수 있다. 결과적으로 b와 c는 서로 상대방의 등기 결여를 주장할 수 있는 대항관계 에 서고, 먼저 등기를 갖춘 쪽이 완전한 소유권을 취득 한다 등기를 얻지 못한 쪽은 확정적으로 권리를 잃고, 매도인에 대한 채무불이행·부당이득 문제만 남는다 . 이때 c가 b의 매수 사실을 알고 있었더라도 단순 악의 c가 승리한다. 자유경쟁의 범위 내이기 때문이다. 다만 그 악의의 정도가 신의칙에 현저히 반하는 수준이면 背信的悪意者 용어/背信的悪意者.md 로서 177조의 제3자에서 제외된다. 177조의 「제3자」 — 누가 포함되고 누가 빠지는가 구분 예 ------ ----- 제3자에 포함（등기 없으면 대항 불가） 이중양수인, 저당권자·지상권자 등 물권 취득자, 단순 악의자 , 부동산의 압류채권자, 임차인 제3자에서 제외（등기 없어도 대항 가능） 불법점거자·불법행위자 最判昭25.12.19 , 무권리자 및 그로부터의 양수인, 背信的悪意者 용어/背信的悪意者.md , 전전 前主 ·후주 등 당사자와 포괄승계인, 실체 없는 허위 등기명의인, 사기·강박으로 등기를 방해한 제3자 부동산등기법 5조 178조의 「인도」 — 네 가지 모두 포함된다 동산에 대해서는 인도가 대항요건이며, ① 현실의 인도 182조 1항 ② 간이의 인도 182조 2항 ③ 점유개정 占有改定, 183조 ④ 지시에 의한 점유이전 指図による占有移転, 184조 어느 것이라도 178조의 「인도」로 충분하다 . 대비: 178조의 「인도」 ↔ 即時取得 용어/即時取得.md 192조 의 「점유를 시작」 178조는 점유개정으로도 ok 이지만, 192조의 즉시취득은 점유개정으로는 성립하지 않는다 最判昭35.2.11 . 같은 「인도」라는 말이 조문에 따라 요구 수준이 다르다는 점이 최대 함정. 학설 177조의 「제3자」의 범위 를 둘러싼 대립이다. 학설 내용 비고 ------ ------ ------ 무제한설（文言説） 조문에 아무 제한이 없으므로 당사자와 포괄승계인 이외의 모든 자 가 제3자다 불법점거자에게도 대항하지 못하게 되어 부당 제한설（正当利益説） 제3자란 「당사자 또는 그 포괄승계인 이외의 자로서, 부동산 물권의 득실변경의 등기의 결여를 주장할 정당한 이익을 가진 자」 를 말한다 👉 판례·통설 （大連判明41.12.15） 선의자 한정설 제3자를 선의자로 한정 하고 악의자는 모두 제외해야 한다 ✕ 판례는 채택하지 않음 . 판례는 단순 악의자도 제3자에 포함 시키고, 배신적 악의자만 예외적으로 제외한다 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 177조의 제3자의 의의 大連判明41.12.15 등기 없는 물권취득자에게 대항할 수 있는 자의 범위 제한설 확립 . 제3자란 「당사자 또는 그 포괄승계인 이외의 자로서 등기의 결여를 주장할 정당한 이익을 가진 자 」를 말한다 불법점거자와 177조 最判昭25.12.19 등기를 갖추지 못한 매수인이 불법점거자에게 명도를 청구 불법점거자는 177조의 제3자가 아니다. 등기 없이도 소유권을 주장하여 명도를 청구할 수 있다 배신적 악의자의 배제 最判昭43.8.2 / 民集22巻8号1571頁 미등기 매수인의 점유를 알면서 비싸게 되팔 목적으로 매수 후 등기 배신적 악의자는 「정당한 이익」이 없어 177조의 제3자에 해당하지 않는다 → 背信的悪意者 용어/背信的悪意者.md 점유개정과 즉시취득 最判昭35.2.11 / 民集14巻2号168頁 무권리자로부터 동산을 매수하고 점유개정으로 점유 취득 외관상 종래의 점유 상태에 변경이 없는 점유개정으로는 192조가 적용되지 않는다 （단, 178조의 대항요건으로는 충분） 💡 수험 팁 - 「등기하지 않으면 소유권이 이전되지 않는다」는 지문은 오답. 176조의 의사주의에 의해 의사표시만으로 이미 이전 되어 있다. 등기는 효력요건이 아니라 대항요건 이다. 「대항할 수 없다 ≠ 무효」를 항상 되뇌라. - 이중양도에서 제2양수인이 「악의」여도 등기를 먼저 하면 이긴다. 「악의의 제2양수인은 보호되지 않는다」는 지문은 오답 . 보호되지 않는 것은 배신적 악의자뿐이다. → 背信的悪意者 용어/背信的悪意者.md - 불법점거자·무권리자에게는 등기 없이도 이긴다. 「등기가 없으면 누구에게도 소유권을 주장할 수 없다」는 지문은 오답. 상대가 「정당한 이익」이 있는 자인지를 먼저 확인하라. - 대비: 176조 효력 ↔ 177·178조 대항 / 대비: 意思主義 일본·프랑스 ↔ 形式主義 독일, 등기가 효력요건 . - 동산은 점유개정으로도 대항요건 ok, 그러나 即時取得 용어/即時取得.md 은 점유개정으로는 불가. 이 한 줄이 178조와 192조를 가르는 시험의 급소다. - 부동산 이외의 공시방법도 함께: 수목·미분리 과실은 明認方法 , 채권양도는 확정일자 있는 통지·승낙 467조 , 법인의 동산양도는 동산양도등기 動産債権譲渡特例法 . 조문 대상별로 대항요건이 다르다."},"議院内閣制":{"type":"term","subject":"용어","id":"議院内閣制","title":"議院内閣制","sub":"ぎいんないかくせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぎいんないかくせい（의원내각제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 내각）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>내각이 \u003cstrong>의회(국회)의 신임을 기초로 성립·존속\u003c/strong>하고, 행정권의 행사에 관해 \u003cstrong>국회에 연대하여 책임\u003c/strong>을 지는 제도(\u003cstrong>66조 3항\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>일본국헌법이 의원내각제를 채택했다는 점에는 다툼이 없음. 다만 \u003cstrong>본질 요소\u003c/strong>를 무엇으로 보는가에서 均衡本質説과 責任本質説이 대립\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>의원내각제는 입법부와 행정부가 일응 분리되면서도 \u003cstrong>행정부가 의회의 신임에 의존\u003c/strong>하는 통치 형태다. 일본국헌법의 관련 조문은 다음과 같다.\u003c/p>\n\u003cp>\u003cstrong>66조 3항\u003c/strong> — 「内閣は、行政権の行使について、国会に対し\u003cstrong>連帯して責任\u003c/strong>を負ふ」(연대책임의 원칙). \u003cstrong>67조 1항\u003c/strong> — 내각총리대신은 \u003cstrong>국회의원 중에서 국회의 의결로 지명\u003c/strong>한다. \u003cstrong>68조 1항\u003c/strong> — 국무대신은 총리가 임명하되 \u003cstrong>그 과반수는 국회의원\u003c/strong>이어야 한다. \u003cstrong>69조\u003c/strong> — 중의원이 불신임 결의안을 가결하거나 신임 결의안을 부결하면 내각은 \u003cstrong>10일 이내에 중의원을 해산\u003c/strong>하지 않는 한 \u003cstrong>총사직\u003c/strong>해야 한다. \u003cstrong>63조\u003c/strong> — 국무대신은 의석 유무와 관계없이 의원에 출석하여 발언할 수 있고, 답변·설명을 위해 출석을 요구받으면 \u003cstrong>출석해야 한다\u003c/strong>(권리이자 의무).\u003c/p>\n\u003cp>본질론에서는 두 견해가 대립한다. \u003cstrong>均衡本質説\u003c/strong>은 의회와 정부의 \u003cstrong>상호 견제·균형\u003c/strong>을 본질로 보아 \u003cstrong>정부의 의회 해산권을 불가결한 요소\u003c/strong>로 본다. \u003cstrong>責任本質説\u003c/strong>은 정부가 의회에 대해 지는 \u003cstrong>책임\u003c/strong>이야말로 본질이라고 보아 해산권은 필수가 아니라고 한다. 이 대립은 \u003cstrong>69조의 경우 이외에도 내각이 중의원을 해산할 수 있는가\u003c/strong>(이른바 \u003cstrong>7조 해산\u003c/strong>)라는 실천적 문제와 직결된다. 실무·통설은 \u003cstrong>7조 3호\u003c/strong>(천황의 국사행위로서의 중의원 해산)를 근거로 \u003cstrong>69조 외의 해산도 가능\u003c/strong>하다고 보며, 해산권의 실질적 주체는 \u003cstrong>내각\u003c/strong>이다. 다만 그 해산의 효력이 다투어진 苫米地事件에서 최고재는 \u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>에 의해 판단을 회피했다.\u003c/p>\n\u003cp>\u003cstrong>연대책임\u003c/strong>은 내각 전체가 하나로서 지는 책임이며, 개별 국무대신에 대한 \u003cstrong>단독 책임의 추궁을 배제하지 않는다\u003c/strong>는 것이 통설이다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>均衡本質説（균형본질설）\u003c/strong>\u003c/td>\u003ctd>의회와 정부의 \u003cstrong>균형·억제\u003c/strong>가 본질. 따라서 \u003cstrong>정부의 의회 해산권\u003c/strong>이 불가결한 요소\u003c/td>\u003ctd>69조 외의 해산(7조 해산)을 인정하는 방향으로 친화적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>責任本質説（책임본질설）\u003c/strong>\u003c/td>\u003ctd>정부의 의회에 대한 \u003cstrong>책임\u003c/strong>이 본질. 해산권은 의원내각제의 필수 요소가 아님\u003c/td>\u003ctd>현재 유력설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>苫米地事件\u003c/td>\u003ctd>最大判昭35.6.8 / 民集14巻7号1206頁\u003c/td>\u003ctd>\u003cstrong>7조에 의한 중의원 해산\u003c/strong>의 효력(69조를 전제하지 않은 해산의 적법성)\u003c/td>\u003ctd>해산은 「직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위」로 \u003cstrong>사법심사의 대상 밖\u003c/strong>. 유효·무효 자체는 판단하지 않음 → \u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>66조 3항의 「連帯して責任を負ふ」는 조문 그대로 나온다.\u003c/strong> 「국회에 대해」이지 「중의원에 대해」가 아니다.\u003c/li>\u003cli>숫자 함정: \u003cstrong>국무대신의 「과반수」가 국회의원\u003c/strong>(68조 1항). 「전원」도 「3분의 2」도 아니다. 총리는 \u003cstrong>반드시 국회의원\u003c/strong>(67조 1항)이어야 한다는 점과 구별.\u003c/li>\u003cli>\u003cstrong>69조의 10일\u003c/strong>: 불신임 가결 → \u003cstrong>10일 이내에 해산하지 않으면 총사직\u003c/strong>. \u003ca href=\"#/e/%E8%A1%86%E8%AD%B0%E9%99%A2%E3%81%AE%E5%84%AA%E8%B6%8A\">衆議院の優越\u003c/a>의 총리지명 10일과 헷갈리지 말 것.\u003c/li>\u003cli>대비: \u003cstrong>均衡本質説 = 해산권이 본질 요소\u003c/strong> ↔ \u003cstrong>責任本質説 = 책임이 본질, 해산권은 불필요\u003c/strong>. 「해산권을 본질로 보는 쪽이 어느 설인가」를 바꿔 놓는 것이 전형적 함정이다.\u003c/li>\u003cli>대비 개념: \u003cstrong>大統領制\u003c/strong>(행정부가 의회의 신임에 의존하지 않음), \u003cstrong>議会統治制·会議制\u003c/strong>(정부가 의회에 완전히 종속, 해산권 없음).\u003c/li>\u003cli>「연대책임이므로 개별 국무대신의 책임은 물을 수 없다」는 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003c/ul>","search":"議院内閣制 ぎいんないかくせい 항목 내용 ------ ------ 읽기 ぎいんないかくせい（의원내각제） 과목 헌법（통치기구 — 내각） 한줄 정의 내각이 의회 국회 의 신임을 기초로 성립·존속 하고, 행정권의 행사에 관해 국회에 연대하여 책임 을 지는 제도 66조 3항 통설·판례 일본국헌법이 의원내각제를 채택했다는 점에는 다툼이 없음. 다만 본질 요소 를 무엇으로 보는가에서 均衡本質説과 責任本質説이 대립 개념 의원내각제는 입법부와 행정부가 일응 분리되면서도 행정부가 의회의 신임에 의존 하는 통치 형태다. 일본국헌법의 관련 조문은 다음과 같다. 66조 3항 — 「内閣は、行政権の行使について、国会に対し 連帯して責任 を負ふ」 연대책임의 원칙 . 67조 1항 — 내각총리대신은 국회의원 중에서 국회의 의결로 지명 한다. 68조 1항 — 국무대신은 총리가 임명하되 그 과반수는 국회의원 이어야 한다. 69조 — 중의원이 불신임 결의안을 가결하거나 신임 결의안을 부결하면 내각은 10일 이내에 중의원을 해산 하지 않는 한 총사직 해야 한다. 63조 — 국무대신은 의석 유무와 관계없이 의원에 출석하여 발언할 수 있고, 답변·설명을 위해 출석을 요구받으면 출석해야 한다 권리이자 의무 . 본질론에서는 두 견해가 대립한다. 均衡本質説 은 의회와 정부의 상호 견제·균형 을 본질로 보아 정부의 의회 해산권을 불가결한 요소 로 본다. 責任本質説 은 정부가 의회에 대해 지는 책임 이야말로 본질이라고 보아 해산권은 필수가 아니라고 한다. 이 대립은 69조의 경우 이외에도 내각이 중의원을 해산할 수 있는가 이른바 7조 해산 라는 실천적 문제와 직결된다. 실무·통설은 7조 3호 천황의 국사행위로서의 중의원 해산 를 근거로 69조 외의 해산도 가능 하다고 보며, 해산권의 실질적 주체는 내각 이다. 다만 그 해산의 효력이 다투어진 苫米地事件에서 최고재는 統治行為論 용어/統治行為論.md 에 의해 판단을 회피했다. 연대책임 은 내각 전체가 하나로서 지는 책임이며, 개별 국무대신에 대한 단독 책임의 추궁을 배제하지 않는다 는 것이 통설이다. 학설 학설 내용 비고 ------ ------ ------ 均衡本質説（균형본질설） 의회와 정부의 균형·억제 가 본질. 따라서 정부의 의회 해산권 이 불가결한 요소 69조 외의 해산 7조 해산 을 인정하는 방향으로 친화적 責任本質説（책임본질설） 정부의 의회에 대한 책임 이 본질. 해산권은 의원내각제의 필수 요소가 아님 현재 유력설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 苫米地事件 最大判昭35.6.8 / 民集14巻7号1206頁 7조에 의한 중의원 해산 의 효력 69조를 전제하지 않은 해산의 적법성 해산은 「직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위」로 사법심사의 대상 밖 . 유효·무효 자체는 판단하지 않음 → 統治行為論 용어/統治行為論.md 💡 수험 팁 - 66조 3항의 「連帯して責任を負ふ」는 조문 그대로 나온다. 「국회에 대해」이지 「중의원에 대해」가 아니다. - 숫자 함정: 국무대신의 「과반수」가 국회의원 68조 1항 . 「전원」도 「3분의 2」도 아니다. 총리는 반드시 국회의원 67조 1항 이어야 한다는 점과 구별. - 69조의 10일 : 불신임 가결 → 10일 이내에 해산하지 않으면 총사직 . 衆議院の優越 용어/衆議院の優越.md 의 총리지명 10일과 헷갈리지 말 것. - 대비: 均衡本質説 = 해산권이 본질 요소 ↔ 責任本質説 = 책임이 본질, 해산권은 불필요 . 「해산권을 본질로 보는 쪽이 어느 설인가」를 바꿔 놓는 것이 전형적 함정이다. - 대비 개념: 大統領制 행정부가 의회의 신임에 의존하지 않음 , 議会統治制·会議制 정부가 의회에 완전히 종속, 해산권 없음 . - 「연대책임이므로 개별 국무대신의 책임은 물을 수 없다」는 오답 ."},"国会単独立法の原則":{"type":"term","subject":"용어","id":"国会単独立法の原則","title":"国会単独立法の原則","sub":"こっかいたんどくりっぽうのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>\u003cstrong>こっかいたんどくりっぽうのげんそく\u003c/strong>（국회단독입법의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 국회）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국회의 입법은 헌법에 특별한 정함이 있는 경우를 제외하고 \u003cstrong>다른 기관의 관여 없이 국회의 의결만으로\u003c/strong> 성립한다는 원칙(41조)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>41조의 「唯一の立法機関」의 두 가지 의미 중 하나. 다른 하나는 \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E4%B8%AD%E5%BF%83%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会中心立法の原則\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>41조\u003c/strong>의 「国の\u003cstrong>唯一\u003c/strong>の立法機関」 중 \u003cstrong>입법 절차의 완결성\u003c/strong>에 관한 측면이 국회단독입법의 원칙이다. 이를 구체화한 것이 \u003cstrong>59조 1항\u003c/strong>으로, 「法律案は、この憲法に特別の定のある場合を除いては、\u003cstrong>両議院で可決したとき法律となる\u003c/strong>」라고 하여 \u003cstrong>양원의 가결만으로 법률이 성립\u003c/strong>함을 명시한다. 천황의 재가나 다른 기관의 동의는 필요하지 않다.\u003c/p>\n\u003cp>\u003cstrong>헌법이 정한 예외는 하나뿐이다\u003c/strong> — \u003cstrong>95조의 지방자치특별법 주민투표\u003c/strong>. 「一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の\u003cstrong>住民の投票においてその過半数の同意\u003c/strong>を得なければ、国会は、これを制定することができない」. 여기서는 국회의 의결만으로는 법률이 성립하지 않고 \u003cstrong>주민투표라는 국회 외부의 절차\u003c/strong>가 필요하므로 원칙의 예외가 된다.\u003c/p>\n\u003cp>\u003cstrong>예외가 아닌 것\u003c/strong>의 구별이 시험 포인트다. ① \u003cstrong>천황의 공포\u003c/strong>(\u003cstrong>7조 1호\u003c/strong>)는 법률이 이미 성립한 뒤의 \u003cstrong>형식적·의례적 행위\u003c/strong>이므로 성립 절차에의 관여가 아니다. ② \u003cstrong>내각의 법률안 제출권\u003c/strong>(내각법 5조)은 논의가 있으나, 통설은 \u003cstrong>원칙에 반하지 않는다\u003c/strong>고 본다. 국회가 제출된 법안을 자유롭게 수정·부결할 수 있고, \u003ca href=\"#/e/%E8%AD%B0%E9%99%A2%E5%86%85%E9%96%A3%E5%88%B6\">議院内閣制\u003c/a> 아래에서 내각 구성원 다수가 국회의원이기 때문이다. 참고로 국회의원의 법률안 발의에는 \u003cstrong>국회법 56조 1항\u003c/strong>의 찬성자 수 요건이 있다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>내각의 법률안 제출권 — \u003cstrong>합헌설\u003c/strong>\u003c/td>\u003ctd>국회가 자유로이 수정·부결할 수 있고 의원내각제와도 조화\u003c/td>\u003ctd>👉 \u003cstrong>통설\u003c/strong>. 내각법 5조도 명시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>내각의 법률안 제출권 — 위헌설\u003c/td>\u003ctd>「국회 단독」에 반하며 41조의 취지에 저촉\u003c/td>\u003ctd>소수설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>천황의 공포의 성질\u003c/td>\u003ctd>성립 후의 형식적 행위이므로 \u003cstrong>예외가 아님\u003c/strong>\u003c/td>\u003ctd>다툼 없음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>읽기 주의\u003c/strong>: 単独은 \u003cstrong>たんどく\u003c/strong>. 「こくかいどくりつ」가 아니다.\u003c/li>\u003cli>\u003cstrong>예외는 오직 하나: 95조 지방자치특별법의 주민투표(과반수 동의).\u003c/strong> 「지방자치특별법」의 정의(\u003cstrong>하나의 지방공공단체에만 적용되는 특별법\u003c/strong>)까지 세트로 외울 것.\u003c/li>\u003cli>\u003cstrong>함정 1\u003c/strong>: 「천황의 공포(7조 1호)는 국회단독입법의 원칙의 예외다」 → \u003cstrong>오답\u003c/strong>. 형식적 행위일 뿐이다.\u003c/li>\u003cli>\u003cstrong>함정 2\u003c/strong>: 「내각의 법률안 제출은 국회단독입법의 원칙에 반하여 허용되지 않는다」 → \u003cstrong>오답\u003c/strong>(통설은 합헌, 내각법 5조).\u003c/li>\u003cli>\u003cstrong>두 원칙의 예외를 절대 섞지 마라.\u003c/strong> \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E4%B8%AD%E5%BF%83%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会中心立法の原則\u003c/a>의 예외 = \u003cstrong>58조 2항 議院規則·77조 1항 最高裁判所規則\u003c/strong> / \u003cstrong>国会単独立法의 원칙\u003c/strong>의 예외 = \u003cstrong>95조 주민투표\u003c/strong>. 시험은 이 두 세트를 바꿔 놓고 낸다.\u003c/li>\u003cli>조문 세트: \u003cstrong>41조\u003c/strong>(유일한 입법기관) → \u003cstrong>59조 1항\u003c/strong>(양원 가결로 법률 성립) → \u003cstrong>95조\u003c/strong>(예외).\u003c/li>\u003c/ul>","search":"国会単独立法の原則 こっかいたんどくりっぽうのげんそく 항목 내용 ------ ------ 읽기 こっかいたんどくりっぽうのげんそく （국회단독입법의 원칙） 과목 헌법（통치기구 — 국회） 한줄 정의 국회의 입법은 헌법에 특별한 정함이 있는 경우를 제외하고 다른 기관의 관여 없이 국회의 의결만으로 성립한다는 원칙 41조 통설·판례 41조의 「唯一の立法機関」의 두 가지 의미 중 하나. 다른 하나는 国会中心立法の原則 용어/国会中心立法の原則.md 개념 41조 의 「国の 唯一 の立法機関」 중 입법 절차의 완결성 에 관한 측면이 국회단독입법의 원칙이다. 이를 구체화한 것이 59조 1항 으로, 「法律案は、この憲法に特別の定のある場合を除いては、 両議院で可決したとき法律となる 」라고 하여 양원의 가결만으로 법률이 성립 함을 명시한다. 천황의 재가나 다른 기관의 동의는 필요하지 않다. 헌법이 정한 예외는 하나뿐이다 — 95조의 지방자치특별법 주민투표 . 「一の地方公共団体のみに適用される特別法は、法律の定めるところにより、その地方公共団体の 住民の投票においてその過半数の同意 を得なければ、国会は、これを制定することができない」. 여기서는 국회의 의결만으로는 법률이 성립하지 않고 주민투표라는 국회 외부의 절차 가 필요하므로 원칙의 예외가 된다. 예외가 아닌 것 의 구별이 시험 포인트다. ① 천황의 공포 7조 1호 는 법률이 이미 성립한 뒤의 형식적·의례적 행위 이므로 성립 절차에의 관여가 아니다. ② 내각의 법률안 제출권 내각법 5조 은 논의가 있으나, 통설은 원칙에 반하지 않는다 고 본다. 국회가 제출된 법안을 자유롭게 수정·부결할 수 있고, 議院内閣制 용어/議院内閣制.md 아래에서 내각 구성원 다수가 국회의원이기 때문이다. 참고로 국회의원의 법률안 발의에는 국회법 56조 1항 의 찬성자 수 요건이 있다. 학설 학설 내용 비고 ------ ------ ------ 내각의 법률안 제출권 — 합헌설 국회가 자유로이 수정·부결할 수 있고 의원내각제와도 조화 👉 통설 . 내각법 5조도 명시 내각의 법률안 제출권 — 위헌설 「국회 단독」에 반하며 41조의 취지에 저촉 소수설 천황의 공포의 성질 성립 후의 형식적 행위이므로 예외가 아님 다툼 없음 💡 수험 팁 - 읽기 주의 : 単独은 たんどく . 「こくかいどくりつ」가 아니다. - 예외는 오직 하나: 95조 지방자치특별법의 주민투표 과반수 동의 . 「지방자치특별법」의 정의 하나의 지방공공단체에만 적용되는 특별법 까지 세트로 외울 것. - 함정 1 : 「천황의 공포 7조 1호 는 국회단독입법의 원칙의 예외다」 → 오답 . 형식적 행위일 뿐이다. - 함정 2 : 「내각의 법률안 제출은 국회단독입법의 원칙에 반하여 허용되지 않는다」 → 오답 통설은 합헌, 내각법 5조 . - 두 원칙의 예외를 절대 섞지 마라. 国会中心立法の原則 용어/国会中心立法の原則.md 의 예외 = 58조 2항 議院規則·77조 1항 最高裁判所規則 / 国会単独立法의 원칙 의 예외 = 95조 주민투표 . 시험은 이 두 세트를 바꿔 놓고 낸다. - 조문 세트: 41조 유일한 입법기관 → 59조 1항 양원 가결로 법률 성립 → 95조 예외 ."},"国会中心立法の原則":{"type":"term","subject":"용어","id":"国会中心立法の原則","title":"国会中心立法の原則","sub":"こっかいちゅうしんりっぽうのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>こっかいちゅうしんりっぽうのげんそく（국회중심입법의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 국회）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>실질적 의미의 입법\u003c/strong>은 헌법에 특별한 정함이 있는 경우를 제외하고 \u003cstrong>국회가 독점\u003c/strong>한다는 원칙(41조)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>41조의 「唯一の立法機関」의 두 가지 의미 중 하나. 다른 하나는 \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E5%8D%98%E7%8B%AC%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会単独立法の原則\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 \u003cstrong>41조\u003c/strong>는 「国会は、国権の最高機関であつて、\u003cstrong>国の唯一の立法機関\u003c/strong>である」라고 한다. 여기서 「唯一」에는 두 가지 의미가 담겨 있다고 해석되는데, 그중 \u003cstrong>입법권의 독점(=다른 기관이 입법하지 못한다)\u003c/strong>을 가리키는 것이 \u003cstrong>국회중심입법의 원칙\u003c/strong>이고, \u003cstrong>입법 절차의 완결성(=다른 기관의 관여 없이 국회만으로 성립한다)\u003c/strong>을 가리키는 것이 \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E5%8D%98%E7%8B%AC%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会単独立法の原則\u003c/a>이다.\u003c/p>\n\u003cp>여기서 말하는 「입법」은 「○○법」이라는 형식을 갖춘 것(\u003cstrong>형식적 의미의 입법\u003c/strong>)이 아니라 \u003cstrong>실질적 의미의 입법\u003c/strong>, 즉 \u003cstrong>국민의 권리를 제한하거나 의무를 부과하는 일반적·추상적 법규범(法規)\u003c/strong>을 말한다는 것이 통설이다.\u003c/p>\n\u003cp>\u003cstrong>헌법이 스스로 정한 예외\u003c/strong>는 두 개다. ① \u003cstrong>양 의원의 규칙제정권\u003c/strong>(\u003cstrong>58조 2항\u003c/strong>) — 각 의원이 회의 그 밖의 절차 및 내부 규율에 관한 규칙을 정할 수 있다. ② \u003cstrong>최고재판소의 규칙제정권\u003c/strong>(\u003cstrong>77조 1항\u003c/strong>) — 소송에 관한 절차, 변호사, 재판소의 내부 규율 및 사법사무 처리에 관한 사항에 대해 규칙을 정할 수 있다. 이 둘은 각각 \u003cstrong>의원 자율권\u003c/strong>과 \u003cstrong>사법권의 독립\u003c/strong>을 근거로 헌법이 직접 인정한 것이다.\u003c/p>\n\u003cp>반면 \u003cstrong>예외가 아닌 것\u003c/strong>을 구별하는 것이 시험의 핵심이다. \u003cstrong>내각의 政令\u003c/strong>(73조 6호)은 헌법 및 법률의 규정을 \u003cstrong>실시하기 위한\u003c/strong> 것이거나 \u003cstrong>법률의 위임\u003c/strong>에 근거한 것이므로 국회의 입법권을 침해하지 않아 예외가 아니다(단, \u003cstrong>정령에 벌칙을 두려면 법률의 위임이 필요\u003c/strong>하다 — 73조 6호 단서). 지방공공단체의 \u003cstrong>조례제정권\u003c/strong>(94조)도 주민의 대표기관이 정하는 자주입법이므로 예외가 아니라고 보는 견해가 유력하다(헌법이 인정한 예외로 보는 견해도 있다).\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>「입법」= 실질적 의미의 입법설\u003c/td>\u003ctd>41조의 입법은 \u003cstrong>法規\u003c/strong>(국민의 권리·의무에 관한 법규범)를 말함\u003c/td>\u003ctd>👉 통설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般的·抽象的法規範説\u003c/td>\u003ctd>대상·사안이 특정되지 않은 \u003cstrong>일반적·추상적\u003c/strong> 법규범 전반을 가리킴\u003c/td>\u003ctd>현재 유력. 처분적 법률의 한계 논의와 연결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조례의 위치づけ\u003c/td>\u003ctd>① 예외가 아니다(자주입법설, 유력) / ② 헌법이 인정한 예외다\u003c/td>\u003ctd>어느 설이든 \u003cstrong>조례로 벌칙 제정 가능\u003c/strong>(地方自治法 14조 3항)이라는 결론은 같음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>예외 2개를 기계적으로 외워라: 議院規則(58조 2항)·最高裁判所規則(77조 1항).\u003c/strong> 조문 번호까지 함께 나온다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「내각의 정령은 국회중심입법의 원칙의 \u003cstrong>예외\u003c/strong>이다」는 지문 → 통설은 \u003cstrong>예외가 아니다\u003c/strong>(법률의 위임·집행을 위한 것이므로). 위임입법 자체가 허용된다는 점과 혼동하지 말 것.\u003c/li>\u003cli>벌칙 관련 숫자 정리: \u003cstrong>정령의 벌칙 = 법률의 위임 필요(73조 6호 단서)\u003c/strong> / \u003cstrong>조례의 벌칙 = 지방자치법 14조 3항이 상한을 정함\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>두 원칙의 구별이 진짜 함정이다.\u003c/strong> 「국회 \u003cstrong>중심\u003c/strong>」 = 다른 기관이 입법하면 안 됨(입법권의 \u003cstrong>독점\u003c/strong>) / 「국회 \u003cstrong>단독\u003c/strong>」 = 다른 기관이 절차에 끼어들면 안 됨(절차의 \u003cstrong>완결\u003c/strong>). 예외도 다르다: 중심 → \u003cstrong>58조 2항·77조 1항\u003c/strong> / 단독 → \u003cstrong>95조 주민투표\u003c/strong>.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E5%8D%98%E7%8B%AC%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会単独立法の原則\u003c/a>.\u003c/li>\u003c/ul>","search":"国会中心立法の原則 こっかいちゅうしんりっぽうのげんそく 항목 내용 ------ ------ 읽기 こっかいちゅうしんりっぽうのげんそく（국회중심입법의 원칙） 과목 헌법（통치기구 — 국회） 한줄 정의 실질적 의미의 입법 은 헌법에 특별한 정함이 있는 경우를 제외하고 국회가 독점 한다는 원칙 41조 통설·판례 41조의 「唯一の立法機関」의 두 가지 의미 중 하나. 다른 하나는 国会単独立法の原則 용어/国会単独立法の原則.md 개념 헌법 41조 는 「国会は、国権の最高機関であつて、 国の唯一の立法機関 である」라고 한다. 여기서 「唯一」에는 두 가지 의미가 담겨 있다고 해석되는데, 그중 입법권의 독점 =다른 기관이 입법하지 못한다 을 가리키는 것이 국회중심입법의 원칙 이고, 입법 절차의 완결성 =다른 기관의 관여 없이 국회만으로 성립한다 을 가리키는 것이 国会単独立法の原則 용어/国会単独立法の原則.md 이다. 여기서 말하는 「입법」은 「○○법」이라는 형식을 갖춘 것 형식적 의미의 입법 이 아니라 실질적 의미의 입법 , 즉 국민의 권리를 제한하거나 의무를 부과하는 일반적·추상적 법규범 法規 을 말한다는 것이 통설이다. 헌법이 스스로 정한 예외 는 두 개다. ① 양 의원의 규칙제정권 58조 2항 — 각 의원이 회의 그 밖의 절차 및 내부 규율에 관한 규칙을 정할 수 있다. ② 최고재판소의 규칙제정권 77조 1항 — 소송에 관한 절차, 변호사, 재판소의 내부 규율 및 사법사무 처리에 관한 사항에 대해 규칙을 정할 수 있다. 이 둘은 각각 의원 자율권 과 사법권의 독립 을 근거로 헌법이 직접 인정한 것이다. 반면 예외가 아닌 것 을 구별하는 것이 시험의 핵심이다. 내각의 政令 73조 6호 은 헌법 및 법률의 규정을 실시하기 위한 것이거나 법률의 위임 에 근거한 것이므로 국회의 입법권을 침해하지 않아 예외가 아니다 단, 정령에 벌칙을 두려면 법률의 위임이 필요 하다 — 73조 6호 단서 . 지방공공단체의 조례제정권 94조 도 주민의 대표기관이 정하는 자주입법이므로 예외가 아니라고 보는 견해가 유력하다 헌법이 인정한 예외로 보는 견해도 있다 . 학설 학설 내용 비고 ------ ------ ------ 「입법」= 실질적 의미의 입법설 41조의 입법은 法規 국민의 권리·의무에 관한 법규범 를 말함 👉 통설 一般的·抽象的法規範説 대상·사안이 특정되지 않은 일반적·추상적 법규범 전반을 가리킴 현재 유력. 처분적 법률의 한계 논의와 연결 조례의 위치づけ ① 예외가 아니다 자주입법설, 유력 / ② 헌법이 인정한 예외다 어느 설이든 조례로 벌칙 제정 가능 地方自治法 14조 3항 이라는 결론은 같음 💡 수험 팁 - 예외 2개를 기계적으로 외워라: 議院規則 58조 2항 ·最高裁判所規則 77조 1항 . 조문 번호까지 함께 나온다. - 최대 함정 : 「내각의 정령은 국회중심입법의 원칙의 예외 이다」는 지문 → 통설은 예외가 아니다 법률의 위임·집행을 위한 것이므로 . 위임입법 자체가 허용된다는 점과 혼동하지 말 것. - 벌칙 관련 숫자 정리: 정령의 벌칙 = 법률의 위임 필요 73조 6호 단서 / 조례의 벌칙 = 지방자치법 14조 3항이 상한을 정함 . - 두 원칙의 구별이 진짜 함정이다. 「국회 중심 」 = 다른 기관이 입법하면 안 됨 입법권의 독점 / 「국회 단독 」 = 다른 기관이 절차에 끼어들면 안 됨 절차의 완결 . 예외도 다르다: 중심 → 58조 2항·77조 1항 / 단독 → 95조 주민투표 . - 대비: 国会単独立法の原則 용어/国会単独立法の原則.md ."},"消極目的規制":{"type":"term","subject":"용어","id":"消極目的規制","title":"消極目的規制","sub":"しょうきょくもくてききせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しょうきょくもくてききせい（소극목적 규제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（경제적 자유권·위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국민의 생명·건강·안전에 대한 위해를 방지하기 위한 \u003cstrong>경찰적(警察的) 규제\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>으로 심사. 薬事法距離制限事件(最大判昭50.4.30)에서 \u003cstrong>위헌\u003c/strong> 결론\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>消極目的規制\u003c/strong>는 「사회에 이미 존재하는 해악·위험을 막는다」는 목적의 규제다. 다른 이름은 \u003cstrong>警察目的規制\u003c/strong>(경찰목적 규제). 여기서 '경찰'은 조직으로서의 경찰이 아니라, 강학상 「사회공공의 안녕질서에 대한 장해를 제거·예방하는 작용」을 뜻한다. 헌법 22조 1항의 「공공의 복지」를 \u003cstrong>소극적·방어적으로\u003c/strong> 읽은 것이다.\u003c/p>\n\u003cp>구체적으로는 식품위생 규제, 의약품 규제, 건축 규제, 유해물질 취급 규제, 각종 영업허가의 시설·인적 요건 등이 여기에 속한다. 「이 영업을 아무나 하게 두면 사람이 다친다」는 논리가 붙으면 소극목적이다.\u003c/p>\n\u003cp>심사가 상대적으로 \u003cstrong>엄격\u003c/strong>한 이유는 판단의 성질에 있다. 「무엇이 위험한가」, 「그 위험이 실제로 발생하는가」는 사실적·과학적으로 검증할 수 있는 문제이고, 법원도 증거에 기초해 판단할 수 있다. 반대로 \u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>가 다루는 「어떤 산업 구조가 바람직한가」는 정책적 가치판단이라 법원이 대신할 수 없다. 그래서 소극목적에는 입법재량을 덜 인정하고, \u003cstrong>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>\u003c/strong>(목적의 중요성 + 더 완화된 수단으로는 목적을 충분히 달성할 수 없을 것)을 적용한다.\u003c/p>\n\u003cp>대표 판례인 \u003cstrong>薬事法距離制限事件\u003c/strong>(最大判昭50.4.30)에서 최고재는, 허가제는 직업의 자유에 대한 \u003cstrong>강력한 제한\u003c/strong>이므로 「중요한 공공의 이익을 위해 필요하고 합리적인 조치」일 것을 요하고, 나아가 그것이 소극목적 규제인 경우에는 「\u003cstrong>보다 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다\u003c/strong>고 인정될 것」을 요한다고 판시했다. 그 위에서 「약국이 난립하면 과당경쟁이 생기고, 경영이 불안정해져 불량의약품이 공급된다」는 국가 측 설명은 \u003cstrong>관념적인 추론에 그치고 확실한 근거(입법사실)가 없다\u003c/strong>고 배척하여, 거리제한 규정을 헌법 22조 1항 위반으로 \u003cstrong>위헌\u003c/strong>이라 했다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限事件（약사법 거리제한）\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설 허가에 적정배치(거리제한) 요건을 붙인 약사법·현 조례\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（22조 1항）. 소극목적 → 엄격한 합리성. 「난립 → 불량의약품」의 인과가 입법사실로 뒷받침되지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（구 판결）\u003c/td>\u003ctd>最大判昭30.1.26 / 刑集9巻1号89頁\u003c/td>\u003ctd>공중목욕탕 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 난립에 따른 경영 불안정과 그로 인한 \u003cstrong>위생 저하 방지\u003c/strong>（소극목적적 설명）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（별건）\u003c/td>\u003ctd>最三小判平元.3.7 / 判時1308号111頁\u003c/td>\u003ctd>같은 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 위생 확보(소극)와 시설 확보(적극)를 \u003cstrong>함께\u003c/strong> 든 복합목적 판단\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件（대비용）\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 이쪽은 \u003cstrong>적극목적\u003c/strong> → \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>함정 1\u003c/strong>: 薬事法距離制限事件에서 위헌이 된 것은 「\u003cstrong>거리제한(적정배치) 요건\u003c/strong>」이지, \u003cstrong>허가제 자체가 아니다\u003c/strong>. 「약국의 허가제를 위헌으로 했다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>함정 2\u003c/strong>: 위반 조문은 \u003cstrong>22조 1항(직업선택의 자유)\u003c/strong>이다. 29조(재산권)로 바꿔 놓은 지문에 주의. 29조 위반 위헌 판결은 森林法共有林事件(最大判昭62.4.22) 쪽이다.\u003c/li>\u003cli>소극목적이라고 해서 \u003cstrong>반드시 위헌은 아니다\u003c/strong>. 公衆浴場(最大判昭30.1.26)은 소극목적적 설명으로도 합헌이 되었다. 「소극목적 = 위헌」이 아니라 「소극목적 = 심사가 엄격해진다」가 정확하다.\u003c/li>\u003cli>대비: \u003cstrong>消極目的規制(위해 방지·경찰목적) ↔ \u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>(약자 보호·정책목적)\u003c/strong>. 판별 요령은 「\u003cstrong>막으려는 나쁜 일이 있으면 소극, 만들려는 좋은 상태가 있으면 적극\u003c/strong>」.\u003c/li>\u003cli>심사 강도 서열: \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>·엄격심사(정신적 자유) &gt; \u003cstrong>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(소극목적)\u003c/strong> &gt; \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>(적극목적). 소극목적은 \u003cstrong>경제적 자유 안에서 상대적으로 엄격한 쪽\u003c/strong>일 뿐, 표현의 자유만큼 엄격하게 보지는 않는다는 점이 핵심이다.\u003c/li>\u003cli>목적 분류 자체가 다투어지는 사안이 있다는 점(公衆浴場의 변천, 酒類販売免許制事件)까지 함께 정리해 두면 \u003ca href=\"#/e/%E8%A6%8F%E5%88%B6%E7%9B%AE%E7%9A%84%E4%BA%8C%E5%88%86%E8%AB%96\">規制目的二分論\u003c/a> 문제를 통째로 커버할 수 있다.\u003c/li>\u003c/ul>","search":"消極目的規制 しょうきょくもくてききせい 항목 내용 ------ ------ 읽기 しょうきょくもくてききせい（소극목적 규제） 과목 헌법（경제적 자유권·위헌심사기준） 한줄 정의 국민의 생명·건강·안전에 대한 위해를 방지하기 위한 경찰적 警察的 규제 통설·판례 厳格な合理性の基準 용어/厳格な合理性の基準.md 으로 심사. 薬事法距離制限事件 最大判昭50.4.30 에서 위헌 결론 개념 消極目的規制 는 「사회에 이미 존재하는 해악·위험을 막는다」는 목적의 규제다. 다른 이름은 警察目的規制 경찰목적 규제 . 여기서 '경찰'은 조직으로서의 경찰이 아니라, 강학상 「사회공공의 안녕질서에 대한 장해를 제거·예방하는 작용」을 뜻한다. 헌법 22조 1항의 「공공의 복지」를 소극적·방어적으로 읽은 것이다. 구체적으로는 식품위생 규제, 의약품 규제, 건축 규제, 유해물질 취급 규제, 각종 영업허가의 시설·인적 요건 등이 여기에 속한다. 「이 영업을 아무나 하게 두면 사람이 다친다」는 논리가 붙으면 소극목적이다. 심사가 상대적으로 엄격 한 이유는 판단의 성질에 있다. 「무엇이 위험한가」, 「그 위험이 실제로 발생하는가」는 사실적·과학적으로 검증할 수 있는 문제이고, 법원도 증거에 기초해 판단할 수 있다. 반대로 積極目的規制 용어/積極目的規制.md 가 다루는 「어떤 산업 구조가 바람직한가」는 정책적 가치판단이라 법원이 대신할 수 없다. 그래서 소극목적에는 입법재량을 덜 인정하고, 厳格な合理性の基準 용어/厳格な合理性の基準.md 목적의 중요성 + 더 완화된 수단으로는 목적을 충분히 달성할 수 없을 것 을 적용한다. 대표 판례인 薬事法距離制限事件 最大判昭50.4.30 에서 최고재는, 허가제는 직업의 자유에 대한 강력한 제한 이므로 「중요한 공공의 이익을 위해 필요하고 합리적인 조치」일 것을 요하고, 나아가 그것이 소극목적 규제인 경우에는 「 보다 완화된 규제수단으로는 그 목적을 충분히 달성할 수 없다 고 인정될 것」을 요한다고 판시했다. 그 위에서 「약국이 난립하면 과당경쟁이 생기고, 경영이 불안정해져 불량의약품이 공급된다」는 국가 측 설명은 관념적인 추론에 그치고 확실한 근거 입법사실 가 없다 고 배척하여, 거리제한 규정을 헌법 22조 1항 위반으로 위헌 이라 했다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 薬事法距離制限事件（약사법 거리제한） 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설 허가에 적정배치 거리제한 요건을 붙인 약사법·현 조례 위헌 （22조 1항）. 소극목적 → 엄격한 합리성. 「난립 → 불량의약품」의 인과가 입법사실로 뒷받침되지 않음 公衆浴場距離制限事件（구 판결） 最大判昭30.1.26 / 刑集9巻1号89頁 공중목욕탕 거리제한 합헌 . 난립에 따른 경영 불안정과 그로 인한 위생 저하 방지 （소극목적적 설명） 公衆浴場距離制限事件（별건） 最三小判平元.3.7 / 判時1308号111頁 같은 거리제한 합헌 . 위생 확보 소극 와 시설 확보 적극 를 함께 든 복합목적 판단 小売市場距離制限事件（대비용） 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 개설 허가의 거리제한 합헌 . 이쪽은 적극목적 → 明白性の原則 용어/明白性の原則.md 💡 수험 팁 - 함정 1 : 薬事法距離制限事件에서 위헌이 된 것은 「 거리제한 적정배치 요건 」이지, 허가제 자체가 아니다 . 「약국의 허가제를 위헌으로 했다」는 지문은 오답. - 함정 2 : 위반 조문은 22조 1항 직업선택의 자유 이다. 29조 재산권 로 바꿔 놓은 지문에 주의. 29조 위반 위헌 판결은 森林法共有林事件 最大判昭62.4.22 쪽이다. - 소극목적이라고 해서 반드시 위헌은 아니다 . 公衆浴場 最大判昭30.1.26 은 소극목적적 설명으로도 합헌이 되었다. 「소극목적 = 위헌」이 아니라 「소극목적 = 심사가 엄격해진다」가 정확하다. - 대비: 消極目的規制 위해 방지·경찰목적 ↔ 積極目的規制 용어/積極目的規制.md 약자 보호·정책목적 . 판별 요령은 「 막으려는 나쁜 일이 있으면 소극, 만들려는 좋은 상태가 있으면 적극 」. - 심사 강도 서열: lra基準 용어/lra基準.md ·엄격심사 정신적 자유 厳格な合理性の基準 용어/厳格な合理性の基準.md 소극목적 明白性の原則 용어/明白性の原則.md 적극목적 . 소극목적은 경제적 자유 안에서 상대적으로 엄격한 쪽 일 뿐, 표현의 자유만큼 엄격하게 보지는 않는다는 점이 핵심이다. - 목적 분류 자체가 다투어지는 사안이 있다는 점 公衆浴場의 변천, 酒類販売免許制事件 까지 함께 정리해 두면 規制目的二分論 용어/規制目的二分論.md 문제를 통째로 커버할 수 있다."},"政教分離原則":{"type":"term","subject":"용어","id":"政教分離原則","title":"政教分離原則","sub":"せいきょうぶんりげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>せいきょうぶんりげんそく（정교분리원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（신교의 자유 · 20조 1항 후단·3항, 89조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국가는 종교에 대해 중립적이어야 하며 특정 종교와 결합하거나 이를 원조·압박해서는 안 된다는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>제도적 보장\u003c/strong>（制度的保障）. 완전분리가 아니라 국가와 종교의 관계가 \u003cstrong>상당하다고 인정되는 한도를 넘는\u003c/strong> 경우만 금지（\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a> 最大判昭52.7.13）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>일본국헌법은 정교분리를 세 개의 조문에 나누어 규정한다.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>20조 1항 후단\u003c/strong>: 「어떠한 종교단체도 국가로부터 \u003cstrong>특권\u003c/strong>을 받거나, \u003cstrong>정치상의 권력\u003c/strong>을 행사해서는 안 된다」\u003c/li>\u003cli>\u003cstrong>20조 3항\u003c/strong>: 「국가 및 그 기관은 종교교육 그 밖에 어떠한 \u003cstrong>종교적 활동\u003c/strong>도 해서는 안 된다」\u003c/li>\u003cli>\u003cstrong>89조 전단\u003c/strong>: 「공금 그 밖의 공적 재산은 \u003cstrong>종교상의 조직 또는 단체\u003c/strong>의 사용·편익 또는 유지를 위해 지출하거나 그 이용에 제공해서는 안 된다」 — 재정 면에서 정교분리를 뒷받침한다\u003c/li>\u003c/ul>\n\u003cp>이 원칙의 \u003cstrong>법적 성격\u003c/strong>에 대해 \u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>은 \u003cstrong>제도적 보장\u003c/strong>이라고 판시했다. 즉 정교분리 규정은 신교의 자유(20조 1항 전단)라는 인권 자체를 직접 보장하는 것이 아니라, \u003cstrong>국가의 비종교성·종교적 중립성을 제도로서 보장함으로써 간접적으로 신교의 자유를 확보\u003c/strong>하려는 규정이다. 이 성격 때문에 정교분리 위반을 이유로 개인이 곧바로 인권침해를 주장하기는 어렵고, 실제 소송은 대부분 \u003cstrong>주민소송\u003c/strong>(지방자치법 242조의2)으로 공금지출·재산관리의 위법을 다투는 형태로 나타난다.\u003c/p>\n\u003cp>또한 판례는 \u003cstrong>완전분리는 불가능\u003c/strong>하다는 입장이다. 종교는 교육·복지·문화 등 사회생활의 광범한 영역과 접점을 갖고 있어, 완전분리를 관철하면 사립 종교계 학교에 대한 조성이나 문화재인 신사·사찰 건조물의 보조까지 부정해야 하는 불합리가 생긴다. 따라서 분리에는 \u003cstrong>일정한 한계\u003c/strong>가 있고, 금지되는 것은 관계가 \u003cstrong>「상당하다고 인정되는 한도를 넘는」\u003c/strong> 경우뿐이다.\u003c/p>\n\u003cp>그 「상당한 한도」를 재는 잣대가 두 개로 나뉘어 있다. 의례 참가·공금지출형은 \u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">目的効果基準\u003c/a>, 국공유지 무상제공형은 \u003ca href=\"#/e/%E7%B7%8F%E5%90%88%E8%80%83%E6%85%AE%E5%9F%BA%E6%BA%96\">総合考慮基準\u003c/a>이다.\u003c/p>\n\u003cp>한편 20조 1항 후단의 \u003cstrong>「정치상의 권력」\u003c/strong>은 입법권·과세권·재판권 등 \u003cstrong>통치적 권력\u003c/strong>을 뜻한다. 종교단체가 정치활동을 하거나 정당을 지원하는 것 자체는 이 조항이 금지하는 바가 아니다 — 시험에서 자주 뒤집어 내는 지점이다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>제도적 보장설（制度的保障説）\u003c/strong>\u003c/td>\u003ctd>정교분리는 인권 그 자체가 아니라 국가의 종교적 중립성을 제도로 보장하는 규정이며, 이를 통해 간접적으로 신교의 자유를 확보한다\u003c/td>\u003ctd>👉 \u003cstrong>판례\u003c/strong>（\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인권설（人権説）\u003c/td>\u003ctd>정교분리는 신교의 자유의 한 내용이며, 위반은 개인의 종교적 인격권 침해로 직접 다툴 수 있다\u003c/td>\u003ctd>학설상 유력. 판례는 채택하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>엄격분리설\u003c/td>\u003ctd>국가와 종교의 관계는 원칙적으로 일체 허용되지 않는다\u003c/td>\u003ctd>\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>의 \u003cstrong>5인 반대의견\u003c/strong>의 입장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>\u003c/td>\u003ctd>最大判昭52.7.13\u003c/td>\u003ctd>시립체육관 기공식의 神式 지진제와 공금지출\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 제도적 보장·완전분리 불가·\u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">目的効果基準\u003c/a>을 모두 제시한 리딩 케이스\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\">愛媛玉串料訴訟\u003c/a>\u003c/td>\u003ctd>最大判平9.4.2\u003c/td>\u003ctd>현이 야스쿠니 신사 등에 다마구시료를 공금 지출\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（20조 3항·89조）. 목적효과기준 적용 위헌례\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>箕面忠魂碑訴訟\u003c/span>\u003c/td>\u003ctd>最三小判平5.2.16\u003c/td>\u003ctd>시의 충혼비 이전 부지 무상대여·위령제 참석\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 충혼비는 종교시설이 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>殉職自衛官合祀拒否訴訟\u003c/span>\u003c/td>\u003ctd>最大判昭63.6.1\u003c/td>\u003ctd>자위대 지방연락부의 호국신사 합사 신청 협력\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 아울러 \u003cstrong>「종교상의 감정이 상했다」는 것만으로는 법적 이익 침해가 아니다\u003c/strong>（관용 요청）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>空知太神社事件\u003c/td>\u003ctd>最大判平22.1.20\u003c/td>\u003ctd>시유지를 신사 시설 부지로 무상 제공\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（89조 전단·20조 1항 후단）. \u003ca href=\"#/e/%E7%B7%8F%E5%90%88%E8%80%83%E6%85%AE%E5%9F%BA%E6%BA%96\">総合考慮基準\u003c/a>의 원조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>孔子廟訴訟\u003c/span>\u003c/td>\u003ctd>最大判令3.2.24\u003c/td>\u003ctd>공원 내 공자묘 사용료 전액 면제\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（20조 3항）. 종합고려 틀 답습\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>宗教法人解散命令事件\u003c/span>\u003c/td>\u003ctd>最一小決平8.1.30\u003c/td>\u003ctd>옴진리교에 대한 종교법인 해산명령\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 해산명령은 \u003cstrong>세속적 사항에 관한 법령의 적용\u003c/strong>이며 신자의 신앙 자체를 대상으로 하지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「완전한 분리를 요구한다」는 지문은 오답.\u003c/strong> 판례는 완전분리 불가론에 서서 \u003cstrong>「상당하다고 인정되는 한도」\u003c/strong>를 넘는 관여만 금지한다.\u003c/li>\u003cli>\u003cstrong>성격 = 제도적 보장\u003c/strong>. 「정교분리는 인권이므로 개인이 직접 침해를 주장할 수 있다」는 지문은 판례와 어긋난다. 실제 다툼은 \u003cstrong>주민소송\u003c/strong>으로 간다는 구조까지 세트.\u003c/li>\u003cli>조문 3개를 역할로 나눠 암기: \u003cstrong>20조 1항 후단 = 특권 부여·정치상의 권력 / 20조 3항 = 국가의 종교적 활동 / 89조 = 공금·공적 재산\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>함정: 「정치상의 권력」 = 통치적 권력\u003c/strong>(입법·과세·재판). 종교단체가 \u003cstrong>정치활동을 하는 것 자체는 금지되지 않는다\u003c/strong>.\u003c/li>\u003cli>위헌이 된 3건(\u003cstrong>\u003ca href=\"#/e/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\">愛媛玉串料訴訟\u003c/a>·空知太神社事件·\u003cspan>孔子廟訴訟\u003c/span>\u003c/strong>)만 따로 묶어 외우면 나머지는 합헌으로 처리된다.\u003c/li>\u003cli>\u003cstrong>대비: 20조 1항 전단(신교의 자유 = 인권) ↔ 20조 1항 후단·3항·89조(정교분리 = 제도적 보장)\u003c/strong>. 앞은 개인의 권리, 뒤는 국가에 대한 명령이다.\u003c/li>\u003c/ul>","search":"政教分離原則 せいきょうぶんりげんそく 항목 내용 ------ ------ 읽기 せいきょうぶんりげんそく（정교분리원칙） 과목 헌법（신교의 자유 · 20조 1항 후단·3항, 89조） 한줄 정의 국가는 종교에 대해 중립적이어야 하며 특정 종교와 결합하거나 이를 원조·압박해서는 안 된다는 원칙 통설·판례 제도적 보장 （制度的保障）. 완전분리가 아니라 국가와 종교의 관계가 상당하다고 인정되는 한도를 넘는 경우만 금지（ 津地鎮祭事件 헌법/津地鎮祭事件.md 最大判昭52.7.13） 개념 일본국헌법은 정교분리를 세 개의 조문에 나누어 규정한다. - 20조 1항 후단 : 「어떠한 종교단체도 국가로부터 특권 을 받거나, 정치상의 권력 을 행사해서는 안 된다」 - 20조 3항 : 「국가 및 그 기관은 종교교육 그 밖에 어떠한 종교적 활동 도 해서는 안 된다」 - 89조 전단 : 「공금 그 밖의 공적 재산은 종교상의 조직 또는 단체 의 사용·편익 또는 유지를 위해 지출하거나 그 이용에 제공해서는 안 된다」 — 재정 면에서 정교분리를 뒷받침한다 이 원칙의 법적 성격 에 대해 津地鎮祭事件 헌법/津地鎮祭事件.md 은 제도적 보장 이라고 판시했다. 즉 정교분리 규정은 신교의 자유 20조 1항 전단 라는 인권 자체를 직접 보장하는 것이 아니라, 국가의 비종교성·종교적 중립성을 제도로서 보장함으로써 간접적으로 신교의 자유를 확보 하려는 규정이다. 이 성격 때문에 정교분리 위반을 이유로 개인이 곧바로 인권침해를 주장하기는 어렵고, 실제 소송은 대부분 주민소송 지방자치법 242조의2 으로 공금지출·재산관리의 위법을 다투는 형태로 나타난다. 또한 판례는 완전분리는 불가능 하다는 입장이다. 종교는 교육·복지·문화 등 사회생활의 광범한 영역과 접점을 갖고 있어, 완전분리를 관철하면 사립 종교계 학교에 대한 조성이나 문화재인 신사·사찰 건조물의 보조까지 부정해야 하는 불합리가 생긴다. 따라서 분리에는 일정한 한계 가 있고, 금지되는 것은 관계가 「상당하다고 인정되는 한도를 넘는」 경우뿐이다. 그 「상당한 한도」를 재는 잣대가 두 개로 나뉘어 있다. 의례 참가·공금지출형은 目的効果基準 용어/目的効果基準.md , 국공유지 무상제공형은 総合考慮基準 용어/総合考慮基準.md 이다. 한편 20조 1항 후단의 「정치상의 권력」 은 입법권·과세권·재판권 등 통치적 권력 을 뜻한다. 종교단체가 정치활동을 하거나 정당을 지원하는 것 자체는 이 조항이 금지하는 바가 아니다 — 시험에서 자주 뒤집어 내는 지점이다. 학설 학설 내용 비고 ------ ------ ------ 제도적 보장설（制度的保障説） 정교분리는 인권 그 자체가 아니라 국가의 종교적 중립성을 제도로 보장하는 규정이며, 이를 통해 간접적으로 신교의 자유를 확보한다 👉 판례 （ 津地鎮祭事件 헌법/津地鎮祭事件.md ） 인권설（人権説） 정교분리는 신교의 자유의 한 내용이며, 위반은 개인의 종교적 인격권 침해로 직접 다툴 수 있다 학설상 유력. 판례는 채택하지 않음 엄격분리설 국가와 종교의 관계는 원칙적으로 일체 허용되지 않는다 津地鎮祭事件 헌법/津地鎮祭事件.md 의 5인 반대의견 의 입장 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 津地鎮祭事件 헌법/津地鎮祭事件.md 最大判昭52.7.13 시립체육관 기공식의 神式 지진제와 공금지출 합헌 . 제도적 보장·완전분리 불가· 目的効果基準 용어/目的効果基準.md 을 모두 제시한 리딩 케이스 愛媛玉串料訴訟 헌법/愛媛玉串料訴訟.md 最大判平9.4.2 현이 야스쿠니 신사 등에 다마구시료를 공금 지출 위헌 （20조 3항·89조）. 목적효과기준 적용 위헌례 箕面忠魂碑訴訟 헌법/箕面忠魂碑訴訟.md 最三小判平5.2.16 시의 충혼비 이전 부지 무상대여·위령제 참석 합헌 . 충혼비는 종교시설이 아님 殉職自衛官合祀拒否訴訟 헌법/殉職自衛官合祀拒否訴訟.md 最大判昭63.6.1 자위대 지방연락부의 호국신사 합사 신청 협력 합헌 . 아울러 「종교상의 감정이 상했다」는 것만으로는 법적 이익 침해가 아니다 （관용 요청） 空知太神社事件 最大判平22.1.20 시유지를 신사 시설 부지로 무상 제공 위헌 （89조 전단·20조 1항 후단）. 総合考慮基準 용어/総合考慮基準.md 의 원조 孔子廟訴訟 헌법/孔子廟訴訟.md 最大判令3.2.24 공원 내 공자묘 사용료 전액 면제 위헌 （20조 3항）. 종합고려 틀 답습 宗教法人解散命令事件 헌법/宗教法人解散命令事件.md 最一小決平8.1.30 옴진리교에 대한 종교법인 해산명령 합헌 . 해산명령은 세속적 사항에 관한 법령의 적용 이며 신자의 신앙 자체를 대상으로 하지 않음 💡 수험 팁 - 「완전한 분리를 요구한다」는 지문은 오답. 판례는 완전분리 불가론에 서서 「상당하다고 인정되는 한도」 를 넘는 관여만 금지한다. - 성격 = 제도적 보장 . 「정교분리는 인권이므로 개인이 직접 침해를 주장할 수 있다」는 지문은 판례와 어긋난다. 실제 다툼은 주민소송 으로 간다는 구조까지 세트. - 조문 3개를 역할로 나눠 암기: 20조 1항 후단 = 특권 부여·정치상의 권력 / 20조 3항 = 국가의 종교적 활동 / 89조 = 공금·공적 재산 . - 함정: 「정치상의 권력」 = 통치적 권력 입법·과세·재판 . 종교단체가 정치활동을 하는 것 자체는 금지되지 않는다 . - 위헌이 된 3건 愛媛玉串料訴訟 헌법/愛媛玉串料訴訟.md ·空知太神社事件· 孔子廟訴訟 헌법/孔子廟訴訟.md 만 따로 묶어 외우면 나머지는 합헌으로 처리된다. - 대비: 20조 1항 전단 신교의 자유 = 인권 ↔ 20조 1항 후단·3항·89조 정교분리 = 제도적 보장 . 앞은 개인의 권리, 뒤는 국가에 대한 명령이다."},"積極目的規制":{"type":"term","subject":"용어","id":"積極目的規制","title":"積極目的規制","sub":"せっきょくもくてききせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>せっきょくもくてききせい（적극목적 규제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（경제적 자유권·위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>사회경제적 약자의 보호나 조화로운 경제 발전을 위한 \u003cstrong>사회정책·경제정책 목적의 규제\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>으로 심사. 小売市場距離制限事件(最大判昭47.11.22)에서 \u003cstrong>합헌\u003c/strong> 결론\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>積極目的規制\u003c/strong>는 「더 나은 사회 상태를 적극적으로 만들어 낸다」는 목적의 규제다. 중소기업·영세업자 보호, 산업 간 조정, 국민경제의 균형 있는 발전, 생활필수 시설의 확보 등이 여기에 속한다. 헌법 22조 1항의 「공공의 복지」를, 25조 이하의 사회권 규정이 그리는 \u003cstrong>복지국가(福祉国家) 이념\u003c/strong>과 연결해 \u003cstrong>적극적으로\u003c/strong> 읽은 것이다.\u003c/p>\n\u003cp>심사가 \u003cstrong>완만\u003c/strong>한 이유는 판단의 성질에 있다. 「중소 소매업자를 어느 정도 보호할 것인가」, 「어떤 산업 구조가 바람직한가」는 사회·경제 전체를 조망한 정책적·전문기술적 판단이며, 개별 사건을 다루는 법원이 대신 판단하기에 적합하지 않다. 그래서 국회의 재량을 폭넓게 인정한다.\u003c/p>\n\u003cp>\u003cstrong>小売市場距離制限事件\u003c/strong>(最大判昭47.11.22)에서 최고재는, 헌법이 복지국가적 이념에 서 있는 이상 국가는 사회경제 정책의 실시로서 경제적 자유에 일정한 규제를 가할 수 있고, 「\u003cstrong>개인의 경제활동에 대한 법적 규제조치에 관해서는, 국회의 재량적 판단을 존중하는 것을 원칙으로 하고, 재판소는 입법부가 그 재량권을 일탈하여 당해 법적 규제조치가 현저히 불합리한 것이 명백한 경우에 한하여 이를 위헌으로 한다\u003c/strong>」고 판시했다. 이것이 곧 \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>이며, 소매시장의 거리제한은 중소기업 보호라는 목적에서 \u003cstrong>합헌\u003c/strong>으로 인정되었다.\u003c/p>\n\u003cp>주의할 점은 목적 분류가 고정적이지 않다는 것이다. \u003cstrong>公衆浴場\u003c/strong>의 거리제한은 옛 판결(最大判昭30.1.26)에서 위생·경영 안정이라는 소극목적적 설명으로 합헌이 되었으나, 平成 이후에는 「공중목욕탕은 주민의 일상생활에 불가결한 시설이므로 그 확보를 위해」라는 \u003cstrong>적극목적\u003c/strong>으로 재구성되어 명백성의 원칙으로 합헌이 되었다(最二小判平元.1.20). 같은 규제, 같은 결론, 다른 이유라는 점이 시험에서 노려진다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件（소매시장 거리제한）\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매상업조정특별조치법이 소매시장 개설을 허가제로 하고 거리제한을 붙임\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 중소기업 보호라는 \u003cstrong>적극목적\u003c/strong> → 「현저히 불합리한 것이 명백한 경우」에 한해 위헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（신 판결）\u003c/td>\u003ctd>最二小判平元.1.20 / 刑集43巻1号1頁\u003c/td>\u003ctd>후쿠오카현 조례의 거리제한(도시부 250m·기타 300m)\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 주민 일상생활에 불가결한 시설의 확보라는 \u003cstrong>적극목적\u003c/strong> → 명백성의 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西陣ネクタイ事件（니시진 넥타이）\u003c/td>\u003ctd>最三小判平2.2.6\u003c/td>\u003ctd>생사(生糸)의 일원 수입 조치로 국내 직물업자가 원료를 비싸게 사게 됨\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 소매시장 판결을 인용, 양잠업 보호라는 \u003cstrong>적극목적\u003c/strong> → 명백성의 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限事件（대비용）\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 이쪽은 \u003cstrong>소극목적\u003c/strong> → \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>암기 축\u003c/strong>: 「\u003cstrong>積極 = 小売市場 = 明白性 = 合憲\u003c/strong>」. 소극목적 쪽(「消極 = 薬事法 = 厳格な合理性 = 違憲」)과 통째로 짝지어 외운다.\u003c/li>\u003cli>\u003cstrong>함정\u003c/strong>: 소매시장 판결에서 최고재가 쓴 표현은 「현저히 불합리한 것이 \u003cstrong>명백한\u003c/strong> 경우에 한해 위헌」이다. 「명백하지 않아도 불합리하면 위헌」처럼 완화된 표현으로 바꿔 놓은 지문은 오답.\u003c/li>\u003cli>적극목적 규제는 헌법 \u003cstrong>25조(생존권)\u003c/strong>를 배경으로 한 복지국가 이념과 연결된다. 그래서 \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>은 경제규제뿐 아니라 \u003cstrong>사회보장 입법\u003c/strong>의 재량 심사에서도 같은 발상으로 쓰인다(堀木訴訟).\u00
