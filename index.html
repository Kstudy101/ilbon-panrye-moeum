3c/li>\u003cli>대비: \u003cstrong>積極目的規制(만들어 내는 규제) ↔ \u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>(막는 규제)\u003c/strong>. 公衆浴場처럼 \u003cstrong>둘 다로 설명되는 사안\u003c/strong>이 있다는 것이 \u003ca href=\"#/e/%E8%A6%8F%E5%88%B6%E7%9B%AE%E7%9A%84%E4%BA%8C%E5%88%86%E8%AB%96\">規制目的二分論\u003c/a>에 대한 비판의 출발점이다.\u003c/li>\u003cli>심사 강도 서열: \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>·엄격심사(정신적 자유) &gt; \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(소극목적) &gt; \u003cstrong>\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>(적극목적)\u003c/strong>. 적극목적은 \u003cstrong>가장 완만한 끝\u003c/strong>이며, 이 기준이 적용되면 사실상 합헌이 된다고 봐도 좋다.\u003c/li>\u003c/ul>","search":"積極目的規制 せっきょくもくてききせい 항목 내용 ------ ------ 읽기 せっきょくもくてききせい（적극목적 규제） 과목 헌법（경제적 자유권·위헌심사기준） 한줄 정의 사회경제적 약자의 보호나 조화로운 경제 발전을 위한 사회정책·경제정책 목적의 규제 통설·판례 明白性の原則 용어/明白性の原則.md 으로 심사. 小売市場距離制限事件 最大判昭47.11.22 에서 합헌 결론 개념 積極目的規制 는 「더 나은 사회 상태를 적극적으로 만들어 낸다」는 목적의 규제다. 중소기업·영세업자 보호, 산업 간 조정, 국민경제의 균형 있는 발전, 생활필수 시설의 확보 등이 여기에 속한다. 헌법 22조 1항의 「공공의 복지」를, 25조 이하의 사회권 규정이 그리는 복지국가 福祉国家 이념 과 연결해 적극적으로 읽은 것이다. 심사가 완만 한 이유는 판단의 성질에 있다. 「중소 소매업자를 어느 정도 보호할 것인가」, 「어떤 산업 구조가 바람직한가」는 사회·경제 전체를 조망한 정책적·전문기술적 판단이며, 개별 사건을 다루는 법원이 대신 판단하기에 적합하지 않다. 그래서 국회의 재량을 폭넓게 인정한다. 小売市場距離制限事件 最大判昭47.11.22 에서 최고재는, 헌법이 복지국가적 이념에 서 있는 이상 국가는 사회경제 정책의 실시로서 경제적 자유에 일정한 규제를 가할 수 있고, 「 개인의 경제활동에 대한 법적 규제조치에 관해서는, 국회의 재량적 판단을 존중하는 것을 원칙으로 하고, 재판소는 입법부가 그 재량권을 일탈하여 당해 법적 규제조치가 현저히 불합리한 것이 명백한 경우에 한하여 이를 위헌으로 한다 」고 판시했다. 이것이 곧 明白性の原則 용어/明白性の原則.md 이며, 소매시장의 거리제한은 중소기업 보호라는 목적에서 합헌 으로 인정되었다. 주의할 점은 목적 분류가 고정적이지 않다는 것이다. 公衆浴場 의 거리제한은 옛 판결 最大判昭30.1.26 에서 위생·경영 안정이라는 소극목적적 설명으로 합헌이 되었으나, 平成 이후에는 「공중목욕탕은 주민의 일상생활에 불가결한 시설이므로 그 확보를 위해」라는 적극목적 으로 재구성되어 명백성의 원칙으로 합헌이 되었다 最二小判平元.1.20 . 같은 규제, 같은 결론, 다른 이유라는 점이 시험에서 노려진다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 小売市場距離制限事件（소매시장 거리제한） 最大判昭47.11.22 / 刑集26巻9号586頁 소매상업조정특별조치법이 소매시장 개설을 허가제로 하고 거리제한을 붙임 합헌 . 중소기업 보호라는 적극목적 → 「현저히 불합리한 것이 명백한 경우」에 한해 위헌 公衆浴場距離制限事件（신 판결） 最二小判平元.1.20 / 刑集43巻1号1頁 후쿠오카현 조례의 거리제한 도시부 250m·기타 300m 합헌 . 주민 일상생활에 불가결한 시설의 확보라는 적극목적 → 명백성의 원칙 西陣ネクタイ事件（니시진 넥타이） 最三小判平2.2.6 생사 生糸 의 일원 수입 조치로 국내 직물업자가 원료를 비싸게 사게 됨 합헌 . 소매시장 판결을 인용, 양잠업 보호라는 적극목적 → 명백성의 원칙 薬事法距離制限事件（대비용） 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설 허가의 거리제한 위헌 . 이쪽은 소극목적 → 厳格な合理性の基準 용어/厳格な合理性の基準.md 💡 수험 팁 - 암기 축 : 「 積極 = 小売市場 = 明白性 = 合憲 」. 소극목적 쪽 「消極 = 薬事法 = 厳格な合理性 = 違憲」 과 통째로 짝지어 외운다. - 함정 : 소매시장 판결에서 최고재가 쓴 표현은 「현저히 불합리한 것이 명백한 경우에 한해 위헌」이다. 「명백하지 않아도 불합리하면 위헌」처럼 완화된 표현으로 바꿔 놓은 지문은 오답. - 적극목적 규제는 헌법 25조 생존권 를 배경으로 한 복지국가 이념과 연결된다. 그래서 明白性の原則 용어/明白性の原則.md 은 경제규제뿐 아니라 사회보장 입법 의 재량 심사에서도 같은 발상으로 쓰인다 堀木訴訟 . - 대비: 積極目的規制 만들어 내는 규제 ↔ 消極目的規制 용어/消極目的規制.md 막는 규제 . 公衆浴場처럼 둘 다로 설명되는 사안 이 있다는 것이 規制目的二分論 용어/規制目的二分論.md 에 대한 비판의 출발점이다. - 심사 강도 서열: lra基準 용어/lra基準.md ·엄격심사 정신적 자유 厳格な合理性の基準 용어/厳格な合理性の基準.md 소극목적 明白性の原則 용어/明白性の原則.md 적극목적 . 적극목적은 가장 완만한 끝 이며, 이 기준이 적용되면 사실상 합헌이 된다고 봐도 좋다."},"知る権利":{"type":"term","subject":"용어","id":"知る権利","title":"知る権利","sub":"しるけんり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しるけんり（알 권리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>표현의 자유를 정보의 \u003cstrong>수령자(受け手) 측\u003c/strong>에서 파악한 자유로, 정보를 자유롭게 수령하고 나아가 국가에 정보 공개를 요구할 수 있는 권리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>헌법에 \u003cstrong>명문 규정은 없으나\u003c/strong> 21조에 의해 보장된다고 해석. 다만 정부에 대한 \u003cstrong>공개 청구권\u003c/strong>으로서는 구체적 입법(情報公開法 등)이 있어야 비로소 구체적 권리가 된다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>표현의 자유(\u003cstrong>21조 1항\u003c/strong>)는 원래 「말하는 쪽」의 자유로 구성되었다. 그러나 매스미디어가 발달하고 정보가 국가와 대기업에 집중되면서, 일반 국민은 정보를 「받는 쪽」에 고정되었다. 그래서 표현의 자유를 \u003cstrong>수령자 측에서 재구성\u003c/strong>한 것이 알 권리다. 민주주의의 전제인 국민 주권을 실질화하려면 국민이 국정에 관한 정보에 접근할 수 있어야 한다는 발상이다.\u003c/p>\n\u003cp>알 권리에는 두 측면이 있다. \u003cstrong>자유권적 측면\u003c/strong>은 정보 수령을 국가가 방해해서는 안 된다는 것으로, 21조에서 직접 도출된다. \u003cstrong>청구권적(사회권적) 측면\u003c/strong>은 국가가 보유한 정보를 공개하라고 요구하는 것으로, 21조만으로는 곧바로 구체적 청구권이 나오지 않고 \u003cstrong>구체적인 법률\u003c/strong>이 있어야 한다는 것이 통설이다. 실제로 1999년 제정된 \u003cstrong>情報公開法（行政機関の保有する情報の公開に関する法律）\u003c/strong>이 이 청구권을 제도화했는데, 이 법의 목적 규정(1조)은 「国民主権の理念にのっとり」라고만 하고 \u003cstrong>「知る権利」라는 문언은 두고 있지 않다\u003c/strong>. 행정서사 시험의 단골 함정이다.\u003c/p>\n\u003cp>판례에서 알 권리가 정면으로 등장한 것은 \u003cstrong>博多駅事件（最大決昭44.11.26）\u003c/strong>이다. 최고재는 보도기관의 보도가 「国民の\u003cstrong>知る権利\u003c/strong>に奉仕するもの」이므로 사실의 보도의 자유도 21조의 보장 아래 있다고 하면서, 그 앞 단계인 \u003cstrong>취재의 자유\u003c/strong>에 대해서는 한 단계 낮춘 표현을 썼다.\u003c/p>\n\u003cblockquote>報道機関の報道は、民主主義社会において、国民が国政に関与するにつき、重要な判断の資料を提供し、国民の知る権利に奉仕するものである。したがつて、思想の表明の自由とならんで、事実の報道の自由は、表現の自由を規定した憲法21条の保障のもとにあることはいうまでもない。また、このような報道機関の報道が正しい内容をもつためには、\u003cstrong>報道の自由とともに、報道のための取材の自由も、憲法21条の精神に照らし、十分尊重に値いするものといわなければならない\u003c/strong>。\u003c/blockquote>\n\u003cp>즉 \u003cstrong>보도의 자유 = 21조에 의해 「보장」\u003c/strong>, \u003cstrong>취재의 자유 = 21조의 정신에 비추어 「충분히 존중할 가치가 있다」\u003c/strong>로 표현의 강도가 다르다. 그리고 취재 필름 제출명령의 가부는 범죄의 성질·증거로서의 가치와 취재의 자유가 방해받는 정도 등을 \u003cstrong>비교형량(比較衡量)\u003c/strong>하여 결정한다고 했다(본건에서는 제출명령을 적법하다고 판단).\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>博多駅テレビフィルム提出命令事件（하카타역 TV필름 제출명령 사건）\u003c/td>\u003ctd>最大決昭44.11.26 / 刑集23巻11号1490頁\u003c/td>\u003ctd>학생과 기동대의 충돌 사건에 관해 법원이 방송사에 취재 필름 제출을 명령\u003c/td>\u003ctd>\u003cstrong>제출명령 적법\u003c/strong>. 보도의 자유는 \u003cstrong>21조의 보장 아래\u003c/strong> 있고, 취재의 자유도 \u003cstrong>21조의 정신에 비추어 「충분히 존중할 가치가 있다」\u003c/strong>. 다만 공정한 형사재판의 실현이라는 이익과 \u003cstrong>비교형량\u003c/strong>한 결과 제출명령이 우선\u003c/td>\u003c/tr>\u003ctr>\u003ctd>レペタ事件（법정 메모 소송）\u003c/td>\u003ctd>最大判平1.3.8\u003c/td>\u003ctd>미국인 변호사가 법정 방청 중 메모를 하려 했으나 재판장이 불허\u003c/td>\u003ctd>\u003cstrong>국가배상 청구는 기각\u003c/strong>（다만 방론이 중요）. \u003cstrong>筆記行為の自由は憲法21条1項の規定の精神に照らして尊重されるべき\u003c/strong>이며, 방청인이 법정에서 메모하는 것은 「故なく妨げられてはならない」. 그러나 21조 1항이 \u003cstrong>직접 보장\u003c/strong>하는 표현의 자유 자체는 아니다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>サンケイ新聞事件（산케이신문 사건）\u003c/td>\u003ctd>最二小判昭62.4.24\u003c/td>\u003ctd>자민당 의견광고에 대해 공산당이 무료 반론문 게재를 청구\u003c/td>\u003ctd>\u003cstrong>청구 기각\u003c/strong>. 법률에 근거 없이 헌법 21조로부터 곧바로 \u003cstrong>반론권(反論権)\u003c/strong>을 도출할 수는 없다. 반론문 게재 의무는 비판적 보도를 위축시킬 우려가 있음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「취재의 자유는 헌법 21조에 의해 보장된다」는 지문은 오답.\u003c/strong> 최고재는 「21조의 \u003cstrong>정신に照らし、十分尊重に値いする\u003c/strong>」라고만 했다. \u003cstrong>보도의 자유는 「보장」, 취재의 자유는 「존중할 가치」\u003c/strong> — 이 강약 차이가 최다 빈출 함정.\u003c/li>\u003cli>\u003cstrong>레페타 사건도 같은 구조\u003c/strong>: 필기 행위의 자유는 21조 1항의 \u003cstrong>「精神に照らして尊重されるべき」\u003c/strong>이지 직접 보장되는 것이 아니다. 「메모를 할 자유가 21조 1항에 의해 직접 보장된다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>情報公開法에는 「知る権利」라는 문언이 없다.\u003c/strong> 「알 권리를 명문화했다」는 지문은 오답. 또한 알 권리의 청구권적 측면은 \u003cstrong>구체적 입법 없이는 구체적 권리가 아니다\u003c/strong>.\u003c/li>\u003cli>헌법에 「知る権利」라는 \u003cstrong>명문 규정은 없다\u003c/strong>. 조문을 묻는 문제에서 「21조 2항이 알 권리를 규정한다」 등은 오답(21조 2항은 검열 금지와 통신의 비밀).\u003c/li>\u003cli>반론권은 \u003cstrong>부정\u003c/strong>(サンケイ新聞事件). 「알 권리의 내용으로서 반론권이 인정된다」는 지문은 오답.\u003c/li>\u003cli>博多駅事件은 \u003cstrong>결정(決)\u003c/strong>이지 판결이 아니다. 인용 표기 \u003ccode>最大決昭44.11.26\u003c/code>에 주의.\u003c/li>\u003cli>대비: 알 권리 = 표현의 자유의 \u003cstrong>수령자\u003c/strong> 측면 / \u003ca href=\"#/e/%E8%A1%A8%E7%8F%BE%E5%86%85%E5%AE%B9%E8%A6%8F%E5%88%B6\">表現内容規制\u003c/a>·\u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a> = \u003cstrong>발신자\u003c/strong>에 대한 규제의 문제.\u003c/li>\u003c/ul>","search":"知る権利 しるけんり 항목 내용 ------ ------ 읽기 しるけんり（알 권리） 과목 헌법（표현의 자유） 한줄 정의 표현의 자유를 정보의 수령자 受け手 측 에서 파악한 자유로, 정보를 자유롭게 수령하고 나아가 국가에 정보 공개를 요구할 수 있는 권리 통설·판례 헌법에 명문 규정은 없으나 21조에 의해 보장된다고 해석. 다만 정부에 대한 공개 청구권 으로서는 구체적 입법 情報公開法 등 이 있어야 비로소 구체적 권리가 된다 개념 표현의 자유 21조 1항 는 원래 「말하는 쪽」의 자유로 구성되었다. 그러나 매스미디어가 발달하고 정보가 국가와 대기업에 집중되면서, 일반 국민은 정보를 「받는 쪽」에 고정되었다. 그래서 표현의 자유를 수령자 측에서 재구성 한 것이 알 권리다. 민주주의의 전제인 국민 주권을 실질화하려면 국민이 국정에 관한 정보에 접근할 수 있어야 한다는 발상이다. 알 권리에는 두 측면이 있다. 자유권적 측면 은 정보 수령을 국가가 방해해서는 안 된다는 것으로, 21조에서 직접 도출된다. 청구권적 사회권적 측면 은 국가가 보유한 정보를 공개하라고 요구하는 것으로, 21조만으로는 곧바로 구체적 청구권이 나오지 않고 구체적인 법률 이 있어야 한다는 것이 통설이다. 실제로 1999년 제정된 情報公開法（行政機関の保有する情報の公開に関する法律） 이 이 청구권을 제도화했는데, 이 법의 목적 규정 1조 은 「国民主権の理念にのっとり」라고만 하고 「知る権利」라는 문언은 두고 있지 않다 . 행정서사 시험의 단골 함정이다. 판례에서 알 권리가 정면으로 등장한 것은 博多駅事件（最大決昭44.11.26） 이다. 최고재는 보도기관의 보도가 「国民の 知る権利 に奉仕するもの」이므로 사실의 보도의 자유도 21조의 보장 아래 있다고 하면서, 그 앞 단계인 취재의 자유 에 대해서는 한 단계 낮춘 표현을 썼다. 報道機関の報道は、民主主義社会において、国民が国政に関与するにつき、重要な判断の資料を提供し、国民の知る権利に奉仕するものである。したがつて、思想の表明の自由とならんで、事実の報道の自由は、表現の自由を規定した憲法21条の保障のもとにあることはいうまでもない。また、このような報道機関の報道が正しい内容をもつためには、 報道の自由とともに、報道のための取材の自由も、憲法21条の精神に照らし、十分尊重に値いするものといわなければならない 。 즉 보도의 자유 = 21조에 의해 「보장」 , 취재의 자유 = 21조의 정신에 비추어 「충분히 존중할 가치가 있다」 로 표현의 강도가 다르다. 그리고 취재 필름 제출명령의 가부는 범죄의 성질·증거로서의 가치와 취재의 자유가 방해받는 정도 등을 비교형량 比較衡量 하여 결정한다고 했다 본건에서는 제출명령을 적법하다고 판단 . 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 博多駅テレビフィルム提出命令事件（하카타역 tv필름 제출명령 사건） 最大決昭44.11.26 / 刑集23巻11号1490頁 학생과 기동대의 충돌 사건에 관해 법원이 방송사에 취재 필름 제출을 명령 제출명령 적법 . 보도의 자유는 21조의 보장 아래 있고, 취재의 자유도 21조의 정신에 비추어 「충분히 존중할 가치가 있다」 . 다만 공정한 형사재판의 실현이라는 이익과 비교형량 한 결과 제출명령이 우선 レペタ事件（법정 메모 소송） 最大判平1.3.8 미국인 변호사가 법정 방청 중 메모를 하려 했으나 재판장이 불허 국가배상 청구는 기각 （다만 방론이 중요）. 筆記行為の自由は憲法21条1項の規定の精神に照らして尊重されるべき 이며, 방청인이 법정에서 메모하는 것은 「故なく妨げられてはならない」. 그러나 21조 1항이 직접 보장 하는 표현의 자유 자체는 아니다 サンケイ新聞事件（산케이신문 사건） 最二小判昭62.4.24 자민당 의견광고에 대해 공산당이 무료 반론문 게재를 청구 청구 기각 . 법률에 근거 없이 헌법 21조로부터 곧바로 반론권 反論権 을 도출할 수는 없다. 반론문 게재 의무는 비판적 보도를 위축시킬 우려가 있음 💡 수험 팁 - 「취재의 자유는 헌법 21조에 의해 보장된다」는 지문은 오답. 최고재는 「21조의 정신に照らし、十分尊重に値いする 」라고만 했다. 보도의 자유는 「보장」, 취재의 자유는 「존중할 가치」 — 이 강약 차이가 최다 빈출 함정. - 레페타 사건도 같은 구조 : 필기 행위의 자유는 21조 1항의 「精神に照らして尊重されるべき」 이지 직접 보장되는 것이 아니다. 「메모를 할 자유가 21조 1항에 의해 직접 보장된다」는 지문은 오답. - 情報公開法에는 「知る権利」라는 문언이 없다. 「알 권리를 명문화했다」는 지문은 오답. 또한 알 권리의 청구권적 측면은 구체적 입법 없이는 구체적 권리가 아니다 . - 헌법에 「知る権利」라는 명문 규정은 없다 . 조문을 묻는 문제에서 「21조 2항이 알 권리를 규정한다」 등은 오답 21조 2항은 검열 금지와 통신의 비밀 . - 반론권은 부정 サンケイ新聞事件 . 「알 권리의 내용으로서 반론권이 인정된다」는 지문은 오답. - 博多駅事件은 결정 決 이지 판결이 아니다. 인용 표기 最大決昭44.11.26 에 주의. - 대비: 알 권리 = 표현의 자유의 수령자 측면 / 表現内容規制 용어/表現内容規制.md · 事前抑制 용어/事前抑制.md = 발신자 에 대한 규제의 문제."},"法律の法規創造力":{"type":"term","subject":"용어","id":"法律の法規創造力","title":"法律の法規創造力","sub":"ほうりつのほうきそうぞうりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ほうりつのほうきそうぞうりょく（법률의 법규창조력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — 법률에 의한 행정의 원리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국민의 권리·의무에 관한 법규범(法規)을 새로이 창설할 수 있는 것은 \u003cstrong>국회가 제정하는 법률뿐\u003c/strong>이라는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>헌법 41조(국회 = \u003cstrong>유일한 입법기관\u003c/strong>)가 실정법적 근거. 헌법 자신이 인정하는 예외만 허용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AB%E3%82%88%E3%82%8B%E8%A1%8C%E6%94%BF%E3%81%AE%E5%8E%9F%E7%90%86\">法律による行政の原理\u003c/a>의 첫 번째 내용이다. 여기서 말하는 \u003cstrong>「法規」\u003c/strong>는 조문 일반을 가리키는 말이 아니라, 강학상 \u003cstrong>「국민의 권리를 제한하고 의무를 부과하는 일반적·추상적 법규범」\u003c/strong>이라는 좁은 의미로 쓰인다. 이런 법규를 새로 만들어 내는 힘(創造力)은 오직 국회의 법률만이 갖는다는 것이 이 원칙이며, 근거는 \u003cstrong>헌법 41조\u003c/strong>의 「국회는 …… 국가의 유일한 입법기관이다」라는 문언이다.\u003c/p>\n\u003cp>행정기관이 스스로 정립하는 규범을 \u003cstrong>行政立法\u003c/strong>이라 하는데, 이는 법규성 유무에 따라 둘로 나뉜다. 국민의 권리·의무에 직접 관계하는 \u003cstrong>法規命令\u003c/strong>（정령·성령·부령 등）은 법률의 창조력을 침해하지 않도록 반드시 \u003cstrong>법률의 위임(수권)\u003c/strong>이 있어야 하며, 이를 확인하는 조문이 \u003cstrong>内閣法 11조\u003c/strong>「정령에는 법률의 위임이 없으면 의무를 부과하거나 권리를 제한하는 규정을 둘 수 없다」, \u003cstrong>国家行政組織法 12조 3항\u003c/strong>「성령에는 법률의 위임이 없으면 벌칙을 두거나 의무를 부과하거나 국민의 권리를 제한하는 규정을 둘 수 없다」（동법 13조 2항이 외국(外局)의 규칙에 준용）다. 헌법 차원에서도 \u003cstrong>헌법 73조 6호 단서\u003c/strong>가 정령에 벌칙을 두려면 법률의 위임을 요구한다. 다만 위임은 개별·구체적이어야 하며 \u003cstrong>白紙委任(포괄적 위임)은 헌법 41조 위반으로 무효\u003c/strong>다.\u003c/p>\n\u003cp>반대로 \u003cstrong>行政規則\u003c/strong>（통달·훈령·요강·해석기준 등）은 행정조직 내부에서만 효력을 갖는 규범이므로 \u003cstrong>법규성이 없고, 국민이나 재판소를 구속하지 않는다.\u003c/strong> 통달에 위반한 행정처분이라 해도 그것만으로 위법이 되지는 않으며, 반대로 통달만을 근거로 국민에게 새로운 의무를 부과할 수도 없다.\u003c/p>\n\u003cp>한편 법률의 법규창조력에는 \u003cstrong>헌법 스스로가 인정한 예외\u003c/strong>가 있다. 議院規則（헌법 58조 2항）, 最高裁判所規則（헌법 77조 1항）, 条例（헌법 94조, 地方自治法 14조 1항）가 그것이다. 특히 조례는 주민의 대표기관인 의회가 제정한 자주법이므로, 법령에 위반하지 않는 한 \u003cstrong>법률의 개별 위임 없이도\u003c/strong> 의무를 부과하고 권리를 제한할 수 있다（地方自治法 14조 2항, 벌칙까지 둘 수 있음 — 동조 3항）.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>墓地埋葬法通達事件（묘지매장법 통달 사건）\u003c/td>\u003ctd>最三小判昭43.12.24 / 民集22巻13号3147頁\u003c/td>\u003ctd>후생성 공중위생국장이 「타 종파 신자라는 이유로 매장을 거부할 수 없다」는 취지로 종전 해석을 변경한 통달을 발하자, 묘지 관리자가 그 통달의 취소를 구함\u003c/td>\u003ctd>\u003cstrong>소 각하\u003c/strong>. 통달은 \u003cstrong>행정조직 내부의 명령에 지나지 않아 국민을 직접 구속하는 법규의 성질을 갖지 않으므로\u003c/strong>, 새로운 의무를 부과하는 것이 아니어서 \u003cstrong>처분성이 없다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>パチンコ球遊器事件（파친코 구유기 사건）\u003c/td>\u003ctd>最二小判昭33.3.28 / 民集12巻4号624頁\u003c/td>\u003ctd>오랫동안 비과세로 취급하던 파친코 기계를 통달을 계기로 물품세법상 「유희구(遊戯具)」로 보아 과세\u003c/td>\u003ctd>\u003cstrong>과세 적법\u003c/strong>. 과세가 통달을 계기로 이루어졌더라도 \u003cstrong>통달의 내용이 법의 올바른 해석에 합치하는 이상 그 처분은 법률의 근거에 기한 처분\u003c/strong>이며, 조세법률주의(헌법 84조) 위반이 아님\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「法規」의 의미가 좁다는 점\u003c/strong>이 최대 함정. 「법규 = 모든 법조문」이 아니라 \u003cstrong>「국민의 권리·의무에 관한 일반적·추상적 규범」\u003c/strong>이다.\u003c/li>\u003cli>\u003cstrong>대비: 法規命令 ↔ 行政規則.\u003c/strong> 법규명령(정령·성령)은 대외적 구속력 \u003cstrong>있음 → 법률의 위임 필요\u003c/strong>. 행정규칙(통달·훈령·요강)은 대외적 구속력 \u003cstrong>없음 → 법률의 위임 불요, 대신 국민에게 의무 부과 불가\u003c/strong>.\u003c/li>\u003cli>パチンコ球遊器 판례는 \u003cstrong>「통달과세도 언제나 위헌은 아니다」\u003c/strong>로 결론이 나온다. 「통달에 의한 과세이므로 조세법률주의에 반해 위법」이라는 지문은 \u003cstrong>오답\u003c/strong>. 판단 기준은 「통달 내용이 법 해석으로서 정당한가」.\u003c/li>\u003cli>墓地埋葬法通達事件은 「통달의 법규성 부정」과 「통달의 \u003cstrong>처분성\u003c/strong> 부정」이 세트로 출제된다. \u003cstrong>항고소송(行政事件訴訟法 3조 2항) 대상적격 논점에서도 그대로 나온다.\u003c/strong>\u003c/li>\u003cli>예외 4종 암기: \u003cstrong>의원규칙(58조2항)·최고재판소규칙(77조1항)·조례(94조)·위임에 기한 정령(73조6호)\u003c/strong>. 「조례로는 벌칙을 정할 수 없다」는 지문은 오답（地方自治法 14조 3항이 명문으로 허용）.\u003c/li>\u003c/ul>","search":"法律の法規創造力 ほうりつのほうきそうぞうりょく 항목 내용 ------ ------ 읽기 ほうりつのほうきそうぞうりょく（법률의 법규창조력） 과목 행정법（행정법 총론 — 법률에 의한 행정의 원리） 한줄 정의 국민의 권리·의무에 관한 법규범 法規 을 새로이 창설할 수 있는 것은 국회가 제정하는 법률뿐 이라는 원칙 통설·판례 헌법 41조 국회 = 유일한 입법기관 가 실정법적 근거. 헌법 자신이 인정하는 예외만 허용 개념 法律による行政の原理 용어/法律による行政の原理.md 의 첫 번째 내용이다. 여기서 말하는 「法規」 는 조문 일반을 가리키는 말이 아니라, 강학상 「국민의 권리를 제한하고 의무를 부과하는 일반적·추상적 법규범」 이라는 좁은 의미로 쓰인다. 이런 법규를 새로 만들어 내는 힘 創造力 은 오직 국회의 법률만이 갖는다는 것이 이 원칙이며, 근거는 헌법 41조 의 「국회는 …… 국가의 유일한 입법기관이다」라는 문언이다. 행정기관이 스스로 정립하는 규범을 行政立法 이라 하는데, 이는 법규성 유무에 따라 둘로 나뉜다. 국민의 권리·의무에 직접 관계하는 法規命令 （정령·성령·부령 등）은 법률의 창조력을 침해하지 않도록 반드시 법률의 위임 수권 이 있어야 하며, 이를 확인하는 조문이 内閣法 11조 「정령에는 법률의 위임이 없으면 의무를 부과하거나 권리를 제한하는 규정을 둘 수 없다」, 国家行政組織法 12조 3항 「성령에는 법률의 위임이 없으면 벌칙을 두거나 의무를 부과하거나 국민의 권리를 제한하는 규정을 둘 수 없다」（동법 13조 2항이 외국 外局 의 규칙에 준용）다. 헌법 차원에서도 헌법 73조 6호 단서 가 정령에 벌칙을 두려면 법률의 위임을 요구한다. 다만 위임은 개별·구체적이어야 하며 白紙委任 포괄적 위임 은 헌법 41조 위반으로 무효 다. 반대로 行政規則 （통달·훈령·요강·해석기준 등）은 행정조직 내부에서만 효력을 갖는 규범이므로 법규성이 없고, 국민이나 재판소를 구속하지 않는다. 통달에 위반한 행정처분이라 해도 그것만으로 위법이 되지는 않으며, 반대로 통달만을 근거로 국민에게 새로운 의무를 부과할 수도 없다. 한편 법률의 법규창조력에는 헌법 스스로가 인정한 예외 가 있다. 議院規則（헌법 58조 2항）, 最高裁判所規則（헌법 77조 1항）, 条例（헌법 94조, 地方自治法 14조 1항）가 그것이다. 특히 조례는 주민의 대표기관인 의회가 제정한 자주법이므로, 법령에 위반하지 않는 한 법률의 개별 위임 없이도 의무를 부과하고 권리를 제한할 수 있다（地方自治法 14조 2항, 벌칙까지 둘 수 있음 — 동조 3항）. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 墓地埋葬法通達事件（묘지매장법 통달 사건） 最三小判昭43.12.24 / 民集22巻13号3147頁 후생성 공중위생국장이 「타 종파 신자라는 이유로 매장을 거부할 수 없다」는 취지로 종전 해석을 변경한 통달을 발하자, 묘지 관리자가 그 통달의 취소를 구함 소 각하 . 통달은 행정조직 내부의 명령에 지나지 않아 국민을 직접 구속하는 법규의 성질을 갖지 않으므로 , 새로운 의무를 부과하는 것이 아니어서 처분성이 없다 パチンコ球遊器事件（파친코 구유기 사건） 最二小判昭33.3.28 / 民集12巻4号624頁 오랫동안 비과세로 취급하던 파친코 기계를 통달을 계기로 물품세법상 「유희구 遊戯具 」로 보아 과세 과세 적법 . 과세가 통달을 계기로 이루어졌더라도 통달의 내용이 법의 올바른 해석에 합치하는 이상 그 처분은 법률의 근거에 기한 처분 이며, 조세법률주의 헌법 84조 위반이 아님 💡 수험 팁 - 「法規」의 의미가 좁다는 점 이 최대 함정. 「법규 = 모든 법조문」이 아니라 「국민의 권리·의무에 관한 일반적·추상적 규범」 이다. - 대비: 法規命令 ↔ 行政規則. 법규명령 정령·성령 은 대외적 구속력 있음 → 법률의 위임 필요 . 행정규칙 통달·훈령·요강 은 대외적 구속력 없음 → 법률의 위임 불요, 대신 국민에게 의무 부과 불가 . - パチンコ球遊器 판례는 「통달과세도 언제나 위헌은 아니다」 로 결론이 나온다. 「통달에 의한 과세이므로 조세법률주의에 반해 위법」이라는 지문은 오답 . 판단 기준은 「통달 내용이 법 해석으로서 정당한가」. - 墓地埋葬法通達事件은 「통달의 법규성 부정」과 「통달의 처분성 부정」이 세트로 출제된다. 항고소송 行政事件訴訟法 3조 2항 대상적격 논점에서도 그대로 나온다. - 예외 4종 암기: 의원규칙 58조2항 ·최고재판소규칙 77조1항 ·조례 94조 ·위임에 기한 정령 73조6호 . 「조례로는 벌칙을 정할 수 없다」는 지문은 오답（地方自治法 14조 3항이 명문으로 허용）."},"法律の優位":{"type":"term","subject":"용어","id":"法律の優位","title":"法律の優位","sub":"ほうりつのゆうい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ほうりつのゆうい（법률의 우위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — 법률에 의한 행정의 원리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>법률이 존재하는 경우 모든 행정작용은 \u003cstrong>그 법률에 위반해서는 안 된다\u003c/strong>는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>모든 행정활동에 예외 없이 타당\u003c/strong>. \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>와 달리 \u003cstrong>적용 범위를 둘러싼 학설 대립이 없다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AB%E3%82%88%E3%82%8B%E8%A1%8C%E6%94%BF%E3%81%AE%E5%8E%9F%E7%90%86\">法律による行政の原理\u003c/a>의 두 번째 내용으로, \u003cstrong>「이미 존재하는 법률을 어기지 마라」\u003c/strong>는 소극적·저지적(消極的·阻止的) 요청이다. 법률의 근거가 필요한지를 묻는 \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>가 「법률이 \u003cstrong>없을 때\u003c/strong> 행정이 움직일 수 있는가」의 문제인 데 반해, 법률의 우위는 「법률이 \u003cstrong>있을 때\u003c/strong> 그에 반하는 행정을 할 수 있는가」의 문제이고, 답은 언제나 「불가」다.\u003c/p>\n\u003cp>이 원칙의 결정적 특징은 \u003cstrong>적용 범위에 다툼이 전혀 없다\u003c/strong>는 점이다. 침해행정이든 급부행정이든, 권력적 행위(行政行為·行政強制)든 비권력적 행위(行政指導·行政契約·行政計画)든, 법적 행위든 사실행위든 \u003cstrong>가리지 않고 전부\u003c/strong> 법률에 구속된다. 예컨대 법률의 근거가 필요 없는 행정지도라도, 일단 법률이 정한 소관 사무의 범위를 벗어나면 위법이다（\u003cstrong>行政手続法 32조 1항\u003c/strong>: 행정지도는 소관 사무의 범위를 일탈해서는 안 되며 상대방의 임의의 협력에 의해서만 실현되어야 한다）.\u003c/p>\n\u003cp>법률의 우위는 규범의 위계 문제이기도 하다. 헌법 → 법률 → 정령·성령(법규명령) → 행정규칙(통달·요강)의 순서로 하위 규범이 상위 규범에 반하면 무효다. 지방자치 영역에서도 마찬가지로 \u003cstrong>헌법 94조·地方自治法 14조 1항\u003c/strong>이 조례를 「법령에 위반하지 않는 한」이라는 틀 안에 두고 있다.\u003c/p>\n\u003cp>위반의 효과는 \u003cstrong>위법\u003c/strong>이다. 그 결과 해당 처분은 취소소송의 대상이 되고（行政事件訴訟法 3조 2항, 30조）, 하자가 중대·명백하면 무효확인소송의 대상이 되며（동법 3조 4항）, 공무원의 고의·과실이 있으면 \u003cstrong>国家賠償法 1조 1항\u003c/strong>에 의한 손해배상 책임이 발생한다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>徳島市公安条例事件（도쿠시마시 공안조례 사건）\u003c/td>\u003ctd>最大判昭50.9.10 / 刑集29巻8号489頁\u003c/td>\u003ctd>집단행진의 교통질서 유지를 정한 시 조례가 도로교통법에 저촉되어 무효인지\u003c/td>\u003ctd>\u003cstrong>조례 유효\u003c/strong>. 조례가 법령에 위반하는지는 \u003cstrong>양자의 대상 사항과 규정 문언을 대비하는 데 그치지 않고, 각각의 취지·목적·내용 및 효과를 비교하여 모순 저촉이 있는지에 따라 결정\u003c/strong>해야 한다（이른바 法律先占論의 수정 — 목적이 다르거나 법령이 전국 최저기준만 정한 취지라면 조례가 上乗せ·横出し 규제를 두어도 저촉되지 않는다）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>神奈川県臨時特例企業税事件（가나가와현 임시특례기업세 사건）\u003c/td>\u003ctd>最一小判平25.3.21 / 民集67巻3号438頁\u003c/td>\u003ctd>현이 조례로 임시특례기업세를 창설하여, 지방세법이 인정하는 \u003cstrong>결손금 이월공제를 실질적으로 배제\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>조례 무효\u003c/strong>. 해당 조례의 규정은 지방세법의 \u003cstrong>강행규정에 저촉\u003c/strong>하여 위법·무효이며, 이미 징수한 세금은 반환해야 함（법률의 우위가 조례를 무효화한 대표례）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>핵심 한 줄: 「법률의 우위는 예외 없이 모든 행정활동에 미친다」.\u003c/strong> 「급부행정에는 법률의 우위가 미치지 않는다」「비권력적 행위에는 법률의 우위가 미치지 않는다」는 지문은 \u003cstrong>전부 오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>대비: 法律の優位 ↔ 法律の留保.\u003c/strong> 우위 = 법률이 \u003cstrong>있는\u003c/strong> 경우의 문제, \u003cstrong>학설 대립 없음\u003c/strong>. 유보 = 법률이 \u003cstrong>없는\u003c/strong> 경우의 문제, \u003cstrong>侵害留保説 등 학설 대립 있음\u003c/strong>. 이 두 축을 바꿔 놓은 지문이 최다 빈출 함정이다.\u003c/li>\u003cli>행정지도는 \u003cstrong>법률의 근거 없이도 할 수 있지만(유보 ×), 법률에 반해서는 안 된다(우위 ○)\u003c/strong>. 이 「×/○」 조합이 그대로 문제가 된다.\u003c/li>\u003cli>徳島市公安条例事件의 판단 기준은 「\u003cstrong>문언 대비만으로는 부족, 취지·목적·내용·효과를 비교\u003c/strong>」. \u003cstrong>「법령이 규율하는 사항에 대해서는 조례를 제정할 수 없다」는 순수 法律先占論식 지문은 오답.\u003c/strong>\u003c/li>\u003cli>조례 관련 두 판례는 \u003cstrong>결론이 반대(徳島 = 유효 / 神奈川 = 무효)\u003c/strong>이므로 짝지어 암기하면 헷갈리지 않는다.\u003c/li>\u003c/ul>","search":"法律の優位 ほうりつのゆうい 항목 내용 ------ ------ 읽기 ほうりつのゆうい（법률의 우위） 과목 행정법（행정법 총론 — 법률에 의한 행정의 원리） 한줄 정의 법률이 존재하는 경우 모든 행정작용은 그 법률에 위반해서는 안 된다 는 원칙 통설·판례 모든 행정활동에 예외 없이 타당 . 法律の留保 용어/法律の留保.md 와 달리 적용 범위를 둘러싼 학설 대립이 없다 개념 法律による行政の原理 용어/法律による行政の原理.md 의 두 번째 내용으로, 「이미 존재하는 법률을 어기지 마라」 는 소극적·저지적 消極的·阻止的 요청이다. 법률의 근거가 필요한지를 묻는 法律の留保 용어/法律の留保.md 가 「법률이 없을 때 행정이 움직일 수 있는가」의 문제인 데 반해, 법률의 우위는 「법률이 있을 때 그에 반하는 행정을 할 수 있는가」의 문제이고, 답은 언제나 「불가」다. 이 원칙의 결정적 특징은 적용 범위에 다툼이 전혀 없다 는 점이다. 침해행정이든 급부행정이든, 권력적 행위 行政行為·行政強制 든 비권력적 행위 行政指導·行政契約·行政計画 든, 법적 행위든 사실행위든 가리지 않고 전부 법률에 구속된다. 예컨대 법률의 근거가 필요 없는 행정지도라도, 일단 법률이 정한 소관 사무의 범위를 벗어나면 위법이다（ 行政手続法 32조 1항 : 행정지도는 소관 사무의 범위를 일탈해서는 안 되며 상대방의 임의의 협력에 의해서만 실현되어야 한다）. 법률의 우위는 규범의 위계 문제이기도 하다. 헌법 → 법률 → 정령·성령 법규명령 → 행정규칙 통달·요강 의 순서로 하위 규범이 상위 규범에 반하면 무효다. 지방자치 영역에서도 마찬가지로 헌법 94조·地方自治法 14조 1항 이 조례를 「법령에 위반하지 않는 한」이라는 틀 안에 두고 있다. 위반의 효과는 위법 이다. 그 결과 해당 처분은 취소소송의 대상이 되고（行政事件訴訟法 3조 2항, 30조）, 하자가 중대·명백하면 무효확인소송의 대상이 되며（동법 3조 4항）, 공무원의 고의·과실이 있으면 国家賠償法 1조 1항 에 의한 손해배상 책임이 발생한다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 徳島市公安条例事件（도쿠시마시 공안조례 사건） 最大判昭50.9.10 / 刑集29巻8号489頁 집단행진의 교통질서 유지를 정한 시 조례가 도로교통법에 저촉되어 무효인지 조례 유효 . 조례가 법령에 위반하는지는 양자의 대상 사항과 규정 문언을 대비하는 데 그치지 않고, 각각의 취지·목적·내용 및 효과를 비교하여 모순 저촉이 있는지에 따라 결정 해야 한다（이른바 法律先占論의 수정 — 목적이 다르거나 법령이 전국 최저기준만 정한 취지라면 조례가 上乗せ·横出し 규제를 두어도 저촉되지 않는다） 神奈川県臨時特例企業税事件（가나가와현 임시특례기업세 사건） 最一小判平25.3.21 / 民集67巻3号438頁 현이 조례로 임시특례기업세를 창설하여, 지방세법이 인정하는 결손금 이월공제를 실질적으로 배제 조례 무효 . 해당 조례의 규정은 지방세법의 강행규정에 저촉 하여 위법·무효이며, 이미 징수한 세금은 반환해야 함（법률의 우위가 조례를 무효화한 대표례） 💡 수험 팁 - 핵심 한 줄: 「법률의 우위는 예외 없이 모든 행정활동에 미친다」. 「급부행정에는 법률의 우위가 미치지 않는다」「비권력적 행위에는 법률의 우위가 미치지 않는다」는 지문은 전부 오답 . - 대비: 法律の優位 ↔ 法律の留保. 우위 = 법률이 있는 경우의 문제, 학설 대립 없음 . 유보 = 법률이 없는 경우의 문제, 侵害留保説 등 학설 대립 있음 . 이 두 축을 바꿔 놓은 지문이 최다 빈출 함정이다. - 행정지도는 법률의 근거 없이도 할 수 있지만 유보 × , 법률에 반해서는 안 된다 우위 ○ . 이 「×/○」 조합이 그대로 문제가 된다. - 徳島市公安条例事件의 판단 기준은 「 문언 대비만으로는 부족, 취지·목적·내용·효과를 비교 」. 「법령이 규율하는 사항에 대해서는 조례를 제정할 수 없다」는 순수 法律先占論식 지문은 오답. - 조례 관련 두 판례는 결론이 반대 徳島 = 유효 / 神奈川 = 무효 이므로 짝지어 암기하면 헷갈리지 않는다."},"기본권의 대사인적 효력":{"type":"kr","subject":"한국비교","id":"기본권의 대사인적 효력","title":"기본권의 대사인적 효력","sub":"대법원 2010.4.22. 선고 2008다38288 전원합의체 판결","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>대응 일본 항목\u003c/td>\u003ctd>\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>대법원 2010.4.22. 선고 2008다38288 전원합의체 판결\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（기본권 총론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>. 기본권은 민법 2조·103조·750조·751조 등 사법상 일반원칙을 매개로 간접적으로 사법관계에 효력을 미침\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>한국의 법리\u003c/h2>\n\u003cp>한국에서도 통설·판례는 \u003cstrong>간접적용설\u003c/strong>이다. 대법원은 종립 사립고 종교교육 사건(2008다38288 전합)에서 이를 명시적으로 선언했다.\u003c/p>\n\u003cblockquote>헌법상의 기본권은 제1차적으로 개인의 자유로운 영역을 공권력의 침해로부터 보호하기 위한 방어적 권리이지만 다른 한편으로 헌법의 기본적인 결단인 객관적인 가치질서를 구체화한 것으로서, 사법(私法)을 포함한 모든 법 영역에 그 영향을 미치는 것이므로 사인간의 사적인 법률관계도 헌법상의 기본권 규정에 적합하게 규율되어야 한다. 다만 \u003cstrong>기본권 규정은 그 성질상 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 사법상의 일반원칙을 규정한 민법 제2조, 제103조, 제750조, 제751조 등의 내용을 형성하고 그 해석 기준이 되어 간접적으로 사법관계에 효력을 미치게 된다.\u003c/strong>\u003c/blockquote>\n\u003cp>매개 조항: 민법 \u003cstrong>2조\u003c/strong>(신의성실)·\u003cstrong>103조\u003c/strong>(공서양속)·\u003cstrong>750조\u003c/strong>(불법행위)·\u003cstrong>751조\u003c/strong>(비재산적 손해).\u003c/p>\n\u003cp>위법성 판단은 「\u003cstrong>사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과\u003c/strong>했는지」를 기준으로 한다.\u003c/p>\n\u003cp>한편 헌법상 환경권처럼 \u003cstrong>직접 사법상 권리를 발생시키지 않는다\u003c/strong>고 본 선례도 있어(94마2218), 직접적용설은 배척되는 방향이다.\u003c/p>\n\u003ch2>대표 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>종립 사립고 종교교육 사건\u003c/strong>（대광고·강의석 사건）\u003c/td>\u003ctd>대법원 2010.4.22. 선고 2008다38288 전합\u003c/td>\u003ctd>추첨 배정된 기독교계 사립고가 종교수업·예배 참가를 사실상 강제하고, 항의한 학생을 퇴학 처분\u003c/td>\u003ctd>\u003cstrong>파기환송\u003c/strong>（학교법인 부분）. 종교교육이 용인 한계를 넘으면 불법행위. 환송심에서 위자료 1,500만원 → \u003cstrong>학생 승소\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>서울YMCA 여성 총회원 배제 사건\u003c/strong>\u003c/td>\u003ctd>대법원 2011.1.27. 선고 2009다19864\u003c/td>\u003ctd>남성에게는 심사 없이 총회원 자격을 주면서 여성은 성별만을 이유로 자격 심사에서 원천 배제\u003c/td>\u003ctd>\u003cstrong>상고기각 → 여성 승소 확정\u003c/strong>. 평등권 침해가 민법 750조를 통해 인격적 법익 침해로 구체화. 위자료 각 1,000만원\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>종중 여성 종원 사건\u003c/strong>\u003c/td>\u003ctd>대법원 2005.7.21. 선고 2002다1178 전합\u003c/td>\u003ctd>성년 남자만 종중 구성원으로 보던 관습법\u003c/td>\u003ctd>\u003cstrong>파기환송\u003c/strong>. 변화된 전체 법질서에 부합하지 않아 관습법의 효력 부정（원칙적 장래효, 당해 사건은 소급 적용）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>청담공원 골프연습장 사건\u003c/strong>\u003c/td>\u003ctd>대법원 1995.5.23.자 94마2218 결정\u003c/td>\u003ctd>헌법상 환경권을 직접 근거로 공사금지 가처분 신청\u003c/td>\u003ctd>\u003cstrong>재항고 기각\u003c/strong>. 환경권 규정만으로는 개개 국민에게 직접 구체적 사법상 권리를 부여한 것이 아님\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>서울YMCA 사건은 위 2008다38288의 간접적용 법리를 그대로 원용하면서 다음을 판시했다.\u003c/p>\n\u003cblockquote>사적 단체를 포함하여 사회공동체 내에서 개인이 성별에 따른 불합리한 차별을 받지 아니하는 것은 … 인격권 실현의 본질적 부분에 해당하므로 \u003cstrong>평등권이라는 기본권의 침해도 민법 제750조의 일반규정을 통하여 사법상 보호되는 인격적 법익침해의 형태로 구체화되어 논하여질 수 있다\u003c/strong>\u003c/blockquote>\n\u003ch2>일본과의 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>논점\u003c/th>\u003cth>일본\u003c/th>\u003cth>한국\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기본 입장\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>（三菱樹脂事件 最大判昭48.12.12）\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>（2008다38288 전합） — 동일\u003c/td>\u003c/tr>\u003ctr>\u003ctd>매개 조항\u003c/td>\u003ctd>民法 90조（공서양속）, 709조（불법행위）, 1조\u003c/td>\u003ctd>민법 103조（공서양속）, 750조·751조（불법행위）, 2조 — 구조 동일\u003c/td>\u003c/tr>\u003ctr>\u003ctd>성차별 사안의 처리\u003c/td>\u003ctd>\u003cstrong>日産自動車事件\u003c/strong>（最判昭56.3.24）: 남녀 정년 차등 취업규칙을 민법 90조 위반으로 \u003cstrong>무효\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>서울YMCA 사건\u003c/strong>: 민법 750조 \u003cstrong>불법행위 손해배상\u003c/strong>으로 구제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사립학교 사안의 처리\u003c/td>\u003ctd>\u003cstrong>昭和女子大事件\u003c/strong>（最判昭49.7.19）: 사립대의 자율성 존중 → \u003cstrong>학교 승소\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>대광고 사건\u003c/strong>: 종교교육 강제의 한계 초과 인정 → \u003cstrong>학생 승소\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위법성 기준\u003c/td>\u003ctd>「사회통념상 현저히 타당성을 잃었는지」\u003c/td>\u003ctd>「사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과했는지」\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>비교 포인트\u003c/strong>\u003c/p>\n\u003cul>\u003cli>총론(간접적용설·매개 조항)은 한일이 거의 동일하다. 일본 민법 90조 ↔ 한국 민법 103조, 일본 709조 ↔ 한국 750조가 대응한다.\u003c/li>\u003cli>차이는 \u003cstrong>구제 경로\u003c/strong>다. 일본 日産自動車는 공서양속 위반으로 취업규칙 자체를 \u003cstrong>무효\u003c/strong>로 만든 반면, 한국 서울YMCA는 \u003cstrong>불법행위 손해배상\u003c/strong>으로 갔다. 「무효 확인이냐 금전배상이냐」가 좋은 대비 소재.\u003c/li>\u003cli>\u003cstrong>사립학교의 자율성\u003c/strong> 국면에서는 결론이 갈린다. 일본 昭和女子大는 학교의 자율성을 우선했고, 한국 대광고는 학생의 종교의 자유를 우선했다. 다만 대광고는 \u003cstrong>추첨 배정(학교 선택의 자유가 없음)\u003c/strong>이라는 사정이 결정적이었다는 점에 유의.\u003c/li>\u003cli>한국 헌법재판소가 대사인효를 정면으로 판시한 대표 결정은 확인되지 않는다. 헌재 차원에서는 \u003cstrong>국가의 기본권보호의무\u003c/strong> 법리(기본권 3각관계)로 접근하는 것으로 설명된다.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2008%EB%8B%A438288\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.law.go.kr/LSW/precInfoP.do?mode=0&amp;evtNo=2008%EB%8B%A438288\" target=\"_blank\" rel=\"noopener\">국가법령정보센터: 2008다38288\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2009%EB%8B%A419864\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2011.1.27. 선고 2009다19864 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://scourt.go.kr/portal/news/NewsViewAction.work?gubun=4&amp;seqnum=3013\" target=\"_blank\" rel=\"noopener\">대법원 판례속보: 2009다19864\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2002%EB%8B%A41178\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2005.7.21. 선고 2002다1178 전원합의체 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/94%EB%A7%882218\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 1995.5.23.자 94마2218 결정\u003c/a>\u003c/li>\u003c/ul>\n\u003cblockquote>미확인 사항: 대광고 사건 환송심 판결의 확정 일자, 서울YMCA 사건 원고 수(38명)·위자료 액수는 2차 요약에서 확인한 것으로 인용 시 원문 재확인 필요.\u003c/blockquote>","search":"기본권의 대사인적 효력 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 항목 내용 ------ ------ 대응 일본 항목 私人間効力 용어/私人間効力.md 인용 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 과목 헌법（기본권 총론） 결론 간접적용설 . 기본권은 민법 2조·103조·750조·751조 등 사법상 일반원칙을 매개로 간접적으로 사법관계에 효력을 미침 한국의 법리 한국에서도 통설·판례는 간접적용설 이다. 대법원은 종립 사립고 종교교육 사건 2008다38288 전합 에서 이를 명시적으로 선언했다. 헌법상의 기본권은 제1차적으로 개인의 자유로운 영역을 공권력의 침해로부터 보호하기 위한 방어적 권리이지만 다른 한편으로 헌법의 기본적인 결단인 객관적인 가치질서를 구체화한 것으로서, 사법 私法 을 포함한 모든 법 영역에 그 영향을 미치는 것이므로 사인간의 사적인 법률관계도 헌법상의 기본권 규정에 적합하게 규율되어야 한다. 다만 기본권 규정은 그 성질상 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 사법상의 일반원칙을 규정한 민법 제2조, 제103조, 제750조, 제751조 등의 내용을 형성하고 그 해석 기준이 되어 간접적으로 사법관계에 효력을 미치게 된다. 매개 조항: 민법 2조 신의성실 · 103조 공서양속 · 750조 불법행위 · 751조 비재산적 손해 . 위법성 판단은 「 사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과 했는지」를 기준으로 한다. 한편 헌법상 환경권처럼 직접 사법상 권리를 발생시키지 않는다 고 본 선례도 있어 94마2218 , 직접적용설은 배척되는 방향이다. 대표 판례 판례 인용 사안 결론 ------ ------ ------ ------ 종립 사립고 종교교육 사건 （대광고·강의석 사건） 대법원 2010.4.22. 선고 2008다38288 전합 추첨 배정된 기독교계 사립고가 종교수업·예배 참가를 사실상 강제하고, 항의한 학생을 퇴학 처분 파기환송 （학교법인 부분）. 종교교육이 용인 한계를 넘으면 불법행위. 환송심에서 위자료 1,500만원 → 학생 승소 서울ymca 여성 총회원 배제 사건 대법원 2011.1.27. 선고 2009다19864 남성에게는 심사 없이 총회원 자격을 주면서 여성은 성별만을 이유로 자격 심사에서 원천 배제 상고기각 → 여성 승소 확정 . 평등권 침해가 민법 750조를 통해 인격적 법익 침해로 구체화. 위자료 각 1,000만원 종중 여성 종원 사건 대법원 2005.7.21. 선고 2002다1178 전합 성년 남자만 종중 구성원으로 보던 관습법 파기환송 . 변화된 전체 법질서에 부합하지 않아 관습법의 효력 부정（원칙적 장래효, 당해 사건은 소급 적용） 청담공원 골프연습장 사건 대법원 1995.5.23.자 94마2218 결정 헌법상 환경권을 직접 근거로 공사금지 가처분 신청 재항고 기각 . 환경권 규정만으로는 개개 국민에게 직접 구체적 사법상 권리를 부여한 것이 아님 서울ymca 사건은 위 2008다38288의 간접적용 법리를 그대로 원용하면서 다음을 판시했다. 사적 단체를 포함하여 사회공동체 내에서 개인이 성별에 따른 불합리한 차별을 받지 아니하는 것은 … 인격권 실현의 본질적 부분에 해당하므로 평등권이라는 기본권의 침해도 민법 제750조의 일반규정을 통하여 사법상 보호되는 인격적 법익침해의 형태로 구체화되어 논하여질 수 있다 일본과의 비교 논점 일본 한국 ------ ------ ------ 기본 입장 간접적용설 （三菱樹脂事件 最大判昭48.12.12） 간접적용설 （2008다38288 전합） — 동일 매개 조항 民法 90조（공서양속）, 709조（불법행위）, 1조 민법 103조（공서양속）, 750조·751조（불법행위）, 2조 — 구조 동일 성차별 사안의 처리 日産自動車事件 （最判昭56.3.24）: 남녀 정년 차등 취업규칙을 민법 90조 위반으로 무효 서울ymca 사건 : 민법 750조 불법행위 손해배상 으로 구제 사립학교 사안의 처리 昭和女子大事件 （最判昭49.7.19）: 사립대의 자율성 존중 → 학교 승소 대광고 사건 : 종교교육 강제의 한계 초과 인정 → 학생 승소 위법성 기준 「사회통념상 현저히 타당성을 잃었는지」 「사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과했는지」 비교 포인트 - 총론 간접적용설·매개 조항 은 한일이 거의 동일하다. 일본 민법 90조 ↔ 한국 민법 103조, 일본 709조 ↔ 한국 750조가 대응한다. - 차이는 구제 경로 다. 일본 日産自動車는 공서양속 위반으로 취업규칙 자체를 무효 로 만든 반면, 한국 서울ymca는 불법행위 손해배상 으로 갔다. 「무효 확인이냐 금전배상이냐」가 좋은 대비 소재. - 사립학교의 자율성 국면에서는 결론이 갈린다. 일본 昭和女子大는 학교의 자율성을 우선했고, 한국 대광고는 학생의 종교의 자유를 우선했다. 다만 대광고는 추첨 배정 학교 선택의 자유가 없음 이라는 사정이 결정적이었다는 점에 유의. - 한국 헌법재판소가 대사인효를 정면으로 판시한 대표 결정은 확인되지 않는다. 헌재 차원에서는 국가의 기본권보호의무 법리 기본권 3각관계 로 접근하는 것으로 설명된다. 원문·참고 - casenote: 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2008%eb%8b%a438288 - 국가법령정보센터: 2008다38288 https://www.law.go.kr/lsw/precinfop.do?mode=0&evtno=2008%eb%8b%a438288 - casenote: 대법원 2011.1.27. 선고 2009다19864 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2009%eb%8b%a419864 - 대법원 판례속보: 2009다19864 https://scourt.go.kr/portal/news/newsviewaction.work?gubun=4&seqnum=3013 - casenote: 대법원 2005.7.21. 선고 2002다1178 전원합의체 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2002%eb%8b%a41178 - casenote: 대법원 1995.5.23.자 94마2218 결정 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/94%eb%a7%882218 미확인 사항: 대광고 사건 환송심 판결의 확정 일자, 서울ymca 사건 원고 수 38명 ·위자료 액수는 2차 요약에서 확인한 것으로 인용 시 원문 재확인 필요."}}};
const FLAT = DATA.groups.flatMap(g => g.items);

const $nav = document.getElementById('nav');
const $page = document.getElementById('page');
const $search = document.getElementById('search');
const $sidebar = document.getElementById('sidebar');
const $scrim = document.getElementById('scrim');
const $menuBtn = document.getElementById('menuBtn');

function currentId(){
  const h = location.hash;
  if (h.startsWith('#/e/')) {
    try { return decodeURIComponent(h.slice(4)); } catch { return null; }
  }
  return null;
}

function chipHtml(chip){
  return chip ? '<span class="chip ' + chip.cls + '">' + chip.label + '</span>' : '';
}

function renderNav(){
  const q = $search.value.trim().toLowerCase();
  const cur = currentId();
  let html = '';
  let any = false;
  for (const g of DATA.groups){
    const items = g.items.filter(id => {
      if (!q) return true;
      return DATA.entries[id].search.includes(q);
    });
    if (!items.length) continue;
    any = true;
    html += '<div class="nav-group"><h2>' + g.name + ' · ' + items.length + '</h2>';
    for (const id of items){
      const e = DATA.entries[id];
      html += '<a class="nav-item" href="#/e/' + encodeURIComponent(id) + '"' +
        (id === cur ? ' aria-current="page"' : '') + '>' +
        '<span class="t">' + e.title + '</span>' +
        '<span class="s">' + (e.sub || '') + chipHtml(e.chip) + '</span></a>';
    }
    html += '</div>';
  }
  $nav.innerHTML = any ? html : '<div class="no-result">검색 결과가 없습니다.</div>';
}

function renderCover(){
  const nCases = 22, nTerms = 79, nKr = 1;
  let toc = '';
  for (const g of DATA.groups){
    toc += '<a href="#/e/' + encodeURIComponent(g.items[0]) + '">' +
      '<span>' + g.name + '</span><span class="n">' + g.items.length + '건</span></a>';
  }
  $page.innerHTML =
    '<div class="cover">' +
    '<div class="seal" aria-hidden="true">判例帖</div>' +
    '<h1>行政書士 判例帖</h1>' +
    '<p class="lede">일본 행정서사 시험 대비 — 판례와 용어를 한 곳에서.</p>' +
    '<div class="counts">' +
    '<div><b>' + nCases + '</b><span>판례</span></div>' +
    '<div><b>' + nTerms + '</b><span>용어</span></div>' +
    (nKr ? '<div><b>' + nKr + '</b><span>한국 비교</span></div>' : '') +
    '</div>' +
    '<div class="toc">' + toc + '</div></div>';
  document.title = '行政書士 判例帖';
}

function renderEntry(id){
  const e = DATA.entries[id];
  if (!e){ renderCover(); return; }
  const idx = FLAT.indexOf(id);
  const prev = idx > 0 ? DATA.entries[FLAT[idx-1]] : null;
  const next = idx < FLAT.length-1 ? DATA.entries[FLAT[idx+1]] : null;
  const meta = [];
  if (e.sub) meta.push('<span>' + e.sub + '</span>');
  if (e.chip) meta.push(chipHtml(e.chip));
  let pager = '<nav class="pager">';
  if (prev) pager += '<a href="#/e/' + encodeURIComponent(prev.id) + '"><span class="dir">← 이전</span>' + prev.title + '</a>';
  if (next) pager += '<a class="next" href="#/e/' + encodeURIComponent(next.id) + '"><span class="dir">다음 →</span>' + next.title + '</a>';
  pager += '</nav>';
  $page.innerHTML =
    '<article>' +
    '<header class="doc-head">' +
    '<div class="eyebrow">' + (e.type === 'term' ? '용어' : e.type === 'kr' ? '한국 비교' : e.subject + ' 판례') + '</div>' +
    '<h1>' + e.title + '</h1>' +
    (meta.length ? '<div class="meta-line">' + meta.join('') + '</div>' : '') +
    '</header>' +
    '<div class="doc">' + e.html + '</div>' +
    pager + '</article>';
  document.title = e.title + ' — 行政書士 判例帖';
  window.scrollTo(0, 0);
}

function route(){
  const id = currentId();
  if (id) renderEntry(id); else renderCover();
  renderNav();
  closeSidebar();
}

function openSidebar(){ $sidebar.classList.add('open'); $scrim.classList.add('show'); }
function closeSidebar(){ $sidebar.classList.remove('open'); $scrim.classList.remove('show'); }

$menuBtn.addEventListener('click', openSidebar);
$scrim.addEventListener('click', closeSidebar);
$search.addEventListener('input', renderNav);
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== $search){
    ev.preventDefault(); openSidebar(); $search.focus();
  }
  if (ev.key === 'Escape') closeSidebar();
});
window.addEventListener('hashchange', route);
route();
</script>
