%B8%E8%84%B1%E3%83%BB%E6%BF%AB%E7%94%A8\">裁量権の逸脱・濫用\u003c/a>으로 위법이 된다.\u003c/p>\n\u003cp>법령상의 명칭과 강학상 성질이 어긋나는 대표 사례가 특허에 몰려 있다. 도로점용「허가」·하천점용「허가」는 이름은 許可지만 강학상 特許이고, 수도법상 수도사업「인가」는 이름은 認可지만 강학상 特許다. 반대로 농지법 3조「허가」는 강학상 \u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>다.\u003c/p>\n\u003cp>\u003cstrong>행정행위 3분류 비교표 (최빈출)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>\u003c/th>\u003cth>\u003cstrong>特許\u003c/strong>\u003c/th>\u003cth>\u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>성질\u003c/td>\u003ctd>명령적 행위\u003c/td>\u003ctd>\u003cstrong>형성적 행위\u003c/strong>\u003c/td>\u003ctd>형성적 행위(보충행위)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>내용\u003c/td>\u003ctd>일반적 금지의 해제 → 자연적 자유 \u003cstrong>회복\u003c/strong>\u003c/td>\u003ctd>새로운 권리·능력·법적 지위의 \u003cstrong>설정\u003c/strong>\u003c/td>\u003ctd>제3자의 법률행위를 \u003cstrong>보충\u003c/strong>하여 효력 완성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재량\u003c/td>\u003ctd>원칙 기속행위\u003c/td>\u003ctd>원칙 \u003cstrong>재량행위\u003c/strong>\u003c/td>\u003ctd>원칙 기속(공익 판단 여지 있음)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상대방\u003c/td>\u003ctd>자연적 자유를 되찾음\u003c/td>\u003ctd>\u003cstrong>없던 권리를 새로 취득\u003c/strong>\u003c/td>\u003ctd>자신은 당사자가 아니고, 사인 간 행위를 보충\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무허가·무특허·무인가 행위의 효력\u003c/td>\u003ctd>원칙 \u003cstrong>유효\u003c/strong>（처벌 대상）\u003c/td>\u003ctd>\u003cstrong>효과 자체가 발생하지 않음\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 예\u003c/td>\u003ctd>운전면허, 음식점 영업허가, 의사면허\u003c/td>\u003ctd>공기업 특허(전기·가스), 도로점용허가, 공유수면매립면허, \u003cstrong>귀화 허가\u003c/strong>, 광업권 설정\u003c/td>\u003ctd>농지법 3조 허가, 공공요금(운임) 인가, 공공조합 설립인가\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>個人タクシー事件（개인택시 사건）\u003c/td>\u003ctd>最判昭46.10.28 / 民集25巻7号1037頁\u003c/td>\u003ctd>도로운송법상 개인택시 면허(강학상 특허)에서, 다수 신청자 중 소수를 선별하며 공표되지 않은 17개 내부 심사기준으로 거부한 처분의 적법성\u003c/td>\u003ctd>\u003cstrong>처분 위법\u003c/strong>. 법이 추상적 면허기준만 둔 경우 행정청은 \u003cstrong>구체적 심사기준을 설정하고 공정·합리적으로 적용\u003c/strong>해야 하며, 미묘·고도의 판단을 요하는 항목에 대해서는 신청인에게 \u003cstrong>주장·입증의 기회\u003c/strong>를 주어야 한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「특허법의 특허」와 헷갈리게 만드는 지문이 단골.\u003c/strong> 강학상 特許 ≠ 발명특허. 발명특허는 오히려 강학상 「확인」으로 분류된다.\u003c/li>\u003cli>「特許 = \u003cstrong>설정\u003c/strong>」 vs 「許可 = \u003cstrong>회복\u003c/strong>」. 귀화 허가는 「일본 국민이라는 지위를 새로 만들어 준다」 → 명칭은 허가지만 \u003cstrong>특허\u003c/strong>.\u003c/li>\u003cli>재량 짝짓기: \u003cstrong>특허는 재량행위 / 허가는 기속행위\u003c/strong>가 원칙. 「특허는 요건을 갖추면 반드시 해야 한다」는 오답.\u003c/li>\u003cli>명칭 함정 리스트를 통째로 외울 것 — 도로점용「허가」·하천점용「허가」·수도사업「인가」 = \u003cstrong>특허\u003c/strong> / 농지법 3조「허가」 = \u003cstrong>인가\u003c/strong>.\u003c/li>\u003cli>個人タクシー事件은 「특허의 재량 통제」와 「행정절차법상 심사기준(5조)의 선구 판례」 양쪽으로 인용된다. \u003ca href=\"#/e/%E8%A3%81%E9%87%8F%E6%A8%A9%E3%81%AE%E9%80%B8%E8%84%B1%E3%83%BB%E6%BF%AB%E7%94%A8\">裁量権の逸脱・濫用\u003c/a>과 세트로 정리해 둘 것.\u003c/li>\u003c/ul>","search":"特許 とっきょ 항목 내용 ------ ------ 읽기 とっきょ（특허） 과목 행정법（행정행위의 분류·형성적 행위） 한줄 정의 특정인에게 본래 가지고 있지 않던 새로운 권리·능력·법적 지위를 설정 해 주는 형성적 행정행위（강학상 개념） 통설·판례 형성적 행위 이며 원칙 재량행위 . 특허법 特許法 의 「특허」와는 전혀 별개의 개념 개념 特許는 강학상 講学上 개념으로, 상대방에게 원래 없던 권리·능력을 새로 만들어 주는 設定 행정행위다. 許可 許可.md 가 이미 가지고 있던 자연적 자유의 회복 에 그치는 것과 결정적으로 다르다. 공기업 특허 전기·가스 사업 , 도로점용허가 도로법 32조 , 공유수면매립면허 공유수면매립법 2조 , 하천점용허가 하천법 24조 , 광업권 설정, 귀화 허가 국적법 4조 가 대표 예다. 여기서 말하는 特許는 특허법상의 「특허」 발명에 대한 특허권 부여 와 전혀 다르다 . 오히려 특허법상의 특허는 강학상으로는 「확인 確認 」에 가깝다고 설명된다. 시험에서는 이 명칭 혼동을 노린 지문이 나온다. 특허는 「누구에게 얼마만큼의 권리를 줄 것인가」를 행정청이 공익적 관점에서 정책적으로 판단하는 것이므로, 성질상 원칙 재량행위 다. 신청자가 요건을 갖추었더라도 행정청이 반드시 특허해야 하는 것은 아니다. 다만 재량이라 하여 무제한은 아니고, 다수 신청자 중 소수를 골라내는 경우에는 구체적 심사기준의 설정과 공정한 적용, 신청인에게 주장·입증의 기회 부여 가 요구된다 個人タクシー事件, 最判昭46.10.28 . 재량의 한계를 넘으면 裁量権の逸脱・濫用 裁量権の逸脱・濫用.md 으로 위법이 된다. 법령상의 명칭과 강학상 성질이 어긋나는 대표 사례가 특허에 몰려 있다. 도로점용「허가」·하천점용「허가」는 이름은 許可지만 강학상 特許이고, 수도법상 수도사업「인가」는 이름은 認可지만 강학상 特許다. 반대로 농지법 3조「허가」는 강학상 認可 認可.md 다. 행정행위 3분류 비교표 최빈출 구분 許可 許可.md 特許 認可 認可.md ------ ------ ---------- ------ 성질 명령적 행위 형성적 행위 형성적 행위 보충행위 내용 일반적 금지의 해제 → 자연적 자유 회복 새로운 권리·능력·법적 지위의 설정 제3자의 법률행위를 보충 하여 효력 완성 재량 원칙 기속행위 원칙 재량행위 원칙 기속 공익 판단 여지 있음 상대방 자연적 자유를 되찾음 없던 권리를 새로 취득 자신은 당사자가 아니고, 사인 간 행위를 보충 무허가·무특허·무인가 행위의 효력 원칙 유효 （처벌 대상） 효과 자체가 발생하지 않음 무효 대표 예 운전면허, 음식점 영업허가, 의사면허 공기업 특허 전기·가스 , 도로점용허가, 공유수면매립면허, 귀화 허가 , 광업권 설정 농지법 3조 허가, 공공요금 운임 인가, 공공조합 설립인가 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 個人タクシー事件（개인택시 사건） 最判昭46.10.28 / 民集25巻7号1037頁 도로운송법상 개인택시 면허 강학상 특허 에서, 다수 신청자 중 소수를 선별하며 공표되지 않은 17개 내부 심사기준으로 거부한 처분의 적법성 처분 위법 . 법이 추상적 면허기준만 둔 경우 행정청은 구체적 심사기준을 설정하고 공정·합리적으로 적용 해야 하며, 미묘·고도의 판단을 요하는 항목에 대해서는 신청인에게 주장·입증의 기회 를 주어야 한다 💡 수험 팁 - 「특허법의 특허」와 헷갈리게 만드는 지문이 단골. 강학상 特許 ≠ 발명특허. 발명특허는 오히려 강학상 「확인」으로 분류된다. - 「特許 = 설정 」 vs 「許可 = 회복 」. 귀화 허가는 「일본 국민이라는 지위를 새로 만들어 준다」 → 명칭은 허가지만 특허 . - 재량 짝짓기: 특허는 재량행위 / 허가는 기속행위 가 원칙. 「특허는 요건을 갖추면 반드시 해야 한다」는 오답. - 명칭 함정 리스트를 통째로 외울 것 — 도로점용「허가」·하천점용「허가」·수도사업「인가」 = 특허 / 농지법 3조「허가」 = 인가 . - 個人タクシー事件은 「특허의 재량 통제」와 「행정절차법상 심사기준 5조 의 선구 판례」 양쪽으로 인용된다. 裁量権の逸脱・濫用 裁量権の逸脱・濫用.md 과 세트로 정리해 둘 것."},"認可":{"type":"term","subject":"용어","id":"認可","title":"認可","sub":"にんか","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>にんか（인가）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 분류·형성적 행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>사인(私人) 간의 법률행위를 보충하여 그 법률상 효력을 완성\u003c/strong>시켜 주는 형성적 행정행위（보충행위, 補充行為）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>형성적 행위(보충행위)\u003c/strong>. 인가를 받지 않고 한 행위는 \u003cstrong>효력이 생기지 않는다(무효)\u003c/strong> — \u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>와의 결정적 차이\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>認可는 제3자(사인)가 이미 한, 또는 하려는 법률행위에 행정청이 \u003cstrong>동의를 더해 그 효력을 완성\u003c/strong>시키는 행위다. 행정청은 그 법률행위의 당사자가 아니며 어디까지나 \u003cstrong>보충(補充)\u003c/strong>할 뿐이므로, 보충할 원래의 법률행위가 없으면 인가도 있을 수 없다. 농지 권리이동 허가(농지법 3조 1항), 공공요금·운임의 인가(예: 철도사업법 16조), 공공조합의 설립인가, 하천점용권 양도의 승인 등이 예다.\u003c/p>\n\u003cp>시험상 가장 중요한 것은 \u003cstrong>무인가 행위의 효력\u003c/strong>이다. 인가는 효력요건(効力要件)이므로 인가를 받지 않고 한 행위는 \u003cstrong>무효\u003c/strong>다. 농지법은 이를 명문으로 규정한다 — 농지법 3조 1항의 허가를 받지 않고 한 행위는 \u003cstrong>「그 효력을 생기지 않는다」\u003c/strong>(농지법 3조 6항). 대비: \u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>는 단속법규이므로 무허가 행위라도 사법상 효력은 유효하고 처벌만 받는다(最判昭35.3.18).\u003c/p>\n\u003cp>인가의 또 하나의 특징은 \u003cstrong>원행위의 하자와의 관계\u003c/strong>다. 인가는 보충행위에 불과하므로, 기본이 되는 사인의 법률행위 자체에 하자가 있어 무효라면, 인가가 있어도 그 행위가 유효해지지는 않는다(\u003cstrong>인가에 하자의 치유력은 없다\u003c/strong>). 반대로 원행위가 유효한데 인가만 위법하면 인가의 취소를 다투게 된다.\u003c/p>\n\u003cp>인가는 원칙적으로 신청된 내용을 그대로 인가하거나 거부할 수 있을 뿐이고, \u003cstrong>행정청이 내용을 수정하여 인가(수정인가)하는 것은 법률의 명문 근거가 없는 한 허용되지 않는다\u003c/strong>고 이해된다. 여기서도 명칭 함정에 주의해야 한다 — 「농지법 3조 \u003cstrong>허가\u003c/strong>」는 이름은 허가지만 강학상 \u003cstrong>인가\u003c/strong>이고, 「수도사업 \u003cstrong>인가\u003c/strong>」는 이름은 인가지만 강학상 \u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>다.\u003c/p>\n\u003cp>\u003cstrong>행정행위 3분류 비교표 (최빈출)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>\u003c/th>\u003cth>\u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>\u003c/th>\u003cth>\u003cstrong>認可\u003c/strong>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>성질\u003c/td>\u003ctd>명령적 행위\u003c/td>\u003ctd>형성적 행위\u003c/td>\u003ctd>\u003cstrong>형성적 행위(보충행위)\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>내용\u003c/td>\u003ctd>일반적 금지의 해제 → 자연적 자유 \u003cstrong>회복\u003c/strong>\u003c/td>\u003ctd>새로운 권리·능력의 \u003cstrong>설정\u003c/strong>\u003c/td>\u003ctd>사인 간 법률행위를 \u003cstrong>보충\u003c/strong>하여 효력 완성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재량\u003c/td>\u003ctd>원칙 기속행위\u003c/td>\u003ctd>원칙 재량행위\u003c/td>\u003ctd>원칙 기속(공익 판단 여지 있음)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상\u003c/td>\u003ctd>사실행위·영업활동\u003c/td>\u003ctd>권리·지위\u003c/td>\u003ctd>\u003cstrong>사인 간의 법률행위(계약·정관변경 등)\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>없이 한 행위의 사법상 효력\u003c/td>\u003ctd>원칙 \u003cstrong>유효\u003c/strong>（처벌 대상）\u003c/td>\u003ctd>효과 자체가 발생하지 않음\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위반 시 제재\u003c/td>\u003ctd>\u003cstrong>행정형벌·시정명령 있음\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>처벌 규정이 없는 경우가 많음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 예\u003c/td>\u003ctd>운전면허, 음식점 영업허가, 의사면허\u003c/td>\u003ctd>공기업 특허, 도로점용허가, 공유수면매립면허, 귀화 허가\u003c/td>\u003ctd>\u003cstrong>농지법 3조 허가\u003c/strong>, 공공요금(운임) 인가, 공공조합 설립인가\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>결정적 대비: 무「허가」행위 = 유효(처벌) / 무「인가」행위 = 무효(처벌 없는 경우가 많음).\u003c/strong> 이 한 줄이 3분류 문제의 최다 출제 포인트다.\u003c/li>\u003cli>인가는 \u003cstrong>보충행위\u003c/strong> → 「원래의 법률행위가 없으면 인가도 없다」, 「원행위가 무효면 인가해도 유효해지지 않는다」. 인가에 \u003cstrong>하자 치유력은 없다\u003c/strong>.\u003c/li>\u003cli>근거 조문을 숫자로 기억: \u003cstrong>농지법 3조 1항(허가) → 3조 6항(무허가 행위는 효력 없음)\u003c/strong>. 「강학상 인가」의 대표 조문이다.\u003c/li>\u003cli>「수정인가는 원칙 불가(명문 근거 필요)」 지문에 주의.\u003c/li>\u003cli>명칭 함정: 농지법 3조「허가」= 인가 / 수도사업「인가」= 특허 / 도로점용「허가」= 특허. 이름이 아니라 \u003cstrong>효과의 성질\u003c/strong>로 판단할 것.\u003c/li>\u003c/ul>","search":"認可 にんか 항목 내용 ------ ------ 읽기 にんか（인가） 과목 행정법（행정행위의 분류·형성적 행위） 한줄 정의 사인 私人 간의 법률행위를 보충하여 그 법률상 효력을 완성 시켜 주는 형성적 행정행위（보충행위, 補充行為） 통설·판례 형성적 행위 보충행위 . 인가를 받지 않고 한 행위는 효력이 생기지 않는다 무효 — 許可 許可.md 와의 결정적 차이 개념 認可는 제3자 사인 가 이미 한, 또는 하려는 법률행위에 행정청이 동의를 더해 그 효력을 완성 시키는 행위다. 행정청은 그 법률행위의 당사자가 아니며 어디까지나 보충 補充 할 뿐이므로, 보충할 원래의 법률행위가 없으면 인가도 있을 수 없다. 농지 권리이동 허가 농지법 3조 1항 , 공공요금·운임의 인가 예: 철도사업법 16조 , 공공조합의 설립인가, 하천점용권 양도의 승인 등이 예다. 시험상 가장 중요한 것은 무인가 행위의 효력 이다. 인가는 효력요건 効力要件 이므로 인가를 받지 않고 한 행위는 무효 다. 농지법은 이를 명문으로 규정한다 — 농지법 3조 1항의 허가를 받지 않고 한 행위는 「그 효력을 생기지 않는다」 농지법 3조 6항 . 대비: 許可 許可.md 는 단속법규이므로 무허가 행위라도 사법상 효력은 유효하고 처벌만 받는다 最判昭35.3.18 . 인가의 또 하나의 특징은 원행위의 하자와의 관계 다. 인가는 보충행위에 불과하므로, 기본이 되는 사인의 법률행위 자체에 하자가 있어 무효라면, 인가가 있어도 그 행위가 유효해지지는 않는다 인가에 하자의 치유력은 없다 . 반대로 원행위가 유효한데 인가만 위법하면 인가의 취소를 다투게 된다. 인가는 원칙적으로 신청된 내용을 그대로 인가하거나 거부할 수 있을 뿐이고, 행정청이 내용을 수정하여 인가 수정인가 하는 것은 법률의 명문 근거가 없는 한 허용되지 않는다 고 이해된다. 여기서도 명칭 함정에 주의해야 한다 — 「농지법 3조 허가 」는 이름은 허가지만 강학상 인가 이고, 「수도사업 인가 」는 이름은 인가지만 강학상 特許 特許.md 다. 행정행위 3분류 비교표 최빈출 구분 許可 許可.md 特許 特許.md 認可 ------ ------ ------ ---------- 성질 명령적 행위 형성적 행위 형성적 행위 보충행위 내용 일반적 금지의 해제 → 자연적 자유 회복 새로운 권리·능력의 설정 사인 간 법률행위를 보충 하여 효력 완성 재량 원칙 기속행위 원칙 재량행위 원칙 기속 공익 판단 여지 있음 대상 사실행위·영업활동 권리·지위 사인 간의 법률행위 계약·정관변경 등 없이 한 행위의 사법상 효력 원칙 유효 （처벌 대상） 효과 자체가 발생하지 않음 무효 위반 시 제재 행정형벌·시정명령 있음 — 처벌 규정이 없는 경우가 많음 대표 예 운전면허, 음식점 영업허가, 의사면허 공기업 특허, 도로점용허가, 공유수면매립면허, 귀화 허가 농지법 3조 허가 , 공공요금 운임 인가, 공공조합 설립인가 💡 수험 팁 - 결정적 대비: 무「허가」행위 = 유효 처벌 / 무「인가」행위 = 무효 처벌 없는 경우가 많음 . 이 한 줄이 3분류 문제의 최다 출제 포인트다. - 인가는 보충행위 → 「원래의 법률행위가 없으면 인가도 없다」, 「원행위가 무효면 인가해도 유효해지지 않는다」. 인가에 하자 치유력은 없다 . - 근거 조문을 숫자로 기억: 농지법 3조 1항 허가 → 3조 6항 무허가 행위는 효력 없음 . 「강학상 인가」의 대표 조문이다. - 「수정인가는 원칙 불가 명문 근거 필요 」 지문에 주의. - 명칭 함정: 농지법 3조「허가」= 인가 / 수도사업「인가」= 특허 / 도로점용「허가」= 특허. 이름이 아니라 효과의 성질 로 판단할 것."},"附款":{"type":"term","subject":"용어","id":"附款","title":"附款","sub":"ふかん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ふかん（부관）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 부관·행정작용법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>주된 행정행위의 효과를 제한하거나 의무를 덧붙이기 위해 행정청이 붙이는 \u003cstrong>종된 의사표시\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>재량행위\u003c/strong>에는 법률의 근거가 없어도 붙일 수 있으나 기속행위에는 원칙 불가. 부관 중 \u003cstrong>부담(負担)만 주된 행위와 가분적이어서 독립하여 쟁송 가능\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>附款은 행정청이 행정행위를 하면서 그 효과를 제한하거나 특별한 의무를 부가하기 위해 덧붙이는 \u003cstrong>종(從)된 의사표시\u003c/strong>다. 예컨대 영업허가에 「유효기간 3년」을 붙이거나, 도로점용허가에 「점용료 납부 의무」를 붙이는 것이 이에 해당한다. 부관은 어디까지나 주된 행정행위에 부수하는 것이므로, 주된 행위가 무효이면 부관도 효력을 잃는다.\u003c/p>\n\u003cp>부관을 붙일 수 있는 범위에는 한계가 있다. ① \u003cstrong>재량행위\u003c/strong>에는 법률의 명문 근거가 없어도 붙일 수 있지만, \u003cstrong>기속행위\u003c/strong>에는 법령이 특별히 허용하지 않는 한 붙일 수 없다. ② \u003cstrong>준법률행위적 행정행위(확인·공증·통지·수리)에는 붙일 수 없다\u003c/strong>는 것이 전통적 설명이다. ③ 내용상으로도 법령·행정행위의 목적에 반해서는 안 되고, \u003cstrong>비례원칙·평등원칙·부당결부금지원칙\u003c/strong>의 제약을 받는다.\u003c/p>\n\u003cp>\u003cstrong>부관의 종류 (5분류)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>종류\u003c/th>\u003cth>내용\u003c/th>\u003cth>핵심 포인트\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>조건（条件）\u003c/strong>\u003c/td>\u003ctd>행정행위의 효력 발생·소멸을 \u003cstrong>발생이 불확실한\u003c/strong> 장래의 사실에 걸리게 함\u003c/td>\u003ctd>\u003cstrong>정지조건\u003c/strong>(사실 발생 시 효력 발생) / \u003cstrong>해제조건\u003c/strong>(사실 발생 시 효력 소멸)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>기한（期限）\u003c/strong>\u003c/td>\u003ctd>행정행위의 효력 발생·소멸을 \u003cstrong>도래가 확실한\u003c/strong> 장래의 사실에 걸리게 함\u003c/td>\u003ctd>시기(始期)·종기(終期). 도래일이 특정되면 확정기한, 「사망 시」처럼 시점이 미정이면 불확정기한. \u003cstrong>종기 도래로 행정행위는 당연 실효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>부담（負担）\u003c/strong>\u003c/td>\u003ctd>상대방에게 작위·부작위·급부 등 \u003cstrong>별도의 의무를 부과\u003c/strong>\u003c/td>\u003ctd>의무를 이행하지 않아도 \u003cstrong>주된 행정행위의 효력 자체는 영향받지 않는다\u003c/strong>(다만 \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a> 사유는 될 수 있음). \u003cstrong>유일하게 독립쟁송이 가능\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>철회권의 유보（撤回権の留保）\u003c/strong>\u003c/td>\u003ctd>일정 사유가 생기면 행정행위를 철회할 수 있음을 미리 유보\u003c/td>\u003ctd>유보되어 있다고 해서 \u003cstrong>무조건 철회할 수 있는 것은 아니고\u003c/strong>, 철회에는 별도로 공익상의 필요와 이익형량이 요구된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>법률효과의 일부 배제（法律効果の一部除外）\u003c/strong>\u003c/td>\u003ctd>법령이 부여한 효과 중 일부를 발생하지 않게 함(예: 야간 운행 제외)\u003c/td>\u003ctd>법령이 정한 효과를 행정청이 깎는 것이므로 \u003cstrong>반드시 법률의 근거가 필요\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>조건과 부담의 구별\u003c/strong>이 최빈출이다. 조건(특히 정지조건)은 그 사실이 생기기 전까지 행정행위의 효력 자체가 생기지 않지만, 부담은 이미 효력이 발생한 행정행위에 의무만 덧붙인 것이어서 \u003cstrong>불이행하더라도 본체는 유효\u003c/strong>하다. 상대방에게 유리한 쪽은 부담이므로, 어느 쪽인지 불분명하면 \u003cstrong>부담으로 해석\u003c/strong>하는 것이 타당하다고 본다.\u003c/p>\n\u003cp>\u003cstrong>위법한 부관의 다투는 방법\u003c/strong>도 정리해 두어야 한다. 부관만 떼어 내 취소를 구할 수 있는지는 \u003cstrong>주된 행정행위와의 가분성(可分性)\u003c/strong>으로 판단한다. \u003cstrong>부담은 그 자체가 독립한 처분성을 가지므로 부담만을 대상으로 취소소송을 제기할 수 있다.\u003c/strong> 반면 조건·기한·법률효과의 일부 배제는 주된 행정행위와 불가분일체이므로 부관만 떼어 다툴 수 없고, 행정행위 전체의 취소를 구해야 한다. 부관의 하자가 중대·명백하면 부관은 무효이고, 그 부관이 행정행위의 본질적 요소였다면 \u003cstrong>행정행위 전체가 무효\u003c/strong>가 된다.\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>부담만 독립하여 쟁송 가능\u003c/strong>. 「조건만 취소를 구할 수 있다」는 지문은 오답. 기준은 주된 행정행위와의 \u003cstrong>가분성\u003c/strong>이다.\u003c/li>\u003cli>\u003cstrong>부담은 불이행해도 본체 효력이 소멸하지 않는다.\u003c/strong> 이 점이 해제조건(사실 발생 시 당연 실효)과의 결정적 차이. 다만 부담 불이행은 \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>의 사유가 된다.\u003c/li>\u003cli>\u003cstrong>재량행위 = 법률 근거 없이 부관 가능 / 기속행위 = 원칙 불가\u003c/strong>. 단, \u003cstrong>법률효과의 일부 배제는 재량행위라도 법률의 근거가 필요\u003c/strong>하다 — 이 예외가 함정으로 나온다.\u003c/li>\u003cli>\u003cstrong>철회권을 유보해 두었어도 자유롭게 철회할 수 있는 것은 아니다.\u003c/strong> 공익상 필요와 상대방의 불이익을 비교형량해야 한다(cf. \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>, 最判昭63.6.17).\u003c/li>\u003cli>「종기의 도래로 행정행위는 당연히 효력을 잃는다 → 별도의 \u003ca href=\"#/e/%E8%81%B7%E6%A8%A9%E5%8F%96%E6%B6%88%E3%81%97\">職権取消し\u003c/a>나 철회 처분이 필요 없다」는 점도 자주 묻는다.\u003c/li>\u003c/ul>","search":"附款 ふかん 항목 내용 ------ ------ 읽기 ふかん（부관） 과목 행정법（행정행위의 부관·행정작용법） 한줄 정의 주된 행정행위의 효과를 제한하거나 의무를 덧붙이기 위해 행정청이 붙이는 종된 의사표시 통설·판례 재량행위 에는 법률의 근거가 없어도 붙일 수 있으나 기속행위에는 원칙 불가. 부관 중 부담 負担 만 주된 행위와 가분적이어서 독립하여 쟁송 가능 개념 附款은 행정청이 행정행위를 하면서 그 효과를 제한하거나 특별한 의무를 부가하기 위해 덧붙이는 종 從 된 의사표시 다. 예컨대 영업허가에 「유효기간 3년」을 붙이거나, 도로점용허가에 「점용료 납부 의무」를 붙이는 것이 이에 해당한다. 부관은 어디까지나 주된 행정행위에 부수하는 것이므로, 주된 행위가 무효이면 부관도 효력을 잃는다. 부관을 붙일 수 있는 범위에는 한계가 있다. ① 재량행위 에는 법률의 명문 근거가 없어도 붙일 수 있지만, 기속행위 에는 법령이 특별히 허용하지 않는 한 붙일 수 없다. ② 준법률행위적 행정행위 확인·공증·통지·수리 에는 붙일 수 없다 는 것이 전통적 설명이다. ③ 내용상으로도 법령·행정행위의 목적에 반해서는 안 되고, 비례원칙·평등원칙·부당결부금지원칙 의 제약을 받는다. 부관의 종류 5분류 종류 내용 핵심 포인트 ------ ------ ------------- 조건（条件） 행정행위의 효력 발생·소멸을 발생이 불확실한 장래의 사실에 걸리게 함 정지조건 사실 발생 시 효력 발생 / 해제조건 사실 발생 시 효력 소멸 기한（期限） 행정행위의 효력 발생·소멸을 도래가 확실한 장래의 사실에 걸리게 함 시기 始期 ·종기 終期 . 도래일이 특정되면 확정기한, 「사망 시」처럼 시점이 미정이면 불확정기한. 종기 도래로 행정행위는 당연 실효 부담（負担） 상대방에게 작위·부작위·급부 등 별도의 의무를 부과 의무를 이행하지 않아도 주된 행정행위의 효력 자체는 영향받지 않는다 다만 撤回 撤回.md 사유는 될 수 있음 . 유일하게 독립쟁송이 가능 철회권의 유보（撤回権の留保） 일정 사유가 생기면 행정행위를 철회할 수 있음을 미리 유보 유보되어 있다고 해서 무조건 철회할 수 있는 것은 아니고 , 철회에는 별도로 공익상의 필요와 이익형량이 요구된다 법률효과의 일부 배제（法律効果の一部除外） 법령이 부여한 효과 중 일부를 발생하지 않게 함 예: 야간 운행 제외 법령이 정한 효과를 행정청이 깎는 것이므로 반드시 법률의 근거가 필요 조건과 부담의 구별 이 최빈출이다. 조건 특히 정지조건 은 그 사실이 생기기 전까지 행정행위의 효력 자체가 생기지 않지만, 부담은 이미 효력이 발생한 행정행위에 의무만 덧붙인 것이어서 불이행하더라도 본체는 유효 하다. 상대방에게 유리한 쪽은 부담이므로, 어느 쪽인지 불분명하면 부담으로 해석 하는 것이 타당하다고 본다. 위법한 부관의 다투는 방법 도 정리해 두어야 한다. 부관만 떼어 내 취소를 구할 수 있는지는 주된 행정행위와의 가분성 可分性 으로 판단한다. 부담은 그 자체가 독립한 처분성을 가지므로 부담만을 대상으로 취소소송을 제기할 수 있다. 반면 조건·기한·법률효과의 일부 배제는 주된 행정행위와 불가분일체이므로 부관만 떼어 다툴 수 없고, 행정행위 전체의 취소를 구해야 한다. 부관의 하자가 중대·명백하면 부관은 무효이고, 그 부관이 행정행위의 본질적 요소였다면 행정행위 전체가 무효 가 된다. 💡 수험 팁 - 부담만 독립하여 쟁송 가능 . 「조건만 취소를 구할 수 있다」는 지문은 오답. 기준은 주된 행정행위와의 가분성 이다. - 부담은 불이행해도 본체 효력이 소멸하지 않는다. 이 점이 해제조건 사실 발생 시 당연 실효 과의 결정적 차이. 다만 부담 불이행은 撤回 撤回.md 의 사유가 된다. - 재량행위 = 법률 근거 없이 부관 가능 / 기속행위 = 원칙 불가 . 단, 법률효과의 일부 배제는 재량행위라도 법률의 근거가 필요 하다 — 이 예외가 함정으로 나온다. - 철회권을 유보해 두었어도 자유롭게 철회할 수 있는 것은 아니다. 공익상 필요와 상대방의 불이익을 비교형량해야 한다 cf. 撤回 撤回.md , 最判昭63.6.17 . - 「종기의 도래로 행정행위는 당연히 효력을 잃는다 → 별도의 職権取消し 職権取消し.md 나 철회 처분이 필요 없다」는 점도 자주 묻는다."},"職権取消し":{"type":"term","subject":"용어","id":"職権取消し","title":"職権取消し","sub":"しょっけんとりけし","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しょっけんとりけし（직권취소）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 효력 소멸）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정행위의 \u003cstrong>성립 당시부터 있던 하자(원시적 하자, 위법 또는 부당)\u003c/strong>를 이유로, 행정청이 직권으로 그 효력을 \u003cstrong>소급적으로\u003c/strong> 소멸시키는 행위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>법률의 근거 불요\u003c/strong>（위법 상태의 제거는 「법률에 의한 행정」의 요청이므로）. 다만 수익적 행정행위의 직권취소는 신뢰보호·법적 안정성 때문에 이익형량으로 제한된다（最判昭43.11.7）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정행위에 성립 당시부터 하자가 있으면, 그 하자가 중대·명백하여 무효인 경우를 제외하고는 \u003cstrong>공정력(公定力)\u003c/strong>에 의해 일단 유효한 것으로 통용된다. 이 하자 있는 행위의 효력을 없애는 방법이 「취소」이며, 취소는 두 갈래로 나뉜다. 사인이 심사청구나 취소소송으로 다투어 이루어지는 \u003cstrong>쟁송취소(争訟取消し)\u003c/strong>와, 행정청이 스스로 나서서 없애는 \u003cstrong>직권취소(職権取消し)\u003c/strong>다. 이 항목은 후자를 다룬다.\u003c/p>\n\u003cp>직권취소의 사유는 \u003cstrong>원시적 하자\u003c/strong>, 즉 행정행위를 할 당시에 이미 존재했던 위법 또는 \u003cstrong>부당\u003c/strong>이다. 위법뿐 아니라 부당(재량의 당·부당)까지 취소사유가 된다는 점이 쟁송취소(취소소송은 위법만 심리)와 다르다. 효과는 원칙적으로 \u003cstrong>소급(遡及)\u003c/strong>하여, 그 행정행위는 처음부터 없었던 것으로 다루어진다. 대비: \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>는 후발적 사정을 이유로 \u003cstrong>장래를 향해서만\u003c/strong> 효력을 소멸시킨다.\u003c/p>\n\u003cp>직권취소에는 \u003cstrong>법률의 명문 근거가 필요 없다\u003c/strong>는 것이 통설·판례다. 위법한 상태를 스스로 시정하는 것은 오히려 「법률에 의한 행정의 원리」가 요구하는 바이고, 원래의 행정행위를 할 권한 안에 그 시정 권한도 포함되어 있다고 보기 때문이다. 취소 권한은 \u003cstrong>처분청뿐 아니라 정당한 권한을 가진 감독청(監督庁)에도 인정된다\u003c/strong>고 이해된다. 대비: \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>는 처분청만 할 수 있다.\u003c/p>\n\u003cp>다만 상대방에게 이익을 주는 \u003cstrong>수익적 행정행위(授益的行政行為)\u003c/strong>를 직권취소하면 상대방의 신뢰와 법적 안정성이 깨진다. 판례는 「처분을 한 행정청 기타 정당한 권한을 가지는 행정청은, \u003cstrong>취소로 인해 생기는 불이익과, 취소하지 않고 이미 생긴 효과를 그대로 유지하는 불이익을 비교형량\u003c/strong>하여, 그 처분을 방치하는 것이 \u003cstrong>공공복리의 요청에 비추어 현저히 부당하다고 인정될 때에 한하여\u003c/strong> 이를 취소할 수 있다」고 판시했다(最判昭43.11.7). 또한 수익적 처분의 직권취소는 상대방에게 불이익한 처분이므로 \u003cstrong>행정절차법상 청문·변명의 기회 부여(행정절차법 13조)와 이유 제시(14조)\u003c/strong>가 필요하다.\u003c/p>\n\u003cp>\u003cstrong>職権取消し와 \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a> 비교표 (최빈출)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003cstrong>職権取消し\u003c/strong>\u003c/th>\u003cth>\u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사유\u003c/td>\u003ctd>\u003cstrong>원시적 하자\u003c/strong> — 성립 당시의 위법 또는 \u003cstrong>부당\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>후발적 사정\u003c/strong> — 사후의 사정변경, 의무위반, 공익상 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효력의 시점\u003c/td>\u003ctd>\u003cstrong>소급(遡及)\u003c/strong> — 처음부터 효력 없었던 것으로\u003c/td>\u003ctd>\u003cstrong>장래효(将来効)\u003c/strong> — 그때부터 장래를 향해 소멸\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주체\u003c/td>\u003ctd>처분청 \u003cstrong>+ 감독청\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>처분청만\u003c/strong>（감독청은 불가）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법률의 근거\u003c/td>\u003ctd>\u003cstrong>불요\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>불요\u003c/strong>（判例, 最判昭63.6.17）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제한 법리\u003c/td>\u003ctd>수익적 행위는 신뢰보호·법적 안정성 고려한 \u003cstrong>이익형량\u003c/strong>（最判昭43.11.7）\u003c/td>\u003ctd>공익상 필요와 상대방의 불이익을 \u003cstrong>비교형량\u003c/strong>（最判昭63.6.17）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>손실보상\u003c/td>\u003ctd>하자가 있었던 이상 원칙적으로 문제되지 않음\u003c/td>\u003ctd>상대방에게 귀책사유가 없는 공익상 철회는 \u003cstrong>손실보상\u003c/strong>이 문제될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법령상 표기\u003c/td>\u003ctd>「취소(取消し)」\u003c/td>\u003ctd>법령상으로도 「취소(取消し)」로 표기되는 경우가 많다 \u003cstrong>(함정)\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>農地買収・売渡計画の職権取消事件（농지 매수·매도계획 직권취소 사건）\u003c/td>\u003ctd>最判昭43.11.7\u003c/td>\u003ctd>자작농창설특별조치법에 따라 A 소유로 알고 매수·매도계획을 세워 처분했으나 실제 소유자가 C였음이 밝혀져 행정청이 직권으로 취소한 사안\u003c/td>\u003ctd>\u003cstrong>직권취소 가능\u003c/strong>. 처분청 기타 정당한 권한을 가진 행정청은 스스로 위법·부당을 인정하고, \u003cstrong>취소로 생기는 불이익과 취소하지 않을 때의 불이익을 비교형량\u003c/strong>하여, 처분을 방치하는 것이 공공복리의 요청상 \u003cstrong>현저히 부당\u003c/strong>하다고 인정될 때에 한해 취소할 수 있다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>키워드 두 개만 정확히: 「원시적 하자」+「소급」.\u003c/strong> 후발적 사정을 이유로 취소한다는 지문은 \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a>와 바꿔치기한 오답이다.\u003c/li>\u003cli>\u003cstrong>법률의 근거는 불요.\u003c/strong> 「직권취소에는 법률의 근거가 필요하다」는 지문은 오답. 撤回도 마찬가지로 불요다.\u003c/li>\u003cli>주체 대비가 자주 나온다 — \u003cstrong>직권취소는 감독청도 가능, 철회는 처분청만.\u003c/strong> 헷갈리면 「하자를 고치는 일은 윗선도 할 수 있지만, 새 사정에 따른 정책 판단은 처분한 청만」으로 기억.\u003c/li>\u003cli>\u003cstrong>부당(不当)도 직권취소 사유\u003c/strong>다. 취소소송에서는 위법만 다툴 수 있지만(심사청구는 부당도 가능), 직권취소는 부당까지 포함한다.\u003c/li>\u003cli>\u003cstrong>법령이 「취소」라고 써 있어도 실질은 撤回인 경우가 대부분\u003c/strong>이다(예: 영업허가의 「취소」 처분). 원시적 하자인지 후발적 사정인지로 판별할 것.\u003c/li>\u003cli>수익적 처분을 직권취소할 때는 \u003cstrong>행정절차법 13조(청문 등)·14조(이유 제시)\u003c/strong> 적용 여부가 함께 출제된다.\u003c/li>\u003c/ul>","search":"職権取消し しょっけんとりけし 항목 내용 ------ ------ 읽기 しょっけんとりけし（직권취소） 과목 행정법（행정행위의 효력 소멸） 한줄 정의 행정행위의 성립 당시부터 있던 하자 원시적 하자, 위법 또는 부당 를 이유로, 행정청이 직권으로 그 효력을 소급적으로 소멸시키는 행위 통설·판례 법률의 근거 불요 （위법 상태의 제거는 「법률에 의한 행정」의 요청이므로）. 다만 수익적 행정행위의 직권취소는 신뢰보호·법적 안정성 때문에 이익형량으로 제한된다（最判昭43.11.7） 개념 행정행위에 성립 당시부터 하자가 있으면, 그 하자가 중대·명백하여 무효인 경우를 제외하고는 공정력 公定力 에 의해 일단 유효한 것으로 통용된다. 이 하자 있는 행위의 효력을 없애는 방법이 「취소」이며, 취소는 두 갈래로 나뉜다. 사인이 심사청구나 취소소송으로 다투어 이루어지는 쟁송취소 争訟取消し 와, 행정청이 스스로 나서서 없애는 직권취소 職権取消し 다. 이 항목은 후자를 다룬다. 직권취소의 사유는 원시적 하자 , 즉 행정행위를 할 당시에 이미 존재했던 위법 또는 부당 이다. 위법뿐 아니라 부당 재량의 당·부당 까지 취소사유가 된다는 점이 쟁송취소 취소소송은 위법만 심리 와 다르다. 효과는 원칙적으로 소급 遡及 하여, 그 행정행위는 처음부터 없었던 것으로 다루어진다. 대비: 撤回 撤回.md 는 후발적 사정을 이유로 장래를 향해서만 효력을 소멸시킨다. 직권취소에는 법률의 명문 근거가 필요 없다 는 것이 통설·판례다. 위법한 상태를 스스로 시정하는 것은 오히려 「법률에 의한 행정의 원리」가 요구하는 바이고, 원래의 행정행위를 할 권한 안에 그 시정 권한도 포함되어 있다고 보기 때문이다. 취소 권한은 처분청뿐 아니라 정당한 권한을 가진 감독청 監督庁 에도 인정된다 고 이해된다. 대비: 撤回 撤回.md 는 처분청만 할 수 있다. 다만 상대방에게 이익을 주는 수익적 행정행위 授益的行政行為 를 직권취소하면 상대방의 신뢰와 법적 안정성이 깨진다. 판례는 「처분을 한 행정청 기타 정당한 권한을 가지는 행정청은, 취소로 인해 생기는 불이익과, 취소하지 않고 이미 생긴 효과를 그대로 유지하는 불이익을 비교형량 하여, 그 처분을 방치하는 것이 공공복리의 요청에 비추어 현저히 부당하다고 인정될 때에 한하여 이를 취소할 수 있다」고 판시했다 最判昭43.11.7 . 또한 수익적 처분의 직권취소는 상대방에게 불이익한 처분이므로 행정절차법상 청문·변명의 기회 부여 행정절차법 13조 와 이유 제시 14조 가 필요하다. 職権取消し와 撤回 撤回.md 비교표 최빈출 구분 職権取消し 撤回 撤回.md ------ ---------------- ------ 사유 원시적 하자 — 성립 당시의 위법 또는 부당 후발적 사정 — 사후의 사정변경, 의무위반, 공익상 필요 효력의 시점 소급 遡及 — 처음부터 효력 없었던 것으로 장래효 将来効 — 그때부터 장래를 향해 소멸 주체 처분청 + 감독청 처분청만 （감독청은 불가） 법률의 근거 불요 불요 （判例, 最判昭63.6.17） 제한 법리 수익적 행위는 신뢰보호·법적 안정성 고려한 이익형량 （最判昭43.11.7） 공익상 필요와 상대방의 불이익을 비교형량 （最判昭63.6.17） 손실보상 하자가 있었던 이상 원칙적으로 문제되지 않음 상대방에게 귀책사유가 없는 공익상 철회는 손실보상 이 문제될 수 있음 법령상 표기 「취소 取消し 」 법령상으로도 「취소 取消し 」로 표기되는 경우가 많다 함정 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 農地買収・売渡計画の職権取消事件（농지 매수·매도계획 직권취소 사건） 最判昭43.11.7 자작농창설특별조치법에 따라 a 소유로 알고 매수·매도계획을 세워 처분했으나 실제 소유자가 c였음이 밝혀져 행정청이 직권으로 취소한 사안 직권취소 가능 . 처분청 기타 정당한 권한을 가진 행정청은 스스로 위법·부당을 인정하고, 취소로 생기는 불이익과 취소하지 않을 때의 불이익을 비교형량 하여, 처분을 방치하는 것이 공공복리의 요청상 현저히 부당 하다고 인정될 때에 한해 취소할 수 있다 💡 수험 팁 - 키워드 두 개만 정확히: 「원시적 하자」+「소급」. 후발적 사정을 이유로 취소한다는 지문은 撤回 撤回.md 와 바꿔치기한 오답이다. - 법률의 근거는 불요. 「직권취소에는 법률의 근거가 필요하다」는 지문은 오답. 撤回도 마찬가지로 불요다. - 주체 대비가 자주 나온다 — 직권취소는 감독청도 가능, 철회는 처분청만. 헷갈리면 「하자를 고치는 일은 윗선도 할 수 있지만, 새 사정에 따른 정책 판단은 처분한 청만」으로 기억. - 부당 不当 도 직권취소 사유 다. 취소소송에서는 위법만 다툴 수 있지만 심사청구는 부당도 가능 , 직권취소는 부당까지 포함한다. - 법령이 「취소」라고 써 있어도 실질은 撤回인 경우가 대부분 이다 예: 영업허가의 「취소」 처분 . 원시적 하자인지 후발적 사정인지로 판별할 것. - 수익적 처분을 직권취소할 때는 행정절차법 13조 청문 등 ·14조 이유 제시 적용 여부가 함께 출제된다."},"撤回":{"type":"term","subject":"용어","id":"撤回","title":"撤回","sub":"てっかい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>てっかい（철회）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 효력 소멸）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>하자 없이 성립한 행정행위를 \u003cstrong>후발적 사정\u003c/strong>을 이유로 \u003cstrong>장래를 향해\u003c/strong> 실효시키는 독립한 행정행위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>법률의 근거 불요\u003c/strong>. 수익적 행정행위라도 \u003cstrong>철회해야 할 공익상의 필요가 높다고 인정되면 명문 규정이 없어도 철회할 수 있다\u003c/strong>（最判昭63.6.17）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>撤回는 성립 당시에는 아무 하자 없이 적법·타당했던 행정행위를, 그 후에 생긴 사정 때문에 더 이상 존속시킬 수 없게 되어 \u003cstrong>장래를 향해\u003c/strong> 효력을 잃게 하는 행위다. 후발적 사정에는 ① 상대방의 의무위반·법령위반, ② \u003ca href=\"#/e/%E9%99%84%E6%AC%BE\">附款\u003c/a>으로 붙인 부담의 불이행, ③ 사정변경, ④ 공익상의 필요 등이 있다. 대비: \u003ca href=\"#/e/%E8%81%B7%E6%A8%A9%E5%8F%96%E6%B6%88%E3%81%97\">職権取消し\u003c/a>는 \u003cstrong>원시적 하자\u003c/strong>를 이유로 \u003cstrong>소급\u003c/strong>하여 실효시킨다.\u003c/p>\n\u003cp>철회는 그 자체가 \u003cstrong>하나의 독립한 행정행위\u003c/strong>다. 따라서 철회를 할 수 있는 것은 \u003cstrong>처분청뿐이고, 감독청은 철회할 수 없다\u003c/strong>. 감독청은 새로운 공익 판단에 기초해 처분을 다시 할 권한이 없기 때문이다. 대비: 직권취소는 감독청도 할 수 있다.\u003c/p>\n\u003cp>가장 중요한 논점은 \u003cstrong>법률의 근거가 필요한가\u003c/strong>다. 철회는 상대방의 기득 이익을 빼앗는 침익적 효과를 가지므로 법률의 근거가 필요하다는 견해도 있으나, \u003cstrong>판례는 법률의 근거를 요하지 않는다\u003c/strong>는 입장이다. 우생보호법상 지정의사가 실자(実子) 알선을 반복한 사안에서, 최고재는 「지정을 철회해야 할 \u003cstrong>공익상의 필요성이 높다고 인정되는 경우에는\u003c/strong>, 법령상 그 철회에 관한 직접의 명문 규정이 없더라도 지정의사의 지정을 철회할 수 있다」고 판시했다(最判昭63.6.17). 다만 무제한은 아니고, \u003cstrong>철회에 의해 상대방이 입는 불이익과 철회의 공익상 필요를 비교형량\u003c/strong>해야 한다.\u003c/p>\n\u003cp>철회로 상대방이 손실을 입은 경우 \u003cstrong>손실보상\u003c/strong>이 필요한지도 논점이다. 상대방의 의무위반·귀책사유에 의한 철회라면 보상은 불필요하지만, 상대방에게 아무 잘못 없이 오로지 공익상의 필요로 철회한 경우에는 보상이 문제될 수 있다. 또한 수익적 처분의 철회는 불이익처분이므로 \u003cstrong>행정절차법상 청문(13조 1항 1호 ロ — 허가 등의 철회는 청문 사유)과 이유 제시(14조)\u003c/strong>가 요구된다.\u003c/p>\n\u003cp>\u003cstrong>\u003ca href=\"#/e/%E8%81%B7%E6%A8%A9%E5%8F%96%E6%B6%88%E3%81%97\">職権取消し\u003c/a>와 撤回 비교표 (최빈출)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003ca href=\"#/e/%E8%81%B7%E6%A8%A9%E5%8F%96%E6%B6%88%E3%81%97\">職権取消し\u003c/a>\u003c/th>\u003cth>\u003cstrong>撤回\u003c/strong>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>사유\u003c/td>\u003ctd>\u003cstrong>원시적 하자\u003c/strong> — 성립 당시의 위법·부당\u003c/td>\u003ctd>\u003cstrong>후발적 사정\u003c/strong> — 의무위반, 부담 불이행, 사정변경, 공익상 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>효력의 시점\u003c/td>\u003ctd>\u003cstrong>소급(遡及)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>장래효(将来効)\u003c/strong> — 철회 시점부터\u003c/td>\u003c/tr>\u003ctr>\u003ctd>주체\u003c/td>\u003ctd>처분청 \u003cstrong>+ 감독청\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>처분청만\u003c/strong>（감독청 불가）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법률의 근거\u003c/td>\u003ctd>불요\u003c/td>\u003ctd>\u003cstrong>불요\u003c/strong>（判例 最判昭63.6.17）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>제한 법리\u003c/td>\u003ctd>취소·불취소의 불이익 비교형량, 공공복리상 현저히 부당할 때（最判昭43.11.7）\u003c/td>\u003ctd>\u003cstrong>공익상 필요 vs 상대방의 불이익\u003c/strong>의 비교형량（最判昭63.6.17）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>손실보상\u003c/td>\u003ctd>원칙 문제되지 않음\u003c/td>\u003ctd>상대방에게 \u003cstrong>귀책사유가 없는 공익상 철회\u003c/strong>는 보상이 문제될 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>행정절차법\u003c/td>\u003ctd>수익적 처분의 취소는 불이익처분 → 청문·이유 제시\u003c/td>\u003ctd>허가 등의 철회는 \u003cstrong>청문 사유\u003c/strong>（13조 1항 1호 ロ）·이유 제시\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>実子あっせん事件（실자 알선 사건 / 菊田医師事件）\u003c/td>\u003ctd>最判昭63.6.17\u003c/td>\u003ctd>우생보호법상 지정을 받은 의사가 허위 출생증명서를 발급해 타인의 영아를 다른 사람의 친자로 만드는 실자 알선을 다수 반복한 사실이 드러나, 의사회가 지정의사 지정을 철회한 사안\u003c/td>\u003ctd>\u003cstrong>철회 적법\u003c/strong>. 수익적 행정행위라도 \u003cstrong>철회해야 할 공익상의 필요성이 높다고 인정되는 경우에는, 법령상 철회에 관한 직접의 명문 규정이 없더라도\u003c/strong> 철회할 수 있다. 상대방이 입는 불이익을 고려해도 공익상의 필요가 이를 상회한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「철회에는 법률의 근거가 필요하다」는 지문은 오답.\u003c/strong> 판례(最判昭63.6.17)는 명문 규정이 없어도 철회할 수 있다고 했다. 판례명 「실자 알선 = 지정의사 지정 철회」로 사안까지 붙여 외울 것.\u003c/li>\u003cli>\u003cstrong>키워드: 「후발적 사정」+「장래효」.\u003c/strong> \u003ca href=\"#/e/%E8%81%B7%E6%A8%A9%E5%8F%96%E6%B6%88%E3%81%97\">職権取消し\u003c/a>의 「원시적 하자」+「소급」과 2×2로 짝지어 암기하면 대부분의 지문이 걸러진다.\u003c/li>\u003cli>\u003cstrong>철회는 처분청만.\u003c/strong> 「감독청도 철회할 수 있다」는 지문은 오답(직권취소와 바꿔치기).\u003c/li>\u003cli>\u003ca href=\"#/e/%E9%99%84%E6%AC%BE\">附款\u003c/a>으로 \u003cstrong>철회권을 유보해 두었더라도 곧바로 자유롭게 철회할 수 있는 것은 아니다.\u003c/strong> 여전히 공익상 필요와 불이익의 비교형량이 필요하다.\u003c/li>\u003cli>\u003cstrong>법령이 「취소」라 부르는 처분의 대부분이 실질은 철회\u003c/strong>다(영업허가의 「취소」 등). 문제 문장에서 사유가 「사후의 위반행위」면 철회로 읽을 것.\u003c/li>\u003cli>귀책사유 없는 공익상 철회 → \u003cstrong>손실보상\u003c/strong> 논점으로 연결된다.\u003c/li>\u003c/ul>","search":"撤回 てっかい 항목 내용 ------ ------ 읽기 てっかい（철회） 과목 행정법（행정행위의 효력 소멸） 한줄 정의 하자 없이 성립한 행정행위를 후발적 사정 을 이유로 장래를 향해 실효시키는 독립한 행정행위 통설·판례 법률의 근거 불요 . 수익적 행정행위라도 철회해야 할 공익상의 필요가 높다고 인정되면 명문 규정이 없어도 철회할 수 있다 （最判昭63.6.17） 개념 撤回는 성립 당시에는 아무 하자 없이 적법·타당했던 행정행위를, 그 후에 생긴 사정 때문에 더 이상 존속시킬 수 없게 되어 장래를 향해 효력을 잃게 하는 행위다. 후발적 사정에는 ① 상대방의 의무위반·법령위반, ② 附款 附款.md 으로 붙인 부담의 불이행, ③ 사정변경, ④ 공익상의 필요 등이 있다. 대비: 職権取消し 職権取消し.md 는 원시적 하자 를 이유로 소급 하여 실효시킨다. 철회는 그 자체가 하나의 독립한 행정행위 다. 따라서 철회를 할 수 있는 것은 처분청뿐이고, 감독청은 철회할 수 없다 . 감독청은 새로운 공익 판단에 기초해 처분을 다시 할 권한이 없기 때문이다. 대비: 직권취소는 감독청도 할 수 있다. 가장 중요한 논점은 법률의 근거가 필요한가 다. 철회는 상대방의 기득 이익을 빼앗는 침익적 효과를 가지므로 법률의 근거가 필요하다는 견해도 있으나, 판례는 법률의 근거를 요하지 않는다 는 입장이다. 우생보호법상 지정의사가 실자 実子 알선을 반복한 사안에서, 최고재는 「지정을 철회해야 할 공익상의 필요성이 높다고 인정되는 경우에는 , 법령상 그 철회에 관한 직접의 명문 규정이 없더라도 지정의사의 지정을 철회할 수 있다」고 판시했다 最判昭63.6.17 . 다만 무제한은 아니고, 철회에 의해 상대방이 입는 불이익과 철회의 공익상 필요를 비교형량 해야 한다. 철회로 상대방이 손실을 입은 경우 손실보상 이 필요한지도 논점이다. 상대방의 의무위반·귀책사유에 의한 철회라면 보상은 불필요하지만, 상대방에게 아무 잘못 없이 오로지 공익상의 필요로 철회한 경우에는 보상이 문제될 수 있다. 또한 수익적 처분의 철회는 불이익처분이므로 행정절차법상 청문 13조 1항 1호 ロ — 허가 등의 철회는 청문 사유 과 이유 제시 14조 가 요구된다. 職権取消し 職権取消し.md 와 撤回 비교표 최빈출 구분 職権取消し 職権取消し.md 撤回 ------ ------ ---------- 사유 원시적 하자 — 성립 당시의 위법·부당 후발적 사정 — 의무위반, 부담 불이행, 사정변경, 공익상 필요 효력의 시점 소급 遡及 장래효 将来効 — 철회 시점부터 주체 처분청 + 감독청 처분청만 （감독청 불가） 법률의 근거 불요 불요 （判例 最判昭63.6.17） 제한 법리 취소·불취소의 불이익 비교형량, 공공복리상 현저히 부당할 때（最判昭43.11.7） 공익상 필요 vs 상대방의 불이익 의 비교형량（最判昭63.6.17） 손실보상 원칙 문제되지 않음 상대방에게 귀책사유가 없는 공익상 철회 는 보상이 문제될 수 있음 행정절차법 수익적 처분의 취소는 불이익처분 → 청문·이유 제시 허가 등의 철회는 청문 사유 （13조 1항 1호 ロ）·이유 제시 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 実子あっせん事件（실자 알선 사건 / 菊田医師事件） 最判昭63.6.17 우생보호법상 지정을 받은 의사가 허위 출생증명서를 발급해 타인의 영아를 다른 사람의 친자로 만드는 실자 알선을 다수 반복한 사실이 드러나, 의사회가 지정의사 지정을 철회한 사안 철회 적법 . 수익적 행정행위라도 철회해야 할 공익상의 필요성이 높다고 인정되는 경우에는, 법령상 철회에 관한 직접의 명문 규정이 없더라도 철회할 수 있다. 상대방이 입는 불이익을 고려해도 공익상의 필요가 이를 상회한다 💡 수험 팁 - 「철회에는 법률의 근거가 필요하다」는 지문은 오답. 판례 最判昭63.6.17 는 명문 규정이 없어도 철회할 수 있다고 했다. 판례명 「실자 알선 = 지정의사 지정 철회」로 사안까지 붙여 외울 것. - 키워드: 「후발적 사정」+「장래효」. 職権取消し 職権取消し.md 의 「원시적 하자」+「소급」과 2×2로 짝지어 암기하면 대부분의 지문이 걸러진다. - 철회는 처분청만. 「감독청도 철회할 수 있다」는 지문은 오답 직권취소와 바꿔치기 . - 附款 附款.md 으로 철회권을 유보해 두었더라도 곧바로 자유롭게 철회할 수 있는 것은 아니다. 여전히 공익상 필요와 불이익의 비교형량이 필요하다. - 법령이 「취소」라 부르는 처분의 대부분이 실질은 철회 다 영업허가의 「취소」 등 . 문제 문장에서 사유가 「사후의 위반행위」면 철회로 읽을 것. - 귀책사유 없는 공익상 철회 → 손실보상 논점으로 연결된다."},"裁量権の逸脱・濫用":{"type":"term","subject":"용어","id":"裁量権の逸脱・濫用","title":"裁量権の逸脱・濫用","sub":"さいりょうけんのいつだつ・らんよう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>さいりょうけんのいつだつ・らんよう（재량권의 일탈·남용）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정재량·행정사건소송법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정청의 재량처분에 대해 법원이 개입할 수 있는 \u003cstrong>유일한 경우\u003c/strong> — 재량권의 범위를 넘거나(일탈) 재량권을 남용한 때\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>재량처분은 \u003cstrong>재량권의 일탈·남용이 있는 경우에 한해\u003c/strong> 법원이 취소할 수 있다（행정사건소송법 30조）. 심사방식은 \u003cstrong>사회통념심사\u003c/strong>와 \u003cstrong>판단과정심사\u003c/strong>의 두 갈래\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정청에 재량이 인정되는 처분에 대해서는, 법원이 「자기가 행정청이라면 어떻게 했을까」를 판단해 처분의 당·부당을 심사할 수 없다. 삼권분립상 재량 판단은 일차적으로 행정청의 몫이기 때문이다. 그래서 \u003cstrong>행정사건소송법 30조\u003c/strong>는 「행정청의 재량처분에 대해서는, \u003cstrong>재량권의 범위를 넘거나 또는 그 남용이 있었던 경우에 한하여\u003c/strong>, 법원은 그 처분을 취소할 수 있다」고 규정한다. 「~에 한하여(に限り)」라는 문언이 시험 포인트다.\u003c/p>\n\u003cp>전통적으로 \u003cstrong>일탈(逸脱)\u003c/strong>은 재량권의 외적 한계를 넘은 경우(법이 정한 범위 밖의 처분), \u003cstrong>남용(濫用)\u003c/strong>은 재량권을 부여한 목적에 반해 행사한 경우로 구별되지만, 실무·판례는 양자를 엄밀히 나누지 않고 「일탈·남용」으로 묶어 판단한다. 구체적 위법 유형으로는 ① 사실의 기초를 결여(사실오인), ② 목적·동기의 부정(타사고려, 他事考慮), ③ \u003cstrong>평등원칙\u003c/strong> 위반, ④ \u003cstrong>비례원칙\u003c/strong> 위반, ⑤ 고려해야 할 사항의 부당한 경시(고려부진, 考慮不尽), ⑥ 신뢰보호원칙 위반 등이 든다.\u003c/p>\n\u003cp>심사방식은 크게 둘로 나뉜다. 첫째는 \u003cstrong>사회통념심사(社会観念審査)\u003c/strong>로, 「처분이 \u003cstrong>사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한\u003c/strong> 경우에 한해 위법」이라고 보는 방식이다(神戸税関事件, マクリーン事件). 심사 밀도가 매우 낮아 행정청이 이기기 쉽다. 둘째는 \u003cstrong>판단과정심사(判断過程審査)\u003c/strong>로, 결론이 아니라 \u003cstrong>판단에 이르는 과정\u003c/strong>에 초점을 맞춘다. 즉 「본래 가장 중시해야 할 사항을 부당하게 경시했는가(고려부진)」, 「고려해서는 안 될 사항을 고려했는가(타사고려)」, 「과대·과소평가가 있었는가」를 따진다. 日光太郎杉事件(東京高判昭48.7.13)이 이 방식을 개척했고, 전문기술적 재량이 문제된 伊方原発訴訟(最判平4.10.29)에서도 심사기준 자체의 불합리성과 조사·심의 과정의 과오·결락을 심사하는 형태로 채택되었다.\u003c/p>\n\u003cp>재량이 어느 단계에 인정되는지에 따라 \u003ca href=\"#/e/%E8%A6%81%E4%BB%B6%E8%A3%81%E9%87%8F\">要件裁量\u003c/a>(요건 해당성 판단의 재량)과 효과재량(어떤 처분을 할지·할지 말지의 재량)으로 나뉘며, 어느 쪽이든 그 행사가 일탈·남용에 이르면 위법이 된다. 재량이 전혀 없는 \u003cstrong>기속행위(羈束行為)\u003c/strong>에 대해서는 애초에 30조가 적용되지 않고, 법원이 법 요건 해당성을 전면적으로 심사한다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>マクリーン事件（매클린 사건）\u003c/td>\u003ctd>最大判昭53.10.4 / 民集32巻7号1223頁\u003c/td>\u003ctd>외국인의 재류기간 갱신 불허가 처분에서, 재류 중의 정치활동을 소극적 사정으로 참작한 것이 재량권 일탈·남용인지\u003c/td>\u003ctd>\u003cstrong>처분 적법\u003c/strong>. 재류 갱신의 판단은 법무대신의 광범한 재량에 속하고, 그 판단이 \u003cstrong>전혀 사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해\u003c/strong> 일탈·남용으로 위법이 된다（\u003cstrong>사회통념심사\u003c/strong>의 대표례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>神戸税関事件（고베 세관 사건）\u003c/td>\u003ctd>最判昭52.12.20\u003c/td>\u003ctd>조합활동을 이유로 한 세관 직원 징계면직 처분의 적법성\u003c/td>\u003ctd>\u003cstrong>처분 적법\u003c/strong>. 징계권자의 재량 판단이 \u003cstrong>사회통념상 현저히 타당성을 결여하여 재량권을 남용했다고 인정되는 경우에 한해\u003c/strong> 위법. 법원은 징계권자와 같은 입장에서 처분의 당부를 판단하는 것이 아니다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>日光太郎杉事件（닛코 다로스기 사건）\u003c/td>\u003ctd>東京高判昭48.7.13\u003c/td>\u003ctd>도로 확장을 위한 토지수용 사업인정에서, 문화재적 가치를 지닌 노거수(太郎杉)의 보존 이익이 충분히 고려되었는지\u003c/td>\u003ctd>\u003cstrong>처분 위법\u003c/strong>. 본래 가장 중시해야 할 사항을 \u003cstrong>부당하게 경시(고려부진)\u003c/strong>하고, 고려해서는 안 될 사항을 고려(\u003cstrong>타사고려\u003c/strong>)하거나 과대평가한 경우 재량권 일탈·남용이 된다（\u003cstrong>판단과정심사\u003c/strong>의 선구）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>伊方原発訴訟（이카타 원전 소송）\u003c/td>\u003ctd>最判平4.10.29\u003c/td>\u003ctd>원자로 설치허가 처분의 안전성 판단에 대한 사법심사의 방법\u003c/td>\u003ctd>법원은 \u003cstrong>현재의 과학기술 수준에 비추어, ① 구체적 심사기준에 불합리한 점이 있는지, ② 조사·심의 및 판단 과정에 간과하기 어려운 과오·결락이 있는지\u003c/strong>를 심사한다. 심사기준·조사과정에 불합리가 없다는 점은 \u003cstrong>피고 행정청이 먼저 주장·입증\u003c/strong>해야 하고, 이를 다하지 못하면 불합리한 점이 있는 것으로 사실상 추인된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>剣道実技拒否事件（검도 실기 거부 사건 / 神戸高専事件）\u003c/td>\u003ctd>最判平8.3.8\u003c/td>\u003ctd>종교상의 이유로 검도 실기를 거부한 학생에 대한 원급유치·퇴학 처분\u003c/td>\u003ctd>\u003cstrong>처분 위법\u003c/strong>. 대체수단의 검토 등 고려해야 할 사정을 고려하지 않은 채 한 처분은 \u003cstrong>사회통념상 현저히 타당성을 결여\u003c/strong>하여 재량권의 범위를 넘은 위법한 처분이다（재량권 일탈·남용을 \u003cstrong>인정\u003c/strong>한 드문 예）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>조문 암기: 행정사건소송법 30조.\u003c/strong> 「재량권의 범위를 넘거나 그 남용이 있었던 경우에 \u003cstrong>한하여\u003c/strong>」 — 「한하여」가 빠진 지문(예: 「법원은 재량처분의 당부를 스스로 판단할 수 있다」)은 오답.\u003c/li>\u003cli>\u003cstrong>적법(행정 승소) / 위법(원고 승소) 결론을 판례별로 짝지어 암기\u003c/strong>: 마쿠린·고베세관 = \u003cstrong>적법\u003c/strong> / 닛코 다로스기·검도 실기 거부 = \u003cstrong>위법\u003c/strong>. 최고재가 일탈·남용을 실제로 인정한 사례는 드물다는 감각을 갖고 있으면 지문 판별이 쉽다.\u003c/li>\u003cli>\u003cstrong>심사방식 2종 대비\u003c/strong>: 「사실의 기초를 결여하거나 \u003cstrong>사회통념상 현저히 타당성을 결여\u003c/strong>」 = 사회통념심사(마쿠린·고베세관) / 「\u003cstrong>고려부진·타사고려·과대평가\u003c/strong>」 = 판단과정심사(닛코 다로스기·이카타).\u003c/li>\u003cli>\u003cstrong>伊方原発訴訟의 입증책임 배분\u003c/strong>이 단독 지문으로 나온다 — 「행정청 측이 먼저 심사기준·조사과정의 합리성을 주장·입증한다」.\u003c/li>\u003cli>「일탈」과 「남용」의 개념 구별은 물어도, 실제 판례는 양자를 묶어 판단한다는 점을 함께 기억. \u003ca href=\"#/e/%E8%A6%81%E4%BB%B6%E8%A3%81%E9%87%8F\">要件裁量\u003c/a>·효과재량 어느 단계의 재량이든 30조가 적용된다.\u003c/li>\u003cli>재량 통제의 실질 무기는 \u003cstrong>비례원칙·평등원칙\u003c/strong>이다. 처분이 지나치게 무겁다는 사안이면 비례원칙 위반을 떠올릴 것.\u003c/li>\u003c/ul>","search":"裁量権の逸脱・濫用 さいりょうけんのいつだつ・らんよう 항목 내용 ------ ------ 읽기 さいりょうけんのいつだつ・らんよう（재량권의 일탈·남용） 과목 행정법（행정재량·행정사건소송법） 한줄 정의 행정청의 재량처분에 대해 법원이 개입할 수 있는 유일한 경우 — 재량권의 범위를 넘거나 일탈 재량권을 남용한 때 통설·판례 재량처분은 재량권의 일탈·남용이 있는 경우에 한해 법원이 취소할 수 있다（행정사건소송법 30조）. 심사방식은 사회통념심사 와 판단과정심사 의 두 갈래 개념 행정청에 재량이 인정되는 처분에 대해서는, 법원이 「자기가 행정청이라면 어떻게 했을까」를 판단해 처분의 당·부당을 심사할 수 없다. 삼권분립상 재량 판단은 일차적으로 행정청의 몫이기 때문이다. 그래서 행정사건소송법 30조 는 「행정청의 재량처분에 대해서는, 재량권의 범위를 넘거나 또는 그 남용이 있었던 경우에 한하여 , 법원은 그 처분을 취소할 수 있다」고 규정한다. 「~에 한하여 に限り 」라는 문언이 시험 포인트다. 전통적으로 일탈 逸脱 은 재량권의 외적 한계를 넘은 경우 법이 정한 범위 밖의 처분 , 남용 濫用 은 재량권을 부여한 목적에 반해 행사한 경우로 구별되지만, 실무·판례는 양자를 엄밀히 나누지 않고 「일탈·남용」으로 묶어 판단한다. 구체적 위법 유형으로는 ① 사실의 기초를 결여 사실오인 , ② 목적·동기의 부정 타사고려, 他事考慮 , ③ 평등원칙 위반, ④ 비례원칙 위반, ⑤ 고려해야 할 사항의 부당한 경시 고려부진, 考慮不尽 , ⑥ 신뢰보호원칙 위반 등이 든다. 심사방식은 크게 둘로 나뉜다. 첫째는 사회통념심사 社会観念審査 로, 「처분이 사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 위법」이라고 보는 방식이다 神戸税関事件, マクリーン事件 . 심사 밀도가 매우 낮아 행정청이 이기기 쉽다. 둘째는 판단과정심사 判断過程審査 로, 결론이 아니라 판단에 이르는 과정 에 초점을 맞춘다. 즉 「본래 가장 중시해야 할 사항을 부당하게 경시했는가 고려부진 」, 「고려해서는 안 될 사항을 고려했는가 타사고려 」, 「과대·과소평가가 있었는가」를 따진다. 日光太郎杉事件 東京高判昭48.7.13 이 이 방식을 개척했고, 전문기술적 재량이 문제된 伊方原発訴訟 最判平4.10.29 에서도 심사기준 자체의 불합리성과 조사·심의 과정의 과오·결락을 심사하는 형태로 채택되었다. 재량이 어느 단계에 인정되는지에 따라 要件裁量 要件裁量.md 요건 해당성 판단의 재량 과 효과재량 어떤 처분을 할지·할지 말지의 재량 으로 나뉘며, 어느 쪽이든 그 행사가 일탈·남용에 이르면 위법이 된다. 재량이 전혀 없는 기속행위 羈束行為 에 대해서는 애초에 30조가 적용되지 않고, 법원이 법 요건 해당성을 전면적으로 심사한다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ マクリーン事件（매클린 사건） 最大判昭53.10.4 / 民集32巻7号1223頁 외국인의 재류기간 갱신 불허가 처분에서, 재류 중의 정치활동을 소극적 사정으로 참작한 것이 재량권 일탈·남용인지 처분 적법 . 재류 갱신의 판단은 법무대신의 광범한 재량에 속하고, 그 판단이 전혀 사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 일탈·남용으로 위법이 된다（ 사회통념심사 의 대표례） 神戸税関事件（고베 세관 사건） 最判昭52.12.20 조합활동을 이유로 한 세관 직원 징계면직 처분의 적법성 처분 적법 . 징계권자의 재량 판단이 사회통념상 현저히 타당성을 결여하여 재량권을 남용했다고 인정되는 경우에 한해 위법. 법원은 징계권자와 같은 입장에서 처분의 당부를 판단하는 것이 아니다 日光太郎杉事件（닛코 다로스기 사건） 東京高判昭48.7.13 도로 확장을 위한 토지수용 사업인정에서, 문화재적 가치를 지닌 노거수 太郎杉 의 보존 이익이 충분히 고려되었는지 처분 위법 . 본래 가장 중시해야 할 사항을 부당하게 경시 고려부진 하고, 고려해서는 안 될 사항을 고려 타사고려 하거나 과대평가한 경우 재량권 일탈·남용이 된다（ 판단과정심사 의 선구） 伊方原発訴訟（이카타 원전 소송） 最判平4.10.29 원자로 설치허가 처분의 안전성 판단에 대한 사법심사의 방법 법원은 현재의 과학기술 수준에 비추어, ① 구체적 심사기준에 불합리한 점이 있는지, ② 조사·심의 및 판단 과정에 간과하기 어려운 과오·결락이 있는지 를 심사한다. 심사기준·조사과정에 불합리가 없다는 점은 피고 행정청이 먼저 주장·입증 해야 하고, 이를 다하지 못하면 불합리한 점이 있는 것으로 사실상 추인된다 剣道実技拒否事件（검도 실기 거부 사건 / 神戸高専事件） 最判平8.3.8 종교상의 이유로 검도 실기를 거부한 학생에 대한 원급유치·퇴학 처분 처분 위법 . 대체수단의 검토 등 고려해야 할 사정을 고려하지 않은 채 한 처분은 사회통념상 현저히 타당성을 결여 하여 재량권의 범위를 넘은 위법한 처분이다（재량권 일탈·남용을 인정 한 드문 예） 💡 수험 팁 - 조문 암기: 행정사건소송법 30조. 「재량권의 범위를 넘거나 그 남용이 있었던 경우에 한하여 」 — 「한하여」가 빠진 지문 예: 「법원은 재량처분의 당부를 스스로 판단할 수 있다」 은 오답. - 적법 행정 승소 / 위법 원고 승소 결론을 판례별로 짝지어 암기 : 마쿠린·고베세관 = 적법 / 닛코 다로스기·검도 실기 거부 = 위법 . 최고재가 일탈·남용을 실제로 인정한 사례는 드물다는 감각을 갖고 있으면 지문 판별이 쉽다. - 심사방식 2종 대비 : 「사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여 」 = 사회통념심사 마쿠린·고베세관 / 「 고려부진·타사고려·과대평가 」 = 판단과정심사 닛코 다로스기·이카타 . - 伊方原発訴訟의 입증책임 배분 이 단독 지문으로 나온다 — 「행정청 측이 먼저 심사기준·조사과정의 합리성을 주장·입증한다」. - 「일탈」과 「남용」의 개념 구별은 물어도, 실제 판례는 양자를 묶어 판단한다는 점을 함께 기억. 要件裁量 要件裁量.md ·효과재량 어느 단계의 재량이든 30조가 적용된다. - 재량 통제의 실질 무기는 비례원칙·평등원칙 이다. 처분이 지나치게 무겁다는 사안이면 비례원칙 위반을 떠올릴 것."},"要件裁量":{"type":"term","subject":"용어","id":"要件裁量","title":"要件裁量","sub":"ようけんさいりょう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ようけんさいりょう（요건재량）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정재량）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>법률이 정한 \u003cstrong>처분요건에 해당하는지를 인정·판단하는 단계\u003c/strong>에서 행정청에 인정되는 재량\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>요건재량과 효과재량 모두 인정될 수 있다\u003c/strong>는 것이 현재의 통설. 어느 단계에 어느 정도의 재량이 있는지는 근거법의 문언·취지·처분의 성질에 따라 개별적으로 판단한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>법률은 행정처분을 「\u003cstrong>요건 → 효과\u003c/strong>」의 구조로 규정한다. 「~한 때에는(요건), 행정청은 ~할 수 있다(효과)」와 같은 식이다. 이때 재량이 어느 단계에 존재하는가에 따라 \u003cstrong>要件裁量\u003c/strong>(요건 해당성 인정 단계의 재량)과 \u003cstrong>効果裁量·行為裁量\u003c/strong>(처분을 할지 여부, 어떤 처분을 할지의 선택 단계의 재량)으로 나뉜다.\u003c/p>\n\u003cp>요건재량이 문제되는 전형은 조문의 요건 부분에 \u003cstrong>불확정개념(不確定概念)\u003c/strong>이 놓인 경우다. 「공익상 필요한 때」, 「재해 방지상 지장이 없을 것」, 「~을 적당하다고 인정하기에 족한 상당한 이유가 있을 때」 같은 문언이 그것이다. 다만 \u003cstrong>불확정개념이 있다고 해서 곧바로 재량이 인정되는 것은 아니다.\u003c/strong> 불확정개념의 해석은 원칙적으로 「법의 문제」로서 법원이 전면적으로 심사할 수 있고, 정치적·전문기술적 판단이 불가결한 경우에 한해 행정청의 판단이 존중된다.\u003c/p>\n\u003cp>재량이 인정되면 그 처분은 \u003cstrong>재량행위\u003c/strong>가 되어, 법원은 \u003ca href=\"#/e/%E8%A3%81%E9%87%8F%E6%A8%A9%E3%81%AE%E9%80%B8%E8%84%B1%E3%83%BB%E6%BF%AB%E7%94%A8\">裁量権の逸脱・濫用\u003c/a>이 있는 경우에 한해 취소할 수 있다(행정사건소송법 30조). 반대로 요건도 효과도 법이 일의적으로 정해 두어 행정청에 판단의 여지가 없으면 \u003cstrong>기속행위(羈束行為)\u003c/strong>이고, 법원은 요건 해당성을 처음부터 전면적으로 심사한다. 건축확인(건축기준법 6조)처럼 「기준에 적합하면 확인해야 한다」고 정해진 것이 기속행위의 전형이다. 대비: \u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>는 원칙 기속행위, \u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>는 원칙 재량행위다.\u003c/p>\n\u003cp>요건재량이 인정되는 경우의 심사방법이 실전 쟁점이다. 정치적 재량이 크면 「사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 위법」이라는 \u003cstrong>사회통념심사\u003c/strong>에 그치고(マクリーン事件), 전문기술적 재량이면 심사기준의 합리성과 조사·심의 과정의 과오·결락을 따지는 \u003cstrong>판단과정심사\u003c/strong>가 쓰인다(伊方原発訴訟).\u003c/p>\n\u003cp>\u003cstrong>要件裁量과 効果裁量 비교\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003cstrong>要件裁量\u003c/strong>\u003c/th>\u003cth>効果裁量（行為裁量）\u003c/th>\u003c/tr>\u003ctr>\u003ctd>재량이 있는 단계\u003c/td>\u003ctd>「법이 정한 \u003cstrong>요건에 해당하는가\u003c/strong>」의 인정·판단\u003c/td>\u003ctd>「처분을 \u003cstrong>할 것인가 말 것인가\u003c/strong>, 어떤 처분을 할 것인가」의 선택\u003c/td>\u003c/tr>\u003ctr>\u003ctd>조문에 나타나는 형태\u003c/td>\u003ctd>요건 부분의 \u003cstrong>불확정개념\u003c/strong>（「공익상 필요한 때」 등）\u003c/td>\u003ctd>효과 부분의 \u003cstrong>「~할 수 있다(することができる)」\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 예\u003c/td>\u003ctd>재류기간 갱신의 「상당한 이유」（マクリーン事件）, 원자로 설치허가의 안전성 판단（伊方原発訴訟）\u003c/td>\u003ctd>징계처분의 종류·정도 선택（神戸税関事件）, 영업정지 기간의 결정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사법심사\u003c/td>\u003ctd>어느 쪽이든 \u003cstrong>재량권의 일탈·남용\u003c/strong>이 있으면 위법（행정사건소송법 30조）\u003c/td>\u003ctd>동일\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>要件裁量説（요건재량설）\u003c/strong>\u003c/td>\u003ctd>재량은 \u003cstrong>법률요건의 인정\u003c/strong> 단계에 존재한다. 법이 처분요건을 전혀 정하지 않았거나 「공익」과 같은 종국 목적만 규정한 경우 행정청에 재량이 있다고 본다\u003c/td>\u003ctd>佐々木惣一의 견해로 소개된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>効果裁量説（효과재량설·행위재량설）\u003c/strong>\u003c/td>\u003ctd>재량은 요건이 아니라 \u003cstrong>효과(행위)\u003c/strong> 단계에 존재한다. 국민의 권리를 제한하거나 의무를 부과하는 침익적 행위는 기속, 권리·이익을 부여하는 수익적 행위는 재량이라고 본다\u003c/td>\u003ctd>美濃部達吉의 견해로 소개된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>양자 병존설（현재의 통설）\u003c/strong>\u003c/td>\u003ctd>재량은 \u003cstrong>요건 단계에도 효과 단계에도 모두 있을 수 있다\u003c/strong>. 어느 쪽에 어느 정도 인정되는지는 근거법의 문언·취지, 처분의 성질, 침해되는 이익의 성질을 종합해 개별 판단한다\u003c/td>\u003ctd>👉 \u003cstrong>통설\u003c/strong>. 판례도 이 전제에 서 있다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>マクリーン事件（매클린 사건）\u003c/td>\u003ctd>最大判昭53.10.4 / 民集32巻7号1223頁\u003c/td>\u003ctd>출입국관리령상 「재류기간 갱신을 적당하다고 인정하기에 족한 상당한 이유가 있을 때」라는 \u003cstrong>요건 해당성 판단\u003c/strong>의 재량 범위\u003c/td>\u003ctd>요건 판단은 법무대신의 \u003cstrong>광범한 재량\u003c/strong>에 속하고, 그 판단이 전혀 사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 위법（정치적 \u003cstrong>요건재량\u003c/strong>의 대표례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>伊方原発訴訟（이카타 원전 소송）\u003c/td>\u003ctd>最判平4.10.29\u003c/td>\u003ctd>원자로 설치허가의 요건인 「재해 방지상 지장이 없을 것」의 판단(전문기술적 요건재량)에 대한 사법심사 방법\u003c/td>\u003ctd>현재의 과학기술 수준에 비추어 \u003cstrong>① 구체적 심사기준의 합리성, ② 조사·심의 및 판단 과정에 간과하기 어려운 과오·결락이 있는지\u003c/strong>를 심사한다（전문기술적 \u003cstrong>요건재량\u003c/strong>에 대한 판단과정심사）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>神戸税関事件（고베 세관 사건）\u003c/td>\u003ctd>最判昭52.12.20\u003c/td>\u003ctd>징계사유에 해당하는 직원에 대해 \u003cstrong>어떤 징계처분을 선택할 것인가\u003c/strong>의 재량\u003c/td>\u003ctd>징계처분의 선택은 징계권자의 재량에 맡겨져 있고, 그 판단이 \u003cstrong>사회통념상 현저히 타당성을 결여\u003c/strong>하여 재량권을 남용했다고 인정되는 경우에 한해 위법（\u003cstrong>효과재량\u003c/strong>의 대표례）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비 축을 먼저 세울 것: 요건재량(요건 해당성 인정) ↔ 효과재량(처분의 선택).\u003c/strong> 조문의 어느 부분에 판단 여지가 있는지로 갈린다 — 요건 쪽 불확정개념이면 요건재량, 「~할 수 있다」면 효과재량.\u003c/li>\u003cli>\u003cstrong>「불확정개념이 있으면 항상 요건재량이 인정된다」는 지문은 오답.\u003c/strong> 불확정개념의 해석은 원칙적으로 법의 문제로서 법원이 심사할 수 있다.\u003c/li>\u003cli>학설은 \u003cstrong>佐々木惣一 = 요건재량설 / 美濃部達吉 = 효과재량설\u003c/strong>로 이름을 붙여 외우면 지문 대조가 빠르다. 다만 현재는 \u003cstrong>양쪽 모두 인정\u003c/strong>하는 것이 통설.\u003c/li>\u003cli>\u003cstrong>기속행위와의 구별\u003c/strong>: 기속행위에는 행정사건소송법 30조가 적용되지 않고 법원이 전면 심사한다. 건축확인은 기속행위, \u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>는 원칙 기속, \u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>는 원칙 재량으로 짝지어 정리.\u003c/li>\u003cli>재량행위라도 \u003ca href=\"#/e/%E9%99%84%E6%AC%BE\">附款\u003c/a>을 붙일 수 있고(기속행위는 원칙 불가), 재량 행사에 잘못이 있으면 \u003ca href=\"#/e/%E8%A3%81%E9%87%8F%E6%A8%A9%E3%81%AE%E9%80%B8%E8%84%B1%E3%83%BB%E6%BF%AB%E7%94%A8\">裁量権の逸脱・濫用\u003c/a>으로 위법이 된다 — 세 항목이 한 세트로 출제된다.\u003c/li>\u003c/ul>","search":"要件裁量 ようけんさいりょう 항목 내용 ------ ------ 읽기 ようけんさいりょう（요건재량） 과목 행정법（행정재량） 한줄 정의 법률이 정한 처분요건에 해당하는지를 인정·판단하는 단계 에서 행정청에 인정되는 재량 통설·판례 요건재량과 효과재량 모두 인정될 수 있다 는 것이 현재의 통설. 어느 단계에 어느 정도의 재량이 있는지는 근거법의 문언·취지·처분의 성질에 따라 개별적으로 판단한다 개념 법률은 행정처분을 「 요건 → 효과 」의 구조로 규정한다. 「~한 때에는 요건 , 행정청은 ~할 수 있다 효과 」와 같은 식이다. 이때 재량이 어느 단계에 존재하는가에 따라 要件裁量 요건 해당성 인정 단계의 재량 과 効果裁量·行為裁量 처분을 할지 여부, 어떤 처분을 할지의 선택 단계의 재량 으로 나뉜다. 요건재량이 문제되는 전형은 조문의 요건 부분에 불확정개념 不確定概念 이 놓인 경우다. 「공익상 필요한 때」, 「재해 방지상 지장이 없을 것」, 「~을 적당하다고 인정하기에 족한 상당한 이유가 있을 때」 같은 문언이 그것이다. 다만 불확정개념이 있다고 해서 곧바로 재량이 인정되는 것은 아니다. 불확정개념의 해석은 원칙적으로 「법의 문제」로서 법원이 전면적으로 심사할 수 있고, 정치적·전문기술적 판단이 불가결한 경우에 한해 행정청의 판단이 존중된다. 재량이 인정되면 그 처분은 재량행위 가 되어, 법원은 裁量権の逸脱・濫用 裁量権の逸脱・濫用.md 이 있는 경우에 한해 취소할 수 있다 행정사건소송법 30조 . 반대로 요건도 효과도 법이 일의적으로 정해 두어 행정청에 판단의 여지가 없으면 기속행위 羈束行為 이고, 법원은 요건 해당성을 처음부터 전면적으로 심사한다. 건축확인 건축기준법 6조 처럼 「기준에 적합하면 확인해야 한다」고 정해진 것이 기속행위의 전형이다. 대비: 許可 許可.md 는 원칙 기속행위, 特許 特許.md 는 원칙 재량행위다. 요건재량이 인정되는 경우의 심사방법이 실전 쟁점이다. 정치적 재량이 크면 「사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 위법」이라는 사회통념심사 에 그치고 マクリーン事件 , 전문기술적 재량이면 심사기준의 합리성과 조사·심의 과정의 과오·결락을 따지는 판단과정심사 가 쓰인다 伊方原発訴訟 . 要件裁量과 効果裁量 비교 구분 要件裁量 効果裁量（行為裁量） ------ -------------- ---------------------- 재량이 있는 단계 「법이 정한 요건에 해당하는가 」의 인정·판단 「처분을 할 것인가 말 것인가 , 어떤 처분을 할 것인가」의 선택 조문에 나타나는 형태 요건 부분의 불확정개념 （「공익상 필요한 때」 등） 효과 부분의 「~할 수 있다 することができる 」 대표 예 재류기간 갱신의 「상당한 이유」（マクリーン事件）, 원자로 설치허가의 안전성 판단（伊方原発訴訟） 징계처분의 종류·정도 선택（神戸税関事件）, 영업정지 기간의 결정 사법심사 어느 쪽이든 재량권의 일탈·남용 이 있으면 위법（행정사건소송법 30조） 동일 학설 학설 내용 비고 ------ ------ ------ 要件裁量説（요건재량설） 재량은 법률요건의 인정 단계에 존재한다. 법이 처분요건을 전혀 정하지 않았거나 「공익」과 같은 종국 목적만 규정한 경우 행정청에 재량이 있다고 본다 佐々木惣一의 견해로 소개된다 効果裁量説（효과재량설·행위재량설） 재량은 요건이 아니라 효과 행위 단계에 존재한다. 국민의 권리를 제한하거나 의무를 부과하는 침익적 행위는 기속, 권리·이익을 부여하는 수익적 행위는 재량이라고 본다 美濃部達吉의 견해로 소개된다 양자 병존설（현재의 통설） 재량은 요건 단계에도 효과 단계에도 모두 있을 수 있다 . 어느 쪽에 어느 정도 인정되는지는 근거법의 문언·취지, 처분의 성질, 침해되는 이익의 성질을 종합해 개별 판단한다 👉 통설 . 판례도 이 전제에 서 있다 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ マクリーン事件（매클린 사건） 最大判昭53.10.4 / 民集32巻7号1223頁 출입국관리령상 「재류기간 갱신을 적당하다고 인정하기에 족한 상당한 이유가 있을 때」라는 요건 해당성 판단 의 재량 범위 요건 판단은 법무대신의 광범한 재량 에 속하고, 그 판단이 전혀 사실의 기초를 결여하거나 사회통념상 현저히 타당성을 결여함이 명백한 경우에 한해 위법（정치적 요건재량 의 대표례） 伊方原発訴訟（이카타 원전 소송） 最判平4.10.29 원자로 설치허가의 요건인 「재해 방지상 지장이 없을 것」의 판단 전문기술적 요건재량 에 대한 사법심사 방법 현재의 과학기술 수준에 비추어 ① 구체적 심사기준의 합리성, ② 조사·심의 및 판단 과정에 간과하기 어려운 과오·결락이 있는지 를 심사한다（전문기술적 요건재량 에 대한 판단과정심사） 神戸税関事件（고베 세관 사건） 最判昭52.12.20 징계사유에 해당하는 직원에 대해 어떤 징계처분을 선택할 것인가 의 재량 징계처분의 선택은 징계권자의 재량에 맡겨져 있고, 그 판단이 사회통념상 현저히 타당성을 결여 하여 재량권을 남용했다고 인정되는 경우에 한해 위법（ 효과재량 의 대표례） 💡 수험 팁 - 대비 축을 먼저 세울 것: 요건재량 요건 해당성 인정 ↔ 효과재량 처분의 선택 . 조문의 어느 부분에 판단 여지가 있는지로 갈린다 — 요건 쪽 불확정개념이면 요건재량, 「~할 수 있다」면 효과재량. - 「불확정개념이 있으면 항상 요건재량이 인정된다」는 지문은 오답. 불확정개념의 해석은 원칙적으로 법의 문제로서 법원이 심사할 수 있다. - 학설은 佐々木惣一 = 요건재량설 / 美濃部達吉 = 효과재량설 로 이름을 붙여 외우면 지문 대조가 빠르다. 다만 현재는 양쪽 모두 인정 하는 것이 통설. - 기속행위와의 구별 : 기속행위에는 행정사건소송법 30조가 적용되지 않고 법원이 전면 심사한다. 건축확인은 기속행위, 許可 許可.md 는 원칙 기속, 特許 特許.md 는 원칙 재량으로 짝지어 정리. - 재량행위라도 附款 附款.md 을 붙일 수 있고 기속행위는 원칙 불가 , 재량 행사에 잘못이 있으면 裁量権の逸脱・濫用 裁量権の逸脱・濫用.md 으로 위법이 된다 — 세 항목이 한 세트로 출제된다."},"法規命令":{"type":"term","subject":"용어","id":"法規命令","title":"法規命令","sub":"ほうきめいれい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ほうきめいれい（법규명령）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정입법 · 헌법 41조 / 73조 6호）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정기관이 정립하는 규범 중 \u003cstrong>국민의 권리·의무에 관한 「법규」의 성질을 갖는 것\u003c/strong>（대외적 구속력 있음）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>국민의 권리·의무를 새로 만드는 \u003cstrong>위임명령에는 반드시 법률의 위임이 필요\u003c/strong>하고, 위임의 범위를 넘은 명령은 \u003cstrong>무효\u003c/strong>. 범위는 수권법률의 문언만이 아니라 \u003cstrong>취지·목적·체계\u003c/strong>에 비추어 판단（最大判昭46.1.20 이래 확립）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 41조는 국회를 「국권의 최고기관이며 \u003cstrong>유일한 입법기관\u003c/strong>」으로 정한다. 따라서 국민의 권리를 제한하고 의무를 과하는 법규를 행정기관이 스스로 만드는 것은 원칙적으로 허용되지 않는다. 그러나 현대 행정에서는 전문적·기술적 사항, 사정 변경이 잦은 사항을 국회가 일일이 정하기 어렵다. 그래서 \u003cstrong>법률이 위임한 범위 내에서\u003c/strong> 행정기관이 법규를 정립하는 것이 인정되는데, 이것이 法規命令이다.\u003c/p>\n\u003cp>제정 주체별로는 \u003cstrong>政令\u003c/strong>（내각 — 헌법 73조 6호）, \u003cstrong>内閣府令\u003c/strong>（내각총리대신）, \u003cstrong>省令\u003c/strong>（각 성 대신 — 国家行政組織法 12조 1항）, 위원회·청 장관의 \u003cstrong>規則\u003c/strong>（同 13조 1항）, 人事院規則·会計検査院規則 등이 있다. 고시(告示)는 원래 단순한 공시 형식이지만, 처분의 요건을 정하는 고시처럼 \u003cstrong>실질이 법규명령인 고시\u003c/strong>도 있다（행정절차법 2조 8호 イ 괄호서가 「처분의 요건을 정하는 고시를 포함한다」고 명시）.\u003c/p>\n\u003cp>내용에 따라 두 가지로 나뉜다. \u003cstrong>委任命令\u003c/strong>은 법률의 위임에 근거해 \u003cstrong>새로운 권리·의무를 창설\u003c/strong>하는 것이므로 개별·구체적 위임이 필요하다. \u003cstrong>執行命令\u003c/strong>은 상위 법령을 실시하기 위한 \u003cstrong>절차·형식\u003c/strong>（신청서 서식, 첨부서류, 제출처 등）을 정할 뿐 새로운 권리·의무를 만들지 않으므로, 일반적 수권으로 족하고 개별 위임은 필요 없다. 헌법 73조 6호의 「이 헌법 및 법률의 규정을 실시하기 위해 정령을 제정한다」가 집행명령의 근거이고, 같은 호 단서가 「정령에는 특히 그 법률의 위임이 있는 경우를 제외하고는 \u003cstrong>벌칙을 둘 수 없다\u003c/strong>」고 하여 위임명령의 한계를 정한다. 내각법 11조·国家行政組織法 12조 3항도 \u003cstrong>법률의 위임 없이 의무를 과하거나 권리를 제한하는 규정을 둘 수 없다\u003c/strong>고 못박는다.\u003c/p>\n\u003cp>한계는 \u003cstrong>백지위임(白紙委任)·포괄적 위임의 금지\u003c/strong>다. 「필요한 사항은 정령으로 정한다」식의 무제한 위임은 국회의 입법권을 실질적으로 행정부에 넘기는 것이 되어 41조에 반한다. 위임 자체는 적법해도 \u003cstrong>명령의 내용이 위임의 범위를 넘으면 그 명령은 무효\u003c/strong>이며, 이것이 시험에 나오는 판례군의 전부다. 한편 법규명령은 행정절차법 2조 8호 イ의 \u003cstrong>「命令等」\u003c/strong>에 해당하므로 제정 시 \u003cstrong>意見公募手続（퍼블릭 코멘트, 38조 이하）\u003c/strong>를 거쳐야 한다. 의견제출기간은 원칙 \u003cstrong>30일 이상\u003c/strong>（39조 3항）, 제출의견을 \u003cstrong>충분히 고려할 의무\u003c/strong>（42조）, 결과의 공시 의무（43조）가 따른다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>農地法施行令事件\u003c/td>\u003ctd>最大判昭46.1.20 / 民集25巻1号1頁\u003c/td>\u003ctd>매수한 농지를 구소유자에게 매도할 때의 대가를 「매수 대가 상당액」으로 한정한 農地法施行令 16조\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>. 農地法 80조의 위임 범위를 일탈（위임 범위 판단의 원조 판례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>サーベル登録拒否事件（銃砲刀剣類登録規則事件）\u003c/td>\u003ctd>最判平2.2.1\u003c/td>\u003ctd>등록 대상 도검을 「미술품으로서 가치 있는 \u003cstrong>일본도\u003c/strong>」로 한정한 銃砲刀剣類登録規則 4조 2항\u003c/td>\u003ctd>\u003cstrong>유효\u003c/strong>. 감정 기준의 구체화는 법이 규칙에 맡긴 재량 범위 내\u003c/td>\u003c/tr>\u003ctr>\u003ctd>監獄法施行規則事件（幼年者接見不許可事件）\u003c/td>\u003ctd>最判平3.7.9\u003c/td>\u003ctd>미결구금자와 \u003cstrong>14세 미만자\u003c/strong>의 접견을 원칙 금지한 監獄法施行規則 120조·124조\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>（접견 금지 한도에서）. 監獄法 50조의 위임 범위 초과. 다만 소장의 국가배상법상 \u003cstrong>과실은 부정\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>児童扶養手当法施行令事件\u003c/td>\u003ctd>最判平14.1.31 / 民集56巻1号246頁\u003c/td>\u003ctd>혼인 외 출생아 중 \u003cstrong>부(父)로부터 인지된 아동\u003c/strong>을 수당 대상에서 제외한 施行令 1조의2 3호 괄호서\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>. 법의 위임 취지를 일탈\u003c/td>\u003c/tr>\u003ctr>\u003ctd>医薬品ネット販売事件\u003c/td>\u003ctd>最判平25.1.11\u003c/td>\u003ctd>제1류·제2류 일반용 의약품의 우편 등 판매를 일률 금지한 薬事法施行規則\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>. 薬事法의 위임 범위를 일탈（법률에 일률 금지의 근거가 없음）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비: 法規命令 ↔ \u003ca href=\"#/e/%E8%A1%8C%E6%94%BF%E8%A6%8F%E5%89%87\">行政規則\u003c/a>\u003c/strong> — 「법규성(대외적 구속력) 유무」가 갈림길. 법규명령은 \u003cstrong>법률의 위임 필요\u003c/strong>, 행정규칙은 \u003cstrong>위임 불요\u003c/strong>. 「행정규칙에도 법률의 위임이 필요하다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>대비: 委任命令 ↔ 執行命令\u003c/strong> — 위임명령은 \u003cstrong>새 권리·의무 창설 → 개별·구체적 위임 필수\u003c/strong>, 집행명령은 \u003cstrong>절차·서식만 → 개별 위임 불요\u003c/strong>. 「집행명령에도 개별 법률의 위임이 필요하다」는 함정 지문이 자주 나온다.\u003c/li>\u003cli>위임 범위 판례는 \u003cstrong>무효 4 : 유효 1\u003c/strong> 구도로 외운다. 무효 = 農地法施行令·監獄法施行規則·児童扶養手当法施行令·医薬品ネット販売 / 유효 = \u003cstrong>サーベル(銃砲刀剣類登録規則)\u003c/strong> 하나뿐.\u003c/li>\u003cli>\u003cstrong>벌칙 위임은 헌법 73조 6호 단서\u003c/strong>. 「정령에는 법률의 위임이 있어도 벌칙을 둘 수 없다」는 지문은 오답（위임이 있으면 둘 수 있다）.\u003c/li>\u003cli>법규명령 제정에는 \u003cstrong>意見公募手続(38조~)\u003c/strong>가 붙는다. 기간은 \u003cstrong>원칙 30일 이상\u003c/strong>. 반면 \u003cspan>審査基準\u003c/span>·\u003cspan>処分基準\u003c/span>도 「命令等」이므로 같은 절차를 거친다는 점을 세트로 기억.\u003c/li>\u003cli>監獄法施行規則事件은 \u003cstrong>「규칙은 무효, 그러나 국가배상은 기각」\u003c/strong>이라는 결론의 엇갈림이 출제 포인트다.\u003c/li>\u003c/ul>","search":"法規命令 ほうきめいれい 항목 내용 ------ ------ 읽기 ほうきめいれい（법규명령） 과목 행정법（행정입법 · 헌법 41조 / 73조 6호） 한줄 정의 행정기관이 정립하는 규범 중 국민의 권리·의무에 관한 「법규」의 성질을 갖는 것 （대외적 구속력 있음） 통설·판례 국민의 권리·의무를 새로 만드는 위임명령에는 반드시 법률의 위임이 필요 하고, 위임의 범위를 넘은 명령은 무효 . 범위는 수권법률의 문언만이 아니라 취지·목적·체계 에 비추어 판단（最大判昭46.1.20 이래 확립） 개념 헌법 41조는 국회를 「국권의 최고기관이며 유일한 입법기관 」으로 정한다. 따라서 국민의 권리를 제한하고 의무를 과하는 법규를 행정기관이 스스로 만드는 것은 원칙적으로 허용되지 않는다. 그러나 현대 행정에서는 전문적·기술적 사항, 사정 변경이 잦은 사항을 국회가 일일이 정하기 어렵다. 그래서 법률이 위임한 범위 내에서 행정기관이 법규를 정립하는 것이 인정되는데, 이것이 法規命令이다. 제정 주체별로는 政令 （내각 — 헌법 73조 6호）, 内閣府令 （내각총리대신）, 省令 （각 성 대신 — 国家行政組織法 12조 1항）, 위원회·청 장관의 規則 （同 13조 1항）, 人事院規則·会計検査院規則 등이 있다. 고시 告示 는 원래 단순한 공시 형식이지만, 처분의 요건을 정하는 고시처럼 실질이 법규명령인 고시 도 있다（행정절차법 2조 8호 イ 괄호서가 「처분의 요건을 정하는 고시를 포함한다」고 명시）. 내용에 따라 두 가지로 나뉜다. 委任命令 은 법률의 위임에 근거해 새로운 권리·의무를 창설 하는 것이므로 개별·구체적 위임이 필요하다. 執行命令 은 상위 법령을 실시하기 위한 절차·형식 （신청서 서식, 첨부서류, 제출처 등）을 정할 뿐 새로운 권리·의무를 만들지 않으므로, 일반적 수권으로 족하고 개별 위임은 필요 없다. 헌법 73조 6호의 「이 헌법 및 법률의 규정을 실시하기 위해 정령을 제정한다」가 집행명령의 근거이고, 같은 호 단서가 「정령에는 특히 그 법률의 위임이 있는 경우를 제외하고는 벌칙을 둘 수 없다 」고 하여 위임명령의 한계를 정한다. 내각법 11조·国家行政組織法 12조 3항도 법률의 위임 없이 의무를 과하거나 권리를 제한하는 규정을 둘 수 없다 고 못박는다. 한계는 백지위임 白紙委任 ·포괄적 위임의 금지 다. 「필요한 사항은 정령으로 정한다」식의 무제한 위임은 국회의 입법권을 실질적으로 행정부에 넘기는 것이 되어 41조에 반한다. 위임 자체는 적법해도 명령의 내용이 위임의 범위를 넘으면 그 명령은 무효 이며, 이것이 시험에 나오는 판례군의 전부다. 한편 법규명령은 행정절차법 2조 8호 イ의 「命令等」 에 해당하므로 제정 시 意見公募手続（퍼블릭 코멘트, 38조 이하） 를 거쳐야 한다. 의견제출기간은 원칙 30일 이상 （39조 3항）, 제출의견을 충분히 고려할 의무 （42조）, 결과의 공시 의무（43조）가 따른다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 農地法施行令事件 最大判昭46.1.20 / 民集25巻1号1頁 매수한 농지를 구소유자에게 매도할 때의 대가를 「매수 대가 상당액」으로 한정한 農地法施行令 16조 무효 . 農地法 80조의 위임 범위를 일탈（위임 범위 판단의 원조 판례） サーベル登録拒否事件（銃砲刀剣類登録規則事件） 最判平2.2.1 등록 대상 도검을 「미술품으로서 가치 있는 일본도 」로 한정한 銃砲刀剣類登録規則 4조 2항 유효 . 감정 기준의 구체화는 법이 규칙에 맡긴 재량 범위 내 監獄法施行規則事件（幼年者接見不許可事件） 最判平3.7.9 미결구금자와 14세 미만자 의 접견을 원칙 금지한 監獄法施行規則 120조·124조 무효 （접견 금지 한도에서）. 監獄法 50조의 위임 범위 초과. 다만 소장의 국가배상법상 과실은 부정 児童扶養手当法施行令事件 最判平14.1.31 / 民集56巻1号246頁 혼인 외 출생아 중 부 父 로부터 인지된 아동 을 수당 대상에서 제외한 施行令 1조의2 3호 괄호서 무효 . 법의 위임 취지를 일탈 医薬品ネット販売事件 最判平25.1.11 제1류·제2류 일반용 의약품의 우편 등 판매를 일률 금지한 薬事法施行規則 무효 . 薬事法의 위임 범위를 일탈（법률에 일률 금지의 근거가 없음） 💡 수험 팁 - 대비: 法規命令 ↔ 行政規則 용어/行政規則.md — 「법규성 대외적 구속력 유무」가 갈림길. 법규명령은 법률의 위임 필요 , 행정규칙은 위임 불요 . 「행정규칙에도 법률의 위임이 필요하다」는 지문은 오답. - 대비: 委任命令 ↔ 執行命令 — 위임명령은 새 권리·의무 창설 → 개별·구체적 위임 필수 , 집행명령은 절차·서식만 → 개별 위임 불요 . 「집행명령에도 개별 법률의 위임이 필요하다」는 함정 지문이 자주 나온다. - 위임 범위 판례는 무효 4 : 유효 1 구도로 외운다. 무효 = 農地法施行令·監獄法施行規則·児童扶養手当法施行令·医薬品ネット販売 / 유효 = サーベル 銃砲刀剣類登録規則 하나뿐. - 벌칙 위임은 헌법 73조 6호 단서 . 「정령에는 법률의 위임이 있어도 벌칙을 둘 수 없다」는 지문은 오답（위임이 있으면 둘 수 있다）. - 법규명령 제정에는 意見公募手続 38조~ 가 붙는다. 기간은 원칙 30일 이상 . 반면 審査基準 용어/審査基準.md · 処分基準 용어/処分基準.md 도 「命令等」이므로 같은 절차를 거친다는 점을 세트로 기억. - 監獄法施行規則事件은 「규칙은 무효, 그러나 국가배상은 기각」 이라는 결론의 엇갈림이 출제 포인트다."},"行政規則":{"type":"term","subject":"용어","id":"行政規則","title":"行政規則","sub":"ぎょうせいきそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぎょうせいきそく（행정규칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정입법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정기관이 정립하는 규범 중 \u003cstrong>법규의 성질을 갖지 않는 것\u003c/strong>（훈령·통달·고시·요강 등）. 행정조직 내부에서만 효력을 갖는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>통달은 행정조직 내부의 명령에 그치고 \u003cstrong>국민을 직접 구속하지 않으며 재판소도 구속하지 않는다\u003c/strong> → \u003cstrong>처분성 부정\u003c/strong>（最判昭43.12.24）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>行政規則은 국민의 권리·의무에 직접 관계하지 않는 행정입법이다. 대외적 구속력이 없으므로 \u003cstrong>법률의 수권(위임)이 필요 없고\u003c/strong>, 조직법상 주어진 권한만으로 정립할 수 있다. 여기가 \u003ca href=\"#/e/%E6%B3%95%E8%A6%8F%E5%91%BD%E4%BB%A4\">法規命令\u003c/a>과 갈리는 결정적 지점이다.\u003c/p>\n\u003cp>형식으로는 \u003cstrong>訓令·通達\u003c/strong>（国家行政組織法 14조 2항 — 각 대신·위원회·청 장관이 소관 제기관·직원에 대해 명령 또는 시달하기 위해 발함）, \u003cstrong>告示\u003c/strong>（同 14조 1항 — 공시가 필요한 경우）, \u003cstrong>要綱\u003c/strong>（宅地開発指導要綱 등） 등이 있다. 내용으로는 \u003cstrong>解釈基準\u003c/strong>（법령 해석의 통일）, \u003cstrong>裁量基準\u003c/strong>（재량 행사의 준칙 — \u003cspan>審査基準\u003c/span>·\u003cspan>処分基準\u003c/span>이 대표）, 給付規則, 組織規則 등으로 나눈다.\u003c/p>\n\u003cp>효력의 원칙은 \u003cstrong>대외적 구속력 없음\u003c/strong>이다. 상급 행정기관이 하급 행정기관·직원을 구속할 뿐이므로, ① 통달에 반하는 처분이라도 그 사실만으로 위법이 되지는 않고, ② \u003cstrong>재판소는 통달에 구속되지 않고 독자적으로 법령을 해석\u003c/strong>하며, ③ 통달 자체는 \u003cstrong>취소소송의 대상이 되지 않는다\u003c/strong>（처분성 부정）. 墓地埋葬法通達事件이 이 세 명제를 한꺼번에 판시했다.\u003c/p>\n\u003cp>그런데 재량준칙은 현실적으로 국민에게 큰 영향을 준다. 여기서 \u003cstrong>행정의 자기구속(自己拘束)\u003c/strong> 법리가 등장한다. 행정청이 스스로 정해 공표한 기준에서 합리적 이유 없이 벗어나면 \u003cstrong>평등원칙(헌법 14조)·신뢰보호원칙에 반하여 재량권의 일탈·남용\u003c/strong>이 되어 위법해질 수 있다. 즉 행정규칙 자체가 법규로 승격되는 것이 아니라, \u003cstrong>평등원칙이라는 법의 일반원칙을 매개로 간접적으로 외부 효과가 생긴다\u003c/strong>（間接的 外部化）. 最判平27.3.3은 행정절차법 12조 1항에 따라 정해져 공표된 처분기준의 가중 규정에 사실상의 구속력을 인정했고, 最判平23.6.7은 공표된 처분기준이 있는 이상 그 \u003cstrong>적용관계까지 이유로 제시\u003c/strong>해야 한다고 했다.\u003c/p>\n\u003cp>또 하나 주의할 것은 행정절차법과의 접점이다. 審査基準·処分基準·行政指導指針은 성질상 행정규칙이지만 행정절차법 2조 8호 ロ·ハ·ニ의 \u003cstrong>「命令等」\u003c/strong>에 포함되므로, 제정 시 \u003cstrong>意見公募手続(38조 이하)\u003c/strong>의 대상이 된다. 「행정규칙이니까 아무 절차도 필요 없다」는 정리는 틀린다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>パチンコ球遊器事件\u003c/td>\u003ctd>最判昭33.3.28 / 民集12巻4号624頁\u003c/td>\u003ctd>종래 과세되지 않던 파친코 구유기를 국세청장관 \u003cstrong>통달\u003c/strong>을 계기로 물품세법상 「유희구」로 보아 과세\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>. 과세의 근거는 통달이 아니라 \u003cstrong>법률\u003c/strong>이며, 통달 내용이 법의 올바른 해석에 합치하는 이상 헌법 84조(조세법률주의) 위반이 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>墓地埋葬法通達事件\u003c/td>\u003ctd>最判昭43.12.24\u003c/td>\u003ctd>墓地埋葬法 13조 「정당한 이유」의 해석을 변경한 후생성 통달의 취소를 구한 사안\u003c/td>\u003ctd>\u003cstrong>각하(처분성 부정)\u003c/strong>. 통달은 행정조직 내부의 명령에 그쳐 국민을 직접 구속하지 않고, \u003cstrong>재판소도 통달의 해석에 구속되지 않는다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一級建築士免許取消処分事件\u003c/td>\u003ctd>最判平23.6.7\u003c/td>\u003ctd>공표된 처분기준이 존재함에도 처분서에 그 \u003cstrong>적용관계를 제시하지 않고\u003c/strong> 1급 건축사 면허를 취소\u003c/td>\u003ctd>\u003cstrong>위법\u003c/strong>（행정절차법 14조 1항 위반）. 어떤 기준을 어떻게 적용했는지 명의인이 알 수 있을 정도의 이유 제시가 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>処分基準の加重規定と訴えの利益\u003c/td>\u003ctd>最判平27.3.3\u003c/td>\u003ctd>행정절차법 12조 1항에 따라 공표된 처분기준에, 선행 처분을 받은 것을 이유로 후행 처분의 양정을 \u003cstrong>가중\u003c/strong>하는 규정이 있던 사안\u003c/td>\u003ctd>정지기간 경과 후에도 \u003cstrong>가중기간 내에는 선행 처분의 취소를 구할 법률상 이익이 존속\u003c/strong>（처분기준의 사실상 구속력을 정면 인정）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>대비: \u003ca href=\"#/e/%E6%B3%95%E8%A6%8F%E5%91%BD%E4%BB%A4\">法規命令\u003c/a> ↔ 行政規則\u003c/strong> — 법규성 \u003cstrong>있음/없음\u003c/strong>, 법률의 위임 \u003cstrong>필요/불요\u003c/strong>, 대외적 구속력 \u003cstrong>있음/없음\u003c/strong>. 「행정규칙을 정하려면 법률의 위임이 필요하다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>통달의 3대 명제를 세트로 암기\u003c/strong>: ① 국민을 직접 구속하지 않는다 ② \u003cstrong>재판소도 구속하지 않는다\u003c/strong> ③ \u003cstrong>처분성이 없어 취소소송의 대상이 되지 않는다\u003c/strong>（墓地埋葬法通達事件）.\u003c/li>\u003cli>パチンコ球遊器事件을 「통달에 근거해 과세할 수 있다」로 읽으면 오답. \u003cstrong>「과세의 근거는 어디까지나 법률, 통달은 올바른 해석의 확인에 불과」\u003c/strong>가 판시의 뼈대다.\u003c/li>\u003cli>재량준칙에서 벗어난 처분이 곧바로 위법이 되는 것이 아니다. \u003cstrong>평등원칙·신뢰보호원칙을 매개로\u003c/strong> 재량권 일탈·남용이 되어 위법해진다는 2단계 논리를 잊지 말 것.\u003c/li>\u003cli>\u003cstrong>행정규칙이면서 「命令等」인 것\u003c/strong> = \u003cspan>審査基準\u003c/span>·\u003cspan>処分基準\u003c/span>·行政指導指針（행정절차법 2조 8호 ロ·ハ·ニ）. 意見公募手続의 대상이 된다.\u003c/li>\u003cli>訓令·通達은 \u003cstrong>国家行政組織法 14조 2항\u003c/strong>, 告示는 \u003cstrong>14조 1항\u003c/strong>. 「처분의 요건을 정하는 고시」는 실질이 법규명령이라는 점(행정절차법 2조 8호 イ 괄호서)도 세트 출제된다.\u003c/li>\u003c/ul>","search":"行政規則 ぎょうせいきそく 항목 내용 ------ ------ 읽기 ぎょうせいきそく（행정규칙） 과목 행정법（행정입법） 한줄 정의 행정기관이 정립하는 규범 중 법규의 성질을 갖지 않는 것 （훈령·통달·고시·요강 등）. 행정조직 내부에서만 효력을 갖는다 통설·판례 통달은 행정조직 내부의 명령에 그치고 국민을 직접 구속하지 않으며 재판소도 구속하지 않는다 → 처분성 부정 （最判昭43.12.24） 개념 行政規則은 국민의 권리·의무에 직접 관계하지 않는 행정입법이다. 대외적 구속력이 없으므로 법률의 수권 위임 이 필요 없고 , 조직법상 주어진 권한만으로 정립할 수 있다. 여기가 法規命令 용어/法規命令.md 과 갈리는 결정적 지점이다. 형식으로는 訓令·通達 （国家行政組織法 14조 2항 — 각 대신·위원회·청 장관이 소관 제기관·직원에 대해 명령 또는 시달하기 위해 발함）, 告示 （同 14조 1항 — 공시가 필요한 경우）, 要綱 （宅地開発指導要綱 등） 등이 있다. 내용으로는 解釈基準 （법령 해석의 통일）, 裁量基準 （재량 행사의 준칙 — 審査基準 용어/審査基準.md · 処分基準 용어/処分基準.md 이 대표）, 給付規則, 組織規則 등으로 나눈다. 효력의 원칙은 대외적 구속력 없음 이다. 상급 행정기관이 하급 행정기관·직원을 구속할 뿐이므로, ① 통달에 반하는 처분이라도 그 사실만으로 위법이 되지는 않고, ② 재판소는 통달에 구속되지 않고 독자적으로 법령을 해석 하며, ③ 통달 자체는 취소소송의 대상이 되지 않는다 （처분성 부정）. 墓地埋葬法通達事件이 이 세 명제를 한꺼번에 판시했다. 그런데 재량준칙은 현실적으로 국민에게 큰 영향을 준다. 여기서 행정의 자기구속 自己拘束 법리가 등장한다. 행정청이 스스로 정해 공표한 기준에서 합리적 이유 없이 벗어나면 평등원칙 헌법 14조 ·신뢰보호원칙에 반하여 재량권의 일탈·남용 이 되어 위법해질 수 있다. 즉 행정규칙 자체가 법규로 승격되는 것이 아니라, 평등원칙이라는 법의 일반원칙을 매개로 간접적으로 외부 효과가 생긴다 （間接的 外部化）. 最判平27.3.3은 행정절차법 12조 1항에 따라 정해져 공표된 처분기준의 가중 규정에 사실상의 구속력을 인정했고, 最判平23.6.7은 공표된 처분기준이 있는 이상 그 적용관계까지 이유로 제시 해야 한다고 했다. 또 하나 주의할 것은 행정절차법과의 접점이다. 審査基準·処分基準·行政指導指針은 성질상 행정규칙이지만 행정절차법 2조 8호 ロ·ハ·ニ의 「命令等」 에 포함되므로, 제정 시 意見公募手続 38조 이하 의 대상이 된다. 「행정규칙이니까 아무 절차도 필요 없다」는 정리는 틀린다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ パチンコ球遊器事件 最判昭33.3.28 / 民集12巻4号624頁 종래 과세되지 않던 파친코 구유기를 국세청장관 통달 을 계기로 물품세법상 「유희구」로 보아 과세 적법 . 과세의 근거는 통달이 아니라 법률 이며, 통달 내용이 법의 올바른 해석에 합치하는 이상 헌법 84조 조세법률주의 위반이 아님 墓地埋葬法通達事件 最判昭43.12.24 墓地埋葬法 13조 「정당한 이유」의 해석을 변경한 후생성 통달의 취소를 구한 사안 각하 처분성 부정 . 통달은 행정조직 내부의 명령에 그쳐 국민을 직접 구속하지 않고, 재판소도 통달의 해석에 구속되지 않는다 一級建築士免許取消処分事件 最判平23.6.7 공표된 처분기준이 존재함에도 처분서에 그 적용관계를 제시하지 않고 1급 건축사 면허를 취소 위법 （행정절차법 14조 1항 위반）. 어떤 기준을 어떻게 적용했는지 명의인이 알 수 있을 정도의 이유 제시가 필요 処分基準の加重規定と訴えの利益 最判平27.3.3 행정절차법 12조 1항에 따라 공표된 처분기준에, 선행 처분을 받은 것을 이유로 후행 처분의 양정을 가중 하는 규정이 있던 사안 정지기간 경과 후에도 가중기간 내에는 선행 처분의 취소를 구할 법률상 이익이 존속 （처분기준의 사실상 구속력을 정면 인정） 💡 수험 팁 - 대비: 法規命令 용어/法規命令.md ↔ 行政規則 — 법규성 있음/없음 , 법률의 위임 필요/불요 , 대외적 구속력 있음/없음 . 「행정규칙을 정하려면 법률의 위임이 필요하다」는 지문은 오답. - 통달의 3대 명제를 세트로 암기 : ① 국민을 직접 구속하지 않는다 ② 재판소도 구속하지 않는다 ③ 처분성이 없어 취소소송의 대상이 되지 않는다 （墓地埋葬法通達事件）. - パチンコ球遊器事件을 「통달에 근거해 과세할 수 있다」로 읽으면 오답. 「과세의 근거는 어디까지나 법률, 통달은 올바른 해석의 확인에 불과」 가 판시의 뼈대다. - 재량준칙에서 벗어난 처분이 곧바로 위법이 되는 것이 아니다. 평등원칙·신뢰보호원칙을 매개로 재량권 일탈·남용이 되어 위법해진다는 2단계 논리를 잊지 말 것. - 행정규칙이면서 「命令等」인 것 = 審査基準 용어/審査基準.md · 処分基準 용어/処分基準.md ·行政指導指針（행정절차법 2조 8호 ロ·ハ·ニ）. 意見公募手続의 대상이 된다. - 訓令·通達은 国家行政組織法 14조 2항 , 告示는 14조 1항 . 「처분의 요건을 정하는 고시」는 실질이 법규명령이라는 점 행정절차법 2조 8호 イ 괄호서 도 세트 출제된다."},"処分性":{"type":"term","subject":"용어","id":"処分性","title":"処分性","sub":"しょぶんせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しょぶんせい（처분성）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정사건소송법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>어떤 행정 활동이 취소소송의 대상인 \u003cstrong>「처분 그 밖의 공권력의 행사에 해당하는 행위」\u003c/strong>(3조 2항)에 해당하는가의 문제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>大田区ごみ焼却場設置事件\u003c/strong>（最判昭39.10.29）의 정식 — 공권력성 + 직접·구체적 법적 효과. 다만 근래 판례는 \u003cstrong>실효적 권리구제\u003c/strong>의 관점에서 처분성을 확장하는 경향\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행소법 3조 2항은 취소소송의 대상을 「행정청의 \u003cstrong>처분 그 밖의 공권력의 행사에 해당하는 행위\u003c/strong>」로 정한다. 이 관문을 통과하지 못하면 \u003cspan>原告適格\u003c/span>이나 본안 위법을 따질 것도 없이 \u003cstrong>소가 각하\u003c/strong>된다. 그래서 처분성은 항고소송의 \u003cstrong>입구 요건\u003c/strong>이다.\u003c/p>\n\u003cp>최고재는 大田区ごみ焼却場設置事件（最判昭39.10.29）에서 다음 정식을 세웠고, 지금까지 인용된다.\u003c/p>\n\u003cblockquote>행정청의 처분이란, \u003cstrong>공권력의 주체인 국가 또는 공공단체가 행하는 행위 중, 그 행위에 의해 직접 국민의 권리의무를 형성하거나 그 범위를 확정하는 것이 법률상 인정되어 있는 것\u003c/strong>을 말한다.\u003c/blockquote>\n\u003cp>이 문장은 세 요소로 분해된다. \u003cstrong>① 공권력성\u003c/strong>(대등한 사인 간 행위나 사법상 계약은 제외) — 쓰레기소각장 설치를 위한 매매계약·설치 행위는 사법상 행위여서 부정되었다. \u003cstrong>② 직접성·구체성\u003c/strong>(일반적·추상적 규범 정립이 아니라 특정인의 권리의무에 직접 미칠 것) — 통달·조례·계획이 원칙적으로 부정되는 이유다. \u003cstrong>③ 법적 효과\u003c/strong>(권리의무를 형성하거나 그 범위를 확정할 것) — 사실행위나 순수한 행정지도가 원칙적으로 부정되는 이유다.\u003c/p>\n\u003cp>다만 이 정식을 기계적으로 적용하면 국민이 다툴 방법을 잃는 국면이 생긴다. 그래서 근래 최고재는 \u003cstrong>① 후속 처분과 결합했을 때 실제로 생기는 불이익\u003c/strong>, \u003cstrong>② 다른 시점에 다투게 하면 구제가 늦어지는가\u003c/strong>(실효적 권리구제)를 함께 보고 처분성을 넓혀 왔다. 病院開設中止勧告은 「법형식은 행정지도이지만 따르지 않으면 사실상 보험의료기관 지정을 받지 못한다」는 점을, 土地区画整理事業計画決定은 「환지처분 단계에서 다투게 하면 \u003cspan>事情判決\u003c/span>로 끝나 구제가 되지 않는다」는 점을 근거로 삼았다. 후자는 \u003cstrong>青写真判決\u003c/strong>(最大判昭41.2.23)을 \u003cstrong>판례 변경\u003c/strong>한 대법정 판결이라 출제 빈도가 높다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>実体法的処分概念説\u003c/td>\u003ctd>처분성은 실체법상 「행정행위」 개념과 일치한다. 공권력성과 법적 효과를 엄격히 요구\u003c/td>\u003ctd>판례 정식의 출발점\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>争訟法的処分概念説（형식적 행정처분론）\u003c/strong>\u003c/td>\u003ctd>취소소송은 국민의 권리구제 제도이므로, 실체법상 행정행위가 아니어도 \u003cstrong>분쟁 해결에 적합하면\u003c/strong> 처분성을 인정해야 한다\u003c/td>\u003ctd>판례의 확장 경향을 설명하는 유력설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cp>\u003cstrong>처분성 긍정 ⭕\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>病院開設中止勧告事件\u003c/td>\u003ctd>最判平17.7.15\u003c/td>\u003ctd>의료법 30조의7에 근거한 지사의 \u003cstrong>병원 개설 중지 권고\u003c/strong>（법형식은 행정지도）\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 권고에 따르지 않으면 보험의료기관 지정을 받지 못하게 되어 사실상 병원 경영이 불가능 → 「행정지도이므로 무조건 처분성 없음」이 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>土地区画整理事業計画決定\u003c/td>\u003ctd>最大判平20.9.10\u003c/td>\u003ctd>시정촌 시행 토지구획정리사업의 \u003cstrong>사업계획 결정\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 시행지구 내 택지 소유자의 법적 지위에 직접 영향. 환지처분 단계에서는 사정판결이 되기 쉬워 실효적 구제가 안 됨 → \u003cstrong>青写真判決(最大判昭41.2.23) 변경\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>二項道路一括指定告示\u003c/td>\u003ctd>最判平14.1.17\u003c/td>\u003ctd>건축기준법 42조 2항의 이른바 \u003cstrong>간주도로\u003c/strong>를 고시로 일괄 지정\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 개별 지정이 아니어도 특정 도로에 대해 구체적으로 사용 제한 효과가 생김\u003c/td>\u003c/tr>\u003ctr>\u003ctd>保育所廃止条例事件\u003c/td>\u003ctd>最判平21.11.26\u003c/td>\u003ctd>특정 시립 보육소를 폐지하는 \u003cstrong>조례\u003c/strong> 제정행위\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 조례이지만 특정 보육소의 이용관계를 직접 종료시켜 실질적으로 개별·구체적 처분과 같음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>食品衛生法違反通知\u003c/td>\u003ctd>最判平16.4.26\u003c/td>\u003ctd>검역소장의 \u003cstrong>식품위생법 위반 통지\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 통지에 의해 수입 신고가 수리되지 않아 수입이 봉쇄됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>労災就学援護費不支給決定\u003c/td>\u003ctd>最判平15.9.4\u003c/td>\u003ctd>노동기준감독서장의 \u003cstrong>노재취학원호비 불지급 결정\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>. 법령이 아닌 통달에 근거한 급부여도, 지급 요건이 정해져 있어 수급권의 존부를 확정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>輸入禁制品該当の通知\u003c/td>\u003ctd>最判昭54.12.25\u003c/td>\u003ctd>세관장의 \u003cstrong>수입 금제품 해당 통지\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>第二種市街地再開発事業計画決定\u003c/td>\u003ctd>最判平4.11.26\u003c/td>\u003ctd>제2종 시가지재개발사업의 사업계획 결정\u003c/td>\u003ctd>\u003cstrong>긍정\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>처분성 부정 ❌\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>大田区ごみ焼却場設置事件\u003c/td>\u003ctd>最判昭39.10.29\u003c/td>\u003ctd>도쿄도가 쓰레기소각장 부지를 매수해 \u003cstrong>설치한 행위\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>（처분 정의의 원조 판례）. 도의 내부적 의사결정 및 사법상 계약에 그치고, 주민의 권리의무를 직접 형성하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>墓地埋葬通達事件\u003c/td>\u003ctd>最判昭43.12.24\u003c/td>\u003ctd>후생성의 \u003cstrong>통달\u003c/strong>（다른 종파 신도라는 이유로 매장을 거부하는 것은 「정당한 이유」가 아니다）\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>. 통달은 \u003cstrong>행정 내부의 규율\u003c/strong>이며 일반 국민을 직접 구속하지 않음 → \u003cstrong>「통달은 처분성 없음」이 원칙\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>用途地域指定（工業地域指定）\u003c/td>\u003ctd>最判昭57.4.22\u003c/td>\u003ctd>도시계획법상 \u003cstrong>용도지역 지정\u003c/strong> 결정\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>. 일반적·추상적인 규제에 그치고, 구체적 권리 침해는 후속 건축 규제 단계에서 다투면 됨\u003c/td>\u003c/tr>\u003ctr>\u003ctd>交通反則金納付通告\u003c/td>\u003ctd>最判昭57.7.15 / 民集36巻6号1169頁\u003c/td>\u003ctd>도로교통법 127조 1항의 \u003cstrong>반칙금 납부 통고\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>. 통고에 불복하면 반칙금을 내지 않고 \u003cstrong>형사절차\u003c/strong>에서 다투면 되므로 항고소송의 대상이 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>鉄道建設公団工事実施計画認可\u003c/td>\u003ctd>最判昭53.12.8\u003c/td>\u003ctd>운수대신의 \u003cstrong>공사실시계획 인가\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>. 상급 행정기관의 하급기관에 대한 \u003cstrong>감독적 승인\u003c/strong>에 불과\u003c/td>\u003c/tr>\u003ctr>\u003ctd>簡易水道事業条例事件\u003c/td>\u003ctd>最判平18.7.14\u003c/td>\u003ctd>수도요금을 개정하는 \u003cstrong>조례\u003c/strong> 제정행위\u003c/td>\u003ctd>\u003cstrong>부정\u003c/strong>. 불특정 다수에 대한 일반적·추상적 규율 → \u003cstrong>保育所廃止条例(긍정)와 짝으로 출제\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>정식 문구를 그대로 외운다.\u003c/strong> 「\u003cstrong>공권력의 주체인 국가 또는 공공단체가 행하는 행위 중, 그 행위에 의해 직접 국민의 권리의무를 형성하거나 그 범위를 확정하는 것이 법률상 인정되어 있는 것\u003c/strong>」. 「직접」·「법률상 인정」이 밑줄 포인트다.\u003c/li>\u003cli>\u003cstrong>「행정지도라서 처분성이 없다」는 지문은 함정.\u003c/strong> 病院開設中止勧告(最判平17.7.15)이 반례다. 반대로 「통달이므로 처분성이 있다」도 오답 — 墓地埋葬通達은 부정.\u003c/li>\u003cli>\u003cstrong>조례는 원칙 부정, 保育所廃止条例만 예외.\u003c/strong> 簡易水道事業条例(부정) ↔ 保育所廃止条例(긍정)를 세트로. 갈림길은 \u003cstrong>대상이 특정·개별적인가\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>계획 결정은 「사업계획 = 긍정 / 용도지역 지정 = 부정」\u003c/strong>으로 나눠 외운다. 土地区画整理事業計画(最大判平20.9.10)은 \u003cstrong>대법정 판례 변경\u003c/strong>(青写真判결)이라는 점까지 세트.\u003c/li>\u003cli>처분성 → \u003cspan>原告適格\u003c/span> → \u003cspan>狭義の訴えの利益\u003c/span> 순으로 심사한다는 \u003cstrong>소송요건의 순서\u003c/strong>가 그 자체로 출제된다. 처분성은 소송의 \u003cstrong>대상\u003c/strong>에 관한 요건이지 원고에 관한 요건이 아니다.\u003c/li>\u003c/ul>","search":"処分性 しょぶんせい 항목 내용 ------ ------ 읽기 しょぶんせい（처분성） 과목 행정법（행정사건소송법） 한줄 정의 어떤 행정 활동이 취소소송의 대상인 「처분 그 밖의 공권력의 행사에 해당하는 행위」 3조 2항 에 해당하는가의 문제 통설·판례 大田区ごみ焼却場設置事件 （最判昭39.10.29）의 정식 — 공권력성 + 직접·구체적 법적 효과. 다만 근래 판례는 실효적 권리구제 의 관점에서 처분성을 확장하는 경향 개념 행소법 3조 2항은 취소소송의 대상을 「행정청의 처분 그 밖의 공권력의 행사에 해당하는 행위 」로 정한다. 이 관문을 통과하지 못하면 原告適格 용어/原告適格.md 이나 본안 위법을 따질 것도 없이 소가 각하 된다. 그래서 처분성은 항고소송의 입구 요건 이다. 최고재는 大田区ごみ焼却場設置事件（最判昭39.10.29）에서 다음 정식을 세웠고, 지금까지 인용된다. 행정청의 처분이란, 공권력의 주체인 국가 또는 공공단체가 행하는 행위 중, 그 행위에 의해 직접 국민의 권리의무를 형성하거나 그 범위를 확정하는 것이 법률상 인정되어 있는 것 을 말한다. 이 문장은 세 요소로 분해된다. ① 공권력성 대등한 사인 간 행위나 사법상 계약은 제외 — 쓰레기소각장 설치를 위한 매매계약·설치 행위는 사법상 행위여서 부정되었다. ② 직접성·구체성 일반적·추상적 규범 정립이 아니라 특정인의 권리의무에 직접 미칠 것 — 통달·조례·계획이 원칙적으로 부정되는 이유다. ③ 법적 효과 권리의무를 형성하거나 그 범위를 확정할 것 — 사실행위나 순수한 행정지도가 원칙적으로 부정되는 이유다. 다만 이 정식을 기계적으로 적용하면 국민이 다툴 방법을 잃는 국면이 생긴다. 그래서 근래 최고재는 ① 후속 처분과 결합했을 때 실제로 생기는 불이익 , ② 다른 시점에 다투게 하면 구제가 늦어지는가 실효적 권리구제 를 함께 보고 처분성을 넓혀 왔다. 病院開設中止勧告은 「법형식은 행정지도이지만 따르지 않으면 사실상 보험의료기관 지정을 받지 못한다」는 점을, 土地区画整理事業計画決定은 「환지처분 단계에서 다투게 하면 事情判決 용어/事情判決.md 로 끝나 구제가 되지 않는다」는 점을 근거로 삼았다. 후자는 青写真判決 最大判昭41.2.23 을 판례 변경 한 대법정 판결이라 출제 빈도가 높다. 학설 학설 내용 비고 ------ ------ ------ 実体法的処分概念説 처분성은 실체법상 「행정행위」 개념과 일치한다. 공권력성과 법적 효과를 엄격히 요구 판례 정식의 출발점 争訟法的処分概念説（형식적 행정처분론） 취소소송은 국민의 권리구제 제도이므로, 실체법상 행정행위가 아니어도 분쟁 해결에 적합하면 처분성을 인정해야 한다 판례의 확장 경향을 설명하는 유력설 관련 판례 처분성 긍정 ⭕ 판례 인용 사안 결론 ------ ------ ------ ------ 病院開設中止勧告事件 最判平17.7.15 의료법 30조의7에 근거한 지사의 병원 개설 중지 권고 （법형식은 행정지도） 긍정 . 권고에 따르지 않으면 보험의료기관 지정을 받지 못하게 되어 사실상 병원 경영이 불가능 → 「행정지도이므로 무조건 처분성 없음」이 아님 土地区画整理事業計画決定 最大判平20.9.10 시정촌 시행 토지구획정리사업의 사업계획 결정 긍정 . 시행지구 내 택지 소유자의 법적 지위에 직접 영향. 환지처분 단계에서는 사정판결이 되기 쉬워 실효적 구제가 안 됨 → 青写真判決 最大判昭41.2.23 변경 二項道路一括指定告示 最判平14.1.17 건축기준법 42조 2항의 이른바 간주도로 를 고시로 일괄 지정 긍정 . 개별 지정이 아니어도 특정 도로에 대해 구체적으로 사용 제한 효과가 생김 保育所廃止条例事件 最判平21.11.26 특정 시립 보육소를 폐지하는 조례 제정행위 긍정 . 조례이지만 특정 보육소의 이용관계를 직접 종료시켜 실질적으로 개별·구체적 처분과 같음 食品衛生法違反通知 最判平16.4.26 검역소장의 식품위생법 위반 통지 긍정 . 통지에 의해 수입 신고가 수리되지 않아 수입이 봉쇄됨 労災就学援護費不支給決定 最判平15.9.4 노동기준감독서장의 노재취학원호비 불지급 결정 긍정 . 법령이 아닌 통달에 근거한 급부여도, 지급 요건이 정해져 있어 수급권의 존부를 확정 輸入禁制品該当の通知 最判昭54.12.25 세관장의 수입 금제품 해당 통지 긍정 第二種市街地再開発事業計画決定 最判平4.11.26 제2종 시가지재개발사업의 사업계획 결정 긍정 처분성 부정 ❌ 판례 인용 사안 결론 ------ ------ ------ ------ 大田区ごみ焼却場設置事件 最判昭39.10.29 도쿄도가 쓰레기소각장 부지를 매수해 설치한 행위 부정 （처분 정의의 원조 판례）. 도의 내부적 의사결정 및 사법상 계약에 그치고, 주민의 권리의무를 직접 형성하지 않음 墓地埋葬通達事件 最判昭43.12.24 후생성의 통달 （다른 종파 신도라는 이유로 매장을 거부하는 것은 「정당한 이유」가 아니다） 부정 . 통달은 행정 내부의 규율 이며 일반 국민을 직접 구속하지 않음 → 「통달은 처분성 없음」이 원칙 用途地域指定（工業地域指定） 最判昭57.4.22 도시계획법상 용도지역 지정 결정 부정 . 일반적·추상적인 규제에 그치고, 구체적 권리 침해는 후속 건축 규제 단계에서 다투면 됨 交通反則金納付通告 最判昭57.7.15 / 民集36巻6号1169頁 도로교통법 127조 1항의 반칙금 납부 통고 부정 . 통고에 불복하면 반칙금을 내지 않고 형사절차 에서 다투면 되므로 항고소송의 대상이 아님 鉄道建設公団工事実施計画認可 最判昭53.12.8 운수대신의 공사실시계획 인가 부정 . 상급 행정기관의 하급기관에 대한 감독적 승인 에 불과 簡易水道事業条例事件 最判平18.7.14 수도요금을 개정하는 조례 제정행위 부정 . 불특정 다수에 대한 일반적·추상적 규율 → 保育所廃止条例 긍정 와 짝으로 출제 💡 수험 팁 - 정식 문구를 그대로 외운다. 「 공권력의 주체인 국가 또는 공공단체가 행하는 행위 중, 그 행위에 의해 직접 국민의 권리의무를 형성하거나 그 범위를 확정하는 것이 법률상 인정되어 있는 것 」. 「직접」·「법률상 인정」이 밑줄 포인트다. - 「행정지도라서 처분성이 없다」는 지문은 함정. 病院開設中止勧告 最判平17.7.15 이 반례다. 반대로 「통달이므로 처분성이 있다」도 오답 — 墓地埋葬通達은 부정. - 조례는 원칙 부정, 保育所廃止条例만 예외. 簡易水道事業条例 부정 ↔ 保育所廃止条例 긍정 를 세트로. 갈림길은 대상이 특정·개별적인가 . - 계획 결정은 「사업계획 = 긍정 / 용도지역 지정 = 부정」 으로 나눠 외운다. 土地区画整理事業計画 最大判平20.9.10 은 대법정 판례 변경 青写真判결 이라는 점까지 세트. - 처분성 → 原告適格 용어/原告適格.md → 狭義の訴えの利益 용어/狭義の訴えの利益.md 순으로 심사한다는 소송요건의 순서 가 그 자체로 출제된다. 처분성은 소송의 대상 에 관한 요건이지 원고에 관한 요건이 아니다."},"審査請求":{"type":"term","subject":"용어","id":"審査請求","title":"審査請求","sub":"しんさせいきゅう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しんさせいきゅう（심사청구）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정불복심사법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정청의 처분·부작위에 불복하여 원칙적으로 \u003cstrong>상급 행정청\u003c/strong>에 대해 그 시정을 구하는 행정불복심사법상의 \u003cstrong>원칙적 유형\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>2014년 전부개정으로 이의신청·심사청구의 이원 구조를 폐지하고 \u003cstrong>심사청구로 일원화\u003c/strong>（재조사의 청구·재심사청구는 개별법에 근거가 있을 때만 예외적으로 인정）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정불복심사법(行政不服審査法)은 위법·부당한 처분 등에 대해 \u003cstrong>간이·신속한 절차\u003c/strong>로 국민의 권리이익을 구제하고 아울러 행정의 적정한 운영을 확보하는 것을 목적으로 한다(1조 1항). 소송과 달리 \u003cstrong>부당(不当)\u003c/strong> — 즉 위법까지는 아니지만 재량의 타당성을 결한 처분 — 까지 심사 대상이 되는 것이 최대의 특징이다. 대비: \u003cstrong>취소소송은 「위법」만 심사\u003c/strong>하고 부당은 다루지 않는다.\u003c/p>\n\u003cp>2014년(平成26년) 전부개정 전에는 처분청에 하는 「異議申立て」와 상급청에 하는 「審査請求」가 병존했으나, 개정법은 이를 \u003cstrong>심사청구로 일원화\u003c/strong>했다. 심사청구를 하는 상대방(審査庁)은 처분청에 상급 행정청이 있으면 \u003cstrong>최상급 행정청\u003c/strong>, 없으면 \u003cstrong>처분청 자신\u003c/strong>이 된다(4조). 개별법에 근거가 있는 경우에만 \u003cstrong>再調査の請求\u003c/strong>(처분청에 대한 간이한 재심사)와 \u003cstrong>再審査請求\u003c/strong>(심사청구의 재결에 대한 추가 불복)가 예외적으로 인정된다.\u003c/p>\n\u003cp>심사청구 기간은 시험에서 가장 자주 출제되는 논점이다. 처분에 대한 심사청구는 \u003cstrong>처분이 있었음을 안 날의 다음날부터 기산하여 3개월\u003c/strong>을 경과하면 할 수 없고(18조 1항 본문), 또한 \u003cstrong>처분이 있었던 날의 다음날부터 기산하여 1년\u003c/strong>을 경과하면 할 수 없다(18조 2항 본문). 다만 어느 쪽이든 \u003cstrong>「정당한 이유가 있는 때」\u003c/strong>에는 예외가 인정된다(양 항 단서). 한편 부작위에 대한 심사청구에는 기간 제한이 없다 — 부작위는 위법 상태가 계속되고 있기 때문이다.\u003c/p>\n\u003cp>심사청구는 원칙적으로 \u003cstrong>서면\u003c/strong>으로 하며(19조 1항), 처분의 효력을 당연히 멈추지는 않는다(\u003cstrong>집행부정지 원칙\u003c/strong>, 25조 1항). 심사청구가 있으면 심사청은 처분에 관여하지 않은 직원 중에서 \u003cstrong>\u003ca href=\"#/e/%E5%AF%A9%E7%90%86%E5%93%A1\">審理員\u003c/a>\u003c/strong>을 지명하여 심리를 주재하게 하고, 심리원 의견서를 받은 뒤에는 원칙적으로 \u003cstrong>행정불복심사회(行政不服審査会)\u003c/strong> 등에 자문한 다음 재결을 한다(43조).\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>기간 대비가 최대 함정.\u003c/strong> 심사청구 = \u003cstrong>안 날의 다음날부터 기산하여 3개월\u003c/strong> / 처분일 다음날부터 \u003cstrong>1년\u003c/strong>. 취소소송 = \u003cstrong>안 날부터 6개월\u003c/strong> / 처분일부터 \u003cstrong>1년\u003c/strong>(행정사건소송법 14조). \u003cstrong>「3개월 ↔ 6개월」을 바꿔 놓은 지문이 단골\u003c/strong>이다.\u003c/li>\u003cli>조문 문언까지 다르다. 행정불복심사법은 \u003cstrong>「翌日から起算して」\u003c/strong>(다음날부터 기산), 행정사건소송법은 \u003cstrong>「知った日から」\u003c/strong>. 조문을 그대로 물어보는 문제가 나온다.\u003c/li>\u003cli>\u003cstrong>부작위에 대한 심사청구에는 기간 제한이 없다.\u003c/strong> 「부작위도 3개월 이내」라는 지문은 오답.\u003c/li>\u003cli>심사청구 = \u003cstrong>위법 + 부당\u003c/strong> 심사 / 취소소송 = \u003cstrong>위법만\u003c/strong>. 대비: 「소송에서도 부당을 다툴 수 있다」는 오답.\u003c/li>\u003cli>심사청구와 취소소송은 원칙적으로 \u003cstrong>자유선택주의\u003c/strong>(행정사건소송법 8조 1항). \u003cstrong>심사청구전치주의는 개별법에 규정이 있을 때만\u003c/strong> 예외적으로 적용된다.\u003c/li>\u003cli>\u003cstrong>집행부정지가 원칙\u003c/strong>(25조 1항). 「심사청구를 하면 처분의 효력이 정지된다」는 지문은 오답.\u003c/li>\u003c/ul>","search":"審査請求 しんさせいきゅう 항목 내용 ------ ------ 읽기 しんさせいきゅう（심사청구） 과목 행정법（행정불복심사법） 한줄 정의 행정청의 처분·부작위에 불복하여 원칙적으로 상급 행정청 에 대해 그 시정을 구하는 행정불복심사법상의 원칙적 유형 통설·판례 2014년 전부개정으로 이의신청·심사청구의 이원 구조를 폐지하고 심사청구로 일원화 （재조사의 청구·재심사청구는 개별법에 근거가 있을 때만 예외적으로 인정） 개념 행정불복심사법 行政不服審査法 은 위법·부당한 처분 등에 대해 간이·신속한 절차 로 국민의 권리이익을 구제하고 아울러 행정의 적정한 운영을 확보하는 것을 목적으로 한다 1조 1항 . 소송과 달리 부당 不当 — 즉 위법까지는 아니지만 재량의 타당성을 결한 처분 — 까지 심사 대상
