<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --ink:#24272F; --muted:#6E7380;
  --line:#E5E2DA; --ai:#2E5077; --shu:#B8433D;
  --chip-ai-bg:#E7EDF5; --chip-ai-fg:#2E5077;
  --chip-shu-bg:#F7E8E6; --chip-shu-fg:#A03A34;
  --code-bg:#F0EEE7; --quote-bg:#F3F1EA; --thead-bg:#F4F2EC;
  --nav-active:#EDEAE1; --shadow:0 1px 3px rgba(36,39,47,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161C; --surface:#1B1E26; --ink:#E8E6DF; --muted:#9AA0AD;
    --line:#2B2F3A; --ai:#8FB4DE; --shu:#E08078;
    --chip-ai-bg:#22314A; --chip-ai-fg:#A9C6E8;
    --chip-shu-bg:#43272A; --chip-shu-fg:#EDA49E;
    --code-bg:#242833; --quote-bg:#20242E; --thead-bg:#222633;
    --nav-active:#262B37; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14161C; --surface:#1B1E26; --ink:#E8E6DF; --muted:#9AA0AD;
  --line:#2B2F3A; --ai:#8FB4DE; --shu:#E08078;
  --chip-ai-bg:#22314A; --chip-ai-fg:#A9C6E8;
  --chip-shu-bg:#43272A; --chip-shu-fg:#EDA49E;
  --code-bg:#242833; --quote-bg:#20242E; --thead-bg:#222633;
  --nav-active:#262B37; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Noto Sans KR','Noto Sans JP','Malgun Gothic','Yu Gothic',sans-serif;
  font-size:15.5px; line-height:1.75;
}
a{color:var(--ai); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--ai); outline-offset:2px; border-radius:2px}
code{background:var(--code-bg); padding:.1em .35em; border-radius:3px; font-size:.92em}

/* ---- 상단 바 (모바일) ---- */
.topbar{
  display:none; position:sticky; top:0; z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line);
  padding:10px 14px; align-items:center; gap:12px;
}
.topbar .booktitle{font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:900; font-size:17px}
.menu-btn{
  background:none; border:1px solid var(--line); border-radius:6px;
  color:var(--ink); font-size:18px; line-height:1; padding:7px 10px; cursor:pointer;
}

/* ---- 사이드바 ---- */
.sidebar{
  position:fixed; top:0; left:0; bottom:0; width:300px; z-index:40;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column;
}
.side-head{padding:20px 18px 12px; border-bottom:1px solid var(--line)}
.side-head .booktitle{
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:900; font-size:20px;
  letter-spacing:.02em; display:block; color:var(--ink);
}
.side-head .booktitle:hover{text-decoration:none; color:var(--ai)}
.side-head .subtitle{color:var(--muted); font-size:12.5px; margin-top:2px}
.searchbox{padding:12px 14px; border-bottom:1px solid var(--line)}
.searchbox input{
  width:100%; padding:8px 12px; border:1px solid var(--line); border-radius:6px;
  background:var(--bg); color:var(--ink); font:inherit; font-size:14px;
}
.searchbox input::placeholder{color:var(--muted)}
.nav{flex:1; overflow-y:auto; padding:8px 0 24px}
.nav-group{margin-top:14px}
.nav-group>h2{
  font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase;
  letter-spacing:.08em; margin:0 0 4px; padding:0 18px;
  font-family:'Noto Sans KR','Noto Sans JP',sans-serif;
}
.nav-item{
  display:block; padding:7px 18px; border-left:3px solid transparent; color:var(--ink);
}
.nav-item:hover{background:var(--nav-active); text-decoration:none}
.nav-item[aria-current="page"]{background:var(--nav-active); border-left-color:var(--ai)}
.nav-item .t{display:block; font-size:14px; font-weight:500; line-height:1.45}
.nav-item .s{
  display:flex; align-items:center; gap:6px; color:var(--muted);
  font-size:12px; font-variant-numeric:tabular-nums; margin-top:1px;
}
.chip{
  display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  padding:1px 6px; border-radius:4px; line-height:1.5;
}
.chip.ai{background:var(--chip-ai-bg); color:var(--chip-ai-fg)}
.chip.shu{background:var(--chip-shu-bg); color:var(--chip-shu-fg)}
.no-result{padding:16px 18px; color:var(--muted); font-size:13.5px}
.scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35}

/* ---- 본문 ---- */
.main{margin-left:300px; min-height:100vh}
.page{max-width:46rem; margin:0 auto; padding:44px 32px 80px}

/* 표지 */
.cover{text-align:left; padding-top:9vh}
.cover .seal{
  width:92px; height:92px; background:var(--shu); color:#FAF9F5;
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:900; font-size:26px;
  display:flex; align-items:center; justify-content:center;
  writing-mode:vertical-rl; letter-spacing:.18em;
  border-radius:8px; transform:rotate(-2.5deg); box-shadow:var(--shadow);
  margin-bottom:34px; user-select:none;
}
.cover h1{
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:900;
  font-size:clamp(30px,5vw,42px); line-height:1.25; margin:0 0 10px; text-wrap:balance;
}
.cover .lede{color:var(--muted); font-size:16px; margin:0 0 30px}
.cover .counts{
  display:flex; gap:28px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:16px 2px; margin-bottom:34px;
}
.cover .counts b{
  display:block; font-size:26px; font-weight:900; font-variant-numeric:tabular-nums;
  font-family:'Noto Serif KR','Noto Serif JP',serif;
}
.cover .counts span{font-size:12.5px; color:var(--muted); letter-spacing:.05em}
.cover .toc a{
  display:flex; justify-content:space-between; align-items:baseline;
  padding:13px 2px; border-bottom:1px solid var(--line); color:var(--ink); font-size:15.5px;
}
.cover .toc a:hover{color:var(--ai); text-decoration:none}
.cover .toc .n{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums}

/* 문서 */
.doc-head{margin-bottom:28px}
.doc-head .eyebrow{
  font-size:12px; font-weight:700; letter-spacing:.09em; color:var(--ai);
  text-transform:uppercase; margin-bottom:8px;
}
.doc-head h1{
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:900;
  font-size:clamp(24px,3.6vw,32px); line-height:1.3; margin:0 0 8px; text-wrap:balance;
}
.doc-head .meta-line{color:var(--muted); font-size:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.doc h2{
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-weight:700; font-size:21px;
  margin:40px 0 12px; padding-bottom:8px; border-bottom:1px solid var(--line); text-wrap:balance;
}
.doc h3{font-size:16.5px; font-weight:700; margin:26px 0 8px}
.doc h4{font-size:15px; font-weight:700; margin:20px 0 6px}
.doc p{margin:0 0 14px}
.doc ul,.doc ol{margin:0 0 14px; padding-left:22px}
.doc li{margin-bottom:4px}
.doc blockquote{
  margin:18px 0; padding:14px 18px; background:var(--quote-bg);
  border-left:3px solid var(--ai); border-radius:0 6px 6px 0;
  font-family:'Noto Serif KR','Noto Serif JP',serif; font-size:15.5px;
}
.doc hr{border:0; border-top:1px solid var(--line); margin:28px 0}
.tblwrap{overflow-x:auto; margin:16px 0; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
.doc table{border-collapse:collapse; width:100%; font-size:13.5px; line-height:1.6}
.doc th{
  background:var(--thead-bg); text-align:left; font-weight:700;
  padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
.doc td{padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:top; min-width:72px}
.doc tr:last-child td{border-bottom:0}

/* 이전/다음 */
.pager{
  display:flex; justify-content:space-between; gap:14px; margin-top:56px;
  border-top:1px solid var(--line); padding-top:18px;
}
.pager a{
  flex:1; max-width:48%; color:var(--ink); font-size:14px; line-height:1.5;
}
.pager a:hover{color:var(--ai); text-decoration:none}
.pager .dir{display:block; font-size:11.5px; color:var(--muted); letter-spacing:.06em; margin-bottom:2px}
.pager .next{text-align:right; margin-left:auto}

@media (max-width:900px){
  .topbar{display:flex}
  .sidebar{transform:translateX(-100%); transition:transform .22s ease; box-shadow:none; width:min(320px,86vw)}
  .sidebar.open{transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.25)}
  .scrim.show{display:block}
  .main{margin-left:0}
  .page{padding:28px 18px 64px}
  .cover{padding-top:4vh}
}
@media (prefers-reduced-motion: reduce){
  .sidebar{transition:none}
}
</style>

조례）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>1962.6.21 교토부 학생자치회연합(府学連) 주최 데모. 교토시 공안조례상 \u003cstrong>조건부가 허가\u003c/strong>(4열 종대, 차도 동측단 진행 등)를 받은 행진이었다.\u003c/p>\n\u003cp>허가조건 위반으로 보이는 대열 붕괴·도로 중앙 진행이 발생하자, 시찰·채증 중이던 부경 순경이 \u003cstrong>보도에서 선두 집단을 사진 촬영\u003c/strong>. 피고인(당시 입명관대 법학부생)이 항의한 뒤 깃대로 순경 하악을 찔러 전치 약 1주 상해를 입혔다.\u003c/p>\n\u003cp>기소: 공무집행방해·상해. 항변: 무단 촬영은 위헌·위법 직무이므로 공무집행방해가 성립하지 않는다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>승낙 없이 용모·자태를 촬영당하지 않을 자유가 헌법상 인정되는가.\u003c/li>\u003cli>본인 동의·영장 없는 경찰 촬영이 허용되는 요건은 무엇인가.\u003c/li>\u003cli>本件 촬영은 적법한가(→ 공무집행방해의 전제).\u003c/li>\u003cli>교토시 공안조례(집회·집단행진·집단시위)는 헌법 21조에 위반하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 촬영되지 않을 자유（헌법 13조）\u003c/h3>\n\u003cp>헌법 13조는 국민의 사생활상 자유를 국가권력에 대해서도 보호한다.  \u003cbr>그 하나로, \u003cstrong>누구든지 승낙 없이 함부로 그 용모·자태를 촬영당하지 않을 자유\u003c/strong>를 가진다.\u003c/p>\n\u003cp>「이를 초상권이라 부를지는 별론」이지만, 경찰관이 \u003cstrong>정당한 이유 없이\u003c/strong> 개인의 용모 등을 촬영하는 것은 13조 취지에 반하여 허용되지 않는다.\u003c/p>\n\u003ch3>2. 경찰 촬영이 허용되는 경우（13조·35조）\u003c/h3>\n\u003cp>이 자유도 공공의 복지상 상당한 제한을 받는다. 범죄수사는 경찰에 주어진 국가작용이다(경찰법 2조 1항).\u003c/p>\n\u003cp>본인 동의·법관 영장이 없어도 허용되는 경우:\u003c/p>\n\u003col>\u003cli>\u003cstrong>현행범적 상황\u003c/strong> — 현재 범죄가 행해지거나, 행해진 뒤 얼마 되지 않았다고 인정될 것\u003c/li>\u003cli>\u003cstrong>증거보전의 필요성·긴급성\u003c/strong>\u003c/li>\u003cli>\u003cstrong>상당성\u003c/strong> — 일반적으로 허용되는 한도를 넘지 않는 상당한 방법으로 촬영할 것\u003c/li>\u003c/ol>\n\u003cp>이 경우 범인뿐 아니라 \u003cstrong>제외할 수 없는 제3자의 용모\u003c/strong>가 찍혀도 헌법 13조·35조에 위반하지 않는다.\u003c/p>\n\u003ch3>3. 本件 적용\u003c/h3>\n\u003cp>허가조건 위반이라는 범죄가 현재 행해지고 있다고 인정되는 상황에서, 증거보전을 위해 보도에서 촬영한 것이므로 \u003cstrong>3요건을 충족 → 적법한 직무집행\u003c/strong>. 공무집행방해 성립. 상고기각.\u003c/p>\n\u003ch3>4. 공안조례\u003c/h3>\n\u003cp>昭和29年 京都市条例第10号(집회·집단행진 및 집단시위에 관한 조례)는 \u003cstrong>헌법 21조에 위반하지 않는다\u003c/strong>.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조: \u003cstrong>자유를 인정하면서, 本件 촬영은 적법\u003c/strong>으로 결론 낸다. 「초상권을 인정 = 촬영 위법」이 아니다.\u003c/li>\u003cli>판결은 「초상권」이라는 말을 정면으로 쓰지 않고 \u003cstrong>「촬영되지 않을 자유」\u003c/strong>로 구성한다.\u003c/li>\u003cli>3요건은 수험상 암기 세트. 다만 후속 \u003cstrong>最決平20.4.15\u003c/strong>(平成19(あ)839)는, 본 판결이 「현행범적 상황 이외는 일절 불허」라는 취지까지 판시한 것은 \u003cstrong>아니라고\u003c/strong> 한다(도로·점포 내 비디오 촬영 적법).\u003c/li>\u003cli>별도 축: 공안조례 합헌(표현의 자유·21조).\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最判平17.11.10 / 平成15(受)281 / 民集59巻9号2428頁（법정 내 촬영·일러스트）\u003c/td>\u003ctd>본 판결을 인용. 민사에서 「법률상 보호되는 인격적 이익」·수인한도 종합고려\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平24.2.2 / 平成21(受)2056 / 民集66巻2号89頁（핑크 레이디）\u003c/td>\u003ctd>퍼블리시티권. 초상의 고객흡인력을 함부로 이용당하지 않을 권리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最決平20.4.15 / 平成19(あ)839\u003c/td>\u003ctd>3요건은 유일한 허용 유형이 아님\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/9-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E4%BA%AC%E9%83%BD%E5%BA%9C%E5%AD%A6%E9%80%A3%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia: 京都府学連事件\u003c/a>\u003c/li>\u003cli>행정서사 수험 정리: \u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad44-12-24/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>, \u003ca href=\"https://gyosyo.info/%E6%9C%80%e5%a4%a7%e5%88%a4%e6%98%ad44-12-24%EF%BC%9A%E4%BA%AC%E9%83%BD%E5%BA%9C%E5%AD%A6%E9%80%A3%E4%BA%8B%E4%BB%B6/\" target=\"_blank\" rel=\"noopener\">행서숙\u003c/a>\u003c/li>\u003c/ul>","search":"京都府学連事件 最大判昭44.12.24 항목 내용 ------ ------ 인용 最大判昭44.12.24 （최고재 대법정 1969.12.24） 사건번호 昭和40年 あ 第1187号 사건명 公務執行妨害、傷害被告事件 판례집 刑集23巻12号1625頁 재판장 石田和外（전원일치） 결론 상고기각. 촬영은 적법 → 공무집행방해 성립 과목 헌법（행복추구권·초상 / 표현의 자유·공안조례） 사안 1962.6.21 교토부 학생자치회연합 府学連 주최 데모. 교토시 공안조례상 조건부가 허가 4열 종대, 차도 동측단 진행 등 를 받은 행진이었다. 허가조건 위반으로 보이는 대열 붕괴·도로 중앙 진행이 발생하자, 시찰·채증 중이던 부경 순경이 보도에서 선두 집단을 사진 촬영 . 피고인 당시 입명관대 법학부생 이 항의한 뒤 깃대로 순경 하악을 찔러 전치 약 1주 상해를 입혔다. 기소: 공무집행방해·상해. 항변: 무단 촬영은 위헌·위법 직무이므로 공무집행방해가 성립하지 않는다. 쟁점 1. 승낙 없이 용모·자태를 촬영당하지 않을 자유가 헌법상 인정되는가. 2. 본인 동의·영장 없는 경찰 촬영이 허용되는 요건은 무엇인가. 3. 本件 촬영은 적법한가 → 공무집행방해의 전제 . 4. 교토시 공안조례 집회·집단행진·집단시위 는 헌법 21조에 위반하는가. 판시 1. 촬영되지 않을 자유（헌법 13조） 헌법 13조는 국민의 사생활상 자유를 국가권력에 대해서도 보호한다. 그 하나로, 누구든지 승낙 없이 함부로 그 용모·자태를 촬영당하지 않을 자유 를 가진다. 「이를 초상권이라 부를지는 별론」이지만, 경찰관이 정당한 이유 없이 개인의 용모 등을 촬영하는 것은 13조 취지에 반하여 허용되지 않는다. 2. 경찰 촬영이 허용되는 경우（13조·35조） 이 자유도 공공의 복지상 상당한 제한을 받는다. 범죄수사는 경찰에 주어진 국가작용이다 경찰법 2조 1항 . 본인 동의·법관 영장이 없어도 허용되는 경우: 1. 현행범적 상황 — 현재 범죄가 행해지거나, 행해진 뒤 얼마 되지 않았다고 인정될 것 2. 증거보전의 필요성·긴급성 3. 상당성 — 일반적으로 허용되는 한도를 넘지 않는 상당한 방법으로 촬영할 것 이 경우 범인뿐 아니라 제외할 수 없는 제3자의 용모 가 찍혀도 헌법 13조·35조에 위반하지 않는다. 3. 本件 적용 허가조건 위반이라는 범죄가 현재 행해지고 있다고 인정되는 상황에서, 증거보전을 위해 보도에서 촬영한 것이므로 3요건을 충족 → 적법한 직무집행 . 공무집행방해 성립. 상고기각. 4. 공안조례 昭和29年 京都市条例第10号 집회·집단행진 및 집단시위에 관한 조례 는 헌법 21조에 위반하지 않는다 . 시험 포인트 - 구조: 자유를 인정하면서, 本件 촬영은 적법 으로 결론 낸다. 「초상권을 인정 = 촬영 위법」이 아니다. - 판결은 「초상권」이라는 말을 정면으로 쓰지 않고 「촬영되지 않을 자유」 로 구성한다. - 3요건은 수험상 암기 세트. 다만 후속 最決平20.4.15 平成19 あ 839 는, 본 판결이 「현행범적 상황 이외는 일절 불허」라는 취지까지 판시한 것은 아니라고 한다 도로·점포 내 비디오 촬영 적법 . - 별도 축: 공안조례 합헌 표현의 자유·21조 . 후속·관련 판례 관계 ------ ------ 最判平17.11.10 / 平成15 受 281 / 民集59巻9号2428頁（법정 내 촬영·일러스트） 본 판결을 인용. 민사에서 「법률상 보호되는 인격적 이익」·수인한도 종합고려 最判平24.2.2 / 平成21 受 2056 / 民集66巻2号89頁（핑크 레이디） 퍼블리시티권. 초상의 고객흡인력을 함부로 이용당하지 않을 권리 最決平20.4.15 / 平成19 あ 839 3요건은 유일한 허용 유형이 아님 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/9-3.html - wikipedia: 京都府学連事件 https://ja.wikipedia.org/wiki/%e4%ba%ac%e9%83%bd%e5%ba%9c%e5%ad%a6%e9%80%a3%e4%ba%8b%e4%bb%b6 - 행정서사 수험 정리: 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad44-12-24/ , 행서숙 https://gyosyo.info/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad44-12-24%ef%bc%9a%e4%ba%ac%e9%83%bd%e5%ba%9c%e5%ad%a6%e9%80%a3%e4%ba%8b%e4%bb%b6/"},"マイナンバー利用差し止め等請求事件":{"type":"case","subject":"헌법","id":"マイナンバー利用差し止め等請求事件","title":"マイナンバー利用差し止め等請求事件","sub":"最一小判令5.3.9","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最一小判令5.3.9\u003c/strong>（최고재 제1소법정 2023.3.9）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>令和4年（オ）第39号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>マイナンバー（個人番号）利用差止等請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集77巻3号627頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>深山卓也（전원일치）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 번호이용법에 따른 특정개인정보의 수집·보관·이용·제공은 13조 침해 아님（합헌）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（13조 개인정보를 함부로 제3자에게 개시·공표당하지 않을 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 법령\u003c/td>\u003ctd>번호이용법（令和3年法律第36号 개정 전）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>번호이용법(행정절차에서 특정 개인을 식별하기 위한 번호의 이용 등에 관한 법률)에 따라 행정기관 등이 \u003cstrong>특정개인정보\u003c/strong>(개인번호를 내용에 포함하는 개인정보)를 수집·보관·이용·제공하는 것이, 헌법 13조가 보장하는 프라이버시를 침해한다고 주장.\u003c/p>\n\u003cp>청구: 프라이버시에 기한 방해예방·배제로서 \u003cstrong>개인번호의 이용·제공 등 差し止め 및 삭제\u003c/strong>, 국가배상법 1조 1항에 기한 위자료 등.\u003c/p>\n\u003cp>같은 날 동종 상고 3건이 모두 기각. 최고재가 마이넘버 제도에 대해 \u003cstrong>처음으로 합헌 판단\u003c/strong>.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>13조는 「개인에 관한 정보를 함부로 제3자에게 개시 또는 공표당하지 않을 자유」를 보장하는가.\u003c/li>\u003cli>번호이용법에 따른 특정개인정보의 이용·제공 등이 그 자유를 침해하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 자유의 내용（住基ネット判決을 잇는다）\u003c/h3>\n\u003cp>13조는 국민의 사생활상 자유를 공권력에 대해서도 보호한다. 그 하나로, \u003cstrong>누구든지 개인에 관한 정보를 함부로 제3자에게 개시 또는 공표당하지 않을 자유\u003c/strong>를 가진다.  \u003cbr>（最一小判平20.3.6 民集62巻3号665頁 — 住基ネット事件）\u003c/p>\n\u003ch3>2. 정당한 행정목적의 범위 내\u003c/h3>\n\u003cp>번호이용법은 개인번호의 대상자 식별 기능을 활용해 정보 관리·이용의 효율화, 정보연계의 신속화를 실현함으로써 \u003cstrong>행정운영의 효율화, 급부와 부담의 공정성, 국민 편의 향상\u003c/strong> 등을 목적으로 한다 → \u003cstrong>정당한 행정목적\u003c/strong>.\u003c/p>\n\u003cp>이용 범위를 \u003cstrong>사회보장·세·재해대책 및 이에 준하는 분야\u003c/strong>의 법령·조례상 사무로 한정하고, 목적외 이용의 예외를 일반법보다 엄격히 두며, 제공을 원칙 금지(제한 열거된 예외만 허용)한다. 따라서 이용·제공 등은 정당한 목적의 범위 내에서 행해진다. 정령·개인정보보호위원회 규칙에의 위임은 백지위임이 아니다.\u003c/p>\n\u003ch3>3. 비닉성 높은 정보와 「구체적 위험」\u003c/h3>\n\u003cp>특정개인정보에는 \u003cstrong>소득·사회보장 수급 이력 등 비닉성 높은 정보\u003c/strong>가 다수 포함된다. 이론상 개인번호로 집약·조합(突合)해 개인을 분석할 수 있고, 법제도·시스템 내용에 따라서는 \u003cstrong>줄줄이 유출\u003c/strong>이나 \u003cstrong>부당한 데이터 매칭\u003c/strong>으로, 법령 근거 없이 또는 정당한 목적을 逸脱하여 제3자에게 개시·공표될 \u003cstrong>구체적 위험이 생길 수 있다\u003c/strong>.\u003c/p>\n\u003cp>그러나 이용·제공의 엄격 규제, 안전관리 조치, 벌칙·가중, 독립 제3자기관, 분산관리, 정보제공 네트워크(총무대신 확인·기록, 본인 개시), 폐역망에서 \u003cstrong>개인번호와 다른 부호\u003c/strong>로 연계, 암호화, 번호 변경 가능성 등이 있다.\u003c/p>\n\u003cp>따라서 법제도상·시스템기술상 불비로 인해 법령 근거 없이 또는 정당한 목적 범위를 逸脱하여 제3자에게 개시·공표될 \u003cstrong>구체적 위험이 생겼다고는 할 수 없다\u003c/strong>.\u003c/p>\n\u003ch3>4. 결론\u003c/h3>\n\u003cp>행정기관 등이 번호이용법에 따라 특정개인정보를 이용·제공 등 하는 행위는, 개인에 관한 정보를 함부로 제3자에게 개시·공표하는 것이 아니다 → \u003cstrong>13조가 보장하는 자유를 침해하지 않는다\u003c/strong>.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조는 京都府学連·指紋押捺·\u003cstrong>住基ネット\u003c/strong>와 같다. 자유를 인정하고, 本件 제도는 합헌.\u003c/li>\u003cli>최고재가 보호하는 것은 「자기정보컨트롤권」(수집·보관·이용 전반)이 아니라 \u003cstrong>「함부로 제3자에게 개시·공표당하지 않을 자유」\u003c/strong>다. 「이용 자체 = 침해」는 오답.\u003c/li>\u003cli>住基ネット와의 차이: 마이넘버는 \u003cstrong>비닉성 높은 정보\u003c/strong>를 포함한다고 \u003cstrong>인정\u003c/strong>한다. 그래도 \u003cstrong>구체적 위험이 없다\u003c/strong>고 봐 합헌.\u003c/li>\u003cli>합헌의 핵심 세트: ① 정당한 행정목적 ② 이용 범위 한정·엄격 규제 ③ 법·시스템상 불비로 인한 구체적 위험 없음.\u003c/li>\u003c/ul>\n\u003ch2>관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最一小判平20.3.6 / 民集62巻3号665頁（住基ネット）\u003c/td>\u003ctd>본 판결이 인용. 같은 13조 공식 + 목적·위험 심사. 住基 쪽은 「비닉성 높은 정보가 아님」도 근거로 삼음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/files/hanrei_jp/846/091846_hanrei.pdf\" target=\"_blank\" rel=\"noopener\">최고재 판결 PDF\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.nikkei.com/article/DGXZQOUE088VH0Y3A300C2000000/\" target=\"_blank\" rel=\"noopener\">日経: 합헌 첫 판단\u003c/a>\u003c/li>\u003c/ul>","search":"マイナンバー利用差し止め等請求事件 最一小判令5.3.9 항목 내용 ------ ------ 인용 最一小判令5.3.9 （최고재 제1소법정 2023.3.9） 사건번호 令和4年（オ）第39号 사건명 マイナンバー（個人番号）利用差止等請求事件 판례집 民集77巻3号627頁 재판장 深山卓也（전원일치） 결론 상고기각. 번호이용법에 따른 특정개인정보의 수집·보관·이용·제공은 13조 침해 아님（합헌） 과목 헌법（13조 개인정보를 함부로 제3자에게 개시·공표당하지 않을 자유） 대상 법령 번호이용법（令和3年法律第36号 개정 전） 사안 번호이용법 행정절차에서 특정 개인을 식별하기 위한 번호의 이용 등에 관한 법률 에 따라 행정기관 등이 특정개인정보 개인번호를 내용에 포함하는 개인정보 를 수집·보관·이용·제공하는 것이, 헌법 13조가 보장하는 프라이버시를 침해한다고 주장. 청구: 프라이버시에 기한 방해예방·배제로서 개인번호의 이용·제공 등 差し止め 및 삭제 , 국가배상법 1조 1항에 기한 위자료 등. 같은 날 동종 상고 3건이 모두 기각. 최고재가 마이넘버 제도에 대해 처음으로 합헌 판단 . 쟁점 1. 13조는 「개인에 관한 정보를 함부로 제3자에게 개시 또는 공표당하지 않을 자유」를 보장하는가. 2. 번호이용법에 따른 특정개인정보의 이용·제공 등이 그 자유를 침해하는가. 판시 1. 자유의 내용（住基ネット判決을 잇는다） 13조는 국민의 사생활상 자유를 공권력에 대해서도 보호한다. 그 하나로, 누구든지 개인에 관한 정보를 함부로 제3자에게 개시 또는 공표당하지 않을 자유 를 가진다. （最一小判平20.3.6 民集62巻3号665頁 — 住基ネット事件） 2. 정당한 행정목적의 범위 내 번호이용법은 개인번호의 대상자 식별 기능을 활용해 정보 관리·이용의 효율화, 정보연계의 신속화를 실현함으로써 행정운영의 효율화, 급부와 부담의 공정성, 국민 편의 향상 등을 목적으로 한다 → 정당한 행정목적 . 이용 범위를 사회보장·세·재해대책 및 이에 준하는 분야 의 법령·조례상 사무로 한정하고, 목적외 이용의 예외를 일반법보다 엄격히 두며, 제공을 원칙 금지 제한 열거된 예외만 허용 한다. 따라서 이용·제공 등은 정당한 목적의 범위 내에서 행해진다. 정령·개인정보보호위원회 규칙에의 위임은 백지위임이 아니다. 3. 비닉성 높은 정보와 「구체적 위험」 특정개인정보에는 소득·사회보장 수급 이력 등 비닉성 높은 정보 가 다수 포함된다. 이론상 개인번호로 집약·조합 突合 해 개인을 분석할 수 있고, 법제도·시스템 내용에 따라서는 줄줄이 유출 이나 부당한 데이터 매칭 으로, 법령 근거 없이 또는 정당한 목적을 逸脱하여 제3자에게 개시·공표될 구체적 위험이 생길 수 있다 . 그러나 이용·제공의 엄격 규제, 안전관리 조치, 벌칙·가중, 독립 제3자기관, 분산관리, 정보제공 네트워크 총무대신 확인·기록, 본인 개시 , 폐역망에서 개인번호와 다른 부호 로 연계, 암호화, 번호 변경 가능성 등이 있다. 따라서 법제도상·시스템기술상 불비로 인해 법령 근거 없이 또는 정당한 목적 범위를 逸脱하여 제3자에게 개시·공표될 구체적 위험이 생겼다고는 할 수 없다 . 4. 결론 행정기관 등이 번호이용법에 따라 특정개인정보를 이용·제공 등 하는 행위는, 개인에 관한 정보를 함부로 제3자에게 개시·공표하는 것이 아니다 → 13조가 보장하는 자유를 침해하지 않는다 . 시험 포인트 - 구조는 京都府学連·指紋押捺· 住基ネット 와 같다. 자유를 인정하고, 本件 제도는 합헌. - 최고재가 보호하는 것은 「자기정보컨트롤권」 수집·보관·이용 전반 이 아니라 「함부로 제3자에게 개시·공표당하지 않을 자유」 다. 「이용 자체 = 침해」는 오답. - 住基ネット와의 차이: 마이넘버는 비닉성 높은 정보 를 포함한다고 인정 한다. 그래도 구체적 위험이 없다 고 봐 합헌. - 합헌의 핵심 세트: ① 정당한 행정목적 ② 이용 범위 한정·엄격 규제 ③ 법·시스템상 불비로 인한 구체적 위험 없음. 관련 판례 관계 ------ ------ 最一小判平20.3.6 / 民集62巻3号665頁（住基ネット） 본 판결이 인용. 같은 13조 공식 + 목적·위험 심사. 住基 쪽은 「비닉성 높은 정보가 아님」도 근거로 삼음 원문·참고 - 최고재 판결 pdf https://www.courts.go.jp/app/files/hanrei_jp/846/091846_hanrei.pdf - 日経: 합헌 첫 판단 https://www.nikkei.com/article/dgxzqoue088vh0y3a300c2000000/"},"非嫡出子相続分規定違憲事件":{"type":"case","subject":"헌법","id":"非嫡出子相続分規定違憲事件","title":"非嫡出子相続分規定違憲事件","sub":"最大決平25.9.4","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大決平25.9.4\u003c/strong>（최고재 대법정 2013.9.4）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成24年(ク)第984号·第985号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>遺産分割審判에 대한 抗告棄却決定에 대한 特別抗告\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集67巻6号1320頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>竹崎博允（전원일치）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 구 민법 900조 4호 단서 전단은, 늦어도 평13.7 당시 14조 1항 위반. 원심 파기 환송\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항）· 민법 상속\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 민법 900조 4호 단서 전단（비적출자의 법정상속분을 적출자의 2분의 1로 함）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>판결이 아니라 \u003cstrong>결정\u003c/strong>. 별칭은 婚外子相続分違憲決定.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>피상속인 A가 \u003cstrong>평13.7\u003c/strong> 사망. 적출자(및 대습상속인)가 비적출자인 항고인들을 상대로 유산분할 심판을 신청.\u003c/p>\n\u003cp>원심(도쿄고재)은 本件 규정이 14조 1항에 위반하지 않는다고 보고, 비적출자 상속분을 적출자의 2분의 1로 계산해 분할해야 한다고 했다. 특별항고: 규정 위헌·무효.\u003c/p>\n\u003ch2>구 민법이 만들던 구별\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>적출자\u003c/th>\u003cth>비적출자(혼외자)\u003c/th>\u003c/tr>\u003ctr>\u003ctd>법정상속분\u003c/td>\u003ctd>1\u003c/td>\u003ctd>\u003cstrong>2분의 1\u003c/strong>（900조 4호 단서 전단）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>유언에 의한 상속분 지정 등이 없을 때 보충적으로 기능하는 규정. 법률혼주의를 이유로 혼인 중의 배우자·그 자를 우대하면서, 비적출자에게도 일정 상속분을 인정한 구조였다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>적출자와 비적출자의 법정상속분 구별이 14조 1항에 위반하는가. 위반이라면 \u003cstrong>언제부터\u003c/strong>인가.\u003c/li>\u003cli>위헌 판단이, 이미 확정된 다른 상속의 법률관계에 미치는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 심사 태도\u003c/h3>\n\u003cp>14조 1항은 사안의 성질에 맞는 합리적 근거가 없는 한 법적 차별 취급을 금지한다（最大判昭39.5.27, 尊属殺 最大判昭48.4.4 등）.\u003c/p>\n\u003cp>상속제도의 설계는 전통·사회사정·국민감정, 혼인·친자 규율과 맞물려 \u003cstrong>입법부에 합리적 재량\u003c/strong>이 있다. 다만 그 재량을 고려해도 합리적 근거가 인정되지 않으면 14조 1항 위반이다.\u003c/p>\n\u003ch3>2. 위헌（늦어도 평13.7）\u003c/h3>\n\u003cp>법률혼 제도 자체는 정착해 있다 해도, 그 제도 아래 부모가 혼인하지 않았다는 — 자에게는 \u003cstrong>스스로 선택·수정할 여지가 없는\u003c/strong> — 사정을 이유로 자에게 불이익을 주는 것은 허용되지 않는다. 자를 개인으로 존중하고 권리를 보장해야 한다는 생각이 확립돼 왔다.\u003c/p>\n\u003cp>가족 형태의 다양화, 내외의 의식 변화, 외국 입법·조약, 국적법 위헌 판결(最大判平20.6.4) 등을 종합하면, 늦어도 A의 상속이 개시된 \u003cstrong>평13.7 당시\u003c/strong>에는, 입법 재량을 고려해도 구별의 합리적 근거가 상실됐다.\u003c/p>\n\u003cp>따라서 本件 규정은 늦어도 평13.7 당시 14조 1항에 위반했다.\u003c/p>\n\u003ch3>3. 기확정 법률관계（소급의 한계）\u003c/h3>\n\u003cp>본 결정의 위헌 판단은, 평13.7부터 본 결정까지 개시된 \u003cstrong>다른\u003c/strong> 상속에 대해, 本件 규정을 전제로 한 유산분할 심판·그 밖의 재판, 분할 협의 기타 합의 등으로 \u003cstrong>이미 확정적\u003c/strong>이 된 법률관계에는 영향을 미치지 않는다.\u003c/p>\n\u003ch3>4. 평7 합헌 결정과의 관계\u003c/h3>\n\u003cp>最大決平7.7.5는 本件 규정을 합헌으로 봤다. 본 결정은 이를 \u003cstrong>변경하는 것이 아니다\u003c/strong>. 평7 결정이 대상으로 한 상속 개시는 그보다 이전이고, 본 건은 평13.7 개시분에 대한 판단이다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>결론은 \u003cstrong>위헌\u003c/strong>이지만 「제정 당시부터 위헌」이 오답. \u003cstrong>늦어도 평13.7 당시\u003c/strong>에 위헌이 됐다（사후적·변화 후 위헌）.\u003c/li>\u003cli>자가 바꿀 수 없는 부모의 혼인 여부로 중요한 법적 지위(상속분)를 가르면, 합리적 근거를 엄하게 본다. 국적법 위헌(平20.6.4)과 같은 축.\u003c/li>\u003cli>이미 분할이 확정된 상속을 위헌을 이유로 뒤집지는 않는다（법적 안정）.\u003c/li>\u003cli>판결이 아니라 \u003cstrong>대법정 결정\u003c/strong>. 평25 법률 94호로 단서 전단 삭제 → 적출·비적출 \u003cstrong>같은 상속분\u003c/strong>(평25.12.11 시행).\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大決平7.7.5\u003c/td>\u003ctd>종전 합헌. 본 결정은 변경이 아니라 시점(평13.7)이 다름\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平20.6.4（생후인지 아동 국적）\u003c/td>\u003ctd>자가 바꿀 수 없는 부모 혼인으로 중요한 지위를 가르는 14조 심사. 본 결정이 인용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭48.4.4（존속살）\u003c/td>\u003ctd>14조 합리성 심사의 선례. 본 결정이 인용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/130-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 결정문(특별항고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e6%b1%ba%e5%b9%b325-9-4/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"非嫡出子相続分規定違憲事件 最大決平25.9.4 항목 내용 ------ ------ 인용 最大決平25.9.4 （최고재 대법정 2013.9.4） 사건번호 平成24年 ク 第984号·第985号 사건명 遺産分割審判에 대한 抗告棄却決定에 대한 特別抗告 판례집 民集67巻6号1320頁 재판장 竹崎博允（전원일치） 결론 위헌 . 구 민법 900조 4호 단서 전단은, 늦어도 평13.7 당시 14조 1항 위반. 원심 파기 환송 과목 헌법（14조 1항）· 민법 상속 대상 조문 구 민법 900조 4호 단서 전단（비적출자의 법정상속분을 적출자의 2분의 1로 함） 판결이 아니라 결정 . 별칭은 婚外子相続分違憲決定. 사안 피상속인 a가 평13.7 사망. 적출자 및 대습상속인 가 비적출자인 항고인들을 상대로 유산분할 심판을 신청. 원심 도쿄고재 은 本件 규정이 14조 1항에 위반하지 않는다고 보고, 비적출자 상속분을 적출자의 2분의 1로 계산해 분할해야 한다고 했다. 특별항고: 규정 위헌·무효. 구 민법이 만들던 구별 적출자 비적출자 혼외자 -- -------- ------------------ 법정상속분 1 2분의 1 （900조 4호 단서 전단） 유언에 의한 상속분 지정 등이 없을 때 보충적으로 기능하는 규정. 법률혼주의를 이유로 혼인 중의 배우자·그 자를 우대하면서, 비적출자에게도 일정 상속분을 인정한 구조였다. 쟁점 1. 적출자와 비적출자의 법정상속분 구별이 14조 1항에 위반하는가. 위반이라면 언제부터 인가. 2. 위헌 판단이, 이미 확정된 다른 상속의 법률관계에 미치는가. 판시 1. 심사 태도 14조 1항은 사안의 성질에 맞는 합리적 근거가 없는 한 법적 차별 취급을 금지한다（最大判昭39.5.27, 尊属殺 最大判昭48.4.4 등）. 상속제도의 설계는 전통·사회사정·국민감정, 혼인·친자 규율과 맞물려 입법부에 합리적 재량 이 있다. 다만 그 재량을 고려해도 합리적 근거가 인정되지 않으면 14조 1항 위반이다. 2. 위헌（늦어도 평13.7） 법률혼 제도 자체는 정착해 있다 해도, 그 제도 아래 부모가 혼인하지 않았다는 — 자에게는 스스로 선택·수정할 여지가 없는 — 사정을 이유로 자에게 불이익을 주는 것은 허용되지 않는다. 자를 개인으로 존중하고 권리를 보장해야 한다는 생각이 확립돼 왔다. 가족 형태의 다양화, 내외의 의식 변화, 외국 입법·조약, 국적법 위헌 판결 最大判平20.6.4 등을 종합하면, 늦어도 a의 상속이 개시된 평13.7 당시 에는, 입법 재량을 고려해도 구별의 합리적 근거가 상실됐다. 따라서 本件 규정은 늦어도 평13.7 당시 14조 1항에 위반했다. 3. 기확정 법률관계（소급의 한계） 본 결정의 위헌 판단은, 평13.7부터 본 결정까지 개시된 다른 상속에 대해, 本件 규정을 전제로 한 유산분할 심판·그 밖의 재판, 분할 협의 기타 합의 등으로 이미 확정적 이 된 법률관계에는 영향을 미치지 않는다. 4. 평7 합헌 결정과의 관계 最大決平7.7.5는 本件 규정을 합헌으로 봤다. 본 결정은 이를 변경하는 것이 아니다 . 평7 결정이 대상으로 한 상속 개시는 그보다 이전이고, 본 건은 평13.7 개시분에 대한 판단이다. 시험 포인트 - 결론은 위헌 이지만 「제정 당시부터 위헌」이 오답. 늦어도 평13.7 당시 에 위헌이 됐다（사후적·변화 후 위헌）. - 자가 바꿀 수 없는 부모의 혼인 여부로 중요한 법적 지위 상속분 를 가르면, 합리적 근거를 엄하게 본다. 국적법 위헌 平20.6.4 과 같은 축. - 이미 분할이 확정된 상속을 위헌을 이유로 뒤집지는 않는다（법적 안정）. - 판결이 아니라 대법정 결정 . 평25 법률 94호로 단서 전단 삭제 → 적출·비적출 같은 상속분 평25.12.11 시행 . 후속·관련 판례 관계 ------ ------ 最大決平7.7.5 종전 합헌. 본 결정은 변경이 아니라 시점 평13.7 이 다름 最大判平20.6.4（생후인지 아동 국적） 자가 바꿀 수 없는 부모 혼인으로 중요한 지위를 가르는 14조 심사. 본 결정이 인용 最大判昭48.4.4（존속살） 14조 합리성 심사의 선례. 본 결정이 인용 원문·참고 - 교토산업대 결정문 특별항고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/130-3.html - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e6%b1%ba%e5%b9%b325-9-4/"},"謝罪広告事件":{"type":"case","subject":"헌법","id":"謝罪広告事件","title":"謝罪広告事件","sub":"最大判昭31.7.4","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭31.7.4\u003c/strong>（최고재 대법정 1956.7.4）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和28年(オ)第1241号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>謝罪広告請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集10巻7号785頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 사죄광고 명령·대체집행은 헌법 19조에 위반하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（19조 양심의 자유 / 민법 723조 명예회복처분）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>중의원 의원 총선거에 즈음해, 후보자 Y(피고·상고인)가 \u003cstrong>라디오 정견방송과 신문\u003c/strong>에서, 대립후보 X(원고·피상고인)가 부지사 재직 중 오직(汚職)을 했다는 취지를 공표했다.\u003c/p>\n\u003cp>X는 명예훼손을 이유로, \u003cstrong>민법 723조\u003c/strong>(명예를 회복하기에 적당한 처분)에 기해 \u003cstrong>신문지상에 사죄광고 게재\u003c/strong>를 청구. 1·2심 모두 「방송 및 기사는 진실에 반하며, 귀하의 명예를 훼손하고 폐를 끼쳤으므로 여기에 진사합니다」라는 취지의 사죄광고 게재를 명했다.\u003c/p>\n\u003cp>Y 상고: 사죄광고의 강제는 \u003cstrong>양심의 자유(헌법 19조)\u003c/strong> 침해이며, 의사표명의 강제로서 허용되지 않는다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>민법 723조의 「명예를 회복하기에 적당한 처분」으로 사죄광고를 명할 수 있는가.\u003c/li>\u003cli>사죄광고를 명하는 판결을 \u003cstrong>대체집행\u003c/strong>(구 민소법 733조, 현 민사집행법 171조)으로 강제하는 것이 헌법 19조에 위반하는가.\u003c/li>\u003cli>「양심의 자유」의 보장 범위는 어디까지인가(내심설 vs 신조설).\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 사죄광고 명령의 가부\u003c/h3>\n\u003cp>민법 723조의 처분으로서 사죄광고를 명하는 것 자체는 허용된다. 다만 그 내용·집행방법에 따라 한계가 있다.\u003c/p>\n\u003ch3>2. 강제집행의 한계\u003c/h3>\n\u003cp>사죄광고 중에는, 이를 강제하면 \u003cstrong>「채무자의 인격을 무시하고 현저히 그 명예를 훼손하며 의사결정의 자유 내지 양심의 자유를 부당하게 제한하는」\u003c/strong> 것이 있을 수 있다. 그러한 것은 강제집행에 적합하지 않다.\u003c/p>\n\u003cp>그러나 \u003cstrong>「단순히 사태의 진상을 고백하고 진사(陳謝)의 뜻을 표명하는 데 그치는 정도」\u003c/strong>의 사죄광고라면, 굴욕적·고역적(苦役的) 노고를 과하는 것이 아니므로, \u003cstrong>대체집행으로 강제하더라도 헌법 19조에 위반하지 않는다\u003c/strong>.\u003c/p>\n\u003ch3>3. 本件 적용\u003c/h3>\n\u003cp>本件 사죄광고는 진상 고백과 진사 표명에 그치는 정도의 것 → 합헌. 상고기각.\u003c/p>\n\u003ch2>개별의견\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>田中耕太郎 보충의견\u003c/strong>: 19조의 「양심」은 세계관·인생관·주의 등 \u003cstrong>윤리적 내심\u003c/strong>을 말한다. 사태의 진상을 진술하고 진사의 뜻을 표명하는 것은 이러한 양심의 자유와는 관계없다.\u003c/li>\u003cli>\u003cstrong>入江俊郎 의견\u003c/strong>: 사죄광고를 명하는 \u003cstrong>판결 자체\u003c/strong>는 합헌이지만, 이를 \u003cstrong>대체집행으로 강제하는 것\u003c/strong>은 위헌의 의문이 있다(집행 단계에서 문제로 파악).\u003c/li>\u003cli>\u003cstrong>藤田八郎 반대의견\u003c/strong>: 「진사」는 윤리적 의사의 표명이다. 본인 의사에 반해 이를 강제하는 것은 \u003cstrong>양심의 자유 침해로 위헌\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조: \u003cstrong>원칙적 한계를 설정\u003c/strong>(인격 무시·굴욕적인 것은 불가)하면서, \u003cstrong>「진상 고백 + 진사 표명」 정도면 합헌\u003c/strong>으로 결론. 「사죄광고 = 전면 합헌」이 아니다.\u003c/li>\u003cli>다수의견은 양심의 자유의 범위를 정면으로 정의하지 않았다. \u003cstrong>범위론(신조설)은 田中 보충의견\u003c/strong> — 학설 대비(내심설: 내심 일반 / 신조설: 세계관 등 인격 핵심에 한정)와 세트로 출제된다.\u003c/li>\u003cli>집행방법 축: 사죄광고는 \u003cstrong>대체집행\u003c/strong>(작위의무를 제3자가 대신 실현 — 신문사에 게재시키고 비용 추심)이 가능하다는 전제. 入江 의견은 바로 이 지점을 문제 삼는다.\u003c/li>\u003cli>민법 723조의 「적당한 처분」 → 현재 실무는 사죄광고 외에 \u003cstrong>정정보도·취소광고\u003c/strong> 등도 포함.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最判昭63.7.15 / 麹町中学内申書事件\u003c/td>\u003ctd>내신서 기재는 사상·신조 자체의 기재가 아님 → 19조 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平19.2.27 / 君が代ピアノ伴奏職務命令事件\u003c/td>\u003ctd>반주 명령은 특정 사상 강제가 아님 → 19조 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平23.5.30 / 君が代起立斉唱事件\u003c/td>\u003ctd>기립제창 명령은 \u003cstrong>간접적 제약\u003c/strong>이 될 수 있으나 필요성·합리성 있으면 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭48.12.12 / 三菱樹脂事件\u003c/td>\u003ctd>사인간 관계에서의 사상·신조(19조·14조 간접적용)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最大判昭31.7.4\u003c/a>（사건번호 昭和28(オ)1241로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E8%AC%9D%E7%BD%AA%E5%BA%83%E5%91%8A%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia: 謝罪広告事件\u003c/a>\u003c/li>\u003c/ul>","search":"謝罪広告事件 最大判昭31.7.4 항목 내용 ------ ------ 인용 最大判昭31.7.4 （최고재 대법정 1956.7.4） 사건번호 昭和28年 オ 第1241号 사건명 謝罪広告請求事件 판례집 民集10巻7号785頁 결론 상고기각. 사죄광고 명령·대체집행은 헌법 19조에 위반하지 않음 과목 헌법（19조 양심의 자유 / 민법 723조 명예회복처분） 사안 중의원 의원 총선거에 즈음해, 후보자 y 피고·상고인 가 라디오 정견방송과 신문 에서, 대립후보 x 원고·피상고인 가 부지사 재직 중 오직 汚職 을 했다는 취지를 공표했다. x는 명예훼손을 이유로, 민법 723조 명예를 회복하기에 적당한 처분 에 기해 신문지상에 사죄광고 게재 를 청구. 1·2심 모두 「방송 및 기사는 진실에 반하며, 귀하의 명예를 훼손하고 폐를 끼쳤으므로 여기에 진사합니다」라는 취지의 사죄광고 게재를 명했다. y 상고: 사죄광고의 강제는 양심의 자유 헌법 19조 침해이며, 의사표명의 강제로서 허용되지 않는다. 쟁점 1. 민법 723조의 「명예를 회복하기에 적당한 처분」으로 사죄광고를 명할 수 있는가. 2. 사죄광고를 명하는 판결을 대체집행 구 민소법 733조, 현 민사집행법 171조 으로 강제하는 것이 헌법 19조에 위반하는가. 3. 「양심의 자유」의 보장 범위는 어디까지인가 내심설 vs 신조설 . 판시 1. 사죄광고 명령의 가부 민법 723조의 처분으로서 사죄광고를 명하는 것 자체는 허용된다. 다만 그 내용·집행방법에 따라 한계가 있다. 2. 강제집행의 한계 사죄광고 중에는, 이를 강제하면 「채무자의 인격을 무시하고 현저히 그 명예를 훼손하며 의사결정의 자유 내지 양심의 자유를 부당하게 제한하는」 것이 있을 수 있다. 그러한 것은 강제집행에 적합하지 않다. 그러나 「단순히 사태의 진상을 고백하고 진사 陳謝 의 뜻을 표명하는 데 그치는 정도」 의 사죄광고라면, 굴욕적·고역적 苦役的 노고를 과하는 것이 아니므로, 대체집행으로 강제하더라도 헌법 19조에 위반하지 않는다 . 3. 本件 적용 本件 사죄광고는 진상 고백과 진사 표명에 그치는 정도의 것 → 합헌. 상고기각. 개별의견 - 田中耕太郎 보충의견 : 19조의 「양심」은 세계관·인생관·주의 등 윤리적 내심 을 말한다. 사태의 진상을 진술하고 진사의 뜻을 표명하는 것은 이러한 양심의 자유와는 관계없다. - 入江俊郎 의견 : 사죄광고를 명하는 판결 자체 는 합헌이지만, 이를 대체집행으로 강제하는 것 은 위헌의 의문이 있다 집행 단계에서 문제로 파악 . - 藤田八郎 반대의견 : 「진사」는 윤리적 의사의 표명이다. 본인 의사에 반해 이를 강제하는 것은 양심의 자유 침해로 위헌 . 시험 포인트 - 구조: 원칙적 한계를 설정 인격 무시·굴욕적인 것은 불가 하면서, 「진상 고백 + 진사 표명」 정도면 합헌 으로 결론. 「사죄광고 = 전면 합헌」이 아니다. - 다수의견은 양심의 자유의 범위를 정면으로 정의하지 않았다. 범위론 신조설 은 田中 보충의견 — 학설 대비 내심설: 내심 일반 / 신조설: 세계관 등 인격 핵심에 한정 와 세트로 출제된다. - 집행방법 축: 사죄광고는 대체집행 작위의무를 제3자가 대신 실현 — 신문사에 게재시키고 비용 추심 이 가능하다는 전제. 入江 의견은 바로 이 지점을 문제 삼는다. - 민법 723조의 「적당한 처분」 → 현재 실무는 사죄광고 외에 정정보도·취소광고 등도 포함. 후속·관련 판례 관계 ------ ------ 最判昭63.7.15 / 麹町中学内申書事件 내신서 기재는 사상·신조 자체의 기재가 아님 → 19조 위반 아님 最判平19.2.27 / 君が代ピアノ伴奏職務命令事件 반주 명령은 특정 사상 강제가 아님 → 19조 위반 아님 最判平23.5.30 / 君が代起立斉唱事件 기립제창 명령은 간접적 제약 이 될 수 있으나 필요성·합리성 있으면 합헌 最大判昭48.12.12 / 三菱樹脂事件 사인간 관계에서의 사상·신조 19조·14조 간접적용 원문·참고 - 裁判所 판례검색: 最大判昭31.7.4 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 昭和28 オ 1241로 검색） - wikipedia: 謝罪広告事件 https://ja.wikipedia.org/wiki/%e8%ac%9d%e7%bd%aa%e5%ba%83%e5%91%8a%e4%ba%8b%e4%bb%b6"},"津地鎮祭事件":{"type":"case","subject":"헌법","id":"津地鎮祭事件","title":"津地鎮祭事件","sub":"最大判昭52.7.13","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭52.7.13\u003c/strong>（최고재 대법정 1977.7.13）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和46年(行ツ)第69号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>行政処分取消等請求事件（주민소송·손해보전 청구）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集31巻4号533頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>원판결 파기·자판(청구기각). 지진제는 20조 3항의 「종교적 활동」에 해당하지 않음 → 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 3항 정교분리·목적효과기준 / 89조 공금지출）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>1965(昭和40)년 1월, 三重県 津市가 \u003cstrong>시립체육관 기공식을 神式 지진제(地鎮祭)\u003c/strong>로 거행하고, 신직(神職) 사례비·공물료 등 \u003cstrong>공금 7,663엔\u003c/strong>을 지출했다.\u003c/p>\n\u003cp>시의회 의원이 주민소송(지방자치법 242조의2)으로, 이 지출은 헌법 20조 3항·89조에 위반하는 위법한 공금지출이라며 시장에게 손해보전을 청구했다.\u003c/p>\n\u003cul>\u003cli>1심(津地裁): 습속적 행사 → 합헌, 청구기각\u003c/li>\u003cli>2심(名古屋高裁): 종교적 행사 → \u003cstrong>위헌\u003c/strong>, 청구인용\u003c/li>\u003cli>시장 측 상고\u003c/li>\u003c/ul>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>정교분리 원칙(20조 1항 후단·3항, 89조)의 법적 성격은 무엇인가.\u003c/li>\u003cli>국가와 종교의 분리에는 한계가 있는가.\u003c/li>\u003cli>20조 3항이 금지하는 「종교적 활동」의 판단 기준은 무엇인가.\u003c/li>\u003cli>시 주최 지진제와 그 공금지출은 위헌인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 정교분리의 법적 성격 — 제도적 보장\u003c/h3>\n\u003cp>정교분리 규정은 국가의 \u003cstrong>비종교성·종교적 중립성\u003c/strong>을 확보하려는 것으로, 신교의 자유 그 자체를 직접 보장하는 것이 아니라, 국가와 종교의 분리를 제도로서 보장함으로써 \u003cstrong>간접적으로 신교의 자유를 확보\u003c/strong>하려는 \u003cstrong>제도적 보장\u003c/strong> 규정이다.\u003c/p>\n\u003ch3>2. 완전분리의 불가능 — 분리의 한계\u003c/h3>\n\u003cp>종교는 교육·복지·문화 등 사회생활의 광범한 영역과 접점을 가지므로, 국가와 종교의 \u003cstrong>완전한 분리는 실제상 불가능\u003c/strong>에 가깝다. 완전분리를 관철하면 오히려 불합리한 사태(사립 종교계 학교에 대한 조성, 문화재인 신사·사찰 건조물의 보조 등의 부정)를 낳는다. 따라서 분리에도 \u003cstrong>일정한 한계\u003c/strong>가 있다.\u003c/p>\n\u003ch3>3. 「종교적 활동」의 판단 기준 — 목적효과기준\u003c/h3>\n\u003cp>20조 3항이 금지하는 「종교적 활동」은, 국가와 종교의 관계를 갖는 모든 행위가 아니라, 그 관계가 \u003cstrong>상당하다고 인정되는 한도를 넘는 것\u003c/strong>에 한정된다. 즉,\u003c/p>\n\u003cblockquote>행위의 \u003cstrong>목적이 종교적 의의\u003c/strong>를 가지고, 그 \u003cstrong>효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭\u003c/strong> 등이 되는 행위\u003c/blockquote>\n\u003cp>판단 방법: 행위의 외형뿐 아니라, \u003cstrong>행위의 장소, 일반인의 종교적 평가, 행위자의 의도·목적 및 종교적 의식의 유무·정도, 일반인에게 주는 효과·영향\u003c/strong> 등 제반 사정을 고려하여, \u003cstrong>사회통념에 따라 객관적으로\u003c/strong> 판단한다.\u003c/p>\n\u003ch3>4. 本件 적용\u003c/h3>\n\u003cp>지진제는 건축 착공 시 토지의 평안견고·공사의 무사를 기원하는 \u003cstrong>세속화된 관습적 의례\u003c/strong>로서, 목적은 전적으로 세속적이고, 효과는 신도(神道)를 원조·조장하거나 타종교에 압박·간섭을 가하는 것이 아니다.\u003c/p>\n\u003cp>→ 20조 3항의 「종교적 활동」에 해당하지 않으며, 공금지출도 위법하지 않다. 원판결 파기·자판(청구기각).\u003c/p>\n\u003ch3>반대의견\u003c/h3>\n\u003cp>\u003cstrong>5인 재판관 반대의견\u003c/strong>(재판장 藤林益三 장관 포함): 엄격분리의 입장에서, 지진제는 신사신도의 종교적 의식이므로 위헌이라고 했다. 10 대 5의 판단이었다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>목적효과기준의 원조 판례\u003c/strong>. 「목적이 종교적 의의 + 효과가 원조·조장·촉진 또는 압박·간섭」 + 「사회통념에 따라 객관적으로」 — 문구 자체가 출제된다.\u003c/li>\u003cli>정교분리 = \u003cstrong>제도적 보장\u003c/strong>(인권 그 자체가 아님) → 침해되어도 개인이 직접 다투기 어렵고, 주민소송(공금지출 위법) 형태로 다투어지는 구조까지 세트로.\u003c/li>\u003cli>완전분리 불가론(사립학교 조성·문화재 보조의 예)은 「분리의 한계」 논증으로 빈출.\u003c/li>\u003cli>대비: 같은 기준을 적용해 \u003cstrong>위헌\u003c/strong>이 된 愛媛玉串料事件과의 결론 비교(관습화된 의례 vs 특정 종교와의 관계로 보이는 공금지출).\u003c/li>\u003cli>그 후의 전개: 空知太神社事件 이후 최고재는 목적효과기준을 쓰지 않고 \u003cstrong>제반 사정 종합고려\u003c/strong> 틀을 쓰는 유형(국공유지 무상제공형)도 있다 — 기준의 사용 국면 구별.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判平9.4.2 / 愛媛玉串料事件\u003c/td>\u003ctd>목적효과기준을 적용해 현(県)의 다마구시료 지출을 \u003cstrong>위헌\u003c/strong>(20조 3항·89조)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平5.2.16 / 箕面忠魂碑・慰霊祭事件\u003c/td>\u003ctd>충혼비 이전·위령제 참석은 합헌(목적효과기준)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平22.1.20 / 空知太神社事件\u003c/td>\u003ctd>시유지 무상 제공은 89조 위반. 목적효과기준이 아닌 \u003cstrong>제반 사정 종합고려\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判令3.2.24 / 孔子廟事件\u003c/td>\u003ctd>공원 내 공자묘 부지 사용료 전액 면제는 위헌(空知太 틀)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最大判昭52.7.13\u003c/a>（사건번호 昭和46(行ツ)69로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 津地鎮祭訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"津地鎮祭事件 最大判昭52.7.13 항목 내용 ------ ------ 인용 最大判昭52.7.13 （최고재 대법정 1977.7.13） 사건번호 昭和46年 行ツ 第69号 사건명 行政処分取消等請求事件（주민소송·손해보전 청구） 판례집 民集31巻4号533頁 결론 원판결 파기·자판 청구기각 . 지진제는 20조 3항의 「종교적 활동」에 해당하지 않음 → 합헌 과목 헌법（20조 3항 정교분리·목적효과기준 / 89조 공금지출） 사안 1965 昭和40 년 1월, 三重県 津市가 시립체육관 기공식을 神式 지진제 地鎮祭 로 거행하고, 신직 神職 사례비·공물료 등 공금 7,663엔 을 지출했다. 시의회 의원이 주민소송 지방자치법 242조의2 으로, 이 지출은 헌법 20조 3항·89조에 위반하는 위법한 공금지출이라며 시장에게 손해보전을 청구했다. - 1심 津地裁 : 습속적 행사 → 합헌, 청구기각 - 2심 名古屋高裁 : 종교적 행사 → 위헌 , 청구인용 - 시장 측 상고 쟁점 1. 정교분리 원칙 20조 1항 후단·3항, 89조 의 법적 성격은 무엇인가. 2. 국가와 종교의 분리에는 한계가 있는가. 3. 20조 3항이 금지하는 「종교적 활동」의 판단 기준은 무엇인가. 4. 시 주최 지진제와 그 공금지출은 위헌인가. 판시 1. 정교분리의 법적 성격 — 제도적 보장 정교분리 규정은 국가의 비종교성·종교적 중립성 을 확보하려는 것으로, 신교의 자유 그 자체를 직접 보장하는 것이 아니라, 국가와 종교의 분리를 제도로서 보장함으로써 간접적으로 신교의 자유를 확보 하려는 제도적 보장 규정이다. 2. 완전분리의 불가능 — 분리의 한계 종교는 교육·복지·문화 등 사회생활의 광범한 영역과 접점을 가지므로, 국가와 종교의 완전한 분리는 실제상 불가능 에 가깝다. 완전분리를 관철하면 오히려 불합리한 사태 사립 종교계 학교에 대한 조성, 문화재인 신사·사찰 건조물의 보조 등의 부정 를 낳는다. 따라서 분리에도 일정한 한계 가 있다. 3. 「종교적 활동」의 판단 기준 — 목적효과기준 20조 3항이 금지하는 「종교적 활동」은, 국가와 종교의 관계를 갖는 모든 행위가 아니라, 그 관계가 상당하다고 인정되는 한도를 넘는 것 에 한정된다. 즉, 행위의 목적이 종교적 의의 를 가지고, 그 효과가 종교에 대한 원조·조장·촉진 또는 압박·간섭 등이 되는 행위 판단 방법: 행위의 외형뿐 아니라, 행위의 장소, 일반인의 종교적 평가, 행위자의 의도·목적 및 종교적 의식의 유무·정도, 일반인에게 주는 효과·영향 등 제반 사정을 고려하여, 사회통념에 따라 객관적으로 판단한다. 4. 本件 적용 지진제는 건축 착공 시 토지의 평안견고·공사의 무사를 기원하는 세속화된 관습적 의례 로서, 목적은 전적으로 세속적이고, 효과는 신도 神道 를 원조·조장하거나 타종교에 압박·간섭을 가하는 것이 아니다. → 20조 3항의 「종교적 활동」에 해당하지 않으며, 공금지출도 위법하지 않다. 원판결 파기·자판 청구기각 . 반대의견 5인 재판관 반대의견 재판장 藤林益三 장관 포함 : 엄격분리의 입장에서, 지진제는 신사신도의 종교적 의식이므로 위헌이라고 했다. 10 대 5의 판단이었다. 시험 포인트 - 목적효과기준의 원조 판례 . 「목적이 종교적 의의 + 효과가 원조·조장·촉진 또는 압박·간섭」 + 「사회통념에 따라 객관적으로」 — 문구 자체가 출제된다. - 정교분리 = 제도적 보장 인권 그 자체가 아님 → 침해되어도 개인이 직접 다투기 어렵고, 주민소송 공금지출 위법 형태로 다투어지는 구조까지 세트로. - 완전분리 불가론 사립학교 조성·문화재 보조의 예 은 「분리의 한계」 논증으로 빈출. - 대비: 같은 기준을 적용해 위헌 이 된 愛媛玉串料事件과의 결론 비교 관습화된 의례 vs 특정 종교와의 관계로 보이는 공금지출 . - 그 후의 전개: 空知太神社事件 이후 최고재는 목적효과기준을 쓰지 않고 제반 사정 종합고려 틀을 쓰는 유형 국공유지 무상제공형 도 있다 — 기준의 사용 국면 구별. 후속·관련 판례 관계 ------ ------ 最大判平9.4.2 / 愛媛玉串料事件 목적효과기준을 적용해 현 県 의 다마구시료 지출을 위헌 20조 3항·89조 最判平5.2.16 / 箕面忠魂碑・慰霊祭事件 충혼비 이전·위령제 참석은 합헌 목적효과기준 最大判平22.1.20 / 空知太神社事件 시유지 무상 제공은 89조 위반. 목적효과기준이 아닌 제반 사정 종합고려 最大判令3.2.24 / 孔子廟事件 공원 내 공자묘 부지 사용료 전액 면제는 위헌 空知太 틀 원문·참고 - 裁判所 판례검색: 最大判昭52.7.13 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 昭和46 行ツ 69로 검색） - wikipedia: 津地鎮祭訴訟 https://ja.wikipedia.org/wiki/%e6%b4%a5%e5%9c%b0%e9%8e%ae%e7%a5%ad%e8%a8%b4%e8%a8%9f"},"愛媛玉串料訴訟":{"type":"case","subject":"헌법","id":"愛媛玉串料訴訟","title":"愛媛玉串料訴訟","sub":"最大判平9.4.2","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判平9.4.2\u003c/strong>（최고재 대법정 1997.4.2）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成4年(行ツ)第156号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>손해배상 대위청구 사건（주민소송）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集51巻4号1673頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>원판결 파기. \u003cstrong>위헌\u003c/strong>(20조 3항·89조 위반) → 지사 등의 배상책임 인정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 3항 정교분리·목적효과기준 / 89조 공금지출）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>愛媛県 지사 등은 1981~86년, 현의 공금에서 \u003cstrong>야스쿠니신사(靖国神社)의 例大祭에 다마구시료(玉串料)\u003c/strong>, みたま祭에 헌등료(献灯料), \u003cstrong>현 호국신사(県護国神社)의 위령대제에 공물료(供物料)\u003c/strong> 명목으로 합계 166,000엔을 지출했다.\u003c/p>\n\u003cp>주민이 이 지출은 헌법 20조 3항·89조에 위반하는 위법한 공금지출이라며 주민소송으로 손해배상을 대위청구. 1심(松山地裁) 위헌 → 2심(高松高裁) 합헌 → 주민 측 상고.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>다마구시료 등의 공금 지출은 20조 3항의 「종교적 활동」에 해당하는가.\u003c/li>\u003cli>지진제(津地鎮祭)와 같은 사회적 의례라 할 수 있는가.\u003c/li>\u003cli>전몰자 위령·유족 위문이라는 목적으로 정당화되는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003cp>목적효과기준(津地鎮祭)을 적용하되, 결론은 반대로 갔다.\u003c/p>\n\u003ch3>1. 사회적 의례라 할 수 없음\u003c/h3>\n\u003cp>다마구시료 등의 봉납은 건축 착공 시의 지진제와 달리, \u003cstrong>시대의 추이에 따라 이미 그 종교적 의의가 희박해진 사회적 의례로 되었다고는 할 수 없다\u003c/strong>. 일반인이 이를 사회적 의례에 불과하다고 평가한다고 보기 어렵고, 봉납자 자신도 그것이 \u003cstrong>종교적 의의를 가진다는 의식\u003c/strong>을 가지지 않을 수 없다.\u003c/p>\n\u003ch3>2. 특정 종교단체와의 특별한 관계\u003c/h3>\n\u003cp>현이 특정 종교단체가 거행하는 중요한 종교상 제사에 관련된 다마구시료 등을 \u003cstrong>다른 유사 단체에는 하지 않는 방식으로\u003c/strong> 지출하는 것은, 현이 그 특정 종교단체와만 \u003cstrong>의식적으로 특별한 관계\u003c/strong>를 갖는다는 인상을 일반인에게 주고, 특정 종교에 대한 관심을 불러일으킨다.\u003c/p>\n\u003ch3>3. 목적으로 정당화 불가\u003c/h3>\n\u003cp>전몰자 위령·유족 위문이 목적이라 해도, \u003cstrong>특정 종교와 특별한 관계를 갖는 방식으로 행할 필요는 없다\u003c/strong>.\u003c/p>\n\u003cp>→ 목적이 종교적 의의를 가짐을 면할 수 없고, 효과가 특정 종교에 대한 원조·조장·촉진이 된다. 상당한 한도를 초과 → \u003cstrong>20조 3항의 종교적 활동에 해당, 지출은 89조에도 위반\u003c/strong>. 지사 등의 배상책임 인정.\u003c/p>\n\u003ch3>반대의견\u003c/h3>\n\u003cp>대법정 13 대 2의 판단으로, 장관을 포함한 소수의 반대의견(합헌 취지)이 있었다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최고재가 정교분리 분야에서 목적효과기준을 적용해 처음으로 위헌 결론\u003c/strong>을 낸 판례 — 津地鎮祭와 반드시 세트 비교.\u003c/li>\u003cli>결론을 가른 요소: ① \u003cstrong>사회적 의례성의 부정\u003c/strong>(지진제와의 구별), ② \u003cstrong>특정 종교단체와만의 특별한 관계\u003c/strong>라는 외관·효과, ③ 목적(위령·위문)으로는 정당화 불가.\u003c/li>\u003cli>89조 위반도 함께 인정한 점(공금지출 사안이므로 20조 3항 + 89조 이중 구성).\u003c/li>\u003cli>주민소송(당시 지방자치법 242조의2 1항 4호)의 손해배상 대위청구 구조.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭52.7.13 / 津地鎮祭事件\u003c/td>\u003ctd>기준은 동일, 결론은 반대(합헌)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平5.2.16 / 箕面忠魂碑訴訟\u003c/td>\u003ctd>목적효과기준 합헌례\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平22.1.20 / 空知太神社事件\u003c/td>\u003ctd>국공유지 무상제공형에서는 종합고려 틀로 이행\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最大判平9.4.2\u003c/a>（사건번호 平成4(行ツ)156으로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 愛媛玉串料訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"愛媛玉串料訴訟 最大判平9.4.2 항목 내용 ------ ------ 인용 最大判平9.4.2 （최고재 대법정 1997.4.2） 사건번호 平成4年 行ツ 第156号 사건명 손해배상 대위청구 사건（주민소송） 판례집 民集51巻4号1673頁 결론 원판결 파기. 위헌 20조 3항·89조 위반 → 지사 등의 배상책임 인정 과목 헌법（20조 3항 정교분리·목적효과기준 / 89조 공금지출） 사안 愛媛県 지사 등은 1981~86년, 현의 공금에서 야스쿠니신사 靖国神社 의 例大祭에 다마구시료 玉串料 , みたま祭에 헌등료 献灯料 , 현 호국신사 県護国神社 의 위령대제에 공물료 供物料 명목으로 합계 166,000엔을 지출했다. 주민이 이 지출은 헌법 20조 3항·89조에 위반하는 위법한 공금지출이라며 주민소송으로 손해배상을 대위청구. 1심 松山地裁 위헌 → 2심 高松高裁 합헌 → 주민 측 상고. 쟁점 1. 다마구시료 등의 공금 지출은 20조 3항의 「종교적 활동」에 해당하는가. 2. 지진제 津地鎮祭 와 같은 사회적 의례라 할 수 있는가. 3. 전몰자 위령·유족 위문이라는 목적으로 정당화되는가. 판시 목적효과기준 津地鎮祭 을 적용하되, 결론은 반대로 갔다. 1. 사회적 의례라 할 수 없음 다마구시료 등의 봉납은 건축 착공 시의 지진제와 달리, 시대의 추이에 따라 이미 그 종교적 의의가 희박해진 사회적 의례로 되었다고는 할 수 없다 . 일반인이 이를 사회적 의례에 불과하다고 평가한다고 보기 어렵고, 봉납자 자신도 그것이 종교적 의의를 가진다는 의식 을 가지지 않을 수 없다. 2. 특정 종교단체와의 특별한 관계 현이 특정 종교단체가 거행하는 중요한 종교상 제사에 관련된 다마구시료 등을 다른 유사 단체에는 하지 않는 방식으로 지출하는 것은, 현이 그 특정 종교단체와만 의식적으로 특별한 관계 를 갖는다는 인상을 일반인에게 주고, 특정 종교에 대한 관심을 불러일으킨다. 3. 목적으로 정당화 불가 전몰자 위령·유족 위문이 목적이라 해도, 특정 종교와 특별한 관계를 갖는 방식으로 행할 필요는 없다 . → 목적이 종교적 의의를 가짐을 면할 수 없고, 효과가 특정 종교에 대한 원조·조장·촉진이 된다. 상당한 한도를 초과 → 20조 3항의 종교적 활동에 해당, 지출은 89조에도 위반 . 지사 등의 배상책임 인정. 반대의견 대법정 13 대 2의 판단으로, 장관을 포함한 소수의 반대의견 합헌 취지 이 있었다. 시험 포인트 - 최고재가 정교분리 분야에서 목적효과기준을 적용해 처음으로 위헌 결론 을 낸 판례 — 津地鎮祭와 반드시 세트 비교. - 결론을 가른 요소: ① 사회적 의례성의 부정 지진제와의 구별 , ② 특정 종교단체와만의 특별한 관계 라는 외관·효과, ③ 목적 위령·위문 으로는 정당화 불가. - 89조 위반도 함께 인정한 점 공금지출 사안이므로 20조 3항 + 89조 이중 구성 . - 주민소송 당시 지방자치법 242조의2 1항 4호 의 손해배상 대위청구 구조. 후속·관련 판례 관계 ------ ------ 最大判昭52.7.13 / 津地鎮祭事件 기준은 동일, 결론은 반대 합헌 最判平5.2.16 / 箕面忠魂碑訴訟 목적효과기준 합헌례 最大判平22.1.20 / 空知太神社事件 국공유지 무상제공형에서는 종합고려 틀로 이행 원문·참고 - 裁判所 판례검색: 最大判平9.4.2 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 平成4 行ツ 156으로 검색） - wikipedia: 愛媛玉串料訴訟 https://ja.wikipedia.org/wiki/%e6%84%9b%e5%aa%9b%e7%8e%89%e4%b8%b2%e6%96%99%e8%a8%b4%e8%a8%9f"},"エホバの証人剣道実技拒否訴訟（神戸高専事件）":{"type":"case","subject":"헌법","id":"エホバの証人剣道実技拒否訴訟（神戸高専事件）","title":"エホバの証人剣道実技拒否訴訟（神戸高専事件）","sub":"最二小判平8.3.8","chip":{"label":"위법","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最二小判平8.3.8\u003c/strong>（최고재 제2소법정 1996.3.8）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成7年(行ツ)第74号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>진급거부처분·퇴학처분 취소청구 사건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集50巻3号469頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 유급·퇴학처분은 \u003cstrong>재량권의 일탈·남용으로 위법\u003c/strong>(처분 취소 확정)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 신교의 자유 / 행정법·재량통제와 교차）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>神戸市立工業高等専門学校 학생 X는 「여호와의 증인」 신자로, 교의(격투기 금지)에 따라 필수과목 체육의 \u003cstrong>검도 실기를 거부\u003c/strong>하고, 견학과 레포트 제출 등 \u003cstrong>대체조치를 신청\u003c/strong>했다. 학교는 이를 인정하지 않았고, X는 체육 미이수로 \u003cstrong>2년 연속 원급유급 → 퇴학처분\u003c/strong>을 받았다.\u003c/p>\n\u003cp>X가 진급거부처분·퇴학처분의 취소를 청구. 2심(大阪高裁)이 처분을 취소하자 학교 측이 상고.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>교장의 진급·퇴학 판단에 대한 사법심사의 방식(재량통제).\u003c/li>\u003cli>신앙상 이유에 의한 실기 거부에 대체조치를 검토하지 않은 처분은 위법한가.\u003c/li>\u003cli>대체조치를 인정하는 것이 오히려 정교분리(20조 3항)에 반하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 재량과 그 한계\u003c/h3>\n\u003cp>진급·퇴학 처분은 교장의 합리적 교육적 재량에 맡겨지지만, \u003cstrong>퇴학은 학생의 신분을 박탈하는 중대한 조치\u003c/strong>이고 원급유급도 불이익이 크므로, 그 판단에는 \u003cstrong>특히 신중한 배려\u003c/strong>가 요구된다.\u003c/p>\n\u003ch3>2. 本件 처분의 위법성\u003c/h3>\n\u003cul>\u003cli>X의 거부 이유는 \u003cstrong>신앙의 핵심 부분과 밀접하게 관련된 진지한 것\u003c/strong>이었다.\u003c/li>\u003cli>검도 실기는 필수라고 할 수 없고, 다른 체육 종목 이수 등 \u003cstrong>대체방법이 가능\u003c/strong>했다.\u003c/li>\u003cli>학교는 대체조치의 \u003cstrong>검토조차 하지 않고\u003c/strong> 유급·퇴학에 이르렀다.\u003c/li>\u003c/ul>\n\u003cp>→ 고려해야 할 사항을 고려하지 않은 것으로, \u003cstrong>사회관념상 현저히 타당성을 결여\u003c/strong>하여 재량권의 범위를 초과한 위법한 처분이다.\u003c/p>\n\u003ch3>3. 대체조치와 정교분리\u003c/h3>\n\u003cp>신앙상 이유를 배려해 대체조치를 취하는 것은, 그 목적·효과에 비추어 \u003cstrong>20조 3항의 종교적 활동에 해당하지 않는다\u003c/strong>(정교분리 위반이 아니다). 또한 대체조치 신청 이유의 당부를 판단하기 위해 신앙의 진지성을 조사하는 것도 공교육의 종교적 중립성에 반하지 않는다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>형식은 \u003cstrong>행정재량의 일탈·남용\u003c/strong>(취소소송) 사안 — 신교의 자유 「침해로 위헌」이라고 정면 판단한 것이 아니라, 신앙에 대한 배려 결여를 \u003cstrong>재량통제\u003c/strong>로 흡수한 구조. 헌법·행정법 양쪽에서 출제된다.\u003c/li>\u003cli>키워드: 「신앙의 핵심 부분과 밀접하게 관련된 진지한 것」, 「사회관념상 현저히 타당성을 결여」.\u003c/li>\u003cli>\u003cstrong>대체조치 = 정교분리 위반 아님\u003c/strong>이라는 판시 — 배려(accommodation)와 정교분리의 관계를 정리한 부분이 빈출.\u003c/li>\u003cli>비교: 剣道 거부는 배려 필요(본판결) vs 일반적 의무의 종교적 면제를 넓게 인정하는 것은 아님 — 加持祈祷事件(신앙의 자유의 한계)과 대비.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭38.5.15 / 加持祈祷事件\u003c/td>\u003ctd>종교적 행위의 자유의 한계(타인의 생명·신체 침해는 불가)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最一小決平8.1.30 / 宗教法人解散命令事件\u003c/td>\u003ctd>같은 해의 신교의 자유 판례. 간접적·사실상 제약의 형량\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平19.2.27 / 君が代ピアノ伴奏事件\u003c/td>\u003ctd>내심과 외부적 행위 명령의 관계(19조 축)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最判平8.3.8\u003c/a>（사건번호 平成7(行ツ)74로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E7%A5%9E%E6%88%B8%E9%AB%98%E5%B0%82%E5%89%A3%E9%81%93%E5%AE%9F%E6%8A%80%E6%8B%92%E5%90%A6%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia: 神戸高専剣道実技拒否事件\u003c/a>\u003c/li>\u003c/ul>","search":"エホバの証人剣道実技拒否訴訟（神戸高専事件） 最二小判平8.3.8 항목 내용 ------ ------ 인용 最二小判平8.3.8 （최고재 제2소법정 1996.3.8） 사건번호 平成7年 行ツ 第74号 사건명 진급거부처분·퇴학처분 취소청구 사건 판례집 民集50巻3号469頁 결론 상고기각. 유급·퇴학처분은 재량권의 일탈·남용으로 위법 처분 취소 확정 과목 헌법（20조 신교의 자유 / 행정법·재량통제와 교차） 사안 神戸市立工業高等専門学校 학생 x는 「여호와의 증인」 신자로, 교의 격투기 금지 에 따라 필수과목 체육의 검도 실기를 거부 하고, 견학과 레포트 제출 등 대체조치를 신청 했다. 학교는 이를 인정하지 않았고, x는 체육 미이수로 2년 연속 원급유급 → 퇴학처분 을 받았다. x가 진급거부처분·퇴학처분의 취소를 청구. 2심 大阪高裁 이 처분을 취소하자 학교 측이 상고. 쟁점 1. 교장의 진급·퇴학 판단에 대한 사법심사의 방식 재량통제 . 2. 신앙상 이유에 의한 실기 거부에 대체조치를 검토하지 않은 처분은 위법한가. 3. 대체조치를 인정하는 것이 오히려 정교분리 20조 3항 에 반하는가. 판시 1. 재량과 그 한계 진급·퇴학 처분은 교장의 합리적 교육적 재량에 맡겨지지만, 퇴학은 학생의 신분을 박탈하는 중대한 조치 이고 원급유급도 불이익이 크므로, 그 판단에는 특히 신중한 배려 가 요구된다. 2. 本件 처분의 위법성 - x의 거부 이유는 신앙의 핵심 부분과 밀접하게 관련된 진지한 것 이었다. - 검도 실기는 필수라고 할 수 없고, 다른 체육 종목 이수 등 대체방법이 가능 했다. - 학교는 대체조치의 검토조차 하지 않고 유급·퇴학에 이르렀다. → 고려해야 할 사항을 고려하지 않은 것으로, 사회관념상 현저히 타당성을 결여 하여 재량권의 범위를 초과한 위법한 처분이다. 3. 대체조치와 정교분리 신앙상 이유를 배려해 대체조치를 취하는 것은, 그 목적·효과에 비추어 20조 3항의 종교적 활동에 해당하지 않는다 정교분리 위반이 아니다 . 또한 대체조치 신청 이유의 당부를 판단하기 위해 신앙의 진지성을 조사하는 것도 공교육의 종교적 중립성에 반하지 않는다. 시험 포인트 - 형식은 행정재량의 일탈·남용 취소소송 사안 — 신교의 자유 「침해로 위헌」이라고 정면 판단한 것이 아니라, 신앙에 대한 배려 결여를 재량통제 로 흡수한 구조. 헌법·행정법 양쪽에서 출제된다. - 키워드: 「신앙의 핵심 부분과 밀접하게 관련된 진지한 것」, 「사회관념상 현저히 타당성을 결여」. - 대체조치 = 정교분리 위반 아님 이라는 판시 — 배려 accommodation 와 정교분리의 관계를 정리한 부분이 빈출. - 비교: 剣道 거부는 배려 필요 본판결 vs 일반적 의무의 종교적 면제를 넓게 인정하는 것은 아님 — 加持祈祷事件 신앙의 자유의 한계 과 대비. 후속·관련 판례 관계 ------ ------ 最大判昭38.5.15 / 加持祈祷事件 종교적 행위의 자유의 한계 타인의 생명·신체 침해는 불가 最一小決平8.1.30 / 宗教法人解散命令事件 같은 해의 신교의 자유 판례. 간접적·사실상 제약의 형량 最判平19.2.27 / 君が代ピアノ伴奏事件 내심과 외부적 행위 명령의 관계 19조 축 원문·참고 - 裁判所 판례검색: 最判平8.3.8 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 平成7 行ツ 74로 검색） - wikipedia: 神戸高専剣道実技拒否事件 https://ja.wikipedia.org/wiki/%e7%a5%9e%e6%88%b8%e9%ab%98%e5%b0%82%e5%89%a3%e9%81%93%e5%ae%9f%e6%8a%80%e6%8b%92%e5%90%a6%e4%ba%8b%e4%bb%b6"},"サラリーマン税金訴訟（大嶋訴訟）":{"type":"case","subject":"헌법","id":"サラリーマン税金訴訟（大嶋訴訟）","title":"サラリーマン税金訴訟（大嶋訴訟）","sub":"最大判昭60.3.27","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭60.3.27\u003c/strong>（최고재 대법정 1985.3.27）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和55年(行ツ)第15号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>所得税決定処分取消請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集39巻2号247頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>寺田治郎（전원일치. 보충의견 다수）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>합헌·상고기각. 구 소득세법의 급여소득 과세 규정은 14조 1항 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항 법 아래의 평등）· 조세법률주의（30조·84조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 소득세법（소40 법률 33호 개정 전）9조 1항 5호 등 급여소득 과세 규정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>별칭은 大島訴訟·大嶋訴訟. 원고 大嶋正(사립대 교수). 상고 중 사망 → 자녀가 승계.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>X는 1964(소39)년분 소득으로 급여소득과 잡소득이 있었으나 확정신고를 하지 않았다. 좌경세무서장이 소득세 결정·무신고가산세 부과결정을 하자, 구 소득세법의 급여소득 규정이 사업소득자 등에 비해 급여소득자를 현저히 불리하게 다루므로 14조 1항에 위반·무효라고 주장하고 처분 취소를 구했다.\u003c/p>\n\u003cp>1심(교토지재)·2심(오사카고재) 모두 청구 기각. 최고재도 상고기각.\u003c/p>\n\u003cp>원고 주장의 세 축:\u003c/p>\n\u003col>\u003cli>\u003cstrong>필요경비\u003c/strong> — 사업소득 등은 실액공제, 급여소득은 급여소득공제(개산공제)만\u003c/li>\u003cli>\u003cstrong>포착률\u003c/strong> — 원천징수로 급여소득의 포착률이 훨씬 높다(소위 クロヨン)\u003c/li>\u003cli>\u003cstrong>조세우대조치\u003c/strong> — 사업소득 쪽에 합리적 이유 없는 특별조치가 있다\u003c/li>\u003c/ol>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>조세법 분야의 취급 구별에 대한 14조 심사 기준은 무엇인가.\u003c/li>\u003cli>필요경비의 실액공제 유무 차이가 14조 1항에 위반하는가.\u003c/li>\u003cli>포착률 격차·조세우대조치가 本件 과세 규정을 위헌으로 만드는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 심사 태도（조세법·광범한 재량）\u003c/h3>\n\u003cp>14조 1항은 합리적 이유 없는 차별을 금지할 뿐, 절대적 평등을 보장하지 않는다.\u003c/p>\n\u003cp>조세는 재원 조달에 더해 재분배·자원배분·경기조정 기능을 갖고, 재정·경제·사회정책의 종합 판단과 고도의 전문기술 판단을 요한다. 따라서 조세법의 정립은 \u003cstrong>입법부의 정책적·기술적 판단\u003c/strong>에 맡길 수밖에 없고, 법원은 기본적으로 그 재량을 존중한다.\u003c/p>\n\u003cp>조세법 분야에서 소득의 성질 차이 등을 이유로 한 취급의 구별은,\u003c/p>\n\u003cul>\u003cli>입법목적이 \u003cstrong>정당\u003c/strong>하고\u003c/li>\u003cli>채택된 구별의 태양이 그 목적과의 관련에서 \u003cstrong>현저히 불합리함이 명백하지 않는 한\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>합리성을 부정할 수 없고, 14조 1항 위반이라고 할 수 없다.\u003c/p>\n\u003ch3>2. 필요경비 구별은 합헌\u003c/h3>\n\u003cp>급여소득자는 자기 계산·위험으로 업무를 하는 것이 아니라, 사용자가 정한 대로 노무를 제공하고 그 대가를 받는다. 직장 설비 등은 사용자가 부담하는 것이 통례이고, 필요경비와 가사비의 구별도 어렵다. 인원이 방대해 개별 실액공제(또는 선택제)는 세무집행상 혼란·비용 증가·입증 巧拙에 따른 불공평을 부를 수 있다.\u003c/p>\n\u003cp>개산공제(급여소득공제)의 목적은 부담의 均衡을 배려하면서 위 폐해를 막는 데 있고, \u003cstrong>정당\u003c/strong>하다. 공제액이 필요경비를 명백히 밑돈다고 인정하기도 어렵다 → 구별은 합리적, 14조 위반 아님.\u003c/p>\n\u003ch3>3. 포착률·우대조치\u003c/h3>\n\u003cp>포착의 불균형은 원칙적으로 \u003cstrong>세무행정의 적정 집행\u003c/strong>으로 시정할 문제다. 격차가 정의·형평에 반할 정도로 현저하고, 장기간 항상적이며 \u003cstrong>조세法制 자체에 基因\u003c/strong>하는 경우라면 별론이나, 本件에서 그런 사정은 인정되지 않는다.\u003c/p>\n\u003cp>우대조치가 합리성을 결한다고 해도, 그 조치 \u003cstrong>자체의 효력\u003c/strong>에 영향을 줄 뿐, 本件 과세 규정을 위헌·무효로 만들지는 않는다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>14조 심사가 \u003cstrong>느슨한 쪽\u003c/strong>(목적 정당 + 수단이 현저히 불합리함이 명백하지 않으면 합헌). 존속살·국적법과 대비.\u003c/li>\u003cli>「급여소득공제 = 필요경비 개산공제」로 보고 균형 여부를 본다. 포착률·우대조치는 \u003cstrong>별 제도의 문제\u003c/strong>이지 本件 규정의 위헌 사유가 되기 어렵다.\u003c/li>\u003cli>조세법률주의(84조)를 말하면서도, \u003cstrong>내용\u003c/strong>은 입법 재량. 30조·84조는 과세요건 법정·명확성을 요구할 뿐 세율·공제 설계까지 법원이 다시 쓰는 근거가 아니다.\u003c/li>\u003cli>보충의견(伊藤正己 등): 후단 열거 사유(성별 등)에 의한 차별이면 엄격 심사. 개별 사안에서 필요경비가 공제액을 \u003cstrong>현저히\u003c/strong> 넘으면 적용위헌 여지를 남긴다. 本件에는 해당 없음.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/19-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E3%82%B5%E3%83%A9%E3%83%AA%E3%83%BC%E3%83%9E%E3%83%B3%E7%A8%8E%E9%87%91%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: サラリーマン税金訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"サラリーマン税金訴訟（大嶋訴訟） 最大判昭60.3.27 항목 내용 ------ ------ 인용 最大判昭60.3.27 （최고재 대법정 1985.3.27） 사건번호 昭和55年 行ツ 第15号 사건명 所得税決定処分取消請求事件 판례집 民集39巻2号247頁 재판장 寺田治郎（전원일치. 보충의견 다수） 결론 합헌·상고기각. 구 소득세법의 급여소득 과세 규정은 14조 1항 위반 아님 과목 헌법（14조 1항 법 아래의 평등）· 조세법률주의（30조·84조） 대상 조문 구 소득세법（소40 법률 33호 개정 전）9조 1항 5호 등 급여소득 과세 규정 별칭은 大島訴訟·大嶋訴訟. 원고 大嶋正 사립대 교수 . 상고 중 사망 → 자녀가 승계. 사안 x는 1964 소39 년분 소득으로 급여소득과 잡소득이 있었으나 확정신고를 하지 않았다. 좌경세무서장이 소득세 결정·무신고가산세 부과결정을 하자, 구 소득세법의 급여소득 규정이 사업소득자 등에 비해 급여소득자를 현저히 불리하게 다루므로 14조 1항에 위반·무효라고 주장하고 처분 취소를 구했다. 1심 교토지재 ·2심 오사카고재 모두 청구 기각. 최고재도 상고기각. 원고 주장의 세 축: 1. 필요경비 — 사업소득 등은 실액공제, 급여소득은 급여소득공제 개산공제 만 2. 포착률 — 원천징수로 급여소득의 포착률이 훨씬 높다 소위 クロヨン 3. 조세우대조치 — 사업소득 쪽에 합리적 이유 없는 특별조치가 있다 쟁점 1. 조세법 분야의 취급 구별에 대한 14조 심사 기준은 무엇인가. 2. 필요경비의 실액공제 유무 차이가 14조 1항에 위반하는가. 3. 포착률 격차·조세우대조치가 本件 과세 규정을 위헌으로 만드는가. 판시 1. 심사 태도（조세법·광범한 재량） 14조 1항은 합리적 이유 없는 차별을 금지할 뿐, 절대적 평등을 보장하지 않는다. 조세는 재원 조달에 더해 재분배·자원배분·경기조정 기능을 갖고, 재정·경제·사회정책의 종합 판단과 고도의 전문기술 판단을 요한다. 따라서 조세법의 정립은 입법부의 정책적·기술적 판단 에 맡길 수밖에 없고, 법원은 기본적으로 그 재량을 존중한다. 조세법 분야에서 소득의 성질 차이 등을 이유로 한 취급의 구별은, - 입법목적이 정당 하고 - 채택된 구별의 태양이 그 목적과의 관련에서 현저히 불합리함이 명백하지 않는 한 합리성을 부정할 수 없고, 14조 1항 위반이라고 할 수 없다. 2. 필요경비 구별은 합헌 급여소득자는 자기 계산·위험으로 업무를 하는 것이 아니라, 사용자가 정한 대로 노무를 제공하고 그 대가를 받는다. 직장 설비 등은 사용자가 부담하는 것이 통례이고, 필요경비와 가사비의 구별도 어렵다. 인원이 방대해 개별 실액공제 또는 선택제 는 세무집행상 혼란·비용 증가·입증 巧拙에 따른 불공평을 부를 수 있다. 개산공제 급여소득공제 의 목적은 부담의 均衡을 배려하면서 위 폐해를 막는 데 있고, 정당 하다. 공제액이 필요경비를 명백히 밑돈다고 인정하기도 어렵다 → 구별은 합리적, 14조 위반 아님. 3. 포착률·우대조치 포착의 불균형은 원칙적으로 세무행정의 적정 집행 으로 시정할 문제다. 격차가 정의·형평에 반할 정도로 현저하고, 장기간 항상적이며 조세法制 자체에 基因 하는 경우라면 별론이나, 本件에서 그런 사정은 인정되지 않는다. 우대조치가 합리성을 결한다고 해도, 그 조치 자체의 효력 에 영향을 줄 뿐, 本件 과세 규정을 위헌·무효로 만들지는 않는다. 시험 포인트 - 14조 심사가 느슨한 쪽 목적 정당 + 수단이 현저히 불합리함이 명백하지 않으면 합헌 . 존속살·국적법과 대비. - 「급여소득공제 = 필요경비 개산공제」로 보고 균형 여부를 본다. 포착률·우대조치는 별 제도의 문제 이지 本件 규정의 위헌 사유가 되기 어렵다. - 조세법률주의 84조 를 말하면서도, 내용 은 입법 재량. 30조·84조는 과세요건 법정·명확성을 요구할 뿐 세율·공제 설계까지 법원이 다시 쓰는 근거가 아니다. - 보충의견 伊藤正己 등 : 후단 열거 사유 성별 등 에 의한 차별이면 엄격 심사. 개별 사안에서 필요경비가 공제액을 현저히 넘으면 적용위헌 여지를 남긴다. 本件에는 해당 없음. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/19-3.html - wikipedia: サラリーマン税金訴訟 https://ja.wikipedia.org/wiki/%e3%82%b5%e3%83%a9%e3%83%aa%e3%83%bc%e3%83%9e%e3%83%b3%e7%a8%8e%e9%87%91%e8%a8%b4%e8%a8%9f"},"ノンフィクション「逆転」事件":{"type":"case","subject":"헌법","id":"ノンフィクション「逆転」事件","title":"ノンフィクション「逆転」事件","sub":"最判平6.2.8","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最判平6.2.8\u003c/strong>（최고재 제3소법정 1994.2.8）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成元年（オ）第1649号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>慰藉料請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集48巻2号149頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 실명으로 전과를 공표한 것은 불법행위. 위자료 인정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（13조 사생활을 함부로 공개당하지 않을 이익）· 민법 709조\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>오키나와가 미국 통치하에 있을 때, X 등 4명이 미군 2명과 싸우다 1명이 사망·1명이 부상. X 등은 미국 고등법원에서 상해죄로 금고 3년 실형을 받고 복역했다.\u003c/p>\n\u003cp>X는 가출옥 후 도쿄의 버스 운전사로 취직하고, 전과를 숨긴 채 결혼해 평온히 살고 있었다.\u003c/p>\n\u003cp>Y(伊佐千尋)는 그 재판의 배심원 경험을 바탕으로 논픽션 『逆転』을 쓰고 상을 받았다. 책에 X의 \u003cstrong>실명\u003c/strong>이 실려 전과 사실이 공표됐다.\u003c/p>\n\u003cp>X는 프라이버시 침해를 이유로 위자료 300만 엔을 청구. 1심·항소심이 위자료 50만 엔을 인정하고, 최고재가 상고를 기각했다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>전과 등 사실을 함부로 공표당하지 않을 이익이 법적 보호의 대상인가(私人의 저작물에 의한 공표도 포함인가).\u003c/li>\u003cli>표현의 자유와 어떻게 조정하는가. 本件 실명 공표는 불법행위인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 공표당하지 않을 이익\u003c/h3>\n\u003cp>전과 등은 그 사람의 \u003cstrong>명예·신용에 직접 관계\u003c/strong>하는 사항이다. 함부로 공표당하지 않을 것에 대해 \u003cstrong>법적 보호에 값하는 이익\u003c/strong>이 있다.\u003c/p>\n\u003cp>이 이익은 공적 기관의 공개뿐 아니라 \u003cstrong>私人·사적 단체의 공표\u003c/strong>에도 같다. (前科照会事件 最判昭56.4.14를 이 국면으로 확장)\u003c/p>\n\u003ch3>2. 표현의 자유와의 조정（이익형량）\u003c/h3>\n\u003cp>형사사건·형사재판은 사회 일반의 관심·비판 대상이 될 수 있다. 사건 자체를 공표할 \u003cstrong>역사적·사회적 의의\u003c/strong>가 있으면, 당사자의 실명을 밝히는 것이 허용되지 않는다고는 할 수 없다.\u003c/p>\n\u003cp>실명 공표가 불법행위가 되는지는 다음을 \u003cstrong>아울러\u003c/strong> 본다.\u003c/p>\n\u003cul>\u003cli>그 후 \u003cstrong>생활 상황\u003c/strong>\u003c/li>\u003cli>사건 자체의 \u003cstrong>역사적·사회적 의의\u003c/strong>\u003c/li>\u003cli>당사자로서의 \u003cstrong>중요성\u003c/strong>\u003c/li>\u003cli>그 사람의 \u003cstrong>사회적 활동과 영향력\u003c/strong>\u003c/li>\u003cli>저작물의 \u003cstrong>목적·성격\u003c/strong>에 비춘 실명 사용의 \u003cstrong>의의·필요성\u003c/strong>\u003c/li>\u003c/ul>\n\u003cp>그 결과 \u003cstrong>공표당하지 않을 법적 이익이 공표 이유보다 우월\u003c/strong>하면, 정신적 고통의 배상을 청구할 수 있다.\u003c/p>\n\u003ch3>3. 本件 적용\u003c/h3>\n\u003cp>출판 무렵 X는 이미 일개 시민으로 복귀해 있었다. 실명을 써야 할 정당한 이유·상당성 있는 위법성 조각 인식이 없다 → 불법행위 인정.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>「전과는 절대 공표 불가」가 아니다. \u003cstrong>이익형량\u003c/strong>이다.\u003c/li>\u003cli>공표 자체가 아니라 \u003cstrong>실명\u003c/strong>이 핵심이다. 사건 공표의 사회적 의의는 인정될 수 있다.\u003c/li>\u003cli>京都府学連(국가 vs 개인)과 달리, 私人 사이의 불법행위로 프라이버시를 보호한 축.\u003c/li>\u003cli>관련: 前科照会事件(最判昭56.4.14) — 공공기관의 전과 조회·회답.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/12-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E3%83%8E%E3%83%B3%E3%83%95%E3%82%A3%E3%82%AF%E3%82%B7%E3%83%A7%E3%83%B3%E3%80%8C%E9%80%86%E8%BB%A2%E3%80%8D%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b36-2-8/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"ノンフィクション「逆転」事件 最判平6.2.8 항목 내용 ------ ------ 인용 最判平6.2.8 （최고재 제3소법정 1994.2.8） 사건번호 平成元年（オ）第1649号 사건명 慰藉料請求事件 판례집 民集48巻2号149頁 결론 상고기각. 실명으로 전과를 공표한 것은 불법행위. 위자료 인정 과목 헌법（13조 사생활을 함부로 공개당하지 않을 이익）· 민법 709조 사안 오키나와가 미국 통치하에 있을 때, x 등 4명이 미군 2명과 싸우다 1명이 사망·1명이 부상. x 등은 미국 고등법원에서 상해죄로 금고 3년 실형을 받고 복역했다. x는 가출옥 후 도쿄의 버스 운전사로 취직하고, 전과를 숨긴 채 결혼해 평온히 살고 있었다. y 伊佐千尋 는 그 재판의 배심원 경험을 바탕으로 논픽션 『逆転』을 쓰고 상을 받았다. 책에 x의 실명 이 실려 전과 사실이 공표됐다. x는 프라이버시 침해를 이유로 위자료 300만 엔을 청구. 1심·항소심이 위자료 50만 엔을 인정하고, 최고재가 상고를 기각했다. 쟁점 1. 전과 등 사실을 함부로 공표당하지 않을 이익이 법적 보호의 대상인가 私人의 저작물에 의한 공표도 포함인가 . 2. 표현의 자유와 어떻게 조정하는가. 本件 실명 공표는 불법행위인가. 판시 1. 공표당하지 않을 이익 전과 등은 그 사람의 명예·신용에 직접 관계 하는 사항이다. 함부로 공표당하지 않을 것에 대해 법적 보호에 값하는 이익 이 있다. 이 이익은 공적 기관의 공개뿐 아니라 私人·사적 단체의 공표 에도 같다. 前科照会事件 最判昭56.4.14를 이 국면으로 확장 2. 표현의 자유와의 조정（이익형량） 형사사건·형사재판은 사회 일반의 관심·비판 대상이 될 수 있다. 사건 자체를 공표할 역사적·사회적 의의 가 있으면, 당사자의 실명을 밝히는 것이 허용되지 않는다고는 할 수 없다. 실명 공표가 불법행위가 되는지는 다음을 아울러 본다. - 그 후 생활 상황 - 사건 자체의 역사적·사회적 의의 - 당사자로서의 중요성 - 그 사람의 사회적 활동과 영향력 - 저작물의 목적·성격 에 비춘 실명 사용의 의의·필요성 그 결과 공표당하지 않을 법적 이익이 공표 이유보다 우월 하면, 정신적 고통의 배상을 청구할 수 있다. 3. 本件 적용 출판 무렵 x는 이미 일개 시민으로 복귀해 있었다. 실명을 써야 할 정당한 이유·상당성 있는 위법성 조각 인식이 없다 → 불법행위 인정. 시험 포인트 - 「전과는 절대 공표 불가」가 아니다. 이익형량 이다. - 공표 자체가 아니라 실명 이 핵심이다. 사건 공표의 사회적 의의는 인정될 수 있다. - 京都府学連 국가 vs 개인 과 달리, 私人 사이의 불법행위로 프라이버시를 보호한 축. - 관련: 前科照会事件 最判昭56.4.14 — 공공기관의 전과 조회·회답. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/12-3.html - wikipedia https://ja.wikipedia.org/wiki/%e3%83%8e%e3%83%b3%e3%83%95%e3%82%a3%e3%82%af%e3%82%b7%e3%83%a7%e3%83%b3%e3%80%8c%e9%80%86%e8%bb%a2%e3%80%8d%e4%ba%8b%e4%bb%b6 - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b36-2-8/"},"外国人職員昇任試験拒否訴訟（東京都管理職選考試験事件）":{"type":"case","subject":"헌법","id":"外国人職員昇任試験拒否訴訟（東京都管理職選考試験事件）","title":"外国人職員昇任試験拒否訴訟（東京都管理職選考試験事件）","sub":"最大判平17.1.26","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判平17.1.26\u003c/strong>（최고재 대법정 2005.1.26）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成10年(行ツ)第93号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>管理職選考受験資格確認等請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集59巻1号128頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>町田顯（다수. 반대 2）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>합헌. 원판결 파기 자판. 일본 국민에 한해 관리직 승진을 인정한 도쿄도의 조치는 14조 1항·노기 3조 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항, 국민주권·공무원 취임）· 지방공무원법· 노동기준법 3조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상\u003c/td>\u003ctd>도쿄도 관리직 선고의 일본국적 요건\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>별칭은 東京都管理職選考試験事件·外国人の公職就任権. 상고인 = 도쿄도, 피상고인 = 한국적 특별영주자 직원.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>X(1950 이와테현 출생, 한국적, 특별영주자)는 소63.4 도쿄도에 \u003cstrong>보건부(保健婦)\u003c/strong> 로 채용됐다. 도는 소61부터 보건부 채용에 국적 요건을 두지 않았다.\u003c/p>\n\u003cp>평6·평7년도 인사위원회 관리직 선고(과장급 1차)를 보려 했으나, 일본국적이 없다는 이유로 수험이 거부됐다. 평6 요강에는 국적 명기가 없었고, 평7 요강에 「일본국적을 가질 것」이 명시됐다.\u003c/p>\n\u003cp>X는 국배법 1조 1항으로 위자료 등을 청구. 1심·항소심은 위법으로 보고 일부 인용. 최고재 대법정이 파기하고 청구를 배척.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>재류 외국인에게 공권력 행사에 해당하는 지방공무원 취임권이 헌법상 보장되는가.\u003c/li>\u003cli>관리직을 일체로 운용하면서 \u003cstrong>일본 국민만\u003c/strong> 승진시키는 조치는 14조 1항·노기 3조에 위반하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 외국인과 공무 취임（当然の法理）\u003c/h3>\n\u003cp>헌법상 기본적 인권 보장은, 권리의 성질상 일본 국민만을 대상으로 하고 있다고 해석되는 것을 제외하면, 재류 외국인에게도 미친다. 참정권처럼 \u003cstrong>국민주권에 직결\u003c/strong>되는 권리는 성질상 일본 국민에게만 미친다.\u003c/p>\n\u003cp>국민주권 원리상, 국·지방공공단체의 통치 모습은 국민이 최종 책임을 진다. 공권력 행사 또는 공공의 의사 형성에 참여하는 공무(이른바 \u003cstrong>공권력행사등 지방공무원\u003c/strong>)에 취임하는 것은, 원칙적으로 일본 국적자가 맡는 것이 법체계의 상정이다. 외국인에게 그 취임권이 보장된다고 할 수 없다（공무원에 관한 \u003cstrong>当然の法理\u003c/strong>）.\u003c/p>\n\u003cp>반대로, 공권력 행사 등에 해당하지 않는 직은 법률이 특히 금하지 않는 한 외국인도 채용할 수 있다. 本件 보건부 채용 자체가 위법이라는 취지는 아니다.\u003c/p>\n\u003ch3>2. 도쿄도의 일체적 관리직 제도 → 합헌\u003c/h3>\n\u003cp>당시 도쿄도 관리직에는 결정권한을 가진 직뿐 아니라, 결정 과정에 관여하는 직, 기획·연구 직도 포함됐다. 승진 후에도 \u003cstrong>특정 직종만\u003c/strong> 맡기는 임용관리를 하지 않아, 관리직이 되면 공권력 행사 등에 해당하는 직무를 맡을 수 있음을 \u003cstrong>당연한 전제\u003c/strong>로 운용했다.\u003c/p>\n\u003cp>이런 일체적 제도 아래, 일본 국민인 직원에 한해 관리직 승진을 인정하는 것은 합리적 이유에 기한 구별이다 → \u003cstrong>14조 1항 위반 아님\u003c/strong>. 노기 3조(국적을 이유로 한 차별 금지)에도 위반하지 않는다.\u003c/p>\n\u003ch2>의견 분포（15인）\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>입장\u003c/th>\u003cth>요지\u003c/th>\u003c/tr>\u003ctr>\u003ctd>다수\u003c/td>\u003ctd>공권력행사등 지방공무원 + 일체적 관리직 운용 → 국적 요건 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>의견\u003c/td>\u003ctd>결론 찬성. 이유: 외국인 공무 취임은 헌법상 보장되지 않고 입법·자치단체 재량（金谷利廣, 上田豊三）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반대\u003c/td>\u003ctd>관리직을 일률적으로 막을 합리적 근거 없음. 노기 3조·14조 위반（滝井繁男, 泉徳治）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>「외국인은 공무원이 될 수 없다」가 오답. \u003cstrong>채용 자체\u003c/strong>(보건부)는 가능. 쟁점은 \u003cstrong>관리직 승진·수험 자격의 국적 요건\u003c/strong>.\u003c/li>\u003cli>키워드는 \u003cstrong>当然の法理\u003c/strong>와 \u003cstrong>공권력행사등 지방공무원\u003c/strong>. 참정권과 같은 축(성질상 국민만).\u003c/li>\u003cli>다수는 「외국인 관리직을 개별적으로 가려야 한다」는 항소심을 배척. 일체적 임용제도를 전제로 일률 제한을 허용.\u003c/li>\u003cli>맥린 사건(最大判昭53.10.4)의 「권리의 성질상」 법리와 연결해 외운다.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/109-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E6%9D%B1%E4%BA%AC%E9%83%BD%E7%AE%A1%E7%90%86%E8%81%B7%E9%81%B8%E8%80%83%E8%A9%A6%E9%A8%93%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia: 東京都管理職選考試験事件\u003c/a>\u003c/li>\u003cli>행정서사 수험 정리: \u003ca href=\"https://gs.kabudata-dll.com/%E6%9C%80%E5%A4%A7%E5%88%A4%E5%B9%B317-1-26/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>, \u003ca href=\"https://gyosyo.info/%E6%9C%80%E5%A4%A7%E5%88%A4%E5%B9%B317-1-26%EF%BC%9A%E5%A4%96%E5%9B%BD%E4%BA%BA%E3%81%AE%E7%AE%A1%E7%90%86%E8%81%B7%E9%81%B8%E8%80%83%E5%8F%97%E9%A8%93%E3%81%AE%E6%8B%92%E5%90%A6%E4%BA%8B%E4%BB%B6/\" target=\"_blank\" rel=\"noopener\">행서숙\u003c/a>\u003c/li>\u003c/ul>","search":"外国人職員昇任試験拒否訴訟（東京都管理職選考試験事件） 最大判平17.1.26 항목 내용 ------ ------ 인용 最大判平17.1.26 （최고재 대법정 2005.1.26） 사건번호 平成10年 行ツ 第93号 사건명 管理職選考受験資格確認等請求事件 판례집 民集59巻1号128頁 재판장 町田顯（다수. 반대 2） 결론 합헌. 원판결 파기 자판. 일본 국민에 한해 관리직 승진을 인정한 도쿄도의 조치는 14조 1항·노기 3조 위반 아님 과목 헌법（14조 1항, 국민주권·공무원 취임）· 지방공무원법· 노동기준법 3조 대상 도쿄도 관리직 선고의 일본국적 요건 별칭은 東京都管理職選考試験事件·外国人の公職就任権. 상고인 = 도쿄도, 피상고인 = 한국적 특별영주자 직원. 사안 x 1950 이와테현 출생, 한국적, 특별영주자 는 소63.4 도쿄도에 보건부 保健婦 로 채용됐다. 도는 소61부터 보건부 채용에 국적 요건을 두지 않았다. 평6·평7년도 인사위원회 관리직 선고 과장급 1차 를 보려 했으나, 일본국적이 없다는 이유로 수험이 거부됐다. 평6 요강에는 국적 명기가 없었고, 평7 요강에 「일본국적을 가질 것」이 명시됐다. x는 국배법 1조 1항으로 위자료 등을 청구. 1심·항소심은 위법으로 보고 일부 인용. 최고재 대법정이 파기하고 청구를 배척. 쟁점 1. 재류 외국인에게 공권력 행사에 해당하는 지방공무원 취임권이 헌법상 보장되는가. 2. 관리직을 일체로 운용하면서 일본 국민만 승진시키는 조치는 14조 1항·노기 3조에 위반하는가. 판시 1. 외국인과 공무 취임（当然の法理） 헌법상 기본적 인권 보장은, 권리의 성질상 일본 국민만을 대상으로 하고 있다고 해석되는 것을 제외하면, 재류 외국인에게도 미친다. 참정권처럼 국민주권에 직결 되는 권리는 성질상 일본 국민에게만 미친다. 국민주권 원리상, 국·지방공공단체의 통치 모습은 국민이 최종 책임을 진다. 공권력 행사 또는 공공의 의사 형성에 참여하는 공무 이른바 공권력행사등 지방공무원 에 취임하는 것은, 원칙적으로 일본 국적자가 맡는 것이 법체계의 상정이다. 외국인에게 그 취임권이 보장된다고 할 수 없다（공무원에 관한 当然の法理 ）. 반대로, 공권력 행사 등에 해당하지 않는 직은 법률이 특히 금하지 않는 한 외국인도 채용할 수 있다. 本件 보건부 채용 자체가 위법이라는 취지는 아니다. 2. 도쿄도의 일체적 관리직 제도 → 합헌 당시 도쿄도 관리직에는 결정권한을 가진 직뿐 아니라, 결정 과정에 관여하는 직, 기획·연구 직도 포함됐다. 승진 후에도 특정 직종만 맡기는 임용관리를 하지 않아, 관리직이 되면 공권력 행사 등에 해당하는 직무를 맡을 수 있음을 당연한 전제 로 운용했다. 이런 일체적 제도 아래, 일본 국민인 직원에 한해 관리직 승진을 인정하는 것은 합리적 이유에 기한 구별이다 → 14조 1항 위반 아님 . 노기 3조 국적을 이유로 한 차별 금지 에도 위반하지 않는다. 의견 분포（15인） 입장 요지 ------ ------ 다수 공권력행사등 지방공무원 + 일체적 관리직 운용 → 국적 요건 합헌 의견 결론 찬성. 이유: 외국인 공무 취임은 헌법상 보장되지 않고 입법·자치단체 재량（金谷利廣, 上田豊三） 반대 관리직을 일률적으로 막을 합리적 근거 없음. 노기 3조·14조 위반（滝井繁男, 泉徳治） 시험 포인트 - 「외국인은 공무원이 될 수 없다」가 오답. 채용 자체 보건부 는 가능. 쟁점은 관리직 승진·수험 자격의 국적 요건 . - 키워드는 当然の法理 와 공권력행사등 지방공무원 . 참정권과 같은 축 성질상 국민만 . - 다수는 「외국인 관리직을 개별적으로 가려야 한다」는 항소심을 배척. 일체적 임용제도를 전제로 일률 제한을 허용. - 맥린 사건 最大判昭53.10.4 의 「권리의 성질상」 법리와 연결해 외운다. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/109-3.html - wikipedia: 東京都管理職選考試験事件 https://ja.wikipedia.org/wiki/%e6%9d%b1%e4%ba%ac%e9%83%bd%e7%ae%a1%e7%90%86%e8%81%b7%e9%81%b8%e8%80%83%e8%a9%a6%e9%a8%93%e4%ba%8b%e4%bb%b6 - 행정서사 수험 정리: 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e5%b9%b317-1-26/ , 행서숙 https://gyosyo.info/%e6%9c%80%e5%a4%a7%e5%88%a4%e5%b9%b317-1-26%ef%bc%9a%e5%a4%96%e5%9b%bd%e4%ba%ba%e3%81%ae%e7%ae%a1%e7%90%86%e8%81%b7%e9%81%b8%e8%80%83%e5%8f%97%e9%a8%93%e3%81%ae%e6%8b%92%e5%90%a6%e4%ba%8b%e4%bb%b6/"},"議員定数不均衡訴訟（一票の格差）":{"type":"case","subject":"헌법","id":"議員定数不均衡訴訟（一票の格差）","title":"議員定数不均衡訴訟（一票の格差）","sub":"最大判昭51.4.14","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭51.4.14\u003c/strong>（최고재 대법정 1976.4.14）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和49年(行ツ)第75号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>選挙無効請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集30巻3号223頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>藤林益三（다수. 반대 7）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 정수배분 규정은 위헌. 다만 \u003cstrong>事情判決\u003c/strong>로 선거 무효 청구는 기각하고, 주문에서 선거가 \u003cstrong>위법\u003c/strong>이라고만 선언\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항·15조·44조 단서 투표가치의 평등）· 공선법 204조· 행소법 31조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상\u003c/td>\u003ctd>구 공선법 13조·별표 1·부칙（소50 법률 63호 개정 전）의 중의원 선거구·정수\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>수험에서 「議員定数不均衡訴訟」이라 하면 우선 이 판결. 이후 중의원·참의원에서 같은 프레임이 반복된다. 최고재가 정수배분 규정을 \u003cstrong>위헌\u003c/strong>으로 본 것은 중의원 \u003cstrong>2건\u003c/strong>(昭51·昭60)뿐이고, 선거를 무효로 한 대법정 법정의견은 없다.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>1972.12.10 중의원 총선. 치바현 제1구 선거인들이, 의원 1인당 유권자 수의 최대 격차가 \u003cstrong>4.99 대 1\u003c/strong>에 달해 투표가치의 평등에 반한다고 주장하고, 공선법 204조에 따라 치바현 선관위를 상대로 \u003cstrong>선거 무효\u003c/strong>를 구했다(민중소송).\u003c/p>\n\u003cp>소39년 개정으로 격차를 대략 2배 이하로 줄인 뒤, 인구 이동으로 격차가 커졌는데도 약 \u003cstrong>8년\u003c/strong> 시정되지 않은 채 선거가 실시됐다. 도쿄고재는 합헌으로 청구 기각. 최고재가 원판결을 변경해 위헌·위법 선언.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>14조 등은 \u003cstrong>1인 1표\u003c/strong>뿐 아니라 \u003cstrong>투표가치\u003c/strong>(한 표가 당선에 미치는 영향력)의 평등까지 요구하는가.\u003c/li>\u003cli>격차 4.99 대 1·장기간 미시정의 정수배분 규정은 위헌인가. 위헌이라면 \u003cstrong>규정 전체\u003c/strong>인가, 불평등한 구만인가.\u003c/li>\u003cli>위헌이라면 그 선거는 \u003cstrong>무효\u003c/strong>인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 투표가치의 평등\u003c/h3>\n\u003cp>선거권의 평등은, 각 선거인의 투표가 선거 결과에 미치는 영향력에서도 평등할 것을 포함한다. 형식상 1인 1표여도, 선거구의 선거인수와 정수 비율 때문에 한 표의 효과에 대소가 생기면 투표가치는 평등하지 않다.\u003c/p>\n\u003cp>근거는 14조 1항, 15조 1항·3항, 44조 단서.  \u003cbr>다만 투표가치의 평등은 선거제도를 정할 때 국회가 고려할 \u003cstrong>유일·절대의 기준은 아니다\u003c/strong>. 국회는 공정하고 효과적인 대표를 위해 행정구역·지세 등 다른 사항도 고려할 수 있다. 평등은 그런 정책 목적과 \u003cstrong>조화\u003c/strong>되어 실현돼야 하지만, 재량 행사 시의 고려사항 \u003cstrong>하나에 그치는 것도 아니다\u003c/strong>.\u003c/p>\n\u003ch3>2. 위헌이 되는 때（후의 2단계 심사의 원형）\u003c/h3>\n\u003cp>제정 당시 합헌이던 법률도, 사정 변화로 합헌 요건을 결하면 원칙적으로 위헌의 하자를 띤다. 다만 인구 이동은 끊이지 않고, 구획·정수를 자주 바꾸는 것은 실제적이지도 상당하지도 않다.\u003c/p>\n\u003cp>따라서 격차가 평등의 요구에 반하는 정도에 이르러도 \u003cstrong>곧바로\u003c/strong> 위헌은 아니다. 인구 변동을 고려한 \u003cstrong>합리적 기간 내 시정\u003c/strong>이 헌법상 요구되는데 그것이 이뤄지지 않은 때에 비로소 위헌이다.\u003c/p>\n\u003cp>本件: 평등의 요구에 맞지 않는 상태가 됐는데도 합리적 기간 내 시정이 없었다 → 선거 당시 정수배분 규정은 \u003cstrong>위헌\u003c/strong>.\u003c/p>\n\u003ch3>3. 규정은 불가분의 일체 → 전체 위헌\u003c/h3>\n\u003cp>구획·정수 배분은 총정수와 맞물려 유기적으로 관련되고, 한 부분의 변동이 다른 부분에도 파급된다. 불평등한 구만 위헌이 아니라 \u003cstrong>규정 전체\u003c/strong>가 위헌의 하자를 띤다.\u003c/p>\n\u003ch3>4. 事情判決 — 선거는 무효로 하지 않는다\u003c/h3>\n\u003cp>규정을 당연히 무효로 보고 선거까지 무효로 하면, 당선 의원 전원의 자격이 처음부터 없었던 것이 되어 이미 성립한 법률의 효력에 문제가 생기고, 이후 중의원 활동이 불가능해져 \u003cstrong>헌법이 예정하지 않은 결과\u003c/strong>가 된다.\u003c/p>\n\u003cp>공선법 219조는 선거 관계 소송에 행소법 31조(사정판결)를 \u003cstrong>준용하지 않는다\u003c/strong>. 그래도 31조 1항의 기초에 있는 \u003cstrong>일반적 법의 기본원칙\u003c/strong>에 따라, 무효 청구는 기각하고 주문에서 해당 선거가 \u003cstrong>위법\u003c/strong>이라고 선언한다.\u003c/p>\n\u003cp>주문: 청구 기각. 다만 소47.12.10 중의원 선거의 치바현 제1구 선거는 \u003cstrong>위법\u003c/strong>.\u003c/p>\n\u003ch2>나중에 굳어진 2단계\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>단계\u003c/th>\u003cth>내용\u003c/th>\u003cth>통과 시\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>격차·제도가 투표가치 평등의 요구에 반하는가\u003c/td>\u003ctd>\u003cstrong>위헌상태\u003c/strong>（규정은 아직 위헌이 아님）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>헌법상 요구되는 \u003cstrong>합리적 기간 내 시정\u003c/strong>이 없었는가\u003c/td>\u003ctd>\u003cstrong>규정 위헌\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>위헌이어도 최고재는 사정판결로 선거를 살린다. 「위헌 = 선거 무효」가 오답.\u003c/p>\n\u003cp>고정 배수(중의원 3배·참의원 6배)를 기계적으로 쓰지 않는다. 제도의 구조, 격차의 원인, 국회 시정 노력을 종합한다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>14조는 \u003cstrong>투표가치\u003c/strong>의 평등까지. 「1인 1표면 충분」이 오답.\u003c/li>\u003cli>위헌의 키는 격차 숫자만이 아니라 \u003cstrong>합리적 기간 내 미시정\u003c/strong>. 격차만으로 즉시 위헌이 아니다.\u003c/li>\u003cli>위헌상태 ≠ 위헌 ≠ 선거 무효. 세 층을 구별.\u003c/li>\u003cli>사정판결은 행소법 31조의 \u003cstrong>직접 적용·준용이 아님\u003c/strong>(공선법 219조). 31조의 취지·일반원칙을 원용.\u003c/li>\u003cli>공선법 204조 선거무효소송(민중소송)으로 정수 불균형을 다툴 수 있다. 피고는 선관위.\u003c/li>\u003cli>참의원이라고 평등이 바로 후퇴하는 것은 아니다（最大判平24.10.17）. 다만 반수 개선·도도부현 단위 등 제도적 특색은 고려한다.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cp>\u003cstrong>중의원\u003c/strong>（규정 위헌은 ★）\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판결\u003c/th>\u003cth>선거\u003c/th>\u003cth>최대격차\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>★最大判昭51.4.14 / 民集30巻3号223頁\u003c/td>\u003ctd>소47.12.10\u003c/td>\u003ctd>4.99\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 사정판결·위법 선언\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭58.11.7 / 民集37巻9号1243頁\u003c/td>\u003ctd>소55.6.22\u003c/td>\u003ctd>3.94\u003c/td>\u003ctd>위헌상태. 합리적 기간 미경과 → 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>★最大判昭60.7.17 / 民集39巻5号1100頁\u003c/td>\u003ctd>소58.12.18\u003c/td>\u003ctd>4.40\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 사정판결·위법 선언\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平23.3.23 / 民集65巻2号755頁\u003c/td>\u003ctd>평21.8.30\u003c/td>\u003ctd>2.30\u003c/td>\u003ctd>위헌상태（\u003cstrong>1인별틀 방식\u003c/strong>이 합리성 상실）. 합리적 기간 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平25.11.20 / 民集67巻8号1503頁\u003c/td>\u003ctd>평24.12.16\u003c/td>\u003ctd>2.43\u003c/td>\u003ctd>위헌상태. 합리적 기간 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平27.11.25 / 民集69巻7号2035頁\u003c/td>\u003ctd>평26.12.14\u003c/td>\u003ctd>2.13\u003c/td>\u003ctd>위헌상태. 합리적 기간 부정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>1인별틀: 소선거구 정수 중 도도부현에 먼저 1명씩 배분한 뒤 나머지를 인구 비례. 평24 개정으로 폐지.\u003c/p>\n\u003cp>\u003cstrong>참의원\u003c/strong>\u003c/p>\n\u003cdiv class= 不均衡訴訟（一票の格差） 最大判昭51.4.14 항목 내용 ------ ------ 인용 最大判昭51.4.14 （최고재 대법정 1976.4.14） 사건번호 昭和49年 行ツ 第75号 사건명 選挙無効請求事件 판례집 民集30巻3号223頁 재판장 藤林益三（다수. 반대 7） 결론 위헌 . 정수배분 규정은 위헌. 다만 事情判決 로 선거 무효 청구는 기각하고, 주문에서 선거가 위법 이라고만 선언 과목 헌법（14조 1항·15조·44조 단서 투표가치의 평등）· 공선법 204조· 행소법 31조 대상 구 공선법 13조·별표 1·부칙（소50 법률 63호 개정 전）의 중의원 선거구·정수 수험에서 「議員定数不均衡訴訟」이라 하면 우선 이 판결. 이후 중의원·참의원에서 같은 프레임이 반복된다. 최고재가 정수배분 규정을 위헌 으로 본 것은 중의원 2건 昭51·昭60 뿐이고, 선거를 무효로 한 대법정 법정의견은 없다. 사안 1972.12.10 중의원 총선. 치바현 제1구 선거인들이, 의원 1인당 유권자 수의 최대 격차가 4.99 대 1 에 달해 투표가치의 평등에 반한다고 주장하고, 공선법 204조에 따라 치바현 선관위를 상대로 선거 무효 를 구했다 민중소송 . 소39년 개정으로 격차를 대략 2배 이하로 줄인 뒤, 인구 이동으로 격차가 커졌는데도 약 8년 시정되지 않은 채 선거가 실시됐다. 도쿄고재는 합헌으로 청구 기각. 최고재가 원판결을 변경해 위헌·위법 선언. 쟁점 1. 14조 등은 1인 1표 뿐 아니라 투표가치 한 표가 당선에 미치는 영향력 의 평등까지 요구하는가. 2. 격차 4.99 대 1·장기간 미시정의 정수배분 규정은 위헌인가. 위헌이라면 규정 전체 인가, 불평등한 구만인가. 3. 위헌이라면 그 선거는 무효 인가. 판시 1. 투표가치의 평등 선거권의 평등은, 각 선거인의 투표가 선거 결과에 미치는 영향력에서도 평등할 것을 포함한다. 형식상 1인 1표여도, 선거구의 선거인수와 정수 비율 때문에 한 표의 효과에 대소가 생기면 투표가치는 평등하지 않다. 근거는 14조 1항, 15조 1항·3항, 44조 단서. 다만 투표가치의 평등은 선거제도를 정할 때 국회가 고려할 유일·절대의 기준은 아니다 . 국회는 공정하고 효과적인 대표를 위해 행정구역·지세 등 다른 사항도 고려할 수 있다. 평등은 그런 정책 목적과 조화 되어 실현돼야 하지만, 재량 행사 시의 고려사항 하나에 그치는 것도 아니다 . 2. 위헌이 되는 때（후의 2단계 심사의 원형） 제정 당시 합헌이던 법률도, 사정 변화로 합헌 요건을 결하면 원칙적으로 위헌의 하자를 띤다. 다만 인구 이동은 끊이지 않고, 구획·정수를 자주 바꾸는 것은 실제적이지도 상당하지도 않다. 따라서 격차가 평등의 요구에 반하는 정도에 이르러도 곧바로 위헌은 아니다. 인구 변동을 고려한 합리적 기간 내 시정 이 헌법상 요구되는데 그것이 이뤄지지 않은 때에 비로소 위헌이다. 本件: 평등의 요구에 맞지 않는 상태가 됐는데도 합리적 기간 내 시정이 없었다 → 선거 당시 정수배분 규정은 위헌 . 3. 규정은 불가분의 일체 → 전체 위헌 구획·정수 배분은 총정수와 맞물려 유기적으로 관련되고, 한 부분의 변동이 다른 부분에도 파급된다. 불평등한 구만 위헌이 아니라 규정 전체 가 위헌의 하자를 띤다. 4. 事情判決 — 선거는 무효로 하지 않는다 규정을 당연히 무효로 보고 선거까지 무효로 하면, 당선 의원 전원의 자격이 처음부터 없었던 것이 되어 이미 성립한 법률의 효력에 문제가 생기고, 이후 중의원 활동이 불가능해져 헌법이 예정하지 않은 결과 가 된다. 공선법 219조는 선거 관계 소송에 행소법 31조 사정판결 를 준용하지 않는다 . 그래도 31조 1항의 기초에 있는 일반적 법의 기본원칙 에 따라, 무효 청구는 기각하고 주문에서 해당 선거가 위법 이라고 선언한다. 주문: 청구 기각. 다만 소47.12.10 중의원 선거의 치바현 제1구 선거는 위법 . 나중에 굳어진 2단계 단계 내용 통과 시 ------ ------ --------- 1 격차·제도가 투표가치 평등의 요구에 반하는가 위헌상태 （규정은 아직 위헌이 아님） 2 헌법상 요구되는
