.org/wiki/%E6%97%A7%E5%84%AA%E7%94%9F%E4%BF%9D%E8%AD%B7%E6%B3%95%E5%9B%BD%E5%AE%B6%E8%B3%A0%E5%84%9F%E8%AB%8B%E6%B1%82%E8%A8%B4%E8%A8%9F%E5%88%A4%E6%B1%BA%E6%96%87\" target=\"_blank\" rel=\"noopener\">위키문헌 판결문 令和5(受)1319\u003c/a>\u003c/li>\u003c/ul>","search":"旧優生保護法訴訟（強制不妊訴訟） 最大判令6.7.3 항목 내용 ------ ------ 인용 最大判令6.7.3 （최고재 대법정 2024.7.3） 사건번호 令和5年 受 第1319号（민집 게재. 같은 날 동종 5건） 사건명 国家賠償請求事件 판례집 民集78巻3号382頁 재판장 戸倉三郎（결론 전원일치. 宇賀克也 의견） 결론 위헌 . 우생 규정은 13조·14조 1항 위반. 입법행위는 국배법상 위법. 국의 제척기간 주장은 권리남용. 4건 상고기각·1건 파기 환송 과목 헌법（13조 개인 존엄·신체 침습을 받지 않을 자유, 14조 1항）· 국배법 1조 1항· 구 민법 724조 후단 대상 조문 구 우생보호법 3조 1항 1~3호, 10조, 13조 2항（우생 규정） 전후 13번째 법령위헌 . 국회의원의 입법행위 자체를 국배법상 위법으로 인정한 첫 사례. 별칭은 강제불임소송. 사안 구 우생보호법 1948~1996, 모체보호법으로 개정 은 특정 질병·장애가 있는 자 등을 「불량」한 자손으로 보고, 본인·배우자의 동의 또는 심사에 의해 우생수술 불임수술 을 할 수 있게 했다. 강제 수술 약 1만 5천 명, 「동의」 포함 2만 5천 명 이상. 피해자와 배우자 등이 국배법 1조 1항으로 국가에 배상을 청구. 국은 우생 규정의 위헌성에는 거의 다투지 않고, 구 민법 724조 후단의 제척기간 20년 경과만을 주장했다. 최고재가 대법정에 회부한 5건: 고재에서 원고 승소 4건 + 센다이 패소 1건. 승소 4건은 국 상고기각 배상 확정 , 센다이 건은 파기 환송 배상액 등 심리 . 쟁점 1. 우생 규정이 13조·14조 1항에 위반하는가. 입법 당시부터 인가. 2. 그 입법행위가 국배법 1조 1항의 위법인가. 3. 제척기간 20년이 지나면 청구권은 당연히 소멸하는가. 국의 제척 주장은 허용되는가. 판시 1. 13조·14조 — 입법 당시부터 위헌 13조는 인격적 생존에 관한 중요한 권리로서, 자기 의사에 반해 신체 침습을 받지 않을 자유 를 보장한다. 불임수술은 생식능력 상실이라는 중대한 신체 침습이므로, 정당한 이유 없이 강제하는 것은 13조에 반한다. 우생 규정의 목적은, 특정 장애 등이 있는 자가 불량하다는 평가를 전제로 그 자 또는 일정 친족에게 불임수술을 시켜 같은 질병·장애를 가진 자손의 출생을 막는 데 있다. 입법 당시의 사회 상황을 아무리 감안해도 정당한 목적이 될 수 없고 , 13조가 보장하는 개인 존엄·인격 존중의 정신에 현저히 반한다. 합리성 없는 목적에 기한 차별이므로 14조 1항 에도 위반한다. 본인 동의를 요건으로 하는 유형도, 오로지 우생상 견지에서 특정 개인에게 중대한 희생을 치르게 하는 것이고, 주위의 압력으로 진의에 반하는 동의도 쉽게 상정된다 → 실질적으로 강제. 2. 입법행위 = 국배법상 위법 규정 내용은 국민에게 헌법상 보장된 권리를 위법하게 침해함이 명백 했다. 우생 규정에 관한 국회의원의 입법행위는 국배법 1조 1항의 위법 평가를 받는다. 국의 책임은 극히 중대하다. 3. 제척기간 — 平成元年판결 변경 구 민법 724조 후단 불법행위 시부터 20년 은 제척기간이다. 다만 平成元年판결이 「당사자 주장 없이도 법원이 소멸을 봐야 하고, 신의칙·권리남용 주장은 주장 자체 실당」이라고 한 취지는 변경 한다. - 제척 적용에는 당사자의 주장 이 필요하다. - 제척 경과로 청구권이 소멸한다고 보는 것이 현저히 정의·공평의 이념에 반해 도저히 용인할 수 없는 경우, 그 주장은 신의칙 위반 또는 권리남용 으로 허용되지 않는다. 本件: 국이 48년간 차별 정책을 추진하고, 폐지 후에도 수술은 적법·보상 거부를 유지했으며, 령원 일시금법 320만 엔 도 불충분하다. 제척이 지났다는 이유만으로 배상 책임을 면하는 것은 현저히 정의·공평에 반한다 → 국의 제척 주장은 권리남용 . 시험 포인트 - 13조를 「행복추구」만이 아니라 신체 침습을 받지 않을 자유 로 구성한 점. 14조는 장애 등을 이유로 한 합리적 근거 없는 차별. - 「동의 조항이 있으니 강제가 아니다」는 오답. 실질 강제. - 위헌 + 입법행위 자체 의 국배 위법 재혼금지 사건과 대비: 저기는 입법부작위의 명백성이 부정됨 . - 제척 20년 = 무조건 청구 불가, 가 오답. 정의·공평에 현저히 반하면 제척 주장 이 권리남용. 平元판결 변경. - 현행 민법 724조는 령2 시행 개정으로 제척이 아니라 시효 로 정리됨. 本件은 구법 사안. 후속·관련 판례 관계 ------ ------ 最判平元.12.21 724조 후단 = 제척, 직권 적용. 본 판결이 변경 最大判平17.9.14（재외국민 선거권） 입법부작위 국배 위법의 선례 最大判平27.12.16（재혼금지） 위헌이어도 국배 위법은 별개. 본 건은 입법 당시부터 명백 위헌으로 국배 위법까지 인정 원문·참고 - wikipedia: 旧優生保護法違憲国家賠償請求訴訟 https://ja.wikipedia.org/wiki/%e6%97%a7%e5%84%aa%e7%94%9f%e4%bf%9d%e8%ad%b7%e6%b3%95%e9%81%95%e6%86%b2%e5%9b%bd%e5%ae%b6%e8%b3%a0%e5%84%9f%e8%ab%8b%e6%b1%82%e8%a8%b4%e8%a8%9f - 위키문헌 판결문 令和5 受 1319 https://ja.wikisource.org/wiki/%e6%97%a7%e5%84%aa%e7%94%9f%e4%bf%9d%e8%ad%b7%e6%b3%95%e5%9b%bd%e5%ae%b6%e8%b3%a0%e5%84%9f%e8%ab%8b%e6%b1%82%e8%a8%b4%e8%a8%9f%e5%88%a4%e6%b1%ba%e6%96%87"},"孔子廟訴訟（那覇孔子廟 부지 사용료 면제 사건）":{"type":"case","subject":"헌법","id":"孔子廟訴訟（那覇孔子廟 부지 사용료 면제 사건）","title":"孔子廟訴訟（那覇孔子廟 부지 사용료 면제 사건）","sub":"最大判令3.2.24","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判令3.2.24\u003c/strong>（최고재 대법정 2021.2.24）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>부작위 위법확인 등 청구사건（주민소송）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集75巻2号29頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 공원 사용료 \u003cstrong>전액 면제는 위헌\u003c/strong>(20조 3항 위반)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 3항 정교분리 / 空知太 종합고려 틀）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>沖縄県 那覇市는 시가 관리하는 도시공원(松山公園) 안에, 일반사단법인 久米崇聖会가 설치한 \u003cstrong>공자묘(久米至聖廟)\u003c/strong> 등의 시설에 대해, \u003cstrong>공원 사용료(연간 약 576만 엔) 전액을 면제\u003c/strong>했다.\u003c/p>\n\u003cp>주민이 이 면제는 정교분리 원칙에 반하는 위법한 재산 관리라며, 시장이 사용료를 청구하지 않는 부작위의 위법확인 등을 구하는 주민소송을 제기. 1·2심 모두 위헌 판단 → 숭성회 측 상고.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>공자묘는 종교적 시설인가(유교 시설의 종교성).\u003c/li>\u003cli>시유지 사용료 전액 면제는 20조 3항이 금지하는 종교적 활동에 해당하는가.\u003c/li>\u003cli>판단 틀은 목적효과기준인가, 空知太神社事件의 종합고려인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 판단 틀 — 종합고려(空知太 틀)\u003c/h3>\n\u003cp>국공유지의 무상 제공형 사안이므로, 목적효과기준이 아니라 空知太神社事件의 틀에 따른다. 즉 \u003cstrong>시설의 성격, 면제에 이른 경위, 무상 제공의 태양, 이에 대한 일반인의 평가\u003c/strong> 등 제반 사정을 고려하여, \u003cstrong>사회통념에 비추어 총합적으로\u003c/strong> 판단한다.\u003c/p>\n\u003ch3>2. 시설의 종교성\u003c/h3>\n\u003cp>至聖廟는 공자를 모시는 대성전을 중심으로 한 시설로, 그 외관 등에 비추어 \u003cstrong>신체(神体)에 상당하는 것을 숭경의 대상으로 하는 종교시설\u003c/strong>의 성격을 가진다. 매년 거행되는 \u003cstrong>석전제례(釋奠祭礼)는 공자의 영을 맞이해 제사 지내는 종교적 의의를 갖는 의식\u003c/strong>이며, 관광자원·역사교류의 거점이라는 세속적 의의가 있다고 해도 그 종교성은 부정되지 않는다.\u003c/p>\n\u003ch3>3. 本件 적용\u003c/h3>\n\u003cp>사용료 전액 면제는 숭성회에 연간 수백만 엔 상당의 이익을 주어 그 종교적 활동을 용이하게 하는 것으로, \u003cstrong>일반인의 눈에 시가 특정 종교에 특별한 편익을 제공해 이를 원조한다고 평가\u003c/strong>될 수 있다. 관계가 상당하다고 인정되는 한도를 초과 → \u003cstrong>20조 3항 위반\u003c/strong>. 상고기각(위헌 확정).\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>국공유지 무상제공형 = 空知太 종합고려 틀\u003c/strong>, 의례·지출형 = 목적효과기준 — 판단 틀의 사용 국면 구별이 최대 포인트.\u003c/li>\u003cli>\u003cstrong>유교 시설도 종교시설이 될 수 있다\u003c/strong>는 성격 판단(외관·의식의 실태 기준). 箕面忠魂碑(기념비 → 합헌)와 정반대의 출발점.\u003c/li>\u003cli>空知太(神社·89조 위반) → 孔子廟(20조 3항 위반)로, 조문 구성이 다른 점에도 주의.\u003c/li>\u003cli>세속적 의의(관광자원 등)가 병존해도 종교성이 부정되지 않는다는 판시.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判平22.1.20 / 空知太神社事件\u003c/td>\u003ctd>종합고려 틀의 원조. 시유지 무상 제공은 89조 위반\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭52.7.13 / 津地鎮祭事件\u003c/td>\u003ctd>목적효과기준(의례형)과의 틀 구별\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平5.2.16 / 箕面忠魂碑訴訟\u003c/td>\u003ctd>시설의 성격 판단으로 결론이 갈린 합헌례\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最大判令3.2.24\u003c/a>（「孔子廟」 또는 民集75巻2号29頁로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%AD%94%E5%AD%90%E5%BB%9F%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 孔子廟訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"孔子廟訴訟（那覇孔子廟 부지 사용료 면제 사건） 最大判令3.2.24 항목 내용 ------ ------ 인용 最大判令3.2.24 （최고재 대법정 2021.2.24） 사건명 부작위 위법확인 등 청구사건（주민소송） 판례집 民集75巻2号29頁 결론 상고기각. 공원 사용료 전액 면제는 위헌 20조 3항 위반 과목 헌법（20조 3항 정교분리 / 空知太 종합고려 틀） 사안 沖縄県 那覇市는 시가 관리하는 도시공원 松山公園 안에, 일반사단법인 久米崇聖会가 설치한 공자묘 久米至聖廟 등의 시설에 대해, 공원 사용료 연간 약 576만 엔 전액을 면제 했다. 주민이 이 면제는 정교분리 원칙에 반하는 위법한 재산 관리라며, 시장이 사용료를 청구하지 않는 부작위의 위법확인 등을 구하는 주민소송을 제기. 1·2심 모두 위헌 판단 → 숭성회 측 상고. 쟁점 1. 공자묘는 종교적 시설인가 유교 시설의 종교성 . 2. 시유지 사용료 전액 면제는 20조 3항이 금지하는 종교적 활동에 해당하는가. 3. 판단 틀은 목적효과기준인가, 空知太神社事件의 종합고려인가. 판시 1. 판단 틀 — 종합고려 空知太 틀 국공유지의 무상 제공형 사안이므로, 목적효과기준이 아니라 空知太神社事件의 틀에 따른다. 즉 시설의 성격, 면제에 이른 경위, 무상 제공의 태양, 이에 대한 일반인의 평가 등 제반 사정을 고려하여, 사회통념에 비추어 총합적으로 판단한다. 2. 시설의 종교성 至聖廟는 공자를 모시는 대성전을 중심으로 한 시설로, 그 외관 등에 비추어 신체 神体 에 상당하는 것을 숭경의 대상으로 하는 종교시설 의 성격을 가진다. 매년 거행되는 석전제례 釋奠祭礼 는 공자의 영을 맞이해 제사 지내는 종교적 의의를 갖는 의식 이며, 관광자원·역사교류의 거점이라는 세속적 의의가 있다고 해도 그 종교성은 부정되지 않는다. 3. 本件 적용 사용료 전액 면제는 숭성회에 연간 수백만 엔 상당의 이익을 주어 그 종교적 활동을 용이하게 하는 것으로, 일반인의 눈에 시가 특정 종교에 특별한 편익을 제공해 이를 원조한다고 평가 될 수 있다. 관계가 상당하다고 인정되는 한도를 초과 → 20조 3항 위반 . 상고기각 위헌 확정 . 시험 포인트 - 국공유지 무상제공형 = 空知太 종합고려 틀 , 의례·지출형 = 목적효과기준 — 판단 틀의 사용 국면 구별이 최대 포인트. - 유교 시설도 종교시설이 될 수 있다 는 성격 판단 외관·의식의 실태 기준 . 箕面忠魂碑 기념비 → 합헌 와 정반대의 출발점. - 空知太 神社·89조 위반 → 孔子廟 20조 3항 위반 로, 조문 구성이 다른 점에도 주의. - 세속적 의의 관광자원 등 가 병존해도 종교성이 부정되지 않는다는 판시. 후속·관련 판례 관계 ------ ------ 最大判平22.1.20 / 空知太神社事件 종합고려 틀의 원조. 시유지 무상 제공은 89조 위반 最大判昭52.7.13 / 津地鎮祭事件 목적효과기준 의례형 과의 틀 구별 最判平5.2.16 / 箕面忠魂碑訴訟 시설의 성격 판단으로 결론이 갈린 합헌례 원문·참고 - 裁判所 판례검색: 最大判令3.2.24 https://www.courts.go.jp/app/hanrei_jp/search1 （「孔子廟」 또는 民集75巻2号29頁로 검색） - wikipedia: 孔子廟訴訟 https://ja.wikipedia.org/wiki/%e5%ad%94%e5%ad%90%e5%bb%9f%e8%a8%b4%e8%a8%9f"},"江沢民講演会事件（早稲田大学名簿提出）":{"type":"case","subject":"헌법","id":"江沢民講演会事件（早稲田大学名簿提出）","title":"江沢民講演会事件（早稲田大学名簿提出）","sub":"最判平15.9.12","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最判平15.9.12\u003c/strong>（최고재 제2소법정 2003.9.12）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成14年(受)第1656号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>損害賠償等請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集57巻8号973頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>일부 파기 환송. 동의 없는 경찰 제출은 프라이버시 침해·불법행위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（13조 프라이버시）· 민법 709조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보충\u003c/td>\u003ctd>亀山継夫·梶谷玄 반대의견(사회통념상 허용 한도를 일탈했다고까지는 볼 수 없다)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>1998년 와세다대가 중국 국가주석 장쩌민 강연회를 개최. 선착순 모집으로 학부 사무소 등의 명부에 \u003cstrong>학번·성명·주소·전화번호\u003c/strong>를 기입하게 했다.\u003c/p>\n\u003cp>대학은 경비 경찰의 요청에 응해, 본인 동의 없이 명부 사본을 경시청 도쓰카서에 제출했다.\u003c/p>\n\u003cp>상고인들은 강연회에 참석했다가 연설 중 「중국의 핵군비 확장 반대」 등을 외쳐 연행·현행범 체포되고, 대학으로부터 견책도 받았다. 명부 무단 제출이 프라이버시 침해라며 손해배상을 청구.\u003c/p>\n\u003cp>원심은 비닉성·구체적 불이익의 부재·개시 목적의 정당성 등을 들어 불법행위를 부정. 최고재가 그 부분을 파기 환송.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>학번·성명·주소·전화번호처럼 \u003cstrong>단순한 식별정보\u003c/strong>도 프라이버시로서 법적 보호의 대상인가.\u003c/li>\u003cli>주최 대학이 동의 없이 경찰에 제출한 것이 불법행위인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 단순한 정보라도 보호 대상\u003c/h3>\n\u003cp>학번·성명·주소·전화번호는 대학이 개인식별을 하기 위한 \u003cstrong>단순한 정보\u003c/strong>이며, 그 한에서는 비닉 필요성이 반드시 높지 않다. 강연회 참가 신청자라는 사실도 마찬가지다.\u003c/p>\n\u003cp>그러나 본인이 \u003cstrong>원하지 않는 타인에게 함부로 개시되고 싶지 않다\u003c/strong>고 생각하는 것은 자연스럽고, 그 \u003cstrong>기대는 보호\u003c/strong>되어야 한다. 따라서 本件 개인정보는 프라이버시에 속하는 정보로서 \u003cstrong>법적 보호의 대상\u003c/strong>이다.\u003c/p>\n\u003ch3>2. 무단 개시 = 불법행위\u003c/h3>\n\u003cp>이런 정보는 취급 방법에 따라 인격적 권리이익을 해칠 수 있으므로 신중히 다루어야 한다. 수집한 대학은 본인 의사에 의하지 않고 함부로 타인에게 개시해서는 안 된다.\u003c/p>\n\u003cp>경찰에 낼 것을 \u003cstrong>미리 명시한 뒤\u003c/strong> 명부에 기입하게 하는 등 승낙을 받는 것은 \u003cstrong>용이\u003c/strong>했고, 그것이 곤란했던 특별한 사정도 없다. 동의 절차 없이 무단 제출한 행위는, 임의로 제공한 정보의 \u003cstrong>적절한 관리에 대한 합리적 기대를 배신\u003c/strong>하는 것으로 프라이버시 침해·불법행위다.\u003c/p>\n\u003cp>원심이 든 비닉성의 정도, 구체적 불이익의 부존재, 개시 목적의 정당성·필요성 등은 \u003cstrong>이 결론을 좌우하기에 부족\u003c/strong>하다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>「민감하지 않은 정보 = 보호 없음」이 아니다. \u003cstrong>개시 기대를 배신했는지\u003c/strong>가 핵심.\u003c/li>\u003cli>경비 목적이 정당해도, \u003cstrong>사전에 동의를 받기 쉬웠다면\u003c/strong> 무단 제출은 위법.\u003c/li>\u003cli>京都府学連·指紋押捺는 국가 vs 개인. 本件은 \u003cstrong>사립대학(私人) vs 학생\u003c/strong>.\u003c/li>\u003cli>반대의견이 있으므로, 「단순 정보·사회통념」으로 위법을 부정하는 지문은 함정.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/162-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E6%97%A9%E7%A8%B2%E7%94%B0%E5%A4%A7%E5%AD%A6%E6%B1%9F%E6%B2%A2%E6%B0%91%E8%AC%9B%E6%BC%94%E4%BC%9A%E5%90%8D%E7%B0%BF%E6%8F%90%E5%87%BA%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b315-9-12/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"江沢民講演会事件（早稲田大学名簿提出） 最判平15.9.12 항목 내용 ------ ------ 인용 最判平15.9.12 （최고재 제2소법정 2003.9.12） 사건번호 平成14年 受 第1656号 사건명 損害賠償等請求事件 판례집 民集57巻8号973頁 결론 일부 파기 환송. 동의 없는 경찰 제출은 프라이버시 침해·불법행위 과목 헌법（13조 프라이버시）· 민법 709조 보충 亀山継夫·梶谷玄 반대의견 사회통념상 허용 한도를 일탈했다고까지는 볼 수 없다 사안 1998년 와세다대가 중국 국가주석 장쩌민 강연회를 개최. 선착순 모집으로 학부 사무소 등의 명부에 학번·성명·주소·전화번호 를 기입하게 했다. 대학은 경비 경찰의 요청에 응해, 본인 동의 없이 명부 사본을 경시청 도쓰카서에 제출했다. 상고인들은 강연회에 참석했다가 연설 중 「중국의 핵군비 확장 반대」 등을 외쳐 연행·현행범 체포되고, 대학으로부터 견책도 받았다. 명부 무단 제출이 프라이버시 침해라며 손해배상을 청구. 원심은 비닉성·구체적 불이익의 부재·개시 목적의 정당성 등을 들어 불법행위를 부정. 최고재가 그 부분을 파기 환송. 쟁점 1. 학번·성명·주소·전화번호처럼 단순한 식별정보 도 프라이버시로서 법적 보호의 대상인가. 2. 주최 대학이 동의 없이 경찰에 제출한 것이 불법행위인가. 판시 1. 단순한 정보라도 보호 대상 학번·성명·주소·전화번호는 대학이 개인식별을 하기 위한 단순한 정보 이며, 그 한에서는 비닉 필요성이 반드시 높지 않다. 강연회 참가 신청자라는 사실도 마찬가지다. 그러나 본인이 원하지 않는 타인에게 함부로 개시되고 싶지 않다 고 생각하는 것은 자연스럽고, 그 기대는 보호 되어야 한다. 따라서 本件 개인정보는 프라이버시에 속하는 정보로서 법적 보호의 대상 이다. 2. 무단 개시 = 불법행위 이런 정보는 취급 방법에 따라 인격적 권리이익을 해칠 수 있으므로 신중히 다루어야 한다. 수집한 대학은 본인 의사에 의하지 않고 함부로 타인에게 개시해서는 안 된다. 경찰에 낼 것을 미리 명시한 뒤 명부에 기입하게 하는 등 승낙을 받는 것은 용이 했고, 그것이 곤란했던 특별한 사정도 없다. 동의 절차 없이 무단 제출한 행위는, 임의로 제공한 정보의 적절한 관리에 대한 합리적 기대를 배신 하는 것으로 프라이버시 침해·불법행위다. 원심이 든 비닉성의 정도, 구체적 불이익의 부존재, 개시 목적의 정당성·필요성 등은 이 결론을 좌우하기에 부족 하다. 시험 포인트 - 「민감하지 않은 정보 = 보호 없음」이 아니다. 개시 기대를 배신했는지 가 핵심. - 경비 목적이 정당해도, 사전에 동의를 받기 쉬웠다면 무단 제출은 위법. - 京都府学連·指紋押捺는 국가 vs 개인. 本件은 사립대학 私人 vs 학생 . - 반대의견이 있으므로, 「단순 정보·사회통념」으로 위법을 부정하는 지문은 함정. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/162-3.html - wikipedia https://ja.wikipedia.org/wiki/%e6%97%a9%e7%a8%b2%e7%94%b0%e5%a4%a7%e5%ad%a6%e6%b1%9f%e6%b2%a2%e6%b0%91%e8%ac%9b%e6%bc%94%e4%bc%9a%e5%90%8d%e7%b0%bf%e6%8f%90%e5%87%ba%e4%ba%8b%e4%bb%b6 - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b315-9-12/"},"指紋押捺拒否訴訟（外国人指紋押捺拒否事件）":{"type":"case","subject":"헌법","id":"指紋押捺拒否訴訟（外国人指紋押捺拒否事件）","title":"指紋押捺拒否訴訟（外国人指紋押捺拒否事件）","sub":"最判平7.12.15","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最判平7.12.15\u003c/strong>（최고재 제3소법정 1995.12.15）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成2年(あ)第848号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>外国人登録法違反\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>刑集49巻10号842頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 제도는 합헌（13조·14조·19조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（13조 지문 강제당하지 않을 자유, 14조 평등, 19조 사상·양심）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 외등법(昭57 법률 75호 개정 전) 14조 1항, 18조 1항 8호\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>구 외국인등록법이 재류 외국인에게 등록원표 등에 \u003cstrong>지문 날인\u003c/strong>을 의무 지우고, 거부하면 벌칙을 두었다. 거부자가 외등법 위반으로 기소되어, 제도가 헌법 13조(사생활)·14조(평등)·19조(사상·양심)에 위반한다고 다투었다.\u003c/p>\n\u003cp>전원일치로 합헌. 이 제도는 평11 외등법 개정으로 폐지되고, 평24에는 외등법 자체가 폐지됐다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>함부로 지문 날인을 강제당하지 않을 자유가 13조상 인정되는가. 재류 외국인에게도 미치는가.\u003c/li>\u003cli>당시 외등법상 지문 제도는 13조에 위반하는가.\u003c/li>\u003cli>일본인에게는 없는 의무이므로 14조 위반인가.\u003c/li>\u003cli>19조 위반인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 지문과 13조（자유는 인정）\u003c/h3>\n\u003cp>지문은 \u003cstrong>만인부동·종신불변\u003c/strong>이므로, 채취된 지문의 이용 방법에 따라 사생활·프라이버시가 침해될 위험이 있다.\u003c/p>\n\u003cp>13조는 국민의 사생활상 자유를 국가권력에 대해 보호한다. 그 하나로 \u003cstrong>누구든지 함부로 지문 날인을 강제당하지 않을 자유\u003c/strong>가 있다. 국가기관이 정당한 이유 없이 강제하는 것은 13조 취지에 반한다.\u003c/p>\n\u003cp>이 보장의 \u003cstrong>재류 외국인에게도 똑같이 미친다.\u003c/strong>\u003c/p>\n\u003ch3>2. 그러나 제도는 합헌\u003c/h3>\n\u003cp>이 자유도 공공의 복지상 상당한 제한을 받는다(13조). 당시 제도는\u003c/p>\n\u003cul>\u003cli>\u003cstrong>입법목적\u003c/strong>에 충분한 합리성(호적 없는 외국인의 인물 특정)\u003c/li>\u003cli>\u003cstrong>필요성\u003c/strong> 긍정\u003c/li>\u003cli>\u003cstrong>방법\u003c/strong>도 일반적으로 허용되는 한도를 넘지 않는 상당성\u003c/li>\u003c/ul>\n\u003cp>이 있어 13조에 위반하지 않는다. 당시 내용은 3년에 한 번, 한 손가락, 벌칙에 의한 간접강제에 그쳐 정신·육체적으로 과도한 고통까지는 아니라고 봤다. (京都府学連 最大判昭44.12.24 등의 취지에 따른다)\u003c/p>\n\u003ch3>3. 14조·19조\u003c/h3>\n\u003cp>호적 제도가 없는 외국인과 일본인 사이에는 \u003cstrong>사회적 사실관계상의 차이\u003c/strong>가 있어, 취급의 차이에 합리적 근거가 있다 → 14조 1항 위반 아님.\u003c/p>\n\u003cp>사상·양심의 자유를 해한다고 인정되지 않는다 → 19조 위반 아님.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>京都府学連과 \u003cstrong>같은 구조\u003c/strong>: 자유를 먼저 인정하고, 本件 제도·행위는 합헌·적법.\u003c/li>\u003cli>「외국인에게 13조가 미치지 않는다」는 오답. \u003cstrong>자유는 미치고, 제한이 합헌\u003c/strong>이다.\u003c/li>\u003cli>14조는 「차별 자체 위헌」이 아니라 \u003cstrong>합리적 근거(호적 유무)\u003c/strong>로 합헌.\u003c/li>\u003cli>현행법이 아니라 \u003cstrong>구 외등법\u003c/strong> 사안. 제도는 이미 폐지.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%A4%96%E5%9B%BD%E4%BA%BA%E6%8C%87%E7%B4%8B%E6%8A%BC%E6%8D%BA%E6%8B%92%E5%90%A6%E4%BA%8B%E4%BB%B6\" target=\"_blank\" rel=\"noopener\">Wikipedia: 外国人指紋押捺拒否事件\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b37-12-15%ef%bc%9a%e6%8c%87%e7%b4%8b%e6%8a%bc%e6%8d%ba%e6%8b%92%e5%90%a6%e4%ba%8b%e4%bb%b6/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"指紋押捺拒否訴訟（外国人指紋押捺拒否事件） 最判平7.12.15 항목 내용 ------ ------ 인용 最判平7.12.15 （최고재 제3소법정 1995.12.15） 사건번호 平成2年 あ 第848号 사건명 外国人登録法違反 판례집 刑集49巻10号842頁 결론 상고기각. 제도는 합헌（13조·14조·19조） 과목 헌법（13조 지문 강제당하지 않을 자유, 14조 평등, 19조 사상·양심） 대상 조문 구 외등법 昭57 법률 75호 개정 전 14조 1항, 18조 1항 8호 사안 구 외국인등록법이 재류 외국인에게 등록원표 등에 지문 날인 을 의무 지우고, 거부하면 벌칙을 두었다. 거부자가 외등법 위반으로 기소되어, 제도가 헌법 13조 사생활 ·14조 평등 ·19조 사상·양심 에 위반한다고 다투었다. 전원일치로 합헌. 이 제도는 평11 외등법 개정으로 폐지되고, 평24에는 외등법 자체가 폐지됐다. 쟁점 1. 함부로 지문 날인을 강제당하지 않을 자유가 13조상 인정되는가. 재류 외국인에게도 미치는가. 2. 당시 외등법상 지문 제도는 13조에 위반하는가. 3. 일본인에게는 없는 의무이므로 14조 위반인가. 4. 19조 위반인가. 판시 1. 지문과 13조（자유는 인정） 지문은 만인부동·종신불변 이므로, 채취된 지문의 이용 방법에 따라 사생활·프라이버시가 침해될 위험이 있다. 13조는 국민의 사생활상 자유를 국가권력에 대해 보호한다. 그 하나로 누구든지 함부로 지문 날인을 강제당하지 않을 자유 가 있다. 국가기관이 정당한 이유 없이 강제하는 것은 13조 취지에 반한다. 이 보장의 재류 외국인에게도 똑같이 미친다. 2. 그러나 제도는 합헌 이 자유도 공공의 복지상 상당한 제한을 받는다 13조 . 당시 제도는 - 입법목적 에 충분한 합리성 호적 없는 외국인의 인물 특정 - 필요성 긍정 - 방법 도 일반적으로 허용되는 한도를 넘지 않는 상당성 이 있어 13조에 위반하지 않는다. 당시 내용은 3년에 한 번, 한 손가락, 벌칙에 의한 간접강제에 그쳐 정신·육체적으로 과도한 고통까지는 아니라고 봤다. 京都府学連 最大判昭44.12.24 등의 취지에 따른다 3. 14조·19조 호적 제도가 없는 외국인과 일본인 사이에는 사회적 사실관계상의 차이 가 있어, 취급의 차이에 합리적 근거가 있다 → 14조 1항 위반 아님. 사상·양심의 자유를 해한다고 인정되지 않는다 → 19조 위반 아님. 시험 포인트 - 京都府学連과 같은 구조 : 자유를 먼저 인정하고, 本件 제도·행위는 합헌·적법. - 「외국인에게 13조가 미치지 않는다」는 오답. 자유는 미치고, 제한이 합헌 이다. - 14조는 「차별 자체 위헌」이 아니라 합리적 근거 호적 유무 로 합헌. - 현행법이 아니라 구 외등법 사안. 제도는 이미 폐지. 원문·참고 - wikipedia: 外国人指紋押捺拒否事件 https://ja.wikipedia.org/wiki/%e5%a4%96%e5%9b%bd%e4%ba%ba%e6%8c%87%e7%b4%8b%e6%8a%bc%e6%8d%ba%e6%8b%92%e5%90%a6%e4%ba%8b%e4%bb%b6 - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%88%a4%e5%b9%b37-12-15%ef%bc%9a%e6%8c%87%e7%b4%8b%e6%8a%bc%e6%8d%ba%e6%8b%92%e5%90%a6%e4%ba%8b%e4%bb%b6/"},"宗教法人解散命令事件（オウム真理教 해산명령）":{"type":"case","subject":"헌법","id":"宗教法人解散命令事件（オウム真理教 해산명령）","title":"宗教法人解散命令事件（オウム真理教 해산명령）","sub":"最一小決平8.1.30","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最一小決平8.1.30\u003c/strong>（최고재 제1소법정 결정 1996.1.30）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成7年(ク)第333号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>宗教法人解散命令에 대한 특별항고 사건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集50巻1号199頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>특별항고 기각. 해산명령은 헌법 20조 1항에 위반하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 신교의 자유 / 종교법인법 81조）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>종교법인 オウム真理教는 대표자·간부들이 \u003cstrong>대량살인을 목적으로 계획적·조직적으로 사린(サリン)을 생성\u003c/strong>했다(1994~95년 일련의 사건의 배경).\u003c/p>\n\u003cp>검찰관과 도쿄도지사는 \u003cstrong>종교법인법 81조 1항 1호\u003c/strong>(법령에 위반하여 현저히 공공의 복지를 해한다고 명백히 인정되는 행위)·\u003cstrong>2호 전단\u003c/strong>(종교단체의 목적을 현저히 일탈한 행위)에 해당한다며 해산명령을 청구. 도쿄지재가 해산을 명하고(平7.10.30), 도쿄고재가 항고를 기각하자, 법인 측이 \u003cstrong>신교의 자유(헌법 20조 1항) 침해\u003c/strong>를 주장하며 특별항고했다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>종교법인에 대한 해산명령 제도는 신자의 신교의 자유를 침해하는가.\u003c/li>\u003cli>해산명령의 헌법적합성은 어떤 틀로 판단하는가.\u003c/li>\u003cli>本件 해산명령은 헌법 20조 1항에 위반하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 해산명령 제도의 성격 — 세속적 측면만을 대상\u003c/h3>\n\u003cp>종교법인법상 해산명령 제도는 \u003cstrong>오로지 종교법인의 세속적 측면\u003c/strong>(재산 관리 등 법률관계의 주체가 되는 법인격)을 대상으로 하며, 종교단체나 신자의 \u003cstrong>정신적·종교적 측면에 개입할 의도가 아니다\u003c/strong>.\u003c/p>\n\u003cp>해산명령이 내려져도:\u003c/p>\n\u003cul>\u003cli>신자는 법인격 없는 \u003cstrong>종교단체를 존속\u003c/strong>시키거나 \u003cstrong>새로 결성\u003c/strong>할 수 있다.\u003c/li>\u003cli>해산명령은 \u003cstrong>종교적 행위 자체를 금지·제한하는 법적 효과를 일절 수반하지 않는다\u003c/strong>.\u003c/li>\u003c/ul>\n\u003ch3>2. 판단 틀 — 간접적·사실상의 지장과 신중한 심사\u003c/h3>\n\u003cp>다만 해산으로 법인 재산이 청산되면, 예배시설 등을 잃어 신자의 종교적 행위 계속에 \u003cstrong>어떠한 지장\u003c/strong>이 생길 수 있다. 신교의 자유의 중요성에 비추어, 이러한 규제가 헌법상 허용되는지는 \u003cstrong>신중하게 음미\u003c/strong>해야 한다.\u003c/p>\n\u003ch3>3. 本件 적용\u003c/h3>\n\u003cul>\u003cli>本件 행위는 대량살인 목적의 계획적·조직적 사린 생성으로, 법령 위반·현저한 공공복지 침해·목적의 현저한 일탈에 해당함이 명백하다.\u003c/li>\u003cli>이에 대처하기 위해 법인을 해산시키는 것은 \u003cstrong>필요하고 적절\u003c/strong>하다.\u003c/li>\u003cli>해산으로 신자들이 받는 지장은 \u003cstrong>간접적이고 사실상의 것\u003c/strong>에 그친다.\u003c/li>\u003c/ul>\n\u003cp>→ 해산명령은 헌법 20조 1항에 위배되지 않는다. 특별항고 기각.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조: \u003cstrong>세속적 측면(법인격) vs 정신적·종교적 측면\u003c/strong>의 구별이 핵심. 해산 = 법인격 박탈일 뿐, 신앙·종교활동 자체의 금지가 아니다.\u003c/li>\u003cli>제약의 성질: 종교적 행위에 대한 \u003cstrong>「간접적이고 사실상의 지장」\u003c/strong> — 직접적·법적 제약이 아니므로 합헌 판단으로 이어진다. 다만 「신중하게 음미」한다는 심사 태도를 함께 암기.\u003c/li>\u003cli>비교판단(필요성·적절성 + 지장의 간접성)의 형량 구조는 エホバの証人剣道拒否事件과 함께 신교의 자유 분야의 대표 출제 포인트.\u003c/li>\u003cli>결정(決定)이라는 형식 주의 — 비송사건의 특별항고에 대한 판단이다.\u003c/li>\u003cli>현대적 논점: 旧統一教会 해산명령 청구(2023) 이후, 81조 1항 1호의 「법령 위반」에 \u003cstrong>민법상 불법행위가 포함되는지\u003c/strong>가 다투어졌고, 東京地裁 令7.3.25는 포함을 긍정하며 해산을 명했다(본 결정의 틀을 전제로 전개).\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭38.5.15 / 加持祈祷事件\u003c/td>\u003ctd>종교적 행위라도 타인의 생명·신체를 해하면 신교의 자유의 한계를 벗어남(상해치사 유죄)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平8.3.8 / エホバの証人剣道拒否事件\u003c/td>\u003ctd>신앙을 이유로 한 검도 거부 학생에 대한 퇴학처분은 재량권 일탈·남용으로 위법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭52.7.13 / 津地鎮祭事件\u003c/td>\u003ctd>정교분리(20조 3항)·목적효과기준 — 신교의 자유와는 별도 축\u003c/td>\u003c/tr>\u003ctr>\u003ctd>東京地裁 令7.3.25（旧統一教会）\u003c/td>\u003ctd>민법상 불법행위도 81조 1항 1호의 「법령 위반」에 포함된다며 해산명령\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最一小決平8.1.30\u003c/a>（사건번호 平成7(ク)333으로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%AE%97%E6%95%99%E6%B3%95%E4%BA%BA%E6%B3%95\" target=\"_blank\" rel=\"noopener\">Wikipedia: 宗教法人法\u003c/a>\u003c/li>\u003c/ul>","search":"宗教法人解散命令事件（オウム真理教 해산명령） 最一小決平8.1.30 항목 내용 ------ ------ 인용 最一小決平8.1.30 （최고재 제1소법정 결정 1996.1.30） 사건번호 平成7年 ク 第333号 사건명 宗教法人解散命令에 대한 특별항고 사건 판례집 民集50巻1号199頁 결론 특별항고 기각. 해산명령은 헌법 20조 1항에 위반하지 않음 과목 헌법（20조 신교의 자유 / 종교법인법 81조） 사안 종교법인 オウム真理教는 대표자·간부들이 대량살인을 목적으로 계획적·조직적으로 사린 サリン 을 생성 했다 1994~95년 일련의 사건의 배경 . 검찰관과 도쿄도지사는 종교법인법 81조 1항 1호 법령에 위반하여 현저히 공공의 복지를 해한다고 명백히 인정되는 행위 · 2호 전단 종교단체의 목적을 현저히 일탈한 행위 에 해당한다며 해산명령을 청구. 도쿄지재가 해산을 명하고 平7.10.30 , 도쿄고재가 항고를 기각하자, 법인 측이 신교의 자유 헌법 20조 1항 침해 를 주장하며 특별항고했다. 쟁점 1. 종교법인에 대한 해산명령 제도는 신자의 신교의 자유를 침해하는가. 2. 해산명령의 헌법적합성은 어떤 틀로 판단하는가. 3. 本件 해산명령은 헌법 20조 1항에 위반하는가. 판시 1. 해산명령 제도의 성격 — 세속적 측면만을 대상 종교법인법상 해산명령 제도는 오로지 종교법인의 세속적 측면 재산 관리 등 법률관계의 주체가 되는 법인격 을 대상으로 하며, 종교단체나 신자의 정신적·종교적 측면에 개입할 의도가 아니다 . 해산명령이 내려져도: - 신자는 법인격 없는 종교단체를 존속 시키거나 새로 결성 할 수 있다. - 해산명령은 종교적 행위 자체를 금지·제한하는 법적 효과를 일절 수반하지 않는다 . 2. 판단 틀 — 간접적·사실상의 지장과 신중한 심사 다만 해산으로 법인 재산이 청산되면, 예배시설 등을 잃어 신자의 종교적 행위 계속에 어떠한 지장 이 생길 수 있다. 신교의 자유의 중요성에 비추어, 이러한 규제가 헌법상 허용되는지는 신중하게 음미 해야 한다. 3. 本件 적용 - 本件 행위는 대량살인 목적의 계획적·조직적 사린 생성으로, 법령 위반·현저한 공공복지 침해·목적의 현저한 일탈에 해당함이 명백하다. - 이에 대처하기 위해 법인을 해산시키는 것은 필요하고 적절 하다. - 해산으로 신자들이 받는 지장은 간접적이고 사실상의 것 에 그친다. → 해산명령은 헌법 20조 1항에 위배되지 않는다. 특별항고 기각. 시험 포인트 - 구조: 세속적 측면 법인격 vs 정신적·종교적 측면 의 구별이 핵심. 해산 = 법인격 박탈일 뿐, 신앙·종교활동 자체의 금지가 아니다. - 제약의 성질: 종교적 행위에 대한 「간접적이고 사실상의 지장」 — 직접적·법적 제약이 아니므로 합헌 판단으로 이어진다. 다만 「신중하게 음미」한다는 심사 태도를 함께 암기. - 비교판단 필요성·적절성 + 지장의 간접성 의 형량 구조는 エホバの証人剣道拒否事件과 함께 신교의 자유 분야의 대표 출제 포인트. - 결정 決定 이라는 형식 주의 — 비송사건의 특별항고에 대한 판단이다. - 현대적 논점: 旧統一教会 해산명령 청구 2023 이후, 81조 1항 1호의 「법령 위반」에 민법상 불법행위가 포함되는지 가 다투어졌고, 東京地裁 令7.3.25는 포함을 긍정하며 해산을 명했다 본 결정의 틀을 전제로 전개 . 후속·관련 판례 관계 ------ ------ 最大判昭38.5.15 / 加持祈祷事件 종교적 행위라도 타인의 생명·신체를 해하면 신교의 자유의 한계를 벗어남 상해치사 유죄 最判平8.3.8 / エホバの証人剣道拒否事件 신앙을 이유로 한 검도 거부 학생에 대한 퇴학처분은 재량권 일탈·남용으로 위법 最大判昭52.7.13 / 津地鎮祭事件 정교분리 20조 3항 ·목적효과기준 — 신교의 자유와는 별도 축 東京地裁 令7.3.25（旧統一教会） 민법상 불법행위도 81조 1항 1호의 「법령 위반」에 포함된다며 해산명령 원문·참고 - 裁判所 판례검색: 最一小決平8.1.30 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 平成7 ク 333으로 검색） - wikipedia: 宗教法人法 https://ja.wikipedia.org/wiki/%e5%ae%97%e6%95%99%e6%b3%95%e4%ba%ba%e6%b3%95"},"殉職自衛官合祀拒否訴訟（自衛官合祀事件）":{"type":"case","subject":"헌법","id":"殉職自衛官合祀拒否訴訟（自衛官合祀事件）","title":"殉職自衛官合祀拒否訴訟（自衛官合祀事件）","sub":"最大判昭63.6.1","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭63.6.1\u003c/strong>（최고재 대법정 1988.6.1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和57年(オ)第902号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>손해배상 청구사건\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集42巻5号277頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>원판결 파기·자판(청구기각). 위헌·불법행위 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 신교의 자유·정교분리 / 종교상 인격권·관용）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>순직한 자위관의 처 X(기독교 신자)는, 남편이 \u003cstrong>山口県 隊友会\u003c/strong>(자위대 협력단체)의 신청으로 \u003cstrong>현 호국신사(県護国神社)에 합사(合祀)\u003c/strong>된 것에 대해, 자신의 종교적 신념에 반해 남편이 신사에 모셔졌다며, 국가와 隊友会를 상대로 위자료를 청구했다(합사 신청 과정에서 \u003cstrong>자위대 지방연락부 직원이 협력\u003c/strong>한 점을 문제 삼음).\u003c/p>\n\u003cp>1·2심은 종교상 인격권 침해를 인정해 청구를 인용 → 국가 측 상고.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>합사 신청에 대한 자위대 직원의 협력행위는 20조 3항의 「종교적 활동」인가.\u003c/li>\u003cli>「정온한 종교적 환경 아래에서 신앙생활을 보낼 이익」(종교상 인격권)은 법적으로 보호되는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 직원의 협력행위 — 종교적 활동 아님\u003c/h3>\n\u003cp>합사 신청은 어디까지나 \u003cstrong>隊友会의 단독 행위\u003c/strong>이고, 지방연락부 직원의 협력은 간접적인 것이었다. 그 \u003cstrong>의도·목적은 자위관의 사기 고양 등 세속적\u003c/strong>인 것이며, 특정 종교에 대한 원조·조장 또는 압박·간섭의 효과를 갖지 않는다 → 목적효과기준에 비추어 종교적 활동에 해당하지 않는다.\u003c/p>\n\u003ch3>2. 종교상 인격권 — 법적 이익성 부정, 「관용」\u003c/h3>\n\u003cp>신교의 자유의 보장은, \u003cstrong>타인의 신앙에 근거한 행위\u003c/strong>에 의해 자기의 신앙생활이 방해받았다 해도, 그것이 \u003cstrong>강제나 불이익 부여를 수반하지 않는 한, 이를 수인해야 하며 「관용(寛容)」이 요구된다\u003c/strong>.\u003c/p>\n\u003cp>합사는 신사(호국신사) 측의 \u003cstrong>신교의 자유에 의한 행위\u003c/strong>이고, X에게 신앙을 강제하거나 불이익을 준 것이 아니다. 「정온한 종교적 환경 아래에서 신앙생활을 보낼 이익」을 곧바로 \u003cstrong>법적 이익으로 인정할 수 없다\u003c/strong>.\u003c/p>\n\u003cp>→ 불법행위 불성립. 파기·자판, 청구기각.\u003c/p>\n\u003ch3>반대의견\u003c/h3>\n\u003cp>伊藤正己 재판관의 반대의견 — 소수자의 종교적 인격권 보호를 중시해 원심 유지를 주장했다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「관용」의 법리\u003c/strong>가 최대 포인트: 사인(신사·타인)의 신앙에 근거한 행위로 인한 불쾌·고통은, \u003cstrong>강제·불이익이 없는 한 수인\u003c/strong> — 종교상 인격권(정온한 종교적 환경에서의 신앙생활의 이익)의 법적 이익성 부정.\u003c/li>\u003cli>국가 행위 축은 목적효과기준으로 처리(직원 협력 = 세속적 목적 → 종교적 활동 아님). \u003cstrong>두 축(국가의 정교분리 / 사인 간 이익형량)\u003c/strong>을 구별해 답하는 것이 핵심.\u003c/li>\u003cli>소수자 보호 관점에서의 비판이 강한 판례 — 伊藤正己 반대의견과 세트로 출제된다.\u003c/li>\u003cli>유족 아닌 처 본인의 종교적 인격이 문제된 점(사자의 인격이 아님)에 주의.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭52.7.13 / 津地鎮祭事件\u003c/td>\u003ctd>목적효과기준의 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最判平5.2.16 / 箕面忠魂碑訴訟\u003c/td>\u003ctd>전몰자 위령 관련 합헌례\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平9.4.2 / 愛媛玉串料訴訟\u003c/td>\u003ctd>신사에 대한 공금지출은 위헌 — 국가 관여의 정도 차이 비교\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最大判昭63.6.1\u003c/a>（사건번호 昭和57(オ)902로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E8%87%AA%E8%A1%9B%E5%AE%98%E5%90%88%E7%A5%80%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 自衛官合祀訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"殉職自衛官合祀拒否訴訟（自衛官合祀事件） 最大判昭63.6.1 항목 내용 ------ ------ 인용 最大判昭63.6.1 （최고재 대법정 1988.6.1） 사건번호 昭和57年 オ 第902号 사건명 손해배상 청구사건 판례집 民集42巻5号277頁 결론 원판결 파기·자판 청구기각 . 위헌·불법행위 부정 과목 헌법（20조 신교의 자유·정교분리 / 종교상 인격권·관용） 사안 순직한 자위관의 처 x 기독교 신자 는, 남편이 山口県 隊友会 자위대 협력단체 의 신청으로 현 호국신사 県護国神社 에 합사 合祀 된 것에 대해, 자신의 종교적 신념에 반해 남편이 신사에 모셔졌다며, 국가와 隊友会를 상대로 위자료를 청구했다 합사 신청 과정에서 자위대 지방연락부 직원이 협력 한 점을 문제 삼음 . 1·2심은 종교상 인격권 침해를 인정해 청구를 인용 → 국가 측 상고. 쟁점 1. 합사 신청에 대한 자위대 직원의 협력행위는 20조 3항의 「종교적 활동」인가. 2. 「정온한 종교적 환경 아래에서 신앙생활을 보낼 이익」 종교상 인격권 은 법적으로 보호되는가. 판시 1. 직원의 협력행위 — 종교적 활동 아님 합사 신청은 어디까지나 隊友会의 단독 행위 이고, 지방연락부 직원의 협력은 간접적인 것이었다. 그 의도·목적은 자위관의 사기 고양 등 세속적 인 것이며, 특정 종교에 대한 원조·조장 또는 압박·간섭의 효과를 갖지 않는다 → 목적효과기준에 비추어 종교적 활동에 해당하지 않는다. 2. 종교상 인격권 — 법적 이익성 부정, 「관용」 신교의 자유의 보장은, 타인의 신앙에 근거한 행위 에 의해 자기의 신앙생활이 방해받았다 해도, 그것이 강제나 불이익 부여를 수반하지 않는 한, 이를 수인해야 하며 「관용 寛容 」이 요구된다 . 합사는 신사 호국신사 측의 신교의 자유에 의한 행위 이고, x에게 신앙을 강제하거나 불이익을 준 것이 아니다. 「정온한 종교적 환경 아래에서 신앙생활을 보낼 이익」을 곧바로 법적 이익으로 인정할 수 없다 . → 불법행위 불성립. 파기·자판, 청구기각. 반대의견 伊藤正己 재판관의 반대의견 — 소수자의 종교적 인격권 보호를 중시해 원심 유지를 주장했다. 시험 포인트 - 「관용」의 법리 가 최대 포인트: 사인 신사·타인 의 신앙에 근거한 행위로 인한 불쾌·고통은, 강제·불이익이 없는 한 수인 — 종교상 인격권 정온한 종교적 환경에서의 신앙생활의 이익 의 법적 이익성 부정. - 국가 행위 축은 목적효과기준으로 처리 직원 협력 = 세속적 목적 → 종교적 활동 아님 . 두 축 국가의 정교분리 / 사인 간 이익형량 을 구별해 답하는 것이 핵심. - 소수자 보호 관점에서의 비판이 강한 판례 — 伊藤正己 반대의견과 세트로 출제된다. - 유족 아닌 처 본인의 종교적 인격이 문제된 점 사자의 인격이 아님 에 주의. 후속·관련 판례 관계 ------ ------ 最大判昭52.7.13 / 津地鎮祭事件 목적효과기준의 적용 最判平5.2.16 / 箕面忠魂碑訴訟 전몰자 위령 관련 합헌례 最大判平9.4.2 / 愛媛玉串料訴訟 신사에 대한 공금지출은 위헌 — 국가 관여의 정도 차이 비교 원문·참고 - 裁判所 판례검색: 最大判昭63.6.1 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 昭和57 オ 902로 검색） - wikipedia: 自衛官合祀訴訟 https://ja.wikipedia.org/wiki/%e8%87%aa%e8%a1%9b%e5%ae%98%e5%90%88%e7%a5%80%e8%a8%b4%e8%a8%9f"},"女子再婚禁止規定違憲事件（再婚禁止期間訴訟）":{"type":"case","subject":"헌법","id":"女子再婚禁止規定違憲事件（再婚禁止期間訴訟）","title":"女子再婚禁止規定違憲事件（再婚禁止期間訴訟）","sub":"最大判平27.12.16","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判平27.12.16\u003c/strong>（최고재 대법정 2015.12.16）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>平成25年(オ)第1079号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>損害賠償請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集69巻8号2427頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>寺田逸郎（100일 초과 위헌은 전원일치. 국배 반대 1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>일부 위헌\u003c/strong>. 100일 부분은 합헌, 100일 초과는 평20 당시 14조 1항·24조 2항 위반. 국배 청구는 기각\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항, 24조 혼인·가족）· 민법 733조· 국배법 1조 1항\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 민법 733조 1항（여자만 전혼 해소·취소일부터 \u003cstrong>6개월\u003c/strong> 재혼 금지）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>같은 날 夫婦同氏（最大判平27.12.16）는 합헌. 혼동하지 말 것.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>여성 X는 이혼 후 6개월 재혼 금지(733조 1항) 때문에 재혼이 늦어졌다. 규정이 14조 1항·24조 2항에 위반하고, 국회가 개폐하지 않은 입법부작위가 국배법 1조 1항의 위법이라고 주장하며 국가에 손해를 배상하라고 했다.\u003c/p>\n\u003cp>1심(오카야마지재)·항소심(히로시마고재 오카야마지부) 청구 기각. 최고재는 100일 초과 부분을 위헌으로 보면서도, 입법부작위의 국배 위법은 인정하지 않고 \u003cstrong>상고기각\u003c/strong>.\u003c/p>\n\u003ch2>관련 조문（당시）\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>조문\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>733조 1항\u003c/td>\u003ctd>여자는 전혼 해소·취소일부터 \u003cstrong>6개월\u003c/strong>이 지나지 않으면 재혼할 수 없다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>733조 2항\u003c/td>\u003ctd>전혼 해소 전부터 임신한 경우, 출산일부터 1항을 적용하지 않는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>772조\u003c/td>\u003ctd>혼인 성립일부터 \u003cstrong>200일\u003c/strong> 경과 후, 또는 혼인 해소·취소일부터 \u003cstrong>300일\u003c/strong> 이내 출생한 자는 혼인 중 임신으로 추정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>300 − 200 = \u003cstrong>100일\u003c/strong>. 이 기간만 있으면 부성 추정이 겹치지 않는다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>6개월 재혼 금지 중, 부성 추정 중복을 피하는 \u003cstrong>100일\u003c/strong> 부분은 14조·24조에 위반하는가.\u003c/li>\u003cli>\u003cstrong>100일을 넘는\u003c/strong> 부분은 위반하는가. 위반이라면 언제부터인가.\u003c/li>\u003cli>국회가 개폐하지 않은 것이 국배법상 위법인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 입법목적\u003c/h3>\n\u003cp>733조 1항의 목적은, 부성 추정의 중복을 피해 부자관계를 둘러싼 분쟁을 미리 막는 데 있다. 이 목적 자체는 합리적이다.\u003c/p>\n\u003ch3>2. 100일 부분 — 합헌\u003c/h3>\n\u003cp>재혼 후 출생하는 자에 대해, 계산상 \u003cstrong>100일\u003c/strong>의 재혼 금지만 두면 772조의 부성 추정은 겹치지 않는다.\u003c/p>\n\u003cp>부부 사이의 자가 적출자가 되는 것은 혼인의 중요한 효과다. 출산 시기를 기점으로 한 명확·획일 기준으로 부성을 추정하고 자의 신분 관계를 일찍 안정시키는 취지에 비추면, 100일에 한해 여자의 재혼을 일률 제약하는 것은 혼인·가족 사항에 인정되는 \u003cstrong>합리적 입법 재량\u003c/strong>을 넘지 않고, 목적과의 관련에서 합리성이 있다 → \u003cstrong>14조 1항·24조 2항 위반 아님\u003c/strong>.\u003c/p>\n\u003ch3>3. 100일 초과 — 위헌（평20 당시）\u003c/h3>\n\u003cp>혼인을 할 자유는 24조 1항의 취지에 비추어 충분히 존중돼야 한다. 처가 혼인 전부터 임신한 자를 낳는 것은 재혼에만 있는 일도 아니다.\u003c/p>\n\u003cp>전부의 자가 태어날 가능성을 줄여 가정의 불화를 피한다거나, 혼인 후 출생자의 부자 다툼을 줄여 혈통 혼란을 피한다는 이유로, \u003cstrong>추정 중복을 피하는 기간을 넘어\u003c/strong> 혼인을 금하는 것은 정당화하기 어렵다.\u003c/p>\n\u003cp>따라서 100일 초과 부분은 합리성을 결한 \u003cstrong>과잉 제약\u003c/strong>이고, \u003cstrong>평20 당시\u003c/strong> 14조 1항·24조 2항에 위반하기에 이르렀다.\u003c/p>\n\u003ch3>4. 국배 — 입법부작위는 위법 아님\u003c/h3>\n\u003cp>법률이 헌법상 보장·보호되는 권리이익을 합리적 이유 없이 제약함이 \u003cstrong>명백\u003c/strong>한데, 국회가 정당한 이유 없이 장기간 개폐를 게을리한 경우 등에는, 예외적으로 입법부작위가 국배법 1조 1항의 위법이 될 수 있다.\u003c/p>\n\u003cp>그러나 100일 초과가 합리성을 잃게 된 것은 소22 민법 개정 이후 의료·과학기술·사회 상황의 변화에 따른 것이고, 평7 제3소법정은 개폐하지 않은 것이 바로 그 예외에 해당할 여지가 없다고 했으며, 그 후에도 위헌 문제라는 사법 판단이 나오지 않았다. 평20 당시 위헌임이 국회에 \u003cstrong>명백\u003c/strong>했다고 보기 어렵다 → 국배법상 위법 아님. 청구 기각.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>이단: \u003cstrong>100일 = 합헌\u003c/strong>, \u003cstrong>100일 초과 = 위헌\u003c/strong>. 「6개월 전부 위헌」은 다수 의견이 아니다(鬼丸 재판관만 전 기간 위헌 취지).\u003c/li>\u003cli>14조만이 아니라 \u003cstrong>24조 2항\u003c/strong>(혼인·가족에 관한 법률은 개인의 존엄과 양성의 본질적 평등에 입각)도 근거.\u003c/li>\u003cli>국배와 위헌은 별개. 위헌이어도 「국회에 명백 + 장기 방치」가 아니면 국배는 안 된다（在外国民選挙権 最大判平17.9.14와 대비）.\u003c/li>\u003cli>후속 입법: 평28 개정으로 6개월 → \u003cstrong>100일\u003c/strong>. 령4 개정으로 재혼금지기간 \u003cstrong>삭제\u003c/strong>(령6.4.1 시행, 772조의 추정 방식도 재편).\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最三小判平7.12.5\u003c/td>\u003ctd>국배 기각. 위헌 판단은 하지 않음. 본 판결이 인용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平17.9.14（재외국민 선거권）\u003c/td>\u003ctd>입법부작위의 국배 위법이 인정된 예외\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平27.12.16（부부동씨）\u003c/td>\u003ctd>같은 날. 24조·14조이지만 \u003cstrong>합헌\u003c/strong>. 혼동 주의\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/104-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%86%8D%E5%A9%9A%E7%A6%81%E6%AD%A2%E6%9C%9F%E9%96%93%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 再婚禁止期間訴訟\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e5%b9%b327-12-16/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"女子再婚禁止規定違憲事件（再婚禁止期間訴訟） 最大判平27.12.16 항목 내용 ------ ------ 인용 最大判平27.12.16 （최고재 대법정 2015.12.16） 사건번호 平成25年 オ 第1079号 사건명 損害賠償請求事件 판례집 民集69巻8号2427頁 재판장 寺田逸郎（100일 초과 위헌은 전원일치. 국배 반대 1） 결론 일부 위헌 . 100일 부분은 합헌, 100일 초과는 평20 당시 14조 1항·24조 2항 위반. 국배 청구는 기각 과목 헌법（14조 1항, 24조 혼인·가족）· 민법 733조· 국배법 1조 1항 대상 조문 구 민법 733조 1항（여자만 전혼 해소·취소일부터 6개월 재혼 금지） 같은 날 夫婦同氏（最大判平27.12.16）는 합헌. 혼동하지 말 것. 사안 여성 x는 이혼 후 6개월 재혼 금지 733조 1항 때문에 재혼이 늦어졌다. 규정이 14조 1항·24조 2항에 위반하고, 국회가 개폐하지 않은 입법부작위가 국배법 1조 1항의 위법이라고 주장하며 국가에 손해를 배상하라고 했다. 1심 오카야마지재 ·항소심 히로시마고재 오카야마지부 청구 기각. 최고재는 100일 초과 부분을 위헌으로 보면서도, 입법부작위의 국배 위법은 인정하지 않고 상고기각 . 관련 조문（당시） 조문 내용 ------ ------ 733조 1항 여자는 전혼 해소·취소일부터 6개월 이 지나지 않으면 재혼할 수 없다 733조 2항 전혼 해소 전부터 임신한 경우, 출산일부터 1항을 적용하지 않는다 772조 혼인 성립일부터 200일 경과 후, 또는 혼인 해소·취소일부터 300일 이내 출생한 자는 혼인 중 임신으로 추정 300 − 200 = 100일 . 이 기간만 있으면 부성 추정이 겹치지 않는다. 쟁점 1. 6개월 재혼 금지 중, 부성 추정 중복을 피하는 100일 부분은 14조·24조에 위반하는가. 2. 100일을 넘는 부분은 위반하는가. 위반이라면 언제부터인가. 3. 국회가 개폐하지 않은 것이 국배법상 위법인가. 판시 1. 입법목적 733조 1항의 목적은, 부성 추정의 중복을 피해 부자관계를 둘러싼 분쟁을 미리 막는 데 있다. 이 목적 자체는 합리적이다. 2. 100일 부분 — 합헌 재혼 후 출생하는 자에 대해, 계산상 100일 의 재혼 금지만 두면 772조의 부성 추정은 겹치지 않는다. 부부 사이의 자가 적출자가 되는 것은 혼인의 중요한 효과다. 출산 시기를 기점으로 한 명확·획일 기준으로 부성을 추정하고 자의 신분 관계를 일찍 안정시키는 취지에 비추면, 100일에 한해 여자의 재혼을 일률 제약하는 것은 혼인·가족 사항에 인정되는 합리적 입법 재량 을 넘지 않고, 목적과의 관련에서 합리성이 있다 → 14조 1항·24조 2항 위반 아님 . 3. 100일 초과 — 위헌（평20 당시） 혼인을 할 자유는 24조 1항의 취지에 비추어 충분히 존중돼야 한다. 처가 혼인 전부터 임신한 자를 낳는 것은 재혼에만 있는 일도 아니다. 전부의 자가 태어날 가능성을 줄여 가정의 불화를 피한다거나, 혼인 후 출생자의 부자 다툼을 줄여 혈통 혼란을 피한다는 이유로, 추정 중복을 피하는 기간을 넘어 혼인을 금하는 것은 정당화하기 어렵다. 따라서 100일 초과 부분은 합리성을 결한 과잉 제약 이고, 평20 당시 14조 1항·24조 2항에 위반하기에 이르렀다. 4. 국배 — 입법부작위는 위법 아님 법률이 헌법상 보장·보호되는 권리이익을 합리적 이유 없이 제약함이 명백 한데, 국회가 정당한 이유 없이 장기간 개폐를 게을리한 경우 등에는, 예외적으로 입법부작위가 국배법 1조 1항의 위법이 될 수 있다. 그러나 100일 초과가 합리성을 잃게 된 것은 소22 민법 개정 이후 의료·과학기술·사회 상황의 변화에 따른 것이고, 평7 제3소법정은 개폐하지 않은 것이 바로 그 예외에 해당할 여지가 없다고 했으며, 그 후에도 위헌 문제라는 사법 판단이 나오지 않았다. 평20 당시 위헌임이 국회에 명백 했다고 보기 어렵다 → 국배법상 위법 아님. 청구 기각. 시험 포인트 - 이단: 100일 = 합헌 , 100일 초과 = 위헌 . 「6개월 전부 위헌」은 다수 의견이 아니다 鬼丸 재판관만 전 기간 위헌 취지 . - 14조만이 아니라 24조 2항 혼인·가족에 관한 법률은 개인의 존엄과 양성의 본질적 평등에 입각 도 근거. - 국배와 위헌은 별개. 위헌이어도 「국회에 명백 + 장기 방치」가 아니면 국배는 안 된다（在外国民選挙権 最大判平17.9.14와 대비）. - 후속 입법: 평28 개정으로 6개월 → 100일 . 령4 개정으로 재혼금지기간 삭제 령6.4.1 시행, 772조의 추정 방식도 재편 . 후속·관련 판례 관계 ------ ------ 最三小判平7.12.5 국배 기각. 위헌 판단은 하지 않음. 본 판결이 인용 最大判平17.9.14（재외국민 선거권） 입법부작위의 국배 위법이 인정된 예외 最大判平27.12.16（부부동씨） 같은 날. 24조·14조이지만 합헌 . 혼동 주의 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/104-3.html - wikipedia: 再婚禁止期間訴訟 https://ja.wikipedia.org/wiki/%e5%86%8d%e5%a9%9a%e7%a6%81%e6%ad%a2%e6%9c%9f%e9%96%93%e8%a8%b4%e8%a8%9f - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e5%b9%b327-12-16/"},"生後認知児童国籍確認事件（婚外子国籍訴訟）":{"type":"case","subject":"헌법","id":"生後認知児童国籍確認事件（婚外子国籍訴訟）","title":"生後認知児童国籍確認事件（婚外子国籍訴訟）","sub":"最大判平20.6.4","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判平20.6.4\u003c/strong>（최고재 대법정 2008.6.4）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>(A) 平成18年(行ツ)第135号　(B) 平成19年(行ツ)第164号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>(A) 退去強制令書発付処分取消等請求事件　(B) 国籍確認請求事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>(A) 民集62巻6号1367頁　(B) 集民228号101頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>島田仁郎\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 구 국적법 3조 1항의 준정(準正) 요건이 만드는 구별은 14조 1항 위반. 준정 부분을 뺀 요건을 충족하면 신고로 일본국적 취득\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항 법 아래의 평등）· 국적법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 국적법 3조 1항（부모의 혼인에 의한 적출자 신분 취득＝준정 요건）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>같은 날 동취지의 판결이 두 건. 수험·민집은 보통 (A)를 든다. 별칭은 生後認知児童国籍確認事件·婚外子国籍訴訟·国籍法違憲訴訟.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>일본국민인 부와 외국인(필리핀)인 모 사이에서 혼외자로 출생. 부가 \u003cstrong>생후 인지\u003c/strong>. 부모는 혼인하지 않아 \u003cstrong>준정(準正)\u003c/strong> 이 없다.\u003c/p>\n\u003cp>구 국적법 3조 1항은, 생후인지에 더해 \u003cstrong>부모의 혼인으로 적출자 신분을 취득한 경우\u003c/strong>에만 법무대신 신고로 일본국적 취득을 인정했다. 준정이 없어 국적취득계가 받아들여지지 않자, 14조 1항 위반을 주장하고 국적 확인 등을 구했다.\u003c/p>\n\u003cp>항소심(도쿄고재)은 국적 부여는 입법 권한이라며 헌법판단을 피하고 원고 패소. 대법정이 위헌·구제로 뒤집었다.\u003c/p>\n\u003ch2>구 국적법이 만들던 구별\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>유형\u003c/th>\u003cth>일본국적\u003c/th>\u003c/tr>\u003ctr>\u003ctd>적출자（혼인 중의 자）\u003c/td>\u003ctd>출생과 동시에（2조 1호）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일본국민인 모의 혼외자\u003c/td>\u003ctd>출생과 동시에（2조 1호）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일본국민인 부의 \u003cstrong>태아인지\u003c/strong>\u003c/td>\u003ctd>출생과 동시에（2조 1호）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생후인지 + \u003cstrong>준정\u003c/strong>(부모 혼인)\u003c/td>\u003ctd>신고로 취득（3조 1항）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>생후인지 \u003cstrong>만\u003c/strong>（비준정자）\u003c/td>\u003ctd>신고로도 취득 불가 ← 本件\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>민법상 인지의 효력은 출생 시에 소급하지만(784조), 국적법 2조 1호는 국적의 부동성 때문에 \u003cstrong>소급하지 않는다\u003c/strong>고 해석된다. 그래서 생후인지만으로는 출생 시 법률상 부자관계가 없다고 본다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>생후인지자 중 준정자와 비준정자를 가르는 구별이 14조 1항에 위반하는가.\u003c/li>\u003cli>위헌이라면 3조 1항 전부를 무효로 하는가, 준정 요건만 빼고 국적 취득을 인정할 수 있는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 심사 태도\u003c/h3>\n\u003cp>14조 1항은 사안의 성질에 맞는 \u003cstrong>합리적 근거가 없는 한\u003c/strong> 법적 차별 취급을 금지한다.\u003c/p>\n\u003cp>일본국적은 구성원 자격인 동시에, 기본적 인권 보장·공적 자격·공적 급부를 받는 데 의미가 있는 \u003cstrong>중요한 법적 지위\u003c/strong>다.  \u003cbr>부모가 혼인해 적출자 신분을 얻는지는, 자에게는 \u003cstrong>자신의 의사·노력으로 바꿀 수 없는\u003c/strong> 부모의 신분행위다. 이런 사정으로 국적 취득을 가르는 데 합리적 이유가 있는지는 \u003cstrong>신중히\u003c/strong> 본다.\u003c/p>\n\u003ch3>2. 위헌（준정 요건）\u003c/h3>\n\u003cp>구 3조 1항이, 일본국민인 부와 일본국민이 아닌 모 사이에서 출생한 뒤 부가 인지한 자에 대해, \u003cstrong>부모의 혼인으로 적출자 신분을 취득한 경우에만\u003c/strong> 신고 취득을 인정해, 인지에 그친 자와 준정자 사이에 국적 취득의 구별을 만든 것은, 늦어도 상고인들이 국적취득계를 제출한 당시에는 \u003cstrong>14조 1항에 위반\u003c/strong>했다.\u003c/p>\n\u003cp>같은 일본국민을 혈통상 부모로 두고 법률상 친자관계가 생겼는데도, 생후인지에 그친 혼외자만 현저히 불리하다. 태아인지와의 구별도 우리나라와의 결부로 설명하기 어렵다.\u003c/p>\n\u003ch3>3. 구제 방법（합헌적 해석）\u003c/h3>\n\u003cp>3조 1항 \u003cstrong>전부 무효\u003c/strong>로 준정자의 신고 취득까지 부정하는 것은, 혈통주의를 보완하려고 둔 출생 후 국적 취득 취지를 몰각하므로 취할 수 없다.\u003c/p>\n\u003cp>평등 취급과 부모 양계 혈통주의를 踏まえる면, 생후인지에 그친 자에게도 3조 1항의 취지를 똑같이 미친다. 즉 \u003cstrong>「부모의 혼인으로 적출자 신분을 취득한」 부분을 뺀\u003c/strong> 동항 소정의 요건이 충족되면 \u003cstrong>신고로 일본국적을 취득\u003c/strong>한다.\u003c/p>\n\u003cp>이 해석으로 동항·국적법의 합헌적이고 합리적인 해석이 가능하고, 차별 취급을 받은 자를 \u003cstrong>직접 구제\u003c/strong>한다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>결론은 \u003cstrong>위헌\u003c/strong>이지만, 「3조 1항 전부 무효 → 누구도 신고 취득 못 함」이 오답.\u003c/li>\u003cli>구제는 \u003cstrong>준정 요건만 빼고 나머지 요건 + 신고로 국적 취득\u003c/strong>(합헌적 해석·일부 위헌).\u003c/li>\u003cli>자가 바꿀 수 없는 부모의 혼인 여부로 중요한 법적 지위(국적)를 가르면, 합리적 근거를 \u003cstrong>신중히\u003c/strong> 본다.\u003c/li>\u003cli>행정서사 실무: 국적·인지·국적취득계. 평20 법률 88호로 국적법 개정 → 생후인지 후 신고 취득이 조문에 반영.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/103-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%A9%9A%E5%A4%96%E5%AD%90%E5%9B%BD%E7%B1%8D%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 婚外子国籍訴訟\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://gs.kabudata-dll.com/%E6%9C%80%E5%A4%A7%E5%88%A4%E5%B9%B320-6-4/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>\u003c/li>\u003c/ul>","search":"生後認知児童国籍確認事件（婚外子国籍訴訟） 最大判平20.6.4 항목 내용 ------ ------ 인용 最大判平20.6.4 （최고재 대법정 2008.6.4） 사건번호 a 平成18年 行ツ 第135号 b 平成19年 行ツ 第164号 사건명 a 退去強制令書発付処分取消等請求事件 b 国籍確認請求事件 판례집 a 民集62巻6号1367頁 b 集民228号101頁 재판장 島田仁郎 결론 위헌 . 구 국적법 3조 1항의 준정 準正 요건이 만드는 구별은 14조 1항 위반. 준정 부분을 뺀 요건을 충족하면 신고로 일본국적 취득 과목 헌법（14조 1항 법 아래의 평등）· 국적법 대상 조문 구 국적법 3조 1항（부모의 혼인에 의한 적출자 신분 취득＝준정 요건） 같은 날 동취지의 판결이 두 건. 수험·민집은 보통 a 를 든다. 별칭은 生後認知児童国籍確認事件·婚外子国籍訴訟·国籍法違憲訴訟. 사안 일본국민인 부와 외국인 필리핀 인 모 사이에서 혼외자로 출생. 부가 생후 인지 . 부모는 혼인하지 않아 준정 準正 이 없다. 구 국적법 3조 1항은, 생후인지에 더해 부모의 혼인으로 적출자 신분을 취득한 경우 에만 법무대신 신고로 일본국적 취득을 인정했다. 준정이 없어 국적취득계가 받아들여지지 않자, 14조 1항 위반을 주장하고 국적 확인 등을 구했다. 항소심 도쿄고재 은 국적 부여는 입법 권한이라며 헌법판단을 피하고 원고 패소. 대법정이 위헌·구제로 뒤집었다. 구 국적법이 만들던 구별 유형 일본국적 ------ ---------- 적출자（혼인 중의 자） 출생과 동시에（2조 1호） 일본국민인 모의 혼외자 출생과 동시에（2조 1호） 일본국민인 부의 태아인지 출생과 동시에（2조 1호） 생후인지 + 준정 부모 혼인 신고로 취득（3조 1항） 생후인지 만 （비준정자） 신고로도 취득 불가 ← 本件 민법상 인지의 효력은 출생 시에 소급하지만 784조 , 국적법 2조 1호는 국적의 부동성 때문에 소급하지 않는다 고 해석된다. 그래서 생후인지만으로는 출생 시 법률상 부자관계가 없다고 본다. 쟁점 1. 생후인지자 중 준정자와 비준정자를 가르는 구별이 14조 1항에 위반하는가. 2. 위헌이라면 3조 1항 전부를 무효로 하는가, 준정 요건만 빼고 국적 취득을 인정할 수 있는가. 판시 1. 심사 태도 14조 1항은 사안의 성질에 맞는 합리적 근거가 없는 한 법적 차별 취급을 금지한다. 일본국적은 구성원 자격인 동시에, 기본적 인권 보장·공적 자격·공적 급부를 받는 데 의미가 있는 중요한 법적 지위 다. 부모가 혼인해 적출자 신분을 얻는지는, 자에게는 자신의 의사·노력으로 바꿀 수 없는 부모의 신분행위다. 이런 사정으로 국적 취득을 가르는 데 합리적 이유가 있는지는 신중히 본다. 2. 위헌（준정 요건） 구 3조 1항이, 일본국민인 부와 일본국민이 아닌 모 사이에서 출생한 뒤 부가 인지한 자에 대해, 부모의 혼인으로 적출자 신분을 취득한 경우에만 신고 취득을 인정해, 인지에 그친 자와 준정자 사이에 국적 취득의 구별을 만든 것은, 늦어도 상고인들이 국적취득계를 제출한 당시에는 14조 1항에 위반 했다. 같은 일본국민을 혈통상 부모로 두고 법률상 친자관계가 생겼는데도, 생후인지에 그친 혼외자만 현저히 불리하다. 태아인지와의 구별도 우리나라와의 결부로 설명하기 어렵다. 3. 구제 방법（합헌적 해석） 3조 1항 전부 무효 로 준정자의 신고 취득까지 부정하는 것은, 혈통주의를 보완하려고 둔 출생 후 국적 취득 취지를 몰각하므로 취할 수 없다. 평등 취급과 부모 양계 혈통주의를 踏まえる면, 생후인지에 그친 자에게도 3조 1항의 취지를 똑같이 미친다. 즉 「부모의 혼인으로 적출자 신분을 취득한」 부분을 뺀 동항 소정의 요건이 충족되면 신고로 일본국적을 취득 한다. 이 해석으로 동항·국적법의 합헌적이고 합리적인 해석이 가능하고, 차별 취급을 받은 자를 직접 구제 한다. 시험 포인트 - 결론은 위헌 이지만, 「3조 1항 전부 무효 → 누구도 신고 취득 못 함」이 오답. - 구제는 준정 요건만 빼고 나머지 요건 + 신고로 국적 취득 합헌적 해석·일부 위헌 . - 자가 바꿀 수 없는 부모의 혼인 여부로 중요한 법적 지위 국적 를 가르면, 합리적 근거를 신중히 본다. - 행정서사 실무: 국적·인지·국적취득계. 평20 법률 88호로 국적법 개정 → 생후인지 후 신고 취득이 조문에 반영. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/103-3.html - wikipedia: 婚外子国籍訴訟 https://ja.wikipedia.org/wiki/%e5%a9%9a%e5%a4%96%e5%ad%90%e5%9b%bd%e7%b1%8d%e8%a8%b4%e8%a8%9f - 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e5%b9%b320-6-4/"},"尊属殺重罰規定違憲判決（栃木実父殺し事件）":{"type":"case","subject":"헌법","id":"尊属殺重罰規定違憲判決（栃木実父殺し事件）","title":"尊属殺重罰規定違憲判決（栃木実父殺し事件）","sub":"最大判昭48.4.4","chip":{"label":"위헌","cls":"shu"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭48.4.4\u003c/strong>（최고재 대법정 1973.4.4）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和45年(あ)第1310号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>尊属殺人被告事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>刑集27巻3号265頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>石田和外（다수. 반대 1）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 구 형법 200조 무효 → 보통살인(199조) 적용. 징역 2년 6월, 집행유예 3년\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（14조 1항 법 아래의 평등）· 형법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>구 형법 200조（존속살. 평7 법률 91호로 삭제）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>최고재가 법률을 \u003cstrong>법령위헌\u003c/strong>으로 판단한 첫 판결. 별칭은 尊属殺違憲判決·栃木実父殺し事件.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>피고인(당시 29세)은 14세부터 실부에게 장기간 학대·성폭력을 당하며 사실상 부부처럼 살게 강제됐다. 직장에서 결혼 상대가 생기자 실부가 격분해 약 10일간 감금·학대했다. 1968.10.5 실부가 집을 나가면 죽이겠다고 덤비자, 피고인은 이 관계에서 벗어나려면 살해 외에는 없다고 보고 목을 졸라 죽인 뒤 자수했다.\u003c/p>\n\u003cp>기소: 존속살인(구 형법 200조). 항변: 200조는 헌법 14조 위반으로 무효.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>심급\u003c/th>\u003cth>판단\u003c/th>\u003c/tr>\u003ctr>\u003ctd>1심 宇都宮地裁\u003c/td>\u003ctd>200조 위헌. 199조 적용, 과잉방위로 \u003cstrong>형면제\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2심 東京高裁\u003c/td>\u003ctd>200조 합헌. 최대한 감경해도 하한 징역 3년 6월 → \u003cstrong>실형\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>상고심 최고재 대법정\u003c/td>\u003ctd>200조 \u003cstrong>위헌·무효\u003c/strong>. 199조 적용, 징역 2년 6월·집행유예 3년（파기 자판）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>구 형법이 만들던 구별\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>보통살인（199조）\u003c/th>\u003cth>존속살（200조）\u003c/th>\u003c/tr>\u003ctr>\u003ctd>구성요건\u003c/td>\u003ctd>사람을 죽인 자\u003c/td>\u003ctd>자기 또는 배우자의 \u003cstrong>직계존속\u003c/strong>을 죽인 자\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법정형\u003c/td>\u003ctd>사형·무기 또는 \u003cstrong>3년 이상\u003c/strong> 징역\u003c/td>\u003ctd>\u003cstrong>사형 또는 무기징역만\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2회 감경 후 하한\u003c/td>\u003ctd>집행유예 가능\u003c/td>\u003ctd>징역 \u003cstrong>3년 6월\u003c/strong>（집행유예 불가）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>집행유예는 선고형이 징역 3년 이하여야 한다(형법 25조). 200조는 심신미약(39조 2항)과 작량감경(66조)을 겹쳐도, 무기 → 7년 이상 → 그 반 = \u003cstrong>3년 6월\u003c/strong>이 하한이라 집행유예를 붙일 수 없었다. 本件처럼 정상을 크게 참작해야 하는 사안에서도 실형밖에 없었다.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>14조 1항 후단의 열거(인종·신조·성별·사회적 신분·문지)는 한정열거인가, 예시인가.\u003c/li>\u003cli>보통살인 외에 존속살을 두고 형을 가중하는 것 \u003cstrong>자체\u003c/strong>가 14조 1항에 위반하는가.\u003c/li>\u003cli>법정형을 사형·무기만으로 한정한 200조는 14조 1항에 위반하는가.\u003c/li>\u003cli>위헌이라면 本件에 무엇을 적용하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 심사 태도（14조 1항）\u003c/h3>\n\u003cp>14조 1항은 법 아래의 평등을 보장한다. 후단 열거는 \u003cstrong>예시\u003c/strong>다. 평등의 요청은, 사안의 성질에 맞는 \u003cstrong>합리적 근거가 없는 한\u003c/strong> 차별 취급을 금지한다（最大判昭39.5.27 전원일치 공무원 지정석 사건 등）.\u003c/p>\n\u003cp>200조는 피해자와 가해자의 특별 신분관계에 기해, 199조와 같은 유형의 행위에 형을 가중하는 \u003cstrong>가중적 신분범\u003c/strong>이다. 199조 외에 200조를 둔 것은 14조 1항의 차별 취급에 해당한다. 위헌 여부는 그 차별이 \u003cstrong>합리적 근거에 기하는가\u003c/strong>로 정한다.\u003c/p>\n\u003ch3>2. 가중 자체는 합헌（목적）\u003c/h3>\n\u003cp>200조의 입법목적은, 존속살이 보통살인보다 일반적으로 고도의 사회적·도의적 비난에 값하므로 더 엄히 처벌해 특히 강하게 금압하려는 데 있다.\u003c/p>\n\u003cp>존속에 대한 존중·보은은 사회생활상 기본적 도의이고, 그 자연적 정애·보편 윤리의 유지는 형법상 보호에 값한다. 따라서\u003c/p>\n\u003cul>\u003cli>피해자가 존속임을 \u003cstrong>양형상\u003c/strong> 중시하는 것\u003c/li>\u003cli>나아가 이를 유형화해 \u003cstrong>법률상 가중요건\u003c/strong>으로 두는 것\u003c/li>\u003c/ul>\n\u003cp>은 곧 합리적 근거를 결한다고 단정할 수 없고, 14조 1항 위반이라고 할 수도 없다.\u003c/p>\n\u003ch3>3. 수단이 극단 → 위헌（200조 전체 무효）\u003c/h3>\n\u003cp>가중 \u003cstrong>정도\u003c/strong>가 극단이면 차별의 합리성을 부정해야 한다. 목적 달성의 수단으로 현저히 균형을 잃고 정당화할 근거를 찾기 어려우면, 그 차별은 현저히 불합리하고 14조 1항에 위반해 \u003cstrong>무효\u003c/strong>다.\u003c/p>\n\u003cp>200조를 이 관점에서 보면:\u003c/p>\n\u003col>\u003cli>법정형이 사형·무기뿐이라, 199조(사형·무기·3년 이상 징역)보다 형종 선택이 극히 무거운 형에만 한정된다.\u003c/li>\u003cli>법이 허용하는 2회 감경을 해도 처단형 하한이 징역 3년 6월이라, 아무리 작량할 정상이 있어도 \u003cstrong>집행유예가 법률상 불가능\u003c/strong>하다.\u003c/li>\u003cli>비난받을 바 없는 존속을 고의로 죽인 경우에도, 보통살인 규정으로 엄벌 목적은 달성 가능하다.\u003c/li>\u003cli>반대로 존속이 비도한 행위를 하여 비속이 살해에 이른 사례도 있고, 그때 비속의 행위가 200조의 중형으로 임할 만큼 가혹한 비난에 값한다고 보기 어렵다. 양형 실태상 법정형 그대로 가는 예는 거의 없고, 2회 감경·하한 3년 6월 선고도 드물지 않다.\u003c/li>\u003c/ol>\n\u003cp>존속살 법정형은 사형 또는 무기에 한정된 점에서(현행 형법상 외환유치죄를 제외하면 가장 무거움) 너무 가혹하다. 존속에 대한 경애·보은이라는 윤리 유지의 관점만으로는 납득할 설명이 되지 않고, 합리적 근거에 기한 차별로 정당화할 수 없다.\u003c/p>\n\u003cp>\u003cstrong>따라서 200조는, 존속살의 법정형을 사형과 무기징역에만 한정한 점에서, 입법목적 달성에 필요한 한도를 훨씬 넘어 199조에 비해 현저히 불합리한 차별 취급을 하는 것으로 인정되고, 헌법 14조 1항에 위반하여 무효다. 존속살에도 199조를 적용할 수밖에 없다.\u003c/strong>\u003c/p>\n\u003ch3>4. 本件 적용\u003c/h3>\n\u003cp>200조 무효이므로 199조를 적용. 원심(200조 적용·징역 3년 6월) 파기. 심신미약 등을 참작해 징역 2년 6월, 3년간 집행유예.\u003c/p>\n\u003ch2>의견 분포（15인）\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>입장\u003c/th>\u003cth>내용\u003c/th>\u003cth>재판관\u003c/th>\u003c/tr>\u003ctr>\u003ctd>다수\u003c/td>\u003ctd>가중 자체는 합헌, \u003cstrong>형 한정(사형·무기만)이 위헌\u003c/strong>\u003c/td>\u003ctd>石田和外, 岩田誠, 村上朝一, 関根小郷, 藤林益三, 岡原昌男, 岸盛一, 天野武一\u003c/td>\u003c/tr>\u003ctr>\u003ctd>의견\u003c/td>\u003ctd>결론(위헌) 찬성. \u003cstrong>존속살 규정을 두는 것 자체\u003c/strong>가 14조 위반\u003c/td>\u003ctd>田中二郎, 下村三郎, 色川幸太郎, 大隅健一郎, 小川信雄, 坂本吉勝\u003c/td>\u003c/tr>\u003ctr>\u003ctd>반대\u003c/td>\u003ctd>가중의 정도는 입법부에 맡길 것. 200조 합헌\u003c/td>\u003ctd>下田武三\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>종전 합헌 판례(最大判昭25.10.11 등)를 \u003cstrong>변경\u003c/strong>.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조는 \u003cstrong>이단\u003c/strong>: 「존속살 가중 \u003cstrong>자체\u003c/strong>는 합헌」+「사형·무기에 \u003cstrong>한정한 정도\u003c/strong>가 위헌」. 「존속살 규정 = 곧 위헌」은 오답(다수 의견).\u003c/li>\u003cli>14조 심사는 \u003cstrong>목적의 합리성 → 수단(가중의 정도)의 합리성\u003c/strong>. 목적은 통과, 수단이 필요 한도를 훨씬 넘어 위헌.\u003c/li>\u003cli>14조 1항 후단은 \u003cstrong>예시\u003c/strong>. 열거에 없는 신분관계 차별도 합리적 근거가 없으면 금지.\u003c/li>\u003cli>효과: 200조 \u003cstrong>전부 무효\u003c/strong> → 존속살에도 \u003cstrong>199조\u003c/strong>. 최고재가 스스로 형을 정함(파기 자판).\u003c/li>\u003cli>최고재 \u003cstrong>최초의 법령위헌\u003c/strong>. 적용위헌이 아니라 조문 자체를 무효로 본 점.\u003c/li>\u003cli>현행법이 아니다. 평7 법률 91호(1995, 현대가나 개정)로 200조 및 다른 존속가중 규정 \u003cstrong>삭제\u003c/strong>. 1973년 이후로는 이미 사문화.\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭25.10.11 / 昭和25(あ)292\u003c/td>\u003ctd>종전 합헌(「인륜의 대본」). 本판결이 변경\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判昭39.5.27 / 昭和37(オ)1472 / 民集18巻4号676頁\u003c/td>\u003ctd>14조 후단 예시·합리성 심사의 선례. 본 판결이 인용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平20.6.4 / 平成18(行ツ)135（생후인지 아동 국적）\u003c/td>\u003ctd>14조 합리성 심사에서 본 판결을 인용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大決平25.9.4（비적출자 상속분）\u003c/td>\u003ctd>같은 14조 프레임. 본 판결 인용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/17-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.courts.go.jp/hanrei/51807/detail2/index.html\" target=\"_blank\" rel=\"noopener\">최고재 판례검색 昭和45(あ)1310\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E5%B0%8A%E5%B1%9E%E6%AE%BA%E9%87%8D%E7%BD%B0%E8%A6%8F%E5%AE%9A%E9%81%95%E6%86%B2%E5%88%A4%E6%B1%BA\" target=\"_blank\" rel=\"noopener\">Wikipedia: 尊属殺重罰規定違憲判決\u003c/a>\u003c/li>\u003cli>행정서사 수험 정리: \u003ca href=\"https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad48-4-4/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>, \u003ca href=\"https://gyosyo.info/%E6%9C%80%e5%A4%A7%e5%88%A4%e6%98%AD48-4-4%EF%BC%9A%E5%B0%8A%E5%B1%9E%E6%AE%BA%E9%87%8D%E7%BD%B0%E8%A6%8F%E5%AE%9A%E3%81%AE%E9%81%95%E6%86%B2%E5%88%A4%E6%B1%BA/\" target=\"_blank\" rel=\"noopener\">행서숙\u003c/a>\u003c/li>\u003c/ul>","search":"尊属殺重罰規定違憲判決（栃木実父殺し事件） 最大判昭48.4.4 항목 내용 ------ ------ 인용 最大判昭48.4.4 （최고재 대법정 1973.4.4） 사건번호 昭和45年 あ 第1310号 사건명 尊属殺人被告事件 판례집 刑集27巻3号265頁 재판장 石田和外（다수. 반대 1） 결론 위헌 . 구 형법 200조 무효 → 보통살인 199조 적용. 징역 2년 6월, 집행유예 3년 과목 헌법（14조 1항 법 아래의 평등）· 형법 대상 조문 구 형법 200조（존속살. 평7 법률 91호로 삭제） 최고재가 법률을 법령위헌 으로 판단한 첫 판결. 별칭은 尊属殺違憲判決·栃木実父殺し事件. 사안 피고인 당시 29세 은 14세부터 실부에게 장기간 학대·성폭력을 당하며 사실상 부부처럼 살게 강제됐다. 직장에서 결혼 상대가 생기자 실부가 격분해 약 10일간 감금·학대했다. 1968.10.5 실부가 집을 나가면 죽이겠다고 덤비자, 피고인은 이 관계에서 벗어나려면 살해 외에는 없다고 보고 목을 졸라 죽인 뒤 자수했다. 기소: 존속살인 구 형법 200조 . 항변: 200조는 헌법 14조 위반으로 무효. 심급 판단 ------ ------ 1심 宇都宮地裁 200조 위헌. 199조 적용, 과잉방위로 형면제 2심 東京高裁 200조 합헌. 최대한 감경해도 하한 징역 3년 6월 → 실형 상고심 최고재 대법정 200조 위헌·무효 . 199조 적용, 징역 2년 6월·집행유예 3년（파기 자판） 구 형법이 만들던 구별 보통살인（199조） 존속살（200조） -- ------------------- ---------------- 구성요건 사람을 죽인 자 자기 또는 배우자의 직계존속 을 죽인 자 법정형 사형·무기 또는 3년 이상 징역 사형 또는 무기징역만 2회 감경 후 하한 집행유예 가능 징역 3년 6월 （집행유예 불가） 집행유예는 선고형이 징역 3년 이하여야 한다 형법 25조 . 200조는 심신미약 39조 2항 과 작량감경 66조 을 겹쳐도, 무기 → 7년 이상 → 그 반 = 3년 6월 이 하한이라 집행유예를 붙일 수 없었다. 本件처럼 정상을 크게 참작해야 하는 사안에서도 실형밖에 없었다. 쟁점 1. 14조 1항 후단의 열거 인종·신조·성별·사회적 신분·문지 는 한정열거인가, 예시인가. 2. 보통살인 외에 존속살을 두고 형을 가중하는 것 자체 가 14조 1항에 위반하는가. 3. 법정형을 사형·무기만으로 한정한 200조는 14조 1항에 위반하는가. 4. 위헌이라면 本件에 무엇을 적용하는가. 판시 1. 심사 태도（14조 1항） 14조 1항은 법 아래의 평등을 보장한다. 후단 열거는 예시 다. 평등의 요청은, 사안의 성질에 맞는 합리적 근거가 없는 한 차별 취급을 금지한다（最大判昭39.5.27 전원일치 공무원 지정석 사건 등）. 200조는 피해자와 가해자의 특별 신분관계에 기해, 199조와 같은 유형의 행위에 형을 가중하는 가중적 신분범 이다. 199조 외에 200조를 둔 것은 14조 1항의 차별 취급에 해당한다. 위헌 여부는 그 차별이 합리적 근거에 기하는가 로 정한다. 2. 가중 자체는 합헌（목적） 200조의 입법목적은, 존속살이 보통살인보다 일반적으로 고도의 사회적·도의적 비난에 값하므로 더 엄히 처벌해 특히 강하게 금압하려는 데 있다. 존속에 대한 존중·보은은 사회생활상 기본적 도의이고, 그 자연적 정애·보편 윤리의 유지는 형법상 보호에 값한다. 따라서 - 피해자가 존속임을 양형상 중시하는 것 - 나아가 이를 유형화해 법률상 가중요건 으로 두는 것 은 곧 합리적 근거를 결한다고 단정할 수 없고, 14조 1항 위반이라고 할 수도 없다. 3. 수단이 극단 → 위헌（200조 전체 무효） 가중 정도 가 극단이면 차별의 합리성을 부정해야 한다. 목적 달성의 수단으로 현저히 균형을 잃고 정당화할 근거를 찾기 어려우면, 그 차별은 현저히 불합리하고 14조 1항에 위반해 무효 다. 200조를 이 관점에서 보면: 1. 법정형이 사형·무기뿐이라, 199조 사형·무기·3년 이상 징역 보다 형종 선택이 극히 무거운 형에만 한정된다. 2. 법이 허용하는 2회 감경을 해도 처단형 하한이 징역 3년 6월이라, 아무리 작량할 정상이 있어도 집행유예가 법률상 불가능 하다. 3. 비난받을 바 없는 존속을 고의로 죽인 경우에도, 보통살인 규정으로 엄벌 목적은 달성 가능하다. 4. 반대로 존속이 비도한 행위를 하여 비속이 살해에 이른 사례도 있고, 그때 비속의 행위가 200조의 중형으로 임할 만큼 가혹한 비난에 값한다고 보기 어렵다. 양형 실태상 법정형 그대로 가는 예는 거의 없고, 2회 감경·하한 3년 6월 선고도 드물지 않다. 존속살 법정형은 사형 또는 무기에 한정된 점에서 현행 형법상 외환유치죄를 제외하면 가장 무거움 너무 가혹하다. 존속에 대한 경애·보은이라는 윤리 유지의 관점만으로는 납득할 설명이 되지 않고, 합리적 근거에 기한 차별로 정당화할 수 없다. 따라서 200조는, 존속살의 법정형을 사형과 무기징역에만 한정한 점에서, 입법목적 달성에 필요한 한도를 훨씬 넘어 199조에 비해 현저히 불합리한 차별 취급을 하는 것으로 인정되고, 헌법 14조 1항에 위반하여 무효다. 존속살에도 199조를 적용할 수밖에 없다. 4. 本件 적용 200조 무효이므로 199조를 적용. 원심 200조 적용·징역 3년 6월 파기. 심신미약 등을 참작해 징역 2년 6월, 3년간 집행유예. 의견 분포（15인） 입장 내용 재판관 ------ ------ -------- 다수 가중 자체는 합헌, 형 한정 사형·무기만 이 위헌 石田和外, 岩田誠, 村上朝一, 関根小郷, 藤林益三, 岡原昌男, 岸盛一, 天野武一 의견 결론 위헌 찬성. 존속살 규정을 두는 것 자체 가 14조 위반 田中二郎, 下村三郎, 色川幸太郎, 大隅健一郎, 小川信雄, 坂本吉勝 반대 가중의 정도는 입법부에 맡길 것. 200조 합헌 下田武三 종전 합헌 판례 最大判昭25.10.11 등 를 변경 . 시험 포인트 - 구조는 이단 : 「존속살 가중 자체 는 합헌」+「사형·무기에 한정한 정도 가 위헌」. 「존속살 규정 = 곧 위헌」은 오답 다수 의견 . - 14조 심사는 목적의 합리성 → 수단 가중의 정도 의 합리성 . 목적은 통과, 수단이 필요 한도를 훨씬 넘어 위헌. - 14조 1항 후단은 예시 . 열거에 없는 신분관계 차별도 합리적 근거가 없으면 금지. - 효과: 200조 전부 무효 → 존속살에도 199조 . 최고재가 스스로 형을 정함 파기 자판 . - 최고재 최초의 법령위헌 . 적용위헌이 아니라 조문 자체를 무효로 본 점. - 현행법이 아니다. 평7 법률 91호 1995, 현대가나 개정 로 200조 및 다른 존속가중 규정 삭제 . 1973년 이후로는 이미 사문화. 후속·관련 판례 관계 ------ ------ 最大判昭25.10.11 / 昭和25 あ 292 종전 합헌 「인륜의 대본」 . 本판결이 변경 最大判昭39.5.27 / 昭和37 オ 1472 / 民集18巻4号676頁 14조 후단 예시·합리성 심사의 선례. 본 판결이 인용 最大判平20.6.4 / 平成18 行ツ 135（생후인지 아동 국적） 14조 합리성 심사에서 본 판결을 인용 最大決平25.9.4（비적출자 상속분） 같은 14조 프레임. 본 판결 인용 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/17-3.html - 최고재 판례검색 昭和45 あ 1310 https://www.courts.go.jp/hanrei/51807/detail2/index.html - wikipedia: 尊属殺重罰規定違憲判決 https://ja.wikipedia.org/wiki/%e5%b0%8a%e5%b1%9e%e6%ae%ba%e9%87%8d%e7%bd%b0%e8%a6%8f%e5%ae%9a%e9%81%95%e6%86%b2%e5%88%a4%e6%b1%ba - 행정서사 수험 정리: 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad48-4-4/ , 행서숙 https://gyosyo.info/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad48-4-4%ef%bc%9a%e5%b0%8a%e5%b1%9e%e6%ae%ba%e9%87%8d%e7%bd%b0%e8%a6%8f%e5%ae%9a%e3%81%ae%e9%81%95%e6%86%b2%e5%88%a4%e6%b1%ba/"},"売春条例事件（大阪市売春取締条例事件）":{"type":"case","subject":"헌법","id":"売春条例事件（大阪市売春取締条例事件）","title":"売春条例事件（大阪市売春取締条例事件）","sub":"最大判昭37.5.30","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最大判昭37.5.30\u003c/strong>（최고재 대법정 1962.5.30）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和31年(あ)第4289号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>大阪市条例第68号違反被告事件\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>刑集16巻5号577頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판장\u003c/td>\u003ctd>横田喜三郎\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>합헌·상고기각. 조례로 형벌을 정할 수 있고, 법률의 수권이 상당 정도 구체적·한정되어 있으면 족하다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（31조 죄형법정주의, 94조 조례, 73조 6호 단서）· 지방자치법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대상 조문\u003c/td>\u003ctd>소화25 오사카시 조례 68호 2조 1항, 구 지방자치법의 벌칙 수권\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>별칭은 大阪市売春取締条例事件·条例による刑罰.\u003c/p>\n\u003ch2>사안\u003c/h2>\n\u003cp>피고인이 1956.2.20 오사카시 내에서 매춘 목적으로 통행 중인 남성을 유인. 「가로 등에서의 매춘 권유행위 등의 단속조례」(소화25 오사카시 조례 68호) 2조 1항 — 매춘 목적으로 가로 기타 공의 장소에서 타인의 신변에 따라다니거나 유인한 자는 \u003cstrong>5천 엔 이하 벌금 또는 구류\u003c/strong> — 위반으로 기소됐다.\u003c/p>\n\u003cp>항변: 조례에 벌칙을 둘 수 있게 한 지방자치법 규정은 수권이 추상적·백지위임이어서 31조에 위반·무효이고, 그 수권에 기한 본 조례도 무효.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>31조는 형벌을 \u003cstrong>법률 그 자체\u003c/strong>로만 정할 것을 요구하는가. 조례로 형벌을 둘 수 있는가.\u003c/li>\u003cli>조례에 벌칙을 둘 때, 법률의 수권은 어느 정도 구체적이어야 하는가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 조례로 형벌을 둘 수 있다\u003c/h3>\n\u003cp>조례는 헌법 92조 지방자치의 본지에 기해, 94조가 법률의 범위 안에서 제정 권능을 인정한 \u003cstrong>자치입법\u003c/strong>이다. 법률의 범위를 넘을 수는 없지만, 그 안에 있는 한 효력이 있다.\u003c/p>\n\u003cp>31조는 형벌이 \u003cstrong>반드시 법률 그 자체\u003c/strong>로 정해져야 한다고까지 요구하지 않는다. 법률의 수권에 의해 그 이하의 법령으로 정하는 것도 가능하다. 이는 73조 6호 단서(정령에 벌칙을 두려면 \u003cstrong>특히 그 법률의 위임\u003c/strong>이 있어야 한다)에서도 분명하다.\u003c/p>\n\u003ch3>2. 수권의 정도 — 정령보다 완화된 기준\u003c/h3>\n\u003cp>법률의 수권이 불특정·일반의 \u003cstrong>백지위임\u003c/strong>이어서는 안 된다.\u003c/p>\n\u003cp>다만 조례는 법률 이하의 법령이라 해도, 공선 의원으로 조직된 지방공공단체 의회의 의결을 거쳐 제정되는 자치입법이다. 행정부가 만드는 명령(정령 등)과는 성질이 다르고, 오히려 국회가 만드는 \u003cstrong>법률에 類한다\u003c/strong>.\u003c/p>\n\u003cp>따라서 조례로 형벌을 정하는 경우에는, 법률의 수권이 \u003cstrong>상당 정도 구체적이고 한정\u003c/strong>되어 있으면 족하다.\u003c/p>\n\u003cp>지방자치법이 정하는 사무 내용과 벌칙의 상한(당시 2년 이하 징역·금고, 벌금 등)은 그 정도를 충족한다. 본 조례의 벌칙 수권·본 조례는 31조에 위반하지 않는다.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>구조: \u003cstrong>31조 = 법률만 가능\u003c/strong>이 오답. 법률의 수권이 있으면 하위 법령으로도 형벌 가능.\u003c/li>\u003cli>정령 vs 조례: 정령은 「특히 그 법률의 위임」(73조 6호 단서)이 필요하고 엄격. 조례는 민주적 정당성(의회 의결) 때문에 \u003cstrong>相当程度に具体的かつ限定\u003c/strong>이면 족하다.\u003c/li>\u003cli>백지위임 금지는 공통. 「조례는 법률과 같다」까지는 아니고 \u003cstrong>類하는 자치입법\u003c/strong>.\u003c/li>\u003cli>현행 지방자치법 14조 3항(조례 중 벌칙: 2년 이하 구금형, 100만 엔 이하 벌금 등)이 그 수권의 후신. 조문 번호·형량은 개정됨.\u003c/li>\u003cli>별도 축: 조례는 94조 「법률의 범위 내」. 徳島市公安条例(最大判昭50.9.10)는 법률과 조례의 저촉.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.cc.kyoto-su.ac.jp/~suga/hanrei/94-3.html\" target=\"_blank\" rel=\"noopener\">교토산업대 판결문(상고심)\u003c/a>\u003c/li>\u003cli>행정서사 수험 정리: \u003ca href=\"https://gs.kabudata-dll.com/%E6%9C%80%E5%A4%A7%E5%88%A4%E6%98%AD37-5-30/\" target=\"_blank\" rel=\"noopener\">행정서사 스텝노트\u003c/a>, \u003ca href=\"https://gyosyo.info/%E6%9C%80%E5%A4%A7%E5%88%A4%E6%98%AD37-5-30%EF%BC%9A%E5%A4%A7%E9%98%AA%E5%B8%82%E5%A3%B2%E6%98%A5%E5%8F%96%E7%B7%A0%E6%9D%A1%E4%BE%8B%E4%BA%8B%E4%BB%B6/\" target=\"_blank\" rel=\"noopener\">행서숙\u003c/a>\u003c/li>\u003c/ul>","search":"売春条例事件（大阪市売春取締条例事件） 最大判昭37.5.30 항목 내용 ------ ------ 인용 最大判昭37.5.30 （최고재 대법정 1962.5.30） 사건번호 昭和31年 あ 第4289号 사건명 大阪市条例第68号違反被告事件 판례집 刑集16巻5号577頁 재판장 横田喜三郎 결론 합헌·상고기각. 조례로 형벌을 정할 수 있고, 법률의 수권이 상당 정도 구체적·한정되어 있으면 족하다 과목 헌법（31조 죄형법정주의, 94조 조례, 73조 6호 단서）· 지방자치법 대상 조문 소화25 오사카시 조례 68호 2조 1항, 구 지방자치법의 벌칙 수권 별칭은 大阪市売春取締条例事件·条例による刑罰. 사안 피고인이 1956.2.20 오사카시 내에서 매춘 목적으로 통행 중인 남성을 유인. 「가로 등에서의 매춘 권유행위 등의 단속조례」 소화25 오사카시 조례 68호 2조 1항 — 매춘 목적으로 가로 기타 공의 장소에서 타인의 신변에 따라다니거나 유인한 자는 5천 엔 이하 벌금 또는 구류 — 위반으로 기소됐다. 항변: 조례에 벌칙을 둘 수 있게 한 지방자치법 규정은 수권이 추상적·백지위임이어서 31조에 위반·무효이고, 그 수권에 기한 본 조례도 무효. 쟁점 1. 31조는 형벌을 법률 그 자체 로만 정할 것을 요구하는가. 조례로 형벌을 둘 수 있는가. 2. 조례에 벌칙을 둘 때, 법률의 수권은 어느 정도 구체적이어야 하는가. 판시 1. 조례로 형벌을 둘 수 있다 조례는 헌법 92조 지방자치의 본지에 기해, 94조가 법률의 범위 안에서 제정 권능을 인정한 자치입법 이다. 법률의 범위를 넘을 수는 없지만, 그 안에 있는 한 효력이 있다. 31조는 형벌이 반드시 법률 그 자체 로 정해져야 한다고까지 요구하지 않는다. 법률의 수권에 의해 그 이하의 법령으로 정하는 것도 가능하다. 이는 73조 6호 단서 정령에 벌칙을 두려면 특히 그 법률의 위임 이 있어야 한다 에서도 분명하다. 2. 수권의 정도 — 정령보다 완화된 기준 법률의 수권이 불특정·일반의 백지위임 이어서는 안 된다. 다만 조례는 법률 이하의 법령이라 해도, 공선 의원으로 조직된 지방공공단체 의회의 의결을 거쳐 제정되는 자치입법이다. 행정부가 만드는 명령 정령 등 과는 성질이 다르고, 오히려 국회가 만드는 법률에 類한다 . 따라서 조례로 형벌을 정하는 경우에는, 법률의 수권이 상당 정도 구체적이고 한정 되어 있으면 족하다. 지방자치법이 정하는 사무 내용과 벌칙의 상한 당시 2년 이하 징역·금고, 벌금 등 은 그 정도를 충족한다. 본 조례의 벌칙 수권·본 조례는 31조에 위반하지 않는다. 시험 포인트 - 구조: 31조 = 법률만 가능 이 오답. 법률의 수권이 있으면 하위 법령으로도 형벌 가능. - 정령 vs 조례: 정령은 「특히 그 법률의 위임」 73조 6호 단서 이 필요하고 엄격. 조례는 민주적 정당성 의회 의결 때문에 相当程度に具体的かつ限定 이면 족하다. - 백지위임 금지는 공통. 「조례는 법률과 같다」까지는 아니고 類하는 자치입법 . - 현행 지방자치법 14조 3항 조례 중 벌칙: 2년 이하 구금형, 100만 엔 이하 벌금 등 이 그 수권의 후신. 조문 번호·형량은 개정됨. - 별도 축: 조례는 94조 「법률의 범위 내」. 徳島市公安条例 最大判昭50.9.10 는 법률과 조례의 저촉. 원문·참고 - 교토산업대 판결문 상고심 https://www.cc.kyoto-su.ac.jp/~suga/hanrei/94-3.html - 행정서사 수험 정리: 행정서사 스텝노트 https://gs.kabudata-dll.com/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad37-5-30/ , 행서숙 https://gyosyo.info/%e6%9c%80%e5%a4%a7%e5%88%a4%e6%98%ad37-5-30%ef%bc%9a%e5%a4%a7%e9%98%aa%e5%b8%82%e5%a3%b2%e6%98%a5%e5%8f%96%e7%b7%a0%e6%9d%a1%e4%be%8b%e4%ba%8b%e4%bb%b6/"},"箕面忠魂碑・慰霊祭訴訟":{"type":"case","subject":"헌법","id":"箕面忠魂碑・慰霊祭訴訟","title":"箕面忠魂碑・慰霊祭訴訟","sub":"最三小判平5.2.16","chip":{"label":"합헌","cls":"ai"},"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>最三小判平5.2.16\u003c/strong>（최고재 제3소법정 1993.2.16）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건번호\u003c/td>\u003ctd>昭和62年(行ツ)第148号\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사건명\u003c/td>\u003ctd>손해배상 등 청구사건（주민소송）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례집\u003c/td>\u003ctd>民集47巻3号1687頁\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>상고기각. 충혼비 이전·토지 무상대여·위령제 참례 모두 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（20조 3항 정교분리·목적효과기준 / 89조 종교상의 조직·단체）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>사안\u003c/h2>\n\u003cp>大阪府 箕面市는 시립소학교 증축을 위해, 부지 내에 있던 \u003cstrong>충혼비(忠魂碑)를 시 비용으로 대체지에 이전·재건\u003c/strong>하고, 그 대체지를 충혼비를 관리하는 \u003cstrong>시 전몰자유족회에 무상대여\u003c/strong>했다. 또한 시 교육장 등이 유족회 주최의 \u003cstrong>위령제(신식·불식 격년 거행)에 참례\u003c/strong>했다.\u003c/p>\n\u003cp>주민이 이러한 공금지출 등이 헌법 20조 3항·89조에 위반한다며 주민소송을 제기. 1심(大阪地裁)은 일부 위헌으로 봤으나, 2심(大阪高裁)이 역전 합헌 → 주민 측 상고.\u003c/p>\n\u003ch2>쟁점\u003c/h2>\n\u003col>\u003cli>충혼비의 이전·재건과 부지 무상대여는 「종교적 활동」(20조 3항)인가.\u003c/li>\u003cli>유족회는 89조의 「종교상의 조직 또는 단체」에 해당하는가.\u003c/li>\u003cli>교육장 등의 위령제 참례는 종교적 활동인가.\u003c/li>\u003c/ol>\n\u003ch2>판시\u003c/h2>\n\u003ch3>1. 충혼비의 성격과 이전·무상대여\u003c/h3>\n\u003cp>本件 충혼비는 전몰자 기념비적 성격의 것이다. 이전·재건과 무상대여의 \u003cstrong>목적은 소학교 증축이라는 전적으로 세속적인 것\u003c/strong>이고, 그 효과도 특정 종교를 원조·조장·촉진하거나 타종교에 압박·간섭을 가하는 것이 아니다 → 목적효과기준상 종교적 활동에 해당하지 않는다.\u003c/p>\n\u003ch3>2. 유족회의 성격（89조）\u003c/h3>\n\u003cp>89조의 「종교상의 조직 또는 단체」란 \u003cstrong>특정 종교의 신앙·예배·보급 등 종교적 활동을 행하는 것을 본래의 목적으로 하는 조직·단체\u003c/strong>를 말한다. 유족회는 전몰자 유족의 상호부조·복지향상 등을 목적으로 하는 단체로 이에 해당하지 않는다.\u003c/p>\n\u003ch3>3. 위령제 참례\u003c/h3>\n\u003cp>교육장 등의 참례는 \u003cstrong>전몰자 유족에 대한 위문·사회적 의례\u003c/strong>로서, 목적·효과에 비추어 종교적 활동에 해당하지 않는다.\u003c/p>\n\u003cp>→ 모두 합헌. 상고기각.\u003c/p>\n\u003ch2>시험 포인트\u003c/h2>\n\u003cul>\u003cli>津地鎮祭의 \u003cstrong>목적효과기준을 그대로 적용해 합헌\u003c/strong>으로 결론 낸 대표 사례.\u003c/li>\u003cli>89조 「종교상의 조직 또는 단체」의 \u003cstrong>정의(본래 목적 기준)\u003c/strong>를 판시한 판례 — 유족회·자치회 등의 해당성 문제로 출제된다.\u003c/li>\u003cli>충혼비 = 종교시설이 아니라 \u003cstrong>기념비\u003c/strong>라는 성격 판단이 출발점. 시설의 성격 평가가 결론을 좌우하는 구조(孔子廟訴訟과 대비).\u003c/li>\u003c/ul>\n\u003ch2>후속·관련\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>관계\u003c/th>\u003c/tr>\u003ctr>\u003ctd>最大判昭52.7.13 / 津地鎮祭事件\u003c/td>\u003ctd>목적효과기준의 원조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判平9.4.2 / 愛媛玉串料訴訟\u003c/td>\u003ctd>같은 기준으로 위헌 결론\u003c/td>\u003c/tr>\u003ctr>\u003ctd>最大判令3.2.24 / 孔子廟訴訟\u003c/td>\u003ctd>시설의 종교성을 긍정해 위헌(종합고려 틀)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://www.courts.go.jp/app/hanrei_jp/search1\" target=\"_blank\" rel=\"noopener\">裁判所 판례검색: 最判平5.2.16\u003c/a>（사건번호 昭和62(行ツ)148로 검색）\u003c/li>\u003cli>\u003ca href=\"https://ja.wikipedia.org/wiki/%E7%AE%95%E9%9D%A2%E5%BF%A0%E9%AD%82%E7%A2%91%E8%A8%B4%E8%A8%9F\" target=\"_blank\" rel=\"noopener\">Wikipedia: 箕面忠魂碑訴訟\u003c/a>\u003c/li>\u003c/ul>","search":"箕面忠魂碑・慰霊祭訴訟 最三小判平5.2.16 항목 내용 ------ ------ 인용 最三小判平5.2.16 （최고재 제3소법정 1993.2.16） 사건번호 昭和62年 行ツ 第148号 사건명 손해배상 등 청구사건（주민소송） 판례집 民集47巻3号1687頁 결론 상고기각. 충혼비 이전·토지 무상대여·위령제 참례 모두 합헌 과목 헌법（20조 3항 정교분리·목적효과기준 / 89조 종교상의 조직·단체） 사안 大阪府 箕面市는 시립소학교 증축을 위해, 부지 내에 있던 충혼비 忠魂碑 를 시 비용으로 대체지에 이전·재건 하고, 그 대체지를 충혼비를 관리하는 시 전몰자유족회에 무상대여 했다. 또한 시 교육장 등이 유족회 주최의 위령제 신식·불식 격년 거행 에 참례 했다. 주민이 이러한 공금지출 등이 헌법 20조 3항·89조에 위반한다며 주민소송을 제기. 1심 大阪地裁 은 일부 위헌으로 봤으나, 2심 大阪高裁 이 역전 합헌 → 주민 측 상고. 쟁점 1. 충혼비의 이전·재건과 부지 무상대여는 「종교적 활동」 20조 3항 인가. 2. 유족회는 89조의 「종교상의 조직 또는 단체」에 해당하는가. 3. 교육장 등의 위령제 참례는 종교적 활동인가. 판시 1. 충혼비의 성격과 이전·무상대여 本件 충혼비는 전몰자 기념비적 성격의 것이다. 이전·재건과 무상대여의 목적은 소학교 증축이라는 전적으로 세속적인 것 이고, 그 효과도 특정 종교를 원조·조장·촉진하거나 타종교에 압박·간섭을 가하는 것이 아니다 → 목적효과기준상 종교적 활동에 해당하지 않는다. 2. 유족회의 성격（89조） 89조의 「종교상의 조직 또는 단체」란 특정 종교의 신앙·예배·보급 등 종교적 활동을 행하는 것을 본래의 목적으로 하는 조직·단체 를 말한다. 유족회는 전몰자 유족의 상호부조·복지향상 등을 목적으로 하는 단체로 이에 해당하지 않는다. 3. 위령제 참례 교육장 등의 참례는 전몰자 유족에 대한 위문·사회적 의례 로서, 목적·효과에 비추어 종교적 활동에 해당하지 않는다. → 모두 합헌. 상고기각. 시험 포인트 - 津地鎮祭의 목적효과기준을 그대로 적용해 합헌 으로 결론 낸 대표 사례. - 89조 「종교상의 조직 또는 단체」의 정의 본래 목적 기준 를 판시한 판례 — 유족회·자치회 등의 해당성 문제로 출제된다. - 충혼비 = 종교시설이 아니라 기념비 라는 성격 판단이 출발점. 시설의 성격 평가가 결론을 좌우하는 구조 孔子廟訴訟과 대비 . 후속·관련 판례 관계 ------ ------ 最大判昭52.7.13 / 津地鎮祭事件 목적효과기준의 원조 最大判平9.4.2 / 愛媛玉串料訴訟 같은 기준으로 위헌 결론 最大判令3.2.24 / 孔子廟訴訟 시설의 종교성을 긍정해 위헌 종합고려 틀 원문·참고 - 裁判所 판례검색: 最判平5.2.16 https://www.courts.go.jp/app/hanrei_jp/search1 （사건번호 昭和62 行ツ 148로 검색） - wikipedia: 箕面忠魂碑訴訟 https://ja.wikipedia.org/wiki/%e7%ae%95%e9%9d%a2%e5%bf%a0%e9%ad%82%e7%a2%91%e8%a8%b4%e8%a8%9f"},"私人間効力":{"type":"term","subject":"용어","id":"私人間効力","title":"私人間効力","sub":"しじんかんこうりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しじんかんこうりょく（사인간 효력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>헌법의 인권 규정이 사인(私人) 상호 간의 법률관계에도 효력을 미치는가의 문제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong> — 민법 90조(공서양속) 등 사법의 일반조항을 매개로 간접적으로 적용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한국 비교\u003c/td>\u003ctd>\u003ca href=\"#/e/%EA%B8%B0%EB%B3%B8%EA%B6%8C%EC%9D%98%20%EB%8C%80%EC%82%AC%EC%9D%B8%EC%A0%81%20%ED%9A%A8%EB%A0%A5\">기본권의 대사인적 효력\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>원래 헌법상의 인권(기본권) 규정은 \u003cstrong>「국가권력 vs 국민」\u003c/strong>의 관계에서 국가의 권력 남용으로부터 국민을 보호하기 위해 만들어졌다. 그런데 현대 사회에서는 대기업, 사립대학, 거대 언론사 등 막강한 힘을 가진 \u003cstrong>사인(私人, 개인이나 민간 단체)\u003c/strong>이 일반 개인의 인권을 침해하는 일이 잦아졌다.\u003c/p>\n\u003cp>여기서 \u003cstrong>「사인과 사인 사이의 분쟁에도 헌법의 인권 규정을 적용할 수 있는가?」\u003c/strong>를 다루는 주제가 바로 '사인간 효력'이다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>무효력설（적용 부정설）\u003c/td>\u003ctd>헌법은 국가와 국민 사이에만 적용, 사인 간에는 적용되지 않음\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>직접적용설\u003c/td>\u003ctd>사인 간에도 헌법의 인권 규정을 직접 적용하여 위헌 여부를 판단\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>간접적용설（間接適用説）\u003c/strong>\u003c/td>\u003ctd>헌법을 직접 적용하지 않고, \u003cstrong>민법의 일반조항(90조 공서양속, 709조 불법행위 등)을 해석할 때 헌법의 인권 보장 취지를 반영\u003c/strong>하여 간접적으로 효력을 미치게 함\u003c/td>\u003ctd>👉 \u003cstrong>판례·통설\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>대립 구도\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>三菱樹脂事件（미쓰비시 수지 사건）\u003c/td>\u003ctd>最大判昭48.12.12 / 民集27巻11号1536頁\u003c/td>\u003ctd>사상의 자유 vs 기업의 채용의 자유\u003c/td>\u003ctd>\u003cstrong>기업 승소\u003c/strong>. 기업에는 채용의 자유(영업의 자유)가 있어, 특정 사상을 이유로 한 본채용 거부도 민법 90조 위반 아님（간접적용설 채택, 다만 근로자 구제는 부정）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>昭和女子大事件（쇼와 여자대학 사건）\u003c/td>\u003ctd>最三小判昭49.7.19 / 民集28巻5号790頁\u003c/td>\u003ctd>정치적 자유 vs 사립학교의 자율성\u003c/td>\u003ctd>\u003cstrong>학교 승소\u003c/strong>. 사립대학은 독자적 건학 이념에 따른 학칙 제정의 자율성이 있고, 퇴학 처분이 사회통념상 현저히 타당성을 잃지 않는 한 유효\u003c/td>\u003c/tr>\u003ctr>\u003ctd>日産自動車事件（닛산 자동차 사건）\u003c/td>\u003ctd>最三小判昭56.3.24 / 民集35巻2号300頁\u003c/td>\u003ctd>평등권 vs 성차별적 취업규칙（남 60세·여 55세 정년）\u003c/td>\u003ctd>\u003cstrong>여성 근로자 승소\u003c/strong>. 성별만을 이유로 한 불합리한 차별은 헌법 14조의 취지에 반하여 민법 90조(공서양속) 위반으로 \u003cstrong>무효\u003c/strong>（간접적용설로 실제 구제된 대표례）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「직접 적용한다」는 지문은 무조건 오답!\u003c/strong> 일본 판례는 예외 없이 간접적용설(민법 90조 등을 매개)을 취한다.\u003c/li>\u003cli>각 판례의 결과가 \u003cstrong>유효(기업·학교 승소)\u003c/strong>인지 \u003cstrong>무효(개인 승소)\u003c/strong>인지 짝지어 암기: 三菱·昭和女子大 = 유효 / 日産 = 무효.\u003c/li>\u003cli>三菱樹脂事件은 「채용 단계에서의 사상 조사도 위법이 아니다」라는 판시까지 세트로 출제된다.\u003c/li>\u003c/ul>","search":"私人間効力 しじんかんこうりょく 항목 내용 ------ ------ 읽기 しじんかんこうりょく（사인간 효력） 과목 헌법（인권총론） 한줄 정의 헌법의 인권 규정이 사인 私人 상호 간의 법률관계에도 효력을 미치는가의 문제 통설·판례 간접적용설 — 민법 90조 공서양속 등 사법의 일반조항을 매개로 간접적으로 적용 한국 비교 기본권의 대사인적 효력 한국비교/기본권의%20대사인적%20효력.md 개념 원래 헌법상의 인권 기본권 규정은 「국가권력 vs 국민」 의 관계에서 국가의 권력 남용으로부터 국민을 보호하기 위해 만들어졌다. 그런데 현대 사회에서는 대기업, 사립대학, 거대 언론사 등 막강한 힘을 가진 사인 私人, 개인이나 민간 단체 이 일반 개인의 인권을 침해하는 일이 잦아졌다. 여기서 「사인과 사인 사이의 분쟁에도 헌법의 인권 규정을 적용할 수 있는가?」 를 다루는 주제가 바로 '사인간 효력'이다. 학설 학설 내용 비고 ------ ------ ------ 무효력설（적용 부정설） 헌법은 국가와 국민 사이에만 적용, 사인 간에는 적용되지 않음 직접적용설 사인 간에도 헌법의 인권 규정을 직접 적용하여 위헌 여부를 판단 간접적용설（間接適用説） 헌법을 직접 적용하지 않고, 민법의 일반조항 90조 공서양속, 709조 불법행위 등 을 해석할 때 헌법의 인권 보장 취지를 반영 하여 간접적으로 효력을 미치게 함 👉 판례·통설 관련 판례 판례 인용 대립 구도 결론 ------ ------ ----------- ------ 三菱樹脂事件（미쓰비시 수지 사건） 最大判昭48.12.12 / 民集27巻11号1536頁 사상의 자유 vs 기업의 채용의 자유 기업 승소 . 기업에는 채용의 자유 영업의 자유 가 있어, 특정 사상을 이유로 한 본채용 거부도 민법 90조 위반 아님（간접적용설 채택, 다만 근로자 구제는 부정） 昭和女子大事件（쇼와 여자대학 사건） 最三小判昭49.7.19 / 民集28巻5号790頁 정치적 자유 vs 사립학교의 자율성 학교 승소 . 사립대학은 독자적 건학 이념에 따른 학칙 제정의 자율성이 있고, 퇴학 처분이 사회통념상 현저히 타당성을 잃지 않는 한 유효 日産自動車事件（닛산 자동차 사건） 最三小判昭56.3.24 / 民集35巻2号300頁 평등권 vs 성차별적 취업규칙（남 60세·여 55세 정년） 여성 근로자 승소 . 성별만을 이유로 한 불합리한 차별은 헌법 14조의 취지에 반하여 민법 90조 공서양속 위반으로 무효 （간접적용설로 실제 구제된 대표례） 💡 수험 팁 - 「직접 적용한다」는 지문은 무조건 오답! 일본 판례는 예외 없이 간접적용설 민법 90조 등을 매개 을 취한다. - 각 판례의 결과가 유효 기업·학교 승소 인지 무효 개인 승소 인지 짝지어 암기: 三菱·昭和女子大 = 유효 / 日産 = 무효. - 三菱樹脂事件은 「채용 단계에서의 사상 조사도 위법이 아니다」라는 판시까지 세트로 출제된다."},"기본권의 대사인적 효력":{"type":"kr","subject":"한국비교","id":"기본권의 대사인적 효력","title":"기본권의 대사인적 효력","sub":"대법원 2010.4.22. 선고 2008다38288 전원합의체 판결","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>대응 일본 항목\u003c/td>\u003ctd>\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인용\u003c/td>\u003ctd>\u003cstrong>대법원 2010.4.22. 선고 2008다38288 전원합의체 판결\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（기본권 총론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>. 기본권은 민법 2조·103조·750조·751조 등 사법상 일반원칙을 매개로 간접적으로 사법관계에 효력을 미침\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>한국의 법리\u003c/h2>\n\u003cp>한국에서도 통설·판례는 \u003cstrong>간접적용설\u003c/strong>이다. 대법원은 종립 사립고 종교교육 사건(2008다38288 전합)에서 이를 명시적으로 선언했다.\u003c/p>\n\u003cblockquote>헌법상의 기본권은 제1차적으로 개인의 자유로운 영역을 공권력의 침해로부터 보호하기 위한 방어적 권리이지만 다른 한편으로 헌법의 기본적인 결단인 객관적인 가치질서를 구체화한 것으로서, 사법(私法)을 포함한 모든 법 영역에 그 영향을 미치는 것이므로 사인간의 사적인 법률관계도 헌법상의 기본권 규정에 적합하게 규율되어야 한다. 다만 \u003cstrong>기본권 규정은 그 성질상 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 사법상의 일반원칙을 규정한 민법 제2조, 제103조, 제750조, 제751조 등의 내용을 형성하고 그 해석 기준이 되어 간접적으로 사법관계에 효력을 미치게 된다.\u003c/strong>\u003c/blockquote>\n\u003cp>매개 조항: 민법 \u003cstrong>2조\u003c/strong>(신의성실)·\u003cstrong>103조\u003c/strong>(공서양속)·\u003cstrong>750조\u003c/strong>(불법행위)·\u003cstrong>751조\u003c/strong>(비재산적 손해).\u003c/p>\n\u003cp>위법성 판단은 「\u003cstrong>사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과\u003c/strong>했는지」를 기준으로 한다.\u003c/p>\n\u003cp>한편 헌법상 환경권처럼 \u003cstrong>직접 사법상 권리를 발생시키지 않는다\u003c/strong>고 본 선례도 있어(94마2218), 직접적용설은 배척되는 방향이다.\u003c/p>\n\u003ch2>대표 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>종립 사립고 종교교육 사건\u003c/strong>（대광고·강의석 사건）\u003c/td>\u003ctd>대법원 2010.4.22. 선고 2008다38288 전합\u003c/td>\u003ctd>추첨 배정된 기독교계 사립고가 종교수업·예배 참가를 사실상 강제하고, 항의한 학생을 퇴학 처분\u003c/td>\u003ctd>\u003cstrong>파기환송\u003c/strong>（학교법인 부분）. 종교교육이 용인 한계를 넘으면 불법행위. 환송심에서 위자료 1,500만원 → \u003cstrong>학생 승소\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>서울YMCA 여성 총회원 배제 사건\u003c/strong>\u003c/td>\u003ctd>대법원 2011.1.27. 선고 2009다19864\u003c/td>\u003ctd>남성에게는 심사 없이 총회원 자격을 주면서 여성은 성별만을 이유로 자격 심사에서 원천 배제\u003c/td>\u003ctd>\u003cstrong>상고기각 → 여성 승소 확정\u003c/strong>. 평등권 침해가 민법 750조를 통해 인격적 법익 침해로 구체화. 위자료 각 1,000만원\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>종중 여성 종원 사건\u003c/strong>\u003c/td>\u003ctd>대법원 2005.7.21. 선고 2002다1178 전합\u003c/td>\u003ctd>성년 남자만 종중 구성원으로 보던 관습법\u003c/td>\u003ctd>\u003cstrong>파기환송\u003c/strong>. 변화된 전체 법질서에 부합하지 않아 관습법의 효력 부정（원칙적 장래효, 당해 사건은 소급 적용）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>청담공원 골프연습장 사건\u003c/strong>\u003c/td>\u003ctd>대법원 1995.5.23.자 94마2218 결정\u003c/td>\u003ctd>헌법상 환경권을 직접 근거로 공사금지 가처분 신청\u003c/td>\u003ctd>\u003cstrong>재항고 기각\u003c/strong>. 환경권 규정만으로는 개개 국민에게 직접 구체적 사법상 권리를 부여한 것이 아님\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>서울YMCA 사건은 위 2008다38288의 간접적용 법리를 그대로 원용하면서 다음을 판시했다.\u003c/p>\n\u003cblockquote>사적 단체를 포함하여 사회공동체 내에서 개인이 성별에 따른 불합리한 차별을 받지 아니하는 것은 … 인격권 실현의 본질적 부분에 해당하므로 \u003cstrong>평등권이라는 기본권의 침해도 민법 제750조의 일반규정을 통하여 사법상 보호되는 인격적 법익침해의 형태로 구체화되어 논하여질 수 있다\u003c/strong>\u003c/blockquote>\n\u003ch2>일본과의 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>논점\u003c/th>\u003cth>일본\u003c/th>\u003cth>한국\u003c/th>\u003c/tr>\u003ctr>\u003ctd>기본 입장\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>（三菱樹脂事件 最大判昭48.12.12）\u003c/td>\u003ctd>\u003cstrong>간접적용설\u003c/strong>（2008다38288 전합） — 동일\u003c/td>\u003c/tr>\u003ctr>\u003ctd>매개 조항\u003c/td>\u003ctd>民法 90조（공서양속）, 709조（불법행위）, 1조\u003c/td>\u003ctd>민법 103조（공서양속）, 750조·751조（불법행위）, 2조 — 구조 동일\u003c/td>\u003c/tr>\u003ctr>\u003ctd>성차별 사안의 처리\u003c/td>\u003ctd>\u003cstrong>日産自動車事件\u003c/strong>（最判昭56.3.24）: 남녀 정년 차등 취업규칙을 민법 90조 위반으로 \u003cstrong>무효\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>서울YMCA 사건\u003c/strong>: 민법 750조 \u003cstrong>불법행위 손해배상\u003c/strong>으로 구제\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사립학교 사안의 처리\u003c/td>\u003ctd>\u003cstrong>昭和女子大事件\u003c/strong>（最判昭49.7.19）: 사립대의 자율성 존중 → \u003cstrong>학교 승소\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>대광고 사건\u003c/strong>: 종교교육 강제의 한계 초과 인정 → \u003cstrong>학생 승소\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위법성 기준\u003c/td>\u003ctd>「사회통념상 현저히 타당성을 잃었는지」\u003c/td>\u003ctd>「사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과했는지」\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>비교 포인트\u003c/strong>\u003c/p>\n\u003cul>\u003cli>총론(간접적용설·매개 조항)은 한일이 거의 동일하다. 일본 민법 90조 ↔ 한국 민법 103조, 일본 709조 ↔ 한국 750조가 대응한다.\u003c/li>\u003cli>차이는 \u003cstrong>구제 경로\u003c/strong>다. 일본 日産自動車는 공서양속 위반으로 취업규칙 자체를 \u003cstrong>무효\u003c/strong>로 만든 반면, 한국 서울YMCA는 \u003cstrong>불법행위 손해배상\u003c/strong>으로 갔다. 「무효 확인이냐 금전배상이냐」가 좋은 대비 소재.\u003c/li>\u003cli>\u003cstrong>사립학교의 자율성\u003c/strong> 국면에서는 결론이 갈린다. 일본 昭和女子大는 학교의 자율성을 우선했고, 한국 대광고는 학생의 종교의 자유를 우선했다. 다만 대광고는 \u003cstrong>추첨 배정(학교 선택의 자유가 없음)\u003c/strong>이라는 사정이 결정적이었다는 점에 유의.\u003c/li>\u003cli>한국 헌법재판소가 대사인효를 정면으로 판시한 대표 결정은 확인되지 않는다. 헌재 차원에서는 \u003cstrong>국가의 기본권보호의무\u003c/strong> 법리(기본권 3각관계)로 접근하는 것으로 설명된다.\u003c/li>\u003c/ul>\n\u003ch2>원문·참고\u003c/h2>\n\u003cul>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2008%EB%8B%A438288\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://www.law.go.kr/LSW/precInfoP.do?mode=0&amp;evtNo=2008%EB%8B%A438288\" target=\"_blank\" rel=\"noopener\">국가법령정보센터: 2008다38288\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2009%EB%8B%A419864\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2011.1.27. 선고 2009다19864 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://scourt.go.kr/portal/news/NewsViewAction.work?gubun=4&amp;seqnum=3013\" target=\"_blank\" rel=\"noopener\">대법원 판례속보: 2009다19864\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/2002%EB%8B%A41178\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 2005.7.21. 선고 2002다1178 전원합의체 판결\u003c/a>\u003c/li>\u003cli>\u003ca href=\"https://casenote.kr/%EB%8C%80%EB%B2%95%EC%9B%90/94%EB%A7%882218\" target=\"_blank\" rel=\"noopener\">casenote: 대법원 1995.5.23.자 94마2218 결정\u003c/a>\u003c/li>\u003c/ul>\n\u003cblockquote>미확인 사항: 대광고 사건 환송심 판결의 확정 일자, 서울YMCA 사건 원고 수(38명)·위자료 액수는 2차 요약에서 확인한 것으로 인용 시 원문 재확인 필요.\u003c/blockquote>","search":"기본권의 대사인적 효력 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 항목 내용 ------ ------ 대응 일본 항목 私人間効力 용어/私人間効力.md 인용 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 과목 헌법（기본권 총론） 결론 간접적용설 . 기본권은 민법 2조·103조·750조·751조 등 사법상 일반원칙을 매개로 간접적으로 사법관계에 효력을 미침 한국의 법리 한국에서도 통설·판례는 간접적용설 이다. 대법원은 종립 사립고 종교교육 사건 2008다38288 전합 에서 이를 명시적으로 선언했다. 헌법상의 기본권은 제1차적으로 개인의 자유로운 영역을 공권력의 침해로부터 보호하기 위한 방어적 권리이지만 다른 한편으로 헌법의 기본적인 결단인 객관적인 가치질서를 구체화한 것으로서, 사법 私法 을 포함한 모든 법 영역에 그 영향을 미치는 것이므로 사인간의 사적인 법률관계도 헌법상의 기본권 규정에 적합하게 규율되어야 한다. 다만 기본권 규정은 그 성질상 사법관계에 직접 적용될 수 있는 예외적인 것을 제외하고는 사법상의 일반원칙을 규정한 민법 제2조, 제103조, 제750조, 제751조 등의 내용을 형성하고 그 해석 기준이 되어 간접적으로 사법관계에 효력을 미치게 된다. 매개 조항: 민법 2조 신의성실 · 103조 공서양속 · 750조 불법행위 · 751조 비재산적 손해 . 위법성 판단은 「 사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과 했는지」를 기준으로 한다. 한편 헌법상 환경권처럼 직접 사법상 권리를 발생시키지 않는다 고 본 선례도 있어 94마2218 , 직접적용설은 배척되는 방향이다. 대표 판례 판례 인용 사안 결론 ------ ------ ------ ------ 종립 사립고 종교교육 사건 （대광고·강의석 사건） 대법원 2010.4.22. 선고 2008다38288 전합 추첨 배정된 기독교계 사립고가 종교수업·예배 참가를 사실상 강제하고, 항의한 학생을 퇴학 처분 파기환송 （학교법인 부분）. 종교교육이 용인 한계를 넘으면 불법행위. 환송심에서 위자료 1,500만원 → 학생 승소 서울ymca 여성 총회원 배제 사건 대법원 2011.1.27.
