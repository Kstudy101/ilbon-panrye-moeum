"용어","id":"表現内容規制","title":"表現内容規制","sub":"ひょうげんないようきせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ひょうげんないようきせい（표현 내용 규제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>표현이 전달하는 \u003cstrong>메시지의 내용\u003c/strong>(주제·관점)을 이유로 그 표현을 규제하는 것\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>정부에 의한 사상 통제·정보 조작으로 이어질 위험이 크므로 \u003cstrong>가장 엄격한 기준\u003c/strong>으로 심사해야 한다는 것이 통설. 다만 최고재가 「内容規制／内容中立規制」라는 용어를 정면으로 사용해 심사 기준을 나눈 예는 없다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>표현의 자유(\u003cstrong>21조 1항\u003c/strong>)에 대한 규제는 학설상 두 가지로 나뉜다. \u003cstrong>표현 내용 규제(表現内容規制)\u003c/strong>는 「무엇을 말했는가」, 즉 메시지의 내용을 이유로 하는 규제이고, \u003cstrong>표현 내용 중립 규제(表現内容中立規制)\u003c/strong>는 내용과 무관하게 표현의 \u003cstrong>시간·장소·방법\u003c/strong>만을 규율하는 규제다. 이를 \u003cstrong>二分論(이분론)\u003c/strong>이라 한다.\u003c/p>\n\u003cp>내용 규제를 엄격히 심사해야 하는 이유는, 정부가 「그 표현은 허위다·위험하다·부도덕하다·가치가 없다」고 판단해 규제하는 것을 허용하면 \u003cstrong>정부에 의한 자의적 사상 통제\u003c/strong>로 직결되기 때문이다. 특히 특정 \u003cstrong>관점(観点)\u003c/strong>만을 겨냥하는 \u003cstrong>관점 규제(観点規制)\u003c/strong>는 사상의 자유시장 자체를 왜곡하므로 원칙적으로 위헌이라고 본다. 반면 내용 중립 규제는 정부가 자기에게 불리한 표현만 골라 억압할 위험이 작고, 다른 시간·장소·방법으로 표현할 \u003cstrong>대체 경로\u003c/strong>가 남아 있으므로 완화된 기준(중간 심사, \u003cstrong>\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>\u003c/strong> 등)으로 족하다고 설명된다.\u003c/p>\n\u003cp>다만 이분론은 만능이 아니다. 삐라 배포·입간판·현수막처럼 \u003cstrong>돈이 들지 않는 표현 수단\u003c/strong>을 방법 규제로 봉쇄하면, 형식은 내용 중립이어도 실질적으로는 특정 계층·특정 주장의 표현을 전면 차단하는 결과가 된다는 비판이 유력하다.\u003c/p>\n\u003cp>\u003cstrong>대비: 表現内容規制 ↔ 表現内容中立規制\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>表現内容規制\u003c/th>\u003cth>表現内容中立規制\u003c/th>\u003c/tr>\u003ctr>\u003ctd>규제 이유\u003c/td>\u003ctd>메시지의 \u003cstrong>내용·관점\u003c/strong>\u003c/td>\u003ctd>표현의 \u003cstrong>시간·장소·방법\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>위험성\u003c/td>\u003ctd>정부의 사상 통제·정보 조작\u003c/td>\u003ctd>상대적으로 낮음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심사 기준\u003c/td>\u003ctd>\u003cstrong>엄격\u003c/strong>(명백하고 현재의 위험 등)\u003c/td>\u003ctd>완화(중간 심사·\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대체 경로\u003c/td>\u003ctd>남지 않음\u003c/td>\u003ctd>다른 방법으로 표현 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>예\u003c/td>\u003ctd>명예훼손·선동·외설·유해도서 지정\u003c/td>\u003ctd>옥외광고물 규제, 호별방문 금지, 소음 규제\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>二分論（유력·통설적 이해）\u003c/strong>\u003c/td>\u003ctd>내용 규제는 엄격 심사, 내용 중립 규제는 완화된 심사(중간 심사·LRA)로 심사 기준을 나눈다\u003c/td>\u003ctd>👉 미국 판례법리에서 도입. 학계의 표준적 틀\u003c/td>\u003c/tr>\u003ctr>\u003ctd>二分論 비판설\u003c/td>\u003ctd>내용 중립 규제도 삐라·입간판 등 저비용 표현 수단을 봉쇄하면 실질적으로 내용 규제와 같은 효과를 낳는다. 형식적 분류에 의존하면 위험\u003c/td>\u003ctd>옥외광고물 조례·호별방문 금지의 합헌 판단을 비판하는 논거\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>岐阜県青少年保護育成条例事件（기후현 청소년보호육성조례 사건）\u003c/td>\u003ctd>最三小判平1.9.19\u003c/td>\u003ctd>「有害図書」로 지정된 도서의 자동판매기 수납 금지·처벌\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>（내용에 착안한 규제이지만 청소년 보호의 필요성을 이유로 합헌. 伊藤正己 재판관 보충의견이 유명）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>札幌税関検査事件（삿포로 세관검사 사건）\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>「風俗を害すべき書籍、図画」의 수입 규제\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>（내용에 착안한 규제이나, 「풍속을 해칠」의 의미를 \u003cstrong>외설 표현물에 한정\u003c/strong>하는 합헌한정해석으로 명확성을 확보）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件（북방저널 사건）\u003c/td>\u003ctd>最大判昭61.6.11 / 民集40巻4号872頁\u003c/td>\u003ctd>명예훼손 기사의 사전 차지\u003c/td>\u003ctd>\u003cstrong>차지 적법\u003c/strong>（명예훼손이라는 \u003cstrong>내용\u003c/strong>을 이유로 한 규제이므로 엄격한 요건 설정 → \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a> 항목 참조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>大阪市屋外広告物条例事件（오사카시 옥외광고물조례 사건）\u003c/td>\u003ctd>最大判昭43.12.18\u003c/td>\u003ctd>전신주 등에 삐라를 붙인 행위의 처벌\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>미관풍치의 유지\u003c/strong>라는 내용 중립적 목적. 「공공복지를 위해 표현의 자유에 대해 허용된 필요하고 합리적인 제한」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>戸別訪問禁止事件（호별방문 금지 사건）\u003c/td>\u003ctd>最三小判昭56.6.15\u003c/td>\u003ctd>공직선거법 138조의 호별방문 전면 금지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 의견 표명 자체가 아니라 \u003cstrong>방법\u003c/strong>의 규제이며, 매수·이해유도의 온상 방지와 선거의 자유·공정 확보가 목적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>猿払事件（사루후츠 사건）\u003c/td>\u003ctd>最大判昭49.11.6\u003c/td>\u003ctd>우편국 직원의 선거 벽보 게시 등 공무원의 정치적 행위 금지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「意見表明そのものの制約を目的とするものではなく、行動のもたらす弊害の防止をねらいとしたもの」라며 \u003cstrong>내용 중립적 규제\u003c/strong>로 구성\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>「어느 쪽 규제인가」를 먼저 판정하는 습관을 들여라. \u003cstrong>「무엇을 말했는지」를 따지면 내용 규제, 「언제·어디서·어떻게 말했는지」만 따지면 내용 중립 규제\u003c/strong>다.\u003c/li>\u003cli>\u003cstrong>최고재는 이분론을 정면으로 채택해 심사 기준을 명시적으로 나눈 적이 없다.\u003c/strong> 「판례는 표현 내용 규제에 대해 엄격 심사 기준을 채택하고 있다」는 지문은 오답 가능성이 높다. 이분론은 어디까지나 \u003cstrong>학설\u003c/strong>이다.\u003c/li>\u003cli>결론 암기: 옥외광고물 조례·호별방문 금지·猿払 모두 \u003cstrong>합헌\u003c/strong>. 「방법 규제이므로 위헌으로 판단되었다」는 지문은 오답.\u003c/li>\u003cli>猿払事件의 「의견 표명 자체의 제약을 목적으로 하는 것이 아니다」라는 문구는 \u003cstrong>내용 중립 규제로 구성한 대표 문장\u003c/strong>으로 그대로 출제된다.\u003c/li>\u003cli>\u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>·\u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">検閲\u003c/a>은 \u003cstrong>시기\u003c/strong>(발표 전인가)에 따른 분류, 内容規制／内容中立規制는 \u003cstrong>이유\u003c/strong>(내용을 이유로 하는가)에 따른 분류다. 축이 다르므로 겹쳐서 출제되면 축을 분리해 읽어라.\u003c/li>\u003cli>\u003ca href=\"#/e/%E3%83%91%E3%83%96%E3%83%AA%E3%83%83%E3%82%AF%E3%83%BB%E3%83%95%E3%82%A9%E3%83%BC%E3%83%A9%E3%83%A0\">パブリック・フォーラム\u003c/a>론은 내용 중립 규제(장소 규제)를 다시 좁히기 위한 도구로 쓰인다.\u003c/li>\u003c/ul>","search":"表現内容規制 ひょうげんないようきせい 항목 내용 ------ ------ 읽기 ひょうげんないようきせい（표현 내용 규제） 과목 헌법（표현의 자유） 한줄 정의 표현이 전달하는 메시지의 내용 주제·관점 을 이유로 그 표현을 규제하는 것 통설·판례 정부에 의한 사상 통제·정보 조작으로 이어질 위험이 크므로 가장 엄격한 기준 으로 심사해야 한다는 것이 통설. 다만 최고재가 「内容規制／内容中立規制」라는 용어를 정면으로 사용해 심사 기준을 나눈 예는 없다 개념 표현의 자유 21조 1항 에 대한 규제는 학설상 두 가지로 나뉜다. 표현 내용 규제 表現内容規制 는 「무엇을 말했는가」, 즉 메시지의 내용을 이유로 하는 규제이고, 표현 내용 중립 규제 表現内容中立規制 는 내용과 무관하게 표현의 시간·장소·방법 만을 규율하는 규제다. 이를 二分論 이분론 이라 한다. 내용 규제를 엄격히 심사해야 하는 이유는, 정부가 「그 표현은 허위다·위험하다·부도덕하다·가치가 없다」고 판단해 규제하는 것을 허용하면 정부에 의한 자의적 사상 통제 로 직결되기 때문이다. 특히 특정 관점 観点 만을 겨냥하는 관점 규제 観点規制 는 사상의 자유시장 자체를 왜곡하므로 원칙적으로 위헌이라고 본다. 반면 내용 중립 규제는 정부가 자기에게 불리한 표현만 골라 억압할 위험이 작고, 다른 시간·장소·방법으로 표현할 대체 경로 가 남아 있으므로 완화된 기준 중간 심사, lra基準 용어/lra基準.md 등 으로 족하다고 설명된다. 다만 이분론은 만능이 아니다. 삐라 배포·입간판·현수막처럼 돈이 들지 않는 표현 수단 을 방법 규제로 봉쇄하면, 형식은 내용 중립이어도 실질적으로는 특정 계층·특정 주장의 표현을 전면 차단하는 결과가 된다는 비판이 유력하다. 대비: 表現内容規制 ↔ 表現内容中立規制 구분 表現内容規制 表現内容中立規制 ------ -------------- ------------------ 규제 이유 메시지의 내용·관점 표현의 시간·장소·방법 위험성 정부의 사상 통제·정보 조작 상대적으로 낮음 심사 기준 엄격 명백하고 현재의 위험 등 완화 중간 심사· lra基準 용어/lra基準.md 대체 경로 남지 않음 다른 방법으로 표현 가능 예 명예훼손·선동·외설·유해도서 지정 옥외광고물 규제, 호별방문 금지, 소음 규제 학설 학설 내용 비고 ------ ------ ------ 二分論（유력·통설적 이해） 내용 규제는 엄격 심사, 내용 중립 규제는 완화된 심사 중간 심사·lra 로 심사 기준을 나눈다 👉 미국 판례법리에서 도입. 학계의 표준적 틀 二分論 비판설 내용 중립 규제도 삐라·입간판 등 저비용 표현 수단을 봉쇄하면 실질적으로 내용 규제와 같은 효과를 낳는다. 형식적 분류에 의존하면 위험 옥외광고물 조례·호별방문 금지의 합헌 판단을 비판하는 논거 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 岐阜県青少年保護育成条例事件（기후현 청소년보호육성조례 사건） 最三小判平1.9.19 「有害図書」로 지정된 도서의 자동판매기 수납 금지·처벌 합헌 （내용에 착안한 규제이지만 청소년 보호의 필요성을 이유로 합헌. 伊藤正己 재판관 보충의견이 유명） 札幌税関検査事件（삿포로 세관검사 사건） 最大判昭59.12.12 / 民集38巻12号1308頁 「風俗を害すべき書籍、図画」의 수입 규제 합헌 （내용에 착안한 규제이나, 「풍속을 해칠」의 의미를 외설 표현물에 한정 하는 합헌한정해석으로 명확성을 확보） 北方ジャーナル事件（북방저널 사건） 最大判昭61.6.11 / 民集40巻4号872頁 명예훼손 기사의 사전 차지 차지 적법 （명예훼손이라는 내용 을 이유로 한 규제이므로 엄격한 요건 설정 → 事前抑制 용어/事前抑制.md 항목 참조） 大阪市屋外広告物条例事件（오사카시 옥외광고물조례 사건） 最大判昭43.12.18 전신주 등에 삐라를 붙인 행위의 처벌 합헌 . 미관풍치의 유지 라는 내용 중립적 목적. 「공공복지를 위해 표현의 자유에 대해 허용된 필요하고 합리적인 제한」 戸別訪問禁止事件（호별방문 금지 사건） 最三小判昭56.6.15 공직선거법 138조의 호별방문 전면 금지 합헌 . 의견 표명 자체가 아니라 방법 의 규제이며, 매수·이해유도의 온상 방지와 선거의 자유·공정 확보가 목적 猿払事件（사루후츠 사건） 最大判昭49.11.6 우편국 직원의 선거 벽보 게시 등 공무원의 정치적 행위 금지 합헌 . 「意見表明そのものの制約を目的とするものではなく、行動のもたらす弊害の防止をねらいとしたもの」라며 내용 중립적 규제 로 구성 💡 수험 팁 - 「어느 쪽 규제인가」를 먼저 판정하는 습관을 들여라. 「무엇을 말했는지」를 따지면 내용 규제, 「언제·어디서·어떻게 말했는지」만 따지면 내용 중립 규제 다. - 최고재는 이분론을 정면으로 채택해 심사 기준을 명시적으로 나눈 적이 없다. 「판례는 표현 내용 규제에 대해 엄격 심사 기준을 채택하고 있다」는 지문은 오답 가능성이 높다. 이분론은 어디까지나 학설 이다. - 결론 암기: 옥외광고물 조례·호별방문 금지·猿払 모두 합헌 . 「방법 규제이므로 위헌으로 판단되었다」는 지문은 오답. - 猿払事件의 「의견 표명 자체의 제약을 목적으로 하는 것이 아니다」라는 문구는 내용 중립 규제로 구성한 대표 문장 으로 그대로 출제된다. - 事前抑制 용어/事前抑制.md · 検閲 용어/検閲.md 은 시기 발표 전인가 에 따른 분류, 内容規制／内容中立規制는 이유 내용을 이유로 하는가 에 따른 분류다. 축이 다르므로 겹쳐서 출제되면 축을 분리해 읽어라. - パブリック・フォーラム 용어/パブリック・フォーラム.md 론은 내용 중립 규제 장소 규제 를 다시 좁히기 위한 도구로 쓰인다."},"パブリック・フォーラム":{"type":"term","subject":"용어","id":"パブリック・フォーラム","title":"パブリック・フォーラム","sub":"ぱぶりっくふぉーらむ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぱぶりっくふぉーらむ（퍼블릭 포럼）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>도로·공원·광장처럼 전통적으로 표현 활동의 장으로 쓰여 온 공적 장소에서는, 재산권이나 관리권보다 표현의 자유의 보장을 \u003cstrong>특히 두텁게\u003c/strong> 배려해야 한다는 법리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>최고재의 \u003cstrong>법정의견이 채택한 적은 없다\u003c/strong>. 吉祥寺駅構内ビラ配布事件의 \u003cstrong>伊藤正己 재판관 보충의견\u003c/strong>이 일본에서의 출처\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>표현의 자유(\u003cstrong>21조 1항\u003c/strong>)는 「말할 자유」만이 아니라 「말할 \u003cstrong>장소\u003c/strong>」가 확보되어야 실질적 의미를 갖는다. 그런데 도로·공원·역 구내 등은 각각 도로교통법·공원 관리 규칙·철도영업법 등의 관리권 아래 있어, 관리자의 판단만으로 표현 활동이 봉쇄될 수 있다. 여기서 미국 판례법리에서 도입된 것이 \u003cstrong>퍼블릭 포럼\u003c/strong>론이다. 전통적으로 시민의 표현·집회의 장으로 기능해 온 장소는 「말할 곳이 없는 사람」에게 사실상 유일한 표현 수단이므로, 소유권·관리권에 기한 제약이 있더라도 그 \u003cstrong>기능에 비추어 표현의 자유의 보장을 가능한 한 배려해야 한다\u003c/strong>는 것이다.\u003c/p>\n\u003cp>일본에서의 출처는 \u003cstrong>吉祥寺駅構内ビラ配布事件（最三小判昭59.12.18）\u003c/strong>의 \u003cstrong>伊藤正己 재판관 보충의견\u003c/strong>이다. 사안은 역 구내에서 역무원의 허락 없이 삐라를 배포하고 확성기로 연설을 반복한 행위를 \u003cstrong>철도영업법\u003c/strong> 위반 등으로 처벌한 것으로, 법정의견은 \u003cstrong>합헌·유죄\u003c/strong>로 결론지었다. 伊藤 재판관도 결론에는 찬성했지만, 다음과 같은 보충의견을 덧붙였다.\u003c/p>\n\u003cblockquote>道路、公園、広場などは、その例である。これを「パブリツク・フオーラム」と呼ぶことができよう。\u003cbr>\u003cbr>このパブリツク・フオーラムが表現の場所として用いられるときには、所有権や、本来の利用目的のための管理権に基づく制約を受けざるをえないとしても、その機能にかんがみ、表現の自由の保障を可能な限り配慮する必要がある。\u003cbr>\u003cbr>駅前広場のごときは、その具体的状況によつてはパブリツク・フオーラムたる性質を強くもつことがありうるのであり、このような場合に、そこでのビラ配布を同条違反として処罰することは、憲法に反する疑いが強い。\u003c/blockquote>\n\u003cp>즉 \u003cstrong>역사(駅舎) 내부\u003c/strong>인 본건 장소는 퍼블릭 포럼성이 약하므로 처벌해도 위헌이 아니지만, \u003cstrong>역 앞 광장\u003c/strong> 같은 곳은 퍼블릭 포럼의 성격을 강하게 가질 수 있고 그런 경우의 처벌은 위헌의 의심이 강하다는 것이다. 장소의 성격에 따라 심사의 강도를 달리한다는 발상이다.\u003c/p>\n\u003cp>퍼블릭 포럼론은 \u003ca href=\"#/e/%E8%A1%A8%E7%8F%BE%E5%86%85%E5%AE%B9%E8%A6%8F%E5%88%B6\">表現内容規制\u003c/a> 이분론에서 「내용 중립 규제(장소 규제)이므로 완화된 심사로 족하다」고 넘어가기 쉬운 사안을, 장소의 성격에 착안해 다시 좁히는 도구로 기능한다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>吉祥寺駅構内ビラ配布事件（기치조지역 구내 삐라 배포 사건）\u003c/td>\u003ctd>最三小判昭59.12.18 / 刑集38巻12号3026頁\u003c/td>\u003ctd>역 구내(남쪽 출구 1층 계단 부근)에서 역무원의 허락 없이 삐라를 다수 배포하고 휴대 확성기로 연설을 반복\u003c/td>\u003ctd>\u003cstrong>법정의견은 합헌·유죄\u003c/strong>（철도영업법 및 형법 130조 후단 적용은 헌법 21조 1항에 위반하지 않음）. \u003cstrong>伊藤正己 재판관 보충의견\u003c/strong>이 「パブリツク・フオーラム」 개념을 제시하며, 역 앞 광장 같은 장소에서의 처벌은 위헌의 의심이 강하다고 지적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>泉佐野市民会館事件（이즈미사노 시민회관 사건）\u003c/td>\u003ctd>最三小判平7.3.7\u003c/td>\u003ctd>시민회관의 집회 사용을 「공공의 안녕질서를 유지하는 데 지장이 있다」는 이유로 불허가\u003c/td>\u003ctd>\u003cstrong>불허가는 적법\u003c/strong>（결론은 시 측 승소）. 다만 「公の施設」의 이용 거부는 \u003cstrong>명백하고 현재의 위험\u003c/strong>이 객관적 사실에 비추어 구체적으로 예견될 때에 한한다는 엄격한 기준을 제시. 집회 장소 확보의 중요성을 인정한 판례로 세트 출제\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「최고재는 퍼블릭 포럼론을 채택했다」는 지문은 오답.\u003c/strong> 어디까지나 \u003cstrong>보충의견(補足意見)\u003c/strong>이고, \u003cstrong>법정의견은 합헌·유죄\u003c/strong>다. 「보충의견/반대의견/법정의견」의 구별을 묻는 문제로 자주 나온다.\u003c/li>\u003cli>사건의 \u003cstrong>결론은 유죄\u003c/strong>다. 「삐라 배포를 처벌한 것은 위헌으로 판단되었다」는 지문은 오답.\u003c/li>\u003cli>재판관 이름 \u003cstrong>伊藤正己\u003c/strong>까지 세트로 출제된다. 岐阜県青少年保護育成条例事件의 보충의견으로도 유명한 재판관.\u003c/li>\u003cli>장소의 구별을 기억하라: \u003cstrong>역사(駅舎) 내부 = 퍼블릭 포럼성 약함(처벌 가능)\u003c/strong> ↔ \u003cstrong>역 앞 광장·도로·공원 = 퍼블릭 포럼성 강함(처벌은 위헌의 의심)\u003c/strong>.\u003c/li>\u003cli>대비: 퍼블릭 포럼론은 \u003cstrong>장소\u003c/strong>에 착안한 법리, \u003ca href=\"#/e/%E8%A1%A8%E7%8F%BE%E5%86%85%E5%AE%B9%E8%A6%8F%E5%88%B6\">表現内容規制\u003c/a>는 \u003cstrong>규제 이유\u003c/strong>에 착안한 법리, \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>는 \u003cstrong>시기\u003c/strong>에 착안한 법리. 축이 다르다.\u003c/li>\u003cli>집회의 자유 쪽 문제로 나오면 泉佐野市民会館事件의 \u003cstrong>「명백하고 현재의 위험」\u003c/strong> 기준을 함께 떠올릴 것.\u003c/li>\u003c/ul>","search":"パブリック・フォーラム ぱぶりっくふぉーらむ 항목 내용 ------ ------ 읽기 ぱぶりっくふぉーらむ（퍼블릭 포럼） 과목 헌법（표현의 자유） 한줄 정의 도로·공원·광장처럼 전통적으로 표현 활동의 장으로 쓰여 온 공적 장소에서는, 재산권이나 관리권보다 표현의 자유의 보장을 특히 두텁게 배려해야 한다는 법리 통설·판례 최고재의 법정의견이 채택한 적은 없다 . 吉祥寺駅構内ビラ配布事件의 伊藤正己 재판관 보충의견 이 일본에서의 출처 개념 표현의 자유 21조 1항 는 「말할 자유」만이 아니라 「말할 장소 」가 확보되어야 실질적 의미를 갖는다. 그런데 도로·공원·역 구내 등은 각각 도로교통법·공원 관리 규칙·철도영업법 등의 관리권 아래 있어, 관리자의 판단만으로 표현 활동이 봉쇄될 수 있다. 여기서 미국 판례법리에서 도입된 것이 퍼블릭 포럼 론이다. 전통적으로 시민의 표현·집회의 장으로 기능해 온 장소는 「말할 곳이 없는 사람」에게 사실상 유일한 표현 수단이므로, 소유권·관리권에 기한 제약이 있더라도 그 기능에 비추어 표현의 자유의 보장을 가능한 한 배려해야 한다 는 것이다. 일본에서의 출처는 吉祥寺駅構内ビラ配布事件（最三小判昭59.12.18） 의 伊藤正己 재판관 보충의견 이다. 사안은 역 구내에서 역무원의 허락 없이 삐라를 배포하고 확성기로 연설을 반복한 행위를 철도영업법 위반 등으로 처벌한 것으로, 법정의견은 합헌·유죄 로 결론지었다. 伊藤 재판관도 결론에는 찬성했지만, 다음과 같은 보충의견을 덧붙였다. 道路、公園、広場などは、その例である。これを「パブリツク・フオーラム」と呼ぶことができよう。 このパブリツク・フオーラムが表現の場所として用いられるときには、所有権や、本来の利用目的のための管理権に基づく制約を受けざるをえないとしても、その機能にかんがみ、表現の自由の保障を可能な限り配慮する必要がある。 駅前広場のごときは、その具体的状況によつてはパブリツク・フオーラムたる性質を強くもつことがありうるのであり、このような場合に、そこでのビラ配布を同条違反として処罰することは、憲法に反する疑いが強い。 즉 역사 駅舎 내부 인 본건 장소는 퍼블릭 포럼성이 약하므로 처벌해도 위헌이 아니지만, 역 앞 광장 같은 곳은 퍼블릭 포럼의 성격을 강하게 가질 수 있고 그런 경우의 처벌은 위헌의 의심이 강하다는 것이다. 장소의 성격에 따라 심사의 강도를 달리한다는 발상이다. 퍼블릭 포럼론은 表現内容規制 용어/表現内容規制.md 이분론에서 「내용 중립 규제 장소 규제 이므로 완화된 심사로 족하다」고 넘어가기 쉬운 사안을, 장소의 성격에 착안해 다시 좁히는 도구로 기능한다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 吉祥寺駅構内ビラ配布事件（기치조지역 구내 삐라 배포 사건） 最三小判昭59.12.18 / 刑集38巻12号3026頁 역 구내 남쪽 출구 1층 계단 부근 에서 역무원의 허락 없이 삐라를 다수 배포하고 휴대 확성기로 연설을 반복 법정의견은 합헌·유죄 （철도영업법 및 형법 130조 후단 적용은 헌법 21조 1항에 위반하지 않음）. 伊藤正己 재판관 보충의견 이 「パブリツク・フオーラム」 개념을 제시하며, 역 앞 광장 같은 장소에서의 처벌은 위헌의 의심이 강하다고 지적 泉佐野市民会館事件（이즈미사노 시민회관 사건） 最三小判平7.3.7 시민회관의 집회 사용을 「공공의 안녕질서를 유지하는 데 지장이 있다」는 이유로 불허가 불허가는 적법 （결론은 시 측 승소）. 다만 「公の施設」의 이용 거부는 명백하고 현재의 위험 이 객관적 사실에 비추어 구체적으로 예견될 때에 한한다는 엄격한 기준을 제시. 집회 장소 확보의 중요성을 인정한 판례로 세트 출제 💡 수험 팁 - 「최고재는 퍼블릭 포럼론을 채택했다」는 지문은 오답. 어디까지나 보충의견 補足意見 이고, 법정의견은 합헌·유죄 다. 「보충의견/반대의견/법정의견」의 구별을 묻는 문제로 자주 나온다. - 사건의 결론은 유죄 다. 「삐라 배포를 처벌한 것은 위헌으로 판단되었다」는 지문은 오답. - 재판관 이름 伊藤正己 까지 세트로 출제된다. 岐阜県青少年保護育成条例事件의 보충의견으로도 유명한 재판관. - 장소의 구별을 기억하라: 역사 駅舎 내부 = 퍼블릭 포럼성 약함 처벌 가능 ↔ 역 앞 광장·도로·공원 = 퍼블릭 포럼성 강함 처벌은 위헌의 의심 . - 대비: 퍼블릭 포럼론은 장소 에 착안한 법리, 表現内容規制 용어/表現内容規制.md 는 규제 이유 에 착안한 법리, 事前抑制 용어/事前抑制.md 는 시기 에 착안한 법리. 축이 다르다. - 집회의 자유 쪽 문제로 나오면 泉佐野市民会館事件의 「명백하고 현재의 위험」 기준을 함께 떠올릴 것."},"実質的届出制":{"type":"term","subject":"용어","id":"実質的届出制","title":"実質的届出制","sub":"じっしつてきとどけでせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>じっしつてきとどけでせい（실질적 신고제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（표현의 자유·집회의 자유）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>公安条例가 형식상 \u003cstrong>허가제\u003c/strong>를 취하고 있어도, 불허가 사유가 엄격히 한정되어 원칙적으로 허가해야 하는 구조라면 그 실질은 \u003cstrong>신고제\u003c/strong>와 다르지 않으므로 합헌이라는 논리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>최고재는 이 논법으로 공안조례를 \u003cstrong>합헌\u003c/strong>이라고 판단해 왔다（新潟県公安条例事件·東京都公安条例事件）. 학설에서는 집단행동에 대한 일반적 허가제는 사전 억제이므로 위헌이라는 비판이 유력\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>집회·집단행진·집단시위(집단행동)는 \u003cstrong>헌법 21조 1항\u003c/strong>이 보장하는 집회의 자유·표현의 자유에 속한다. 그런데 각 지방자치단체의 \u003cstrong>公安条例(공안조례)\u003c/strong>는 집단행동을 하려면 公安委員会의 \u003cstrong>허가\u003c/strong>를 받도록 하고 있어, 이것이 사전 억제로서 21조에 반하지 않는가가 다투어졌다.\u003c/p>\n\u003cp>\u003cstrong>新潟県公安条例事件（最大判昭29.11.24）\u003c/strong>이 기본 틀을 세웠다. 최고재는 ① 집단행동에 대해 \u003cstrong>단순한 신고제\u003c/strong>를 두는 것은 별론으로 하고, 그렇지 않은 \u003cstrong>일반적 허가제\u003c/strong>를 두어 사전에 억제하는 것은 헌법의 취지에 반하여 허용되지 않는다고 하면서도, ② \u003cstrong>특정한 장소 또는 방법\u003c/strong>에 관하여 \u003cstrong>합리적이고 명확한 기준\u003c/strong> 아래 미리 허가를 받게 하거나 신고를 하게 하는 것은 헌법이 보장하는 국민의 자유를 부당하게 제한하는 것이 아니고, ③ 공공의 안전에 대해 \u003cstrong>명백하고 현재의 위험\u003c/strong>이 예견될 때에는 이를 금지할 수 있다고 판시했다. 결론은 \u003cstrong>합헌\u003c/strong>.\u003c/p>\n\u003cp>이어 \u003cstrong>東京都公安条例事件（最大判昭35.7.20）\u003c/strong>은 판단 방법 자체를 제시했다. 「허가」를 받게 하는지 「신고」를 하게 하는지는 \u003cstrong>개념 내지 용어만으로 판단할 것이 아니라, 조례 전체의 정신을 실질적·유기적으로 고찰해야 한다\u003c/strong>고 하면서, 도쿄도 조례는 형식상 허가제를 취하지만 「公共の安寧を保持する上に直接危険を及ぼすと明らかに認められる場合」 외에는 허가해야 하므로 \u003cstrong>그 실질에 있어서 신고제와 다르지 않다\u003c/strong>고 보아 \u003cstrong>합헌\u003c/strong>이라고 했다. 이것이 「実質的届出制」라는 표현의 유래다.\u003c/p>\n\u003cp>다만 東京都 판결은 동시에 집단행동에는 「一瞬にして暴徒と化す」 잠재적 위험이 있다는 이른바 \u003cstrong>集団暴徒化論\u003c/strong>을 전개하며 규제의 필요성을 넓게 인정했다. 학설에서는 新潟 판결의 엄격한 논조에서 크게 후퇴했다고 비판적으로 평가된다.\u003c/p>\n\u003cp>\u003cstrong>대비: 許可制 ↔ 届出制\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>許可制（허가제）\u003c/th>\u003cth>届出制（신고제）\u003c/th>\u003c/tr>\u003ctr>\u003ctd>구조\u003c/td>\u003ctd>원칙 금지 → 개별 해제\u003c/td>\u003ctd>원칙 자유 → 사전 통지만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>사전 억제성\u003c/td>\u003ctd>강함\u003c/td>\u003ctd>약함\u003c/td>\u003c/tr>\u003ctr>\u003ctd>헌법상 평가\u003c/td>\u003ctd>\u003cstrong>일반적 허가제는 위헌\u003c/strong>（新潟） / 특정 장소·방법에 관해 합리적·명확한 기준이 있으면 합헌\u003c/td>\u003ctd>원칙적으로 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판단 방법\u003c/td>\u003ctd>\u003cstrong>명칭이 아니라 조례 전체의 정신을 실질적·유기적으로 고찰\u003c/strong>（東京都）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>新潟県公安条例事件（니가타현 공안조례 사건）\u003c/td>\u003ctd>最大判昭29.11.24 / 刑集8巻11号1866頁\u003c/td>\u003ctd>집단행진에 公安委員会의 허가를 요구하는 조례의 합헌성\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>일반적 허가제에 의한 사전 억제는 헌법의 취지에 반해 허용되지 않는다\u003c/strong>. 그러나 \u003cstrong>특정한 장소 또는 방법\u003c/strong>에 관해 \u003cstrong>합리적이고 명확한 기준\u003c/strong> 아래 허가 또는 신고를 요구하는 것은 위헌이 아니며, 공공의 안전에 \u003cstrong>명백하고 현재의 위험\u003c/strong>이 예견되는 경우 금지할 수 있다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>東京都公安条例事件（도쿄도 공안조례 사건）\u003c/td>\u003ctd>最大判昭35.7.20 / 刑集14巻9号1243頁\u003c/td>\u003ctd>도쿄도 조례가 집단행동에 허가를 요구하고, 「공공의 안녕을 유지하는 데 직접 위험을 미친다고 명백히 인정되는 경우」에 불허가할 수 있도록 한 것의 합헌성\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 허가인지 신고인지는 \u003cstrong>개념·용어만으로 판단할 것이 아니라 조례 전체의 정신을 실질적·유기적으로 고찰\u003c/strong>해야 하며, 본 조례의 허가제는 \u003cstrong>그 실질에 있어서 신고제와 다르지 않다\u003c/strong> → 21조 위반 아님. 다만 \u003cstrong>集団暴徒化論\u003c/strong>을 전개해 규제를 넓게 허용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>徳島市公安条例事件（도쿠시마시 공안조례 사건）\u003c/td>\u003ctd>最大判昭50.9.10\u003c/td>\u003ctd>조례의 「交通秩序を維持すること」이라는 문언이 불명확하여 31조에 반하는지, 또 조례가 법률에 위반하는지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 통상의 판단능력을 가진 일반인이 구체적 사안에서 적용 여부를 판단할 수 있는 기준이 읽히면 불명확하다고 할 수 없다(\u003cstrong>\u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明確性の原則\u003c/a>\u003c/strong>의 리딩 케이스). 조례와 법령의 저촉은 \u003cstrong>취지·목적·내용·효과를 비교\u003c/strong>해 판단\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>판단 기준은 「명칭」이 아니라 「실질」.\u003c/strong> 「조례가 허가제라는 문언을 쓰고 있으면 그것만으로 위헌이다」는 지문은 오답. 東京都 판결의 \u003cstrong>「概念乃至用語のみによって判断すべきではなく、条例全体の精神を実質的かつ有機的に考察」\u003c/strong>이 그대로 출제된다.\u003c/li>\u003cli>新潟 판결의 \u003cstrong>2단 구성\u003c/strong>을 정확히: \u003cstrong>일반적 허가제 = 위헌\u003c/strong> / \u003cstrong>특정 장소·방법에 관한 합리적·명확한 기준 하의 허가제 = 합헌\u003c/strong>. 「허가제는 모두 합헌」도 「허가제는 모두 위헌」도 오답.\u003c/li>\u003cli>\u003cstrong>결론은 세 판례 모두 합헌.\u003c/strong> 「공안조례가 위헌으로 판단된 최고재 판례가 있다」는 지문은 오답.\u003c/li>\u003cli>대비: \u003cstrong>新潟 = 명백하고 현재의 위험 기준을 언급한 엄격한 논조\u003c/strong> ↔ \u003cstrong>東京都 = 集団暴徒化論으로 완화\u003c/strong>. 어느 쪽 판례인지 묻는 문제에 대비.\u003c/li>\u003cli>徳島市公安条例事件은 \u003cstrong>명확성의 원칙\u003c/strong>과 \u003cstrong>조례의 법률 저촉\u003c/strong> 두 논점의 리딩 케이스로, 공안조례 3종 세트 중 성격이 다르다. 혼동 주의.\u003c/li>\u003cli>관련 법리로 \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">事前抑制\u003c/a>(원칙 금지·예외 허용)와 연결해 두면, 「허가제=사전 억제이므로 원칙 위헌, 다만 요건이 엄격하면 허용」이라는 흐름으로 정리된다.\u003c/li>\u003c/ul>","search":"実質的届出制 じっしつてきとどけでせい 항목 내용 ------ ------ 읽기 じっしつてきとどけでせい（실질적 신고제） 과목 헌법（표현의 자유·집회의 자유） 한줄 정의 公安条例가 형식상 허가제 를 취하고 있어도, 불허가 사유가 엄격히 한정되어 원칙적으로 허가해야 하는 구조라면 그 실질은 신고제 와 다르지 않으므로 합헌이라는 논리 통설·판례 최고재는 이 논법으로 공안조례를 합헌 이라고 판단해 왔다（新潟県公安条例事件·東京都公安条例事件）. 학설에서는 집단행동에 대한 일반적 허가제는 사전 억제이므로 위헌이라는 비판이 유력 개념 집회·집단행진·집단시위 집단행동 는 헌법 21조 1항 이 보장하는 집회의 자유·표현의 자유에 속한다. 그런데 각 지방자치단체의 公安条例 공안조례 는 집단행동을 하려면 公安委員会의 허가 를 받도록 하고 있어, 이것이 사전 억제로서 21조에 반하지 않는가가 다투어졌다. 新潟県公安条例事件（最大判昭29.11.24） 이 기본 틀을 세웠다. 최고재는 ① 집단행동에 대해 단순한 신고제 를 두는 것은 별론으로 하고, 그렇지 않은 일반적 허가제 를 두어 사전에 억제하는 것은 헌법의 취지에 반하여 허용되지 않는다고 하면서도, ② 특정한 장소 또는 방법 에 관하여 합리적이고 명확한 기준 아래 미리 허가를 받게 하거나 신고를 하게 하는 것은 헌법이 보장하는 국민의 자유를 부당하게 제한하는 것이 아니고, ③ 공공의 안전에 대해 명백하고 현재의 위험 이 예견될 때에는 이를 금지할 수 있다고 판시했다. 결론은 합헌 . 이어 東京都公安条例事件（最大判昭35.7.20） 은 판단 방법 자체를 제시했다. 「허가」를 받게 하는지 「신고」를 하게 하는지는 개념 내지 용어만으로 판단할 것이 아니라, 조례 전체의 정신을 실질적·유기적으로 고찰해야 한다 고 하면서, 도쿄도 조례는 형식상 허가제를 취하지만 「公共の安寧を保持する上に直接危険を及ぼすと明らかに認められる場合」 외에는 허가해야 하므로 그 실질에 있어서 신고제와 다르지 않다 고 보아 합헌 이라고 했다. 이것이 「実質的届出制」라는 표현의 유래다. 다만 東京都 판결은 동시에 집단행동에는 「一瞬にして暴徒と化す」 잠재적 위험이 있다는 이른바 集団暴徒化論 을 전개하며 규제의 필요성을 넓게 인정했다. 학설에서는 新潟 판결의 엄격한 논조에서 크게 후퇴했다고 비판적으로 평가된다. 대비: 許可制 ↔ 届出制 구분 許可制（허가제） 届出制（신고제） ------ ------------------ ------------------ 구조 원칙 금지 → 개별 해제 원칙 자유 → 사전 통지만 사전 억제성 강함 약함 헌법상 평가 일반적 허가제는 위헌 （新潟） / 특정 장소·방법에 관해 합리적·명확한 기준이 있으면 합헌 원칙적으로 합헌 판단 방법 명칭이 아니라 조례 전체의 정신을 실질적·유기적으로 고찰 （東京都） 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 新潟県公安条例事件（니가타현 공안조례 사건） 最大判昭29.11.24 / 刑集8巻11号1866頁 집단행진에 公安委員会의 허가를 요구하는 조례의 합헌성 합헌 . 일반적 허가제에 의한 사전 억제는 헌법의 취지에 반해 허용되지 않는다 . 그러나 특정한 장소 또는 방법 에 관해 합리적이고 명확한 기준 아래 허가 또는 신고를 요구하는 것은 위헌이 아니며, 공공의 안전에 명백하고 현재의 위험 이 예견되는 경우 금지할 수 있다 東京都公安条例事件（도쿄도 공안조례 사건） 最大判昭35.7.20 / 刑集14巻9号1243頁 도쿄도 조례가 집단행동에 허가를 요구하고, 「공공의 안녕을 유지하는 데 직접 위험을 미친다고 명백히 인정되는 경우」에 불허가할 수 있도록 한 것의 합헌성 합헌 . 허가인지 신고인지는 개념·용어만으로 판단할 것이 아니라 조례 전체의 정신을 실질적·유기적으로 고찰 해야 하며, 본 조례의 허가제는 그 실질에 있어서 신고제와 다르지 않다 → 21조 위반 아님. 다만 集団暴徒化論 을 전개해 규제를 넓게 허용 徳島市公安条例事件（도쿠시마시 공안조례 사건） 最大判昭50.9.10 조례의 「交通秩序を維持すること」이라는 문언이 불명확하여 31조에 반하는지, 또 조례가 법률에 위반하는지 합헌 . 통상의 판단능력을 가진 일반인이 구체적 사안에서 적용 여부를 판단할 수 있는 기준이 읽히면 불명확하다고 할 수 없다 明確性の原則 용어/明確性の原則.md 의 리딩 케이스 . 조례와 법령의 저촉은 취지·목적·내용·효과를 비교 해 판단 💡 수험 팁 - 판단 기준은 「명칭」이 아니라 「실질」. 「조례가 허가제라는 문언을 쓰고 있으면 그것만으로 위헌이다」는 지문은 오답. 東京都 판결의 「概念乃至用語のみによって判断すべきではなく、条例全体の精神を実質的かつ有機的に考察」 이 그대로 출제된다. - 新潟 판결의 2단 구성 을 정확히: 일반적 허가제 = 위헌 / 특정 장소·방법에 관한 합리적·명확한 기준 하의 허가제 = 합헌 . 「허가제는 모두 합헌」도 「허가제는 모두 위헌」도 오답. - 결론은 세 판례 모두 합헌. 「공안조례가 위헌으로 판단된 최고재 판례가 있다」는 지문은 오답. - 대비: 新潟 = 명백하고 현재의 위험 기준을 언급한 엄격한 논조 ↔ 東京都 = 集団暴徒化論으로 완화 . 어느 쪽 판례인지 묻는 문제에 대비. - 徳島市公安条例事件은 명확성의 원칙 과 조례의 법률 저촉 두 논점의 리딩 케이스로, 공안조례 3종 세트 중 성격이 다르다. 혼동 주의. - 관련 법리로 事前抑制 용어/事前抑制.md 원칙 금지·예외 허용 와 연결해 두면, 「허가제=사전 억제이므로 원칙 위헌, 다만 요건이 엄격하면 허용」이라는 흐름으로 정리된다."},"付随的違憲審査制":{"type":"term","subject":"용어","id":"付随的違憲審査制","title":"付随的違憲審査制","sub":"ふずいてきいけんしんさせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ふずいてきいけんしんさせい（부수적 위헌심사제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 재판소·위헌심사제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>재판소가 구체적인 소송 사건을 재판하는 데 \u003cstrong>필요한 한도에서만\u003c/strong> 부수적으로 법령·처분의 위헌 여부를 심사하는 제도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>부수적 심사제(사법재판소형)\u003c/strong> — 警察予備隊違憲訴訟에서 확립. 일본은 추상적 심사제를 채택하지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 81조는 「最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する権限を有する終審裁判所である」라고 하여 위헌심사권의 \u003cstrong>주체\u003c/strong>와 \u003cstrong>최종성\u003c/strong>만 규정할 뿐, 그 심사가 어떤 형태로 이루어지는지는 밝히지 않는다. 그래서 미국형(부수적 심사제)인지 독일형(\u003ca href=\"#/e/%E6%8A%BD%E8%B1%A1%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">抽象的違憲審査制\u003c/a>)인지가 다투어졌다.\u003c/p>\n\u003cp>통설·판례는 \u003cstrong>부수적 심사제\u003c/strong>를 취한다. 근거는 81조가 「사법」의 장(제6장)에 놓여 있고, 76조 1항이 사법권을 재판소에 부여하며, 재판소법 3조 1항이 재판소의 권한을 「\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>」로 한정하고 있다는 점이다. 즉 위헌심사권은 \u003cstrong>사법권 행사에 부수하여\u003c/strong> 발동되는 권한이며, 구체적 사건이 없으면 법령의 합헌성만을 따로 다투는 소송은 제기할 수 없다.\u003c/p>\n\u003cp>여기서 두 가지 파생 논점이 나온다. 첫째, 81조가 「最高裁判所は…終審裁判所である」라고만 하므로 \u003cstrong>하급재판소도 위헌심사권을 가진다\u003c/strong>(최고재는 어디까지나 「終審」일 뿐이다). 둘째, 위헌판결의 효력도 당해 사건에 한정되는 것이 논리적 귀결이어서 \u003cstrong>\u003ca href=\"#/e/%E5%80%8B%E5%88%A5%E7%9A%84%E5%8A%B9%E5%8A%9B%E8%AA%AC\">個別的効力説\u003c/a>\u003c/strong>이 통설·판례가 된다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>付随的審査制説\u003c/strong>\u003c/td>\u003ctd>81조는 사법권의 일환으로서의 위헌심사권을 정한 것. 구체적 쟁송을 떠난 심사는 불가\u003c/td>\u003ctd>👉 \u003cstrong>통설·판례\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>抽象的審査制説\u003c/td>\u003ctd>81조는 최고재에 헌법재판소로서의 지위도 부여한 것이므로 추상적 심사도 가능\u003c/td>\u003ctd>소수설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법률사항설\u003c/td>\u003ctd>81조는 어느 쪽도 배제하지 않으므로 \u003cstrong>법률로 정하면\u003c/strong> 추상적 심사도 도입 가능\u003c/td>\u003ctd>절충설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>警察予備隊違憲訴訟（경찰예비대 위헌소송）\u003c/td>\u003ctd>最大判昭27.10.8 / 民集6巻9号783頁\u003c/td>\u003ctd>사회당 대표가 최고재에 \u003cstrong>직접\u003c/strong> 제소하여 경찰예비대의 설치·유지 행위가 9조 위반으로 무효라는 확인을 구함\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 재판소가 가지는 것은 \u003cstrong>사법권\u003c/strong>이고, 사법권 발동에는 \u003cstrong>구체적인 쟁송사건의 제기가 필요\u003c/strong>하다. 구체적 사건을 떠나 추상적으로 법령의 합헌성을 판단할 권한은 없다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>板まんだら事件\u003c/td>\u003ctd>最三小判昭56.4.7 / 民集35巻3号443頁\u003c/td>\u003ctd>종교법인 내부의 기부금 반환 청구\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 「\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>」의 요건② 결여\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「하급재판소에는 위헌심사권이 없다」는 지문은 오답!\u003c/strong> 81조는 최고재를 「終審」재판소라고 했을 뿐이며, 하급재판소도 위헌심사권을 가진다.\u003c/li>\u003cli>\u003cstrong>「최고재는 헌법재판소로서 법률의 합헌성을 추상적으로 판단할 수 있다」도 오답.\u003c/strong> 警察予備隊 판결이 정면으로 부정했다.\u003c/li>\u003cli>세트 암기: \u003cstrong>부수적 심사제 → \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a> 필요 → 위헌판결은 \u003ca href=\"#/e/%E5%80%8B%E5%88%A5%E7%9A%84%E5%8A%B9%E5%8A%9B%E8%AA%AC\">個別的効力\u003c/a>\u003c/strong>. 이 3단 논리가 그대로 출제된다.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E6%8A%BD%E8%B1%A1%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">抽象的違憲審査制\u003c/a>(독일형·일본 불채택) ↔ 付随的違憲審査制(미국형·일본 채택).\u003c/li>\u003cli>警察予備隊違憲訴訟은 「\u003cstrong>최고재에 직접 제소\u003c/strong>했다」는 사안의 특이점까지 함께 물어본다.\u003c/li>\u003c/ul>","search":"付随的違憲審査制 ふずいてきいけんしんさせい 항목 내용 ------ ------ 읽기 ふずいてきいけんしんさせい（부수적 위헌심사제） 과목 헌법（통치기구 — 재판소·위헌심사제） 한줄 정의 재판소가 구체적인 소송 사건을 재판하는 데 필요한 한도에서만 부수적으로 법령·처분의 위헌 여부를 심사하는 제도 통설·판례 부수적 심사제 사법재판소형 — 警察予備隊違憲訴訟에서 확립. 일본은 추상적 심사제를 채택하지 않음 개념 헌법 81조는 「最高裁判所は、一切の法律、命令、規則又は処分が憲法に適合するかしないかを決定する権限を有する終審裁判所である」라고 하여 위헌심사권의 주체 와 최종성 만 규정할 뿐, 그 심사가 어떤 형태로 이루어지는지는 밝히지 않는다. 그래서 미국형 부수적 심사제 인지 독일형 抽象的違憲審査制 용어/抽象的違憲審査制.md 인지가 다투어졌다. 통설·판례는 부수적 심사제 를 취한다. 근거는 81조가 「사법」의 장 제6장 에 놓여 있고, 76조 1항이 사법권을 재판소에 부여하며, 재판소법 3조 1항이 재판소의 권한을 「 法律上の争訟 용어/法律上の争訟.md 」로 한정하고 있다는 점이다. 즉 위헌심사권은 사법권 행사에 부수하여 발동되는 권한이며, 구체적 사건이 없으면 법령의 합헌성만을 따로 다투는 소송은 제기할 수 없다. 여기서 두 가지 파생 논점이 나온다. 첫째, 81조가 「最高裁判所は…終審裁判所である」라고만 하므로 하급재판소도 위헌심사권을 가진다 최고재는 어디까지나 「終審」일 뿐이다 . 둘째, 위헌판결의 효력도 당해 사건에 한정되는 것이 논리적 귀결이어서 個別的効力説 용어/個別的効力説.md 이 통설·판례가 된다. 학설 학설 내용 비고 ------ ------ ------ 付随的審査制説 81조는 사법권의 일환으로서의 위헌심사권을 정한 것. 구체적 쟁송을 떠난 심사는 불가 👉 통설·판례 抽象的審査制説 81조는 최고재에 헌법재판소로서의 지위도 부여한 것이므로 추상적 심사도 가능 소수설 법률사항설 81조는 어느 쪽도 배제하지 않으므로 법률로 정하면 추상적 심사도 도입 가능 절충설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 警察予備隊違憲訴訟（경찰예비대 위헌소송） 最大判昭27.10.8 / 民集6巻9号783頁 사회당 대표가 최고재에 직접 제소하여 경찰예비대의 설치·유지 행위가 9조 위반으로 무효라는 확인을 구함 각하 . 재판소가 가지는 것은 사법권 이고, 사법권 발동에는 구체적인 쟁송사건의 제기가 필요 하다. 구체적 사건을 떠나 추상적으로 법령의 합헌성을 판단할 권한은 없다 板まんだら事件 最三小判昭56.4.7 / 民集35巻3号443頁 종교법인 내부의 기부금 반환 청구 각하 . 「 法律上の争訟 용어/法律上の争訟.md 」의 요건② 결여 💡 수험 팁 - 「하급재판소에는 위헌심사권이 없다」는 지문은 오답! 81조는 최고재를 「終審」재판소라고 했을 뿐이며, 하급재판소도 위헌심사권을 가진다. - 「최고재는 헌법재판소로서 법률의 합헌성을 추상적으로 판단할 수 있다」도 오답. 警察予備隊 판결이 정면으로 부정했다. - 세트 암기: 부수적 심사제 → 法律上の争訟 용어/法律上の争訟.md 필요 → 위헌판결은 個別的効力 용어/個別的効力説.md . 이 3단 논리가 그대로 출제된다. - 대비: 抽象的違憲審査制 용어/抽象的違憲審査制.md 독일형·일본 불채택 ↔ 付随的違憲審査制 미국형·일본 채택 . - 警察予備隊違憲訴訟은 「 최고재에 직접 제소 했다」는 사안의 특이점까지 함께 물어본다."},"抽象的違憲審査制":{"type":"term","subject":"용어","id":"抽象的違憲審査制","title":"抽象的違憲審査制","sub":"ちゅうしょうてきいけんしんさせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ちゅうしょうてきいけんしんさせい（추상적 위헌심사제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 재판소·위헌심사제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>구체적 쟁송사건과 무관하게 법령 그 자체의 합헌성을 추상적으로 심사하는 제도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>일본은 채택하지 않음\u003c/strong> — 警察予備隊違憲訴訟이 명확히 부정. 통설·판례는 \u003ca href=\"#/e/%E4%BB%98%E9%9A%8F%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">付随的違憲審査制\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>독일 연방헌법재판소, 오스트리아 헌법재판소, 한국 헌법재판소처럼 \u003cstrong>일반 재판소와 분리된 특별한 헌법재판기관\u003c/strong>을 두고, 구체적인 권리침해 사건이 없더라도 정부·의회 소수파 등의 제소로 법령 자체의 합헌성을 심사하는 방식을 말한다(\u003cstrong>헌법재판소형\u003c/strong>). 위헌으로 판단되면 그 법령은 원칙적으로 \u003cstrong>일반적으로 효력을 잃는다\u003c/strong>(一般的効力).\u003c/p>\n\u003cp>일본 헌법 81조의 문언만 보면 「一切の法律…が憲法に適合するかしないかを決定する権限」이라 하여 추상적 심사를 허용하는 것처럼 읽을 여지도 있다. 그러나 최고재는 警察予備隊違憲訴訟(最大判昭27.10.8)에서 「わが裁判所が現行の制度上与えられているのは\u003cstrong>司法権\u003c/strong>を行う権限であり、そして司法権が発動するためには\u003cstrong>具体的な争訟事件\u003c/strong>が提起されることを必要とする」라고 하여 이를 정면으로 부정했다.\u003c/p>\n\u003cp>또한 81조가 헌법 제6장 「司法」에 놓여 있는 점, 재판소법 3조 1항이 재판소의 권한을 「\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>」로 한정하는 점도 부정설의 근거가 된다. 다만 학설상으로는 \u003cstrong>법률로 절차를 정하면 도입할 수 있다\u003c/strong>는 견해(법률사항설)와, \u003cstrong>헌법개정이 필요하다\u003c/strong>는 견해가 대립한다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>헌법상 불가설\u003c/td>\u003ctd>81조는 사법권의 일환이므로 추상적 심사는 헌법개정 없이는 불가\u003c/td>\u003ctd>유력설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법률사항설\u003c/td>\u003ctd>81조는 추상적 심사를 배제하지 않으므로 \u003cstrong>제소권자·절차를 법률로 정하면\u003c/strong> 도입 가능\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>헌법재판소설\u003c/td>\u003ctd>81조 자체가 최고재에 헌법재판소적 권한을 부여했다는 설\u003c/td>\u003ctd>소수설. 판례가 부정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>警察予備隊違憲訴訟\u003c/td>\u003ctd>最大判昭27.10.8 / 民集6巻9号783頁\u003c/td>\u003ctd>구체적 사건 없이 최고재에 직접 경찰예비대의 위헌무효 확인을 구함\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 최고재는 \u003cstrong>추상적 판단을 내리는 권한을 갖지 않는다\u003c/strong>. 일본은 추상적 심사제를 채택하지 않았음을 확인\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「일본은 추상적 위헌심사제를 채택하고 있다」는 지문은 무조건 오답.\u003c/strong>\u003c/li>\u003cli>두 제도의 대비를 표로 외워라. 추상적: 헌법재판소형·구체적 사건 불요·\u003cstrong>일반적 효력\u003c/strong> / 부수적: 사법재판소형·구체적 사건 필요·\u003cstrong>\u003ca href=\"#/e/%E5%80%8B%E5%88%A5%E7%9A%84%E5%8A%B9%E5%8A%9B%E8%AA%AC\">個別的効力\u003c/a>\u003c/strong>.\u003c/li>\u003cli>함정: 「81조의 문언상 추상적 심사도 가능하다는 견해가 \u003cstrong>있다\u003c/strong>」는 지문 자체는 학설 소개로서 옳다. \u003cstrong>판례의 입장\u003c/strong>을 묻는지 \u003cstrong>학설의 존부\u003c/strong>를 묻는지 구별할 것.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E4%BB%98%E9%9A%8F%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">付随的違憲審査制\u003c/a>.\u003c/li>\u003c/ul>","search":"抽象的違憲審査制 ちゅうしょうてきいけんしんさせい 항목 내용 ------ ------ 읽기 ちゅうしょうてきいけんしんさせい（추상적 위헌심사제） 과목 헌법（통치기구 — 재판소·위헌심사제） 한줄 정의 구체적 쟁송사건과 무관하게 법령 그 자체의 합헌성을 추상적으로 심사하는 제도 통설·판례 일본은 채택하지 않음 — 警察予備隊違憲訴訟이 명확히 부정. 통설·판례는 付随的違憲審査制 용어/付随的違憲審査制.md 개념 독일 연방헌법재판소, 오스트리아 헌법재판소, 한국 헌법재판소처럼 일반 재판소와 분리된 특별한 헌법재판기관 을 두고, 구체적인 권리침해 사건이 없더라도 정부·의회 소수파 등의 제소로 법령 자체의 합헌성을 심사하는 방식을 말한다 헌법재판소형 . 위헌으로 판단되면 그 법령은 원칙적으로 일반적으로 효력을 잃는다 一般的効力 . 일본 헌법 81조의 문언만 보면 「一切の法律…が憲法に適合するかしないかを決定する権限」이라 하여 추상적 심사를 허용하는 것처럼 읽을 여지도 있다. 그러나 최고재는 警察予備隊違憲訴訟 最大判昭27.10.8 에서 「わが裁判所が現行の制度上与えられているのは 司法権 を行う権限であり、そして司法権が発動するためには 具体的な争訟事件 が提起されることを必要とする」라고 하여 이를 정면으로 부정했다. 또한 81조가 헌법 제6장 「司法」에 놓여 있는 점, 재판소법 3조 1항이 재판소의 권한을 「 法律上の争訟 용어/法律上の争訟.md 」로 한정하는 점도 부정설의 근거가 된다. 다만 학설상으로는 법률로 절차를 정하면 도입할 수 있다 는 견해 법률사항설 와, 헌법개정이 필요하다 는 견해가 대립한다. 학설 학설 내용 비고 ------ ------ ------ 헌법상 불가설 81조는 사법권의 일환이므로 추상적 심사는 헌법개정 없이는 불가 유력설 법률사항설 81조는 추상적 심사를 배제하지 않으므로 제소권자·절차를 법률로 정하면 도입 가능 헌법재판소설 81조 자체가 최고재에 헌법재판소적 권한을 부여했다는 설 소수설. 판례가 부정 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 警察予備隊違憲訴訟 最大判昭27.10.8 / 民集6巻9号783頁 구체적 사건 없이 최고재에 직접 경찰예비대의 위헌무효 확인을 구함 각하 . 최고재는 추상적 판단을 내리는 권한을 갖지 않는다 . 일본은 추상적 심사제를 채택하지 않았음을 확인 💡 수험 팁 - 「일본은 추상적 위헌심사제를 채택하고 있다」는 지문은 무조건 오답. - 두 제도의 대비를 표로 외워라. 추상적: 헌법재판소형·구체적 사건 불요· 일반적 효력 / 부수적: 사법재판소형·구체적 사건 필요· 個別的効力 용어/個別的効力説.md . - 함정: 「81조의 문언상 추상적 심사도 가능하다는 견해가 있다 」는 지문 자체는 학설 소개로서 옳다. 판례의 입장 을 묻는지 학설의 존부 를 묻는지 구별할 것. - 대비: 付随的違憲審査制 용어/付随的違憲審査制.md ."},"部分社会の法理":{"type":"term","subject":"용어","id":"部分社会の法理","title":"部分社会の法理","sub":"ぶぶんしゃかいのほうり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぶぶんしゃかいのほうり（부분사회의 법리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 사법권의 한계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>대학·지방의회·정당 등 자율적 법규범을 가지는 단체 내부의 분쟁은, \u003cstrong>일반 시민법질서와 직접 관계되지 않는 한\u003c/strong> 그 자주적·자율적 해결에 맡겨져 사법심사가 미치지 않는다는 법리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>판례는 이 법리를 인정. 다만 「일반 시민법질서와 직접 관계되는가」로 개별 판단\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>법률상의 쟁송(\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>)에 해당하더라도, 자율적 내부규율을 가지는 단체(\u003cstrong>部分社会\u003c/strong>)의 내부 문제에 대해서는 단체의 자치를 존중하여 사법권이 개입하지 않는다는 것이 부분사회의 법리다. \u003cstrong>사법권의 「한계」\u003c/strong>의 문제이지, 「범위」의 문제가 아니다.\u003c/p>\n\u003cp>리딩 케이스는 \u003cstrong>富山大学単位不認定事件\u003c/strong>(最三小判昭52.3.15)이다. 최고재는 대학을 「\u003cstrong>일반 시민사회와는 다른 특수한 부분사회\u003c/strong>」로 보고, 대학의 \u003cstrong>단위 인정(단위 수여) 행위\u003c/strong>는 「일반 시민법질서와 직접의 관계를 가진다고 인정하기에 족한 \u003cstrong>특단의 사정이 없는 한\u003c/strong>」 사법심사의 대상이 되지 않는다고 했다. 반면 같은 날 선고된 \u003cstrong>전공과 수료 인정\u003c/strong> 사건에서는, 수료 인정을 하지 않는 것은 실질적으로 \u003cstrong>학생의 일반 시민으로서의 국공립대학 이용을 거부\u003c/strong>하는 것이므로 \u003cstrong>사법심사의 대상이 된다\u003c/strong>고 했다. 즉 대학 내부 사항이라도 \u003cstrong>학생의 시민으로서의 지위(졸업·수료 등)에 직결\u003c/strong>되면 심사가 미친다.\u003c/p>\n\u003cp>지방의회에 관해서는 오랫동안 \u003cstrong>제명은 심사 대상, 출석정지는 대상 아님\u003c/strong>(最大判昭35.10.19)이라는 구도가 유지되었으나, \u003cstrong>岩沼市議会出席停止事件\u003c/strong>(最大判令2.11.25)이 이 판례를 \u003cstrong>변경\u003c/strong>하여 \u003cstrong>출석정지 징벌도 사법심사의 대상이 된다\u003c/strong>고 했다. 최고재는 출석정지가 의원의 「주민의 부탁을 받은 중요한 직무의 수행」을 정지시키는 것이며, 그 적부는 \u003cstrong>사법심사의 대상이 된다\u003c/strong>고 판시했다. \u003cstrong>행정서사 시험에서는 이 판례 변경이 최중요 포인트다.\u003c/strong>\u003c/p>\n\u003cp>정당에 대해서는 共産党袴田事件(最三小判昭63.12.20)이, 정당의 자율성을 존중하여 당원 처분이 일반 시민법질서와 관계되는 경우에도 재판소의 심사는 \u003cstrong>당의 절차가 정관 등에 따랐는가, 그것이 조리에 반하지 않는가\u003c/strong>라는 \u003cstrong>절차적 심사에 그친다\u003c/strong>고 했다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>富山大学単位不認定事件\u003c/td>\u003ctd>最三小判昭52.3.15 / 民集31巻2号234頁\u003c/td>\u003ctd>학부장의 수강 중지 지시를 따르지 않고 시험을 본 학생의 \u003cstrong>단위 불인정\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>심사 대상 아님\u003c/strong>. 대학은 특수한 부분사회이며, 단위 수여 행위는 \u003cstrong>일반 시민법질서와 직접 관계된다고 볼 특단의 사정이 없는 한\u003c/strong> 사법심사가 미치지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>富山大学専攻科修了不認定事件\u003c/td>\u003ctd>最三小判昭52.3.15 / 民集31巻2号280頁\u003c/td>\u003ctd>같은 대학의 \u003cstrong>전공과 수료 불인정\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>심사 대상 O\u003c/strong>. 수료 불인정은 실질적으로 \u003cstrong>일반 시민으로서의 국공립대학 이용 거부\u003c/strong>에 해당\u003c/td>\u003c/tr>\u003ctr>\u003ctd>村会議員出席停止事件\u003c/td>\u003ctd>最大判昭35.10.19\u003c/td>\u003ctd>촌의회 의원에 대한 \u003cstrong>출석정지\u003c/strong> 징벌\u003c/td>\u003ctd>（구판례）제명은 심사 대상이나 \u003cstrong>출석정지는 대상 아님\u003c/strong> → \u003cstrong>令2.11.25 판결로 변경됨\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>岩沼市議会出席停止事件\u003c/td>\u003ctd>\u003cstrong>最大判令2.11.25\u003c/strong> / 民集74巻8号\u003c/td>\u003ctd>시의회 의원에 대한 \u003cstrong>23일간 출석정지\u003c/strong> 징벌의 취소 청구\u003c/td>\u003ctd>\u003cstrong>심사 대상 O\u003c/strong>（\u003cstrong>판례 변경\u003c/strong>）. 출석정지는 의원의 중요한 직무 수행을 정지시키는 것이므로 그 적부는 \u003cstrong>항상 사법심사의 대상\u003c/strong>이 된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>共産党袴田事件\u003c/td>\u003ctd>最三小判昭63.12.20\u003c/td>\u003ctd>정당의 당원 제명과 가옥 명도 청구\u003c/td>\u003ctd>정당의 자율성을 존중. 심사는 \u003cstrong>절차가 정관·조리에 반하지 않는가\u003c/strong>에 그침\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최중요 함정\u003c/strong>: 「지방의회 의원에 대한 \u003cstrong>출석정지\u003c/strong>는 사법심사의 대상이 되지 않는다」는 지문은 \u003cstrong>현재는 오답\u003c/strong>이다. 最大判令2.11.25로 판례가 변경되었다. 옛 교재·기출은 옛 판례 기준이므로 반드시 갱신할 것.\u003c/li>\u003cli>富山大学 사건은 \u003cstrong>같은 날 두 판결\u003c/strong>이 결론이 갈린다. \u003cstrong>단위 인정 = 심사 대상 ×\u003c/strong> / \u003cstrong>전공과 수료 인정 = 심사 대상 ○\u003c/strong>. 이 대비가 그대로 출제된다.\u003c/li>\u003cli>판단 기준 문구를 그대로 외워라: 「\u003cstrong>一般市民法秩序と直接の関係を有する\u003c/strong>」인가.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>(사법권의 \u003cstrong>범위\u003c/strong>) ↔ 部分社会の法理·\u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>(사법권의 \u003cstrong>한계\u003c/strong>).\u003c/li>\u003cli>정당은 「심사 자체를 안 한다」가 아니라 \u003cstrong>절차적 심사만 한다\u003c/strong>는 점(共産党袴田事件)이 함정.\u003c/li>\u003c/ul>","search":"部分社会の法理 ぶぶんしゃかいのほうり 항목 내용 ------ ------ 읽기 ぶぶんしゃかいのほうり（부분사회의 법리） 과목 헌법（통치기구 — 사법권의 한계） 한줄 정의 대학·지방의회·정당 등 자율적 법규범을 가지는 단체 내부의 분쟁은, 일반 시민법질서와 직접 관계되지 않는 한 그 자주적·자율적 해결에 맡겨져 사법심사가 미치지 않는다는 법리 통설·판례 판례는 이 법리를 인정. 다만 「일반 시민법질서와 직접 관계되는가」로 개별 판단 개념 법률상의 쟁송 法律上の争訟 용어/法律上の争訟.md 에 해당하더라도, 자율적 내부규율을 가지는 단체 部分社会 의 내부 문제에 대해서는 단체의 자치를 존중하여 사법권이 개입하지 않는다는 것이 부분사회의 법리다. 사법권의 「한계」 의 문제이지, 「범위」의 문제가 아니다. 리딩 케이스는 富山大学単位不認定事件 最三小判昭52.3.15 이다. 최고재는 대학을 「 일반 시민사회와는 다른 특수한 부분사회 」로 보고, 대학의 단위 인정 단위 수여 행위 는 「일반 시민법질서와 직접의 관계를 가진다고 인정하기에 족한 특단의 사정이 없는 한 」 사법심사의 대상이 되지 않는다고 했다. 반면 같은 날 선고된 전공과 수료 인정 사건에서는, 수료 인정을 하지 않는 것은 실질적으로 학생의 일반 시민으로서의 국공립대학 이용을 거부 하는 것이므로 사법심사의 대상이 된다 고 했다. 즉 대학 내부 사항이라도 학생의 시민으로서의 지위 졸업·수료 등 에 직결 되면 심사가 미친다. 지방의회에 관해서는 오랫동안 제명은 심사 대상, 출석정지는 대상 아님 最大判昭35.10.19 이라는 구도가 유지되었으나, 岩沼市議会出席停止事件 最大判令2.11.25 이 이 판례를 변경 하여 출석정지 징벌도 사법심사의 대상이 된다 고 했다. 최고재는 출석정지가 의원의 「주민의 부탁을 받은 중요한 직무의 수행」을 정지시키는 것이며, 그 적부는 사법심사의 대상이 된다 고 판시했다. 행정서사 시험에서는 이 판례 변경이 최중요 포인트다. 정당에 대해서는 共産党袴田事件 最三小判昭63.12.20 이, 정당의 자율성을 존중하여 당원 처분이 일반 시민법질서와 관계되는 경우에도 재판소의 심사는 당의 절차가 정관 등에 따랐는가, 그것이 조리에 반하지 않는가 라는 절차적 심사에 그친다 고 했다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 富山大学単位不認定事件 最三小判昭52.3.15 / 民集31巻2号234頁 학부장의 수강 중지 지시를 따르지 않고 시험을 본 학생의 단위 불인정 심사 대상 아님 . 대학은 특수한 부분사회이며, 단위 수여 행위는 일반 시민법질서와 직접 관계된다고 볼 특단의 사정이 없는 한 사법심사가 미치지 않음 富山大学専攻科修了不認定事件 最三小判昭52.3.15 / 民集31巻2号280頁 같은 대학의 전공과 수료 불인정 심사 대상 o . 수료 불인정은 실질적으로 일반 시민으로서의 국공립대학 이용 거부 에 해당 村会議員出席停止事件 最大判昭35.10.19 촌의회 의원에 대한 출석정지 징벌 （구판례）제명은 심사 대상이나 출석정지는 대상 아님 → 令2.11.25 판결로 변경됨 岩沼市議会出席停止事件 最大判令2.11.25 / 民集74巻8号 시의회 의원에 대한 23일간 출석정지 징벌의 취소 청구 심사 대상 o （ 판례 변경 ）. 출석정지는 의원의 중요한 직무 수행을 정지시키는 것이므로 그 적부는 항상 사법심사의 대상 이 된다 共産党袴田事件 最三小判昭63.12.20 정당의 당원 제명과 가옥 명도 청구 정당의 자율성을 존중. 심사는 절차가 정관·조리에 반하지 않는가 에 그침 💡 수험 팁 - 최중요 함정 : 「지방의회 의원에 대한 출석정지 는 사법심사의 대상이 되지 않는다」는 지문은 현재는 오답 이다. 最大判令2.11.25로 판례가 변경되었다. 옛 교재·기출은 옛 판례 기준이므로 반드시 갱신할 것. - 富山大学 사건은 같은 날 두 판결 이 결론이 갈린다. 단위 인정 = 심사 대상 × / 전공과 수료 인정 = 심사 대상 ○ . 이 대비가 그대로 출제된다. - 판단 기준 문구를 그대로 외워라: 「 一般市民法秩序と直接の関係を有する 」인가. - 대비: 法律上の争訟 용어/法律上の争訟.md 사법권의 범위 ↔ 部分社会の法理· 統治行為論 용어/統治行為論.md 사법권의 한계 . - 정당은 「심사 자체를 안 한다」가 아니라 절차적 심사만 한다 는 점 共産党袴田事件 이 함정."},"統治行為論":{"type":"term","subject":"용어","id":"統治行為論","title":"統治行為論","sub":"とうちこういろん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>とうちこういろん（통치행위론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 사법권의 한계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>직접 국가통치의 기본에 관한 고도의 정치성을 띤 국가행위\u003c/strong>는 법률상의 쟁송에 해당하고 법적 판단이 가능하더라도 사법심사의 대상에서 제외된다는 법리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>판례는 \u003cstrong>긍정\u003c/strong>（苫米地事件에서 정면으로 채택）. 학설은 내재적 제약설이 유력하나 부정설도 강함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>통치행위(統治行為, acte de gouvernement / political question)란 \u003cstrong>직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위\u003c/strong>를 말한다. 이런 행위는 \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E4%B8%8A%E3%81%AE%E4%BA%89%E8%A8%9F\">法律上の争訟\u003c/a>에 해당하고 이론적으로 법적 판단이 가능하더라도, \u003cstrong>재판소의 심사 밖에 있다\u003c/strong>는 것이 통치행위론이다.\u003c/p>\n\u003cp>리딩 케이스는 \u003cstrong>苫米地事件\u003c/strong>(最大判昭35.6.8)이다. 1952년 요시다 내각이 헌법 \u003cstrong>7조\u003c/strong>에 의해 중의원을 해산하자, 의원직을 잃은 도마베치 기조가 해산이 \u003cstrong>69조\u003c/strong>(내각불신임결의)를 전제하지 않아 무효라며 세비 지급을 청구했다. 최고재는 「\u003cstrong>直接国家統治の基本に関する高度に政治性のある国家行為\u003c/strong>のごときはたとえそれが法律上の争訟となり、これに対する有効無効の判断が法律上可能である場合であっても、\u003cstrong>かかる国家行為は裁判所の審査権の外にあり\u003c/strong>」라고 하여 청구를 배척했다.\u003c/p>\n\u003cp>근거로 최고재가 든 것은 ① \u003cstrong>삼권분립\u003c/strong>의 원리, ② 그러한 행위에 대한 판단은 \u003cstrong>주권자인 국민에 대해 정치적 책임을 지는 정부·국회 등의 정치부문의 판단에 맡겨지고\u003c/strong>, ③ 최종적으로는 \u003cstrong>국민의 정치적 비판에 맡겨진다\u003c/strong>는 점이다. 즉 \u003cstrong>재판소의 성질에서 유래하는 내재적 제약\u003c/strong>으로 구성했다(내재적 제약설).\u003c/p>\n\u003cp>주의할 점은 최고재가 \u003cstrong>7조에 의한 해산이 적법한지 자체는 판단하지 않았다\u003c/strong>는 것이다. 해산의 유효·무효를 판단하지 않고 심사권 밖이라고만 했다(다만 실무·통설은 \u003cstrong>69조의 경우 외에도 7조 3호에 의한 해산이 가능\u003c/strong>하다고 본다).\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>내재적 제약설（긍정）\u003c/strong>\u003c/td>\u003ctd>삼권분립·국민주권에서 유래하는 사법권 자체의 내재적 한계\u003c/td>\u003ctd>👉 판례의 논리. 다수설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>자제설（긍정）\u003c/td>\u003ctd>재판소가 정책적 고려에서 심사를 \u003cstrong>자제\u003c/strong>하는 것에 불과\u003c/td>\u003ctd>자제는 재판 거부라는 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>부정설\u003c/td>\u003ctd>통치행위라는 관념을 인정할 필요 없음. 자유재량·자율권·\u003ca href=\"#/e/%E9%83%A8%E5%88%86%E7%A4%BE%E4%BC%9A%E3%81%AE%E6%B3%95%E7%90%86\">部分社会の法理\u003c/a> 등 개별 법리로 처리하면 족함\u003c/td>\u003ctd>유력한 비판설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>苫米地事件（도마베치 사건）\u003c/td>\u003ctd>\u003cstrong>最大判昭35.6.8\u003c/strong> / 民集14巻7号1206頁\u003c/td>\u003ctd>7조에 의한 중의원 해산의 무효를 주장하며 세비 지급 청구\u003c/td>\u003ctd>\u003cstrong>청구 배척\u003c/strong>. 중의원 해산은 「직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위」로 \u003cstrong>재판소의 심사권 밖\u003c/strong>. 유효·무효 자체는 판단하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>砂川事件（스나가와 사건）\u003c/td>\u003ctd>最大判昭34.12.16 / 刑集13巻13号3225頁\u003c/td>\u003ctd>미일안전보장조약에 근거한 주둔 미군의 합헌성\u003c/td>\u003ctd>조약은 고도의 정치성을 가지므로 「\u003cstrong>\u003ca href=\"#/e/%E4%B8%80%E8%A6%8B%E6%98%8E%E7%99%BD%E3%81%AE%E5%8E%9F%E5%89%87\">一見極めて明白に違憲無効\u003c/a>\u003c/strong>」로 인정되지 않는 한 사법심사 밖\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>苫米地事件의 핵심 문구 「\u003cstrong>直接国家統治の基本に関する高度に政治性のある国家行為\u003c/strong>」를 그대로 외워라.\u003c/li>\u003cli>\u003cstrong>함정\u003c/strong>: 「苫米地事件에서 최고재는 7조에 의한 해산을 \u003cstrong>합헌이라고 판단했다\u003c/strong>」는 오답. 최고재는 \u003cstrong>유효·무효 자체를 판단하지 않았다\u003c/strong>.\u003c/li>\u003cli>대비: \u003cstrong>苫米地 = 심사를 완전히 배제\u003c/strong> / \u003cstrong>砂川 = 「일견 극히 명백히 위헌무효」인 경우에는 심사 여지를 남김\u003c/strong>. 따라서 砂川를 순수한 통치행위론으로 보지 않는 견해가 유력하다 → \u003ca href=\"#/e/%E4%B8%80%E8%A6%8B%E6%98%8E%E7%99%BD%E3%81%AE%E5%8E%9F%E5%89%87\">一見明白の原則\u003c/a> 참조.\u003c/li>\u003cli>통치행위는 \u003cstrong>법률상의 쟁송에 해당함을 전제로\u003c/strong> 심사가 배제되는 유형이다. 「법률상의 쟁송이 아니므로 각하」라고 쓴 지문은 논리가 틀렸다.\u003c/li>\u003cli>관련 사법권의 한계 유형 정리: 통치행위 / \u003ca href=\"#/e/%E9%83%A8%E5%88%86%E7%A4%BE%E4%BC%9A%E3%81%AE%E6%B3%95%E7%90%86\">部分社会\u003c/a> / 자유재량 / 의원의 자율권(의사절차·의원 징벌) / 입법부작위.\u003c/li>\u003c/ul>","search":"統治行為論 とうちこういろん 항목 내용 ------ ------ 읽기 とうちこういろん（통치행위론） 과목 헌법（통치기구 — 사법권의 한계） 한줄 정의 직접 국가통치의 기본에 관한 고도의 정치성을 띤 국가행위 는 법률상의 쟁송에 해당하고 법적 판단이 가능하더라도 사법심사의 대상에서 제외된다는 법리 통설·판례 판례는 긍정 （苫米地事件에서 정면으로 채택）. 학설은 내재적 제약설이 유력하나 부정설도 강함 개념 통치행위 統治行為, acte de gouvernement / political question 란 직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위 를 말한다. 이런 행위는 法律上の争訟 용어/法律上の争訟.md 에 해당하고 이론적으로 법적 판단이 가능하더라도, 재판소의 심사 밖에 있다 는 것이 통치행위론이다. 리딩 케이스는 苫米地事件 最大判昭35.6.8 이다. 1952년 요시다 내각이 헌법 7조 에 의해 중의원을 해산하자, 의원직을 잃은 도마베치 기조가 해산이 69조 내각불신임결의 를 전제하지 않아 무효라며 세비 지급을 청구했다. 최고재는 「 直接国家統治の基本に関する高度に政治性のある国家行為 のごときはたとえそれが法律上の争訟となり、これに対する有効無効の判断が法律上可能である場合であっても、 かかる国家行為は裁判所の審査権の外にあり 」라고 하여 청구를 배척했다. 근거로 최고재가 든 것은 ① 삼권분립 의 원리, ② 그러한 행위에 대한 판단은 주권자인 국민에 대해 정치적 책임을 지는 정부·국회 등의 정치부문의 판단에 맡겨지고 , ③ 최종적으로는 국민의 정치적 비판에 맡겨진다 는 점이다. 즉 재판소의 성질에서 유래하는 내재적 제약 으로 구성했다 내재적 제약설 . 주의할 점은 최고재가 7조에 의한 해산이 적법한지 자체는 판단하지 않았다 는 것이다. 해산의 유효·무효를 판단하지 않고 심사권 밖이라고만 했다 다만 실무·통설은 69조의 경우 외에도 7조 3호에 의한 해산이 가능 하다고 본다 . 학설 학설 내용 비고 ------ ------ ------ 내재적 제약설（긍정） 삼권분립·국민주권에서 유래하는 사법권 자체의 내재적 한계 👉 판례의 논리. 다수설 자제설（긍정） 재판소가 정책적 고려에서 심사를 자제 하는 것에 불과 자제는 재판 거부라는 비판 부정설 통치행위라는 관념을 인정할 필요 없음. 자유재량·자율권· 部分社会の法理 용어/部分社会の法理.md 등 개별 법리로 처리하면 족함 유력한 비판설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 苫米地事件（도마베치 사건） 最大判昭35.6.8 / 民集14巻7号1206頁 7조에 의한 중의원 해산의 무효를 주장하며 세비 지급 청구 청구 배척 . 중의원 해산은 「직접 국가통치의 기본에 관한 고도로 정치성 있는 국가행위」로 재판소의 심사권 밖 . 유효·무효 자체는 판단하지 않음 砂川事件（스나가와 사건） 最大判昭34.12.16 / 刑集13巻13号3225頁 미일안전보장조약에 근거한 주둔 미군의 합헌성 조약은 고도의 정치성을 가지므로 「 一見極めて明白に違憲無効 용어/一見明白の原則.md 」로 인정되지 않는 한 사법심사 밖 💡 수험 팁 - 苫米地事件의 핵심 문구 「 直接国家統治の基本に関する高度に政治性のある国家行為 」를 그대로 외워라. - 함정 : 「苫米地事件에서 최고재는 7조에 의한 해산을 합헌이라고 판단했다 」는 오답. 최고재는 유효·무효 자체를 판단하지 않았다 . - 대비: 苫米地 = 심사를 완전히 배제 / 砂川 = 「일견 극히 명백히 위헌무효」인 경우에는 심사 여지를 남김 . 따라서 砂川를 순수한 통치행위론으로 보지 않는 견해가 유력하다 → 一見明白の原則 용어/一見明白の原則.md 참조. - 통치행위는 법률상의 쟁송에 해당함을 전제로 심사가 배제되는 유형이다. 「법률상의 쟁송이 아니므로 각하」라고 쓴 지문은 논리가 틀렸다. - 관련 사법권의 한계 유형 정리: 통치행위 / 部分社会 용어/部分社会の法理.md / 자유재량 / 의원의 자율권 의사절차·의원 징벌 / 입법부작위."},"一見明白の原則":{"type":"term","subject":"용어","id":"一見明白の原則","title":"一見明白の原則","sub":"いっけんめいはくのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>いっけんめいはくのげんそく（일견명백의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 사법권의 한계·조약의 위헌심사）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>주권국의 존립 기초에 중대한 관계를 갖는 \u003cstrong>고도의 정치성\u003c/strong>을 띤 조약 등은, 「\u003cstrong>일견 극히 명백히 위헌무효\u003c/strong>」라고 인정되지 않는 한 사법심사의 범위 밖이라는 기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>砂川事件(最大判昭34.12.16)이 채택. 조약도 원칙적으로 위헌심사의 대상이 될 수 있음을 전제로 함\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>砂川事件은 도쿄 스나가와의 미군 다치카와 기지 확장 측량에 반대한 시위대가 기지 안으로 들어가 \u003cstrong>일미안전보장조약 3조에 근거한 형사특별법\u003c/strong>으로 기소된 사건이다. 쟁점은 미군 주둔이 헌법 \u003cstrong>9조 2항의 「戦力」\u003c/strong>에 해당하는가, 그리고 \u003cstrong>조약이 위헌심사의 대상이 되는가\u003c/strong>였다.\u003c/p>\n\u003cp>최고재는 먼저 9조 2항의 「전력」은 \u003cstrong>일본이 주체가 되어 지휘·관리권을 행사하는 전력\u003c/strong>을 말하므로 외국 군대인 주둔 미군은 이에 해당하지 않는다고 했다. 그 위에 미일안보조약에 대해 「\u003cstrong>主権国としてのわが国の存立の基礎に極めて重大な関係をもつ高度の政治性を有するもの\u003c/strong>」이며 그 내용의 합헌 여부 판단은 「\u003cstrong>純司法的機能をその使命とする司法裁判所の審査には、原則としてなじまない性質のもの\u003c/strong>」라고 하면서, 「\u003cstrong>一見極めて明白に違憲無効であると認められない限りは\u003c/strong>、裁判所の司法審査権の範囲外にある」라고 판시했다.\u003c/p>\n\u003cp>여기서 중요한 것은 이 판시가 \u003cstrong>① 조약도 위헌심사의 대상이 될 여지를 남겼고(=일견 극히 명백히 위헌무효면 심사 가능)\u003c/strong>, \u003cstrong>② 그 판단은 제1차적으로는 조약 체결권을 가진 내각과 승인권을 가진 국회의 판단, 종국적으로는 주권자인 국민의 정치적 비판에 맡겨진다\u003c/strong>고 한 점이다.\u003c/p>\n\u003cp>\u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>과의 관계에서, 苫米地事件은 심사를 \u003cstrong>전면 배제\u003c/strong>한 데 반해 砂川事件은 \u003cstrong>명백한 위헌인 경우의 심사 여지를 유보\u003c/strong>했다. 그래서 砂川를 「순수한 통치행위론이 아니라 통치행위론과 재량론(내각·국회의 판단 존중)이 섞인 변형」으로 보는 견해가 유력하다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>砂川事件（스나가와 사건）\u003c/td>\u003ctd>\u003cstrong>最大判昭34.12.16\u003c/strong> / 刑集13巻13号3225頁\u003c/td>\u003ctd>미군 기지 확장에 반대한 시위대가 기지 내에 침입하여 형사특별법 위반으로 기소. 미군 주둔의 합헌성이 쟁점\u003c/td>\u003ctd>\u003cstrong>파기환송(피고인 측 패)\u003c/strong>. ① 9조 2항의 「전력」은 \u003cstrong>일본이 지휘·관리권을 갖는 전력\u003c/strong>을 말하므로 주둔 미군은 「전력」이 아님. ② 미일안보조약은 고도의 정치성을 가지므로 \u003cstrong>「일견 극히 명백히 위헌무효」로 인정되지 않는 한\u003c/strong> 사법심사의 범위 밖\u003c/td>\u003c/tr>\u003ctr>\u003ctd>苫米地事件\u003c/td>\u003ctd>最大判昭35.6.8 / 民集14巻7号1206頁\u003c/td>\u003ctd>7조에 의한 중의원 해산\u003c/td>\u003ctd>\u003cstrong>심사 전면 배제\u003c/strong>. 유효·무효를 판단하지 않음 → \u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>문구를 정확히: 「\u003cstrong>一見極めて明白に違憲無効であると認められない限り\u003c/strong>」. 「명백히 위헌이면 심사할 수 있다」는 여지가 남아 있다는 점이 핵심이다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「최고재는 조약은 위헌심사의 대상이 전혀 되지 않는다고 했다」는 오답. 砂川 판결은 오히려 \u003cstrong>조약도 심사 대상이 될 여지를 인정\u003c/strong>한 것으로 읽는 것이 통설적 이해다.\u003c/li>\u003cli>\u003cstrong>대비 암기\u003c/strong>: 砂川(조약·\u003cstrong>일견명백 기준\u003c/strong>·심사 여지 유보) ↔ 苫米地(중의원 해산·\u003cstrong>순수 통치행위론\u003c/strong>·심사 전면 배제).\u003c/li>\u003cli>또 하나의 함정: 「최고재는 자위대가 9조 위반이 아니라고 판단했다」는 오답. 砂川 판결이 다룬 것은 \u003cstrong>주둔 미군\u003c/strong>이지 자위대가 아니다.\u003c/li>\u003cli>砂川 판결은 9조 논점(「전력」의 의의)과 사법심사 논점 \u003cstrong>두 개\u003c/strong>를 한 판결에서 다룬다. 세트로 출제된다.\u003c/li>\u003c/ul>","search":"一見明白の原則 いっけんめいはくのげんそく 항목 내용 ------ ------ 읽기 いっけんめいはくのげんそく（일견명백의 원칙） 과목 헌법（통치기구 — 사법권의 한계·조약의 위헌심사） 한줄 정의 주권국의 존립 기초에 중대한 관계를 갖는 고도의 정치성 을 띤 조약 등은, 「 일견 극히 명백히 위헌무효 」라고 인정되지 않는 한 사법심사의 범위 밖이라는 기준 통설·판례 砂川事件 最大判昭34.12.16 이 채택. 조약도 원칙적으로 위헌심사의 대상이 될 수 있음을 전제로 함 개념 砂川事件은 도쿄 스나가와의 미군 다치카와 기지 확장 측량에 반대한 시위대가 기지 안으로 들어가 일미안전보장조약 3조에 근거한 형사특별법 으로 기소된 사건이다. 쟁점은 미군 주둔이 헌법 9조 2항의 「戦力」 에 해당하는가, 그리고 조약이 위헌심사의 대상이 되는가 였다. 최고재는 먼저 9조 2항의 「전력」은 일본이 주체가 되어 지휘·관리권을 행사하는 전력 을 말하므로 외국 군대인 주둔 미군은 이에 해당하지 않는다고 했다. 그 위에 미일안보조약에 대해 「 主権国としてのわが国の存立の基礎に極めて重大な関係をもつ高度の政治性を有するもの 」이며 그 내용의 합헌 여부 판단은 「 純司法的機能をその使命とする司法裁判所の審査には、原則としてなじまない性質のもの 」라고 하면서, 「 一見極めて明白に違憲無効であると認められない限りは 、裁判所の司法審査権の範囲外にある」라고 판시했다. 여기서 중요한 것은 이 판시가 ① 조약도 위헌심사의 대상이 될 여지를 남겼고 =일견 극히 명백히 위헌무효면 심사 가능 , ② 그 판단은 제1차적으로는 조약 체결권을 가진 내각과 승인권을 가진 국회의 판단, 종국적으로는 주권자인 국민의 정치적 비판에 맡겨진다 고 한 점이다. 統治行為論 용어/統治行為論.md 과의 관계에서, 苫米地事件은 심사를 전면 배제 한 데 반해 砂川事件은 명백한 위헌인 경우의 심사 여지를 유보 했다. 그래서 砂川를 「순수한 통치행위론이 아니라 통치행위론과 재량론 내각·국회의 판단 존중 이 섞인 변형」으로 보는 견해가 유력하다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 砂川事件（스나가와 사건） 最大判昭34.12.16 / 刑集13巻13号3225頁 미군 기지 확장에 반대한 시위대가 기지 내에 침입하여 형사특별법 위반으로 기소. 미군 주둔의 합헌성이 쟁점 파기환송 피고인 측 패 . ① 9조 2항의 「전력」은 일본이 지휘·관리권을 갖는 전력 을 말하므로 주둔 미군은 「전력」이 아님. ② 미일안보조약은 고도의 정치성을 가지므로 「일견 극히 명백히 위헌무효」로 인정되지 않는 한 사법심사의 범위 밖 苫米地事件 最大判昭35.6.8 / 民集14巻7号1206頁 7조에 의한 중의원 해산 심사 전면 배제 . 유효·무효를 판단하지 않음 → 統治行為論 용어/統治行為論.md 💡 수험 팁 - 문구를 정확히: 「 一見極めて明白に違憲無効であると認められない限り 」. 「명백히 위헌이면 심사할 수 있다」는 여지가 남아 있다는 점이 핵심이다. - 최대 함정 : 「최고재는 조약은 위헌심사의 대상이 전혀 되지 않는다고 했다」는 오답. 砂川 판결은 오히려 조약도 심사 대상이 될 여지를 인정 한 것으로 읽는 것이 통설적 이해다. - 대비 암기 : 砂川 조약· 일견명백 기준 ·심사 여지 유보 ↔ 苫米地 중의원 해산· 순수 통치행위론 ·심사 전면 배제 . - 또 하나의 함정: 「최고재는 자위대가 9조 위반이 아니라고 판단했다」는 오답. 砂川 판결이 다룬 것은 주둔 미군 이지 자위대가 아니다. - 砂川 판결은 9조 논점 「전력」의 의의 과 사법심사 논점 두 개 를 한 판결에서 다룬다. 세트로 출제된다."},"個別的効力説":{"type":"term","subject":"용어","id":"個別的効力説","title":"個別的効力説","sub":"こべつてきこうりょくせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>こべつてきこうりょくせつ（개별적 효력설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 위헌심사제·위헌판결의 효력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>법령을 위헌으로 판단한 판결의 효력은 \u003cstrong>당해 사건에 한하여\u003c/strong> 미치고, 그 법령이 일반적으로 효력을 잃는 것은 아니라는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>통설·판례\u003c/strong> — \u003ca href=\"#/e/%E4%BB%98%E9%9A%8F%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">付随的違憲審査制\u003c/a>의 논리적 귀결\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 81조는 최고재의 위헌심사권을 정하지만, 위헌판결이 나오면 그 법령이 \u003cstrong>어떻게 되는가\u003c/strong>는 규정하지 않는다. 여기서 효력 범위에 관한 학설 대립이 생긴다.\u003c/p>\n\u003cp>통설·판례는 \u003cstrong>개별적 효력설\u003c/strong>을 취한다. 일본이 \u003ca href=\"#/e/%E4%BB%98%E9%9A%8F%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">付随的違憲審査制\u003c/a>를 채택한 이상 위헌심사는 \u003cstrong>구체적 사건의 해결에 필요한 한도\u003c/strong>에서만 이루어지므로, 그 판단의 효력도 당해 사건에 그쳐야 한다는 것이다. 또 일반적 효력을 인정하면 재판소가 \u003cstrong>법령을 폐지하는 소극적 입법\u003c/strong>을 하게 되어 「국회는 국의 \u003cstrong>유일한 입법기관\u003c/strong>」이라는 \u003cstrong>41조\u003c/strong>(\u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E4%B8%AD%E5%BF%83%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会中心立法の原則\u003c/a>)에 저촉된다는 점도 근거가 된다.\u003c/p>\n\u003cp>실증적 예가 \u003cspan>尊属殺重罰規定違憲判決\u003c/span>(最大判昭48.4.4)이다. 형법 200조가 위헌으로 판단된 뒤에도 \u003cstrong>조문 자체는 1995년 형법 개정 때까지 형법전에 그대로 남아 있었다\u003c/strong>. 다만 법무성이 200조를 적용한 기소를 하지 않도록 조치했고, 이후 하급심도 최고재 판단을 따랐다. 즉 \u003cstrong>법적으로는 개별적 효력이지만, 선례구속·행정실무·입법을 통해 사실상 일반적 효력에 가까운 결과\u003c/strong>가 생긴다는 것이 실무의 모습이다.\u003c/p>\n\u003cp>한편 최고재가 법령 자체를 위헌으로 하지 않고 \u003cstrong>당해 사건에의 적용만을 위헌으로 하는 방식\u003c/strong>(적용위헌)이나, 위법을 인정하면서도 청구는 기각하는 \u003cstrong>事情判決의 법리\u003c/strong>(\u003cspan>議員定数不均衡訴訟\u003c/span>)도 부수적 심사제 아래에서 판결의 파급효를 조정하는 기법으로 이해된다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>個別的効力説\u003c/strong>\u003c/td>\u003ctd>위헌판결의 효력은 \u003cstrong>당해 사건에 한정\u003c/strong>. 법령은 형식적으로 존속하며 폐지는 국회의 몫\u003c/td>\u003ctd>👉 \u003cstrong>통설·판례\u003c/strong>. 부수적 심사제의 귀결\u003c/td>\u003c/tr>\u003ctr>\u003ctd>一般的効力説\u003c/td>\u003ctd>위헌판결로 그 법령은 \u003cstrong>객관적으로 효력을 상실\u003c/strong>(일반적으로 무효)\u003c/td>\u003ctd>재판소가 소극적 입법을 하게 되어 \u003cstrong>41조 위반\u003c/strong>이라는 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>법률위임설\u003c/td>\u003ctd>효력 범위는 헌법이 정하지 않았으므로 \u003cstrong>법률로 정할 사항\u003c/strong>이라는 절충설\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>尊属殺重罰規定違憲判決\u003c/span>\u003c/td>\u003ctd>最大判昭48.4.4\u003c/td>\u003ctd>형법 200조(존속살 중벌 규정)의 14조 1항 적합성\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 그럼에도 형법 200조는 \u003cstrong>1995년 형법 개정까지 조문으로 존속\u003c/strong> → 개별적 효력설의 실증\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>議員定数不均衡訴訟\u003c/span>\u003c/td>\u003ctd>最大判昭51.4.14 / 民集30巻3号223頁\u003c/td>\u003ctd>의원정수 배분 규정의 위헌성과 선거의 효력\u003c/td>\u003ctd>정수 배분 규정은 \u003cstrong>위헌\u003c/strong>이지만 \u003cstrong>선거 자체는 무효로 하지 않음\u003c/strong>(事情判決의 법리)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「위헌판결이 있으면 그 법률은 당연히·소급적으로 효력을 잃는다」는 지문은 오답.\u003c/strong> 개별적 효력설이 통설·판례다.\u003c/li>\u003cli>강력한 암기 소재: \u003cstrong>尊属殺 위헌판결(1973년) → 형법 200조 삭제(1995년)까지 22년간 조문이 남아 있었다.\u003c/strong> 이 사실 하나로 개별적 효력설을 설명할 수 있다.\u003c/li>\u003cli>일반적 효력설에 대한 결정적 비판은 「재판소가 \u003cstrong>소극적 입법\u003c/strong>을 하게 되어 \u003cstrong>41조\u003c/strong>의 \u003ca href=\"#/e/%E5%9B%BD%E4%BC%9A%E4%B8%AD%E5%BF%83%E7%AB%8B%E6%B3%95%E3%81%AE%E5%8E%9F%E5%89%87\">国会中心立法の原則\u003c/a>에 반한다」는 것. 조문 번호까지 함께 외울 것.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E6%8A%BD%E8%B1%A1%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">抽象的違憲審査制\u003c/a>(독일형)에서는 \u003cstrong>일반적 효력\u003c/strong>이 원칙. 제도 유형과 효력이 세트라는 점을 잡아 두면 헷갈리지 않는다.\u003c/li>\u003cli>함정: 「최고재가 위헌으로 한 법률을 국회가 폐지하지 않으면 위헌판결의 의미가 없다」는 식의 극단 지문도 오답. \u003cstrong>당해 사건에서는 그 법령이 적용되지 않는다\u003c/strong>는 효과는 확실히 발생한다.\u003c/li>\u003c/ul>","search":"個別的効力説 こべつてきこうりょくせつ 항목 내용 ------ ------ 읽기 こべつてきこうりょくせつ（개별적 효력설） 과목 헌법（통치기구 — 위헌심사제·위헌판결의 효력） 한줄 정의 법령을 위헌으로 판단한 판결의 효력은 당해 사건에 한하여 미치고, 그 법령이 일반적으로 효력을 잃는 것은 아니라는 학설 통설·판례 통설·판례 — 付随的違憲審査制 용어/付随的違憲審査制.md 의 논리적 귀결 개념 헌법 81조는 최고재의 위헌심사권을 정하지만, 위헌판결이 나오면 그 법령이 어떻게 되는가 는 규정하지 않는다. 여기서 효력 범위에 관한 학설 대립이 생긴다. 통설·판례는 개별적 효력설 을 취한다. 일본이 付随的違憲審査制 용어/付随的違憲審査制.md 를 채택한 이상 위헌심사는 구체적 사건의 해결에 필요한 한도 에서만 이루어지므로, 그 판단의 효력도 당해 사건에 그쳐야 한다는 것이다. 또 일반적 효력을 인정하면 재판소가 법령을 폐지하는 소극적 입법 을 하게 되어 「국회는 국의 유일한 입법기관 」이라는 41조 国会中心立法の原則 용어/国会中心立法の原則.md 에 저촉된다는 점도 근거가 된다. 실증적 예가 尊属殺重罰規定違憲判決 헌법/尊属殺重罰規定違憲判決.md 最大判昭48.4.4 이다. 형법 200조가 위헌으로 판단된 뒤에도 조문 자체는 1995년 형법 개정 때까지 형법전에 그대로 남아 있었다 . 다만 법무성이 200조를 적용한 기소를 하지 않도록 조치했고, 이후 하급심도 최고재 판단을 따랐다. 즉 법적으로는 개별적 효력이지만, 선례구속·행정실무·입법을 통해 사실상 일반적 효력에 가까운 결과 가 생긴다는 것이 실무의 모습이다. 한편 최고재가 법령 자체를 위헌으로 하지 않고 당해 사건에의 적용만을 위헌으로 하는 방식 적용위헌 이나, 위법을 인정하면서도 청구는 기각하는 事情判決의 법리 議員定数不均衡訴訟 헌법/議員定数不均衡訴訟.md 도 부수적 심사제 아래에서 판결의 파급효를 조정하는 기법으로 이해된다. 학설 학설 내용 비고 ------ ------ ------ 個別的効力説 위헌판결의 효력은 당해 사건에 한정 . 법령은 형식적으로 존속하며 폐지는 국회의 몫 👉 통설·판례 . 부수적 심사제의 귀결 一般的効力説 위헌판결로 그 법령은 객관적으로 효력을 상실 일반적으로 무효 재판소가 소극적 입법을 하게 되어 41조 위반 이라는 비판 법률위임설 효력 범위는 헌법이 정하지 않았으므로 법률로 정할 사항 이라는 절충설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 尊属殺重罰規定違憲判決 헌법/尊属殺重罰規定違憲判決.md 最大判昭48.4.4 형법 200조 존속살 중벌 규정 의 14조 1항 적합성 위헌 . 그럼에도 형법 200조는 1995년 형법 개정까지 조문으로 존속 → 개별적 효력설의 실증 議員定数不均衡訴訟 헌법/議員定数不均衡訴訟.md 最大判昭51.4.14 / 民集30巻3号223頁 의원정수 배분 규정의 위헌성과 선거의 효력 정수 배분 규정은 위헌 이지만 선거 자체는 무효로 하지 않음 事情判決의 법리 💡 수험 팁 - 「위헌판결이 있으면 그 법률은 당연히·소급적으로 효력을 잃는다」는 지문은 오답. 개별적 효력설이 통설·판례다. - 강력한 암기 소재: 尊属殺 위헌판결 1973년 → 형법 200조 삭제 1995년 까지 22년간 조문이 남아 있었다. 이 사실 하나로 개별적 효력설을 설명할 수 있다. - 일반적 효력설에 대한 결정적 비판은 「재판소가 소극적 입법 을 하게 되어 41조 의 国会中心立法の原則 용어/国会中心立法の原則.md 에 반한다」는 것. 조문 번호까지 함께 외울 것. - 대비: 抽象的違憲審査制 용어/抽象的違憲審査制.md 독일형 에서는 일반적 효력 이 원칙. 제도 유형과 효력이 세트라는 점을 잡아 두면 헷갈리지 않는다. - 함정: 「최고재가 위헌으로 한 법률을 국회가 폐지하지 않으면 위헌판결의 의미가 없다」는 식의 극단 지문도 오답. 당해 사건에서는 그 법령이 적용되지 않는다 는 효과는 확실히 발생한다."},"衆議院の優越":{"type":"term","subject":"용어","id":"衆議院の優越","title":"衆議院の優越","sub":"しゅうぎいんのゆうえつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しゅうぎいんのゆうえつ（중의원의 우월）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 국회·양원제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>양원제에서 양원의 의사가 일치하지 않을 때 \u003cstrong>중의원의 의사를 우선\u003c/strong>시키는 제도. \u003cstrong>의결의 우월\u003c/strong>과 \u003cstrong>권한 자체의 우월\u003c/strong>로 나뉜다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>중의원은 임기가 짧고(4년) \u003cstrong>해산이 있어\u003c/strong> 민의를 보다 직접 반영한다는 점이 근거\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>중의원과 참의원은 원칙적으로 대등하지만, 양원의 의사가 갈리면 국정이 멈추므로 헌법은 일정 사항에서 중의원을 우월하게 취급한다. 근거는 중의원이 임기 4년(\u003cstrong>45조\u003c/strong>)에 \u003cstrong>해산 제도\u003c/strong>가 있어 그때그때의 민의를 더 직접 반영한다는 점이다(참의원은 임기 6년, 3년마다 반수 개선 — \u003cstrong>46조\u003c/strong>, 해산 없음).\u003c/p>\n\u003cp>\u003cstrong>우월은 두 종류\u003c/strong>다. ① \u003cstrong>의결의 우월\u003c/strong> — 법률안(\u003cstrong>59조\u003c/strong>), 예산(\u003cstrong>60조\u003c/strong>), 조약의 승인(\u003cstrong>61조\u003c/strong>), 내각총리대신의 지명(\u003cstrong>67조\u003c/strong>). ② \u003cstrong>권한 자체의 우월\u003c/strong> — 예산의 \u003cstrong>선의권\u003c/strong>(\u003cstrong>60조 1항\u003c/strong>)과 \u003cstrong>내각불신임결의권\u003c/strong>(\u003cstrong>69조\u003c/strong>). 이 둘은 중의원에만 있다.\u003c/p>\n\u003cp>\u003cstrong>법률안만이 「衆議院에서 출석의원 3분의 2 이상으로 재의결」을 요구\u003c/strong>하고, 나머지 셋(예산·조약·총리지명)은 \u003cstrong>재의결 없이 중의원의 의결이 그대로 국회의 의결이 된다\u003c/strong>. 또 \u003cstrong>양원협의회\u003c/strong>는 법률안에서는 \u003cstrong>임의\u003c/strong>이고, 나머지 셋에서는 \u003cstrong>필수\u003c/strong>다. 참의원이 의결하지 않을 때의 기간도 \u003cstrong>법률안 60일 / 예산·조약 30일 / 총리지명 10일\u003c/strong>로 각각 다르다.\u003c/p>\n\u003cp>한편 \u003cstrong>헌법개정의 발의(96조 1항)\u003c/strong>는 양원이 각각 \u003cstrong>총의원의 3분의 2 이상\u003c/strong>으로 찬성해야 하므로 \u003cstrong>중의원의 우월이 없다\u003c/strong>. 국정조사권(62조)·탄핵재판소 설치(64조)·의원 자격 쟁송(55조)·회기 등도 원칙적으로 대등하다. 반대로 \u003cstrong>참의원의 긴급집회\u003c/strong>(\u003cstrong>54조 2항·3항\u003c/strong>)는 참의원에만 있는 제도다.\u003c/p>\n\u003ch2>정리표 ①: 의결의 우월\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>사항\u003c/th>\u003cth>조문\u003c/th>\u003cth>참의원이 \u003cstrong>다른 의결\u003c/strong>을 한 경우\u003c/th>\u003cth>양원협의회\u003c/th>\u003cth>참의원이 \u003cstrong>의결하지 않을 때\u003c/strong>\u003c/th>\u003cth>성립 요건\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>법률안\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>59조\u003c/strong>\u003c/td>\u003ctd>중의원에서 \u003cstrong>출석의원의 3분의 2 이상\u003c/strong>으로 \u003cstrong>재의결\u003c/strong>하면 법률이 됨(2항)\u003c/td>\u003ctd>\u003cstrong>임의\u003c/strong>（중의원이 요구 가능. 3항）\u003c/td>\u003ctd>받은 후 \u003cstrong>국회 휴회 중의 기간을 제외하고 60일\u003c/strong> 이내에 의결하지 않으면, 중의원은 \u003cstrong>부결한 것으로 간주할 수 있다\u003c/strong>(4항)\u003c/td>\u003ctd>\u003cstrong>재의결 필요\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>예산\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>60조 2항\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>양원협의회를 열어도 의견이 일치하지 않을 때\u003c/strong> → 중의원의 의결이 국회의 의결\u003c/td>\u003ctd>\u003cstrong>필수\u003c/strong>\u003c/td>\u003ctd>받은 후 \u003cstrong>국회 휴회 중의 기간을 제외하고 30일\u003c/strong> 이내에 의결하지 않을 때 → 중의원의 의결이 국회의 의결\u003c/td>\u003ctd>\u003cstrong>재의결 불요\u003c/strong>（자동으로 국회의 의결）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>조약의 승인\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>61조\u003c/strong>（60조 2항 준용）\u003c/td>\u003ctd>예산과 동일\u003c/td>\u003ctd>\u003cstrong>필수\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>30일\u003c/strong>（국회 휴회 중의 기간 제외）\u003c/td>\u003ctd>\u003cstrong>재의결 불요\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>내각총리대신의 지명\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>67조 2항\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>양원협의회를 열어도 의견이 일치하지 않을 때\u003c/strong> → 중의원의 의결이 국회의 의결\u003c/td>\u003ctd>\u003cstrong>필수\u003c/strong>\u003c/td>\u003ctd>중의원이 지명 의결을 한 후 \u003cstrong>국회 휴회 중의 기간을 제외하고 10일\u003c/strong> 이내에 참의원이 지명 의결을 하지 않을 때\u003c/td>\u003ctd>\u003cstrong>재의결 불요\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>정리표 ②: 권한 자체의 우월\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>권한\u003c/th>\u003cth>조문\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>예산 선의권\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>60조 1항\u003c/strong>\u003c/td>\u003ctd>「予算は、さきに\u003cstrong>衆議院\u003c/strong>に提出しなければならない」— \u003cstrong>예산에만\u003c/strong> 있다. \u003cstrong>조약·법률안에는 선의권이 없다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>내각불신임결의권\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>69조\u003c/strong>\u003c/td>\u003ctd>중의원이 불신임 결의안을 가결하거나 신임 결의안을 부결하면, 내각은 \u003cstrong>10일 이내에 중의원을 해산\u003c/strong>하지 않는 한 \u003cstrong>총사직\u003c/strong>해야 함. 참의원의 「問責決議」는 \u003cstrong>법적 구속력 없음\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>숫자 3종 세트를 절대 헷갈리지 마라: 법률안 60일 / 예산·조약 30일 / 총리지명 10일.\u003c/strong> 그리고 69조의 「해산 또는 총사직까지 \u003cstrong>10일\u003c/strong>」도 별개의 10일이니 주의.\u003c/li>\u003cli>\u003cstrong>재의결이 필요한 것은 법률안뿐이며, 정족수는 「출석의원의 3분의 2 이상」\u003c/strong>(총의원이 아니다!). 「총의원의 3분의 2」는 \u003cstrong>헌법개정 발의(96조)\u003c/strong>의 정족수이므로 바꿔치기 함정이 자주 나온다.\u003c/li>\u003cli>\u003cstrong>양원협의회: 법률안만 임의, 예산·조약·총리지명은 필수.\u003c/strong> 「법률안에서 양원협의회는 반드시 열어야 한다」는 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>선의권은 예산에만.\u003c/strong> 「조약의 승인은 먼저 중의원에 제출해야 한다」는 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>「30일」·「10일」에는 \u003cstrong>「국회 휴회 중의 기간을 제외하고」\u003c/strong>라는 단서가 붙는다. 법률안의 60일도 마찬가지다.\u003c/li>\u003cli>법률안만 「\u003cstrong>否決したものとみなすことができる\u003c/strong>」(간주할 수 \u003cstrong>있다\u003c/strong>)는 형태다. 즉 자동으로 법률이 되는 게 아니라 그 후 재의결 절차가 필요하다. 반면 예산·조약·총리지명은 기간 도과로 \u003cstrong>자동으로 국회의 의결\u003c/strong>이 된다.\u003c/li>\u003cli>\u003cstrong>우월이 없는 것\u003c/strong>: \u003cstrong>헌법개정의 발의(96조)\u003c/strong>, 탄핵재판소 설치(64조), 국정조사권(62조) 등. \u003cstrong>참의원에만 있는 것\u003c/strong>: 긴급집회(54조 2항).\u003c/li>\u003c/ul>","search":"衆議院の優越 しゅうぎいんのゆうえつ 항목 내용 ------ ------ 읽기 しゅうぎいんのゆうえつ（중의원의 우월） 과목 헌법（통치기구 — 국회·양원제） 한줄 정의 양원제에서 양원의 의사가 일치하지 않을 때 중의원의 의사를 우선 시키는 제도. 의결의 우월 과 권한 자체의 우월 로 나뉜다 통설·판례 중의원은 임기가 짧고 4년 해산이 있어 민의를 보다 직접 반영한다는 점이 근거 개념 중의원과 참의원은 원칙적으로 대등하지만, 양원의 의사가 갈리면 국정이 멈추므로 헌법은 일정 사항에서 중의원을 우월하게 취급한다. 근거는 중의원이 임기 4년 45조 에 해산 제도 가 있어 그때그때의 민의를 더 직접 반영한다는 점이다 참의원은 임기 6년, 3년마다 반수 개선 — 46조 , 해산 없음 . 우월은 두 종류 다. ① 의결의 우월 — 법률안 59조 , 예산 60조 , 조약의 승인 61조 , 내각총리대신의 지명 67조 . ② 권한 자체의 우월 — 예산의 선의권 60조 1항 과 내각불신임결의권 69조 . 이 둘은 중의원에만 있다. 법률안만이 「衆議院에서 출석의원 3분의 2 이상으로 재의결」을 요구 하고, 나머지 셋 예산·조약·총리지명 은 재의결 없이 중의원의 의결이 그대로 국회의 의결이 된다 . 또 양원협의회 는 법률안에서는 임의 이고, 나머지 셋에서는 필수 다. 참의원이 의결하지 않을 때의 기간도 법률안 60일 / 예산·조약 30일 / 총리지명 10일 로 각각 다르다. 한편 헌법개정의 발의 96조 1항 는 양원이 각각 총의원의 3분의 2 이상 으로 찬성해야 하므로 중의원의 우월이 없다 . 국정조사권 62조 ·탄핵재판소 설치 64조 ·의원 자격 쟁송 55조 ·회기 등도 원칙적으로 대등하다. 반대로 참의원의 긴급집회 54조 2항·3항 는 참의원에만 있는 제도다. 정리표 ①: 의결의 우월 사항 조문 참의원이 다른 의결 을 한 경우 양원협의회 참의원이 의결하지 않을 때 성립 요건 ------ ------ -------------------------------- ----------- ------------------------------ ----------- 법률안 59조 중의원에서 출석의원의 3분의 2 이상 으로 재의결 하면 법률이 됨 2항 임의 （중의원이 요구 가능. 3항） 받은 후 국회 휴회 중의 기간을 제외하고 60일 이내에 의결하지 않으면, 중의원은 부결한 것으로 간주할 수 있다 4항 재의결 필요 예산 60조 2항 양원협의회를 열어도 의견이 일치하지 않을 때 → 중의원의 의결이 국회의 의결 필수 받은 후 국회 휴회 중의 기간을 제외하고 30일 이내에 의결하지 않을 때 → 중의원의 의결이 국회의 의결 재의결 불요 （자동으로 국회의 의결） 조약의 승인 61조 （60조 2항 준용） 예산과 동일 필수 30일 （국회 휴회 중의 기간 제외） 재의결 불요 내각총리대신의 지명 67조 2항 양원협의회를 열어도 의견이 일치하지 않을 때 → 중의원의 의결이 국회의 의결 필수 중의원이 지명 의결을 한 후 국회 휴회 중의 기간을 제외하고 10일 이내에 참의원이 지명 의결을 하지 않을 때 재의결 불요 정리표 ②: 권한 자체의 우월 권한 조문 내용 ------ ------ ------ 예산 선의권 60조 1항 「予算は、さきに 衆議院 に提出しなければならない」— 예산에만 있다. 조약·법률안에는 선의권이 없다 내각불신임결의권 69조 중의원이 불신임 결의안을 가결하거나 신임 결의안을 부결하면, 내각은 10일 이내에 중의원을 해산 하지 않는 한 총사직 해야 함. 참의원의 「問責決議」는 법적 구속력 없음 💡 수험 팁 - 숫자 3종 세트를 절대 헷갈리지 마라: 법률안 60일 / 예산·조약 30일 / 총리지명 10일. 그리고 69조의 「해산 또는 총사직까지 10일 」도 별개의 10일이니 주의. - 재의결이 필요한 것은 법률안뿐이며, 정족수는 「출석의원의 3분의 2 이상」 총의원이 아니다! . 「총의원의 3분의 2」는 헌법개정 발의 96조 의 정족수이므로 바꿔치기 함정이 자주 나온다. - 양원협의회: 법률안만 임의, 예산·조약·총리지명은 필수. 「법률안에서 양원협의회는 반드시 열어야 한다」는 오답 . - 선의권은 예산에만. 「조약의 승인은 먼저 중의원에 제출해야 한다」는 오답 . - 「30일」·「10일」에는 「국회 휴회 중의 기간을 제외하고」 라는 단서가 붙는다. 법률안의 60일도 마찬가지다. - 법률안만 「 否決したものとみなすことができる 」 간주할 수 있다 는 형태다. 즉 자동으로 법률이 되는 게 아니라 그 후 재의결 절차가 필요하다. 반면 예산·조약·총리지명은 기간 도과로 자동으로 국회의 의결 이 된다. - 우월이 없는 것 : 헌법개정의 발의 96조 , 탄핵재판소 설치 64조 , 국정조사권 62조 등. 참의원에만 있는 것 : 긴급집회 54조 2항 ."},"法律上の争訟":{"type":"term","subject":"용어","id":"法律上の争訟","title":"法律上の争訟","sub":"ほうりつじょうのそうしょう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ほうりつじょうのそうしょう（법률상의 쟁송）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 사법권의 범위·한계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>재판소가 심판할 수 있는 사건의 범위. \u003cstrong>재판소법 3조 1항\u003c/strong>의 개념으로, 아래 \u003cstrong>2요건\u003c/strong>을 모두 갖춘 분쟁을 말한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>① \u003cstrong>당사자 간의 구체적인 권리의무 내지 법률관계의 존부에 관한 분쟁\u003c/strong>이고, ② \u003cstrong>법령의 적용에 의해 종국적으로 해결할 수 있는 것\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 76조 1항은 「すべて司法権は、最高裁判所及び…下級裁判所に属する」라고 하고, 이를 받은 \u003cstrong>재판소법 3조 1항\u003c/strong>은 「裁判所は、日本国憲法に特別の定のある場合を除いて一切の\u003cstrong>法律上の争訟\u003c/strong>を裁判し…」라고 규정한다. 즉 재판소가 사법권을 행사할 수 있는 대상이 「法律上の争訟」이다. 이것이 없으면 소는 \u003cstrong>각하\u003c/strong>된다.\u003c/p>\n\u003cp>판례가 확립한 요건은 \u003cstrong>두 개\u003c/strong>다.\u003cbr>\u003cstrong>① 당사자 간의 구체적인 권리의무 내지 법률관계의 존부에 관한 분쟁일 것\u003c/strong>(사건성·구체성). 구체적 사건을 떠나 법령의 합헌성만을 다투는 소송은 여기서 걸린다 → 警察予備隊違憲訴訟.\u003cbr>\u003cstrong>② 법령의 적용에 의해 종국적으로 해결할 수 있는 것일 것\u003c/strong>(종국해결가능성). 종교 교의의 진위, 학문·기술상의 우열 등 법으로 판정할 수 없는 사항이 \u003cstrong>분쟁 해결에 불가결한 전제\u003c/strong>가 되는 경우 여기서 걸린다 → 板まんだら事件, 技術士国家試験事件.\u003c/p>\n\u003cp>법률상의 쟁송에 해당하더라도 다시 \u003cstrong>사법권의 한계\u003c/strong>로 심사가 배제되는 경우가 있다. \u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>, \u003ca href=\"#/e/%E9%83%A8%E5%88%86%E7%A4%BE%E4%BC%9A%E3%81%AE%E6%B3%95%E7%90%86\">部分社会の法理\u003c/a>, 자유재량행위, 국회·의원 각각의 자율권 등이 그것이다. \u003cstrong>「법률상의 쟁송인가」(사법권의 범위)와 「그럼에도 심사가 배제되는가」(사법권의 한계)는 층이 다른 논점\u003c/strong>이므로 혼동하지 말 것.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>警察予備隊違憲訴訟\u003c/td>\u003ctd>最大判昭27.10.8 / 民集6巻9号783頁\u003c/td>\u003ctd>구체적 사건 없이 최고재에 직접 경찰예비대의 위헌무효 확인 청구\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. \u003cstrong>요건① 결여\u003c/strong>. 사법권 발동에는 구체적 쟁송사건의 제기가 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>板まんだら事件（이타만다라 사건）\u003c/td>\u003ctd>最三小判昭56.4.7 / 民集35巻3号443頁\u003c/td>\u003ctd>창가학회 회원이 본존(板まんだら) 안치를 위한 기부금이 \u003cstrong>본존이 가짜여서 요소의 착오로 무효\u003c/strong>라며 반환 청구\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 형식은 기부금 반환이라는 재산상 청구여서 요건①은 충족하나, 해결에 \u003cstrong>신앙의 대상의 가치·종교상의 교의에 관한 판단이 불가결\u003c/strong>하므로 \u003cstrong>요건② 결여\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>技術士国家試験事件\u003c/td>\u003ctd>最三小判昭41.2.8 / 民集20巻2号196頁\u003c/td>\u003ctd>국가시험 불합격 판정의 취소 청구\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 합격·불합격 판정은 \u003cstrong>학문 또는 기술상의 지식·능력·의견의 우열·당부의 판단\u003c/strong>이므로 법령 적용에 의한 종국적 해결 불가(\u003cstrong>요건② 결여\u003c/strong>)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>2요건을 「구체적 권리의무의 분쟁」+「법령 적용에 의한 종국적 해결 가능성」으로 토씨까지 외워라.\u003c/strong> 어느 요건이 결여되었는지를 묻는 것이 정석 출제다.\u003c/li>\u003cli>판례별 결여 요건 짝짓기: \u003cstrong>警察予備隊 = ①결여 / 板まんだら·技術士国家試験 = ②결여\u003c/strong>.\u003c/li>\u003cli>板まんだら事件의 함정: 「청구 자체가 재산상의 것이면 언제나 법률상의 쟁송이다」는 오답. \u003cstrong>판단의 전제로 교의 판단이 불가결한지\u003c/strong>가 기준이다.\u003c/li>\u003cli>대비: \u003ca href=\"#/e/%E9%83%A8%E5%88%86%E7%A4%BE%E4%BC%9A%E3%81%AE%E6%B3%95%E7%90%86\">部分社会の法理\u003c/a>·\u003ca href=\"#/e/%E7%B5%B1%E6%B2%BB%E8%A1%8C%E7%82%BA%E8%AB%96\">統治行為論\u003c/a>은 「법률상의 쟁송에 \u003cstrong>해당하지만\u003c/strong>」 사법심사가 미치지 않는 유형(사법권의 \u003cstrong>한계\u003c/strong>). 板まんだら는 애초에 법률상의 쟁송이 \u003cstrong>아닌\u003c/strong> 유형(사법권의 \u003cstrong>범위\u003c/strong>).\u003c/li>\u003cli>관련: \u003ca href=\"#/e/%E4%BB%98%E9%9A%8F%E7%9A%84%E9%81%95%E6%86%B2%E5%AF%A9%E6%9F%BB%E5%88%B6\">付随的違憲審査制\u003c/a>와 세트로 나온다.\u003c/li>\u003c/ul>","search":"法律上の争訟 ほうりつじょうのそうしょう 항목 내용 ------ ------ 읽기 ほうりつじょうのそうしょう（법률상의 쟁송） 과목 헌법（통치기구 — 사법권의 범위·한계） 한줄 정의 재판소가 심판할 수 있는 사건의 범위. 재판소법 3조 1항 의 개념으로, 아래 2요건 을 모두 갖춘 분쟁을 말한다 통설·판례 ① 당사자 간의 구체적인 권리의무 내지 법률관계의 존부에 관한 분쟁 이고, ② 법령의 적용에 의해 종국적으로 해결할 수 있는 것 개념 헌법 76조 1항은 「すべて司法権は、最高裁判所及び…下級裁判所に属する」라고 하고, 이를 받은 재판소법 3조 1항 은 「裁判所は、日本国憲法に特別の定のある場合を除いて一切の 法律上の争訟 を裁判し…」라고 규정한다. 즉 재판소가 사법권을 행사할 수 있는 대상이 「法律上の争訟」이다. 이것이 없으면 소는 각하 된다. 판례가 확립한 요건은 두 개 다. ① 당사자 간의 구체적인 권리의무 내지 법률관계의 존부에 관한 분쟁일 것 사건성·구체성 . 구체적 사건을 떠나 법령의 합헌성만을 다투는 소송은 여기서 걸린다 → 警察予備隊違憲訴訟. ② 법령의 적용에 의해 종국적으로 해결할 수 있는 것일 것 종국해결가능성 . 종교 교의의 진위, 학문·기술상의 우열 등 법으로 판정할 수 없는 사항이 분쟁 해결에 불가결한 전제 가 되는 경우 여기서 걸린다 → 板まんだら事件, 技術士国家試験事件. 법률상의 쟁송에 해당하더라도 다시 사법권의 한계 로 심사가 배제되는 경우가 있다. 統治行為論 용어/統治行為論.md , 部分社会の法理 용어/部分社会の法理.md , 자유재량행위, 국회·의원 각각의 자율권 등이 그것이다. 「법률상의 쟁송인가」 사법권의 범위 와 「그럼에도 심사가 배제되는가」 사법권의 한계 는 층이 다른 논점 이므로 혼동하지 말 것. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 警察予備隊違憲訴訟 最大判昭27.10.8 / 民集6巻9号783頁 구체적 사건 없이 최고재에 직접 경찰예비대의 위헌무효 확인 청구 각하 . 요건① 결여 . 사법권 발동에는 구체적 쟁송사건의 제기가 필요 板まんだら事件（이타만다라 사건） 最三小判昭56.4.7 / 民集35巻3号443頁 창가학회 회원이 본존 板まんだら 안치를 위한 기부금이 본존이 가짜여서 요소의 착오로 무효 라며 반환 청구 각하 . 형식은 기부금 반환이라는 재산상 청구여서 요건①은 충족하나, 해결에 신앙의 대상의 가치·종교상의 교의에 관한 판단이 불가결 하므로 요건② 결여 技術士国家試験事件 最三小判昭41.2.8 / 民集20巻2号196頁 국가시험 불합격 판정의 취소 청구 각하 . 합격·불합격 판정은 학문 또는 기술상의 지식·능력·의견의 우열·당부의 판단 이므로 법령 적용에 의한 종국적 해결 불가 요건② 결여 💡 수험 팁 - 2요건을 「구체적 권리의무의 분쟁」+「법령 적용에 의한 종국적 해결 가능성」으로 토씨까지 외워라. 어느 요건이 결여되었는지를 묻는 것이 정석 출제다. - 판례별 결여 요건 짝짓기: 警察予備隊 = ①결여 / 板まんだら·技術士国家試験 = ②결여 . - 板まんだら事件의 함정: 「청구 자체가 재산상의 것이면 언제나 법률상의 쟁송이다」는 오답. 판단의 전제로 교의 판단이 불가결한지 가 기준이다. - 대비: 部分社会の法理 용어/部分社会の法理.md · 統治行為論 용어/統治行為論.md 은 「법률상의 쟁송에 해당하지만 」 사법심사가 미치지 않는 유형 사법권의 한계 . 板まんだら는 애초에 법률상의 쟁송이 아닌 유형 사법권의 범위 . - 관련: 付随的違憲審査制 용어/付随的違憲審査制.md 와 세트로 나온다."},"租税法律主義":{"type":"term","subject":"용어","id":"租税法律主義","title":"租税法律主義","sub":"そぜいほうりつしゅぎ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>そぜいほうりつしゅぎ（조세법률주의）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（통치기구 — 재정）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>새로 조세를 부과하거나 현행 조세를 변경하려면 \u003cstrong>법률 또는 법률이 정하는 조건\u003c/strong>에 의하여야 한다는 원칙(\u003cstrong>84조\u003c/strong>)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>내용은 \u003cstrong>課税要件法定主義\u003c/strong>와 \u003cstrong>課税要件明確主義\u003c/strong>. 조세 이외의 공과금에도 \u003cstrong>84조의 취지\u003c/strong>가 미칠 수 있다(旭川市国民健康保険条例事件)\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>84조\u003c/strong>는 「あらたに租税を課し、又は現行の租税を変更するには、\u003cstrong>法律又は法律の定める条件\u003c/strong>によることを必要とする」라고 규정한다. \u003cstrong>30조\u003c/strong>의 납세의무도 「\u003cstrong>法律の定めるところにより\u003c/strong>」라고 하여 같은 취지를 담고 있다. 국민의 재산권에 대한 직접적 침해인 과세는 국민 대표기관인 국회가 정한 법률에 근거해야 한다는, \u003cspan>財政民主主義\u003c/span>의 조세 영역 표현이다.\u003c/p>\n\u003cp>내용은 두 갈래다. ① \u003cstrong>課税要件法定主義\u003c/strong> — 납세의무자, 과세물건, 과세표준, 세율 등 \u003cstrong>과세요건\u003c/strong>과 조세의 부과·징수 절차는 \u003cstrong>법률로\u003c/strong> 정해야 한다. ② \u003cstrong>課税要件明確主義\u003c/strong> — 그 규정은 일의적이고 \u003cstrong>명확\u003c/strong>해야 한다. 다만 조세의 기술적 성격상 세부사항을 정령 등에 위임하는 것 자체는 허용되며(84조의 「法律の定める条件」), 문제는 위임이 \u003cstrong>개별적·구체적\u003c/strong>인가이다.\u003c/p>\n\u003cp>\u003cstrong>조례에 의한 지방세\u003c/strong>도 84조에 반하지 않는다. 조례는 주민의 대표기관인 의회가 정하는 자주입법이고, 지방세법이 그 틀을 정하고 있기 때문이다(\u003cstrong>地方税法 3조\u003c/strong> — 지방세의 세목·과세객체·세율 등은 조례로 정해야 한다). 이를 \u003cstrong>地方税条例主義\u003c/strong>라 부른다.\u003c/p>\n\u003cp>조세가 아닌 \u003cstrong>공과금\u003c/strong>은 어떤가. \u003cstrong>旭川市国民健康保険条例事件\u003c/strong>(最大判平18.3.1)은, 84조의 「조세」란 「국가·지방공공단체가 \u003cstrong>특별한 급부에 대한 반대급부로서가 아니라\u003c/strong>, 경비 충당을 위한 자금 조달의 목적으로 \u003cstrong>과세권에 근거하여\u003c/strong> 부과하는 금전급부」라고 정의하고, 시정촌 국민건강보험료는 \u003cstrong>보험급부의 반대급부\u003c/strong>이므로 84조가 \u003cstrong>직접 적용되지는 않는다\u003c/strong>고 했다. 다만 조세 외의 공과금이라도 \u003cstrong>부과·징수의 강제 정도 등에서 조세에 유사한 것\u003c/strong>에는 \u003cstrong>84조의 취지가 미친다\u003c/strong>고 하면서, 결론적으로 해당 조례는 위헌이 아니라고 판단했다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>サラリーマン税金訴訟\u003c/span>（大嶋訴訟）\u003c/td>\u003ctd>最大判昭60.3.27 / 民集39巻2号247頁\u003c/td>\u003ctd>급여소득자에 대한 과세가 사업소득자에 비해 불리하여 14조 1항 위반인지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 조세법의 정립은 국가 재정·사회경제 등에 관한 \u003cstrong>입법부의 정책적·기술적 판단\u003c/strong>에 맡겨지므로, \u003cstrong>입법목적이 정당하고 구별이 현저히 불합리함이 명백하지 않은 한\u003c/strong> 14조 1항 위반이 아니다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>旭川市国民健康保険条例事件\u003c/td>\u003ctd>\u003cstrong>最大判平18.3.1\u003c/strong> / 民集60巻2号587頁\u003c/td>\u003ctd>국민건강보험료의 요율 결정을 시장의 고시에 위임한 조례가 84조 위반인지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 보험료는 \u003cstrong>반대급부성\u003c/strong>이 있어 조세가 아니므로 84조 \u003cstrong>직접 적용 부정\u003c/strong>. 다만 \u003cstrong>84조의 취지는 미친다\u003c/strong>고 하면서 위임은 위헌이 아니라고 판단\u003c/td>\u003c/tr>\u003ctr>\u003ctd>パチンコ球遊器事件\u003c/td>\u003ctd>最二小判昭33.3.28 / 民集12巻4号624頁\u003c/td>\u003ctd>오랫동안 과세하지 않던 파친코 구유기에 \u003cstrong>통달을 계기로\u003c/strong> 물품세를 부과\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>. 구유기는 원래 물품세법의 「遊戯具」에 해당하며 통달은 \u003cstrong>법의 올바른 해석을 확인\u003c/strong>한 것에 불과하므로, 과세는 \u003cstrong>법률에 근거한 과세\u003c/strong>이고 84조 위반이 아니다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>84조의 문언 「法律又は法律の定める条件によることを必要とする」를 그대로 외워라.\u003c/strong> 「법률에 의하여야 한다」만 있는 것이 아니라 \u003cstrong>「법률이 정하는 조건」\u003c/strong>도 있다는 점이 위임 허용의 근거다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「국민건강보험료에는 84조가 \u003cstrong>직접 적용\u003c/strong>된다」는 \u003cstrong>오답\u003c/strong>. 판례는 \u003cstrong>직접 적용 부정 + 취지는 미침\u003c/strong>이라는 2단 구성이다. 반대로 \u003cstrong>국민건강보험세(세 형식)\u003c/strong>라면 조세이므로 84조가 직접 적용된다.\u003c/li>\u003cli>パチンコ球遊器事件의 함정: 「통달에 의한 과세이므로 위헌이다」는 \u003cstrong>오답\u003c/strong>. 판례는 \u003cstrong>통달이 법의 올바른 해석에 합치하는 한\u003c/strong> 법률에 근거한 과세라고 했다. 다만 \u003cstrong>통달 자체가 과세근거가 되는 것은 아니다\u003c/strong>.\u003c/li>\u003cli>세트 암기: \u003cstrong>課税要件法定主義 + 課税要件明確主義\u003c/strong>.\u003c/li>\u003cli>조례에 의한 지방세 부과는 \u003cstrong>합헌\u003c/strong>(84조의 「법률」에 조례가 포함되는 것으로 해석 / 지방세법 3조). 「조세는 반드시 국회가 정한 법률로만 부과할 수 있다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>관련: \u003cspan>財政民主主義\u003c/span>(83조)의 한 내용이 84조다. 83조·84조·85조·86조를 조문 번호와 함께 묶어 외울 것.\u003c/li>\u003c/ul>","search":"租税法律主義 そぜいほうりつしゅぎ 항목 내용 ------ ------ 읽기 そぜいほうりつしゅぎ（조세법률주의） 과목 헌법（통치기구 — 재정） 한줄 정의 새로 조세를 부과하거나 현행 조세를 변경하려면 법률 또는 법률이 정하는 조건 에 의하여야 한다는 원칙 84조 통설·판례 내용은 課税要件法定主義 와 課税要件明確主義 . 조세 이외의 공과금에도 84조의 취지 가 미칠 수 있다 旭川市国民健康保険条例事件 개념 84조 는 「あらたに租税を課し、又は現行の租税を変更するには、 法律又は法律の定める条件 によることを必要とする」라고 규정한다. 30조 의 납세의무도 「 法律の定めるところにより 」라고 하여 같은 취지를 담고 있다. 국민의 재산권에 대한 직접적 침해인 과세는 국민 대표기관인 국회가 정한 법률에 근거해야 한다는, 財政民主主義 용어/財政民主主義.md 의 조세 영역 표현이다. 내용은 두 갈래다. ① 課税要件法定主義 — 납세의무자, 과세물건, 과세표준, 세율 등 과세요건 과 조세의 부과·징수 절차는 법률로 정해야 한다. ② 課税要件明確主義 — 그 규정은 일의적이고 명확 해야 한다. 다만 조세의 기술적 성격상 세부사항을 정령 등에 위임하는 것 자체는 허용되며 84조의 「法律の定める条件」 , 문제는 위임이 개별적·구체적 인가이다. 조례에 의한 지방세 도 84조에 반하지 않는다. 조례는 주민의 대표기관인 의회가 정하는 자주입법이고, 지방세법이 그 틀을 정하고 있기 때문이다 地方税法 3조 — 지방세의 세목·과세객체·세율 등은 조례로 정해야 한다 . 이를 地方税条例主義 라 부른다. 조세가 아닌 공과금 은 어떤가. 旭川市国民健康保険条例事件 最大判平18.3.1 은, 84조의 「조세」란 「국가·지방공공단체가 특별한 급부에 대한 반대급부로서가 아니라 , 경비 충당을 위한 자금 조달의 목적으로 과세권에 근거하여 부과하는 금전급부」라고 정의하고, 시정촌 국민건강보험료는 보험급부의 반대급부 이므로 84조가 직접 적용되지는 않는다 고 했다. 다만 조세 외의 공과금이라도 부과·징수의 강제 정도 등에서 조세에 유사한 것 에는 84조의 취지가 미친다 고 하면서, 결론적으로 해당 조례는 위헌이 아니라고 판단했다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ サラリーマン税金訴訟 헌법/サラリーマン税金訴訟.md （大嶋訴訟） 最大判昭60.3.27 / 民集39巻2号247頁 급여소득자에 대한 과세가 사업소득자에 비해 불리하여 14조 1항 위반인지 합헌 . 조세법의 정립은 국가 재정·사회경제 등에 관한 입법부의 정책적·기술적 판단 에 맡겨지므로, 입법목적이 정당하고 구별이 현저히 불합리함이 명백하지 않은 한 14조 1항 위반이 아니다 旭川市国民健康保険条例事件 最大判平18.3.1 / 民集60巻2号587頁 국민건강보험료의 요율 결정을 시장의 고시에 위임한 조례가 84조 위반인지 합헌 . 보험료는 반대급부성 이 있어 조세가 아니므로 84조 직접 적용 부정 . 다만 84조의 취지는 미친다 고 하면서 위임은 위헌이 아니라고 판단 パチンコ球遊器事件 最二小判昭33.3.28 / 民集12巻4号624頁 오랫동안 과세하지 않던 파친코 구유기에 통달을 계기로 물품세를 부과 적법 . 구유기는 원래 물품세법의 「遊戯具」에 해당하며 통달은 법의 올바른 해석을 확인 한 것에 불과하므로, 과세는 법률에 근거한 과세 이고 84조 위반이 아니다 💡 수험 팁 - 84조의 문언 「法律又は法律の定める条件によることを必要とする」를 그대로 외워라. 「법률에 의하여야 한다」만 있는 것이 아니라 「법률이 정하는 조건」 도 있다는 점이 위임 허용의 근거다. - 최대 함정 : 「국민건강보험료에는 84조가 직접 적용 된다」는 오답 . 판례는 직접 적용 부정 + 취지는 미침 이라는 2단 구성이다. 반대로 국민건강보험세 세 형식 라면 조세이므로 84조가 직접 적용된다. - パチンコ球遊器事件의 함정: 「통달에 의한 과세이므로 위헌이다」는 오답 . 판례는 통달이 법의 올바른 해석에 합치하는 한 법률에 근거한 과세라고 했다. 다만 통달 자체가 과세근거가 되는 것은 아니다 . - 세트 암기: 課税要件法定主義 + 課税要件明確主義 . - 조례에 의한 지방세 부과는 합헌 84조의 「법률」에 조례가 포함되는 것으로 해석 / 지방세법 3조 . 「조세는 반드시 국회가 정한 법률로만 부과할 수 있다」는 지문은 오답 . - 관련: 財政民主主義 용어/財政民主主義.md 83조 의 한 내용이 84조다. 83조·84조·85조·86조를 조문 번호와 함께 묶어 외울 것."},"法律による行政の原理":{"type":"term","subject":"용어","id":"法律による行政の原理","title":"法律による行政の原理","sub":"ほうりつによるぎょうせいのげんり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003c
