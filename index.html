td>읽기\u003c/td>\u003ctd>ほうりつによるぎょうせいのげんり（법률에 의한 행정의 원리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — 행정법의 기본원리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정활동은 국민의 대표기관인 국회가 제정한 \u003cstrong>법률에 근거\u003c/strong>하고 또 \u003cstrong>법률에 따라\u003c/strong> 이루어져야 한다는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>법규창조력·법률의 우위·법률의 유보\u003c/strong> 3내용으로 구성. 법률의 유보 범위에 관해서는 \u003cstrong>侵害留保説\u003c/strong>이 판례·실무의 입장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>법치주의(法治主義)를 행정 영역에 적용한 것이 「법률에 의한 행정의 원리」이며, 행정법 전체를 관통하는 \u003cstrong>최상위 기본원리\u003c/strong>다. 독일의 오토 마이어（Otto Mayer, オットー・マイヤー）가 정식화한 것으로, 행정권의 자의(恣意)를 봉쇄하여 ① 국민 대표에 의한 행정 통제를 실현하고（民主主義的 요청） ② 국민의 예측가능성과 권리·자유를 보장하려는（自由主義的 요청） 두 가지 목적을 갖는다.\u003c/p>\n\u003cp>일본 헌법상의 실정법적 근거는 \u003cstrong>헌법 41조\u003c/strong>（국회는 국권의 최고기관이며 국가의 \u003cstrong>유일한 입법기관\u003c/strong>）, \u003cstrong>헌법 65조\u003c/strong>（행정권은 내각에 속한다）, \u003cstrong>헌법 73조 1호\u003c/strong>（내각은 법률을 성실히 집행한다）에 있다. 즉 「만드는 것은 국회, 집행하는 것은 내각」이라는 권력분립 구조 자체가 이 원리의 골격이다.\u003c/p>\n\u003cp>이 원리는 다음 \u003cstrong>3가지 내용\u003c/strong>으로 분해되어 출제된다. 순서와 내용을 짝지어 외우는 것이 시험 대비의 출발점이다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>내용\u003c/th>\u003cth>의미\u003c/th>\u003cth>적용 범위\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>法律の法規創造力\u003c/strong>\u003c/td>\u003ctd>국민의 권리·의무에 관한 법규(法規)를 창조할 수 있는 것은 \u003cstrong>법률뿐\u003c/strong>\u003c/td>\u003ctd>헌법이 인정하는 예외(의원규칙·최고재판소규칙·조례 등) 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>法律の優位\u003c/strong>\u003c/td>\u003ctd>법률이 있으면 행정작용은 그에 \u003cstrong>위반해서는 안 됨\u003c/strong>（소극적·저지적 측면）\u003c/td>\u003ctd>\u003cstrong>모든 행정활동에 예외 없이 타당. 다툼 없음\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>法律の留保\u003c/strong>\u003c/td>\u003ctd>일정한 행정작용에는 \u003cstrong>사전에 법률의 근거\u003c/strong>가 필요（적극적 측면）\u003c/td>\u003ctd>\u003cstrong>어디까지 필요한지 학설 대립의 핵심\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>주의할 점은 이 원리가 「행정은 법률에 근거해야 한다」와 「행정은 법률에 위반해서는 안 된다」라는 \u003cstrong>서로 다른 두 명제\u003c/strong>를 함께 담고 있다는 것이다. 앞의 것이 \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>, 뒤의 것이 \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E5%84%AA%E4%BD%8D\">法律の優位\u003c/a>이며, 이 둘을 뒤바꾼 지문이 전형적인 함정이다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>浦安町漁港鉄杭撤去事件（우라야스초 어항 철말뚝 철거 사건）\u003c/td>\u003ctd>最二小判平3.3.8 / 民集45巻3号164頁\u003c/td>\u003ctd>요트 계류용 철말뚝이 불법 설치되어 어선 항행에 위험이 발생하자, 어항관리규정(漁港法 당시 26조)을 아직 제정하지 않은 초장(町長)이 법적 근거 없이 독단으로 철거를 강행하고 町費를 지출\u003c/td>\u003ctd>어항법·\u003cstrong>행정대집행법상의 근거가 없어 철거 강행 자체는 적법하다 할 수 없다\u003c/strong>（＝법률에 의한 행정의 원리 위반）. 다만 긴급한 사태에 대처한 부득이한 조치이므로 \u003cstrong>민법 720조(긴급피난)의 취지에 비추어 비용 지출은 적법\u003c/strong>하여 초장의 손해배상책임은 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>パチンコ球遊器事件（파친코 구유기 사건）\u003c/td>\u003ctd>最二小判昭33.3.28 / 民集12巻4号624頁\u003c/td>\u003ctd>오랫동안 과세하지 않던 파친코 기계에 대해 \u003cstrong>통달(通達)을 계기로\u003c/strong> 물품세를 부과\u003c/td>\u003ctd>과세가 통달을 계기로 이루어졌더라도 \u003cstrong>통달의 내용이 법의 올바른 해석에 합치하는 이상\u003c/strong> 그 과세처분은 법의 근거에 기한 처분이므로 위헌이 아님\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>3내용의 이름과 개수는 그대로 출제된다. \u003cstrong>「법규창조력 → 우위 → 유보」\u003c/strong> 순서로 암기. 「법률의 지배」「법률의 위임」 같은 유사 명칭을 섞어 넣은 선택지는 오답.\u003c/li>\u003cli>\u003cstrong>대비: 法律の優位 ↔ 法律の留保.\u003c/strong> 우위는 「법률이 \u003cstrong>있을 때\u003c/strong> 어기지 마라」(모든 행정활동에 예외 없음), 유보는 「법률이 \u003cstrong>없을 때\u003c/strong> 행동할 수 있느냐」(범위에 학설 대립). \u003cstrong>「법률의 우위에 대해서는 侵害留保説·全部留保説의 대립이 있다」는 지문은 오답\u003c/strong> — 대립은 유보 쪽 이야기다.\u003c/li>\u003cli>\u003cstrong>대비: 法治主義(일본·독일) ↔ 法の支配(영미).\u003c/strong> 법치주의는 형식적으로 법률의 형식만 갖추면 되므로 나치 시대처럼 악법에 의한 지배를 허용해 버린 반성에서, 전후에는 법률 내용의 정당성까지 요구하는 \u003cstrong>「実質的法治主義」\u003c/strong>로 전환되었다.\u003c/li>\u003cli>浦安 사건은 \u003cstrong>「위법하지만 지출은 적법」\u003c/strong>이라는 \u003cstrong>결론의 이중성\u003c/strong>이 함정이다. 「최고재는 초장의 철거를 적법하다고 판시했다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>오토 마이어(독일)의 이름을 켈젠·몽테스키외 등으로 바꿔 놓는 지문에 주의.\u003c/li>\u003c/ul>","search":"法律による行政の原理 ほうりつによるぎょうせいのげんり 항목 내용 ------ ------ 읽기 ほうりつによるぎょうせいのげんり（법률에 의한 행정의 원리） 과목 행정법（행정법 총론 — 행정법의 기본원리） 한줄 정의 행정활동은 국민의 대표기관인 국회가 제정한 법률에 근거 하고 또 법률에 따라 이루어져야 한다는 원칙 통설·판례 법규창조력·법률의 우위·법률의 유보 3내용으로 구성. 법률의 유보 범위에 관해서는 侵害留保説 이 판례·실무의 입장 개념 법치주의 法治主義 를 행정 영역에 적용한 것이 「법률에 의한 행정의 원리」이며, 행정법 전체를 관통하는 최상위 기본원리 다. 독일의 오토 마이어（otto mayer, オットー・マイヤー）가 정식화한 것으로, 행정권의 자의 恣意 를 봉쇄하여 ① 국민 대표에 의한 행정 통제를 실현하고（民主主義的 요청） ② 국민의 예측가능성과 권리·자유를 보장하려는（自由主義的 요청） 두 가지 목적을 갖는다. 일본 헌법상의 실정법적 근거는 헌법 41조 （국회는 국권의 최고기관이며 국가의 유일한 입법기관 ）, 헌법 65조 （행정권은 내각에 속한다）, 헌법 73조 1호 （내각은 법률을 성실히 집행한다）에 있다. 즉 「만드는 것은 국회, 집행하는 것은 내각」이라는 권력분립 구조 자체가 이 원리의 골격이다. 이 원리는 다음 3가지 내용 으로 분해되어 출제된다. 순서와 내용을 짝지어 외우는 것이 시험 대비의 출발점이다. 내용 의미 적용 범위 ------ ------ ----------- 法律の法規創造力 국민의 권리·의무에 관한 법규 法規 를 창조할 수 있는 것은 법률뿐 헌법이 인정하는 예외 의원규칙·최고재판소규칙·조례 등 있음 法律の優位 법률이 있으면 행정작용은 그에 위반해서는 안 됨 （소극적·저지적 측면） 모든 행정활동에 예외 없이 타당. 다툼 없음 法律の留保 일정한 행정작용에는 사전에 법률의 근거 가 필요（적극적 측면） 어디까지 필요한지 학설 대립의 핵심 주의할 점은 이 원리가 「행정은 법률에 근거해야 한다」와 「행정은 법률에 위반해서는 안 된다」라는 서로 다른 두 명제 를 함께 담고 있다는 것이다. 앞의 것이 法律の留保 용어/法律の留保.md , 뒤의 것이 法律の優位 용어/法律の優位.md 이며, 이 둘을 뒤바꾼 지문이 전형적인 함정이다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 浦安町漁港鉄杭撤去事件（우라야스초 어항 철말뚝 철거 사건） 最二小判平3.3.8 / 民集45巻3号164頁 요트 계류용 철말뚝이 불법 설치되어 어선 항행에 위험이 발생하자, 어항관리규정 漁港法 당시 26조 을 아직 제정하지 않은 초장 町長 이 법적 근거 없이 독단으로 철거를 강행하고 町費를 지출 어항법· 행정대집행법상의 근거가 없어 철거 강행 자체는 적법하다 할 수 없다 （＝법률에 의한 행정의 원리 위반）. 다만 긴급한 사태에 대처한 부득이한 조치이므로 민법 720조 긴급피난 의 취지에 비추어 비용 지출은 적법 하여 초장의 손해배상책임은 부정 パチンコ球遊器事件（파친코 구유기 사건） 最二小判昭33.3.28 / 民集12巻4号624頁 오랫동안 과세하지 않던 파친코 기계에 대해 통달 通達 을 계기로 물품세를 부과 과세가 통달을 계기로 이루어졌더라도 통달의 내용이 법의 올바른 해석에 합치하는 이상 그 과세처분은 법의 근거에 기한 처분이므로 위헌이 아님 💡 수험 팁 - 3내용의 이름과 개수는 그대로 출제된다. 「법규창조력 → 우위 → 유보」 순서로 암기. 「법률의 지배」「법률의 위임」 같은 유사 명칭을 섞어 넣은 선택지는 오답. - 대비: 法律の優位 ↔ 法律の留保. 우위는 「법률이 있을 때 어기지 마라」 모든 행정활동에 예외 없음 , 유보는 「법률이 없을 때 행동할 수 있느냐」 범위에 학설 대립 . 「법률의 우위에 대해서는 侵害留保説·全部留保説의 대립이 있다」는 지문은 오답 — 대립은 유보 쪽 이야기다. - 대비: 法治主義 일본·독일 ↔ 法の支配 영미 . 법치주의는 형식적으로 법률의 형식만 갖추면 되므로 나치 시대처럼 악법에 의한 지배를 허용해 버린 반성에서, 전후에는 법률 내용의 정당성까지 요구하는 「実質的法治主義」 로 전환되었다. - 浦安 사건은 「위법하지만 지출은 적법」 이라는 결론의 이중성 이 함정이다. 「최고재는 초장의 철거를 적법하다고 판시했다」는 지문은 오답 . - 오토 마이어 독일 의 이름을 켈젠·몽테스키외 등으로 바꿔 놓는 지문에 주의."},"法律の留保":{"type":"term","subject":"용어","id":"法律の留保","title":"法律の留保","sub":"ほうりつのりゅうほ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ほうりつのりゅうほ（법률의 유보）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — 법률에 의한 행정의 원리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>일정한 행정작용을 하려면 \u003cstrong>사전에 법률의 근거(수권)가 있어야 한다\u003c/strong>는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>侵害留保説\u003c/strong> — 권리·자유를 침해하는 행정에 한해 법률의 근거가 필요하다는 입장이 \u003cstrong>판례·행정 실무\u003c/strong>의 태도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AB%E3%82%88%E3%82%8B%E8%A1%8C%E6%94%BF%E3%81%AE%E5%8E%9F%E7%90%86\">法律による行政の原理\u003c/a>의 세 번째 내용이자, 행정법 총론에서 \u003cstrong>가장 치열한 학설 대립의 장(場)\u003c/strong>이다. \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E5%84%AA%E4%BD%8D\">法律の優位\u003c/a>가 「법률이 있으면 어기지 마라」는 소극적 요청인 데 반해, 법률의 유보는 「법률이 없으면 아예 움직이지 마라」는 \u003cstrong>적극적(積極的)\u003c/strong> 요청이다.\u003c/p>\n\u003cp>여기서 핵심 논점은 「법률의 근거가 필요한가」가 아니라 \u003cstrong>「어디까지, 어떤 행정활동에 필요한가」\u003c/strong>다. 침해행정에만 필요하다고 하면 급부행정이 국회 통제를 벗어나 버리고, 모든 행정활동에 필요하다고 하면 재해 구호처럼 법률이 미처 마련되지 않은 영역에서 행정이 손을 놓게 된다. 이 긴장 관계 속에서 아래의 학설들이 대립한다.\u003c/p>\n\u003cp>현행 실정법은 전체적으로 \u003cstrong>侵害留保説을 전제로 짜여 있다\u003c/strong>. \u003cstrong>内閣法 11조\u003c/strong>（정령에는 법률의 위임이 없으면 \u003cstrong>의무를 부과하거나 권리를 제한하는\u003c/strong> 규정을 둘 수 없다）, \u003cstrong>国家行政組織法 12조 3항\u003c/strong>（성령에 관해 같은 취지, 동법 13조 2항이 준용）, \u003cstrong>地方自治法 14조 2항\u003c/strong>（보통지방공공단체가 \u003cstrong>의무를 부과하거나 권리를 제한하려면\u003c/strong> 법령에 특별한 정함이 있는 경우를 제외하고 \u003cstrong>조례에 의하여야 한다\u003c/strong>）가 모두 「의무 부과·권리 제한」이라는 침해적 국면을 기준으로 삼고 있기 때문이다.\u003c/p>\n\u003cp>또 하나 주의할 것은 \u003cstrong>법률의 유보와 조직법상의 근거는 다르다\u003c/strong>는 점이다. 행정기관은 항상 소관 사무를 정한 조직규범(組織規範)을 필요로 하지만, 법률의 유보에서 문제 삼는 것은 개별 활동을 정당화하는 \u003cstrong>근거규범(根拠規範=수권규범)\u003c/strong>이다. 예컨대 행정지도는 조직법상 소관 사무의 범위 내여야 하지만(\u003cstrong>行政手続法 32조 1항\u003c/strong>), 근거규범까지 요구되지는 않는다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>侵害留保説（침해유보설）\u003c/strong>\u003c/td>\u003ctd>국민의 \u003cstrong>권리를 제한하거나 의무를 부과하는 침해적 행정\u003c/strong>에만 법률의 근거가 필요. 급부·수익적 행정에는 불요\u003c/td>\u003ctd>👉 \u003cstrong>판례·실무·전통적 통설\u003c/strong>. 内閣法 11조, 国家行政組織法 12조 3항, 地方自治法 14조 2항이 이 입장을 반영. 급부행정이 비대해진 현대에 국회 통제가 미치지 않는 영역을 남긴다는 비판 → \u003ca href=\"#/e/%E4%BE%B5%E5%AE%B3%E7%95%99%E4%BF%9D%E8%AA%AC\">侵害留保説\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>全部留保説（전부유보설）\u003c/strong>\u003c/td>\u003ctd>침해·급부를 가리지 않고 \u003cstrong>모든 행정활동\u003c/strong>에 법률의 수권이 필요\u003c/td>\u003ctd>민주주의를 철저히 관철. 다만 법률이 없으면 급부조차 불가능해져 \u003cstrong>행정의 기동성을 해치고 오히려 국민에게 불리\u003c/strong>하며, 헌법 65조의 행정권을 형해화한다는 비판 → \u003ca href=\"#/e/%E5%85%A8%E9%83%A8%E7%95%99%E4%BF%9D%E8%AA%AC\">全部留保説\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>権力留保説（권력유보설）\u003c/strong>\u003c/td>\u003ctd>침해적인지 수익적인지를 묻지 않고, \u003cstrong>권력적(일방적·명령적) 행위형식\u003c/strong>으로 행해지는 행정에는 법률의 근거가 필요\u003c/td>\u003ctd>\u003cstrong>유력설\u003c/strong>. 수익적 처분(허가·급부결정)까지 포섭하므로 침해유보설보다 넓고, 행정지도·행정계약을 제외하므로 전부유보설보다 좁다 → \u003ca href=\"#/e/%E6%A8%A9%E5%8A%9B%E7%95%99%E4%BF%9D%E8%AA%AC\">権力留保説\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>社会留保説（사회유보설）\u003c/td>\u003ctd>침해행정에 더하여 \u003cstrong>사회권 보장에 관계되는 급부행정(생존배려행정)\u003c/strong>에도 법률의 근거가 필요\u003c/td>\u003ctd>헌법 25조(생존권)의 실현을 국회 통제 아래 두려는 입장. 「사회권 관련」의 경계가 불명확하다는 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>重要事項留保説（중요사항유보설 = \u003cstrong>本質性理論\u003c/strong>, 本質性理論/Wesentlichkeitstheorie）\u003c/td>\u003ctd>행위형식이 아니라 \u003cstrong>국민의 기본적 인권에 관련되는 중요·본질적 사항\u003c/strong>인지를 기준으로 법률의 근거 요부를 결정\u003c/td>\u003ctd>독일 연방헌법재판소 판례에서 유래. 유력하게 주장되나 \u003cstrong>「중요」의 기준이 애매\u003c/strong>하여 예측가능성이 떨어진다는 비판\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>浦安町漁港鉄杭撤去事件（우라야스초 어항 철말뚝 철거 사건）\u003c/td>\u003ctd>最二小判平3.3.8 / 民集45巻3号164頁\u003c/td>\u003ctd>어항 수역에 불법 설치된 요트 계류용 철말뚝이 어선 항행에 위험을 초래하자, 어항관리규정을 아직 제정하지 않은 초장이 \u003cstrong>법률의 근거 없이\u003c/strong> 철거를 강행하고 비용을 지출\u003c/td>\u003ctd>\u003cstrong>철거 강행은 어항법·행정대집행법에 비추어 적법하다고 할 수 없다\u003c/strong>（법률의 유보 위반）. 다만 긴급 사태에 대처한 부득이한 조치로서 \u003cstrong>민법 720조의 취지에 비추어 비용 지출은 적법\u003c/strong>, 초장의 배상책임 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>武蔵野市教育施設負担金事件（무사시노시 교육시설부담금 사건）\u003c/td>\u003ctd>最一小判平5.2.18 / 民集47巻2号574頁\u003c/td>\u003ctd>시가 \u003cstrong>법률이 아닌 요강(指導要綱)\u003c/strong>에 근거하여 맨션 사업자에게 교육시설부담금을 요구하고, 응하지 않으면 상수도 공급 등에 협력하지 않겠다는 태도를 취함\u003c/td>\u003ctd>\u003cstrong>위법\u003c/strong>. 사업자의 임의성을 해치는 사실상의 강제에 이르렀으므로 \u003cstrong>본래 임의의 기부를 구해야 할 행정지도의 한계를 넘은 위법한 공권력의 행사\u003c/strong>（요강만으로는 부담을 강제할 수 없음）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최우선 암기: 판례·실무 = 侵害留保説.\u003c/strong> 「최고재는 전부유보설을 채택하고 있다」류의 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>학설의 \u003cstrong>넓이 순서\u003c/strong>를 축으로 잡으면 표가 통째로 정리된다: \u003cstrong>侵害留保説 ＜ 権力留保説·社会留保説 ＜ 全部留保説\u003c/strong>（중요사항유보설은 넓이가 아니라 \u003cstrong>기준 자체가 다른\u003c/strong> 별개 축）.\u003c/li>\u003cli>\u003cstrong>대비: 組織規範 ↔ 根拠規範(授権規範).\u003c/strong> 행정지도는 조직규범은 필요하지만 근거규범은 불요. 「행정지도에는 개별 법률의 근거가 필요하다」는 지문은 \u003cstrong>오답\u003c/strong>（行政手続法 32조 1항은 근거를 요구하는 조문이 아니라 \u003cstrong>한계\u003c/strong>를 정한 조문）.\u003c/li>\u003cli>\u003cstrong>대비: 法律の留保 ↔ 法律の優位.\u003c/strong> 유보는 \u003cstrong>범위에 학설 대립 있음\u003c/strong>, 우위는 \u003cstrong>예외 없이 전면 적용\u003c/strong>. 이 대비를 뒤집은 선지가 최다 빈출.\u003c/li>\u003cli>조문 3종 세트로 침해유보설의 실정법적 근거를 확인해 두면 지문의 진위를 바로 가릴 수 있다: \u003cstrong>内閣法 11조 / 国家行政組織法 12조 3항 / 地方自治法 14조 2항\u003c/strong> — 모두 「\u003cstrong>의무를 부과하거나 권리를 제한\u003c/strong>」이라는 표현을 쓴다.\u003c/li>\u003cli>浦安 사건은 \u003cstrong>「행위는 위법, 지출은 적법」\u003c/strong>의 이중 결론, 武蔵野市 사건은 \u003cstrong>「행정지도 자체는 적법하나 임의성을 해치면 위법」\u003c/strong>의 이중 결론이다. 어느 쪽도 「전부 적법」「전부 위법」으로 단정한 지문은 오답.\u003c/li>\u003c/ul>","search":"法律の留保 ほうりつのりゅうほ 항목 내용 ------ ------ 읽기 ほうりつのりゅうほ（법률의 유보） 과목 행정법（행정법 총론 — 법률에 의한 행정의 원리） 한줄 정의 일정한 행정작용을 하려면 사전에 법률의 근거 수권 가 있어야 한다 는 원칙 통설·판례 侵害留保説 — 권리·자유를 침해하는 행정에 한해 법률의 근거가 필요하다는 입장이 판례·행정 실무 의 태도 개념 法律による行政の原理 용어/法律による行政の原理.md 의 세 번째 내용이자, 행정법 총론에서 가장 치열한 학설 대립의 장 場 이다. 法律の優位 용어/法律の優位.md 가 「법률이 있으면 어기지 마라」는 소극적 요청인 데 반해, 법률의 유보는 「법률이 없으면 아예 움직이지 마라」는 적극적 積極的 요청이다. 여기서 핵심 논점은 「법률의 근거가 필요한가」가 아니라 「어디까지, 어떤 행정활동에 필요한가」 다. 침해행정에만 필요하다고 하면 급부행정이 국회 통제를 벗어나 버리고, 모든 행정활동에 필요하다고 하면 재해 구호처럼 법률이 미처 마련되지 않은 영역에서 행정이 손을 놓게 된다. 이 긴장 관계 속에서 아래의 학설들이 대립한다. 현행 실정법은 전체적으로 侵害留保説을 전제로 짜여 있다 . 内閣法 11조 （정령에는 법률의 위임이 없으면 의무를 부과하거나 권리를 제한하는 규정을 둘 수 없다）, 国家行政組織法 12조 3항 （성령에 관해 같은 취지, 동법 13조 2항이 준용）, 地方自治法 14조 2항 （보통지방공공단체가 의무를 부과하거나 권리를 제한하려면 법령에 특별한 정함이 있는 경우를 제외하고 조례에 의하여야 한다 ）가 모두 「의무 부과·권리 제한」이라는 침해적 국면을 기준으로 삼고 있기 때문이다. 또 하나 주의할 것은 법률의 유보와 조직법상의 근거는 다르다 는 점이다. 행정기관은 항상 소관 사무를 정한 조직규범 組織規範 을 필요로 하지만, 법률의 유보에서 문제 삼는 것은 개별 활동을 정당화하는 근거규범 根拠規範=수권규범 이다. 예컨대 행정지도는 조직법상 소관 사무의 범위 내여야 하지만 行政手続法 32조 1항 , 근거규범까지 요구되지는 않는다. 학설 학설 내용 비고 ------ ------ ------ 侵害留保説（침해유보설） 국민의 권리를 제한하거나 의무를 부과하는 침해적 행정 에만 법률의 근거가 필요. 급부·수익적 행정에는 불요 👉 판례·실무·전통적 통설 . 内閣法 11조, 国家行政組織法 12조 3항, 地方自治法 14조 2항이 이 입장을 반영. 급부행정이 비대해진 현대에 국회 통제가 미치지 않는 영역을 남긴다는 비판 → 侵害留保説 용어/侵害留保説.md 全部留保説（전부유보설） 침해·급부를 가리지 않고 모든 행정활동 에 법률의 수권이 필요 민주주의를 철저히 관철. 다만 법률이 없으면 급부조차 불가능해져 행정의 기동성을 해치고 오히려 국민에게 불리 하며, 헌법 65조의 행정권을 형해화한다는 비판 → 全部留保説 용어/全部留保説.md 権力留保説（권력유보설） 침해적인지 수익적인지를 묻지 않고, 권력적 일방적·명령적 행위 03c/a>의 학설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국민의 \u003cstrong>권리를 제한하거나 의무를 부과하는 침해적 행정활동\u003c/strong>에 한하여 법률의 근거가 필요하다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>판례·행정 실무의 입장\u003c/strong>이자 전통적 통설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>의 범위를 둘러싼 학설 중 \u003cstrong>가장 좁은 범위\u003c/strong>를 인정하는 견해다. 법률의 근거가 필요한 것은 「국민의 자유와 재산을 침해하는 작용」뿐이며, 보조금 교부·행정지도·정보 제공 같은 \u003cstrong>급부적·수익적·비권력적 행정에는 법률의 근거가 없어도 된다\u003c/strong>고 본다. 명치헌법 시대에 오토 마이어의 이론을 통해 정착하여 현재까지 행정 실무를 지배하고 있다.\u003c/p>\n\u003cp>이론적 근거는 자유주의에 있다. 국민의 자유와 재산은 원래 국가 이전에 존재하는 것이므로 그것을 빼앗으려면 국민 대표기관의 동의(법률)가 필요하지만, 국민에게 이익을 주는 활동까지 법률이 없다고 금지해 버리면 오히려 국민이 손해를 본다는 발상이다.\u003c/p>\n\u003cp>\u003cstrong>실정법이 이 입장에 서 있다\u003c/strong>는 점이 결정적이다. \u003cstrong>内閣法 11조\u003c/strong>（정령에는 법률의 위임이 없으면 \u003cstrong>의무를 부과하거나 권리를 제한하는\u003c/strong> 규정을 둘 수 없다）, \u003cstrong>国家行政組織法 12조 3항\u003c/strong>（성령에 관한 동일 취지 — 동법 13조 2항이 위원회·청의 규칙에 준용）, \u003cstrong>地方自治法 14조 2항\u003c/strong>（\u003cstrong>의무를 부과하거나 권리를 제한하려면\u003c/strong> 법령에 특별한 정함이 있는 경우를 제외하고 \u003cstrong>조례에 의하여야 한다\u003c/strong>）가 한결같이 「침해」를 기준으로 삼는다. 헌법 차원에서도 \u003cstrong>헌법 84조\u003c/strong>의 조세법률주의, \u003cstrong>헌법 31조\u003c/strong>의 적정절차 요청이 같은 방향을 가리킨다.\u003c/p>\n\u003cp>비판은 두 가지다. 첫째, 현대 복지국가에서 급부행정의 비중이 압도적으로 커졌는데 그 거대한 영역이 \u003cstrong>국회의 통제 밖에 남는다\u003c/strong>는 점. 둘째, 보조금 지급 기준의 자의적 운용처럼 급부의 거부·중단은 사실상 침해와 다름없는 불이익을 낳는데도 법률의 근거가 요구되지 않는다는 점이다. 이 비판에서 \u003ca href=\"#/e/%E5%85%A8%E9%83%A8%E7%95%99%E4%BF%9D%E8%AA%AC\">全部留保説\u003c/a>·\u003ca href=\"#/e/%E6%A8%A9%E5%8A%9B%E7%95%99%E4%BF%9D%E8%AA%AC\">権力留保説\u003c/a>·社会留保説·重要事項留保説이 파생되었다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>浦安町漁港鉄杭撤去事件（우라야스초 어항 철말뚝 철거 사건）\u003c/td>\u003ctd>最二小判平3.3.8 / 民集45巻3号164頁\u003c/td>\u003ctd>어항 수역의 불법 철말뚝을 초장이 법률의 근거 없이 실력으로 철거\u003c/td>\u003ctd>\u003cstrong>철거 강행은 적법하다고 할 수 없음\u003c/strong> — 국민의 재산을 실력으로 제거하는 \u003cstrong>전형적 침해행정\u003c/strong>이므로 법률의 근거가 필요하다는 전제 위에 선 판시. 다만 긴급성을 고려해 민법 720조의 취지에 따라 \u003cstrong>비용 지출은 적법\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>武蔵野市教育施設負担金事件（무사시노시 교육시설부담금 사건）\u003c/td>\u003ctd>最一小判平5.2.18 / 民集47巻2号574頁\u003c/td>\u003ctd>법률이 아닌 \u003cstrong>요강(指導要綱)\u003c/strong>을 근거로 사업자에게 교육시설부담금 납부를 요구하고 불응 시 상수도 협력 거부를 시사\u003c/td>\u003ctd>\u003cstrong>위법한 공권력의 행사\u003c/strong>. 임의성을 해치는 사실상의 강제는 행정지도의 한계를 넘으며, \u003cstrong>행정규칙에 불과한 요강으로는 부담을 강제할 수 없다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「판례·실무 = 침해유보설」은 반드시 외운다.\u003c/strong> 학설 대립 문제에서 「어느 설이 실무의 태도인가」를 묻는 것이 정석 출제다.\u003c/li>\u003cli>\u003cstrong>대비: 侵害留保説 ↔ 権力留保説.\u003c/strong> 침해유보설은 \u003cstrong>수익적 처분(허가·급부결정)에는 법률의 근거 불요\u003c/strong>로 보지만, 권력유보설은 \u003cstrong>처분이라는 권력적 형식이면 수익적이어도 필요\u003c/strong>로 본다. 이 한 지점이 두 설을 가르는 결정적 차이다.\u003c/li>\u003cli>\u003cstrong>대비: 侵害留保説 ↔ 社会留保説.\u003c/strong> 급부행정 전반을 제외하는 것이 침해유보설, 그중 \u003cstrong>사회권(헌법 25조) 관련 급부행정만\u003c/strong> 끌어들이는 것이 사회유보설.\u003c/li>\u003cli>실정법 3조문(\u003cstrong>内閣法 11조 / 国家行政組織法 12조 3항 / 地方自治法 14조 2항\u003c/strong>)의 공통 문언 \u003cstrong>「의무를 부과하거나 권리를 제한」\u003c/strong>이 침해유보설의 흔적이다. 조문 문언을 그대로 묻는 지문이 나온다.\u003c/li>\u003cli>「침해유보설에 따르면 보조금 교부에도 법률의 근거가 필요하다」는 지문은 \u003cstrong>오답\u003c/strong>（불요가 원칙. 다만 예산이라는 별개의 국회 통제는 받는다）.\u003c/li>\u003c/ul>","search":"侵害留保説 しんがいりゅうほせつ 항목 내용 ------ ------ 읽기 しんがいりゅうほせつ（침해유보설） 과목 행정법（행정법 총론 — 法律の留保 용어/法律の留保.md 의 학설） 한줄 정의 국민의 권리를 제한하거나 의무를 부과하는 침해적 행정활동 에 한하여 법률의 근거가 필요하다는 학설 통설·판례 판례·행정 실무의 입장 이자 전통적 통설 개념 法律の留保 용어/法律の留保.md 의 범위를 둘러싼 학설 중 가장 좁은 범위 를 인정하는 견해다. 법률의 근거가 필요한 것은 「국민의 자유와 재산을 침해하는 작용」뿐이며, 보조금 교부·행정지도·정보 제공 같은 급부적·수익적·비권력적 행정에는 법률의 근거가 없어도 된다 고 본다. 명치헌법 시대에 오토 마이어의 이론을 통해 정착하여 현재까지 행정 실무를 지배하고 있다. 이론적 근거는 자유주의에 있다. 국민의 자유와 재산은 원래 국가 이전에 존재하는 것이므로 그것을 빼앗으려면 국민 대표기관의 동의 법률 가 필요하지만, 국민에게 이익을 주는 활동까지 법률이 없다고 금지해 버리면 오히려 국민이 손해를 본다는 발상이다. 실정법이 이 입장에 서 있다 는 점이 결정적이다. 内閣法 11조 （정령에는 법률의 위임이 없으면 의무를 부과하거나 권리를 제한하는 규정을 둘 수 없다）, 国家行政組織法 12조 3항 （성령에 관한 동일 취지 — 동법 13조 2항이 위원회·청의 규칙에 준용）, 地方自治法 14조 2항 （ 의무를 부과하거나 권리를 제한하려면 법령에 특별한 정함이 있는 경우를 제외하고 조례에 의하여야 한다 ）가 한결같이 「침해」를 기준으로 삼는다. 헌법 차원에서도 헌법 84조 의 조세법률주의, 헌법 31조 의 적정절차 요청이 같은 방향을 가리킨다. 비판은 두 가지다. 첫째, 현대 복지국가에서 급부행정의 비중이 압도적으로 커졌는데 그 거대한 영역이 국회의 통제 밖에 남는다 는 점. 둘째, 보조금 지급 기준의 자의적 운용처럼 급부의 거부·중단은 사실상 침해와 다름없는 불이익을 낳는데도 법률의 근거가 요구되지 않는다는 점이다. 이 비판에서 全部留保説 용어/全部留保説.md · 権力留保説 용어/権力留保説.md ·社会留保説·重要事項留保説이 파생되었다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 浦安町漁港鉄杭撤去事件（우라야스초 어항 철말뚝 철거 사건） 最二小判平3.3.8 / 民集45巻3号164頁 어항 수역의 불법 철말뚝을 초장이 법률의 근거 없이 실력으로 철거 철거 강행은 적법하다고 할 수 없음 — 국민의 재산을 실력으로 제거하는 전형적 침해행정 이므로 법률의 근거가 필요하다는 전제 위에 선 판시. 다만 긴급성을 고려해 민법 720조의 취지에 따라 비용 지출은 적법 武蔵野市教育施設負担金事件（무사시노시 교육시설부담금 사건） 最一小判平5.2.18 / 民集47巻2号574頁 법률이 아닌 요강 指導要綱 을 근거로 사업자에게 교육시설부담금 납부를 요구하고 불응 시 상수도 협력 거부를 시사 위법한 공권력의 행사 . 임의성을 해치는 사실상의 강제는 행정지도의 한계를 넘으며, 행정규칙에 불과한 요강으로는 부담을 강제할 수 없다 💡 수험 팁 - 「판례·실무 = 침해유보설」은 반드시 외운다. 학설 대립 문제에서 「어느 설이 실무의 태도인가」를 묻는 것이 정석 출제다. - 대비: 侵害留保説 ↔ 権力留保説. 침해유보설은 수익적 처분 허가·급부결정 에는 법률의 근거 불요 로 보지만, 권력유보설은 처분이라는 권력적 형식이면 수익적이어도 필요 로 본다. 이 한 지점이 두 설을 가르는 결정적 차이다. - 대비: 侵害留保説 ↔ 社会留保説. 급부행정 전반을 제외하는 것이 침해유보설, 그중 사회권 헌법 25조 관련 급부행정만 끌어들이는 것이 사회유보설. - 실정법 3조문 内閣法 11조 / 国家行政組織法 12조 3항 / 地方自治法 14조 2항 의 공통 문언 「의무를 부과하거나 권리를 제한」 이 침해유보설의 흔적이다. 조문 문언을 그대로 묻는 지문이 나온다. - 「침해유보설에 따르면 보조금 교부에도 법률의 근거가 필요하다」는 지문은 오답 （불요가 원칙. 다만 예산이라는 별개의 국회 통제는 받는다）."},"全部留保説":{"type":"term","subject":"용어","id":"全部留保説","title":"全部留保説","sub":"ぜんぶりゅうほせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぜんぶりゅうほせつ（전부유보설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>의 학설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>침해적인지 급부적인지를 가리지 않고 \u003cstrong>모든 행정활동\u003c/strong>에 법률의 수권이 필요하다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>소수설\u003c/strong>. 판례·실무는 \u003ca href=\"#/e/%E4%BE%B5%E5%AE%B3%E7%95%99%E4%BF%9D%E8%AA%AC\">侵害留保説\u003c/a>을 취한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>의 범위를 \u003cstrong>가장 넓게\u003c/strong> 잡는 견해다. 행정활동은 그것이 국민에게 불이익을 주든 이익을 주든, 권력적이든 비권력적이든, 모두 \u003cstrong>국회가 제정한 법률의 수권\u003c/strong>이 있어야 비로소 할 수 있다고 본다.\u003c/p>\n\u003cp>논거는 민주주의의 철저한 관철이다. \u003cstrong>헌법 41조\u003c/strong>가 국회를 「국권의 최고기관이자 국가의 유일한 입법기관」으로 삼은 이상, 행정은 국민 대표의 의사 없이는 어떤 활동도 할 수 없다는 것이다. 또한 \u003ca href=\"#/e/%E4%BE%B5%E5%AE%B3%E7%95%99%E4%BF%9D%E8%AA%AC\">侵害留保説\u003c/a>이 남기는 급부행정의 통제 공백 — 보조금 배분의 자의성, 행정지도의 사실상 강제 — 을 정면에서 메울 수 있다는 실천적 이점도 지적된다.\u003c/p>\n\u003cp>그러나 다음의 비판이 결정적이어서 오늘날 그대로 지지받지는 못한다. 첫째, \u003cstrong>행정의 기동성·탄력성을 심각하게 해친다.\u003c/strong> 재해 발생 시의 긴급 구호, 예상치 못한 감염증 대응처럼 법률이 미처 준비되지 못한 상황에서 행정이 아무것도 할 수 없게 되어 \u003cstrong>오히려 국민이 불이익을 입는다\u003c/strong>. 둘째, \u003cstrong>헌법 65조\u003c/strong>가 행정권을 내각에 부여한 취지에 반한다. 행정에는 법률의 집행에 그치지 않는 고유의 활동 영역이 인정되어야 하는데, 전부유보설은 이를 형해화한다. 셋째, 모든 활동을 법률로 규율하는 것은 입법기술상으로도 불가능에 가깝다.\u003c/p>\n\u003cp>이 비판을 받아, 「행위형식」을 기준으로 범위를 좁힌 \u003ca href=\"#/e/%E6%A8%A9%E5%8A%9B%E7%95%99%E4%BF%9D%E8%AA%AC\">権力留保説\u003c/a>, 「사회권 관련 급부」로 한정한 社会留保説, 「본질적 중요사항」이라는 실질 기준으로 옮겨간 重要事項留保説(本質性理論)이 등장했다.\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>키워드 = 「행정의 기동성(機動性)을 해친다」.\u003c/strong> 전부유보설에 대한 비판을 묻는 문제는 거의 이 문구로 나온다.\u003c/li>\u003cli>\u003cstrong>역설 포인트: 「국민 보호를 철저히 하려던 학설이 결과적으로 국민에게 불리해진다」.\u003c/strong> 법률이 없으면 재해 구호·긴급 급부조차 못 하기 때문이다. 이 논리 구조를 이해하면 서술형에도 대응된다.\u003c/li>\u003cli>\u003cstrong>대비: 全部留保説 ↔ 侵害留保説.\u003c/strong> 넓이가 정반대 양극단. 학설 스펙트럼은 \u003cstrong>侵害 ＜ 権力·社会 ＜ 全部\u003c/strong> 순으로 넓어진다.\u003c/li>\u003cli>「전부유보설이 판례의 입장이다」「전부유보설이 실무에 채용되어 있다」는 지문은 \u003cstrong>전부 오답\u003c/strong>.\u003c/li>\u003cli>비판의 헌법상 근거는 \u003cstrong>헌법 65조(행정권은 내각에 속한다)\u003c/strong>, 지지의 헌법상 근거는 \u003cstrong>헌법 41조(국회는 유일한 입법기관)\u003c/strong>. 조문 번호를 뒤바꾼 선지에 주의.\u003c/li>\u003c/ul>","search":"全部留保説 ぜんぶりゅうほせつ 항목 내용 ------ ------ 읽기 ぜんぶりゅうほせつ（전부유보설） 과목 행정법（행정법 총론 — 法律の留保 용어/法律の留保.md 의 학설） 한줄 정의 침해적인지 급부적인지를 가리지 않고 모든 행정활동 에 법률의 수권이 필요하다는 학설 통설·판례 소수설 . 판례·실무는 侵害留保説 용어/侵害留保説.md 을 취한다 개념 法律の留保 용어/法律の留保.md 의 범위를 가장 넓게 잡는 견해다. 행정활동은 그것이 국민에게 불이익을 주든 이익을 주든, 권력적이든 비권력적이든, 모두 국회가 제정한 법률의 수권 이 있어야 비로소 할 수 있다고 본다. 논거는 민주주의의 철저한 관철이다. 헌법 41조 가 국회를 「국권의 최고기관이자 국가의 유일한 입법기관」으로 삼은 이상, 행정은 국민 대표의 의사 없이는 어떤 활동도 할 수 없다는 것이다. 또한 侵害留保説 용어/侵害留保説.md 이 남기는 급부행정의 통제 공백 — 보조금 배분의 자의성, 행정지도의 사실상 강제 — 을 정면에서 메울 수 있다는 실천적 이점도 지적된다. 그러나 다음의 비판이 결정적이어서 오늘날 그대로 지지받지는 못한다. 첫째, 행정의 기동성·탄력성을 심각하게 해친다. 재해 발생 시의 긴급 구호, 예상치 못한 감염증 대응처럼 법률이 미처 준비되지 못한 상황에서 행정이 아무것도 할 수 없게 되어 오히려 국민이 불이익을 입는다 . 둘째, 헌법 65조 가 행정권을 내각에 부여한 취지에 반한다. 행정에는 법률의 집행에 그치지 않는 고유의 활동 영역이 인정되어야 하는데, 전부유보설은 이를 형해화한다. 셋째, 모든 활동을 법률로 규율하는 것은 입법기술상으로도 불가능에 가깝다. 이 비판을 받아, 「행위형식」을 기준으로 범위를 좁힌 権力留保説 용어/権力留保説.md , 「사회권 관련 급부」로 한정한 社会留保説, 「본질적 중요사항」이라는 실질 기준으로 옮겨간 重要事項留保説 本質性理論 이 등장했다. 💡 수험 팁 - 키워드 = 「행정의 기동성 機動性 을 해친다」. 전부유보설에 대한 비판을 묻는 문제는 거의 이 문구로 나온다. - 역설 포인트: 「국민 보호를 철저히 하려던 학설이 결과적으로 국민에게 불리해진다」. 법률이 없으면 재해 구호·긴급 급부조차 못 하기 때문이다. 이 논리 구조를 이해하면 서술형에도 대응된다. - 대비: 全部留保説 ↔ 侵害留保説. 넓이가 정반대 양극단. 학설 스펙트럼은 侵害 ＜ 権力·社会 ＜ 全部 순으로 넓어진다. - 「전부유보설이 판례의 입장이다」「전부유보설이 실무에 채용되어 있다」는 지문은 전부 오답 . - 비판의 헌법상 근거는 헌법 65조 행정권은 내각에 속한다 , 지지의 헌법상 근거는 헌법 41조 국회는 유일한 입법기관 . 조문 번호를 뒤바꾼 선지에 주의."},"権力留保説":{"type":"term","subject":"용어","id":"権力留保説","title":"権力留保説","sub":"けんりょくりゅうほせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>けんりょくりゅうほせつ（권력유보설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정법 총론 — \u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>의 학설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>침해적인지 수익적인지를 묻지 않고, \u003cstrong>권력적 행위형식\u003c/strong>으로 행해지는 행정활동에는 법률의 근거가 필요하다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>학계의 유력설\u003c/strong>. 다만 판례·실무는 \u003ca href=\"#/e/%E4%BE%B5%E5%AE%B3%E7%95%99%E4%BF%9D%E8%AA%AC\">侵害留保説\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E6%B3%95%E5%BE%8B%E3%81%AE%E7%95%99%E4%BF%9D\">法律の留保\u003c/a>의 범위를 「침해인가 급부인가」라는 \u003cstrong>내용\u003c/strong>이 아니라 「권력적인가 비권력적인가」라는 \u003cstrong>행위형식(行為形式)\u003c/strong>으로 가르는 견해다. 행정이 상대방의 동의 없이 \u003cstrong>일방적으로 법률관계를 형성·변경하는 힘\u003c/strong>을 행사하는 이상, 그 결과가 국민에게 유리하든 불리하든 법률의 수권이 있어야 한다고 본다.\u003c/p>\n\u003cp>여기서 「권력적 행위형식」이란 \u003cstrong>行政行為（行政処分）\u003c/strong>, \u003cstrong>行政強制\u003c/strong>（행정대집행법에 의한 대집행, 직접강제, 즉시강제 등）, \u003cstrong>行政上의 制裁\u003c/strong>（과징금·영업정지 등）를 가리킨다. 반대로 \u003cstrong>行政指導\u003c/strong>（行政手続法 32조 이하）, \u003cstrong>行政契約\u003c/strong>, 순수한 서비스 제공이나 정보 제공 같은 \u003cstrong>비권력적 활동\u003c/strong>은 법률의 근거 없이도 가능하다고 본다.\u003c/p>\n\u003cp>이 학설의 실익은 \u003ca href=\"#/e/%E4%BE%B5%E5%AE%B3%E7%95%99%E4%BF%9D%E8%AA%AC\">侵害留保説\u003c/a>과의 차이에서 드러난다. 예컨대 \u003cstrong>허가·인가·생활보호 개시결정 같은 수익적 처분\u003c/strong>은 국민에게 이익을 주므로 침해유보설에서는 법률의 근거가 불요하지만, \u003cstrong>권력유보설에서는 「처분」이라는 권력적 형식을 취하는 이상 법률의 근거가 필요\u003c/strong>하다. 결과적으로 침해유보설보다 넓고, 비권력적 활동을 제외하므로 \u003ca href=\"#/e/%E5%85%A8%E9%83%A8%E7%95%99%E4%BF%9D%E8%AA%AC\">全部留保説\u003c/a>보다는 좁다. 행정의 기동성을 지나치게 해치지 않으면서도 급부행정의 통제 공백을 상당 부분 메운다는 점에서 \u003cstrong>유력설\u003c/strong>로 평가된다.\u003c/p>\n\u003cp>비판도 있다. 첫째, \u003cstrong>「권력적/비권력적」이라는 형식적 기준에 의존\u003c/strong>하여, 형식만 비권력적으로 바꾸면 유보를 회피할 수 있다. 실제로 행정지도나 요강 행정이 사실상의 강제로 기능해 온 것이 그 예다（武蔵野市教育施設負担金事件 最一小判平5.2.18 참조）. 둘째, 보조금 교부처럼 \u003cstrong>비권력적이지만 국민 생활에 중대한 영향을 미치는 활동\u003c/strong>이 여전히 유보 밖에 남는다. 이 지점을 실질 기준으로 다시 잡으려는 것이 重要事項留保説(本質性理論)이다.\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>판별 기준을 한 단어로: 「行為形式」.\u003c/strong> 침해유보설 = \u003cstrong>내용\u003c/strong>(침해인가), 권력유보설 = \u003cstrong>형식\u003c/strong>(권력적인가), 사회유보설 = \u003cstrong>영역\u003c/strong>(사회권 관련인가), 중요사항유보설 = \u003cstrong>중요성\u003c/strong>(본질적인가). 이 4개의 기준 축을 짝지어 외우면 학설표가 통째로 정리된다.\u003c/li>\u003cli>\u003cstrong>대비: 侵害留保説 ↔ 権力留保説의 갈림길 = 「수익적 처분」.\u003c/strong> 허가·급부결정에 법률의 근거가 필요한가? 침해유보설 \u003cstrong>불요\u003c/strong> / 권력유보설 \u003cstrong>필요\u003c/strong>. 이 한 문항이 가장 자주 나온다.\u003c/li>\u003cli>\u003cstrong>대비: 権力留保説 ↔ 全部留保説의 갈림길 = 「행정지도·행정계약」.\u003c/strong> 권력유보설 \u003cstrong>불요\u003c/strong> / 전부유보설 \u003cstrong>필요\u003c/strong>.\u003c/li>\u003cli>「권력유보설이 판례의 입장」이라는 지문은 \u003cstrong>오답\u003c/strong>. 유력설이지만 실무는 어디까지나 침해유보설이다.\u003c/li>\u003cli>권력유보설이 커버하지 못하는 대표 사례로 \u003cstrong>보조금 교부·행정지도\u003c/strong>를 기억해 두면, 「이 학설의 문제점을 지적하라」는 서술형에 바로 대응할 수 있다.\u003c/li>\u003c/ul>","search":"権力留保説 けんりょくりゅうほせつ 항목 내용 ------ ------ 읽기 けんりょくりゅうほせつ（권력유보설） 과목 행정법（행정법 총론 — 法律の留保 용어/法律の留保.md 의 학설） 한줄 정의 침해적인지 수익적인지를 묻지 않고, 권력적 행위형식 으로 행해지는 행정활동에는 법률의 근거가 필요하다는 학설 통설·판례 학계의 유력설 . 다만 판례·실무는 侵害留保説 용어/侵害留保説.md 개념 法律の留保 용어/法律の留保.md 의 범위를 「침해인가 급부인가」라는 내용 이 아니라 「권력적인가 비권력적인가」라는 행위형식 行為形式 으로 가르는 견해다. 행정이 상대방의 동의 없이 일방적으로 법률관계를 형성·변경하는 힘 을 행사하는 이상, 그 결과가 국민에게 유리하든 불리하든 법률의 수권이 있어야 한다고 본다. 여기서 「권력적 행위형식」이란 行政行為（行政処分） , 行政強制 （행정대집행법에 의한 대집행, 직접강제, 즉시강제 등）, 行政上의 制裁 （과징금·영업정지 등）를 가리킨다. 반대로 行政指導 （行政手続法 32조 이하）, 行政契約 , 순수한 서비스 제공이나 정보 제공 같은 비권력적 활동 은 법률의 근거 없이도 가능하다고 본다. 이 학설의 실익은 侵害留保説 용어/侵害留保説.md 과의 차이에서 드러난다. 예컨대 허가·인가·생활보호 개시결정 같은 수익적 처분 은 국민에게 이익을 주므로 침해유보설에서는 법률의 근거가 불요하지만, 권력유보설에서는 「처분」이라는 권력적 형식을 취하는 이상 법률의 근거가 필요 하다. 결과적으로 침해유보설보다 넓고, 비권력적 활동을 제외하므로 全部留保説 용어/全部留保説.md 보다는 좁다. 행정의 기동성을 지나치게 해치지 않으면서도 급부행정의 통제 공백을 상당 부분 메운다는 점에서 유력설 로 평가된다. 비판도 있다. 첫째, 「권력적/비권력적」이라는 형식적 기준에 의존 하여, 형식만 비권력적으로 바꾸면 유보를 회피할 수 있다. 실제로 행정지도나 요강 행정이 사실상의 강제로 기능해 온 것이 그 예다（武蔵野市教育施設負担金事件 最一小判平5.2.18 참조）. 둘째, 보조금 교부처럼 비권력적이지만 국민 생활에 중대한 영향을 미치는 활동 이 여전히 유보 밖에 남는다. 이 지점을 실질 기준으로 다시 잡으려는 것이 重要事項留保説 本質性理論 이다. 💡 수험 팁 - 판별 기준을 한 단어로: 「行為形式」. 침해유보설 = 내용 침해인가 , 권력유보설 = 형식 권력적인가 , 사회유보설 = 영역 사회권 관련인가 , 중요사항유보설 = 중요성 본질적인가 . 이 4개의 기준 축을 짝지어 외우면 학설표가 통째로 정리된다. - 대비: 侵害留保説 ↔ 権力留保説의 갈림길 = 「수익적 처분」. 허가·급부결정에 법률의 근거가 필요한가? 침해유보설 불요 / 권력유보설 필요 . 이 한 문항이 가장 자주 나온다. - 대비: 権力留保説 ↔ 全部留保説의 갈림길 = 「행정지도·행정계약」. 권력유보설 불요 / 전부유보설 필요 . - 「권력유보설이 판례의 입장」이라는 지문은 오답 . 유력설이지만 실무는 어디까지나 침해유보설이다. - 권력유보설이 커버하지 못하는 대표 사례로 보조금 교부·행정지도 를 기억해 두면, 「이 학설의 문제점을 지적하라」는 서술형에 바로 대응할 수 있다."},"公定力":{"type":"term","subject":"용어","id":"公定力","title":"公定力","sub":"こうていりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>こうていりょく（공정력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정행위에 위법한 하자가 있어도 무효가 아닌 한, 권한 있는 기관이 취소할 때까지는 유효한 것으로 통용되는 효력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>근거는 \u003cstrong>취소소송의 배타적 관할(取消訴訟の排他的管轄)\u003c/strong> — 「적법성의 추정」이 아니라, 취소쟁송 제도를 둔 실정법 구조의 반사적 효과\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정행위는 성립에 하자가 있어 위법하더라도, 그 하자가 중대하고 명백하여 무효가 되지 않는 한(→\u003ca href=\"#/e/%E9%87%8D%E5%A4%A7%E6%98%8E%E7%99%BD%E8%AA%AC\">重大明白説\u003c/a>) 일단 유효한 것으로 취급된다. 상대방인 국민은 물론 제3자·다른 행정청·(취소소송 이외의 소송을 다루는) 법원까지도 그 효력을 부정할 수 없다. 예컨대 위법한 과세처분을 받았더라도 그 처분이 취소되기 전까지는 납세의무가 존속하고 그에 따른 체납처분도 유효하다.\u003c/p>\n\u003cp>과거에는 「행정행위에는 \u003cstrong>적법성의 추정(適法性の推定)\u003c/strong>이 있다」고 설명했으나 오늘날 이 설명은 부정된다. 통설은 공정력의 근거를 \u003cstrong>취소소송의 배타적 관할\u003c/strong>에서 찾는다. 행정사건소송법이 「처분의 취소의 소」(3조 2항)라는 특별한 쟁송 유형을 마련하고 출소기간(14조)까지 둔 이상, 처분의 효력을 깨뜨리려면 반드시 취소쟁송에 의해야 한다는 구조가 되며, 공정력은 그 \u003cstrong>반사적 효과\u003c/strong>에 지나지 않는다는 것이다. 즉 공정력은 「적법하다」는 실체적 판단이 아니라 「일단 통용시킨다」는 절차적 힘이다. 그래서 \u003cstrong>공정력에는 명문의 근거 조문이 없다\u003c/strong>.\u003c/p>\n\u003cp>공정력이 미치지 \u003cstrong>않는\u003c/strong> 범위가 시험의 핵심이다. ① \u003cstrong>무효인 행정행위\u003c/strong>에는 애초에 공정력이 없다 — 누구든 언제든 무효를 주장할 수 있고, 무효등확인의 소(행정사건소송법 3조 4항·36조)에는 출소기간 제한이 없다. ② \u003cstrong>국가배상청구\u003c/strong>에는 공정력이 미치지 않는다 — 미리 취소판결이나 무효확인판결을 받지 않아도 국가배상법 1조 1항에 의한 배상청구가 가능하다(最判昭36.4.21, 最判平22.6.3). ③ 형사사건에서 처분의 위법성이 선결문제가 되는 경우에도 법원이 스스로 판단할 수 있다(最判昭53.6.16).\u003c/p>\n\u003cp>이 구분의 열쇠는 \u003cstrong>선결문제(先決問題)\u003c/strong>다. 민사·형사소송에서 「처분의 \u003cstrong>효력의 유무\u003c/strong>」를 부정하지 않으면 결론이 나오지 않는 경우(예: 과세처분이 취소되지 않은 상태에서 납부한 세금의 부당이득반환청구)에는 공정력이 미쳐 법원이 그 효력을 부정할 수 없다. 반면 「처분의 \u003cstrong>위법성\u003c/strong> 자체」만 확인하면 되고 처분의 효력에는 손대지 않는 경우(국가배상청구)에는 공정력이 미치지 않는다. 👉 \u003cstrong>대비: 「효력의 부정」이 필요 = 공정력 O ／ 「위법성의 확인」만으로 족함 = 공정력 X\u003c/strong>\u003c/p>\n\u003ch2>행정행위의 4가지 효력 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>효력\u003c/th>\u003cth>제약받는 쪽\u003c/th>\u003cth>내용\u003c/th>\u003cth>근거\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>公定力\u003c/strong>\u003c/td>\u003ctd>국민·제3자·다른 행정청·법원\u003c/td>\u003ctd>위법해도 취소될 때까지 유효\u003c/td>\u003ctd>명문 없음 / 취소소송의 배타적 관할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>국민\u003c/strong>\u003c/td>\u003ctd>쟁송기간 경과 후 다툴 수 없음\u003c/td>\u003ctd>행정사건소송법 14조, 행정불복심사법 18조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>행정청 자신\u003c/strong>\u003c/td>\u003ctd>재결 등을 스스로 취소·변경할 수 없음\u003c/td>\u003ctd>명문 없음 / 판례(最判昭29.1.21)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E8%87%AA%E5%8A%9B%E5%9F%B7%E8%A1%8C%E5%8A%9B\">自力執行力\u003c/a>\u003c/td>\u003ctd>국민（의무자）\u003c/td>\u003ctd>재판 없이 스스로 강제집행\u003c/td>\u003ctd>\u003cstrong>별도의 개별 법률 필요\u003c/strong>（행정대집행법 등）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>위법한 행정처분과 국가배상\u003c/td>\u003ctd>最判昭36.4.21\u003c/td>\u003ctd>위법한 행정처분을 이유로 국가배상을 청구하면서 미리 취소·무효확인 판결을 받지 않은 사안\u003c/td>\u003ctd>\u003cstrong>「행정처분이 위법함을 이유로 국가배상을 청구함에 있어 미리 그 행정처분에 대한 취소 또는 무효확인의 판결을 얻어야 하는 것은 아니다」\u003c/strong>. 금전 급부를 목적으로 하는 처분이어서 배상 인용이 취소와 경제적으로 같은 결과가 되더라도 마찬가지\u003c/td>\u003c/tr>\u003ctr>\u003ctd>冷凍倉庫事件（냉동창고 사건）\u003c/td>\u003ctd>最判平22.6.3 / 民集64巻4号1010頁\u003c/td>\u003ctd>고정자산(냉동창고)의 가격을 과대하게 결정하여 고정자산세를 과다 부과한 사안\u003c/td>\u003ctd>공무원이 납세자에 대한 직무상 법적 의무를 위반한 이상, \u003cstrong>지방세법상의 심사신청·취소소송 절차를 거치지 않아도\u003c/strong> 국가배상청구가 가능\u003c/td>\u003c/tr>\u003ctr>\u003ctd>余目町個室付浴場事件（아마루메초 개실부욕장 사건）\u003c/td>\u003ctd>最判昭53.6.16 / 刑集32巻4号605頁\u003c/td>\u003ctd>개실부욕장업(터키탕) 영업을 저지할 목적으로 인근에 아동유원(児童遊園) 설치인가를 낸 뒤, 거리제한 위반으로 업자를 형사기소한 사안\u003c/td>\u003ctd>\u003cstrong>무죄\u003c/strong>. 오로지 욕장업 규제를 주된 동기·목적으로 한 아동유원 설치인가는 \u003cstrong>행정권의 남용\u003c/strong>으로서 위법하고 욕장업을 규제할 효력이 없다（형사법원이 처분의 위법성을 스스로 판단한 예）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「국가배상을 받으려면 먼저 취소소송에서 이겨야 한다」는 지문은 오답.\u003c/strong> 最判昭36.4.21 ＋ 最判平22.6.3을 세트로 암기. 출제 빈도 최상위.\u003c/li>\u003cli>같은 「돈을 돌려받는」 소송이라도 결론이 갈린다. \u003cstrong>대비: 국가배상청구 = 취소 없이 가능 ／ 부당이득반환청구 = 취소·무효 없이는 불가\u003c/strong>（후자는 처분의 효력 자체를 부정해야 하므로 공정력이 미침）.\u003c/li>\u003cli>「공정력이란 행정행위의 \u003cstrong>적법성이 추정\u003c/strong>되는 효력이다」 → \u003cstrong>오답\u003c/strong>. 적법성 추정설은 현재 부정되고, 근거는 취소소송의 배타적 관할.\u003c/li>\u003cli>\u003cstrong>무효인 행정행위에는 공정력이 없다.\u003c/strong> 「모든 행정행위에 공정력이 인정된다」는 지문도 오답.\u003c/li>\u003cli>공정력·\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a>은 \u003cstrong>명문 규정이 없고\u003c/strong>, \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>은 행소법 14조·행심법 18조, \u003ca href=\"#/e/%E8%87%AA%E5%8A%9B%E5%9F%B7%E8%A1%8C%E5%8A%9B\">自力執行力\u003c/a>은 행정대집행법이라는 \u003cstrong>명문이 있다\u003c/strong>. 근거의 유무로 4효력을 갈라 암기.\u003c/li>\u003c/ul>","search":"公定力 こうていりょく 항목 내용 ------ ------ 읽기 こうていりょく（공정력） 과목 행정법（행정행위） 한줄 정의 행정행위에 위법한 하자가 있어도 무효가 아닌 한, 권한 있는 기관이 취소할 때까지는 유효한 것으로 통용되는 효력 통설·판례 근거는 취소소송의 배타적 관할 取消訴訟の排他的管轄 — 「적법성의 추정」이 아니라, 취소쟁송 제도를 둔 실정법 구조의 반사적 효과 개념 행정행위는 성립에 하자가 있어 위법하더라도, 그 하자가 중대하고 명백하여 무효가 되지 않는 한 → 重大明白説 용어/重大明白説.md 일단 유효한 것으로 취급된다. 상대방인 국민은 물론 제3자·다른 행정청· 취소소송 이외의 소송을 다루는 법원까지도 그 효력을 부정할 수 없다. 예컨대 위법한 과세처분을 받았더라도 그 처분이 취소되기 전까지는 납세의무가 존속하고 그에 따른 체납처분도 유효하다. 과거에는 「행정행위에는 적법성의 추정 適法性の推定 이 있다」고 설명했으나 오늘날 이 설명은 부정된다. 통설은 공정력의 근거를 취소소송의 배타적 관할 에서 찾는다. 행정사건소송법이 「처분의 취소의 소」 3조 2항 라는 특별한 쟁송 유형을 마련하고 출소기간 14조 까지 둔 이상, 처분의 효력을 깨뜨리려면 반드시 취소쟁송에 의해야 한다는 구조가 되며, 공정력은 그 반사적 효과 에 지나지 않는다는 것이다. 즉 공정력은 「적법하다」는 실체적 판단이 아니라 「일단 통용시킨다」는 절차적 힘이다. 그래서 공정력에는 명문의 근거 조문이 없다 . 공정력이 미치지 않는 범위가 시험의 핵심이다. ① 무효인 행정행위 에는 애초에 공정력이 없다 — 누구든 언제든 무효를 주장할 수 있고, 무효등확인의 소 행정사건소송법 3조 4항·36조 에는 출소기간 제한이 없다. ② 국가배상청구 에는 공정력이 미치지 않는다 — 미리 취소판결이나 무효확인판결을 받지 않아도 국가배상법 1조 1항에 의한 배상청구가 가능하다 最判昭36.4.21, 最判平22.6.3 . ③ 형사사건에서 처분의 위법성이 선결문제가 되는 경우에도 법원이 스스로 판단할 수 있다 最判昭53.6.16 . 이 구분의 열쇠는 선결문제 先決問題 다. 민사·형사소송에서 「처분의 효력의 유무 」를 부정하지 않으면 결론이 나오지 않는 경우 예: 과세처분이 취소되지 않은 상태에서 납부한 세금의 부당이득반환청구 에는 공정력이 미쳐 법원이 그 효력을 부정할 수 없다. 반면 「처분의 위법성 자체」만 확인하면 되고 처분의 효력에는 손대지 않는 경우 국가배상청구 에는 공정력이 미치지 않는다. 👉 대비: 「효력의 부정」이 필요 = 공정력 o ／ 「위법성의 확인」만으로 족함 = 공정력 x 행정행위의 4가지 효력 비교 효력 제약받는 쪽 내용 근거 ------ ----------- ------ ------ 公定力 국민·제3자·다른 행정청·법원 위법해도 취소될 때까지 유효 명문 없음 / 취소소송의 배타적 관할 不可争力 용어/不可争力.md 국민 쟁송기간 경과 후 다툴 수 없음 행정사건소송법 14조, 행정불복심사법 18조 不可変更力 용어/不可変更力.md 행정청 자신 재결 등을 스스로 취소·변경할 수 없음 명문 없음 / 판례 最判昭29.1.21 自力執行力 용어/自力執行力.md 국민（의무자） 재판 없이 스스로 강제집행 별도의 개별 법률 필요 （행정대집행법 등） 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 위법한 행정처분과 국가배상 最判昭36.4.21 위법한 행정처분을 이유로 국가배상을 청구하면서 미리 취소·무효확인 판결을 받지 않은 사안 「행정처분이 위법함을 이유로 국가배상을 청구함에 있어 미리 그 행정처분에 대한 취소 또는 무효확인의 판결을 얻어야 하는 것은 아니다」 . 금전 급부를 목적으로 하는 처분이어서 배상 인용이 취소와 경제적으로 같은 결과가 되더라도 마찬가지 冷凍倉庫事件（냉동창고 사건） 最判平22.6.3 / 民集64巻4号1010頁 고정자산 냉동창고 의 가격을 과대하게 결정하여 고정자산세를 과다 부과한 사안 공무원이 납세자에 대한 직무상 법적 의무를 위반한 이상, 지방세법상의 심사신청·취소소송 절차를 거치지 않아도 국가배상청구가 가능 余目町個室付浴場事件（아마루메초 개실부욕장 사건） 最判昭53.6.16 / 刑集32巻4号605頁 개실부욕장업 터키탕 영업을 저지할 목적으로 인근에 아동유원 児童遊園 설치인가를 낸 뒤, 거리제한 위반으로 업자를 형사기소한 사안 무죄 . 오로지 욕장업 규제를 주된 동기·목적으로 한 아동유원 설치인가는 행정권의 남용 으로서 위법하고 욕장업을 규제할 효력이 없다（형사법원이 처분의 위법성을 스스로 판단한 예） 💡 수험 팁 - 「국가배상을 받으려면 먼저 취소소송에서 이겨야 한다」는 지문은 오답. 最判昭36.4.21 ＋ 最判平22.6.3을 세트로 암기. 출제 빈도 최상위. - 같은 「돈을 돌려받는」 소송이라도 결론이 갈린다. 대비: 국가배상청구 = 취소 없이 가능 ／ 부당이득반환청구 = 취소·무효 없이는 불가 （후자는 처분의 효력 자체를 부정해야 하므로 공정력이 미침）. - 「공정력이란 행정행위의 적법성이 추정 되는 효력이다」 → 오답 . 적법성 추정설은 현재 부정되고, 근거는 취소소송의 배타적 관할. - 무효인 행정행위에는 공정력이 없다. 「모든 행정행위에 공정력이 인정된다」는 지문도 오답. - 공정력· 不可変更力 용어/不可変更力.md 은 명문 규정이 없고 , 不可争力 용어/不可争力.md 은 행소법 14조·행심법 18조, 自力執行力 용어/自力執行力.md 은 행정대집행법이라는 명문이 있다 . 근거의 유무로 4효력을 갈라 암기."},"不可争力":{"type":"term","subject":"용어","id":"不可争力","title":"不可争力","sub":"ふかそうりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ふかそうりょく（불가쟁력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>쟁송기간이 지나면 \u003cstrong>국민 측이\u003c/strong> 더 이상 행정행위의 효력을 다툴 수 없게 되는 효력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>행정법관계의 조기 안정을 위한 것. \u003cstrong>형식적 확정력(形式的確定力)\u003c/strong>이라고도 하며, \u003cstrong>행정청 자신의 직권취소까지 막지는 못한다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정행위가 있은 뒤 일정 기간이 지나면 국민은 심사청구나 취소소송으로 그 효력을 다툴 수 없게 된다. 이를 불가쟁력, 또는 \u003cstrong>형식적 확정력(形式的確定力)\u003c/strong>이라 한다. 취지는 행정법관계를 언제까지나 불안정하게 둘 수 없다는 \u003cstrong>법적 안정성\u003c/strong>의 요청이다.\u003c/p>\n\u003cp>기간은 두 갈래로 규정되어 있다. \u003cstrong>취소소송\u003c/strong>은 처분 또는 재결이 있었음을 안 날부터 \u003cstrong>6개월\u003c/strong>, 처분 또는 재결의 날부터 \u003cstrong>1년\u003c/strong>을 경과하면 제기할 수 없다(행정사건소송법 14조 1항·2항). \u003cstrong>심사청구\u003c/strong>는 처분이 있었음을 안 날의 다음날부터 기산하여 \u003cstrong>3개월\u003c/strong>, 처분이 있은 날의 다음날부터 기산하여 \u003cstrong>1년\u003c/strong>을 경과하면 할 수 없다(행정불복심사법 18조 1항·2항). 어느 쪽이든 \u003cstrong>「정당한 이유가 있는 때(正当な理由があるとき)」는 예외\u003c/strong>로, 기간이 지난 뒤에도 다툴 수 있다.\u003c/p>\n\u003cp>핵심 함정은 \u003cstrong>주체\u003c/strong>에 있다. \u003cstrong>불가쟁력은 국민 측만 구속한다.\u003c/strong> 기간이 지나 국민이 다툴 수 없게 된 뒤에도 \u003cstrong>처분청은 여전히 직권취소(職権取消)나 철회(撤回)를 할 수 있다.\u003c/strong> 불가쟁력은 「그 행정행위가 적법한 것으로 확정되었다」는 뜻이 아니라 「국민의 쟁송 통로가 닫혔다」는 뜻일 뿐이기 때문이다. 이 주체 관계를 정반대로 뒤집어 놓은 것이 \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a>（행정청 자신이 묶이는 효력）이다.\u003c/p>\n\u003cp>또한 \u003cstrong>무효인 행정행위에는 불가쟁력이 생기지 않는다.\u003c/strong> 무효등확인의 소(행정사건소송법 3조 4항·36조)에는 출소기간의 제한이 없고, 무효인 처분은 언제든 누구에 대해서든 무효를 주장할 수 있다. 그래서 제소기간을 놓친 국민이 마지막으로 기대는 논리가 「하자가 중대·명백하여 무효」라는 주장이다(→\u003ca href=\"#/e/%E9%87%8D%E5%A4%A7%E6%98%8E%E7%99%BD%E8%AA%AC\">重大明白説\u003c/a>). 나아가 불가쟁력이 생긴 뒤에도 \u003cstrong>국가배상청구는 별도로 가능\u003c/strong>하다(→\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>, 最判平22.6.3). 다만 국가배상청구권 자체의 소멸시효(국가배상법 4조에 의해 준용되는 민법의 시효)는 별개 문제다.\u003c/p>\n\u003cp>예외적으로, 선행처분에 불가쟁력이 생겼더라도 \u003cstrong>후행처분의 취소소송에서 선행처분의 위법을 주장할 수 있는 경우\u003c/strong>가 있다. 이것이 \u003cstrong>위법성의 승계(違法性の承継)\u003c/strong> 문제로, 판례는 선행처분을 다툴 절차적 보장이 충분하지 않았던 경우에 승계를 인정한다(最判平21.12.17).\u003c/p>\n\u003ch2>행정행위의 4가지 효력 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>효력\u003c/th>\u003cth>제약받는 쪽\u003c/th>\u003cth>내용\u003c/th>\u003cth>근거\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>\u003c/td>\u003ctd>국민·제3자·다른 행정청·법원\u003c/td>\u003ctd>위법해도 취소될 때까지 유효\u003c/td>\u003ctd>명문 없음 / 취소소송의 배타적 관할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>不可争力\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>국민\u003c/strong>\u003c/td>\u003ctd>쟁송기간 경과 후 다툴 수 없음\u003c/td>\u003ctd>행정사건소송법 14조, 행정불복심사법 18조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>행정청 자신\u003c/strong>\u003c/td>\u003ctd>재결 등을 스스로 취소·변경할 수 없음\u003c/td>\u003ctd>명문 없음 / 판례(最判昭29.1.21)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E8%87%AA%E5%8A%9B%E5%9F%B7%E8%A1%8C%E5%8A%9B\">自力執行力\u003c/a>\u003c/td>\u003ctd>국민（의무자）\u003c/td>\u003ctd>재판 없이 스스로 강제집행\u003c/td>\u003ctd>\u003cstrong>별도의 개별 법률 필요\u003c/strong>（행정대집행법 등）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>쟁송기간 정리\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>근거\u003c/th>\u003cth>주관적 기간（안 날 기준）\u003c/th>\u003cth>객관적 기간（처분일 기준）\u003c/th>\u003c/tr>\u003ctr>\u003ctd>취소소송\u003c/td>\u003ctd>행정사건소송법 14조\u003c/td>\u003ctd>처분·재결이 있었음을 \u003cstrong>안 날부터 6개월\u003c/strong>\u003c/td>\u003ctd>처분·재결의 \u003cstrong>날부터 1년\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>심사청구\u003c/td>\u003ctd>행정불복심사법 18조\u003c/td>\u003ctd>처분이 있었음을 안 날의 \u003cstrong>다음날부터 3개월\u003c/strong>\u003c/td>\u003ctd>처분이 있은 날의 \u003cstrong>다음날부터 1년\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무효등확인의 소\u003c/td>\u003ctd>행정사건소송법 3조 4항·36조\u003c/td>\u003ctd>\u003cstrong>제한 없음\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>제한 없음\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>冷凍倉庫事件（냉동창고 사건）\u003c/td>\u003ctd>最判平22.6.3 / 民集64巻4号1010頁\u003c/td>\u003ctd>고정자산세가 과대 부과되었으나 지방세법상의 심사신청·취소소송 절차를 거치지 않은 채 국가배상을 청구한 사안\u003c/td>\u003ctd>쟁송절차를 거치지 않았더라도 공무원이 직무상 법적 의무를 위반한 이상 \u003cstrong>국가배상청구는 가능\u003c/strong>（불가쟁력·\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>은 국가배상을 막지 못함）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>安全認定と建築確認（안전인정과 건축확인）\u003c/td>\u003ctd>最判平21.12.17 / 民集63巻10号2631頁\u003c/td>\u003ctd>도쿄도 건축안전조례상의 안전인정을 받은 뒤 건축확인이 내려졌고, 인근 주민이 건축확인 취소소송에서 선행하는 안전인정의 위법을 주장한 사안\u003c/td>\u003ctd>\u003cstrong>안전인정이 취소되지 않았더라도 건축확인 취소소송에서 그 위법을 주장할 수 있다\u003c/strong>. 안전인정은 신청자 외에게 통지할 필요가 없어 인근 주민이 그 존재를 곧바로 알기 어려운 반면 건축확인은 현장에 표시되므로, 안전인정을 다툴 절차적 보장이 충분하다고 하기 어렵다（\u003cstrong>위법성의 승계 긍정\u003c/strong>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최대 함정: 「불가쟁력이 생기면 행정청도 직권취소를 할 수 없다」 → 오답.\u003c/strong> 불가쟁력은 \u003cstrong>국민만\u003c/strong> 묶는다. 행정청의 직권취소·철회는 여전히 가능.\u003c/li>\u003cli>\u003cstrong>대비: 不可争力 = 국민이 못 다툼 ／ \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a> = 행정청이 못 바꿈.\u003c/strong> 이름이 비슷해 바꿔치기 지문이 자주 나온다. 「누가 묶이는가」로 즉시 구별.\u003c/li>\u003cli>숫자 암기: \u003cstrong>취소소송 6개월/1년（행소법 14조）, 심사청구 3개월/1년（행심법 18조）.\u003c/strong> 심사청구만 「\u003cstrong>다음날부터 기산\u003c/strong>」인 점, 양쪽 모두 \u003cstrong>「정당한 이유」 예외\u003c/strong>가 있는 점까지 세트로.\u003c/li>\u003cli>\u003cstrong>무효인 처분에는 불가쟁력이 생기지 않는다\u003c/strong>（무효등확인의 소는 출소기간 무제한）. 「불가쟁력이 생기면 무효 주장도 못 한다」는 지문은 오답.\u003c/li>\u003cli>불가쟁력은 \u003cstrong>실체적 확정력(기판력)이 아니다.\u003c/strong> 「위법한 처분이 불가쟁력에 의해 적법하게 된다」는 지문은 오답 — 위법성은 그대로 남으므로 국가배상은 별도로 가능.\u003c/li>\u003c/ul>","search":"不可争力 ふかそうりょく 항목 내용 ------ ------ 읽기 ふかそうりょく（불가쟁력） 과목 행정법（행정행위） 한줄 정의 쟁송기간이 지나면 국민 측이 더 이상 행정행위의 효력을 다툴 수 없게 되는 효력 통설·판례 행정법관계의 조기 안정을 위한 것. 형식적 확정력 形式的確定力 이라고도 하며, 행정청 자신의 직권취소까지 막지는 못한다 개념 행정행위가 있은 뒤 일정 기간이 지나면 국민은 심사청구나 취소소송으로 그 효력을 다툴 수 없게 된다. 이를 불가쟁력, 또는 형식적 확정력 形式的確定力 이라 한다. 취지는 행정법관계를 언제까지나 불안정하게 둘 수 없다는 법적 안정성 의 요청이다. 기간은 두 갈래로 규정되어 있다. 취소소송 은 처분 또는 재결이 있었음을 안 날부터 6개월 , 처분 또는 재결의 날부터 1년 을 경과하면 제기할 수 없다 행정사건소송법 14조 1항·2항 . 심사청구 는 처분이 있었음을 안 날의 다음날부터 기산하여 3개월 , 처분이 있은 날의 다음날부터 기산하여 1년 을 경과하면 할 수 없다 행정불복심사법 18조 1항·2항 . 어느 쪽이든 「정당한 이유가 있는 때 正当な理由があるとき 」는 예외 로, 기간이 지난 뒤에도 다툴 수 있다. 핵심 함정은 주체 에 있다. 불가쟁력은 국민 측만 구속한다. 기간이 지나 국민이 다툴 수 없게 된 뒤에도 처분청은 여전히 직권취소 職権取消 나 철회 撤回 를 할 수 있다. 불가쟁력은 「그 행정행위가 적법한 것으로 확정되었다」는 뜻이 아니라 「국민의 쟁송 통로가 닫혔다」는 뜻일 뿐이기 때문이다. 이 주체 관계를 정반대로 뒤집어 놓은 것이 不可変更力 용어/不可変更力.md （행정청 자신이 묶이는 효력）이다. 또한 무효인 행정행위에는 불가쟁력이 생기지 않는다. 무효등확인의 소 행정사건소송법 3조 4항·36조 에는 출소기간의 제한이 없고, 무효인 처분은 언제든 누구에 대해서든 무효를 주장할 수 있다. 그래서 제소기간을 놓친 국민이 마지막으로 기대는 논리가 「하자가 중대·명백하여 무효」라는 주장이다 → 重大明白説 용어/重大明白説.md . 나아가 불가쟁력이 생긴 뒤에도 국가배상청구는 별도로 가능 하다 → 公定力 용어/公定力.md , 最判平22.6.3 . 다만 국가배상청구권 자체의 소멸시효 국가배상법 4조에 의해 준용되는 민법의 시효 는 별개 문제다. 예외적으로, 선행처분에 불가쟁력이 생겼더라도 후행처분의 취소소송에서 선행처분의 위법을 주장할 수 있는 경우 가 있다. 이것이 위법성의 승계 違法性の承継 문제로, 판례는 선행처분을 다툴 절차적 보장이 충분하지 않았던 경우에 승계를 인정한다 最判平21.12.17 . 행정행위의 4가지 효력 비교 효력 제약받는 이를 직권으로 취소·변경할 수 없게 되는 효력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>명문 규정은 없고 \u003cstrong>판례·학설상 인정\u003c/strong>되는 효력. 재결·결정 등 \u003cstrong>쟁송재단행위(争訟裁断行為)\u003c/strong>에만 인정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정행위는 원칙적으로 처분청이 직권으로 취소하거나 변경할 수 있다. 위법·부당한 행위를 스스로 바로잡는 것은 오히려 법률에 의한 행정의 요청에 부합하기 때문이다. 그러나 \u003cstrong>심판적(재판 유사) 절차를 거쳐 분쟁을 재단한 행위\u003c/strong>에 대해서까지 행정청이 마음대로 결론을 뒤집을 수 있다면 쟁송제도 자체가 무의미해진다. 그래서 이런 행위에는 예외적으로 행정청 자신을 구속하는 효력이 인정되는데, 이것이 불가변경력이다. \u003cstrong>실질적 확정력(実質的確定力)\u003c/strong>이라고도 부른다.\u003c/p>\n\u003cp>인정 범위는 좁다. 행정불복심사법상의 \u003cstrong>재결(裁決)·결정(決定)\u003c/strong> 처럼, 당사자의 신청을 받아 심리 절차를 거쳐 다툼을 재단하는 \u003cstrong>쟁송재단행위\u003c/strong>에 한정된다. 일반적인 허가·인가·과세처분 등 통상의 행정행위에는 불가변경력이 생기지 않으므로, 처분청은 언제든 직권취소·철회를 할 수 있다. 판례도 농지매수계획을 취소한 소원재결에 대해, 그 재결은 \u003cstrong>법률상의 쟁송을 재판하는 판결과 마찬가지의 효력\u003c/strong>을 가지므로 특별한 규정이 없는 한 재결청이 스스로 이를 취소할 수 없다고 하였다(最判昭29.1.21).\u003c/p>\n\u003cp>다만 불가변경력에 \u003cstrong>반하여 이루어진 취소·변경이 곧바로 무효가 되는 것은 아니다.\u003c/strong> 그 취소처분은 위법하지만, 하자가 중대하고 명백하지 않으면 \u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>에 의해 일단 유효하게 통용되며 취소되기까지는 효력을 유지한다(最判昭30.12.26). 👉 \u003cstrong>대비: 「위법」과 「무효」는 다르다\u003c/strong>(→\u003ca href=\"#/e/%E9%87%8D%E5%A4%A7%E6%98%8E%E7%99%BD%E8%AA%AC\">重大明白説\u003c/a>).\u003c/p>\n\u003cp>시험에서 가장 중요한 것은 \u003cstrong>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>과 주체가 정반대\u003c/strong>라는 점이다. 불가쟁력은 쟁송기간 경과로 \u003cstrong>국민\u003c/strong>이 다툴 수 없게 되는 효력이고, 불가변경력은 \u003cstrong>행정청 자신\u003c/strong>이 뒤집을 수 없게 되는 효력이다. 또한 발생 계기도 다르다 — 불가쟁력은 \u003cstrong>기간의 경과\u003c/strong>로 생기지만, 불가변경력은 \u003cstrong>행위의 성질(쟁송재단성)\u003c/strong>에서 곧바로 생기며 기간과는 무관하다.\u003c/p>\n\u003ch2>행정행위의 4가지 효력 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>효력\u003c/th>\u003cth>제약받는 쪽\u003c/th>\u003cth>내용\u003c/th>\u003cth>근거\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>\u003c/td>\u003ctd>국민·제3자·다른 행정청·법원\u003c/td>\u003ctd>위법해도 취소될 때까지 유효\u003c/td>\u003ctd>명문 없음 / 취소소송의 배타적 관할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>국민\u003c/strong>\u003c/td>\u003ctd>쟁송기간 경과 후 다툴 수 없음\u003c/td>\u003ctd>행정사건소송법 14조, 행정불복심사법 18조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>不可変更力\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>행정청 자신\u003c/strong>\u003c/td>\u003ctd>재결 등을 스스로 취소·변경할 수 없음\u003c/td>\u003ctd>명문 없음 / 판례(最判昭29.1.21)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E8%87%AA%E5%8A%9B%E5%9F%B7%E8%A1%8C%E5%8A%9B\">自力執行力\u003c/a>\u003c/td>\u003ctd>국민（의무자）\u003c/td>\u003ctd>재판 없이 스스로 강제집행\u003c/td>\u003ctd>\u003cstrong>별도의 개별 법률 필요\u003c/strong>（행정대집행법 등）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>不可争力 ↔ 不可変更力 대비표\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>비교 항목\u003c/th>\u003cth>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>\u003c/th>\u003cth>\u003cstrong>不可変更力\u003c/strong>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>묶이는 주체\u003c/td>\u003ctd>\u003cstrong>국민(사인)\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>행정청 자신\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>발생 원인\u003c/td>\u003ctd>쟁송기간의 \u003cstrong>경과\u003c/strong>\u003c/td>\u003ctd>행위의 \u003cstrong>성질\u003c/strong>（쟁송재단행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>인정 범위\u003c/td>\u003ctd>원칙적으로 \u003cstrong>모든\u003c/strong> 행정행위\u003c/td>\u003ctd>\u003cstrong>재결·결정 등 일부\u003c/strong>에만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근거\u003c/td>\u003ctd>행정사건소송법 14조, 행정불복심사법 18조（\u003cstrong>명문 있음\u003c/strong>）\u003c/td>\u003ctd>명문 없음（판례·학설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>별칭\u003c/td>\u003ctd>형식적 확정력\u003c/td>\u003ctd>실질적 확정력\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>재결청에 의한 재결의 직권취소\u003c/td>\u003ctd>最判昭29.1.21\u003c/td>\u003ctd>농지매수계획을 취소한 소원재결을, 재결청이 나중에 스스로 취소한 사안\u003c/td>\u003ctd>그 재결은 \u003cstrong>법률상의 쟁송을 재판하는 것과 같은 성질\u003c/strong>을 가지므로 \u003cstrong>불가변경력\u003c/strong>이 있고, 특별한 규정이 없는 한 \u003cstrong>재결청 스스로 이를 취소할 수 없다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>불가변경력에 반하는 취소재결의 효력\u003c/td>\u003ctd>最判昭30.12.26\u003c/td>\u003ctd>농지 관련 소원에서 기각재결을 한 재결청이 이를 스스로 취소하고 인용재결로 변경한 사안\u003c/td>\u003ctd>재결청이 자신의 재결을 취소한 것은 \u003cstrong>위법\u003c/strong>이지만, \u003cstrong>중대·명백한 하자가 없는 이상 그 취소재결 자체는 유효\u003c/strong>（위법 ≠ 당연무효）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최대 함정: 「불가변경력은 국민이 다툴 수 없게 되는 효력이다」 → 오답.\u003c/strong> 그것은 \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>이다. \u003cstrong>不可変更力 = 행정청이 못 바꿈\u003c/strong>으로 주체를 고정 암기.\u003c/li>\u003cli>\u003cstrong>모든 행정행위에 불가변경력이 있다는 지문은 오답.\u003c/strong> 심판적 절차로 분쟁을 재단한 행위(재결·결정)에만 인정된다. 일반 허가·과세처분은 처분청이 직권취소 가능.\u003c/li>\u003cli>\u003cstrong>기간과 무관하다.\u003c/strong> 「일정 기간이 지나면 행정청도 변경할 수 없게 된다」는 서술은 불가변경력의 설명이 아니다.\u003c/li>\u003cli>불가변경력에 반하는 취소·변경은 \u003cstrong>「위법하지만 유효」\u003c/strong>（最判昭30.12.26）. 위법과 무효를 구별하는 \u003ca href=\"#/e/%E9%87%8D%E5%A4%A7%E6%98%8E%E7%99%BD%E8%AA%AC\">重大明白説\u003c/a>과 연결해 출제된다.\u003c/li>\u003cli>별칭 대비: \u003cstrong>형식적 확정력 = 不可争力 ／ 실질적 확정력 = 不可変更力.\u003c/strong> 다만 판결의 기판력과 완전히 같지는 않아, 불가변경력이 있어도 \u003cstrong>국민이 그 재결을 취소소송으로 다투는 것은 별도로 가능\u003c/strong>하다.\u003c/li>\u003c/ul>","search":"不可変更力 ふかへんこうりょく 항목 내용 ------ ------ 읽기 ふかへんこうりょく（불가변경력） 과목 행정법（행정행위） 한줄 정의 분쟁을 재단하는 성질의 행정행위에 대해, 처분을 한 행정청 자신이 이를 직권으로 취소·변경할 수 없게 되는 효력 통설·판례 명문 규정은 없고 판례·학설상 인정 되는 효력. 재결·결정 등 쟁송재단행위 争訟裁断行為 에만 인정 개념 행정행위는 원칙적으로 처분청이 직권으로 취소하거나 변경할 수 있다. 위법·부당한 행위를 스스로 바로잡는 것은 오히려 법률에 의한 행정의 요청에 부합하기 때문이다. 그러나 심판적 재판 유사 절차를 거쳐 분쟁을 재단한 행위 에 대해서까지 행정청이 마음대로 결론을 뒤집을 수 있다면 쟁송제도 자체가 무의미해진다. 그래서 이런 행위에는 예외적으로 행정청 자신을 구속하는 효력이 인정되는데, 이것이 불가변경력이다. 실질적 확정력 実質的確定力 이라고도 부른다. 인정 범위는 좁다. 행정불복심사법상의 재결 裁決 ·결정 決定 처럼, 당사자의 신청을 받아 심리 절차를 거쳐 다툼을 재단하는 쟁송재단행위 에 한정된다. 일반적인 허가·인가·과세처분 등 통상의 행정행위에는 불가변경력이 생기지 않으므로, 처분청은 언제든 직권취소·철회를 할 수 있다. 판례도 농지매수계획을 취소한 소원재결에 대해, 그 재결은 법률상의 쟁송을 재판하는 판결과 마찬가지의 효력 을 가지므로 특별한 규정이 없는 한 재결청이 스스로 이를 취소할 수 없다고 하였다 最判昭29.1.21 . 다만 불가변경력에 반하여 이루어진 취소·변경이 곧바로 무효가 되는 것은 아니다. 그 취소처분은 위법하지만, 하자가 중대하고 명백하지 않으면 公定力 용어/公定力.md 에 의해 일단 유효하게 통용되며 취소되기까지는 효력을 유지한다 最判昭30.12.26 . 👉 대비: 「위법」과 「무효」는 다르다 → 重大明白説 용어/重大明白説.md . 시험에서 가장 중요한 것은 不可争力 용어/不可争力.md 과 주체가 정반대 라는 점이다. 불가쟁력은 쟁송기간 경과로 국민 이 다툴 수 없게 되는 효력이고, 불가변경력은 행정청 자신 이 뒤집을 수 없게 되는 효력이다. 또한 발생 계기도 다르다 — 불가쟁력은 기간의 경과 로 생기지만, 불가변경력은 행위의 성질 쟁송재단성 에서 곧바로 생기며 기간과는 무관하다. 행정행위의 4가지 효력 비교 효력 제약받는 쪽 내용 근거 ------ ----------- ------ ------ 公定力 용어/公定力.md 국민·제3자·다른 행정청·법원 위법해도 취소될 때까지 유효 명문 없음 / 취소소송의 배타적 관할 不可争力 용어/不可争力.md 국민 쟁송기간 경과 후 다툴 수 없음 행정사건소송법 14조, 행정불복심사법 18조 不可変更力 행정청 자신 재결 등을 스스로 취소·변경할 수 없음 명문 없음 / 판례 最判昭29.1.21 自力執行力 용어/自力執行力.md 국민（의무자） 재판 없이 스스로 강제집행 별도의 개별 법률 필요 （행정대집행법 등） 不可争力 ↔ 不可変更力 대비표 비교 항목 不可争力 용어/不可争力.md 不可変更力 ----------- --------------------------- ---------------- 묶이는 주체 국민 사인 행정청 자신 발생 원인 쟁송기간의 경과 행위의 성질 （쟁송재단행위） 인정 범위 원칙적으로 모든 행정행위 재결·결정 등 일부 에만 근거 행정사건소송법 14조, 행정불복심사법 18조（ 명문 있음 ） 명문 없음（판례·학설） 별칭 형식적 확정력 실질적 확정력 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 재결청에 의한 재결의 직권취소 最判昭29.1.21 농지매수계획을 취소한 소원재결을, 재결청이 나중에 스스로 취소한 사안 그 재결은 법률상의 쟁송을 재판하는 것과 같은 성질 을 가지므로 불가변경력 이 있고, 특별한 규정이 없는 한 재결청 스스로 이를 취소할 수 없다 불가변경력에 반하는 취소재결의 효력 最判昭30.12.26 농지 관련 소원에서 기각재결을 한 재결청이 이를 스스로 취소하고 인용재결로 변경한 사안 재결청이 자신의 재결을 취소한 것은 위법 이지만, 중대·명백한 하자가 없는 이상 그 취소재결 자체는 유효 （위법 ≠ 당연무효） 💡 수험 팁 - 최대 함정: 「불가변경력은 국민이 다툴 수 없게 되는 효력이다」 → 오답. 그것은 不可争力 용어/不可争力.md 이다. 不可変更力 = 행정청이 못 바꿈 으로 주체를 고정 암기. - 모든 행정행위에 불가변경력이 있다는 지문은 오답. 심판적 절차로 분쟁을 재단한 행위 재결·결정 에만 인정된다. 일반 허가·과세처분은 처분청이 직권취소 가능. - 기간과 무관하다. 「일정 기간이 지나면 행정청도 변경할 수 없게 된다」는 서술은 불가변경력의 설명이 아니다. - 불가변경력에 반하는 취소·변경은 「위법하지만 유효」 （最判昭30.12.26）. 위법과 무효를 구별하는 重大明白説 용어/重大明白説.md 과 연결해 출제된다. - 별칭 대비: 형식적 확정력 = 不可争力 ／ 실질적 확정력 = 不可変更力. 다만 판결의 기판력과 완전히 같지는 않아, 불가변경력이 있어도 국민이 그 재결을 취소소송으로 다투는 것은 별도로 가능 하다."},"自力執行力":{"type":"term","subject":"용어","id":"自力執行力","title":"自力執行力","sub":"じりきしっこうりょく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>じりきしっこうりょく（자력집행력）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>의무자가 행정행위로 부과된 의무를 이행하지 않을 때, 행정청이 \u003cstrong>법원의 판결을 받지 않고\u003c/strong> 스스로 강제적으로 그 의무 내용을 실현할 수 있는 효력\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>행정행위의 근거법만으로는 부족하고, 강제집행을 위한 별도의 법률상 근거가 필요\u003c/strong>（통설·확립된 실무）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>사인 간에는 채무자가 의무를 이행하지 않으면 채권자가 소송을 제기해 판결(채무명의)을 얻은 뒤 법원의 집행절차를 밟아야 한다(\u003cstrong>자력구제 금지\u003c/strong>). 그러나 행정에는 예외적으로, 스스로 의무 이행을 강제 실현할 수 있는 권능이 인정되는 경우가 있다. 이것이 자력집행력(집행력)이다.\u003c/p>\n\u003cp>여기서 \u003cstrong>가장 중요한 함정\u003c/strong>은 근거 문제다. 자력집행력은 행정행위의 성질에서 당연히 나오는 것이 아니다. \u003cstrong>의무를 부과하는 행정행위의 근거법이 있다는 것만으로는 강제집행을 할 수 없고, 강제집행에 관한 별도의 법률상 근거가 반드시 필요\u003c/strong>하다. 의무의 부과와 의무의 강제는 별개의 침해이기 때문이다. 이 일반법이 바로 \u003cstrong>행정대집행법\u003c/strong>이며, 동법 1조는 「행정상의 의무 이행 확보에 관하여는 \u003cstrong>따로 법률로 정하는 것을 제외하고는 이 법률이 정하는 바에 의한다\u003c/strong>」고 하여, 강제집행에는 법률의 근거가 필요함을 전제로 하고 있다. 또한 대집행의 근거가 되는 의무는 \u003cstrong>「법률(법률의 위임에 따른 명령·규칙 및 조례를 포함한다)」\u003c/strong>에 의해 명해진 것이어야 한다(행정대집행법 2조 괄호).\u003c/p>\n\u003cp>행정상 강제집행의 수단은 네 가지로 나뉜다. ① \u003cstrong>대집행(代執行)\u003c/strong> — 대체적 작위의무에 대해 행정청이 스스로 하거나 제3자에게 시키고 그 비용을 의무자로부터 징수(행정대집행법 2조). ② \u003cstrong>집행벌(執行罰)\u003c/strong> — 과료를 예고해 심리적으로 압박하는 방식으로, 현행법상 \u003cstrong>사방법(砂防法) 36조\u003c/strong>가 사실상 유일한 예. ③ \u003cstrong>직접강제(直接強制)\u003c/strong> — 의무자의 신체·재산에 직접 실력을 행사하는 것으로, 개별법에 극히 예외적으로만 존재. ④ \u003cstrong>강제징수(強制徴収)\u003c/strong> — 금전채권에 대해 국세징수법의 체납처분 절차에 의함. 이 중 \u003cstrong>일반법이 있는 것은 대집행뿐\u003c/strong>이다.\u003c/p>\n\u003cp>대집행의 요건과 절차도 자주 출제된다. 요건은 ㉮ \u003cstrong>대체적 작위의무\u003c/strong>일 것(타인이 대신할 수 있는 행위에 한함), ㉯ 다른 수단으로 이행 확보가 곤란할 것(\u003cstrong>보충성\u003c/strong>), ㉰ 불이행을 방치함이 현저히 공익에 반할 것(행정대집행법 2조). 절차는 \u003cstrong>계고(戒告, 3조 1항) → 대집행영장에 의한 통지(3조 2항) → 대집행의 실행(4조) → 비용납부명령(5조)\u003c/strong> 순이며, 비용은 \u003cstrong>국세체납처분의 예에 따라 징수\u003c/strong>할 수 있다(6조 1항).\u003c/p>\n\u003cp>한편 자력집행 수단이 \u003cstrong>법정되어 있는 경우, 행정청이 그 수단을 쓰지 않고 민사소송으로 우회하는 것은 허용되지 않는다\u003c/strong>(最大判昭41.2.23). 나아가 판례는 국가·지방공공단체가 \u003cstrong>행정권의 주체로서\u003c/strong> 국민에게 행정상 의무의 이행을 구하는 소송은 애초에 「법률상의 쟁송」(재판소법 3조 1항)에 해당하지 않아 \u003cstrong>부적법(각하)\u003c/strong>하다고 하였다(宝塚市パチンコ条例事件, 最判平14.7.9). 👉 \u003cstrong>대비: 행정상 의무의 강제 = 민사소송 불가 ／ 다만 재산권의 주체로서 하는 소송은 가능\u003c/strong>\u003c/p>\n\u003ch2>행정행위의 4가지 효력 비교\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>효력\u003c/th>\u003cth>제약받는 쪽\u003c/th>\u003cth>내용\u003c/th>\u003cth>근거\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>\u003c/td>\u003ctd>국민·제3자·다른 행정청·법원\u003c/td>\u003ctd>위법해도 취소될 때까지 유효\u003c/td>\u003ctd>명문 없음 / 취소소송의 배타적 관할\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>국민\u003c/strong>\u003c/td>\u003ctd>쟁송기간 경과 후 다툴 수 없음\u003c/td>\u003ctd>행정사건소송법 14조, 행정불복심사법 18조\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E5%A4%89%E6%9B%B4%E5%8A%9B\">不可変更力\u003c/a>\u003c/td>\u003ctd>\u003cstrong>행정청 자신\u003c/strong>\u003c/td>\u003ctd>재결 등을 스스로 취소·변경할 수 없음\u003c/td>\u003ctd>명문 없음 / 판례(最判昭29.1.21)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>自力執行力\u003c/strong>\u003c/td>\u003ctd>국민（의무자）\u003c/td>\u003ctd>재판 없이 스스로 강제집행\u003c/td>\u003ctd>\u003cstrong>별도의 개별 법률 필요\u003c/strong>（행정대집행법 등）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>행정상 강제집행의 4수단\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>수단\u003c/th>\u003cth>대상 의무\u003c/th>\u003cth>근거\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>대집행\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>대체적 작위의무\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>행정대집행법 2조\u003c/strong>（일반법）\u003c/td>\u003ctd>유일하게 일반법이 존재. 시험의 중심\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>집행벌\u003c/strong>\u003c/td>\u003ctd>부작위의무·비대체적 작위의무\u003c/td>\u003ctd>사방법 36조\u003c/td>\u003ctd>현행법상 \u003cstrong>사실상 유일한 예\u003c/strong>. 반복 부과 가능, 형벌 아니므로 \u003cstrong>이중처벌 아님\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>직접강제\u003c/strong>\u003c/td>\u003ctd>모든 의무\u003c/td>\u003ctd>개별법에만 존재\u003c/td>\u003ctd>인권 침해가 커서 일반법 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>강제징수\u003c/strong>\u003c/td>\u003ctd>금전 급부 의무\u003c/td>\u003ctd>국세징수법（체납처분）\u003c/td>\u003ctd>개별법이 「국세체납처분의 예에 의한다」고 준용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>농업공제조합의 강제징수와 민사소송\u003c/td>\u003ctd>最大判昭41.2.23\u003c/td>\u003ctd>법률이 행정상 강제징수 수단을 인정하고 있는 채권에 대해, 조합이 이를 쓰지 않고 민사소송으로 청구한 사안\u003c/td>\u003ctd>조세에 준하는 \u003cstrong>간이·신속한 행정상 강제징수 수단이 부여되어 있음에도 이를 쓰지 않고 민사소송을 제기하는 것은 입법 취지에 반하여 허용되지 않는다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>宝塚市パチンコ条例事件（다카라즈카시 파친코 조례 사건）\u003c/td>\u003ctd>最判平14.7.9\u003c/td>\u003ctd>시장이 조례에 근거한 공사중지명령을 어긴 업자를 상대로, 공사 속행 금지를 구하는 \u003cstrong>민사소송\u003c/strong>을 제기한 사안\u003c/td>\u003ctd>\u003cstrong>소 각하\u003c/strong>. 국가·지방공공단체가 \u003cstrong>행정권의 주체로서\u003c/strong> 국민에게 행정상 의무의 이행을 구하는 소송은 \u003cstrong>「법률상의 쟁송」에 해당하지 않아 부적법\u003c/strong>（법률에 특별한 규정이 있는 경우를 제외）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최대 함정: 「의무를 부과하는 행정행위의 근거법이 있으면 그에 기해 강제집행도 할 수 있다」 → 오답.\u003c/strong> 강제집행에는 \u003cstrong>별도의 법률상 근거\u003c/strong>가 반드시 필요. 「의무의 부과」와 「의무의 강제」는 별개.\u003c/li>\u003cli>\u003cstrong>모든 행정행위에 자력집행력이 있다는 지문은 오답.\u003c/strong> 법률의 근거가 있는 경우에만 인정된다.\u003c/li>\u003cli>「\u003cstrong>조례\u003c/strong>만으로 대집행을 할 수 있는가」 → 행정대집행법 2조는 「법률(법률의 위임에 따른 명령·규칙 및 \u003cstrong>조례\u003c/strong>를 포함한다)」이라고 명시하므로, \u003cstrong>조례에 근거한 의무에 대한 대집행은 가능\u003c/strong>. 다만 조례로 \u003cstrong>대집행 이외의\u003c/strong> 독자적 강제수단을 창설하는 것은 행정대집행법 1조에 반해 불가.\u003c/li>\u003cli>대집행의 대상은 \u003cstrong>대체적 작위의무뿐\u003c/strong>. 「토지·건물의 명도(明渡)」나 「의사의 진단」 같은 \u003cstrong>비대체적\u003c/strong> 의무, 단순 \u003cstrong>부작위의무\u003c/strong>는 대집행할 수 없다(빈출).\u003c/li>\u003cli>절차 순서 암기: \u003cstrong>계고 → 대집행영장 통지 → 실행 → 비용납부명령\u003c/strong>(행정대집행법 3~5조), 비용은 \u003cstrong>국세체납처분의 예\u003c/strong>로 징수(6조 1항).\u003c/li>\u003cli>\u003cstrong>집행벌 = 사방법 36조\u003c/strong>가 유일한 예. 과료의 \u003cstrong>반복 부과가 가능\u003c/strong>하고 형벌이 아니므로 형사처벌과 병과해도 이중처벌이 아니다.\u003c/li>\u003cli>민사소송 우회는 불가(最大判昭41.2.23, 最判平14.7.9). 단 \u003cstrong>재산권의 주체로서\u003c/strong> 하는 소송(예: 시유지 불법점유자에 대한 명도청구)은 법률상의 쟁송에 해당하여 \u003cstrong>적법\u003c/strong>하다. 대비로 정리.\u003c/li>\u003c/ul>","search":"自力執行力 じりきしっこうりょく 항목 내용 ------ ------ 읽기 じりきしっこうりょく（자력집행력） 과목 행정법（행정행위） 한줄 정의 의무자가 행정행위로 부과된 의무를 이행하지 않을 때, 행정청이 법원의 판결을 받지 않고 스스로 강제적으로 그 의무 내용을 실현할 수 있는 효력 통설·판례 행정행위의 근거법만으로는 부족하고, 강제집행을 위한 별도의 법률상 근거가 필요 （통설·확립된 실무） 개념 사인 간에는 채무자가 의무를 이행하지 않으면 채권자가 소송을 제기해 판결 채무명의 을 얻은 뒤 법원의 집행절차를 밟아야 한다 자력구제 금지 . 그러나 행정에는 예외적으로, 스스로 의무 이행을 강제 실현할 수 있는 권능이 인정되는 경우가 있다. 이것이 자력집행력 집행력 이다. 여기서 가장 중요한 함정 은 근거 문제다. 자력집행력은 행정행위의 성질에서 당연히 나오는 것이 아니다. 의무를 부과하는 행정행위의 근거법이 있다는 것만으로는 강제집행을 할 수 없고, 강제집행에 관한 별도의 법률상 근거가 반드시 필요 하다. 의무의 부과와 의무의 강제는 별개의 침해이기 때문이다. 이 일반법이 바로 행정대집행법 이며, 동법 1조는 「행정상의 의무 이행 확보에 관하여는 따로 법률로 정하는 것을 제외하고는 이 법률이 정하는 바에 의한다 」고 하여, 강제집행에는 법률의 근거가 필요함을 전제로 하고 있다. 또한 대집행의 근거가 되는 의무는 「법률 법률의 위임에 따른 명령·규칙 및 조례를 포함한다 」 에 의해 명해진 것이어야 한다 행정대집행법 2조 괄호 . 행정상 강제집행의 수단은 네 가지로 나뉜다. ① 대집행 代執行 — 대체적 작위의무에 대해 행정청이 스스로 하거나 제3자에게 시키고 그 비용을 의무자로부터 징수 행정대집행법 2조 . ② 집행벌 執行罰 — 과료를 예고해 심리적으로 압박하는 방식으로, 현행법상 사방법 砂防法 36조 가 사실상 유일한 예. ③ 직접강제 直接強制 — 의무자의 신체·재산에 직접 실력을 행사하는 것으로, 개별법에 극히 예외적으로만 존재. ④ 강제징수 強制徴収 — 금전채권에 대해 국세징수법의 체납처분 절차에 의함. 이 중 일반법이 있는 것은 대집행뿐 이다. 대집행의 요건과 절차도 자주 출제된다. 요건은 ㉮ 대체적 작위의무 일 것 타인이 대신할 수 있는 행위에 한함 , ㉯ 다른 수단으로 이행 확보가 곤란할 것 보충성 , ㉰ 불이행을 방치함이 현저히 공익에 반할 것 행정대집행법 2조 . 절차는 계고 戒告, 3조 1항 → 대집행영장에 의한 통지 3조 2항 → 대집행의 실행 4조 → 비용납부명령 5조 순이며, 비용은 국세체납처분의 예에 따라 징수 할 수 있다 6조 1항 . 한편 자력집행 수단이 법정되어 있는 경우, 행정청이 그 수단을 쓰지 않고 민사소송으로 우회하는 것은 허용되지 않는다 最大判昭41.2.23 . 나아가 판례는 국가·지방공공단체가 행정권의 주체로서 국민에게 행정상 의무의 이행을 구하는 소송은 애초에 「법률상의 쟁송」 재판소법 3조 1항 에 해당하지 않아 부적법 각하 하다고 하였다 宝塚市パチンコ条例事件, 最判平14.7.9 . 👉 대비: 행정상 의무의 강제 = 민사소송 불가 ／ 다만 재산권의 주체로서 하는 소송은 가능 행정행위의 4가지 효력 비교 효력 제약받는 쪽 내용 근거 ------ ----------- ------ ------ 公定力 용어/公定力.md 국민·제3자·다른 행정청·법원 위법해도 취소될 때까지 유효 명문 없음 / 취소소송의 배타적 관할 不可争力 용어/不可争力.md 국민 쟁송기간 경과 후 다툴 수 없음 행정사건소송법 14조, 행정불복심사법 18조 不可変更力 용어/不可変更力.md 행정청 자신 재결 등을 스스로 취소·변경할 수 없음 명문 없음 / 판례 最判昭29.1.21 自力執行力 국민（의무자） 재판 없이 스스로 강제집행 별도의 개별 법률 필요 （행정대집행법 등） 행정상 강제집행의 4수단 수단 대상 의무 근거 비고 ------ ----------- ------ ------ 대집행 대체적 작위의무 행정대집행법 2조 （일반법） 유일하게 일반법이 존재. 시험의 중심 집행벌 부작위의무·비대체적 작위의무 사방법 36조 현행법상 사실상 유일한 예 . 반복 부과 가능, 형벌 아니므로 이중처벌 아님 직접강제 모든 의무 개별법에만 존재 인권 침해가 커서 일반법 없음 강제징수 금전 급부 의무 국세징수법（체납처분） 개별법이 「국세체납처분의 예에 의한다」고 준용 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 농업공제조합의 강제징수와 민사소송 最大判昭41.2.23 법률이 행정상 강제징수 수단을 인정하고 있는 채권에 대해, 조합이 이를 쓰지 않고 민사소송으로 청구한 사안 조세에 준하는 간이·신속한 행정상 강제징수 수단이 부여되어 있음에도 이를 쓰지 않고 민사소송을 제기하는 것은 입법 취지에 반하여 허용되지 않는다 宝塚市パチンコ条例事件（다카라즈카시 파친코 조례 사건） 最判平14.7.9 시장이 조례에 근거한 공사중지명령을 어긴 업자를 상대로, 공사 속행 금지를 구하는 민사소송 을 제기한 사안 소 각하 . 국가·지방공공단체가 행정권의 주체로서 국민에게 행정상 의무의 이행을 구하는 소송은 「법률상의 쟁송」에 해당하지 않아 부적법 （법률에 특별한 규정이 있는 경우를 제외） 💡 수험 팁 - 최대 함정: 「의무를 부과하는 행정행위의 근거법이 있으면 그에 기해 강제집행도 할 수 있다」 → 오답. 강제집행에는 별도의 법률상 근거 가 반드시 필요. 「의무의 부과」와 「의무의 강제」는 별개. - 모든 행정행위에 자력집행력이 있다는 지문은 오답. 법률의 근거가 있는 경우에만 인정된다. - 「 조례 만으로 대집행을 할 수 있는가」 → 행정대집행법 2조는 「법률 법률의 위임에 따른 명령·규칙 및 조례 를 포함한다 」이라고 명시하므로, 조례에 근거한 의무에 대한 대집행은 가능 . 다만 조례로 대집행 이외의 독자적 강제수단을 창설하는 것은 행정대집행법 1조에 반해 불가. - 대집행의 대상은 대체적 작위의무뿐 . 「토지·건물의 명도 明渡 」나 「의사의 진단」 같은 비대체적 의무, 단순 부작위의무 는 대집행할 수 없다 빈출 . - 절차 순서 암기: 계고 → 대집행영장 통지 → 실행 → 비용납부명령 행정대집행법 3~5조 , 비용은 국세체납처분의 예 로 징수 6조 1항 . - 집행벌 = 사방법 36조 가 유일한 예. 과료의 반복 부과가 가능 하고 형벌이 아니므로 형사처벌과 병과해도 이중처벌이 아니다. - 민사소송 우회는 불가 最大判昭41.2.23, 最判平14.7.9 . 단 재산권의 주체로서 하는 소송 예: 시유지 불법점유자에 대한 명도청구 은 법률상의 쟁송에 해당하여 적법 하다. 대비로 정리."},"重大明白説":{"type":"term","subject":"용어","id":"重大明白説","title":"重大明白説","sub":"じゅうだいめいはくせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>じゅうだいめいはくせつ（중대명백설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>행정행위의 하자가 \u003cstrong>중대\u003c/strong>하고 또한 \u003cstrong>명백\u003c/strong>한 경우에 한하여 그 행위가 당연무효(当然無効)가 된다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>중대명백설이 통설·판례.\u003c/strong> 다만 판례는 과세처분 등에서 명백성을 요구하지 않고 무효를 인정한 예외도 두고 있다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정행위에 하자가 있어도 대부분은 \u003cstrong>취소할 수 있는 행위(取り消しうべき行為)\u003c/strong>에 그친다. 즉 \u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>에 의해 일단 유효하고, 쟁송기간이 지나면 \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>이 생겨 국민은 더 이상 다툴 수 없다. 이에 비해 \u003cstrong>당연무효\u003c/strong>인 행정행위는 처음부터 아무런 효력이 없어, 공정력도 불가쟁력도 발생하지 않는다. 따라서 누구든 언제든 무효를 주장할 수 있고, 무효등확인의 소(행정사건소송법 3조 4항·36조)에는 \u003cstrong>출소기간의 제한이 없다\u003c/strong>.\u003c/p>\n\u003cp>그렇다면 어떤 하자가 있을 때 무효가 되는가. 통설·판례가 취하는 것이 \u003cstrong>중대명백설\u003c/strong>이다. ① \u003cstrong>중대성\u003c/strong> — 하자가 행정행위의 중요한 요건(근간)에 관한 것일 것. ② \u003cstrong>명백성\u003c/strong> — 그 하자가 외관상 객관적으로 명백할 것. 이 \u003cstrong>두 요건을 모두\u003c/strong> 충족해야 당연무효가 된다. 명백성 요건은 처분을 믿고 행동한 제3자나 법적 안정성을 보호하기 위한 것이다.\u003c/p>\n\u003cp>명백성의 의미에 대해 판례는 \u003cstrong>외견상 일견 명백설(外見上一見明白説)\u003c/strong>에 서 있다. 「행정처분의 하자가 명백하다는 것은, 처분요건의 존재를 긍정한 처분청의 인정이 잘못이라는 점이 \u003cstrong>처분 성립 당초부터 외형상 객관적으로 명백\u003c/strong>함을 가리킨다」(最判昭36.3.7). 즉 행정청이 조사를 게을리했다는 사정만으로는 명백성이 인정되지 않는 것이 원칙이다.\u003c/p>\n\u003cp>다만 판례는 \u003cstrong>예외를 인정한다.\u003c/strong> 과세처분처럼 \u003cstrong>처분을 신뢰한 제3자가 존재하지 않는\u003c/strong> 영역에서는, 명백성을 요구하지 않고 무효를 인정한 예가 있다. 과세요건의 근간에 관한 내용상의 과오가 있고, 징세행정의 안정이라는 요청을 참작하더라도 불복신청기간의 도과에 따른 불가쟁적 효과를 이유로 납세자에게 그 불이익을 감수시키는 것이 \u003cstrong>현저히 부당하다고 인정되는 예외적 사정\u003c/strong>이 있는 경우에는 당연무효가 된다고 한 것이다(最判昭48.4.26). 👉 \u003cstrong>대비: 원칙 = 중대 ＋ 명백 ／ 예외(과세처분 등) = 중대성만으로도 무효\u003c/strong>\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>重大明白説\u003c/strong>\u003c/td>\u003ctd>하자가 \u003cstrong>중대\u003c/strong>하고 \u003cstrong>명백\u003c/strong>한 두 요건을 모두 갖춘 때에만 당연무효\u003c/td>\u003ctd>👉 \u003cstrong>통설·판례\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>明白性補充要件説（명백성 보충요건설）\u003c/td>\u003ctd>원칙적으로 \u003cstrong>중대성만으로\u003c/strong> 무효가 되고, 처분을 신뢰한 제3자의 보호가 필요한 경우에 한해 명백성을 \u003cstrong>보충적으로\u003c/strong> 요구\u003c/td>\u003ctd>과세처분 등 제3자가 없는 영역을 설명하기 쉬움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>具体的価値衡量説（구체적 가치형량설）\u003c/td>\u003ctd>획일적 기준 없이, 사안마다 법적 안정성과 국민의 권리구제를 형량하여 판단\u003c/td>\u003ctd>유력설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch3>명백성의 판단기준\u003c/h3>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>外見上一見明白説\u003c/strong>\u003c/td>\u003ctd>처분의 \u003cstrong>외형상 객관적으로\u003c/strong> 누가 보아도 명백해야 함\u003c/td>\u003ctd>👉 \u003cstrong>판례\u003c/strong>（最判昭36.3.7）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>調査義務違反説（조사의무 위반설）\u003c/td>\u003ctd>행정청이 요구되는 조사의무를 다했다면 알 수 있었을 하자도 명백성을 인정\u003c/td>\u003ctd>명백성을 넓게 인정하는 입장\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>행정행위의 하자 정리\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>하자의 정도\u003c/th>\u003cth>효력\u003c/th>\u003cth>다투는 방법\u003c/th>\u003cth>기간 제한\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>취소할 수 있는 행위\u003c/strong>\u003c/td>\u003ctd>중대·명백에 이르지 않음\u003c/td>\u003ctd>\u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a> O — 취소될 때까지 \u003cstrong>유효\u003c/strong>\u003c/td>\u003ctd>심사청구·취소소송\u003c/td>\u003ctd>\u003cstrong>있음\u003c/strong>（행소법 14조, 행심법 18조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>당연무효인 행위\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>중대 ＋ 명백\u003c/strong>\u003c/td>\u003ctd>처음부터 \u003cstrong>무효\u003c/strong>（공정력·\u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a> 없음）\u003c/td>\u003ctd>무효등확인의 소, 쟁점소송 등\u003c/td>\u003ctd>\u003cstrong>없음\u003c/strong>（행소법 3조 4항·36조）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>하자의 「명백성」의 의의\u003c/td>\u003ctd>最判昭36.3.7\u003c/td>\u003ctd>행정처분의 하자가 「명백」하다는 것의 의미가 다투어진 사안\u003c/td>\u003ctd>\u003cstrong>「처분요건의 존재를 긍정한 처분청의 인정이 잘못이라는 점이, 처분 성립의 당초부터 외형상 객관적으로 명백함을 가리킨다」\u003c/strong>（외견상 일견 명백설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>課税処分と当然無効（과세처분과 당연무효）\u003c/td>\u003ctd>最判昭48.4.26 / 民集27巻3号629頁\u003c/td>\u003ctd>친족이 무단으로 X 명의로 소유권이전등기를 한 뒤 제3자에게 매각하였는데, 세무서장이 X에게 양도소득이 있다며 과세처분을 한 사안\u003c/td>\u003ctd>\u003cstrong>무효 인정\u003c/strong>. 과세요건의 \u003cstrong>근간\u003c/strong>에 관한 내용상의 과오가 있고, 징세행정의 안정을 참작하더라도 불가쟁적 효과를 이유로 납세자에게 불이익을 감수시키는 것이 \u003cstrong>현저히 부당하다고 인정되는 예외적 사정\u003c/strong>이 있는 경우에는 당연무효가 된다（\u003cstrong>명백성을 요건으로 삼지 않음\u003c/strong>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>최대 함정: 「행정행위가 위법하면 무효이다」 → 오답.\u003c/strong> 위법 ≠ 무효. 위법한 행위는 원칙적으로 \u003cstrong>취소할 수 있는 행위\u003c/strong>에 그치고, \u003cstrong>중대 ＋ 명백\u003c/strong>한 경우에만 당연무효가 된다.\u003c/li>\u003cli>\u003cstrong>중대성만으로는 부족, 명백성만으로도 부족.\u003c/strong> 「중대하거나 명백하면 무효」처럼 \u003cstrong>「또는」\u003c/strong>으로 바꿔치기한 지문은 오답. 원칙은 \u003cstrong>「그리고」\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>예외 판례를 반드시 세트로.\u003c/strong> 最判昭48.4.26(과세처분)은 \u003cstrong>명백성을 요구하지 않고\u003c/strong> 무효를 인정한 대표례. 「판례는 언제나 명백성을 요구한다」는 지문은 오답.\u003c/li>\u003cli>명백성의 의미는 \u003cstrong>외견상 일견 명백설\u003c/strong>（最判昭36.3.7）. 「행정청이 조사를 게을리했다면 그것만으로 명백성이 인정된다」는 지문은 판례의 입장이 아니다.\u003c/li>\u003cli>\u003cstrong>무효 = 기간 제한 없음\u003c/strong>이 실익. \u003ca href=\"#/e/%E4%B8%8D%E5%8F%AF%E4%BA%89%E5%8A%9B\">不可争力\u003c/a>이 생겨 제소기간을 놓친 국민이 마지막으로 기대는 것이 무효 주장이다. 무효등확인의 소(행소법 3조 4항)에는 출소기간이 없다는 점과 연결.\u003c/li>\u003cli>무효인 처분에는 \u003ca href=\"#/e/%E5%85%AC%E5%AE%9A%E5%8A%9B\">公定力\u003c/a>이 없으므로, 취소를 거치지 않고 \u003cstrong>부당이득반환청구\u003c/strong>도 가능하다. 대비: \u003cstrong>취소할 수 있는 처분 = 부당이득반환 불가 ／ 무효인 처분 = 가능\u003c/strong>.\u003c/li>\u003c/ul>","search":"重大明白説 じゅうだいめいはくせつ 항목 내용 ------ ------ 읽기 じゅうだいめいはくせつ（중대명백설） 과목 행정법（행정행위） 한줄 정의 행정행위의 하자가 중대 하고 또한 명백 한 경우에 한하여 그 행위가 당연무효 当然無効 가 된다는 학설 통설·판례 중대명백설이 통설·판례. 다만 판례는 과세처분 등에서 명백성을 요구하지 않고 무효를 인정한 예외도 두고 있다 개념 행정행위에 하자가 있어도 대부분은 취소할 수 있는 행위 取り消しうべき行為 에 그친다. 즉 公定力 용어/公定力.md 에 의해 일단 유효하고, 쟁송기간이 지나면 不可争力 용어/不可争力.md 이 생겨 국민은 더 이상 다툴 수 없다. 이에 비해 당연무효 인 행정행위는 처음부터 아무런 효력이 없어, 공정력도 불가쟁력도 발생하지 않는다. 따라서 누구든 언제든 무효를 주장할 수 있고, 무효등확인의 소 행정사건소송법 3조 4항·36조 에는 출소기간의 제한이 없다 . 그렇다면 어떤 하자가 있을 때 무효가 되는가. 통설·판례가 취하는 것이 중대명백설 이다. ① 중대성 — 하자가 행정행위의 중요한 요건 근간 에 관한 것일 것. ② 명백성 — 그 하자가 외관상 객관적으로 명백할 것. 이 두 요건을 모두 충족해야 당연무효가 된다. 명백성 요건은 처분을 믿고 행동한 제3자나 법적 안정성을 보호하기 위한 것이다. 명백성의 의미에 대해 판례는 외견상 일견 명백설 外見上一見明白説 에 서 있다. 「행정처분의 하자가 명백하다는 것은, 처분요건의 존재를 긍정한 처분청의 인정이 잘못이라는 점이 처분 성립 당초부터 외형상 객관적으로 명백 함을 가리킨다」 最判昭36.3.7 . 즉 행정청이 조사를 게을리했다는 사정만으로는 명백성이 인정되지 않는 것이 원칙이다. 다만 판례는 예외를 인정한다. 과세처분처럼 처분을 신뢰한 제3자가 존재하지 않는 영역에서는, 명백성을 요구하지 않고 무효를 인정한 예가 있다. 과세요건의 근간에 관한 내용상의 과오가 있고, 징세행정의 안정이라는 요청을 참작하더라도 불복신청기간의 도과에 따른 불가쟁적 효과를 이유로 납세자에게 그 불이익을 감수시키는 것이 현저히 부당하다고 인정되는 예외적 사정 이 있는 경우에는 당연무효가 된다고 한 것이다 最判昭48.4.26 . 👉 대비: 원칙 = 중대 ＋ 명백 ／ 예외 과세처분 등 = 중대성만으로도 무효 학설 학설 내용 비고 ------ ------ ------ 重大明白説 하자가 중대 하고 명백 한 두 요건을 모두 갖춘 때에만 당연무효 👉 통설·판례 明白性補充要件説（명백성 보충요건설） 원칙적으로 중대성만으로 무효가 되고, 처분을 신뢰한 제3자의 보호가 필요한 경우에 한해 명백성을 보충적으로 요구 과세처분 등 제3자가 없는 영역을 설명하기 쉬움 具体的価値衡量説（구체적 가치형량설） 획일적 기준 없이, 사안마다 법적 안정성과 국민의 권리구제를 형량하여 판단 유력설 명백성의 판단기준 학설 내용 비고 ------ ------ ------ 外見上一見明白説 처분의 외형상 객관적으로 누가 보아도 명백해야 함 👉 판례 （最判昭36.3.7） 調査義務違反説（조사의무 위반설） 행정청이 요구되는 조사의무를 다했다면 알 수 있었을 하자도 명백성을 인정 명백성을 넓게 인정하는 입장 행정행위의 하자 정리 구분 하자의 정도 효력 다투는 방법 기간 제한 ------ ----------- ------ ------------ ----------- 취소할 수 있는 행위 중대·명백에 이르지 않음 公定力 용어/公定力.md o — 취소될 때까지 유효 심사청구·취소소송 있음 （행소법 14조, 행심법 18조） 당연무효인 행위 중대 ＋ 명백 처음부터 무효 （공정력· 不可争力 용어/不可争力.md 없음） 무효등확인의 소, 쟁점소송 등 없음 （행소법 3조 4항·36조） 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 하자의 「명백성」의 의의 最判昭36.3.7 행정처분의 하자가 「명백」하다는 것의 의미가 다투어진 사안 「처분요건의 존재를 긍정한 처분청의 인정이 잘못이라는 점이, 처분 성립의 당초부터 외형상 객관적으로 명백함을 가리킨다」 （외견상 일견 명백설） 課税処分と当然無効（과세처분과 당연무효） 最判昭48.4.26 / 民集27巻3号629頁 친족이 무단으로 x 명의로 소유권이전등기를 한 뒤 제3자에게 매각하였는데, 세무서장이 x에게 양도소득이 있다며 과세처분을 한 사안 무효 인정 . 과세요건의 근간 에 관한 내용상의 과오가 있고, 징세행정의 안정을 참작하더라도 불가쟁적 효과를 이유로 납세자에게 불이익을 감수시키는 것이 현저히 부당하다고 인정되는 예외적 사정 이 있는 경우에는 당연무효가 된다（ 명백성을 요건으로 삼지 않음 ） 💡 수험 팁 - 최대 함정: 「행정행위가 위법하면 무효이다」 → 오답. 위법 ≠ 무효. 위법한 행위는 원칙적으로 취소할 수 있는 행위 에 그치고, 중대 ＋ 명백 한 경우에만 당연무효가 된다. - 중대성만으로는 부족, 명백성만으로도 부족. 「중대하거나 명백하면 무효」처럼 「또는」 으로 바꿔치기한 지문은 오답. 원칙은 「그리고」 . - 예외 판례를 반드시 세트로. 最判昭48.4.26 과세처분 은 명백성을 요구하지 않고 무효를 인정한 대표례. 「판례는 언제나 명백성을 요구한다」는 지문은 오답. - 명백성의 의미는 외견상 일견 명백설 （最判昭36.3.7）. 「행정청이 조사를 게을리했다면 그것만으로 명백성이 인정된다」는 지문은 판례의 입장이 아니다. - 무효 = 기간 제한 없음 이 실익. 不可争力 용어/不可争力.md 이 생겨 제소기간을 놓친 국민이 마지막으로 기대는 것이 무효 주장이다. 무효등확인의 소 행소법 3조 4항 에는 출소기간이 없다는 점과 연결. - 무효인 처분에는 公定力 용어/公定力.md 이 없으므로, 취소를 거치지 않고 부당이득반환청구 도 가능하다. 대비: 취소할 수 있는 처분 = 부당이득반환 불가 ／ 무효인 처분 = 가능 ."},"許可":{"type":"term","subject":"용어","id":"許可","title":"許可","sub":"きょか","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>きょか（허가）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 분류·명령적 행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>법령에 의한 \u003cstrong>일반적 금지\u003c/strong>를 특정인·특정 경우에 해제하여, 본래 누리던 \u003cstrong>자연적 자유를 회복\u003c/strong>시켜 주는 행정행위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>명령적 행위\u003c/strong>. 무허가 행위라도 \u003cstrong>사법상(私法上) 효력은 원칙 유효\u003c/strong>하고, 다만 행정형벌·시정명령의 대상이 된다（最判昭35.3.18）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>許可는 「누구나 원래 할 수 있었던 일」을 공익상의 이유로 법령이 일단 \u003cstrong>일반적으로 금지\u003c/strong>해 두었다가, 요건을 갖춘 사람에게 그 금지를 풀어 주는 행위다. 즉 없던 권리를 새로 주는 것이 아니라 \u003cstrong>자연적 자유(自然的自由)를 회복\u003c/strong>시키는 데 그친다. 운전면허(도로교통법 84조), 음식점 영업허가(식품위생법 55조), 의사면허(의사법 2조), 공중목욕탕 영업허가(공중목욕탕법 2조 1항) 등이 전형이다.\u003c/p>\n\u003cp>허가는 「자유의 회복」이므로 법정 요건을 충족하면 행정청은 원칙적으로 허가해야 하며, 성질상 \u003cstrong>기속행위(羈束行為)\u003c/strong>에 가깝다. 대비: \u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>는 원칙 재량행위다. 다만 공중목욕탕의 거리제한처럼 적정 배치를 위한 공익 판단이 개입하면 요건 판단에 재량이 인정될 여지가 생긴다.\u003c/p>\n\u003cp>가장 중요한 시험 포인트는 \u003cstrong>무허가 행위의 효력\u003c/strong>이다. 허가는 어디까지나 단속(取締)을 위한 것이므로, 허가 없이 한 사법상 법률행위 자체는 \u003cstrong>무효가 되지 않는다\u003c/strong>. 식품위생법상 식육판매업 허가를 받지 않은 자가 체결한 식육 매입계약도 사법상 유효라는 것이 판례다(最判昭35.3.18). 대신 무허가 영업자는 형벌·영업정지·시정명령을 받는다. 대비: \u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>를 받지 않은 행위는 \u003cstrong>무효\u003c/strong>다.\u003c/p>\n\u003cp>주의할 함정은 \u003cstrong>법령상의 명칭과 강학상(講学上) 성질이 일치하지 않는다\u003c/strong>는 점이다. 「도로점용허가」(도로법 32조)는 이름은 허가지만 강학상 \u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>이고, 「농지법 3조 허가」는 이름은 허가지만 강학상 \u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>다. 반대로 수도법상 「인가」는 강학상 특허다.\u003c/p>\n\u003cp>\u003cstrong>행정행위 3분류 비교표 (최빈출)\u003c/strong>\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>\u003cstrong>許可\u003c/strong>\u003c/th>\u003cth>\u003ca href=\"#/e/%E7%89%B9%E8%A8%B1\">特許\u003c/a>\u003c/th>\u003cth>\u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>\u003c/th>\u003c/tr>\u003ctr>\u003ctd>성질\u003c/td>\u003ctd>\u003cstrong>명령적 행위\u003c/strong>\u003c/td>\u003ctd>형성적 행위\u003c/td>\u003ctd>형성적 행위(보충행위)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>내용\u003c/td>\u003ctd>일반적 금지의 해제 → \u003cstrong>자연적 자유 회복\u003c/strong>\u003c/td>\u003ctd>새로운 권리·능력·법적 지위의 \u003cstrong>설정\u003c/strong>\u003c/td>\u003ctd>제3자의 법률행위를 \u003cstrong>보충\u003c/strong>하여 효력 완성\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재량\u003c/td>\u003ctd>원칙 \u003cstrong>기속행위\u003c/strong>\u003c/td>\u003ctd>원칙 \u003cstrong>재량행위\u003c/strong>\u003c/td>\u003ctd>원칙 기속(공익 판단 여지 있음)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>무허가·무특허·무인가 행위의 사법상 효력\u003c/td>\u003ctd>원칙 \u003cstrong>유효\u003c/strong>（단, 처벌 대상）\u003c/td>\u003ctd>효과 자체가 발생하지 않음\u003c/td>\u003ctd>\u003cstrong>무효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>대표 예\u003c/td>\u003ctd>운전면허, 음식점 영업허가, 의사면허, 공중목욕탕 영업허가\u003c/td>\u003ctd>공기업 특허, 도로점용허가, 공유수면매립면허, 귀화 허가, 광업권 설정\u003c/td>\u003ctd>농지법 3조 허가, 공공요금(운임) 인가, 공공조합 설립인가\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>食肉販売業許可事件（식육판매업 허가 사건）\u003c/td>\u003ctd>最判昭35.3.18 / 民集14巻4号483頁\u003c/td>\u003ctd>식품위생법상 식육판매업 영업허가를 받지 않은 자가 체결한 식육 매입계약의 사법상 효력\u003c/td>\u003ctd>\u003cstrong>계약은 유효\u003c/strong>. 식품위생법은 \u003cstrong>단속법규(取締法規)\u003c/strong>에 불과하므로, 허가를 받지 않았다는 사정만으로 거래의 사법상 효력이 부정되지 않는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（공중목욕탕 거리제한 사건）\u003c/td>\u003ctd>最大判昭30.1.26\u003c/td>\u003ctd>공중목욕탕법상 허가제 및 거리(적정배치) 제한이 헌법 22조 1항 직업선택의 자유를 침해하는지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 목욕탕의 편재·난립을 막아 공중위생을 확보할 필요가 있으므로 허가제와 적정배치 규제는 공공복리에 의한 정당한 제한\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「무허가 행위는 무효」는 오답!\u003c/strong> 허가는 단속법규 → 사법상 \u003cstrong>유효\u003c/strong>, 처벌만 받는다. 무효가 되는 것은 \u003ca href=\"#/e/%E8%AA%8D%E5%8F%AF\">認可\u003c/a>다. 이 대비가 3분류 문제의 정답 갈림길이다.\u003c/li>\u003cli>「許可 = 자연적 자유의 \u003cstrong>회복\u003c/strong>」 / 「特許 = 새로운 권리의 \u003cstrong>설정\u003c/strong>」. 「회복」과 「설정」 두 단어만 정확히 붙잡으면 대부분 풀린다.\u003c/li>\u003cli>\u003cstrong>법령상 명칭에 속지 말 것.\u003c/strong> 도로점용「허가」=특허 / 농지법 3조「허가」=인가 / 수도사업「인가」=특허. 시험은 반드시 이 불일치를 노린다.\u003c/li>\u003cli>허가는 원칙 \u003cstrong>기속행위\u003c/strong>(요건 충족 시 거부 불가), 특허는 원칙 \u003cstrong>재량행위\u003c/strong>로 짝지어 암기.\u003c/li>\u003cli>허가에 붙는 유효기간·조건은 \u003ca href=\"#/e/%E9%99%84%E6%AC%BE\">附款\u003c/a> 문제로, 허가 후 사정변경에 의한 실효는 \u003ca href=\"#/e/%E6%92%A4%E5%9B%9E\">撤回\u003c/a> 문제로 연결되어 출제된다.\u003c/li>\u003c/ul>","search":"許可 きょか 항목 내용 ------ ------ 읽기 きょか（허가） 과목 행정법（행정행위의 분류·명령적 행위） 한줄 정의 법령에 의한 일반적 금지 를 특정인·특정 경우에 해제하여, 본래 누리던 자연적 자유를 회복 시켜 주는 행정행위 통설·판례 명령적 행위 . 무허가 행위라도 사법상 私法上 효력은 원칙 유효 하고, 다만 행정형벌·시정명령의 대상이 된다（最判昭35.3.18） 개념 許可는 「누구나 원래 할 수 있었던 일」을 공익상의 이유로 법령이 일단 일반적으로 금지 해 두었다가, 요건을 갖춘 사람에게 그 금지를 풀어 주는 행위다. 즉 없던 권리를 새로 주는 것이 아니라 자연적 자유 自然的自由 를 회복 시키는 데 그친다. 운전면허 도로교통법 84조 , 음식점 영업허가 식품위생법 55조 , 의사면허 의사법 2조 , 공중목욕탕 영업허가 공중목욕탕법 2조 1항 등이 전형이다. 허가는 「자유의 회복」이므로 법정 요건을 충족하면 행정청은 원칙적으로 허가해야 하며, 성질상 기속행위 羈束行為 에 가깝다. 대비: 特許 特許.md 는 원칙 재량행위다. 다만 공중목욕탕의 거리제한처럼 적정 배치를 위한 공익 판단이 개입하면 요건 판단에 재량이 인정될 여지가 생긴다. 가장 중요한 시험 포인트는 무허가 행위의 효력 이다. 허가는 어디까지나 단속 取締 을 위한 것이므로, 허가 없이 한 사법상 법률행위 자체는 무효가 되지 않는다 . 식품위생법상 식육판매업 허가를 받지 않은 자가 체결한 식육 매입계약도 사법상 유효라는 것이 판례다 最判昭35.3.18 . 대신 무허가 영업자는 형벌·영업정지·시정명령을 받는다. 대비: 認可 認可.md 를 받지 않은 행위는 무효 다. 주의할 함정은 법령상의 명칭과 강학상 講学上 성질이 일치하지 않는다 는 점이다. 「도로점용허가」 도로법 32조 는 이름은 허가지만 강학상 特許 特許.md 이고, 「농지법 3조 허가」는 이름은 허가지만 강학상 認可 認可.md 다. 반대로 수도법상 「인가」는 강학상 특허다. 행정행위 3분류 비교표 최빈출 구분 許可 特許 特許.md 認可 認可.md ------ ---------- ------ ------ 성질 명령적 행위 형성적 행위 형성적 행위 보충행위 내용 일반적 금지의 해제 → 자연적 자유 회복 새로운 권리·능력·법적 지위의 설정 제3자의 법률행위를 보충 하여 효력 완성 재량 원칙 기속행위 원칙 재량행위 원칙 기속 공익 판단 여지 있음 무허가·무특허·무인가 행위의 사법상 효력 원칙 유효 （단, 처벌 대상） 효과 자체가 발생하지 않음 무효 대표 예 운전면허, 음식점 영업허가, 의사면허, 공중목욕탕 영업허가 공기업 특허, 도로점용허가, 공유수면매립면허, 귀화 허가, 광업권 설정 농지법 3조 허가, 공공요금 운임 인가, 공공조합 설립인가 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 食肉販売業許可事件（식육판매업 허가 사건） 最判昭35.3.18 / 民集14巻4号483頁 식품위생법상 식육판매업 영업허가를 받지 않은 자가 체결한 식육 매입계약의 사법상 효력 계약은 유효 . 식품위생법은 단속법규 取締法規 에 불과하므로, 허가를 받지 않았다는 사정만으로 거래의 사법상 효력이 부정되지 않는다 公衆浴場距離制限事件（공중목욕탕 거리제한 사건） 最大判昭30.1.26 공중목욕탕법상 허가제 및 거리 적정배치 제한이 헌법 22조 1항 직업선택의 자유를 침해하는지 합헌 . 목욕탕의 편재·난립을 막아 공중위생을 확보할 필요가 있으므로 허가제와 적정배치 규제는 공공복리에 의한 정당한 제한 💡 수험 팁 - 「무허가 행위는 무효」는 오답! 허가는 단속법규 → 사법상 유효 , 처벌만 받는다. 무효가 되는 것은 認可 認可.md 다. 이 대비가 3분류 문제의 정답 갈림길이다. - 「許可 = 자연적 자유의 회복 」 / 「特許 = 새로운 권리의 설정 」. 「회복」과 「설정」 두 단어만 정확히 붙잡으면 대부분 풀린다. - 법령상 명칭에 속지 말 것. 도로점용「허가」=특허 / 농지법 3조「허가」=인가 / 수도사업「인가」=특허. 시험은 반드시 이 불일치를 노린다. - 허가는 원칙 기속행위 요건 충족 시 거부 불가 , 특허는 원칙 재량행위 로 짝지어 암기. - 허가에 붙는 유효기간·조건은 附款 附款.md 문제로, 허가 후 사정변경에 의한 실효는 撤回 撤回.md 문제로 연결되어 출제된다."},"特許":{"type":"term","subject":"용어","id":"特許","title":"特許","sub":"とっきょ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>とっきょ（특허）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정행위의 분류·형성적 행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>특정인에게 \u003cstrong>본래 가지고 있지 않던 새로운 권리·능력·법적 지위를 설정\u003c/strong>해 주는 형성적 행정행위（강학상 개념）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>형성적 행위\u003c/strong>이며 원칙 \u003cstrong>재량행위\u003c/strong>. 특허법(特許法)의 「특허」와는 전혀 별개의 개념\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>特許는 강학상(講学上) 개념으로, 상대방에게 \u003cstrong>원래 없던 권리·능력을 새로 만들어 주는(設定)\u003c/strong> 행정행위다. \u003ca href=\"#/e/%E8%A8%B1%E5%8F%AF\">許可\u003c/a>가 이미 가지고 있던 자연적 자유의 \u003cstrong>회복\u003c/strong>에 그치는 것과 결정적으로 다르다. 공기업 특허(전기·가스 사업), 도로점용허가(도로법 32조), 공유수면매립면허(공유수면매립법 2조), 하천점용허가(하천법 24조), 광업권 설정, \u003cstrong>귀화 허가(국적법 4조)\u003c/strong>가 대표 예다.\u003c/p>\n\u003cp>여기서 말하는 特許는 \u003cstrong>특허법상의 「특허」(발명에 대한 특허권 부여)와 전혀 다르다\u003c/strong>. 오히려 특허법상의 특허는 강학상으로는 「확인(確認)」에 가깝다고 설명된다. 시험에서는 이 명칭 혼동을 노린 지문이 나온다.\u003c/p>\n\u003cp>특허는 「누구에게 얼마만큼의 권리를 줄 것인가」를 행정청이 공익적 관점에서 정책적으로 판단하는 것이므로, 성질상 \u003cstrong>원칙 재량행위\u003c/strong>다. 신청자가 요건을 갖추었더라도 행정청이 반드시 특허해야 하는 것은 아니다. 다만 재량이라 하여 무제한은 아니고, 다수 신청자 중 소수를 골라내는 경우에는 \u003cstrong>구체적 심사기준의 설정과 공정한 적용, 신청인에게 주장·입증의 기회 부여\u003c/strong>가 요구된다(個人タクシー事件, 最判昭46.10.28). 재량의 한계를 넘으면 \u003ca href=\"#/e/%E8%A3%81%E9%87%8F%E6%A8%A9%E3%81%AE%E9%80
