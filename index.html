이 되는 것이 최대의 특징이다. 대비: 취소소송은 「위법」만 심사 하고 부당은 다루지 않는다. 2014년 平成26년 전부개정 전에는 처분청에 하는 「異議申立て」와 상급청에 하는 「審査請求」가 병존했으나, 개정법은 이를 심사청구로 일원화 했다. 심사청구를 하는 상대방 審査庁 은 처분청에 상급 행정청이 있으면 최상급 행정청 , 없으면 처분청 자신 이 된다 4조 . 개별법에 근거가 있는 경우에만 再調査の請求 처분청에 대한 간이한 재심사 와 再審査請求 심사청구의 재결에 대한 추가 불복 가 예외적으로 인정된다. 심사청구 기간은 시험에서 가장 자주 출제되는 논점이다. 처분에 대한 심사청구는 처분이 있었음을 안 날의 다음날부터 기산하여 3개월 을 경과하면 할 수 없고 18조 1항 본문 , 또한 처분이 있었던 날의 다음날부터 기산하여 1년 을 경과하면 할 수 없다 18조 2항 본문 . 다만 어느 쪽이든 「정당한 이유가 있는 때」 에는 예외가 인정된다 양 항 단서 . 한편 부작위에 대한 심사청구에는 기간 제한이 없다 — 부작위는 위법 상태가 계속되고 있기 때문이다. 심사청구는 원칙적으로 서면 으로 하며 19조 1항 , 처분의 효력을 당연히 멈추지는 않는다 집행부정지 원칙 , 25조 1항 . 심사청구가 있으면 심사청은 처분에 관여하지 않은 직원 중에서 審理員 용어/審理員.md 을 지명하여 심리를 주재하게 하고, 심리원 의견서를 받은 뒤에는 원칙적으로 행정불복심사회 行政不服審査会 등에 자문한 다음 재결을 한다 43조 . 💡 수험 팁 - 기간 대비가 최대 함정. 심사청구 = 안 날의 다음날부터 기산하여 3개월 / 처분일 다음날부터 1년 . 취소소송 = 안 날부터 6개월 / 처분일부터 1년 행정사건소송법 14조 . 「3개월 ↔ 6개월」을 바꿔 놓은 지문이 단골 이다. - 조문 문언까지 다르다. 행정불복심사법은 「翌日から起算して」 다음날부터 기산 , 행정사건소송법은 「知った日から」 . 조문을 그대로 물어보는 문제가 나온다. - 부작위에 대한 심사청구에는 기간 제한이 없다. 「부작위도 3개월 이내」라는 지문은 오답. - 심사청구 = 위법 + 부당 심사 / 취소소송 = 위법만 . 대비: 「소송에서도 부당을 다툴 수 있다」는 오답. - 심사청구와 취소소송은 원칙적으로 자유선택주의 행정사건소송법 8조 1항 . 심사청구전치주의는 개별법에 규정이 있을 때만 예외적으로 적용된다. - 집행부정지가 원칙 25조 1항 . 「심사청구를 하면 처분의 효력이 정지된다」는 지문은 오답."},"審理員":{"type":"term","subject":"용어","id":"審理員","title":"審理員","sub":"しんりいん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しんりいん（심리원）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정불복심사법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>심사청구의 심리 절차를 주재하기 위해, \u003cstrong>처분에 관여하지 않은\u003c/strong> 심사청 소속 직원 중에서 지명되는 자\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>2014년(平成26년) 전부개정으로 신설된 \u003cstrong>심리의 공정성 확보 장치\u003c/strong>의 핵심\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>구법 하에서는 처분에 관여한 직원이 그대로 심리를 담당하는 일이 있어 \u003cstrong>「자기가 한 처분을 자기가 심사한다」\u003c/strong>는 비판을 받았다. 2014년 전부개정은 이를 시정하기 위해 \u003cstrong>심리원 제도\u003c/strong>를 신설했다. 심사청은 심사청구가 있으면 \u003cstrong>심사청에 소속된 직원 중에서\u003c/strong> 심리 절차를 수행할 자를 지명하고, 그 사실을 심사청구인 및 처분청에 통지해야 한다(9조 1항).\u003c/p>\n\u003cp>핵심은 \u003cstrong>제척(除斥) 사유\u003c/strong>다. 심사청구에 관계된 \u003cstrong>처분에 관여한 자\u003c/strong>, 또는 심사청구인·이해관계인 등은 심리원이 될 수 없다(9조 2항). 즉 심리원은 「소속 직원이지만 그 처분에는 손대지 않은 사람」이어야 한다. 대비: 심리원은 \u003cstrong>외부 전문가가 아니라 어디까지나 행정 조직 내부의 직원\u003c/strong>이다 — 외부성을 담보하는 것은 뒤에 나오는 행정불복심사회 쪽이다.\u003c/p>\n\u003cp>심리원은 심리 절차의 지휘자로서 심사청구인·참가인의 \u003cstrong>구술 의견진술 기회 부여\u003c/strong>, 처분청에 대한 \u003cstrong>변명서(弁明書) 제출 요구\u003c/strong>, 심사청구인의 \u003cstrong>반론서(反論書)\u003c/strong> 접수, 증거서류 제출·물건 제출 요구·검증·심문 등 심리에 필요한 조치를 취한다. 또 심사청구인 등에게는 \u003cstrong>제출서류 등의 열람·사본 교부 청구권\u003c/strong>이 보장되어(38조) 구법보다 절차의 투명성이 크게 강화되었다. 심리를 마치면 심리원은 재결의 결론에 관한 의견을 정리한 \u003cstrong>심리원 의견서(審理員意見書)\u003c/strong>를 작성하여 심사청에 제출한다(42조).\u003c/p>\n\u003cp>심사청은 심리원 의견서를 받으면, 일정한 예외에 해당하지 않는 한 \u003cstrong>행정불복심사회(行政不服審査会)\u003c/strong>(심사청이 지방자치단체의 장인 경우에는 조례로 두는 \u003cstrong>附属機関\u003c/strong>)에 \u003cstrong>자문해야 한다\u003c/strong>(43조). 행정불복심사회는 \u003cstrong>제3자 기관\u003c/strong>으로서 심리의 적정성을 외부에서 재점검하는 역할을 하며, 여기에서 비로소 절차의 \u003cstrong>외부성\u003c/strong>이 확보된다. 자문이 불필요한 대표적 경우로는 심사청구인이 \u003cstrong>자문을 원하지 않는다는 뜻을 표시한 때\u003c/strong>, 심사청구가 \u003cstrong>부적법하여 각하하는 때\u003c/strong>, 심사청구를 \u003cstrong>전부 인용하는 때\u003c/strong>(참가인의 반대가 없는 경우) 등이 있다. 이 흐름 — \u003cstrong>심리원 지명 → 심리 → 심리원 의견서 → 행정불복심사회 자문 → 재결\u003c/strong> — 이 개정법의 골격이다.\u003c/p>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「심리원은 외부 유식자 중에서 선임한다」는 오답.\u003c/strong> 심리원은 \u003cstrong>심사청 소속 직원\u003c/strong>이다. 외부 제3자 기관은 \u003cstrong>행정불복심사회\u003c/strong>다. 둘을 바꿔 놓는 지문이 단골.\u003c/li>\u003cli>심리원의 결격은 \u003cstrong>「그 처분에 관여한 자」\u003c/strong>(9조 2항). 「처분청 소속 직원은 될 수 없다」로 넓혀 놓은 지문은 오답.\u003c/li>\u003cli>심리원은 \u003cstrong>의견서를 제출할 뿐 재결을 하지 않는다.\u003c/strong> \u003cstrong>재결권자는 어디까지나 심사청\u003c/strong>이다. 「심리원이 재결한다」는 오답.\u003c/li>\u003cli>행정불복심사회의 답신(答申)에도 \u003cstrong>법적 구속력은 없다.\u003c/strong> 심사청은 답신과 다른 재결도 할 수 있으나, 그 경우 재결서에 이유를 기재해야 한다.\u003c/li>\u003cli>자문 생략 사유를 \u003cstrong>「전부 인용」\u003c/strong>과 \u003cstrong>「각하」\u003c/strong>로 묶어서 기억. 청구인에게 유리한 결론이거나 애초에 심리할 것이 없으면 굳이 외부 검증이 필요 없다는 취지.\u003c/li>\u003cli>절차 순서 암기: \u003cstrong>지명(9조) → 변명서·반론서 → 심리원 의견서(42조) → 자문(43조) → 재결(44조 이하)\u003c/strong>.\u003c/li>\u003c/ul>","search":"審理員 しんりいん 항목 내용 ------ ------ 읽기 しんりいん（심리원） 과목 행정법（행정불복심사법） 한줄 정의 심사청구의 심리 절차를 주재하기 위해, 처분에 관여하지 않은 심사청 소속 직원 중에서 지명되는 자 통설·판례 2014년 平成26년 전부개정으로 신설된 심리의 공정성 확보 장치 의 핵심 개념 구법 하에서는 처분에 관여한 직원이 그대로 심리를 담당하는 일이 있어 「자기가 한 처분을 자기가 심사한다」 는 비판을 받았다. 2014년 전부개정은 이를 시정하기 위해 심리원 제도 를 신설했다. 심사청은 심사청구가 있으면 심사청에 소속된 직원 중에서 심리 절차를 수행할 자를 지명하고, 그 사실을 심사청구인 및 처분청에 통지해야 한다 9조 1항 . 핵심은 제척 除斥 사유 다. 심사청구에 관계된 처분에 관여한 자 , 또는 심사청구인·이해관계인 등은 심리원이 될 수 없다 9조 2항 . 즉 심리원은 「소속 직원이지만 그 처분에는 손대지 않은 사람」이어야 한다. 대비: 심리원은 외부 전문가가 아니라 어디까지나 행정 조직 내부의 직원 이다 — 외부성을 담보하는 것은 뒤에 나오는 행정불복심사회 쪽이다. 심리원은 심리 절차의 지휘자로서 심사청구인·참가인의 구술 의견진술 기회 부여 , 처분청에 대한 변명서 弁明書 제출 요구 , 심사청구인의 반론서 反論書 접수, 증거서류 제출·물건 제출 요구·검증·심문 등 심리에 필요한 조치를 취한다. 또 심사청구인 등에게는 제출서류 등의 열람·사본 교부 청구권 이 보장되어 38조 구법보다 절차의 투명성이 크게 강화되었다. 심리를 마치면 심리원은 재결의 결론에 관한 의견을 정리한 심리원 의견서 審理員意見書 를 작성하여 심사청에 제출한다 42조 . 심사청은 심리원 의견서를 받으면, 일정한 예외에 해당하지 않는 한 행정불복심사회 行政不服審査会 심사청이 지방자치단체의 장인 경우에는 조례로 두는 附属機関 에 자문해야 한다 43조 . 행정불복심사회는 제3자 기관 으로서 심리의 적정성을 외부에서 재점검하는 역할을 하며, 여기에서 비로소 절차의 외부성 이 확보된다. 자문이 불필요한 대표적 경우로는 심사청구인이 자문을 원하지 않는다는 뜻을 표시한 때 , 심사청구가 부적법하여 각하하는 때 , 심사청구를 전부 인용하는 때 참가인의 반대가 없는 경우 등이 있다. 이 흐름 — 심리원 지명 → 심리 → 심리원 의견서 → 행정불복심사회 자문 → 재결 — 이 개정법의 골격이다. 💡 수험 팁 - 「심리원은 외부 유식자 중에서 선임한다」는 오답. 심리원은 심사청 소속 직원 이다. 외부 제3자 기관은 행정불복심사회 다. 둘을 바꿔 놓는 지문이 단골. - 심리원의 결격은 「그 처분에 관여한 자」 9조 2항 . 「처분청 소속 직원은 될 수 없다」로 넓혀 놓은 지문은 오답. - 심리원은 의견서를 제출할 뿐 재결을 하지 않는다. 재결권자는 어디까지나 심사청 이다. 「심리원이 재결한다」는 오답. - 행정불복심사회의 답신 答申 에도 법적 구속력은 없다. 심사청은 답신과 다른 재결도 할 수 있으나, 그 경우 재결서에 이유를 기재해야 한다. - 자문 생략 사유를 「전부 인용」 과 「각하」 로 묶어서 기억. 청구인에게 유리한 결론이거나 애초에 심리할 것이 없으면 굳이 외부 검증이 필요 없다는 취지. - 절차 순서 암기: 지명 9조 → 변명서·반론서 → 심리원 의견서 42조 → 자문 43조 → 재결 44조 이하 ."},"職務行為基準説":{"type":"term","subject":"용어","id":"職務行為基準説","title":"職務行為基準説","sub":"しょくむこういきじゅんせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しょくむこういきじゅんせつ（직무행위기준설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（국가배상 — 국가배상법 1조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국가배상법 1조의 \u003cstrong>「위법」\u003c/strong>은 처분의 결과가 객관적으로 법에 어긋났는지가 아니라, 공무원이 \u003cstrong>직무상 통상 다해야 할 주의의무를 위반\u003c/strong>했는지로 판단해야 한다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>판례의 입장\u003c/strong>（결과위법설이 아님）. 취소소송의 위법성과 국가배상의 위법성은 별개라는 \u003cstrong>위법성 상대설\u003c/strong>로 이어짐\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>국가배상법 1조 1항은 「국가 또는 공공단체의 \u003cstrong>공권력의 행사에 해당하는 공무원\u003c/strong>이 그 직무를 행함에 있어 \u003cstrong>고의 또는 과실\u003c/strong>로 \u003cstrong>위법하게\u003c/strong> 타인에게 손해를 가한 때」 국가·공공단체가 배상책임을 진다고 규정한다. 여기서 말하는 \u003cstrong>「위법」\u003c/strong>이 무엇을 의미하는가가 문제된다.\u003c/p>\n\u003cp>가장 소박한 이해는 \u003cstrong>결과위법설(結果違法説)\u003c/strong> — 처분이 객관적으로 법규에 위반했으면 그것이 곧 국가배상법상의 위법이라는 입장이다. 이에 따르면 취소소송에서 처분이 취소된 이상 국가배상에서도 자동으로 위법이 인정된다. 그러나 판례는 이를 취하지 않는다. \u003cstrong>직무행위기준설\u003c/strong>은 국가배상 제도가 「처분의 효력을 없애는 제도」가 아니라 \u003cstrong>「공무원의 행위를 이유로 국가에 금전배상을 명하는 제도」\u003c/strong>임에 주목하여, 판단의 초점을 \u003cstrong>처분의 결과\u003c/strong>가 아니라 \u003cstrong>공무원의 행위 태양\u003c/strong>에 맞춘다. 즉 \u003cstrong>당해 공무원이 직무상 통상 다해야 할 주의의무를 다하지 않고 만연히(漫然と) 처분을 했다고 인정될 만한 사정이 있는 경우에 한하여\u003c/strong> 위법의 평가를 받는다.\u003c/p>\n\u003cp>이 입장의 실천적 귀결은 \u003cstrong>「처분이 취소되었다고 해서 곧바로 국가배상법상 위법이 되지는 않는다」\u003c/strong>는 점이다(\u003cstrong>위법성 상대설\u003c/strong>). 예컨대 세무서장이 자료를 성실히 수집·검토했는데도 사실 인정을 잘못하여 경정처분이 취소된 경우, 취소소송에서는 위법이지만 국가배상에서는 위법이 아닐 수 있다. 반대로 「국가배상 청구를 하려면 먼저 처분의 취소판결을 받아야 한다」는 것도 아니다 — \u003cstrong>국가배상 청구에는 처분의 공정력(公定力)이 미치지 않으므로 취소소송을 거치지 않고도 곧바로 제기할 수 있다\u003c/strong>는 것이 확립된 판례·통설이다.\u003c/p>\n\u003cp>직무행위기준설이 특히 위력을 발휘하는 것은 \u003cstrong>재판·검찰·입법\u003c/strong>이라는 세 영역이다. 이들 작용은 성질상 「결과적으로 틀릴 수 있음」이 제도에 내재해 있기 때문이다. 재판이 상소심에서 뒤집혔다고 매번 국가배상이 인정된다면 재판관의 독립이 위협받고, 무죄판결이 났다고 공소제기가 언제나 위법이 된다면 검찰권 행사가 위축되며, 위헌판결이 났다고 입법행위가 곧바로 위법이 된다면 국회의 입법재량이 봉쇄된다. 그래서 판례는 이들 영역에서 \u003cstrong>위법성의 문턱을 특히 높게\u003c/strong> 설정한다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>귀결\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>結果違法説\u003c/strong>（결과위법설）\u003c/td>\u003ctd>처분이 \u003cstrong>객관적으로 법규에 위반\u003c/strong>하면 그것이 곧 국가배상법 1조의 위법\u003c/td>\u003ctd>취소판결 = 국배상 위법. \u003cstrong>국가의 책임 범위가 지나치게 넓어짐\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>職務行為基準説\u003c/strong>（직무행위기준설）\u003c/td>\u003ctd>공무원이 \u003cstrong>직무상 통상 다해야 할 주의의무를 위반\u003c/strong>했는가로 판단\u003c/td>\u003ctd>👉 \u003cstrong>판례\u003c/strong>. 취소되어도 국배상 위법이 아닐 수 있음（\u003cstrong>위법성 상대설\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公権力発動要件欠如説\u003c/td>\u003ctd>공권력을 발동하기 위한 법률상의 요건을 갖추지 못했는가로 판단\u003c/td>\u003ctd>결과위법설에 가까운 계열\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>세무서장의 경정처분과 국가배상\u003c/td>\u003ctd>最判平5.3.11\u003c/td>\u003ctd>소득세 경정처분이 취소소송에서 취소된 뒤 국가배상을 청구\u003c/td>\u003ctd>세무서장이 자료를 수집하고 과세요건사실을 인정·판단함에 있어 \u003cstrong>직무상 통상 다해야 할 주의의무를 다하지 않고 만연히 경정을 했다고 인정할 만한 사정이 있는 경우에 한하여\u003c/strong> 위법. \u003cstrong>직무행위기준설의 리딩 케이스\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>재판관의 재판과 국가배상\u003c/td>\u003ctd>最判昭57.3.12\u003c/td>\u003ctd>재판의 내용이 잘못되었음을 이유로 국가배상 청구\u003c/td>\u003ctd>상소 등으로 시정되어야 할 하자가 있어도 곧바로 위법이 되지는 않고, 재판관이 \u003cstrong>위법 또는 부당한 목적으로 재판을 하는 등 부여된 권한의 취지에 명백히 배치되게 이를 행사했다고 인정될 만한 특별한 사정\u003c/strong>이 필요\u003c/td>\u003c/tr>\u003ctr>\u003ctd>芦別事件（검찰관의 공소제기와 국가배상）\u003c/td>\u003ctd>最判昭53.10.20\u003c/td>\u003ctd>무죄판결이 확정된 자가 공소제기의 위법을 이유로 국가배상 청구\u003c/td>\u003ctd>\u003cstrong>무죄판결이 확정되었다는 것만으로 공소제기가 위법이 되지는 않는다.\u003c/strong> 공소제기 시점의 검찰관의 판단이 \u003cstrong>경험칙·논리칙에 비추어 합리성을 결하는 때에 한하여\u003c/strong> 위법\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在宅投票制廃止事件（재택투표제 폐지 사건）\u003c/td>\u003ctd>最判昭60.11.21\u003c/td>\u003ctd>재택투표 제도를 폐지하고 부활시키지 않은 국회의 입법행위·입법부작위\u003c/td>\u003ctd>\u003cstrong>원칙적으로 국가배상법상 위법이 아니다.\u003c/strong> \u003cstrong>입법 내용이 헌법의 일의적(一義的) 문언에 위반함에도 굳이 입법을 하는 것과 같은, 쉽사리 상정하기 어려운 예외적인 경우\u003c/strong>가 아닌 한 위법이 되지 않음（극히 높은 문턱）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>在外邦人選挙権訴訟（재외국민 선거권 소송）\u003c/td>\u003ctd>最大判平17.9.14\u003c/td>\u003ctd>재외국민의 선거권 행사를 오랫동안 제한한 공직선거법의 입법부작위\u003c/td>\u003ctd>\u003cstrong>국가배상 청구 인용\u003c/strong>. 국민에게 헌법상 보장된 권리 행사의 기회를 확보하기 위해 \u003cstrong>입법 조치를 취하는 것이 필요불가결하고 그것이 명백함에도 국회가 정당한 이유 없이 장기간 이를 게을리한 경우\u003c/strong>에는 위법. \u003cstrong>입법부작위에 국가배상을 인정한 획기적 판례\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>핵심 문구를 통째로 암기: 「직무상 통상 다해야 할 주의의무」\u003c/strong>. 이 표현이 지문에 나오면 직무행위기준설이다.\u003c/li>\u003cli>\u003cstrong>「처분이 취소소송에서 취소되면 당연히 국가배상법상 위법이 된다」는 오답.\u003c/strong> 위법성은 \u003cstrong>상대적\u003c/strong>이다. 이것이 최다 출제 포인트.\u003c/li>\u003cli>반대 방향의 함정도 주의: \u003cstrong>국가배상 청구를 하는 데 처분의 취소판결을 미리 받아 둘 필요는 없다.\u003c/strong> 공정력은 국가배상 청구를 막지 않는다.\u003c/li>\u003cli>대비: \u003cstrong>芦別事件\u003c/strong> — \u003cstrong>「무죄 확정 = 공소제기 위법」이 아니다.\u003c/strong> 마찬가지로 \u003cstrong>「상소심에서 파기 = 재판 위법」이 아니다\u003c/strong>(最判昭57.3.12).\u003c/li>\u003cli>입법 국배는 \u003cstrong>두 판례를 대비\u003c/strong>로 묶어라. \u003cstrong>在宅投票制廃止事件 = 원칙(청구 기각, 문턱 극히 높음)\u003c/strong> ↔ \u003cstrong>在外邦人選挙権訴訟 = 예외(청구 인용)\u003c/strong>. 후자에서 최고재가 문턱을 다소 완화·구체화했다는 흐름까지.\u003c/li>\u003cli>국가배상법 1조는 \u003cstrong>과실책임\u003c/strong>(고의 또는 과실 필요). 무과실책임인 \u003cstrong>\u003cspan>公の営造物\u003c/span>\u003c/strong>의 2조와 반드시 대비할 것.\u003c/li>\u003cli>공무원 개인은 피해자에게 직접 책임을 지지 않는다(판례). 국가가 배상한 뒤 \u003cstrong>고의 또는 중대한 과실\u003c/strong>이 있는 때에만 그 공무원에게 \u003cstrong>구상\u003c/strong>할 수 있다(1조 2항). \u003cstrong>「경과실로도 구상할 수 있다」는 오답.\u003c/strong>\u003c/li>\u003c/ul>","search":"職務行為基準説 しょくむこういきじゅんせつ 항목 내용 ------ ------ 읽기 しょくむこういきじゅんせつ（직무행위기준설） 과목 행정법（국가배상 — 국가배상법 1조） 한줄 정의 국가배상법 1조의 「위법」 은 처분의 결과가 객관적으로 법에 어긋났는지가 아니라, 공무원이 직무상 통상 다해야 할 주의의무를 위반 했는지로 판단해야 한다는 학설 통설·판례 판례의 입장 （결과위법설이 아님）. 취소소송의 위법성과 국가배상의 위법성은 별개라는 위법성 상대설 로 이어짐 개념 국가배상법 1조 1항은 「국가 또는 공공단체의 공권력의 행사에 해당하는 공무원 이 그 직무를 행함에 있어 고의 또는 과실 로 위법하게 타인에게 손해를 가한 때」 국가·공공단체가 배상책임을 진다고 규정한다. 여기서 말하는 「위법」 이 무엇을 의미하는가가 문제된다. 가장 소박한 이해는 결과위법설 結果違法説 — 처분이 객관적으로 법규에 위반했으면 그것이 곧 국가배상법상의 위법이라는 입장이다. 이에 따르면 취소소송에서 처분이 취소된 이상 국가배상에서도 자동으로 위법이 인정된다. 그러나 판례는 이를 취하지 않는다. 직무행위기준설 은 국가배상 제도가 「처분의 효력을 없애는 제도」가 아니라 「공무원의 행위를 이유로 국가에 금전배상을 명하는 제도」 임에 주목하여, 판단의 초점을 처분의 결과 가 아니라 공무원의 행위 태양 에 맞춘다. 즉 당해 공무원이 직무상 통상 다해야 할 주의의무를 다하지 않고 만연히 漫然と 처분을 했다고 인정될 만한 사정이 있는 경우에 한하여 위법의 평가를 받는다. 이 입장의 실천적 귀결은 「처분이 취소되었다고 해서 곧바로 국가배상법상 위법이 되지는 않는다」 는 점이다 위법성 상대설 . 예컨대 세무서장이 자료를 성실히 수집·검토했는데도 사실 인정을 잘못하여 경정처분이 취소된 경우, 취소소송에서는 위법이지만 국가배상에서는 위법이 아닐 수 있다. 반대로 「국가배상 청구를 하려면 먼저 처분의 취소판결을 받아야 한다」는 것도 아니다 — 국가배상 청구에는 처분의 공정력 公定力 이 미치지 않으므로 취소소송을 거치지 않고도 곧바로 제기할 수 있다 는 것이 확립된 판례·통설이다. 직무행위기준설이 특히 위력을 발휘하는 것은 재판·검찰·입법 이라는 세 영역이다. 이들 작용은 성질상 「결과적으로 틀릴 수 있음」이 제도에 내재해 있기 때문이다. 재판이 상소심에서 뒤집혔다고 매번 국가배상이 인정된다면 재판관의 독립이 위협받고, 무죄판결이 났다고 공소제기가 언제나 위법이 된다면 검찰권 행사가 위축되며, 위헌판결이 났다고 입법행위가 곧바로 위법이 된다면 국회의 입법재량이 봉쇄된다. 그래서 판례는 이들 영역에서 위법성의 문턱을 특히 높게 설정한다. 학설 학설 내용 귀결 ------ ------ ------ 結果違法説 （결과위법설） 처분이 객관적으로 법규에 위반 하면 그것이 곧 국가배상법 1조의 위법 취소판결 = 국배상 위법. 국가의 책임 범위가 지나치게 넓어짐 職務行為基準説 （직무행위기준설） 공무원이 직무상 통상 다해야 할 주의의무를 위반 했는가로 판단 👉 판례 . 취소되어도 국배상 위법이 아닐 수 있음（ 위법성 상대설 ） 公権力発動要件欠如説 공권력을 발동하기 위한 법률상의 요건을 갖추지 못했는가로 판단 결과위법설에 가까운 계열 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 세무서장의 경정처분과 국가배상 最判平5.3.11 소득세 경정처분이 취소소송에서 취소된 뒤 국가배상을 청구 세무서장이 자료를 수집하고 과세요건사실을 인정·판단함에 있어 직무상 통상 다해야 할 주의의무를 다하지 않고 만연히 경정을 했다고 인정할 만한 사정이 있는 경우에 한하여 위법. 직무행위기준설의 리딩 케이스 재판관의 재판과 국가배상 最判昭57.3.12 재판의 내용이 잘못되었음을 이유로 국가배상 청구 상소 등으로 시정되어야 할 하자가 있어도 곧바로 위법이 되지는 않고, 재판관이 위법 또는 부당한 목적으로 재판을 하는 등 부여된 권한의 취지에 명백히 배치되게 이를 행사했다고 인정될 만한 특별한 사정 이 필요 芦別事件（검찰관의 공소제기와 국가배상） 最判昭53.10.20 무죄판결이 확정된 자가 공소제기의 위법을 이유로 국가배상 청구 무죄판결이 확정되었다는 것만으로 공소제기가 위법이 되지는 않는다. 공소제기 시점의 검찰관의 판단이 경험칙·논리칙에 비추어 합리성을 결하는 때에 한하여 위법 在宅投票制廃止事件（재택투표제 폐지 사건） 最判昭60.11.21 재택투표 제도를 폐지하고 부활시키지 않은 국회의 입법행위·입법부작위 원칙적으로 국가배상법상 위법이 아니다. 입법 내용이 헌법의 일의적 一義的 문언에 위반함에도 굳이 입법을 하는 것과 같은, 쉽사리 상정하기 어려운 예외적인 경우 가 아닌 한 위법이 되지 않음（극히 높은 문턱） 在外邦人選挙権訴訟（재외국민 선거권 소송） 最大判平17.9.14 재외국민의 선거권 행사를 오랫동안 제한한 공직선거법의 입법부작위 국가배상 청구 인용 . 국민에게 헌법상 보장된 권리 행사의 기회를 확보하기 위해 입법 조치를 취하는 것이 필요불가결하고 그것이 명백함에도 국회가 정당한 이유 없이 장기간 이를 게을리한 경우 에는 위법. 입법부작위에 국가배상을 인정한 획기적 판례 💡 수험 팁 - 핵심 문구를 통째로 암기: 「직무상 통상 다해야 할 주의의무」 . 이 표현이 지문에 나오면 직무행위기준설이다. - 「처분이 취소소송에서 취소되면 당연히 국가배상법상 위법이 된다」는 오답. 위법성은 상대적 이다. 이것이 최다 출제 포인트. - 반대 방향의 함정도 주의: 국가배상 청구를 하는 데 처분의 취소판결을 미리 받아 둘 필요는 없다. 공정력은 국가배상 청구를 막지 않는다. - 대비: 芦別事件 — 「무죄 확정 = 공소제기 위법」이 아니다. 마찬가지로 「상소심에서 파기 = 재판 위법」이 아니다 最判昭57.3.12 . - 입법 국배는 두 판례를 대비 로 묶어라. 在宅投票制廃止事件 = 원칙 청구 기각, 문턱 극히 높음 ↔ 在外邦人選挙権訴訟 = 예외 청구 인용 . 후자에서 최고재가 문턱을 다소 완화·구체화했다는 흐름까지. - 국가배상법 1조는 과실책임 고의 또는 과실 필요 . 무과실책임인 公の営造物 용어/公の営造物.md 의 2조와 반드시 대비할 것. - 공무원 개인은 피해자에게 직접 책임을 지지 않는다 판례 . 국가가 배상한 뒤 고의 또는 중대한 과실 이 있는 때에만 그 공무원에게 구상 할 수 있다 1조 2항 . 「경과실로도 구상할 수 있다」는 오답."},"損失補償":{"type":"term","subject":"용어","id":"損失補償","title":"損失補償","sub":"そんしつほしょう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>そんしつほしょう（손실보상）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（국가보상 — 손실보상）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>적법한\u003c/strong> 공권력 행사에 의해 특정인에게 가해진 \u003cstrong>\u003ca href=\"#/e/%E7%89%B9%E5%88%A5%E3%81%AE%E7%8A%A0%E7%89%B2\">特別の犠牲\u003c/a>\u003c/strong>에 대하여, 전체의 부담으로 이를 조절하기 위해 행하는 \u003cstrong>재산적 보상\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>근거는 \u003cstrong>헌법 29조 3항\u003c/strong>. 법률에 보상 규정이 없어도 동 조항을 직접 근거로 청구할 수 있다는 \u003cstrong>\u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>\u003c/strong>이 통설·판례\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>손실보상의 근거는 헌법 29조 3항 — \u003cstrong>「사유재산은 정당한 보상 하에 이를 공공을 위하여 사용할 수 있다」\u003c/strong>이다. 도로나 댐을 만들기 위해 특정인의 토지를 수용하는 경우, 그 사업의 이익은 사회 전체가 누리는데 손실은 그 토지 소유자 한 사람이 떠안게 된다. 이 \u003cstrong>불공평을 사회 전체의 부담으로 조절\u003c/strong>하는 것이 손실보상 제도의 취지다. 따라서 손실보상은 \u003cstrong>가해행위가 적법하다는 것을 대전제\u003c/strong>로 하며, \u003cstrong>고의·과실을 전혀 묻지 않는다\u003c/strong>.\u003c/p>\n\u003cp>여기서 결정적인 구별이 나온다. \u003cstrong>위법\u003c/strong>한 공권력 행사로 인한 손해는 \u003cstrong>국가배상\u003c/strong>(국가배상법), \u003cstrong>적법\u003c/strong>한 공권력 행사로 인한 손실은 \u003cstrong>손실보상\u003c/strong>(헌법 29조 3항·토지수용법 등)이다. 「위법 → 배상 / 적법 → 보상」이라는 축이 국가보상법 전체를 관통하는 뼈대이므로 반드시 표로 정리해 두어야 한다.\u003c/p>\n\u003cp>모든 재산상 불이익이 보상 대상이 되는 것은 아니다. 재산권에는 본래 \u003cstrong>사회적 제약\u003c/strong>이 내재하므로, 그 제약의 범위 내에 머무는 손실은 참아야 한다(受忍限度). 보상이 필요한 것은 그 한계를 넘는 \u003cstrong>\u003ca href=\"#/e/%E7%89%B9%E5%88%A5%E3%81%AE%E7%8A%A0%E7%89%B2\">特別の犠牲\u003c/a>\u003c/strong>뿐이며, 그 판단은 \u003cstrong>형식적 기준(침해 대상이 일반적인가 특정인인가)\u003c/strong>과 \u003cstrong>실질적 기준(침해가 재산권에 내재하는 사회적 제약을 넘는 본질적인 것인가)\u003c/strong>을 종합하여 이루어진다.\u003c/p>\n\u003cp>보상의 정도, 즉 헌법이 말하는 \u003cstrong>「정당한 보상」\u003c/strong>의 의미에 대해서는 완전보상설과 상당보상설이 대립한다. 판례는 전후 농지개혁이라는 특수한 사정 아래에서는 상당보상으로 족하다고 했으나, 토지수용법에 의한 통상의 수용에 대해서는 \u003cstrong>수용 전후를 통해 피수용자의 재산 가치가 동등하게 유지되도록 하는 완전한 보상\u003c/strong>을 요한다고 하여 사실상 완전보상 쪽으로 정리되었다. 보상은 원칙적으로 \u003cstrong>금전\u003c/strong>으로 하며, 지급 시기에 관해 판례는 \u003cstrong>보상이 재산의 제공과 반드시 동시에 이루어질 필요는 없다\u003c/strong>고 본다.\u003c/p>\n\u003ch2>국가배상 vs 손실보상 (핵심 대비표)\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>비교 항목\u003c/th>\u003cth>\u003cstrong>国家賠償\u003c/strong>（국가배상）\u003c/th>\u003cth>\u003cstrong>損失補償\u003c/strong>（손실보상）\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>행위의 적법성\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>위법\u003c/strong>한 행위\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>한 행위\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근거 규정\u003c/td>\u003ctd>헌법 17조 → \u003cstrong>국가배상법\u003c/strong>\u003c/td>\u003ctd>헌법 \u003cstrong>29조 3항\u003c/strong> → 토지수용법 등\u003c/td>\u003c/tr>\u003ctr>\u003ctd>일반법의 유무\u003c/td>\u003ctd>\u003cstrong>있음\u003c/strong>（국가배상법）\u003c/td>\u003ctd>\u003cstrong>없음\u003c/strong>（개별법이 산재. 그래서 \u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>이 문제됨）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>고의·과실\u003c/td>\u003ctd>\u003cstrong>1조는 필요\u003c/strong>（과실책임）／\u003cstrong>2조는 불요\u003c/strong>（무과실책임）\u003c/td>\u003ctd>\u003cstrong>불요\u003c/strong>（적법 행위이므로 애초에 문제되지 않음）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>보호 법익\u003c/td>\u003ctd>재산적 손해 + \u003cstrong>생명·신체·정신적 손해\u003c/strong>（위자료 포함）\u003c/td>\u003ctd>\u003cstrong>원칙적으로 재산적 손실만\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>성립의 핵심 요건\u003c/td>\u003ctd>공무원의 위법한 직무행위 / \u003cstrong>\u003cspan>公の営造物\u003c/span>\u003c/strong>의 설치·관리의 하자\u003c/td>\u003ctd>\u003cstrong>\u003ca href=\"#/e/%E7%89%B9%E5%88%A5%E3%81%AE%E7%8A%A0%E7%89%B2\">特別の犠牲\u003c/a>\u003c/strong>의 존재\u003c/td>\u003c/tr>\u003ctr>\u003ctd>쟁송 형식\u003c/td>\u003ctd>민사소송（통설·실무）\u003c/td>\u003ctd>\u003cstrong>당사자소송\u003c/strong>（형식적 당사자소송 포함）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>完全補償説\u003c/strong>（완전보상설）\u003c/td>\u003ctd>「정당한 보상」이란 \u003cstrong>손실 전부\u003c/strong>의 보상, 즉 \u003cstrong>시가(市価) 전액\u003c/strong>을 의미한다\u003c/td>\u003ctd>👉 \u003cstrong>토지수용법상의 수용에 관한 판례의 입장\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>相当補償説\u003c/strong>（상당보상설）\u003c/td>\u003ctd>그때의 경제 상태에서 \u003cstrong>합리적으로 산출된 상당한 액\u003c/strong>이면 족하고, 반드시 시가 전액일 필요는 없다\u003c/td>\u003ctd>👉 \u003cstrong>農地改革事件의 입장\u003c/strong>（전후 농지개혁이라는 특수 사정）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>農地改革事件（농지개혁 사건）\u003c/td>\u003ctd>最大判昭28.12.23\u003c/td>\u003ctd>전후 농지개혁으로 초저가에 농지를 매수당한 지주가 헌법 29조 3항 위반 주장\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「정당한 보상」이란 그때의 경제 상태에서 \u003cstrong>합리적으로 산출된 상당한 액\u003c/strong>을 말하며 \u003cstrong>항상 완전한 보상을 요하는 것은 아니다\u003c/strong>（\u003cstrong>相当補償説\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>土地収用法에 의한 수용의 보상\u003c/td>\u003ctd>最判昭48.10.18\u003c/td>\u003ctd>토지수용법에 의한 수용 보상액의 기준\u003c/td>\u003ctd>\u003cstrong>완전보상\u003c/strong>을 요한다. \u003cstrong>수용 전후를 통해 피수용자의 재산 가치가 동등하게 유지되도록\u003c/strong> 하는 보상이어야 함（\u003cstrong>完全補償説\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>河川附近地制限令事件（하천부근지제한령 사건）\u003c/td>\u003ctd>最大判昭43.11.27\u003c/td>\u003ctd>법령에 보상 규정이 없는데도 재산권을 제한당함\u003c/td>\u003ctd>법령에 보상 규정이 없어도 \u003cstrong>헌법 29조 3항을 직접 근거로 보상을 청구할 여지가 있다\u003c/strong> → \u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>奈良県ため池条例事件（나라현 저수지 조례 사건）\u003c/td>\u003ctd>最大判昭38.6.26\u003c/td>\u003ctd>저수지 제방에서의 경작을 조례로 금지, 보상 없음\u003c/td>\u003ctd>\u003cstrong>보상 불요\u003c/strong>. 재해 방지를 위한 제한은 \u003cstrong>재산권에 내재하는 사회적 제약\u003c/strong>으로서 소유자가 \u003cstrong>당연히 수인해야 할 책무\u003c/strong>이며 \u003ca href=\"#/e/%E7%89%B9%E5%88%A5%E3%81%AE%E7%8A%A0%E7%89%B2\">特別の犠牲\u003c/a>에 해당하지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「위법 → 국가배상 / 적법 → 손실보상」\u003c/strong>. 이 한 줄이 출발점. 「위법한 처분에 대해 손실보상을 청구한다」는 지문은 오답.\u003c/li>\u003cli>대비: \u003cstrong>국가배상법은 일반법이 있으나, 손실보상에는 일반법이 없다.\u003c/strong> 개별법에 보상 규정이 빠져 있을 때 어떻게 하는가 → \u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>으로 연결하는 것이 정석 출제 흐름.\u003c/li>\u003cli>「정당한 보상」의 판례는 \u003cstrong>두 개가 갈린다\u003c/strong>는 점이 함정. \u003cstrong>農地改革事件 = 상당보상설\u003c/strong>, \u003cstrong>土地収用法 사안 = 완전보상설\u003c/strong>. 어느 사안이냐를 먼저 확인할 것.\u003c/li>\u003cli>손실보상은 \u003cstrong>원칙적으로 재산적 손실만\u003c/strong> 대상. 생명·신체 침해(예: 예방접종 부작용)는 조문상 재산권 규정인 29조 3항으로는 잡기 어려워 \u003cstrong>「국가보상의 골짜기(谷間)」 문제\u003c/strong>로 불린다. 위자료가 나오는 것은 \u003cstrong>국가배상\u003c/strong> 쪽이다.\u003c/li>\u003cli>판례상 \u003cstrong>보상은 재산의 제공과 반드시 동시에 이루어져야 하는 것은 아니다.\u003c/strong> 「동시이행이 헌법상 요구된다」는 지문은 오답.\u003c/li>\u003cli>손실보상 청구의 소송 형식은 \u003cstrong>당사자소송\u003c/strong>. 「취소소송으로 다툰다」는 오답(단, 수용재결 중 보상액에 관한 다툼은 \u003cstrong>형식적 당사자소송\u003c/strong>으로 사업시행자·토지소유자 사이에서 한다).\u003c/li>\u003c/ul>","search":"損失補償 そんしつほしょう 항목 내용 ------ ------ 읽기 そんしつほしょう（손실보상） 과목 행정법（국가보상 — 손실보상） 한줄 정의 적법한 공권력 행사에 의해 특정인에게 가해진 特別の犠牲 용어/特別の犠牲.md 에 대하여, 전체의 부담으로 이를 조절하기 위해 행하는 재산적 보상 통설·판례 근거는 헌법 29조 3항 . 법률에 보상 규정이 없어도 동 조항을 직접 근거로 청구할 수 있다는 請求権発生説 용어/請求権発生説.md 이 통설·판례 개념 손실보상의 근거는 헌법 29조 3항 — 「사유재산은 정당한 보상 하에 이를 공공을 위하여 사용할 수 있다」 이다. 도로나 댐을 만들기 위해 특정인의 토지를 수용하는 경우, 그 사업의 이익은 사회 전체가 누리는데 손실은 그 토지 소유자 한 사람이 떠안게 된다. 이 불공평을 사회 전체의 부담으로 조절 하는 것이 손실보상 제도의 취지다. 따라서 손실보상은 가해행위가 적법하다는 것을 대전제 로 하며, 고의·과실을 전혀 묻지 않는다 . 여기서 결정적인 구별이 나온다. 위법 한 공권력 행사로 인한 손해는 국가배상 국가배상법 , 적법 한 공권력 행사로 인한 손실은 손실보상 헌법 29조 3항·토지수용법 등 이다. 「위법 → 배상 / 적법 → 보상」이라는 축이 국가보상법 전체를 관통하는 뼈대이므로 반드시 표로 정리해 두어야 한다. 모든 재산상 불이익이 보상 대상이 되는 것은 아니다. 재산권에는 본래 사회적 제약 이 내재하므로, 그 제약의 범위 내에 머무는 손실은 참아야 한다 受忍限度 . 보상이 필요한 것은 그 한계를 넘는 特別の犠牲 용어/特別の犠牲.md 뿐이며, 그 판단은 형식적 기준 침해 대상이 일반적인가 특정인인가 과 실질적 기준 침해가 재산권에 내재하는 사회적 제약을 넘는 본질적인 것인가 을 종합하여 이루어진다. 보상의 정도, 즉 헌법이 말하는 「정당한 보상」 의 의미에 대해서는 완전보상설과 상당보상설이 대립한다. 판례는 전후 농지개혁이라는 특수한 사정 아래에서는 상당보상으로 족하다고 했으나, 토지수용법에 의한 통상의 수용에 대해서는 수용 전후를 통해 피수용자의 재산 가치가 동등하게 유지되도록 하는 완전한 보상 을 요한다고 하여 사실상 완전보상 쪽으로 정리되었다. 보상은 원칙적으로 금전 으로 하며, 지급 시기에 관해 판례는 보상이 재산의 제공과 반드시 동시에 이루어질 필요는 없다 고 본다. 국가배상 vs 손실보상 핵심 대비표 비교 항목 国家賠償 （국가배상） 損失補償 （손실보상） ----------- ------------------------ ------------------------ 행위의 적법성 위법 한 행위 적법 한 행위 근거 규정 헌법 17조 → 국가배상법 헌법 29조 3항 → 토지수용법 등 일반법의 유무 있음 （국가배상법） 없음 （개별법이 산재. 그래서 請求権発生説 용어/請求権発生説.md 이 문제됨） 고의·과실 1조는 필요 （과실책임）／ 2조는 불요 （무과실책임） 불요 （적법 행위이므로 애초에 문제되지 않음） 보호 법익 재산적 손해 + 생명·신체·정신적 손해 （위자료 포함） 원칙적으로 재산적 손실만 성립의 핵심 요건 공무원의 위법한 직무행위 / 公の営造物 용어/公の営造物.md 의 설치·관리의 하자 特別の犠牲 용어/特別の犠牲.md 의 존재 쟁송 형식 민사소송（통설·실무） 당사자소송 （형식적 당사자소송 포함） 학설 학설 내용 비고 ------ ------ ------ 完全補償説 （완전보상설） 「정당한 보상」이란 손실 전부 의 보상, 즉 시가 市価 전액 을 의미한다 👉 토지수용법상의 수용에 관한 판례의 입장 相当補償説 （상당보상설） 그때의 경제 상태에서 합리적으로 산출된 상당한 액 이면 족하고, 반드시 시가 전액일 필요는 없다 👉 農地改革事件의 입장 （전후 농지개혁이라는 특수 사정） 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 農地改革事件（농지개혁 사건） 最大判昭28.12.23 전후 농지개혁으로 초저가에 농지를 매수당한 지주가 헌법 29조 3항 위반 주장 합헌 . 「정당한 보상」이란 그때의 경제 상태에서 합리적으로 산출된 상당한 액 을 말하며 항상 완전한 보상을 요하는 것은 아니다 （ 相当補償説 ） 土地収用法에 의한 수용의 보상 最判昭48.10.18 토지수용법에 의한 수용 보상액의 기준 완전보상 을 요한다. 수용 전후를 통해 피수용자의 재산 가치가 동등하게 유지되도록 하는 보상이어야 함（ 完全補償説 ） 河川附近地制限令事件（하천부근지제한령 사건） 最大判昭43.11.27 법령에 보상 규정이 없는데도 재산권을 제한당함 법령에 보상 규정이 없어도 헌법 29조 3항을 직접 근거로 보상을 청구할 여지가 있다 → 請求権発生説 용어/請求権発生説.md 奈良県ため池条例事件（나라현 저수지 조례 사건） 最大判昭38.6.26 저수지 제방에서의 경작을 조례로 금지, 보상 없음 보상 불요 . 재해 방지를 위한 제한은 재산권에 내재하는 사회적 제약 으로서 소유자가 당연히 수인해야 할 책무 이며 特別の犠牲 용어/特別の犠牲.md 에 해당하지 않음 💡 수험 팁 - 「위법 → 국가배상 / 적법 → 손실보상」 . 이 한 줄이 출발점. 「위법한 처분에 대해 손실보상을 청구한다」는 지문은 오답. - 대비: 국가배상법은 일반법이 있으나, 손실보상에는 일반법이 없다. 개별법에 보상 규정이 빠져 있을 때 어떻게 하는가 → 請求権発生説 용어/請求権発生説.md 으로 연결하는 것이 정석 출제 흐름. - 「정당한 보상」의 판례는 두 개가 갈린다 는 점이 함정. 農地改革事件 = 상당보상설 , 土地収用法 사안 = 완전보상설 . 어느 사안이냐를 먼저 확인할 것. - 손실보상은 원칙적으로 재산적 손실만 대상. 생명·신체 침해 예: 예방접종 부작용 는 조문상 재산권 규정인 29조 3항으로는 잡기 어려워 「국가보상의 골짜기 谷間 」 문제 로 불린다. 위자료가 나오는 것은 국가배상 쪽이다. - 판례상 보상은 재산의 제공과 반드시 동시에 이루어져야 하는 것은 아니다. 「동시이행이 헌법상 요구된다」는 지문은 오답. - 손실보상 청구의 소송 형식은 당사자소송 . 「취소소송으로 다툰다」는 오답 단, 수용재결 중 보상액에 관한 다툼은 형식적 당사자소송 으로 사업시행자·토지소유자 사이에서 한다 ."},"特別の犠牲":{"type":"term","subject":"용어","id":"特別の犠牲","title":"特別の犠牲","sub":"とくべつのぎせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>とくべつのぎせい（특별한 희생）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（국가보상 — 손실보상）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>재산권에 내재하는 \u003cstrong>사회적 제약의 한계를 넘어\u003c/strong> 특정인에게 가해진 재산상의 손실로서, \u003cstrong>\u003ca href=\"#/e/%E6%90%8D%E5%A4%B1%E8%A3%9C%E5%84%9F\">損失補償\u003c/a>을 필요로 하는지 여부를 가르는 기준\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>형식적 기준 + 실질적 기준의 종합 판단\u003c/strong>. 다만 \u003cstrong>실질적 기준을 중시\u003c/strong>하는 것이 오늘날의 통설\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>재산권은 절대 불가침이 아니다. 헌법 29조 2항은 \u003cstrong>「재산권의 내용은 공공의 복지에 적합하도록 법률로 정한다」\u003c/strong>고 규정하여, 재산권에는 본래 \u003cstrong>사회적 제약(社会的制約)\u003c/strong>이 내재한다는 점을 밝히고 있다. 건축기준법상의 높이 제한이나 소방법상의 규제처럼, 사회 구성원 모두가 감수해야 할 정도의 제한은 아무리 불편해도 보상 대상이 아니다. 이를 \u003cstrong>受忍限度(수인한도) 내의 제약\u003c/strong>이라 한다.\u003c/p>\n\u003cp>그러나 특정인만이, 그것도 재산권의 본질을 침해할 정도로 무거운 부담을 지게 된다면 이야기가 다르다. 그 사람 혼자 사회 전체를 위한 비용을 떠안는 셈이므로 \u003cstrong>평등원칙\u003c/strong>에 반한다. 이때 비로소 \u003cstrong>「특별한 희생」\u003c/strong>이 인정되어 헌법 29조 3항에 따른 보상이 필요해진다. 즉 특별한 희생은 \u003cstrong>「참아야 할 제약」과 「보상받아야 할 침해」를 가르는 분수령\u003c/strong>이다.\u003c/p>\n\u003cp>그 판단은 전통적으로 두 가지 기준을 종합하여 이루어진다. 첫째, \u003cstrong>형식적 기준\u003c/strong> — 침해 행위가 \u003cstrong>일반적인가 특정인(또는 특정 범위의 소수자)을 겨냥한 것인가\u003c/strong>. 널리 일반인에게 미치는 규제라면 사회적 제약일 가능성이 높고, 소수의 특정인만 겨냥한다면 특별한 희생 쪽으로 기운다. 둘째, \u003cstrong>실질적 기준\u003c/strong> — 침해의 정도가 \u003cstrong>재산권에 내재하는 사회적 제약을 넘어 재산권의 본질적 내용을 침해하는 정도에 이르렀는가\u003c/strong>. 종래의 이용을 그대로 계속할 수 있는 정도의 제한인지, 아니면 사실상 이용 자체를 봉쇄하는 것인지가 갈림길이 된다.\u003c/p>\n\u003cp>오늘날의 통설은 형식적 기준만으로는 판단이 어렵다고 보아 \u003cstrong>실질적 기준을 중심에 두고 형식적 기준을 보조적으로 고려\u003c/strong>한다. 규제의 목적도 중요한 고려 요소인데, \u003cstrong>「위험 방지·재해 예방」과 같은 소극적·경찰적 목적\u003c/strong>의 규제는 사회적 제약으로 보아 보상이 불필요한 경향이 있고, \u003cstrong>「공공사업을 위해 적극적으로 재산을 이용·취득」\u003c/strong>하는 유형은 특별한 희생으로 보아 보상이 필요한 경향이 있다. 奈良県ため池条例事件이 전자의 대표례다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>형식적 기준설\u003c/td>\u003ctd>침해 행위가 \u003cstrong>일반적인가, 특정인을 겨냥한 것인가\u003c/strong>만으로 판단\u003c/td>\u003ctd>단독으로는 불충분. 일반적 규제라도 극히 가혹할 수 있음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>실질적 기준설\u003c/td>\u003ctd>침해가 \u003cstrong>재산권에 내재하는 사회적 제약을 넘는 본질적인 것인가\u003c/strong>로 판단\u003c/td>\u003ctd>👉 오늘날 \u003cstrong>중심적 기준\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>종합판단설\u003c/strong>（형식 + 실질）\u003c/td>\u003ctd>\u003cstrong>양 기준을 종합\u003c/strong>하되, 규제의 \u003cstrong>목적·태양·정도\u003c/strong>를 함께 고려하여 개별적으로 판단\u003c/td>\u003ctd>👉 \u003cstrong>통설·판례의 실질\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>奈良県ため池条例事件（나라현 저수지 조례 사건）\u003c/td>\u003ctd>最大判昭38.6.26\u003c/td>\u003ctd>조례로 저수지 제방에서의 경작·건축을 금지, 보상 규정은 없음\u003c/td>\u003ctd>\u003cstrong>특별한 희생 아님 → 보상 불요\u003c/strong>. 재해 방지를 위한 제한은 \u003cstrong>재산권을 행사하는 자가 당연히 수인해야 할 책무\u003c/strong>이며, 헌법·민법의 보호 밖에 있는 행위를 금지한 데 지나지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>河川附近地制限令事件（하천부근지제한령 사건）\u003c/td>\u003ctd>最大判昭43.11.27\u003c/td>\u003ctd>하천부근지 지정으로 종래 계속해 온 砂利(자갈) 채취가 사실상 불가능해짐\u003c/td>\u003ctd>일반적으로는 수인해야 할 제한이지만, \u003cstrong>종래 적법하게 계속해 온 사업이 불가능해져 현저한 손실을 입는 경우\u003c/strong>에는 \u003cstrong>특별한 희생\u003c/strong>에 해당할 수 있어 \u003cstrong>헌법 29조 3항에 의해 직접 보상을 청구할 여지가 있다\u003c/strong>（→ \u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>두 기준을 반드시 짝으로 암기.\u003c/strong> \u003cstrong>형식적 기준 = 「누구에게?」(일반적 ↔ 특정인)\u003c/strong>, \u003cstrong>실질적 기준 = 「얼마나?」(사회적 제약 내 ↔ 본질적 침해)\u003c/strong>. 어느 하나만 쓴 지문은 불완전하다.\u003c/li>\u003cli>대비: \u003cstrong>奈良県ため池条例事件(보상 불요) ↔ 河川附近地制限令事件(보상 여지 있음)\u003c/strong>. 이 두 판례는 \u003cstrong>결론이 정반대\u003c/strong>라 세트로 출제된다. 저수지 = \u003cstrong>위험 방지 목적\u003c/strong> → 수인, 하천부근지 = \u003cstrong>종래 사업의 봉쇄\u003c/strong> → 특별한 희생.\u003c/li>\u003cli>규제 목적으로 갈라라. \u003cstrong>소극적·경찰적 규제(위험·재해 방지) → 보상 불요\u003c/strong> 경향 / \u003cstrong>적극적·공공사업적 이용 → 보상 필요\u003c/strong> 경향.\u003c/li>\u003cli>「특별한 희생이 있으면 곧바로 보상이 인정된다」는 것까지는 맞지만, \u003cstrong>법률에 보상 규정이 없을 때 어떻게 하는가\u003c/strong>는 별개의 논점이다 → \u003ca href=\"#/e/%E8%AB%8B%E6%B1%82%E6%A8%A9%E7%99%BA%E7%94%9F%E8%AA%AC\">請求権発生説\u003c/a>으로 반드시 연결할 것.\u003c/li>\u003cli>\u003cstrong>재산권에 내재하는 사회적 제약\u003c/strong>의 근거 조문은 \u003cstrong>헌법 29조 2항\u003c/strong>, \u003cstrong>보상의 근거 조문은 29조 3항\u003c/strong>. 항 번호를 바꿔 놓는 지문에 주의.\u003c/li>\u003c/ul>","search":"特別の犠牲 とくべつのぎせい 항목 내용 ------ ------ 읽기 とくべつのぎせい（특별한 희생） 과목 행정법（국가보상 — 손실보상） 한줄 정의 재산권에 내재하는 사회적 제약의 한계를 넘어 특정인에게 가해진 재산상의 손실로서, 損失補償 용어/損失補償.md 을 필요로 하는지 여부를 가르는 기준 통설·판례 형식적 기준 + 실질적 기준의 종합 판단 . 다만 실질적 기준을 중시 하는 것이 오늘날의 통설 개념 재산권은 절대 불가침이 아니다. 헌법 29조 2항은 「재산권의 내용은 공공의 복지에 적합하도록 법률로 정한다」 고 규정하여, 재산권에는 본래 사회적 제약 社会的制約 이 내재한다는 점을 밝히고 있다. 건축기준법상의 높이 제한이나 소방법상의 규제처럼, 사회 구성원 모두가 감수해야 할 정도의 제한은 아무리 불편해도 보상 대상이 아니다. 이를 受忍限度 수인한도 내의 제약 이라 한다. 그러나 특정인만이, 그것도 재산권의 본질을 침해할 정도로 무거운 부담을 지게 된다면 이야기가 다르다. 그 사람 혼자 사회 전체를 위한 비용을 떠안는 셈이므로 평등원칙 에 반한다. 이때 비로소 「특별한 희생」 이 인정되어 헌법 29조 3항에 따른 보상이 필요해진다. 즉 특별한 희생은 「참아야 할 제약」과 「보상받아야 할 침해」를 가르는 분수령 이다. 그 판단은 전통적으로 두 가지 기준을 종합하여 이루어진다. 첫째, 형식적 기준 — 침해 행위가 일반적인가 특정인 또는 특정 범위의 소수자 을 겨냥한 것인가 . 널리 일반인에게 미치는 규제라면 사회적 제약일 가능성이 높고, 소수의 특정인만 겨냥한다면 특별한 희생 쪽으로 기운다. 둘째, 실질적 기준 — 침해의 정도가 재산권에 내재하는 사회적 제약을 넘어 재산권의 본질적 내용을 침해하는 정도에 이르렀는가 . 종래의 이용을 그대로 계속할 수 있는 정도의 제한인지, 아니면 사실상 이용 자체를 봉쇄하는 것인지가 갈림길이 된다. 오늘날의 통설은 형식적 기준만으로는 판단이 어렵다고 보아 실질적 기준을 중심에 두고 형식적 기준을 보조적으로 고려 한다. 규제의 목적도 중요한 고려 요소인데, 「위험 방지·재해 예방」과 같은 소극적·경찰적 목적 의 규제는 사회적 제약으로 보아 보상이 불필요한 경향이 있고, 「공공사업을 위해 적극적으로 재산을 이용·취득」 하는 유형은 특별한 희생으로 보아 보상이 필요한 경향이 있다. 奈良県ため池条例事件이 전자의 대표례다. 학설 학설 내용 비고 ------ ------ ------ 형식적 기준설 침해 행위가 일반적인가, 특정인을 겨냥한 것인가 만으로 판단 단독으로는 불충분. 일반적 규제라도 극히 가혹할 수 있음 실질적 기준설 침해가 재산권에 내재하는 사회적 제약을 넘는 본질적인 것인가 로 판단 👉 오늘날 중심적 기준 종합판단설 （형식 + 실질） 양 기준을 종합 하되, 규제의 목적·태양·정도 를 함께 고려하여 개별적으로 판단 👉 통설·판례의 실질 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 奈良県ため池条例事件（나라현 저수지 조례 사건） 最大判昭38.6.26 조례로 저수지 제방에서의 경작·건축을 금지, 보상 규정은 없음 특별한 희생 아님 → 보상 불요 . 재해 방지를 위한 제한은 재산권을 행사하는 자가 당연히 수인해야 할 책무 이며, 헌법·민법의 보호 밖에 있는 행위를 금지한 데 지나지 않음 河川附近地制限令事件（하천부근지제한령 사건） 最大判昭43.11.27 하천부근지 지정으로 종래 계속해 온 砂利 자갈 채취가 사실상 불가능해짐 일반적으로는 수인해야 할 제한이지만, 종래 적법하게 계속해 온 사업이 불가능해져 현저한 손실을 입는 경우 에는 특별한 희생 에 해당할 수 있어 헌법 29조 3항에 의해 직접 보상을 청구할 여지가 있다 （→ 請求権発生説 용어/請求権発生説.md ） 💡 수험 팁 - 두 기준을 반드시 짝으로 암기. 형식적 기준 = 「누구에게?」 일반적 ↔ 특정인 , 실질적 기준 = 「얼마나?」 사회적 제약 내 ↔ 본질적 침해 . 어느 하나만 쓴 지문은 불완전하다. - 대비: 奈良県ため池条例事件 보상 불요 ↔ 河川附近地制限令事件 보상 여지 있음 . 이 두 판례는 결론이 정반대 라 세트로 출제된다. 저수지 = 위험 방지 목적 → 수인, 하천부근지 = 종래 사업의 봉쇄 → 특별한 희생. - 규제 목적으로 갈라라. 소극적·경찰적 규제 위험·재해 방지 → 보상 불요 경향 / 적극적·공공사업적 이용 → 보상 필요 경향. - 「특별한 희생이 있으면 곧바로 보상이 인정된다」는 것까지는 맞지만, 법률에 보상 규정이 없을 때 어떻게 하는가 는 별개의 논점이다 → 請求権発生説 용어/請求権発生説.md 으로 반드시 연결할 것. - 재산권에 내재하는 사회적 제약 의 근거 조문은 헌법 29조 2항 , 보상의 근거 조문은 29조 3항 . 항 번호를 바꿔 놓는 지문에 주의."},"請求権発生説":{"type":"term","subject":"용어","id":"請求権発生説","title":"請求権発生説","sub":"せいきゅうけんはっせいせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>せいきゅうけんはっせいせつ（청구권발생설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（국가보상 — 손실보상）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>재산권을 제한하는 \u003cstrong>법률에 보상 규정이 없더라도\u003c/strong>, \u003cstrong>헌법 29조 3항을 직접 근거로\u003c/strong> 국가에 대해 손실보상을 청구할 수 있다는 학설\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>통설·판례\u003c/strong>（河川附近地制限令事件 \u003cstrong>最大判昭43.11.27\u003c/strong>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>\u003ca href=\"#/e/%E6%90%8D%E5%A4%B1%E8%A3%9C%E5%84%9F\">損失補償\u003c/a>에는 국가배상법과 같은 일반법이 없다.\u003c/strong> 토지수용법 등 개별법에 보상 규정이 흩어져 있을 뿐이다. 그렇다면 어떤 법률이 재산권을 제한하면서 보상 규정을 두는 것을 빠뜨렸다면 어떻게 되는가. 이것이 \u003cstrong>「보상 규정 흠결(欠缺)의 문제」\u003c/strong>이며, 여기에 답하는 것이 청구권발생설이다.\u003c/p>\n\u003cp>논리의 갈림길은 \u003cstrong>헌법 29조 3항의 성격\u003c/strong>을 어떻게 보느냐에 있다. 이를 단순한 \u003cstrong>프로그램 규정\u003c/strong>(입법 방침의 선언)으로 보면 법률의 뒷받침 없이는 아무것도 청구할 수 없다. 그러나 통설·판례는 29조 3항을 \u003cstrong>직접 효력을 갖는 구체적 규정\u003c/strong>으로 이해한다. 따라서 특별한 희생이 발생한 이상, \u003cstrong>개별 법률에 보상 규정이 없더라도 헌법 29조 3항을 직접 근거로 삼아 보상을 청구할 수 있다\u003c/strong>는 것이다.\u003c/p>\n\u003cp>이 결론은 두 가지 중요한 파급 효과를 낳는다. 첫째, \u003cstrong>보상 규정이 없다는 이유만으로 그 법률이 곧바로 위헌·무효가 되지는 않는다.\u003c/strong> 헌법에서 직접 보상을 받아 낼 길이 열려 있으므로, 법률 자체는 살려 둔 채 개별적으로 보상해 주면 족하기 때문이다. 이것이 \u003cstrong>위헌무효설\u003c/strong>과 결정적으로 갈리는 지점이다. 둘째, 그 결과 \u003cstrong>보상 규정 없는 법률에 근거한 처분에 따르지 않아 처벌받은 자도, 처벌 자체는 면할 수 없고 별도로 보상을 청구해야 한다\u003c/strong>는 구조가 된다.\u003c/p>\n\u003cp>판례는 \u003cstrong>河川附近地制限令事件(最大判昭43.11.27)\u003c/strong>에서 이 입장을 명확히 했다. 하천부근지 지정으로 종래 계속해 온 자갈 채취업이 불가능해진 사안에서, 최고재판소는 하천부근지제한령에 \u003cstrong>손실보상에 관한 규정이 없더라도 그 사실만으로 동 령이 헌법 29조 3항에 위반하여 무효라고 해석할 것은 아니고\u003c/strong>, 손실을 입은 자는 \u003cstrong>헌법 29조 3항을 근거로 하여 보상을 청구할 여지가 전혀 없는 것은 아니다\u003c/strong>라고 판시했다. 「여지가 전혀 없는 것은 아니다(余地が全くないわけではない)」라는 특유의 표현까지 그대로 출제되는 일이 있다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>プログラム規定説\u003c/strong>（프로그램 규정설）\u003c/td>\u003ctd>헌법 29조 3항은 입법자에 대한 방침 선언에 불과하고 구체적 청구권을 낳지 않음\u003c/td>\u003ctd>법률에 규정이 없으면 \u003cstrong>보상 청구 불가\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>違憲無効説\u003c/strong>（위헌무효설）\u003c/td>\u003ctd>보상 규정을 두지 않은 채 재산권을 제한하는 \u003cstrong>법률 자체가 헌법 29조 3항 위반으로 무효\u003c/strong>가 됨\u003c/td>\u003ctd>법률이 무효이므로 그에 근거한 \u003cstrong>처분·처벌도 무효\u003c/strong>. 다만 \u003cstrong>보상은 받을 수 없음\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>請求権発生説\u003c/strong>（청구권발생설·직접효력설）\u003c/td>\u003ctd>헌법 29조 3항은 \u003cstrong>직접 효력을 갖는 규정\u003c/strong>이므로, 법률에 규정이 없어도 \u003cstrong>헌법을 직접 근거로 보상청구권이 발생\u003c/strong>\u003c/td>\u003ctd>👉 \u003cstrong>통설·판례\u003c/strong>. \u003cstrong>법률은 유효\u003c/strong>하고, \u003cstrong>보상은 헌법에서 직접 받는다\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>河川附近地制限令事件（하천부근지제한령 사건）\u003c/td>\u003ctd>\u003cstrong>最大判昭43.11.27\u003c/strong>\u003c/td>\u003ctd>하천부근지로 지정되어 종래 계속해 온 자갈 채취가 불가능해졌으나, 하천부근지제한령에는 손실보상 규정이 없었음. 무허가 채취로 형사 기소된 피고인이 동 령의 위헌·무효를 주장\u003c/td>\u003ctd>보상 규정이 없다는 것만으로 \u003cstrong>동 령이 헌법 29조 3항에 위반하여 무효라고는 할 수 없다\u003c/strong>. 손실을 입은 자는 \u003cstrong>헌법 29조 3항을 근거로 보상을 청구할 여지가 전혀 없는 것은 아니다\u003c/strong> → \u003cstrong>청구권발생설 채택\u003c/strong>（다만 피고인의 \u003cstrong>유죄 자체는 유지\u003c/strong>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>결론 한 줄: 「법률은 살리고, 보상은 헌법에서 직접 받는다.」\u003c/strong> 이 감각만 잡으면 세 학설이 정리된다.\u003c/li>\u003cli>대비: \u003cstrong>위헌무효설 ↔ 청구권발생설\u003c/strong>. \u003cstrong>위헌무효설은 법률을 죽이고(→ 처벌 면함, 그러나 보상 없음)\u003c/strong>, \u003cstrong>청구권발생설은 법률을 살린다(→ 처벌은 그대로, 대신 보상 있음)\u003c/strong>. 「청구권발생설에 의하면 법률이 위헌무효가 된다」는 지문은 오답.\u003c/li>\u003cli>河川附近地制限令事件에서 \u003cstrong>피고인은 결국 유죄\u003c/strong>였다는 결말까지 세트로 기억할 것. 「보상 청구의 여지를 인정했으므로 무죄가 되었다」는 함정 지문이 나온다.\u003c/li>\u003cli>판시 문구가 \u003cstrong>「청구할 수 있다」가 아니라 「청구할 여지가 전혀 없는 것은 아니다」\u003c/strong>라는 신중한 표현이라는 점도 출제 포인트.\u003c/li>\u003cli>전제 확인: 애초에 \u003cstrong>\u003ca href=\"#/e/%E7%89%B9%E5%88%A5%E3%81%AE%E7%8A%A0%E7%89%B2\">特別の犠牲\u003c/a>이 인정되어야\u003c/strong> 이 논의로 넘어간다. 사회적 제약에 그친다면 헌법 29조 3항을 들고 와도 보상은 없다.\u003c/li>\u003cli>근거 조문은 \u003cstrong>헌법 29조 3항\u003c/strong>. \u003cstrong>헌법 17조(국가배상)\u003c/strong>와 헷갈리지 말 것 — 17조는 \u003ca href=\"#/e/%E6%90%8D%E5%A4%B1%E8%A3%9C%E5%84%9F\">損失補償\u003c/a>이 아니라 국가배상의 근거다.\u003c/li>\u003c/ul>","search":"請求権発生説 せいきゅうけんはっせいせつ 항목 내용 ------ ------ 읽기 せいきゅうけんはっせいせつ（청구권발생설） 과목 행정법（국가보상 — 손실보상） 한줄 정의 재산권을 제한하는 법률에 보상 규정이 없더라도 , 헌법 29조 3항을 직접 근거로 국가에 대해 손실보상을 청구할 수 있다는 학설 통설·판례 통설·판례 （河川附近地制限令事件 最大判昭43.11.27 ） 개념 損失補償 용어/損失補償.md 에는 국가배상법과 같은 일반법이 없다. 토지수용법 등 개별법에 보상 규정이 흩어져 있을 뿐이다. 그렇다면 어떤 법률이 재산권을 제한하면서 보상 규정을 두는 것을 빠뜨렸다면 어떻게 되는가. 이것이 「보상 규정 흠결 欠缺 의 문제」 이며, 여기에 답하는 것이 청구권발생설이다. 논리의 갈림길은 헌법 29조 3항의 성격 을 어떻게 보느냐에 있다. 이를 단순한 프로그램 규정 입법 방침의 선언 으로 보면 법률의 뒷받침 없이는 아무것도 청구할 수 없다. 그러나 통설·판례는 29조 3항을 직접 효력을 갖는 구체적 규정 으로 이해한다. 따라서 특별한 희생이 발생한 이상, 개별 법률에 보상 규정이 없더라도 헌법 29조 3항을 직접 근거로 삼아 보상을 청구할 수 있다 는 것이다. 이 결론은 두 가지 중요한 파급 효과를 낳는다. 첫째, 보상 규정이 없다는 이유만으로 그 법률이 곧바로 위헌·무효가 되지는 않는다. 헌법에서 직접 보상을 받아 낼 길이 열려 있으므로, 법률 자체는 살려 둔 채 개별적으로 보상해 주면 족하기 때문이다. 이것이 위헌무효설 과 결정적으로 갈리는 지점이다. 둘째, 그 결과 보상 규정 없는 법률에 근거한 처분에 따르지 않아 처벌받은 자도, 처벌 자체는 면할 수 없고 별도로 보상을 청구해야 한다 는 구조가 된다. 판례는 河川附近地制限令事件 最大判昭43.11.27 에서 이 입장을 명확히 했다. 하천부근지 지정으로 종래 계속해 온 자갈 채취업이 불가능해진 사안에서, 최고재판소는 하천부근지제한령에 손실보상에 관한 규정이 없더라도 그 사실만으로 동 령이 헌법 29조 3항에 위반하여 무효라고 해석할 것은 아니고 , 손실을 입은 자는 헌법 29조 3항을 근거로 하여 보상을 청구할 여지가 전혀 없는 것은 아니다 라고 판시했다. 「여지가 전혀 없는 것은 아니다 余地が全くないわけではない 」라는 특유의 표현까지 그대로 출제되는 일이 있다. 학설 학설 내용 결론 ------ ------ ------ プログラム規定説 （프로그램 규정설） 헌법 29조 3항은 입법자에 대한 방침 선언에 불과하고 구체적 청구권을 낳지 않음 법률에 규정이 없으면 보상 청구 불가 違憲無効説 （위헌무효설） 보상 규정을 두지 않은 채 재산권을 제한하는 법률 자체가 헌법 29조 3항 위반으로 무효 가 됨 법률이 무효이므로 그에 근거한 처분·처벌도 무효 . 다만 보상은 받을 수 없음 請求権発生説 （청구권발생설·직접효력설） 헌법 29조 3항은 직접 효력을 갖는 규정 이므로, 법률에 규정이 없어도 헌법을 직접 근거로 보상청구권이 발생 👉 통설·판례 . 법률은 유효 하고, 보상은 헌법에서 직접 받는다 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 河川附近地制限令事件（하천부근지제한령 사건） 最大判昭43.11.27 하천부근지로 지정되어 종래 계속해 온 자갈 채취가 불가능해졌으나, 하천부근지제한령에는 손실보상 규정이 없었음. 무허가 채취로 형사 기소된 피고인이 동 령의 위헌·무효를 주장 보상 규정이 없다는 것만으로 동 령이 헌법 29조 3항에 위반하여 무효라고는 할 수 없다 . 손실을 입은 자는 헌법 29조 3항을 근거로 보상을 청구할 여지가 전혀 없는 것은 아니다 → 청구권발생설 채택 （다만 피고인의 유죄 자체는 유지 ） 💡 수험 팁 - 결론 한 줄: 「법률은 살리고, 보상은 헌법에서 직접 받는다.」 이 감각만 잡으면 세 학설이 정리된다. - 대비: 위헌무효설 ↔ 청구권발생설 . 위헌무효설은 법률을 죽이고 → 처벌 면함, 그러나 보상 없음 , 청구권발생설은 법률을 살린다 → 처벌은 그대로, 대신 보상 있음 . 「청구권발생설에 의하면 법률이 위헌무효가 된다」는 지문은 오답. - 河川附近地制限令事件에서 피고인은 결국 유죄 였다는 결말까지 세트로 기억할 것. 「보상 청구의 여지를 인정했으므로 무죄가 되었다」는 함정 지문이 나온다. - 판시 문구가 「청구할 수 있다」가 아니라 「청구할 여지가 전혀 없는 것은 아니다」 라는 신중한 표현이라는 점도 출제 포인트. - 전제 확인: 애초에 特別の犠牲 용어/特別の犠牲.md 이 인정되어야 이 논의로 넘어간다. 사회적 제약에 그친다면 헌법 29조 3항을 들고 와도 보상은 없다. - 근거 조문은 헌법 29조 3항 . 헌법 17조 국가배상 와 헷갈리지 말 것 — 17조는 損失補償 용어/損失補償.md 이 아니라 국가배상의 근거다."},"行政代執行":{"type":"term","subject":"용어","id":"行政代執行","title":"行政代執行","sub":"ぎょうせいだいしっこう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ぎょうせいだいしっこう（행정대집행）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정상 의무이행확보수단 — 행정상 강제집행）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>대체적 작위의무(代替的作為義務)\u003c/strong>를 의무자가 이행하지 않을 때, 행정청이 스스로 그 행위를 하거나 제3자에게 하게 하고 그 \u003cstrong>비용을 의무자로부터 징수\u003c/strong>하는 제도\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>행정상 강제집행 수단 중 \u003cstrong>유일하게 일반법(行政代執行法)이 존재\u003c/strong>하며, 실무상 거의 유일하게 기능하는 수단\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정청이 명령을 내려도 상대방이 따르지 않으면 행정 목적이 달성되지 않는다. 그래서 법은 의무자의 의사에 반하여 의무 내용을 실현하는 \u003cstrong>행정상 강제집행\u003c/strong> 수단을 마련해 두었는데, 그 중 일반법이 있는 유일한 유형이 \u003cstrong>대집행\u003c/strong>이다(行政代執行法). 무허가 건축물의 철거, 도로 위 불법 방치물의 제거, 위험한 광고탑의 撤去 등이 전형이다.\u003c/p>\n\u003cp>대집행의 대상은 \u003cstrong>대체적 작위의무\u003c/strong>에 한정된다(2조). 「대체적」이란 \u003cstrong>타인이 대신해 줄 수 있는\u003c/strong> 행위라는 뜻이다. 따라서 예방접종을 받을 의무나 건강진단을 받을 의무처럼 \u003cstrong>본인이 아니면 의미가 없는 비대체적 작위의무\u003c/strong>, 그리고 「영업하지 말 것」·「출입하지 말 것」 같은 \u003cstrong>부작위의무\u003c/strong>는 대집행의 대상이 되지 않는다. 이것이 시험의 최대 함정이다. 특히 토지·건물의 \u003cstrong>명도(明渡し)·퇴거 의무\u003c/strong>는 점유자의 신체에 대한 실력행사를 수반하므로 \u003cstrong>비대체적 의무로 보아 대집행 불가\u003c/strong>라는 것이 통설이다.\u003c/p>\n\u003cp>요건도 조문 그대로 물어본다. ① 법률(법률의 위임에 의한 명령·규칙·조례 포함)에 의해 직접 명령되었거나 법률에 근거하여 행정청이 명한 \u003cstrong>대체적 작위의무\u003c/strong>의 불이행이 있을 것, ② \u003cstrong>다른 수단으로써 그 이행을 확보하기 곤란\u003c/strong>할 것, ③ 그 \u003cstrong>불이행을 방치함이 현저히 공익에 반한다\u003c/strong>고 인정될 것 — 이 세 가지가 모두 갖추어져야 한다(2조). ②③은 \u003cstrong>비례원칙\u003c/strong>을 조문화한 것으로, 대집행이 최후 수단임을 보여준다.\u003c/p>\n\u003cp>절차는 \u003cstrong>계고(戒告) → 대집행영장(代執行令書)의 통지 → 실행 → 비용징수\u003c/strong>의 4단계다. 먼저 상당한 이행기한을 정해 그때까지 이행하지 않으면 대집행한다는 뜻을 \u003cstrong>미리 문서로\u003c/strong> 계고하고(3조 1항), 그래도 이행하지 않으면 대집행의 시기·집행책임자의 성명·비용의 개산 견적액을 기재한 \u003cstrong>대집행영장\u003c/strong>으로 통지한다(3조 2항). 다만 \u003cstrong>비상시 또는 위험이 절박한 경우로서 긴급한 필요가 있어 위 절차를 밟을 여유가 없을 때에는 이 절차를 생략할 수 있다\u003c/strong>(3조 3항). 실행 시 집행책임자는 그 자격을 나타내는 \u003cstrong>증표를 휴대\u003c/strong>하고 요구가 있으면 제시해야 한다(4조). 비용은 문서로 납부를 명하고(5조), 납부하지 않으면 \u003cstrong>국세체납처분의 예에 따라 징수\u003c/strong>할 수 있으며(6조 1항), 국세·지방세에 \u003cstrong>다음가는 순위의 선취특권\u003c/strong>을 가진다(6조 2항).\u003c/p>\n\u003ch2>참고: 행정상 의무이행확보수단 전체 체계\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>대분류\u003c/th>\u003cth>수단\u003c/th>\u003cth>대상 의무\u003c/th>\u003cth>근거법\u003c/th>\u003cth>요점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>행정상 강제집행\u003c/strong>&lt;br&gt;（의무의 존재가 \u003cstrong>전제\u003c/strong>）\u003c/td>\u003ctd>\u003cstrong>代執行\u003c/strong>（대집행）\u003c/td>\u003ctd>\u003cstrong>대체적 작위의무만\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>行政代執行法\u003c/strong>（일반법 있음）\u003c/td>\u003ctd>행정청이 대신 실행 → 비용 징수\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>執行罰\u003c/strong>（집행벌·집행과태료）\u003c/td>\u003ctd>비대체적 작위의무·부작위의무\u003c/td>\u003ctd>개별법만 — 현재 \u003cstrong>砂防法 36조\u003c/strong>가 사실상 유일\u003c/td>\u003ctd>심리적 압박. \u003cstrong>반복 부과 가능\u003c/strong>（이중처벌 아님）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>直接強制\u003c/strong>\u003c/td>\u003ctd>모든 의무\u003c/td>\u003ctd>\u003cstrong>일반법 없음\u003c/strong>. 개별법에만（成田新法 등）\u003c/td>\u003ctd>신체·재산에 직접 실력 행사. 인권 침해가 커 극히 예외적\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>行政上の強制徴収\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>금전급부의무\u003c/strong>\u003c/td>\u003ctd>国税徴収法 및 「국세체납처분의 예에 따른다」는 개별 규정\u003c/td>\u003ctd>재산 압류·공매\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>即時強制\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#/e/%E5%8D%B3%E6%99%82%E5%BC%B7%E5%88%B6\">即時強制\u003c/a>\u003c/td>\u003ctd>\u003cstrong>의무 없음\u003c/strong>（불이행을 전제로 하지 않음）\u003c/td>\u003ctd>개별법（警職法·消防法 등）\u003c/td>\u003ctd>급박한 사태에서 직접 실력 행사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>행정벌\u003c/strong>&lt;br&gt;（\u003cstrong>과거의 위반\u003c/strong>에 대한 제재）\u003c/td>\u003ctd>\u003cstrong>行政刑罰\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>개별법의 벌칙\u003c/td>\u003ctd>형법상의 형명(징역·벌금 등). \u003cstrong>형사소송법\u003c/strong> 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>秩序罰\u003c/strong>（過料）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>개별법·조례\u003c/td>\u003ctd>신고 해태 등 경미한 위반. \u003cstrong>비송사건절차법\u003c/strong> 절차（형벌 아님）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「비대체적 작위의무·부작위의무에도 대집행할 수 있다」는 무조건 오답.\u003c/strong> 대집행 = \u003cstrong>대체적 작위의무 전용\u003c/strong>. 이것 하나만 확실히 해도 절반은 맞는다.\u003c/li>\u003cli>대비: \u003cstrong>부작위의무는 그대로는 대집행 불가.\u003c/strong> 「담장을 설치하지 말 것」을 어겼을 때, 먼저 \u003cstrong>「담장을 철거하라」는 작위의무로 전환하는 별도의 법적 근거\u003c/strong>가 있어야 비로소 대집행이 가능하다.\u003c/li>\u003cli>\u003cstrong>토지·건물의 명도·퇴거 의무는 대집행 불가\u003c/strong>(비대체적). 「불법 점유자를 대집행으로 퇴거시킬 수 있다」는 함정 지문이 자주 나온다.\u003c/li>\u003cli>절차 4단계를 순서대로: \u003cstrong>계고 → 대집행영장 → 실행 → 비용징수\u003c/strong>. \u003cstrong>긴급 시에는 계고·영장을 생략 가능\u003c/strong>(3조 3항)이라는 예외까지 세트로.\u003c/li>\u003cli>비용은 \u003cstrong>국세체납처분의 예\u003c/strong>에 따라 강제징수 가능(6조 1항). 「비용은 민사소송으로 청구해야 한다」는 오답.\u003c/li>\u003cli>강제집행 수단 중 \u003cstrong>일반법이 있는 것은 대집행뿐.\u003c/strong> 直接強制·執行罰은 \u003cstrong>개별법에만\u003c/strong> 있다. 특히 \u003cstrong>執行罰의 유일한 현행 예 = 砂防法 36조\u003c/strong>는 그대로 출제된다.\u003c/li>\u003cli>대비: \u003cstrong>집행벌은 반복해서 부과할 수 있다.\u003c/strong> 장래의 이행을 압박하는 수단이지 과거를 벌하는 형벌이 아니므로 이중처벌금지에 걸리지 않는다.\u003c/li>\u003cli>조례를 근거로 한 대집행은 가능하다. 2조의 「법률」에는 \u003cstrong>법률의 위임에 의한 명령·규칙 및 조례가 포함\u003c/strong>된다고 명시되어 있다.\u003c/li>\u003c/ul>","search":"行政代執行 ぎょうせいだいしっこう 항목 내용 ------ ------ 읽기 ぎょうせいだいしっこう（행정대집행） 과목 행정법（행정상 의무이행확보수단 — 행정상 강제집행） 한줄 정의 대체적 작위의무 代替的作為義務 를 의무자가 이행하지 않을 때, 행정청이 스스로 그 행위를 하거나 제3자에게 하게 하고 그 비용을 의무자로부터 징수 하는 제도 통설·판례 행정상 강제집행 수단 중 유일하게 일반법 行政代執行法 이 존재 하며, 실무상 거의 유일하게 기능하는 수단 개념 행정청이 명령을 내려도 상대방이 따르지 않으면 행정 목적이 달성되지 않는다. 그래서 법은 의무자의 의사에 반하여 의무 내용을 실현하는 행정상 강제집행 수단을 마련해 두었는데, 그 중 일반법이 있는 유일한 유형이 대집행 이다 行政代執行法 . 무허가 건축물의 철거, 도로 위 불법 방치물의 제거, 위험한 광고탑의 撤去 등이 전형이다. 대집행의 대상은 대체적 작위의무 에 한정된다 2조 . 「대체적」이란 타인이 대신해 줄 수 있는 행위라는 뜻이다. 따라서 예방접종을 받을 의무나 건강진단을 받을 의무처럼 본인이 아니면 의미가 없는 비대체적 작위의무 , 그리고 「영업하지 말 것」·「출입하지 말 것」 같은 부작위의무 는 대집행의 대상이 되지 않는다. 이것이 시험의 최대 함정이다. 특히 토지·건물의 명도 明渡し ·퇴거 의무 는 점유자의 신체에 대한 실력행사를 수반하므로 비대체적 의무로 보아 대집행 불가 라는 것이 통설이다. 요건도 조문 그대로 물어본다. ① 법률 법률의 위임에 의한 명령·규칙·조례 포함 에 의해 직접 명령되었거나 법률에 근거하여 행정청이 명한 대체적 작위의무 의 불이행이 있을 것, ② 다른 수단으로써 그 이행을 확보하기 곤란 할 것, ③ 그 불이행을 방치함이 현저히 공익에 반한다 고 인정될 것 — 이 세 가지가 모두 갖추어져야 한다 2조 . ②③은 비례원칙 을 조문화한 것으로, 대집행이 최후 수단임을 보여준다. 절차는 계고 戒告 → 대집행영장 代執行令書 의 통지 → 실행 → 비용징수 의 4단계다. 먼저 상당한 이행기한을 정해 그때까지 이행하지 않으면 대집행한다는 뜻을 미리 문서로 계고하고 3조 1항 , 그래도 이행하지 않으면 대집행의 시기·집행책임자의 성명·비용의 개산 견적액을 기재한 대집행영장 으로 통지한다 3조 2항 . 다만 비상시 또는 위험이 절박한 경우로서 긴급한 필요가 있어 위 절차를 밟을 여유가 없을 때에는 이 절차를 생략할 수 있다 3조 3항 . 실행 시 집행책임자는 그 자격을 나타내는 증표를 휴대 하고 요구가 있으면 제시해야 한다 4조 . 비용은 문서로 납부를 명하고 5조 , 납부하지 않으면 국세체납처분의 예에 따라 징수 할 수 있으며 6조 1항 , 국세·지방세에 다음가는 순위의 선취특권 을 가진다 6조 2항 . 참고: 행정상 의무이행확보수단 전체 체계 대분류 수단 대상 의무 근거법 요점 -------- ------ ----------- -------- ------ 행정상 강제집행 \u003cbr （의무의 존재가 전제 ） 代執行 （대집행） 대체적 작위의무만 行政代執行法 （일반법 있음） 행정청이 대신 실행 → 비용 징수 執行罰 （집행벌·집행과태료） 비대체적 작위의무·부작위의무 개별법만 — 현재 砂防法 36조 가 사실상 유일 심리적 압박. 반복 부과 가능 （이중처벌 아님） 直接強制 모든 의무 일반법 없음 . 개별법에만（成田新法 등） 신체·재산에 직접 실력 행사. 인권 침해가 커 극히 예외적 行政上の強制徴収 금전급부의무 国税徴収法 및 「국세체납처분의 예에 따른다」는 개별 규정 재산 압류·공매 即時強制 即時強制 용어/即時強制.md 의무 없음 （불이행을 전제로 하지 않음） 개별법（警職法·消防法 등） 급박한 사태에서 직접 실력 행사 행정벌 \u003cbr （ 과거의 위반 에 대한 제재） 行政刑罰 — 개별법의 벌칙 형법상의 형명 징역·벌금 등 . 형사소송법 절차 秩序罰 （過料） — 개별법·조례 신고 해태 등 경미한 위반. 비송사건절차법 절차（형벌 아님） 💡 수험 팁 - 「비대체적 작위의무·부작위의무에도 대집행할 수 있다」는 무조건 오답. 대집행 = 대체적 작위의무 전용 . 이것 하나만 확실히 해도 절반은 맞는다. - 대비: 부작위의무는 그대로는 대집행 불가. 「담장을 설치하지 말 것」을 어겼을 때, 먼저 「담장을 철거하라」는 작위의무로 전환하는 별도의 법적 근거 가 있어야 비로소 대집행이 가능하다. - 토지·건물의 명도·퇴거 의무는 대집행 불가 비대체적 . 「불법 점유자를 대집행으로 퇴거시킬 수 있다」는 함정 지문이 자주 나온다. - 절차 4단계를 순서대로: 계고 → 대집행영장 → 실행 → 비용징수 . 긴급 시에는 계고·영장을 생략 가능 3조 3항 이라는 예외까지 세트로. - 비용은 국세체납처분의 예 에 따라 강제징수 가능 6조 1항 . 「비용은 민사소송으로 청구해야 한다」는 오답. - 강제집행 수단 중 일반법이 있는 것은 대집행뿐. 直接強制·執行罰은 개별법에만 있다. 특히 執行罰의 유일한 현행 예 = 砂防法 36조 는 그대로 출제된다. - 대비: 집행벌은 반복해서 부과할 수 있다. 장래의 이행을 압박하는 수단이지 과거를 벌하는 형벌이 아니므로 이중처벌금지에 걸리지 않는다. - 조례를 근거로 한 대집행은 가능하다. 2조의 「법률」에는 법률의 위임에 의한 명령·규칙 및 조례가 포함 된다고 명시되어 있다."},"即時強制":{"type":"term","subject":"용어","id":"即時強制","title":"即時強制","sub":"そくじきょうせい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>そくじきょうせい（즉시강제）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>행정법（행정상 의무이행확보수단）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>의무의 부과와 그 불이행을 전제로 하지 않고\u003c/strong>, 급박한 장해를 제거할 필요가 있을 때 행정청이 직접 국민의 신체·재산에 실력을 가하여 행정 목적을 실현하는 작용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>일반법은 존재하지 않고 개별법의 근거가 반드시 필요\u003c/strong>하다는 것이 통설（침해유보설의 귀결）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>행정상 강제집행은 「명령 → 의무 발생 → 불이행 → 강제」라는 순서를 밟는다. 그러나 눈앞에서 불이 번지고 있는데 「연소 우려가 있는 건물을 철거하라」고 명령한 뒤 이행기한을 주고 계고할 여유는 없다. 이처럼 \u003cstrong>미리 의무를 명할 시간적 여유가 없거나, 그 성질상 의무를 명해서는 목적을 달성할 수 없는 경우\u003c/strong>에 곧바로 실력을 행사하는 것이 \u003cstrong>즉시강제\u003c/strong>다. 핵심 표지는 단 하나 — \u003cstrong>선행하는 의무가 없다\u003c/strong>는 점이다.\u003c/p>\n\u003cp>대비: \u003cstrong>행정상 강제집행은 의무의 존재가 전제\u003c/strong>, \u003cstrong>즉시강제는 의무가 전제되지 않음\u003c/strong>. 특히 \u003cstrong>直接強制(직접강제)\u003c/strong>와 혼동하기 쉽다. 직접강제도 신체·재산에 직접 실력을 가하지만 \u003cstrong>의무 불이행이 있어야\u003c/strong> 발동되는 데 반해, 즉시강제는 애초에 의무가 없는 상태에서 발동된다. 이 구별이 시험의 정면 논점이다.\u003c/p>\n\u003cp>즉시강제는 국민의 권리를 가장 직접적으로 침해하므로 \u003cstrong>반드시 법률(또는 조례)의 근거\u003c/strong>가 있어야 하고, 요건도 엄격히 해석해야 하며 \u003cstrong>비례원칙\u003c/strong>의 강한 통제를 받는다. 대표적인 개별법상의 예로는 경찰관직무집행법상의 \u003cstrong>보호\u003c/strong>(3조)·\u003cstrong>피난 등의 조치\u003c/strong>(4조)·\u003cstrong>범죄의 예방 및 제지\u003c/strong>(5조), 소방법상의 \u003cstrong>파괴소방\u003c/strong>(29조), 감염증법상의 강제 입원 조치, 정신보건복지법상의 \u003cstrong>措置入院\u003c/strong> 등이 있다.\u003c/p>\n\u003cp>또한 즉시강제는 신체의 자유에 대한 제약을 수반하는 일이 많아 \u003cstrong>헌법 33조(영장주의)·35조(주거의 불가침)\u003c/strong>와의 관계가 문제된다. 통설은 이들 규정의 취지가 형사절차 이외의 행정절차에도 미칠 수 있다고 보면서도, \u003cstrong>행정 목적의 긴급성·합리성이 인정되는 범위에서는 영장 없는 실력 행사도 허용\u003c/strong>된다고 이해한다(川崎民商事件의 사고방식이 참고가 된다). 한편 즉시강제로 \u003cstrong>위법\u003c/strong>하게 손해를 입은 경우에는 \u003cstrong>국가배상\u003c/strong>(국가배상법 1조)으로, \u003cstrong>적법\u003c/strong>한 즉시강제로 특별한 희생이 생긴 경우에는 \u003cstrong>\u003ca href=\"#/e/%E6%90%8D%E5%A4%B1%E8%A3%9C%E5%84%9F\">損失補償\u003c/a>\u003c/strong>으로 각각 구제를 도모하게 된다.\u003c/p>\n\u003ch2>참고: 행정상 의무이행확보수단 전체 체계\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>대분류\u003c/th>\u003cth>수단\u003c/th>\u003cth>대상 의무\u003c/th>\u003cth>근거법\u003c/th>\u003cth>요점\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>행정상 강제집행\u003c/strong>&lt;br&gt;（의무의 존재가 \u003cstrong>전제\u003c/strong>）\u003c/td>\u003ctd>\u003cstrong>代執行\u003c/strong>（대집행）\u003c/td>\u003ctd>\u003cstrong>대체적 작위의무만\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>行政代執行法\u003c/strong>（일반법 있음）\u003c/td>\u003ctd>행정청이 대신 실행 → 비용 징수\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>執行罰\u003c/strong>（집행벌·집행과태료）\u003c/td>\u003ctd>비대체적 작위의무·부작위의무\u003c/td>\u003ctd>개별법만 — 현재 \u003cstrong>砂防法 36조\u003c/strong>가 사실상 유일\u003c/td>\u003ctd>심리적 압박. \u003cstrong>반복 부과 가능\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>直接強制\u003c/strong>\u003c/td>\u003ctd>모든 의무\u003c/td>\u003ctd>\u003cstrong>일반법 없음\u003c/strong>. 개별법에만（成田新法 등）\u003c/td>\u003ctd>\u003cstrong>의무 불이행이 전제\u003c/strong> — 즉시강제와의 결정적 차이\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>行政上の強制徴収\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>금전급부의무\u003c/strong>\u003c/td>\u003ctd>国税徴収法 및 「국세체납처분의 예에 따른다」는 개별 규정\u003c/td>\u003ctd>재산 압류·공매\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>即時強制\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>即時強制\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>의무 없음\u003c/strong>（불이행을 전제로 하지 않음）\u003c/td>\u003ctd>\u003cstrong>일반법 없음\u003c/strong>. 개별법（警職法 3·4·5조, 消防法 29조 등）\u003c/td>\u003ctd>급박한 사태에서 직접 실력 행사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>행정벌\u003c/strong>&lt;br&gt;（\u003cstrong>과거의 위반\u003c/strong>에 대한 제재）\u003c/td>\u003ctd>\u003cstrong>行政刑罰\u003c/strong>\u003c/td>\u003ctd>—\u003c/td>\u003ctd>개별법의 벌칙\u003c/td>\u003ctd>형법상의 형명(징역·벌금 등). \u003cstrong>형사소송법\u003c/strong> 절차\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003c/td>\u003ctd>\u003cstrong>秩序罰\u003c/strong>（過料）\u003c/td>\u003ctd>—\u003c/td>\u003ctd>개별법·조례\u003c/td>\u003ctd>신고 해태 등 경미한 위반. \u003cstrong>비송사건절차법\u003c/strong> 절차（형벌 아님）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>한 문장 판별법: 「의무가 먼저 있었는가?」\u003c/strong> 있으면 강제집행(대집행·집행벌·직접강제·강제징수), 없으면 즉시강제. 이 기준만으로 대부분의 지문이 갈린다.\u003c/li>\u003cli>\u003cstrong>직접강제 ↔ 즉시강제\u003c/strong>를 바꿔 놓은 지문이 최다 출제. 둘 다 「직접 실력 행사」라서 헷갈리도록 설계된다. \u003cstrong>전제가 되는 의무의 유무\u003c/strong>로 잘라라.\u003c/li>\u003cli>\u003cstrong>즉시강제에는 일반법이 없다.\u003c/strong> 「행정대집행법이 즉시강제의 일반법이다」는 오답. 행정대집행법은 \u003cstrong>대집행의\u003c/strong> 일반법이다.\u003c/li>\u003cli>대표 예시를 조문과 함께 암기: \u003cstrong>警職法 3조(보호)·4조(피난조치)·5조(제지)\u003c/strong>, \u003cstrong>消防法 29조(파괴소방)\u003c/strong>.\u003c/li>\u003cli>즉시강제는 \u003cstrong>처분성이 인정\u003c/strong>될 수 있으나, 순간적으로 끝나 버리는 경우가 많아 \u003cstrong>취소소송의 소의 이익이 소멸\u003c/strong>하기 쉽다. 그래서 실제 구제는 \u003cstrong>국가배상\u003c/strong>이 중심이 된다.\u003c/li>\u003cli>영장주의(헌법 33·35조)는 형사절차 전용이 아니라 \u003cstrong>행정절차에도 취지가 미칠 수 있다\u003c/strong>는 것이 통설. 「행정작용이므로 영장주의는 일절 적용되지 않는다」는 지문은 오답.\u003c/li>\u003c/ul>","search":"即時強制 そくじきょうせい 항목 내용 ------ ------ 읽기 そくじきょうせい（즉시강제） 과목 행정법（행정상 의무이행확보수단） 한줄 정의 의무의 부과와 그 불이행을 전제로 하지 않고 , 급박한 장해를 제거할 필요가 있을 때 행정청이 직접 국민의 신체·재산에 실력을 가하여 행정 목적을 실현하는 작용 통설·판례 일반법은 존재하지 않고 개별법의 근거가 반드시 필요 하다는 것이 통설（침해유보설의 귀결） 개념 행정상 강제집행은 「명령 → 의무 발생 → 불이행 → 강제」라는 순서를 밟는다. 그러나 눈앞에서 불이 번지고 있는데 「연소 우려가 있는 건물을 철거하라」고 명령한 뒤 이행기한을 주고 계고할 여유는 없다. 이처럼 미리 의무를 명할 시간적 여유가 없거나, 그 성질상 의무를 명해서는 목적을 달성할 수 없는 경우 에 곧바로 실력을 행사하는 것이 즉시강제 다. 핵심 표지는 단 하나 — 선행하는 의무가 없다 는 점이다. 대비: 행정상 강제집행은 의무의 존재가 전제 , 즉시강제는 의무가 전제되지 않음 . 특히 直接強制 직접강제 와 혼동하기 쉽다. 직접강제도 신체·재산에 직접 실력을 가하지만 의무 불이행이 있어야 발동되는 데 반해, 즉시강제는 애초에 의무가 없는 상태에서 발동된다. 이 구별이 시험의 정면 논점이다. 즉시강제는 국민의 권리를 가장 직접적으로 침해하므로 반드시 법률 또는 조례 의 근거 가 있어야 하고, 요건도 엄격히 해석해야 하며 비례원칙 의 강한 통제를 받는다. 대표적인 개별법상의 예로는 경찰관직무집행법상의 보호 3조 · 피난 등의 조치 4조 · 범죄의 예방 및 제지 5조 , 소방법상의 파괴소방 29조 , 감염증법상의 강제 입원 조치, 정신보건복지법상의 措置入院 등이 있다. 또한 즉시강제는 신체의 자유에 대한 제약을 수반하는 일이 많아 헌법 33조 영장주의 ·35조 주거의 불가침 와의 관계가 문제된다. 통설은 이들 규정의 취지가 형사절차 이외의 행정절차에도 미칠 수 있다고 보면서도, 행정 목적의 긴급성·합리성이 인정되는 범위에서는 영장 없는 실력 행사도 허용 된다고 이해한다 川崎民商事件의 사고방식이 참고가 된다 . 한편 즉시강제로 위법 하게 손해를 입은 경우에는 국가배상 국가배상법 1조 으로, 적법 한 즉시강제로 특별한 희생이 생긴 경우에는 損失補償 용어/損失補償.md 으로 각각 구제를 도모하게 된다. 참고: 행정상 의무이행확보수단 전체 체계 대분류 수단 대상 의무 근거법 요점 -------- ------ ----------- -------- ------ 행정상 강제집행 \u003cbr （의무의 존재가 전제 ） 代執行 （대집행） 대체적 작위의무만 行政代執行法 （일반법 있음） 행정청이 대신 실행 → 비용 징수 執行罰 （집행벌·집행과태료） 비대체적 작위의무·부작위의무 개별법만 — 현재 砂防法 36조 가 사실상 유일 심리적 압박. 반복 부과 가능 直接強制 모든 의무 일반법 없음 . 개별법에만（成田新法 등） 의무 불이행이 전제 — 즉시강제와의 결정적 차이 行政上の強制徴収 금전급부의무 国税徴収法 및 「국세체납처분의 예에 따른다」는 개별 규정 재산 압류·공매 即時強制 即時強制 의무 없음 （불이행을 전제로 하지 않음） 일반법 없음 . 개별법（警職法 3·4·5조, 消防法 29조 등） 급박한 사태에서 직접 실력 행사 행정벌 \u003cbr （ 과거의 위반 에 대한 제재） 行政刑罰 — 개별법의 벌칙 형법상의 형명 징역·벌금 등 . 형사소송법 절차 秩序罰 （過料） — 개별법·조례 신고 해태 등 경미한 위반. 비송사건절차법 절차（형벌 아님） 💡 수험 팁 - 한 문장 판별법: 「의무가 먼저 있었는가?」 있으면 강제집행 대집행·집행벌·직접강제·강제징수 , 없으면 즉시강제. 이 기준만으로 대부분의 지문이 갈린다. - 직접강제 ↔ 즉시강제 를 바꿔 놓은 지문이 최다 출제. 둘 다 「직접 실력 행사」라서 헷갈리도록 설계된다. 전제가 되는 의무의 유무 로 잘라라. - 즉시강제에는 일반법이 없다. 「행정대집행법이 즉시강제의 일반법이다」는 오답. 행정대집행법은 대집행의 일반법이다. - 대표 예시를 조문과 함께 암기: 警職法 3조 보호 ·4조 피난조치 ·5조 제지 , 消防法 29조 파괴소방 . - 즉시강제는 처분성이 인정 될 수 있으나, 순간적으로 끝나 버리는 경우가 많아 취소소송의 소의 이익이 소멸 하기 쉽다. 그래서 실제 구제는 국가배상 이 중심이 된다. - 영장주의 헌법 33·35조 는 형사절차 전용이 아니라 행정절차에도 취지가 미칠 수 있다 는 것이 통설. 「행정작용이므로 영장주의는 일절 적용되지 않는다」는 지문은 오답."},"信義誠実の原則":{"type":"term","subject":"용어","id":"信義誠実の原則","title":"信義誠実の原則","sub":"しんぎせいじつのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>しんぎせいじつのげんそく（신의성실의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙 — 민법의 기본원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>권리의 행사와 의무의 이행은 상대방의 정당한 신뢰를 배반하지 않고 신의에 좇아 성실히 해야 한다는 원칙（민법 1조 2항）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>강행규정적 일반조항. 조문의 문언상 「권리행사·의무이행」에 한정되나, \u003cstrong>판례는 계약 성립 전(계약체결상의 과실)·종료 후에도 폭넓게 적용\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>민법 1조 2항은 「\u003cstrong>権利の行使及び義務の履行は、信義に従い誠実に行わなければならない\u003c/strong>」라고 규정한다. 이를 줄여 \u003cstrong>信義則（신의칙）\u003c/strong>이라 부른다. 1조는 1항 公共の福祉, 2항 信義誠実, 3항 \u003ca href=\"#/e/%E6%A8%A9%E5%88%A9%E6%BF%AB%E7%94%A8\">権利濫用\u003c/a>の禁止의 3단 구조이며, 행정서사 시험에서는 \u003cstrong>「몇 조 몇 항인지」를 그대로 묻는다\u003c/strong>（信義則 = 1조 \u003cstrong>2\u003c/strong>항, 권리남용 = 1조 \u003cstrong>3\u003c/strong>항）.\u003c/p>\n\u003cp>신의칙은 구체적인 요건·효과가 없는 \u003cstrong>일반조항(一般条項)\u003c/strong>이다. 그래서 개별 조문으로 해결되지 않는 사안에서 결론을 조정하는 「최후의 수단」으로 쓰이며, 반대로 개별 규정이 있으면 그쪽이 우선한다(일반조항으로의 도피 금지). 적용 범위는 계약관계에 국한되지 않고 \u003cstrong>친족·상속, 소송법상의 행위, 나아가 행정법 관계에도\u003c/strong> 미친다.\u003c/p>\n\u003cp>신의칙에서 파생된 대표적 하위 법리가 네 가지다. ① \u003cstrong>禁反言의 원칙(矛盾行為禁止, estoppel)\u003c/strong> — 스스로 만든 외관·언동과 모순되는 주장은 허용되지 않는다. ② \u003cstrong>事情変更の原則\u003c/strong> — 계약 체결 후 기초 사정이 당사자가 예견할 수 없는 형태로 변경되면 계약의 해제·개정을 인정한다. ③ \u003cstrong>権利失効の原則\u003c/strong> — 권리자가 장기간 권리를 행사하지 않아 상대방이 이제 행사되지 않으리라 신뢰할 정당한 사유가 생긴 뒤의 행사는 허용되지 않는다. ④ \u003cstrong>クリーンハンズの原則\u003c/strong> — 스스로 법을 어긴 자는 법의 조력을 구할 수 없다（민법 708조 不法原因給付가 그 표현）.\u003c/p>\n\u003cp>\u003cstrong>2020년 4월 시행 개정민법(債権法改正) 기준의 포인트.\u003c/strong> 1조 자체는 개정되지 않았다. 다만 개정 과정에서 \u003cstrong>事情変更の法理와 権利失効の原則을 조문으로 명문화하려는 시도가 있었으나 모두 견송(見送り)되어\u003c/strong>, 이 둘은 지금도 \u003cstrong>명문 규정 없는 판례법리\u003c/strong>로 남아 있다. 반면 신의칙을 근거로 한 규율이 \u003cstrong>개별 조문으로 새로 들어온 예\u003c/strong>는 있다. 定型約款의 이른바 불당조항 규제인 548조의2 2항이 「상대방의 권리를 제한하거나 의무를 가중하는 조항으로서 \u003cstrong>信義誠実の原則に反して\u003c/strong>相手方の利益を一方的に害すると認められるもの」을 합의하지 않은 것으로 간주하는데, 이는 개정법이 신의칙을 요건에 직접 써 넣은 대표적 신설 규정이다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>시효완성 후의 채무승인\u003c/td>\u003ctd>最大判昭41.4.20 / 民集20巻4号702頁\u003c/td>\u003ctd>소멸시효 완성 후 채무자가 채무를 승인해 놓고 뒤늦게 시효를 원용\u003c/td>\u003ctd>시효완성 사실을 \u003cstrong>몰랐더라도\u003c/strong> 그 후의 시효원용은 \u003cstrong>信義則에 비추어 허용되지 않는다\u003c/strong>（禁反言의 대표례）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>権利失効の原則\u003c/td>\u003ctd>最判昭30.11.22 / 民集9巻12号1781頁\u003c/td>\u003ctd>무단양도를 알고도 7년간 방치한 임대인의 해제권 행사\u003c/td>\u003ctd>권리실효 원칙의 \u003cstrong>일반론은 제시\u003c/strong>（장기 불행사 + 상대방의 정당한 신뢰 + 특별한 사정 → 행사 불허）하되, \u003cstrong>본건에서는 적용을 부정\u003c/strong>하여 해제 유효\u003c/td>\u003c/tr>\u003ctr>\u003ctd>事情変更の原則\u003c/td>\u003ctd>最判平9.7.1 / 民集51巻6号2452頁\u003c/td>\u003ctd>골프장 법면(のり面) 붕괴로 방재공사가 필요해진 회원계약\u003c/td>\u003ctd>적용에는 사정변경이 \u003cstrong>예견 불가능\u003c/strong>하고 \u003cstrong>당사자에게 귀책사유가 없을 것\u003c/strong>이 필요 → 본건은 \u003cstrong>적용 부정\u003c/strong>（\u003cstrong>최고재판소가 사정변경 원칙의 적용을 인정한 예는 아직 없다\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>信頼関係破壊の法理\u003c/td>\u003ctd>最判昭28.9.25\u003c/td>\u003ctd>임차인의 무단전대（민법 612조）\u003c/td>\u003ctd>무단전대라도 \u003cstrong>임대인에 대한 배신적 행위라고 인정하기에 부족한 특단의 사정\u003c/strong>이 있으면 612조 2항의 해제권은 발생하지 않는다（신의칙에 의한 해제권 제한）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>조문 위치 함정 1순위\u003c/strong>: 信義則 = 1조 \u003cstrong>2항\u003c/strong> / \u003ca href=\"#/e/%E6%A8%A9%E5%88%A9%E6%BF%AB%E7%94%A8\">権利濫用\u003c/a> = 1조 \u003cstrong>3항\u003c/strong> / 公共の福祉 = 1조 \u003cstrong>1항\u003c/strong>. 지문에서 항을 바꿔치기하는 출제가 잦다.\u003c/li>\u003cli>\u003cstrong>대비: 事情変更の原則 ↔ 権利失効の原則\u003c/strong>. 둘 다 \u003cstrong>명문 규정이 없는 판례법리\u003c/strong>이고, 2020년 개정에서 \u003cstrong>명문화가 견송\u003c/strong>되었다. 「개정민법에 사정변경 조항이 신설되었다」는 지문은 \u003cstrong>오답\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「최고재판소가 事情変更の原則을 적용해 계약 해제를 인정한 판례가 있다」 → \u003cstrong>오답\u003c/strong>. 일반론(요건)은 인정하지만 \u003cstrong>실제로 적용을 인정한 최고재 판례는 없다\u003c/strong>. 最判平9.7.1도 결론은 적용 부정이다.\u003c/li>\u003cli>最大判昭41.4.20은 \u003cstrong>「시효완성을 몰랐어도」\u003c/strong> 원용 불가라는 점이 핵심. 「몰랐다면 원용할 수 있다」는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>대비: 신의칙(1조 2항) ↔ \u003ca href=\"#/e/%E5%85%AC%E5%BA%8F%E8%89%AF%E4%BF%97\">公序良俗\u003c/a>(90조)\u003c/strong>. 신의칙은 \u003cstrong>당사자 간의 관계\u003c/strong>를 조정해 권리행사를 막는 것(효과 = 청구 기각·해제 불허), 공서양속은 \u003cstrong>법률행위 자체를 무효\u003c/strong>로 만든다(효과 = 無効). 물어보는 「효과」가 다르다.\u003c/li>\u003cli>신의칙이 조문 요건에 직접 등장하는 신설 규정 = \u003cstrong>548조의2 2항(定型約款의 불당조항)\u003c/strong>. 정형약관 파트와 세트로 나온다.\u003c/li>\u003c/ul>","search":"信義誠実の原則 しんぎせいじつのげんそく 항목 내용 ------ ------ 읽기 しんぎせいじつのげんそく（신의성실의 원칙） 과목 민법（총칙 — 민법의 기본원칙） 한줄 정의 권리의 행사와 의무의 이행은 상대방의 정당한 신뢰를 배반하지 않고 신의에 좇아 성실히 해야 한다는 원칙（민법 1조 2항） 통설·판례 강행규정적 일반조항. 조문의 문언상 「권리행사·의무이행」에 한정되나, 판례는 계약 성립 전 계약체결상의 과실 ·종료 후에도 폭넓게 적용 개념 민법 1조 2항은 「 権利の行使及び義務の履行は、信義に従い誠実に行わなければならない 」라고 규정한다. 이를 줄여 信義則（신의칙） 이라 부른다. 1조는 1항 公共の福祉, 2항 信義誠実, 3항 権利濫用 용어/権利濫用.md の禁止의 3단 구조이며, 행정서사 시험에서는 「몇 조 몇 항인지」를 그대로 묻는다 （信義則 = 1조 2 항, 권리남용 = 1조 3 항）. 신의칙은 구체적인 요건·효과가 없는 일반조항 一般条項 이다. 그래서 개별 조문으로 해결되지 않는 사안에서 결론을 조정하는 「최후의 수단」으로 쓰이며, 반대로 개별 규정이 있으면 그쪽이 우선한다 일반조항으로의 도피 금지 . 적용 범위는 계약관계에 국한되지 않고 친족·상속, 소송법상의 행위, 나아가 행정법 관계에도 미친다. 신의칙에서 파생된 대표적 하위 법리가 네 가지다. ① 禁反言의 원칙 矛盾行為禁止, estoppel — 스스로 만든 외관·언동과 모순되는 주장은 허용되지 않는다. ② 事情変更の原則 — 계약 체결 후 기초 사정이 당사자가 예견할 수 없는 형태로 변경되면 계약의 해제·개정을 인정한다. ③ 権利失効の原則 — 권리자가 장기간 권리를 행사하지 않아 상대방이 이제 행사되지 않으리라 신뢰할 정당한 사유가 생긴 뒤의 행사는 허용되지 않는다. ④ クリーンハンズの原則 — 스스로 법을 어긴 자는 법의 조력을 구할 수 없다（민법 708조 不法原因給付가 그 표현）. 2020년 4월 시행 개정민법 債権法改正 기준의 포인트. 1조 자체는 개정되지 않았다. 다만 개정 과정에서 事情変更の法理와 権利失効の原則을 조문으로 명문화하려는 시도가 있었으나 모두 견송 見送り 되어 , 이 둘은 지금도 명문 규정 없는 판례법리 로 남아 있다. 반면 신의칙을 근거로 한 규율이 개별 조문으로 새로 들어온 예 는 있다. 定型約款의 이른바 불당조항 규제인 548조의2 2항이 「상대방의 권리를 제한하거나 의무를 가중하는 조항으로서 信義誠実の原則に反して 相手方の利益を一方的に害すると認められるもの」을 합의하지 않은 것으로 간주하는데, 이는 개정법이 신의칙을 요건에 직접 써 넣은 대표적 신설 규정이다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 시효완성 후의 채무승인 最大判昭41.4.20 / 民集20巻4号702頁 소멸시효 완성 후 채무자가 채무를 승인해 놓고 뒤늦게 시효를 원용 시효완성 사실을 몰랐더라도 그 후의 시효원용은 信義則에 비추어 허용되지 않는다 （禁反言의 대표례） 権利失効の原則 最判昭30.11.22 / 民集9巻12号1781頁 무단양도를 알고도 7년간 방치한 임대인의 해제권 행사 권리실효 원칙의 일반론은 제시 （장기 불행사 + 상대방의 정당한 신뢰 + 특별한 사정 → 행사 불허）하되, 본건에서는 적용을 부정 하여 해제 유효 事情変更の原則 最判平9.7.1 / 民集51巻6号2452頁 골프장 법면 のり面 붕괴로 방재공사가 필요해진 회원계약 적용에는 사정변경이 예견 불가능 하고 당사자에게 귀책사유가 없을 것 이 필요 → 본건은 적용 부정 （ 최고재판소가 사정변경 원칙의 적용을 인정한 예는 아직 없다 ） 信頼関係破壊の法理 最判昭28.9.25 임차인의 무단전대（민법 612조） 무단전대라도 임대인에 대한 배신적 행위라고 인정하기에 부족한 특단의 사정 이 있으면 612조 2항의 해제권은 발생하지 않는다（신의칙에 의한 해제권 제한） 💡 수험 팁 - 조문 위치 함정 1순위 : 信義則 = 1조 2항 / 権利濫用 용어/権利濫用.md = 1조 3항 / 公共の福祉 = 1조 1항 . 지문에서 항을 바꿔치기하는 출제가 잦다. - 대비: 事情変更の原則 ↔ 権利失効の原則 . 둘 다 명문 규정이 없는 판례법리 이고, 2020년 개정에서 명문화가 견송 되었다. 「개정민법에 사정변경 조항이 신설되었다」는 지문은 오답 . - 최대 함정 : 「최고재판소가 事情変更の原則을 적용해 계약 해제를 인정한 판례가 있다」 → 오답 . 일반론 요건 은 인정하지만 실제로 적용을 인정한 최고재 판례는 없다 . 最判平9.7.1도 결론은 적용 부정이다. - 最大判昭41.4.20은 「시효완성을 몰랐어도」 원용 불가라는 점이 핵심. 「몰랐다면 원용할 수 있다」는 지문은 오답. - 대비: 신의칙 1조 2항 ↔ 公序良俗 용어/公序良俗.md 90조 . 신의칙은 당사자 간의 관계 를 조정해 권리행사를 막는 것 효과 = 청구 기각·해제 불허 , 공서양속은 법률행위 자체를 무효 로 만든다 효과 = 無効 . 물어보는 「효과」가 다르다. - 신의칙이 조문 요건에 직접 등장하는 신설 규정 = 548조의2 2항 定型約款의 불당조항 . 정형약관 파트와 세트로 나온다."},"権利濫用":{"type":"term","subject":"용어","id":"権利濫用","title":"権利濫用","sub":"けんりらんよう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>けんりらんよう（권리남용）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙 — 민법의 기본원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>외형상으로는 정당한 권리의 행사라도 사회통념상 허용되는 범위를 벗어난 경우 그 효력을 부정하는 법리（민법 1조 3항）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>객관적 요건(권리자가 얻는 이익과 상대방이 입는 손해의 현저한 불균형)을 중심으로 판단\u003c/strong>하되, 가해 목적 등 주관적 사정도 함께 고려하는 것이 판례의 태도\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>민법 1조 3항은 「\u003cstrong>権利の濫用は、これを許さない\u003c/strong>」라고만 규정한다. 요건이 전혀 쓰여 있지 않은 \u003cstrong>일반조항\u003c/strong>이라는 점에서 \u003ca href=\"#/e/%E4%BF%A1%E7%BE%A9%E8%AA%A0%E5%AE%9F%E3%81%AE%E5%8E%9F%E5%89%87\">信義誠実の原則\u003c/a>(1조 2항)과 같다. 소유권 등 절대적으로 보이는 권리라도 무제한일 수 없다는 근대 소유권 사상의 수정을 담고 있으며, 1947년 개정으로 1조가 신설되기 \u003cstrong>이전\u003c/strong>부터 판례가 먼저 만들어 낸 법리다.\u003c/p>\n\u003cp>판단 기준은 ① \u003cstrong>주관적 요건\u003c/strong> — 오로지 상대방을 해할 목적(가해 의사, 이른바 シカーネ)이 있는가, ② \u003cstrong>객관적 요건\u003c/strong> — 권리 행사로 권리자가 얻는 이익과 상대방·사회가 입는 손해 사이에 현저한 불균형이 있는가의 두 축이다. 초기 판례는 가해 의사를 중시했으나, \u003cstrong>宇奈月温泉事件 이후 판례는 객관적 이익형량을 중심에 두고\u003c/strong> 주관적 사정을 보조적으로 참작하는 방향으로 굳어졌다.\u003c/p>\n\u003cp>효과는 세 단계로 정리된다. ① \u003cstrong>원칙적 효과는 권리 행사의 효력 부정\u003c/strong> — 즉 그 청구가 기각된다(예: 방해배제청구 기각). 이때 권리 자체가 소멸하는 것은 아니다. ② 권리 행사로 상대방에게 손해를 입힌 경우에는 \u003cstrong>불법행위(709조)에 의한 손해배상 의무\u003c/strong>가 생길 수 있다. ③ 예외적으로 \u003cstrong>권리 자체가 박탈\u003c/strong>되는 경우가 있는데, 이는 \u003cstrong>명문 규정이 있을 때에 한한다\u003c/strong>. 대표적으로 친권 남용을 이유로 한 \u003cstrong>親権喪失の審判(834조)·親権停止の審判(834조의2)\u003c/strong>이 그것이다.\u003c/p>\n\u003cp>\u003cstrong>2020년 4월 시행 개정민법 기준의 포인트.\u003c/strong> 1조는 개정되지 않았다. 다만 개정법이 \u003cstrong>消滅時効의 기산점·기간을 「채권자가 권리를 행사할 수 있음을 안 때부터 5년 / 권리를 행사할 수 있는 때부터 10년」의 이중구조(166조 1항)\u003c/strong>로 재편하면서, 종래 권리남용·\u003ca href=\"#/e/%E4%BF%A1%E7%BE%A9%E8%AA%A0%E5%AE%9F%E3%81%AE%E5%8E%9F%E5%89%87\">信義誠実の原則\u003c/a>로 처리하던 사안 중 일부가 조문으로 흡수되었다. 그러나 권리남용 법리 자체는 여전히 \u003cstrong>명문의 요건 없는 일반조항\u003c/strong>으로 남아 있다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>宇奈月温泉事件\u003c/strong>（우나즈키 온천 사건）\u003c/td>\u003ctd>大判昭10.10.5 / 民集14巻1965頁\u003c/td>\u003ctd>약 7.5km 인탕관(引湯管)이 \u003cstrong>불과 2평\u003c/strong> 스치는 토지를 사들인 X가 관의 철거를 요구하고, 응하지 않으려면 주변 황무지까지 합쳐 3,000평을 고가에 매수하라고 압박\u003c/td>\u003ctd>\u003cstrong>권리남용으로 청구 기각\u003c/strong>. 권리 행사로 얻는 이익이 극히 근소한 데 비해 상대방·지역사회가 입는 손해가 현저히 크고, 부당한 이익을 노린 것 → \u003cstrong>대심원이 권리남용을 정면으로 인정한 최초의 판결\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>信玄公旗掛松事件\u003c/strong>（신겐공 깃발걸이 소나무 사건）\u003c/td>\u003ctd>大判大8.3.3 / 民録25輯356頁\u003c/td>\u003ctd>국철 증기기관차의 매연으로 선로변의 유서 깊은 노송이 고사, 소유자가 국가에 손해배상 청구\u003c/td>\u003ctd>\u003cstrong>소유자 승소\u003c/strong>. 철도사업이 공익성이 높더라도 \u003cstrong>권리 행사가 사회관념상 타당한 범위를 넘어 타인의 권리를 침해하면 위법\u003c/strong>하다 → 권리남용 법리를 실질적으로 채택한 선구적 판결（국가배상법 제정 \u003cstrong>이전\u003c/strong>의 사안）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「宇奈月温泉」이라는 단어가 보이면 즉시 「1조 3항·권리남용·청구 기각」\u003c/strong>. 인용 \u003ccode>大判昭10.10.5\u003c/code>까지 세트 암기.\u003c/li>\u003cli>\u003cstrong>대비: 信玄公旗掛松(大判大8.3.3, 최초의 실질적 채택·손해배상) ↔ 宇奈月温泉(大判昭10.10.5, 명시적 채택·방해배제 기각)\u003c/strong>. 연도 순서(大正 → 昭和)와 청구의 종류(배상 ↔ 철거)로 구별하라.\u003c/li>\u003cli>\u003cstrong>효과 함정\u003c/strong>: 권리남용의 원칙적 효과는 \u003cstrong>「권리 행사가 인정되지 않는다(청구 기각)」\u003c/strong>이지 \u003cstrong>「권리가 소멸한다」가 아니다\u003c/strong>. 권리 자체의 박탈은 \u003cstrong>친권상실(834조) 등 명문 규정이 있는 경우에 한정\u003c/strong>된다.\u003c/li>\u003cli>\u003cstrong>대비: \u003ca href=\"#/e/%E4%BF%A1%E7%BE%A9%E8%AA%A0%E5%AE%9F%E3%81%AE%E5%8E%9F%E5%89%87\">信義誠実の原則\u003c/a>(1조 2항) ↔ 権利濫用(1조 3항)\u003c/strong>. 신의칙은 「이미 존재하는 관계에서 상대방의 신뢰를 배반했는가」, 권리남용은 「권리 행사 자체가 도를 넘었는가」. 실제 사안에서는 중첩되지만 \u003cstrong>항 번호를 바꿔 묻는 지문\u003c/strong>이 나오므로 반드시 분리 암기.\u003c/li>\u003cli>주관적 요건(가해 목적)은 \u003cstrong>필수 요건이 아니다\u003c/strong>. 「가해 의사가 없으면 권리남용이 성립하지 않는다」는 지문은 \u003cstrong>오답\u003c/strong>（판례는 객관적 이익형량 중심）.\u003c/li>\u003cli>\u003cstrong>대비: 権利濫用(효과 = 권리 행사 부정) ↔ \u003ca href=\"#/e/%E5%85%AC%E5%BA%8F%E8%89%AF%E4%BF%97\">公序良俗\u003c/a> 90조(효과 = 법률행위 자체가 無効)\u003c/strong>. 권리남용은 법률행위의 유효·무효를 다루는 법리가 아니다.\u003c/li>\u003c/ul>","search":"権利濫用 けんりらんよう 항목 내용 ------ ------ 읽기 けんりらんよう（권리남용） 과목 민법（총칙 — 민법의 기본원칙） 한줄 정의 외형상으로는 정당한 권리의 행사라도 사회통념상 허용되는 범위를 벗어난 경우 그 효력을 부정하는 법리（민법 1조 3항） 통설·판례 객관적 요건 권리자가 얻는 이익과 상대방이 입는 손해의 현저한 불균형 을 중심으로 판단 하되, 가해 목적 등 주관적 사정도 함께 고려하는 것이 판례의 태도 개념 민법 1조 3항은 「 権利の濫用は、これを許さない 」라고만 규정한다. 요건이 전혀 쓰여 있지 않은 일반조항 이라는 점에서 信義誠実の原則 용어/信義誠実の原則.md 1조 2항 과 같다. 소유권 등 절대적으로 보이는 권리라도 무제한일 수 없다는 근대 소유권 사상의 수정을 담고 있으며, 1947년 개정으로 1조가 신설되기 이전 부터 판례가 먼저 만들어 낸 법리다. 판단 기준은 ① 주관적 요건 — 오로지 상대방을 해할 목적 가해 의사, 이른바 シカーネ 이 있는가, ② 객관적 요건 — 권리 행사로 권리자가 얻는 이익과 상대방·사회가 입는 손해 사이에 현저한 불균형이 있는가의 두 축이다. 초기 판례는 가해 의사를 중시했으나, 宇奈月温泉事件 이후 판례는 객관적 이익형량을 중심에 두고 주관적 사정을 보조적으로 참작하는 방향으로 굳어졌다. 효과는 세 단계로 정리된다. ① 원칙적 효과는 권리 행사의 효력 부정 — 즉 그 청구가 기각된다 예: 방해배제청구 기각 . 이때 권리 자체가 소멸하는 것은 아니다. ② 권리 행사로 상대방에게 손해를 입힌 경우에는 불법행위 709조 에 의한 손해배상 의무 가 생길 수 있다. ③ 예외적으로 권리 자체가 박탈 되는 경우가 있는데, 이는 명문 규정이 있을 때에 한한다 . 대표적으로 친권 남용을 이유로 한 親権喪失の審判 834조 ·親権停止の審判 834조의2 이 그것이다. 2020년 4월 시행 개정민법 기준의 포인트. 1조는 개정되지 않았다. 다만 개정법이 消滅時効의 기산점·기간을 「채권자가 권리를 행사할 수 있음을 안 때부터 5년 / 권리를 행사할 수 있는 때부터 10년」의 이중구조 166조 1항 로 재편하면서, 종래 권리남용· 信義誠実の原則 용어/信義誠実の原則.md 로 처리하던 사안 중 일부가 조문으로 흡수되었다. 그러나 권리남용 법리 자체는 여전히 명문의 요건 없는 일반조항 으로 남아 있다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 宇奈月温泉事件 （우나즈키 온천 사건） 大判昭10.10.5 / 民集14巻1965頁 약 7.5km 인탕관 引湯管 이 불과 2평 스치는 토지를 사들인 x가 관의 철거를 요구하고, 응하지 않으려면 주변 황무지까지 합쳐 3,000평을 고가에 매수하라고 압박 권리남용으로 청구 기각 . 권리 행사로 얻는 이익이 극히 근소한 데 비해 상대방·지역사회가 입는 손해가 현저히 크고, 부당한 이익을 노린 것 → 대심원이 권리남용을 정면으로 인정한 최초의 판결 信玄公旗掛松事件 （신겐공 깃발걸이 소나무 사건） 大判大8.3.3 / 民録25輯356頁 국철 증기기관차의 매연으로 선로변의 유서 깊은 노송이 고사, 소유자가 국가에 손해배상 청구 소유자 승소 . 철도사업이 공익성이 높더라도 권리 행사가 사회관념상 타당한 범위를 넘어 타인의 권리를 침해하면 위법 하다 → 권리남용 법리를 실질적으로 채택한 선구적 판결（국가배상법 제정 이전 의 사안） 💡 수험 팁 - 「宇奈月温泉」이라는 단어가 보이면 즉시 「1조 3항·권리남용·청구 기각」 . 인용 大判昭10.10.5 까지 세트 암기. - 대비: 信玄公旗掛松 大判大8.3.3, 최초의 실질적 채택·손해배상 ↔ 宇奈月温泉 大判昭10.10.5, 명시적 채택·방해배제 기각 . 연도 순서 大正 → 昭和 와 청구의 종류 배상 ↔ 철거 로 구별하라. - 효과 함정 : 권리남용의 원칙적 효과는 「권리 행사가 인정되지 않는다 청구 기각 」 이지 「권리가 소멸한다」가 아니다 . 권리 자체의 박탈은 친권상실 834조 등 명문 규정이 있는 경우에 한정 된다. - 대비: 信義誠実の原則 용어/信義誠実の原則.md 1조 2항 ↔ 権利濫用 1조 3항 . 신의칙은 「이미 존재하는 관계에서 상대방의 신뢰를 배반했는가」, 권리남용은 「권리 행사 자체가 도를 넘었는가」. 실제 사안에서는 중첩되지만 항 번호를 바꿔 묻는 지문 이 나오므로 반드시 분리 암기. - 주관적 요건 가해 목적 은 필수 요건이 아니다 . 「가해 의사가 없으면 권리남용이 성립하지 않는다」는 지문은 오답 （판례는 객관적 이익형량 중심）. - 대비: 権利濫用 효과 = 권리 행사 부정 ↔ 公序良俗 용어/公序良俗.md 90조 효과 = 법률행위 자체가 無効 . 권리남용은 법률행위의 유효·무효를 다루는 법리가 아니다."},"公序良俗":{"type":"term","subject":"용어","id":"公序良俗","title":"公序良俗","sub":"こうじょりょうぞく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>こうじょりょうぞく（공서양속）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>민법（총칙 — 법률행위）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>공공의 질서 또는 선량한 풍속에 반하는 법률행위는 \u003cstrong>무효\u003c/strong>로 한다는 원칙（민법 90조）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>헌법의 인권 규정을 사인 간에 침투시키는 \u003cstrong>매개 조항\u003c/strong>（\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a>의 간접적용설）이자, \u003ca href=\"#/e/%E6%9A%B4%E5%88%A9%E8%A1%8C%E7%82%BA\">暴利行為\u003c/a> 등 판례법리의 근거 조문\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>개정 후 민법 90조는 「\u003cstrong>公の秩序又は善良の風俗に反する法律行為は、無効とする\u003c/strong>」이다. 「公の秩序」는 국가·사회의 일반적 질서를, 「善良の風俗」은 사회의 일반적 도덕관념을 가리키지만 실무상 둘을 엄밀히 나누지 않고 \u003cstrong>「公序良俗」이라는 한 덩어리의 일반조항\u003c/strong>으로 운용한다. 사적자치(계약자유)의 \u003cstrong>외재적 한계\u003c/strong>를 긋는 조문이며, 위반의 효과는 \u003cstrong>취소가 아니라 처음부터 당연 무효(絶対的無効)\u003c/strong>다. 따라서 \u003cstrong>추인(119조)으로 유효하게 만들 수 없고\u003c/strong>, 누구든지 무효를 주장할 수 있으며 \u003cstrong>선의의 제3자 보호 규정도 없다\u003c/strong>（94조 2항·95조 4항·96조 3항 같은 제3자 보호 장치가 90조에는 없다는 점이 시험 포인트）.\u003c/p>\n\u003cp>\u003cstrong>2020년 4월 시행 개정민법의 핵심 변경.\u003c/strong> 구법 90조는 「公の秩序又は善良の風俗に反する\u003cstrong>事項を目的とする\u003c/strong>法律行為は、無効とする」였는데, 개정으로 \u003cstrong>「事項を目的とする」가 삭제\u003c/strong>되었다. 실질적 내용을 바꾼 것이 아니라 판례의 실무를 조문에 반영한 것으로, \u003cstrong>법률행위의 「내용」 자체가 반사회적인 경우뿐 아니라, 법률행위가 이루어진 「과정·상황」에 공서양속 위반이 있는 경우에도 무효가 된다\u003c/strong>는 점을 조문상 명확히 한 것이다. 이 개정으로 상대방의 궁박·경솔·무경험을 이용하는 \u003cstrong>\u003ca href=\"#/e/%E6%9A%B4%E5%88%A9%E8%A1%8C%E7%82%BA\">暴利行為\u003c/a>\u003c/strong>나 폭력적 권유 같은 \u003cstrong>체결 과정의 하자\u003c/strong> 유형이 90조에 자리 잡았다는 설명이 가능해졌다.\u003c/p>\n\u003cp>\u003cstrong>\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a>과의 연결이 결정적이다.\u003c/strong> 헌법의 인권 규정은 원래 「국가 대 국민」의 관계를 규율하므로 사인 상호 간에 직접 적용되지 않는다는 것이 판례·통설(\u003cstrong>간접적용설\u003c/strong>)인데, 그 「간접」의 통로가 바로 \u003cstrong>민법 90조와 709조 같은 사법의 일반조항\u003c/strong>이다. 즉 「기업이 성별만을 이유로 정년을 달리 정한 취업규칙」은 헌법 14조를 직접 적용해 위헌이라 하는 것이 아니라, \u003cstrong>헌법 14조의 취지를 90조의 「공서양속」 해석에 반영하여 그 취업규칙을 무효로\u003c/strong> 만든다（日産自動車事件）. 시험에서 「헌법을 직접 적용한다」는 지문이 오답인 이유가 여기에 있다.\u003c/p>\n\u003cp>전형적인 위반 유형은 ① \u003cstrong>인륜·성도덕 위반\u003c/strong>（첩계약, 芸娼妓契約）, ② \u003cstrong>정의관념 위반\u003c/strong>（담합, 뇌물, 밀수, 범죄 가담 대가）, ③ \u003cstrong>\u003ca href=\"#/e/%E6%9A%B4%E5%88%A9%E8%A1%8C%E7%82%BA\">暴利行為\u003c/a>\u003c/strong>, ④ \u003cstrong>개인의 자유·인권 침해\u003c/strong>（인신구속적 노무계약, 차별적 취급）, ⑤ \u003cstrong>거래 안전·경제질서 침해\u003c/strong>（과도한 경업금지 특약, 사행행위）로 정리된다. 한편 \u003cstrong>강행법규 위반은 91조·법령의 문제\u003c/strong>이고, 단순한 \u003cstrong>단속법규(取締法規) 위반은 그 자체로는 사법상의 효력에 영향을 주지 않는다\u003c/strong>는 점을 90조와 구별해야 한다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>芸娼妓契約事件\u003c/td>\u003ctd>最判昭30.10.7 / 民集9巻11号1616頁\u003c/td>\u003ctd>딸의 작부(酌婦) 취업계약과 부모에 대한 전차금(前借金) 소비대차를 세트로 체결\u003c/td>\u003ctd>취업계약과 소비대차는 \u003cstrong>불가분 일체\u003c/strong>이므로 \u003cstrong>전체가 90조 위반으로 무효\u003c/strong>. 나아가 교부된 전차금은 \u003cstrong>불법원인급여(708조)로 반환 청구도 불가\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>日産自動車事件（닛산 자동차 사건）\u003c/td>\u003ctd>最三小判昭56.3.24 / 民集35巻2号300頁\u003c/td>\u003ctd>남자 60세·여자 55세로 정년을 달리 정한 취업규칙\u003c/td>\u003ctd>성별만을 이유로 한 불합리한 차별은 \u003cstrong>헌법 14조의 취지에 반하여 90조 위반으로 무효\u003c/strong> → \u003cstrong>\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a> 간접적용설이 실제로 구제를 실현한 대표례\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>불륜 상대방에 대한 포괄유증\u003c/td>\u003ctd>最判昭61.11.20 / 民集40巻7号1167頁\u003c/td>\u003ctd>처·딸·불륜 상대 여성에게 각 1/3씩 유증\u003c/td>\u003ctd>\u003cstrong>유증 유효\u003c/strong>（90조 위반 아님）. 불륜관계 유지를 목적으로 한 것이 아니라 \u003cstrong>생계 배려가 주목적\u003c/strong>이고, 상속인의 생활 기반을 해치지 않는 정도라면 공서양속에 반하지 않는다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>食品衛生法違反 식육판매\u003c/td>\u003ctd>最判昭35.3.18\u003c/td>\u003ctd>무허가 영업자가 한 매매의 사법상 효력\u003c/td>\u003ctd>식품위생법은 \u003cstrong>단순한 단속법규\u003c/strong>에 지나지 않아, \u003cstrong>허가 유무는 거래의 사법상 효력에 영향을 주지 않는다\u003c/strong> → 계약 \u003cstrong>유효\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%9A%B4%E5%88%A9%E8%A1%8C%E7%82%BA\">暴利行為\u003c/a>\u003c/td>\u003ctd>大判昭9.5.1 / 民集13巻875頁\u003c/td>\u003ctd>변제하지 못하면 대여금의 5배에 달하는 채권을 몰수한다는 특약\u003c/td>\u003ctd>궁박·경솔·무경험의 이용(주관적 요건) + 현저히 과당한 이익(객관적 요건) → \u003cstrong>90조 위반으로 무효\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>90조 위반의 효과는 「無効」이지 「取消し」가 아니다.\u003c/strong> 취소로 바꿔 놓은 지문은 무조건 오답. 나아가 \u003cstrong>추인 불가·선의의 제3자 보호 없음\u003c/strong>까지 세트로 암기（94조 2항·95조 4항·96조 3항과 대비）.\u003c/li>\u003cli>\u003cstrong>개정 함정\u003c/strong>: 「公序良俗に反する\u003cstrong>事項を目的とする\u003c/strong>法律行為」라고 쓰인 지문은 \u003cstrong>구법 문언\u003c/strong>이다. 개정법은 「事項を目的とする」를 \u003cstrong>삭제\u003c/strong>하여 \u003cstrong>체결 과정·상황의 공서양속 위반\u003c/strong>도 포섭함을 명확히 했다.\u003c/li>\u003cli>\u003cstrong>\u003ca href=\"#/e/%E7%A7%81%E4%BA%BA%E9%96%93%E5%8A%B9%E5%8A%9B\">私人間効力\u003c/a>과 반드시 묶어라.\u003c/strong> 헌법 문제로 나와도 답의 통로는 90조다. 「헌법의 인권 규정을 사인 간에 \u003cstrong>직접\u003c/strong> 적용한다」 → 오답, 「민법 90조를 매개로 \u003cstrong>간접\u003c/strong> 적용한다」 → 정답.\u003c/li>\u003cli>\u003cstrong>대비: 90조(공서양속) ↔ 강행법규 위반 ↔ 단속법규 위반\u003c/strong>. ① 공서양속 위반 = 무효, ② 강행법규 위반 = 무효, ③ \u003cstrong>단속법규 위반 = 원칙적으로 사법상 유효\u003c/strong>（最判昭35.3.18). 「무허가 영업이므로 계약이 무효」라는 지문은 함정.\u003c/li>\u003cli>\u003cstrong>대비: 90조(무효) ↔ 708조(불법원인급여, 반환 청구 불가)\u003c/strong>. 90조로 무효가 되면 원칙적으로 부당이득 반환이 문제되는데, 반사회성이 급여자 측에도 있으면 \u003cstrong>708조로 반환도 막힌다\u003c/strong>（芸娼妓契約事件). 「무효니까 준 돈을 돌려받을 수 있다」는 지문은 함정.\u003c/li>\u003cli>\u003cstrong>불륜 관련 유증은 결론이 두 갈래\u003c/strong>라는 점에 주의. 「불륜 상대에 대한 유증은 언제나 공서양속 위반으로 무효」는 \u003cstrong>오답\u003c/strong>（最判昭61.11.20은 유효로 판단）. 관계 유지·대가 목적인지, 생계 배려 목적인지로 갈린다.\u003c/li>\u003c/ul>","search":"公序良俗 こうじょりょうぞく 항목 내용 ------ ------ 읽기 こうじょりょうぞく（공서양속） 과목 민법（총칙 — 법률행위） 한줄 정의 공공의 질서 또는 선량한 풍속에 반하는 법률행위는 무효 로 한다는 원칙（민법 90조） 통설·판례 헌법의 인권 규정을 사인 간에 침투시키는 매개 조항 （ 私人間効力 용어/私人間効力.md 의 간접적용설）이자, 暴利行為 용어/暴利行為.md 등 판례법리의 근거 조문 개념 개정 후 민법 90조는 「 公の秩序又は善良の風俗に反する法律行為は、無効とする 」이다. 「公の秩序」는 국가·사회의 일반적 질서를, 「善良の風俗」은 사회의 일반적 도덕관념을 가리키지만 실무상 둘을 엄밀히 나누지 않고 「公序良俗」이라는 한 덩어리의 일반조항 으로 운용한다. 사적자치 계약자유 의 외재적 한계 를 긋는 조문이며, 위반의 효과는 취소가 아니라 처음부터 당연 무효 絶対的無効 다. 따라서 추인 119조 으로 유효하게 만들 수 없고 , 누구든지 무효를 주장할 수 있으며 선의의 제3자 보호 규정도 없다 （94조 2항·95조 4항·96조 3항 같은 제3자 보호 장치가 90조에는 없다는 점이 시험 포인트）. 2020년 4월 시행 개정민법의 핵심 변경. 구법 90조는 「公の秩序又は善良の風俗に反する 事項を目的とする 法律行為は、無効とする」였는데, 개정으로 「事項を目的とする」가 삭제 되었다. 실질적 내용을 바꾼 것이 아니라 판례의 실무를 조문에 반영한 것으로, 법률행위의 「내용」 자체가 반사회적인 경우뿐 아니라, 법률행위가 이루어진 「과정·상황」에 공서양속 위반이 있는 경우에도 무효가 된다 는 점을 조문상 명확히 한 것이다. 이 개정으로 상대방의 궁박·경솔·무경험을 이용하는 暴利行為 용어/暴利行為.md 나 폭력적 권유 같은 체결 과정의 하자 유형이 90조에 자리 잡았다는 설명이 가능해졌다. 私人間効力 용어/私人間効力.md 과의 연결이 결정적이다. 헌법의 인권 규정은 원래 「국가 대 국민」의 관계를 규율하므로 사인 상호 간에 직접 적용되지 않는다는 것이 판례·통설 간접적용설 인데, 그 「간접」의 통로가 바로 민법 90조와 709조 같은 사법의 일반조항 이다. 즉 「기업이 성별만을 이유로 정년을 달리 정한 취업규칙」은 헌법 14조를 직접 적용해 위헌이라 하는 것이 아니라, 헌법 14조의 취지를 90조의 「공서양속」 해석에 반영하여 그 취업규칙을 무효로 만든다（日産自動車事件）. 시험에서 「헌법을 직접 적용한다」는 지문이 오답인 이유가 여기에 있다. 전형적인 위반 유형은 ① 인륜·성도덕 위반 （첩계약, 芸娼妓契約）, ② 정의관념 위반 （담합, 뇌물, 밀수, 범죄 가담 대가）, ③ 暴利行為 용어/暴利行為.md , ④ 개인의 자유·인권 침해 （인신구속적 노무계약, 차별적 취급）, ⑤ 거래 안전·경제질서 침해 （과도한 경업금지 특약, 사행행위）로 정리된다. 한편 강행법규 위반은 91조·법령의 문제 이고, 단순한 단속법규 取締法規 위반은 그 자체로는 사법상의 효력에 영향을 주지 않는다 는 점을 90조와 구별해야 한다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 芸娼妓契約事件 最判昭30.10.7 / 民集9巻11号1616頁 딸의 작부 酌婦 취업계약과 부모에 대한 전차금 前借金 소비대차를 세트로 체결 취업계약과 소비대차는 불가분 일체 이므로 전체가 90조 위반으로 무효 . 나아가 교부된 전차금은 불법원인급여 708조 로 반환 청구도 불가 /strong>（大判昭9.5.1）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>폭리행위란 \u003cstrong>상대방이 처한 열악한 상황을 이용해 균형을 잃은 이익을 챙기는 거래\u003c/strong>를 말한다. 대심원은 大判昭9.5.1에서 그 요건을 두 가지로 정식화했다. ① \u003cstrong>주관적 요건\u003c/strong> — 타인의 \u003cstrong>窮迫（궁박, 경제적·정신적으로 몰린 상태）·軽率（경솔）·無経験（무경험）을 이용할 것\u003c/strong>, ② \u003cstrong>객관적 요건\u003c/strong> — 그 결과 \u003cstrong>현저히 과당한 이익을 얻는 것을 내용으로 할 것\u003c/strong>. 두 요건이 모두 갖추어지면 그 법률행위는 \u003ca href=\"#/e/%E5%85%AC%E5%BA%8F%E8%89%AF%E4%BF%97\">公序良俗\u003c/a>에 반하여 \u003cstrong>무효\u003c/strong>가 된다.\u003c/p>\n\u003cp>\u003cstrong>시험의 최대 함정은 「조문의 유무」다.\u003c/strong> 폭리행위는 \u003cstrong>민법전에 명문 규정이 없다\u003c/strong>. 근거 조문은 어디까지나 \u003cstrong>90조\u003c/strong>이고, 폭리행위는 그 해석으로 형성된 \u003cstrong>판례법리\u003c/strong>에 지나지 않는다. 「민법 ○조는 폭리행위를 무효로 한다」는 식의 지문이 나오면 조문 번호가 무엇이든 일단 의심해야 하며, 정답은 \u003cstrong>「90조의 공서양속 위반의 한 유형으로 무효」\u003c/strong>다.\u003c/p>\n\u003cp>\u003cstrong>2020년 4월 시행 개정민법 기준의 포인트가 둘 있다.\u003c/strong> 첫째, 개정 논의 과정(중간시안)에서 \u003cstrong>폭리행위를 90조와 별도로 명문화하자는 안이 제시되었으나, 요건의 경직화와 남용 우려 등을 이유로 최종적으로 견송(見送り)되었다\u003c/strong>. 따라서 \u003cstrong>개정 후에도 폭리행위 규정은 신설되지 않았다\u003c/strong>. 「개정민법으로 폭리행위가 명문화되었다」는 지문은 \u003cstrong>오답\u003c/strong>이다. 둘째, 그럼에도 개정 90조가 「\u003cstrong>事項を目的とする\u003c/strong>」라는 문언을 \u003cstrong>삭제\u003c/strong>한 결과, 법률행위의 \u003cstrong>내용\u003c/strong>뿐 아니라 \u003cstrong>체결 과정·상황\u003c/strong>의 반사회성도 90조로 포섭됨이 조문상 분명해졌다. 폭리행위는 전형적으로 「과정」에 문제가 있는 유형이므로, \u003cstrong>개정 90조의 문언 정비가 폭리행위 법리의 조문상 근거를 오히려 다지는 방향으로 작용했다\u003c/strong>고 설명된다.\u003c/p>\n\u003cp>한편 폭리행위에 이르지 못하는 사안이라도 개인은 다른 수단으로 구제받을 수 있다. \u003cstrong>소비자계약법 4조\u003c/strong>(부실고지·단정적 판단 제공·불퇴거·과량계약 등에 의한 취소), \u003cstrong>이자제한법\u003c/strong>(제한 초과 이자의 무효), \u003cstrong>할부판매법·특정상거래법의 클링오프\u003c/strong>가 그것이다. 즉 폭리행위(무효)와 이들 특별법(취소·일부 무효)은 \u003cstrong>효과가 다른 별개의 트랙\u003c/strong>이다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u
