례·통설은 성질설을 취한다. マクリーン事件은 「憲法第三章の諸規定による基本的人権の保障は、\u003cstrong>権利の性質上日本国民のみをその対象としていると解されるものを除き\u003c/strong>、わが国に在留する外国人に対しても等しく及ぶ」라고 판시했다.\u003c/p>\n\u003cp>성질설에 따르면 인권은 대체로 세 유형으로 나뉜다. ① \u003cstrong>정신적 자유·인신의 자유·평등 등\u003c/strong>은 원칙적으로 외국인에게도 보장된다(전국가적 권리이므로). ② \u003cstrong>참정권(15조 1항)\u003c/strong>은 국민주권(전문·1조)의 귀결로서 원칙적으로 일본 국민에 한정된다. ③ \u003cstrong>사회권(25조 등)\u003c/strong>은 소속 국가가 보장하는 것이 원칙이므로 외국인에 대한 급부 여부는 입법재량에 맡겨진다.\u003c/p>\n\u003cp>다만 성질설은 「보장이 미친다」는 것과 「제약이 허용되지 않는다」는 것이 다르다는 점에 주의해야 한다. マクリーン事件도 외국인의 정치활동의 자유가 보장된다고 하면서도, \u003cstrong>재류 갱신의 재량 판단에서 그 활동을 소극적 사정으로 참작하는 것은 위법이 아니다\u003c/strong>라고 하여 결과적으로 외국인을 패소시켰다(이른바 「기초(基礎)로서의 재류제도의 틀 내에서의 보장」).\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>부정설（무권리설）\u003c/td>\u003ctd>헌법의 인권 규정은 국민만을 대상으로 하며 외국인에게는 미치지 않는다\u003c/td>\u003ctd>메이지 헌법적 발상. 현재 지지 없음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>문언설（文言説）\u003c/td>\u003ctd>「누구든지(何人も)」로 쓰인 조문은 외국인에게도, 「국민은」으로 쓰인 조문은 국민에게만 적용\u003c/td>\u003ctd>22조 2항(외국 이주·국적 이탈)이 「何人も」인 점 등 조문 표현이 부정확해 부당한 결론이 나옴\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>성질설（性質説）\u003c/strong>\u003c/td>\u003ctd>조문의 문언이 아니라 \u003cstrong>권리의 성질\u003c/strong>에 따라 외국인에게 적용될지를 개별적으로 판단\u003c/td>\u003ctd>👉 \u003cstrong>판례·통설\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>マクリーン事件\u003c/td>\u003ctd>最大判昭53.10.4 / 民集32巻7号1223頁\u003c/td>\u003ctd>미국인 어학교사의 재류기간 갱신 불허가（베트남전 반대 등 정치활동을 이유로）\u003c/td>\u003ctd>\u003cstrong>성질설 채택\u003c/strong>. 정치활동의 자유는 외국인에게도 미치나, \u003cstrong>외국인에게 재류의 권리·계속 재류를 요구할 권리는 없고\u003c/strong>, 재류기간 중의 헌법상 보호는 재류제도의 틀 내에서 주어질 뿐 → 갱신 불허가 적법（외국인 패소）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>指紋押捺拒否訴訟\u003c/span>\u003c/td>\u003ctd>最判平7.12.15\u003c/td>\u003ctd>재일 외국인의 지문 날인 거부\u003c/td>\u003ctd>13조의 「함부로 지문 날인을 강제당하지 않을 자유」는 \u003cstrong>외국인에게도 미친다\u003c/strong>（성질설 적용）. 다만 구 외국인등록법의 지문 제도 자체는 합헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>定住外国人地方選挙権訴訟\u003c/td>\u003ctd>最判平7.2.28\u003c/td>\u003ctd>재일 한국인의 선거인명부 등록 요구\u003c/td>\u003ctd>15조 1항의 「국민」·93조 2항의 「住民」은 \u003cstrong>일본 국적자\u003c/strong>를 의미 → 헌법상 지방선거권은 없음. 다만 \u003cstrong>법률로 정주 외국인에게 지방선거권을 부여하는 것은 헌법상 금지되지 않는다\u003c/strong>(방론)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>塩見訴訟\u003c/td>\u003ctd>最判平1.3.2\u003c/td>\u003ctd>재일 외국인의 장애복지연금 청구（국적요건）\u003c/td>\u003ctd>사회보장상의 시책에서 \u003cstrong>재류 외국인의 처우는 입법부의 재량\u003c/strong>. 자국민 우선 취급도 허용 → 25조·14조 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>外国人職員昇任試験拒否訴訟\u003c/span>\u003c/td>\u003ctd>最大判平17.1.26\u003c/td>\u003ctd>외국적 도쿄도 직원의 관리직 선고 수험 거부\u003c/td>\u003ctd>「공권력 행사 등 지방공무원」에는 일본 국민 취임이 상정됨 → 국적요건 합헌（→ \u003ca href=\"#/e/%E5%BD%93%E7%84%B6%E3%81%AE%E6%B3%95%E7%90%86\">当然の法理\u003c/a>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「권리의 성질상」이라는 문구가 나오면 マクリーン事件\u003c/strong>이라고 즉시 연결하라. 인용 \u003ccode>最大判昭53.10.4\u003c/code>까지 세트 암기.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「マクリーン事件은 외국인의 정치활동의 자유를 인정했으므로 외국인이 승소했다」 → \u003cstrong>오답\u003c/strong>. 인권 보장은 인정하되 \u003cstrong>재류제도의 틀 내\u003c/strong>라며 갱신 불허가를 적법하다고 했다(외국인 패소).\u003c/li>\u003cli>\u003cstrong>대비: 문언설 ↔ 성질설\u003c/strong>. 「何人も라고 쓰였으니 외국인에게도 적용된다」는 식의 지문은 문언설이며 판례 입장이 아니다.\u003c/li>\u003cli>\u003cstrong>대비: 성질설(외국인의 인권 향유주체성) ↔ \u003ca href=\"#/e/%E5%BD%93%E7%84%B6%E3%81%AE%E6%B3%95%E7%90%86\">当然の法理\u003c/a>(공무담임)\u003c/strong>. 성질설은 「미치는가」의 문제, 당연의 법리는 「공무원이 될 수 있는가」의 문제다.\u003c/li>\u003cli>유형별 정리 암기: \u003cstrong>자유권 = 원칙 보장 / 참정권 = 원칙 부정(지방선거권도 헌법상 보장 아님, 다만 입법은 가능) / 사회권 = 입법재량\u003c/strong>.\u003c/li>\u003cli>입국의 자유·재입국의 자유는 \u003cstrong>외국인에게 보장되지 않는다\u003c/strong>는 것이 판례. 재입국(해외여행)의 자유도 부정된다(森川キャサリーン事件).\u003c/li>\u003c/ul>","search":"性質説 せいしつせつ 항목 내용 ------ ------ 읽기 せいしつせつ（성질설） 과목 헌법（인권총론 — 인권의 향유주체·외국인의 인권） 한줄 정의 헌법 제3장의 인권 보장은 「권리의 성질상」 일본 국민만을 대상으로 한다고 해석되는 것을 제외하고 일본에 재류하는 외국인에게도 미친다는 견해 통설·판례 성질설 — マクリーン事件（最大判昭53.10.4）이 명시적으로 채택 개념 일본국헌법 제3장의 표제는 「 国民の権利及び義務 」이고, 개별 조문도 「국민은」 예: 25조 과 「누구든지 何人も 」 예: 22조 2항, 31조, 32조 가 뒤섞여 있다. 그래서 「국민」이라고 쓰인 인권 규정이 외국인에게도 적용되는가가 문제된다. 여기서 조문의 문언 을 기준으로 나누자는 견해 문언설 와, 조문의 표현이 아니라 각 권리의 성질 을 기준으로 판단하자는 견해 성질설 가 대립한다. 판례·통설은 성질설을 취한다. マクリーン事件은 「憲法第三章の諸規定による基本的人権の保障は、 権利の性質上日本国民のみをその対象としていると解されるものを除き 、わが国に在留する外国人に対しても等しく及ぶ」라고 판시했다. 성질설에 따르면 인권은 대체로 세 유형으로 나뉜다. ① 정신적 자유·인신의 자유·평등 등 은 원칙적으로 외국인에게도 보장된다 전국가적 권리이므로 . ② 참정권 15조 1항 은 국민주권 전문·1조 의 귀결로서 원칙적으로 일본 국민에 한정된다. ③ 사회권 25조 등 은 소속 국가가 보장하는 것이 원칙이므로 외국인에 대한 급부 여부는 입법재량에 맡겨진다. 다만 성질설은 「보장이 미친다」는 것과 「제약이 허용되지 않는다」는 것이 다르다는 점에 주의해야 한다. マクリーン事件도 외국인의 정치활동의 자유가 보장된다고 하면서도, 재류 갱신의 재량 판단에서 그 활동을 소극적 사정으로 참작하는 것은 위법이 아니다 라고 하여 결과적으로 외국인을 패소시켰다 이른바 「기초 基礎 로서의 재류제도의 틀 내에서의 보장」 . 학설 학설 내용 비고 ------ ------ ------ 부정설（무권리설） 헌법의 인권 규정은 국민만을 대상으로 하며 외국인에게는 미치지 않는다 메이지 헌법적 발상. 현재 지지 없음 문언설（文言説） 「누구든지 何人も 」로 쓰인 조문은 외국인에게도, 「국민은」으로 쓰인 조문은 국민에게만 적용 22조 2항 외국 이주·국적 이탈 이 「何人も」인 점 등 조문 표현이 부정확해 부당한 결론이 나옴 성질설（性質説） 조문의 문언이 아니라 권리의 성질 에 따라 외국인에게 적용될지를 개별적으로 판단 👉 판례·통설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ マクリーン事件 最大判昭53.10.4 / 民集32巻7号1223頁 미국인 어학교사의 재류기간 갱신 불허가（베트남전 반대 등 정치활동을 이유로） 성질설 채택 . 정치활동의 자유는 외국인에게도 미치나, 외국인에게 재류의 권리·계속 재류를 요구할 권리는 없고 , 재류기간 중의 헌법상 보호는 재류제도의 틀 내에서 주어질 뿐 → 갱신 불허가 적법（외국인 패소） 指紋押捺拒否訴訟 헌법/指紋押捺拒否訴訟.md 最判平7.12.15 재일 외국인의 지문 날인 거부 13조의 「함부로 지문 날인을 강제당하지 않을 자유」는 외국인에게도 미친다 （성질설 적용）. 다만 구 외국인등록법의 지문 제도 자체는 합헌 定住外国人地方選挙権訴訟 最判平7.2.28 재일 한국인의 선거인명부 등록 요구 15조 1항의 「국민」·93조 2항의 「住民」은 일본 국적자 를 의미 → 헌법상 지방선거권은 없음. 다만 법률로 정주 외국인에게 지방선거권을 부여하는 것은 헌법상 금지되지 않는다 방론 塩見訴訟 最判平1.3.2 재일 외국인의 장애복지연금 청구（국적요건） 사회보장상의 시책에서 재류 외국인의 처우는 입법부의 재량 . 자국민 우선 취급도 허용 → 25조·14조 위반 아님 外国人職員昇任試験拒否訴訟 헌법/外国人職員昇任試験拒否訴訟.md 最大判平17.1.26 외국적 도쿄도 직원의 관리직 선고 수험 거부 「공권력 행사 등 지방공무원」에는 일본 국민 취임이 상정됨 → 국적요건 합헌（→ 当然の法理 용어/当然の法理.md ） 💡 수험 팁 - 「권리의 성질상」이라는 문구가 나오면 マクリーン事件 이라고 즉시 연결하라. 인용 最大判昭53.10.4 까지 세트 암기. - 최대 함정 : 「マクリーン事件은 외국인의 정치활동의 자유를 인정했으므로 외국인이 승소했다」 → 오답 . 인권 보장은 인정하되 재류제도의 틀 내 라며 갱신 불허가를 적법하다고 했다 외국인 패소 . - 대비: 문언설 ↔ 성질설 . 「何人も라고 쓰였으니 외국인에게도 적용된다」는 식의 지문은 문언설이며 판례 입장이 아니다. - 대비: 성질설 외국인의 인권 향유주체성 ↔ 当然の法理 용어/当然の法理.md 공무담임 . 성질설은 「미치는가」의 문제, 당연의 법리는 「공무원이 될 수 있는가」의 문제다. - 유형별 정리 암기: 자유권 = 원칙 보장 / 참정권 = 원칙 부정 지방선거권도 헌법상 보장 아님, 다만 입법은 가능 / 사회권 = 입법재량 . - 입국의 자유·재입국의 자유는 외국인에게 보장되지 않는다 는 것이 판례. 재입국 해외여행 의 자유도 부정된다 森川キャサリーン事件 ."},"当然の法理":{"type":"term","subject":"용어","id":"当然の法理","title":"当然の法理","sub":"とうぜんのほうり","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>とうぜんのほうり（당연의 법리）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론 — 외국인의 공무담임 / ※통치에서는 다른 용법）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>명문 규정이 없더라도 \u003cstrong>공권력의 행사 또는 국가의사의 형성에 참획하는 공무원에는 일본 국적이 필요\u003c/strong>하다는 정부 견해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>최고재는 「공권력 행사 등 지방공무원」이라는 개념으로 사실상 이를 수용（\u003cspan>外国人職員昇任試験拒否訴訟\u003c/span> 最大判平17.1.26）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>「당연의 법리」는 1953년 \u003cstrong>내각법제국 견해（昭和28年3月25日 法制局意見）\u003c/strong>에서 나온 표현이다. 「법의 명문 규정이 존재하는 것은 아니지만, \u003cstrong>공권력의 행사 또는 국가의사의 형성에의 참획에 종사하는 공무원에는 일본 국적을 필요로 한다\u003c/strong>고 해석해야 하는 것은 \u003cstrong>당연의 법리\u003c/strong>」라는 것이다.\u003c/p>\n\u003cp>근거는 국민주권 원리다. 헌법 전문·1조가 주권이 국민에게 있음을 선언하고, \u003cstrong>15조 1항\u003c/strong>이 공무원의 선정·파면을 「국민 고유의 권리」라고 규정한다. 따라서 국민의 통치에 직접 관여하는 지위에는 일본 국민이 취임하는 것이 국민주권의 논리적 귀결이라고 본다.\u003c/p>\n\u003cp>이 법리에 따라 국가공무원은 원칙적으로 일본 국적이 필요하고, 지방공무원도 정형적·보조적 업무를 제외하면 국적요건이 과해져 왔다. 최고재는 「당연의 법리」라는 말 자체를 판시에 쓰지는 않았지만, \u003cspan>外国人職員昇任試験拒否訴訟\u003c/span>에서 \u003cstrong>「공권력 행사 등 지방공무원」\u003c/strong>(주민의 권리·의무를 직접 형성하거나 그 범위를 확정하는 등의 행위를 하는 지방공무원)이라는 개념을 세우고, 그러한 직에는 \u003cstrong>일본 국민이 취임하는 것이 상정되어 있다\u003c/strong>고 하여 도쿄도의 국적요건을 합헌으로 판단했다. 실질적으로 당연의 법리를 승인한 것이다.\u003c/p>\n\u003cp>한편 관리직이라도 \u003cstrong>전문분야의 기술적 사항에 관한 직\u003c/strong>이나 정형적·보조적 업무는 외국인에게도 열릴 수 있으며, 실제로 다수 지자체가 일반직 채용의 국적요건을 완화하고 있다. 즉 「모든 공무원 = 일본 국민」이 아니라 \u003cstrong>직무의 성질에 따른 구분\u003c/strong>임에 주의한다.\u003c/p>\n\u003ch2>⚠️ 용법 구별 — 통치(중의원 해산권)의 「当然の法理」\u003c/h2>\n\u003cp>\u003cstrong>같은 「当然の法理」라는 표현이 중의원 해산권 논의에서도 쓰이므로 반드시 구별해야 한다.\u003c/strong>\u003c/p>\n\u003cp>내각의 중의원 해산권 근거를 둘러싼 학설 중 \u003cstrong>制度説(제도설)\u003c/strong>은, 헌법이 의원내각제를 채용한 이상 \u003cstrong>의원내각제라는 제도의 본질로부터 「당연의 법리」로서 내각에 자유로운 해산권이 인정된다\u003c/strong>고 설명한다. 여기서의 「당연의 법리」는 \u003cstrong>제도의 본질에서 도출되는 당연한 귀결\u003c/strong>이라는 일반적 어법이며, 외국인 공무담임과는 \u003cstrong>전혀 무관한 별개 논점\u003c/strong>이다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>인권편의 当然の法理\u003c/th>\u003cth>통치편(해산권 制度説)의 当然の法理\u003c/th>\u003c/tr>\u003ctr>\u003ctd>논점\u003c/td>\u003ctd>외국인이 공무원이 될 수 있는가\u003c/td>\u003ctd>내각은 어떤 근거로 중의원을 해산할 수 있는가\u003c/td>\u003c/tr>\u003ctr>\u003ctd>출처\u003c/td>\u003ctd>1953년 내각법제국 견해\u003c/td>\u003ctd>의원내각제의 본질론（학설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>근거 조문\u003c/td>\u003ctd>전문·1조(국민주권), 15조 1항\u003c/td>\u003ctd>의원내각제의 제도 그 자체（69조·7조 논쟁과 연결）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>결론\u003c/td>\u003ctd>공권력 행사 공무는 일본 국민\u003c/td>\u003ctd>내각에 자유해산권이 있다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>참고로 해산권의 근거에 관한 학설은 ① \u003cstrong>7条説\u003c/strong>(7조 3호의 천황의 국사행위에 대한 내각의 조언과 승인에서 실질적 결정권을 도출 — \u003cstrong>실무·통설\u003c/strong>), ② 69条説(69조의 불신임 가결·신임 부결의 경우에 한정), ③ 65条説(해산은 행정권의 작용), ④ 制度説(의원내각제의 본질에서 당연) 이다. 苫米地事件（最大判昭35.6.8）은 \u003cstrong>통치행위론\u003c/strong>으로 해산의 유효·무효 판단을 사법심사 밖에 두었고, 해산권의 근거 조문에 대해서는 판단하지 않았다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>外国人職員昇任試験拒否訴訟\u003c/span>（東京都管理職選考試験事件）\u003c/td>\u003ctd>最大判平17.1.26 / 民集59巻1号128頁\u003c/td>\u003ctd>특별영주자인 도쿄도 보건사가 관리직 선고 수험을 거부당함\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「공권력 행사 등 지방공무원」에는 일본 국민의 취임이 상정되며, 그러한 직을 포함하는 일체적 관리직 임용제도를 두고 일본 국민에 한정한 조치는 합리적 이유에 기한 구별로 14조 1항·노기법 3조 위반 아님\u003c/td>\u003c/tr>\u003ctr>\u003ctd>苫米地事件\u003c/td>\u003ctd>最大判昭35.6.8 / 民集14巻7号1206頁\u003c/td>\u003ctd>7조에 의한 중의원 해산의 효력\u003c/td>\u003ctd>\u003cstrong>통치행위론\u003c/strong>. 고도의 정치성을 가진 국가행위는 사법심사의 대상 밖 → 해산권의 근거 조문은 판단하지 않음\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>「当然の法理」는 두 얼굴\u003c/strong>이다. 인권편(외국인 공무담임)인지 통치편(해산권 制度説)인지 문제의 문맥으로 먼저 판별하라. 이 구별 자체가 함정 문제로 나온다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「최고재가 판결에서 『당연의 법리』라는 용어를 사용했다」 → \u003cstrong>부정확\u003c/strong>. 이 표현은 \u003cstrong>내각법제국 견해\u003c/strong>(1953)의 것이며, 최고재는 \u003cstrong>「공권력 행사 등 지방공무원」\u003c/strong>이라는 표현을 썼다.\u003c/li>\u003cli>\u003cstrong>함정 2\u003c/strong>: 「외국인은 일체의 공무원이 될 수 없다」 → \u003cstrong>오답\u003c/strong>. 정형적·보조적 업무나 기술적 전문직은 가능. 어디까지나 \u003cstrong>공권력 행사·국가의사 형성 참획\u003c/strong>의 직이 기준.\u003c/li>\u003cli>근거 조문은 \u003cstrong>15조 1항\u003c/strong>(공무원의 선정·파면은 「국민 고유의 권리」)과 국민주권. 「22조」나 「14조」를 근거로 드는 지문은 오답.\u003c/li>\u003cli>\u003cstrong>대비: \u003ca href=\"#/e/%E6%80%A7%E8%B3%AA%E8%AA%AC\">性質説\u003c/a>(인권이 미치는가) ↔ 当然の法理(공무에 취임할 수 있는가)\u003c/strong>. 전자는 マクリーン事件, 후자는 東京都管理職選考試験事件.\u003c/li>\u003cli>해산권은 \u003cstrong>7条説이 통설·실무\u003c/strong>라는 점을 기억. 制度説은 소수설이며 「당연의 법리」라는 표현이 여기서도 쓰인다는 점만 알아 두면 된다.\u003c/li>\u003c/ul>","search":"当然の法理 とうぜんのほうり 항목 내용 ------ ------ 읽기 とうぜんのほうり（당연의 법리） 과목 헌법（인권총론 — 외국인의 공무담임 / ※통치에서는 다른 용법） 한줄 정의 명문 규정이 없더라도 공권력의 행사 또는 국가의사의 형성에 참획하는 공무원에는 일본 국적이 필요 하다는 정부 견해 통설·판례 최고재는 「공권력 행사 등 지방공무원」이라는 개념으로 사실상 이를 수용（ 外国人職員昇任試験拒否訴訟 헌법/外国人職員昇任試験拒否訴訟.md 最大判平17.1.26） 개념 「당연의 법리」는 1953년 내각법제국 견해（昭和28年3月25日 法制局意見） 에서 나온 표현이다. 「법의 명문 규정이 존재하는 것은 아니지만, 공권력의 행사 또는 국가의사의 형성에의 참획에 종사하는 공무원에는 일본 국적을 필요로 한다 고 해석해야 하는 것은 당연의 법리 」라는 것이다. 근거는 국민주권 원리다. 헌법 전문·1조가 주권이 국민에게 있음을 선언하고, 15조 1항 이 공무원의 선정·파면을 「국민 고유의 권리」라고 규정한다. 따라서 국민의 통치에 직접 관여하는 지위에는 일본 국민이 취임하는 것이 국민주권의 논리적 귀결이라고 본다. 이 법리에 따라 국가공무원은 원칙적으로 일본 국적이 필요하고, 지방공무원도 정형적·보조적 업무를 제외하면 국적요건이 과해져 왔다. 최고재는 「당연의 법리」라는 말 자체를 판시에 쓰지는 않았지만, 外国人職員昇任試験拒否訴訟 헌법/外国人職員昇任試験拒否訴訟.md 에서 「공권력 행사 등 지방공무원」 주민의 권리·의무를 직접 형성하거나 그 범위를 확정하는 등의 행위를 하는 지방공무원 이라는 개념을 세우고, 그러한 직에는 일본 국민이 취임하는 것이 상정되어 있다 고 하여 도쿄도의 국적요건을 합헌으로 판단했다. 실질적으로 당연의 법리를 승인한 것이다. 한편 관리직이라도 전문분야의 기술적 사항에 관한 직 이나 정형적·보조적 업무는 외국인에게도 열릴 수 있으며, 실제로 다수 지자체가 일반직 채용의 국적요건을 완화하고 있다. 즉 「모든 공무원 = 일본 국민」이 아니라 직무의 성질에 따른 구분 임에 주의한다. ⚠️ 용법 구별 — 통치 중의원 해산권 의 「当然の法理」 같은 「当然の法理」라는 표현이 중의원 해산권 논의에서도 쓰이므로 반드시 구별해야 한다. 내각의 중의원 해산권 근거를 둘러싼 학설 중 制度説 제도설 은, 헌법이 의원내각제를 채용한 이상 의원내각제라는 제도의 본질로부터 「당연의 법리」로서 내각에 자유로운 해산권이 인정된다 고 설명한다. 여기서의 「당연의 법리」는 제도의 본질에서 도출되는 당연한 귀결 이라는 일반적 어법이며, 외국인 공무담임과는 전혀 무관한 별개 논점 이다. 구분 인권편의 当然の法理 통치편 해산권 制度説 의 当然の法理 ------ -------------------- ----------------------------------- 논점 외국인이 공무원이 될 수 있는가 내각은 어떤 근거로 중의원을 해산할 수 있는가 출처 1953년 내각법제국 견해 의원내각제의 본질론（학설） 근거 조문 전문·1조 국민주권 , 15조 1항 의원내각제의 제도 그 자체（69조·7조 논쟁과 연결） 결론 공권력 행사 공무는 일본 국민 내각에 자유해산권이 있다 참고로 해산권의 근거에 관한 학설은 ① 7条説 7조 3호의 천황의 국사행위에 대한 내각의 조언과 승인에서 실질적 결정권을 도출 — 실무·통설 , ② 69条説 69조의 불신임 가결·신임 부결의 경우에 한정 , ③ 65条説 해산은 행정권의 작용 , ④ 制度説 의원내각제의 본질에서 당연 이다. 苫米地事件（最大判昭35.6.8）은 통치행위론 으로 해산의 유효·무효 판단을 사법심사 밖에 두었고, 해산권의 근거 조문에 대해서는 판단하지 않았다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 外国人職員昇任試験拒否訴訟 헌법/外国人職員昇任試験拒否訴訟.md （東京都管理職選考試験事件） 最大判平17.1.26 / 民集59巻1号128頁 특별영주자인 도쿄도 보건사가 관리직 선고 수험을 거부당함 합헌 . 「공권력 행사 등 지방공무원」에는 일본 국민의 취임이 상정되며, 그러한 직을 포함하는 일체적 관리직 임용제도를 두고 일본 국민에 한정한 조치는 합리적 이유에 기한 구별로 14조 1항·노기법 3조 위반 아님 苫米地事件 最大判昭35.6.8 / 民集14巻7号1206頁 7조에 의한 중의원 해산의 효력 통치행위론 . 고도의 정치성을 가진 국가행위는 사법심사의 대상 밖 → 해산권의 근거 조문은 판단하지 않음 💡 수험 팁 - 「当然の法理」는 두 얼굴 이다. 인권편 외국인 공무담임 인지 통치편 해산권 制度説 인지 문제의 문맥으로 먼저 판별하라. 이 구별 자체가 함정 문제로 나온다. - 최대 함정 : 「최고재가 판결에서 『당연의 법리』라는 용어를 사용했다」 → 부정확 . 이 표현은 내각법제국 견해 1953 의 것이며, 최고재는 「공권력 행사 등 지방공무원」 이라는 표현을 썼다. - 함정 2 : 「외국인은 일체의 공무원이 될 수 없다」 → 오답 . 정형적·보조적 업무나 기술적 전문직은 가능. 어디까지나 공권력 행사·국가의사 형성 참획 의 직이 기준. - 근거 조문은 15조 1항 공무원의 선정·파면은 「국민 고유의 권리」 과 국민주권. 「22조」나 「14조」를 근거로 드는 지문은 오답. - 대비: 性質説 용어/性質説.md 인권이 미치는가 ↔ 当然の法理 공무에 취임할 수 있는가 . 전자는 マクリーン事件, 후자는 東京都管理職選考試験事件. - 해산권은 7条説이 통설·실무 라는 점을 기억. 制度説은 소수설이며 「당연의 법리」라는 표현이 여기서도 쓰인다는 점만 알아 두면 된다."},"公共の福祉":{"type":"term","subject":"용어","id":"公共の福祉","title":"公共の福祉","sub":"こうきょうのふくし","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>こうきょうのふくし（공공의 복지）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론 — 인권의 한계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>인권 상호의 모순·충돌을 조정하기 위한 \u003cstrong>실질적 공평의 원리\u003c/strong>이자, 인권 제한을 정당화하는 헌법상의 근거\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>통설은 \u003cstrong>\u003ca href=\"#/e/%E4%B8%80%E5%85%83%E7%9A%84%E5%86%85%E5%9C%A8%E5%88%B6%E7%B4%84%E8%AA%AC\">一元的内在制約説\u003c/a>\u003c/strong>. 판례는 이론을 명시하지 않고 「공공의 복지」를 원용해 왔으나, 현재는 개별 이익형량·심사기준으로 구체화\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>일본국헌법은 인권을 「침해할 수 없는 영구의 권리」(11조·97조)로 선언하면서도, 동시에 \u003cstrong>12조\u003c/strong>(「국민은 이를 남용해서는 아니 되며, 항상 \u003cstrong>公共の福祉\u003c/strong>를 위하여 이를 이용할 책임을 진다」)와 \u003cstrong>13조\u003c/strong>(「생명, 자유 및 행복추구에 대한 국민의 권리에 대하여는 \u003cstrong>公共の福祉에 반하지 않는 한\u003c/strong> 최대의 존중을 필요로 한다」)에서 인권 전반에 관해 「공공의 복지」를 언급한다.\u003c/p>\n\u003cp>나아가 \u003cstrong>22조 1항\u003c/strong>(거주·이전 및 직업선택의 자유는 「公共の福祉에 반하지 않는 한」)과 \u003cstrong>29조 2항\u003c/strong>(재산권의 내용은 「公共の福祉에 적합하도록」 법률로 정한다)이라는 \u003cstrong>경제적 자유 조문에만\u003c/strong> 「공공의 복지」가 다시 등장한다. 이 조문 배치의 의미를 어떻게 읽느냐가 학설 대립의 출발점이다.\u003c/p>\n\u003cp>주의할 점은 「공공의 복지」가 \u003cstrong>인권 위에 군림하는 국가·사회 전체의 이익이 아니라는 것\u003c/strong>이다. 만약 그렇게 읽으면 「공익을 위해서라면 법률로 인권을 마음대로 제한할 수 있다」는 결론이 되어, 메이지 헌법의 「\u003cstrong>법률의 유보\u003c/strong>」와 다를 바 없어진다. 그래서 통설은 공공의 복지를 \u003cstrong>인권과 인권이 충돌할 때 이를 조정하는 원리\u003c/strong>, 즉 인권에 내재하는 제약으로 이해한다(→ \u003ca href=\"#/e/%E4%B8%80%E5%85%83%E7%9A%84%E5%86%85%E5%9C%A8%E5%88%B6%E7%B4%84%E8%AA%AC\">一元的内在制約説\u003c/a>).\u003c/p>\n\u003cp>다만 「공공의 복지」라는 개념 자체는 매우 추상적이어서 그것만으로는 위헌심사의 기준이 되지 못한다. 초기 최고재는 「공공의 복지에 의한 제약이므로 합헌」이라는 식으로 결론을 내려 「\u003cstrong>공공의 복지론(公共の福祉論)\u003c/strong>」이라 비판받았고, 이후 \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>·비교형량론·LRA 기준 등 \u003cstrong>구체적 심사기준\u003c/strong>으로 논의가 이동했다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>一元的外在制約説\u003c/td>\u003ctd>12·13조의 「공공의 복지」는 모든 인권을 \u003cstrong>외부에서\u003c/strong> 제약하는 일반원리. 22·29조의 문구는 주의적 규정에 불과\u003c/td>\u003ctd>법률로 인권을 무제한 제한 가능 → \u003cstrong>법률의 유보와 같아진다\u003c/strong>는 치명적 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内在・外在二元的制約説\u003c/td>\u003ctd>12·13조는 훈시적·윤리적 규정에 그치고, 「공공의 복지」가 명기된 22조 1항·29조 2항의 \u003cstrong>경제적 자유와 사회권에만\u003c/strong> 정책적(외재적) 제약이 미친다. 그 밖의 자유권은 내재적 제약만\u003c/td>\u003ctd>\u003cstrong>13조의 재판규범성을 부정\u003c/strong>하게 되어 프라이버시권 등 새로운 인권의 근거를 잃는다는 비판\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>一元的内在制約説\u003c/strong>\u003c/td>\u003ctd>「공공의 복지」는 \u003cstrong>모든 인권에 논리 필연적으로 내재하는\u003c/strong> 인권 상호 조정의 실질적 공평 원리. 22·29조는 그중 \u003cstrong>사회국가적 공공의 복지\u003c/strong>가 특히 강하게 작용함을 나타낸 것\u003c/td>\u003ctd>👉 \u003cstrong>통설\u003c/strong>（→ 상세는 \u003ca href=\"#/e/%E4%B8%80%E5%85%83%E7%9A%84%E5%86%85%E5%9C%A8%E5%88%B6%E7%B4%84%E8%AA%AC\">一元的内在制約説\u003c/a>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>チャタレイ事件\u003c/td>\u003ctd>最大判昭32.3.13 / 刑集11巻3号997頁\u003c/td>\u003ctd>『채털리 부인의 연인』 번역·출판（형법 175조 음란문서 반포）\u003c/td>\u003ctd>\u003cstrong>유죄·합헌\u003c/strong>. 「성적 질서를 지키고 최소한도의 성도덕을 유지하는 것」은 公共の福祉의 내용이며, 21조의 표현의 자유도 이에 의해 제약된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限違憲判決\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설 거리제한 규정\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 22조 1항의 「공공의 복지」에 의한 제약이라도, \u003cstrong>소극목적(국민의 생명·건강 보호)\u003c/strong> 규제인 허가제에는 「보다 완만한 규제로는 목적을 달성할 수 없다」는 정도의 \u003cstrong>엄격한 합리성\u003c/strong>이 요구된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>적극목적(중소기업 보호)\u003c/strong> 규제는 입법부의 재량이 넓고, 「\u003cstrong>현저히 불합리함이 명백\u003c/strong>한 경우」에 한해 위헌（明白性の原則）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>森林法共有林分割制限違憲判決\u003c/td>\u003ctd>最大判昭62.4.22 / 民集41巻3号408頁\u003c/td>\u003ctd>지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 29조 2항의 「공공의 복지」에 적합한 제한인지는 규제 목적·필요성·제한 정도를 비교형량해 판단\u003c/td>\u003c/tr>\u003ctr>\u003ctd>泉佐野市民会館事件\u003c/td>\u003ctd>最判平7.3.7 / 民集49巻3号687頁\u003c/td>\u003ctd>시민회관 사용 불허가（집회의 자유）\u003c/td>\u003ctd>\u003cstrong>합헌·적법\u003c/strong>. 조문에 「공공의 복지」가 없는 21조의 집회의 자유도 제약을 받으나, 그 제한은 \u003cstrong>「인적 위해가 발생할 명백하고 현재의 위험」\u003c/strong>에 준하는 경우로 한정\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>「公共の福祉」가 \u003cstrong>명문으로 등장하는 조문은 4개뿐\u003c/strong>: \u003cstrong>12조·13조\u003c/strong>(인권 전반) + \u003cstrong>22조 1항·29조 2항\u003c/strong>(경제적 자유). 이 조문 번호를 그대로 묻는 문제가 나온다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「공공의 복지란 사회 전체의 이익을 뜻하며 이를 위해 법률로 인권을 제한할 수 있다」 → \u003cstrong>오답\u003c/strong>. 통설은 \u003cstrong>인권 상호의 조정 원리\u003c/strong>로 본다(외재적 제약이 아니다).\u003c/li>\u003cli>\u003cstrong>대비: 소극목적 규제(경찰목적) = 엄격한 합리성 기준 → 薬事法 위헌 ↔ 적극목적 규제(사회경제정책) = 명백성의 원칙 → 小売市場 합헌\u003c/strong>. 결론과 세트로 암기.\u003c/li>\u003cli>21조·19조 등 \u003cstrong>「공공의 복지」가 조문에 쓰여 있지 않은 인권도 제약될 수 있다\u003c/strong>. 「명문이 없으므로 절대 무제약」이라는 지문은 오답(チャタレイ·泉佐野가 근거).\u003c/li>\u003cli>「공공의 복지」만으로는 심사기준이 되지 못한다는 비판 → \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>·\u003ca href=\"#/e/%E5%90%88%E6%86%B2%E6%80%A7%E6%8E%A8%E5%AE%9A%E3%81%AE%E5%8E%9F%E5%89%87\">合憲性推定の原則\u003c/a>으로 논의가 이어지는 흐름을 함께 잡아 두면 응용 문제에 강하다.\u003c/li>\u003c/ul>","search":"公共の福祉 こうきょうのふくし 항목 내용 ------ ------ 읽기 こうきょうのふくし（공공의 복지） 과목 헌법（인권총론 — 인권의 한계） 한줄 정의 인권 상호의 모순·충돌을 조정하기 위한 실질적 공평의 원리 이자, 인권 제한을 정당화하는 헌법상의 근거 통설·판례 통설은 一元的内在制約説 용어/一元的内在制約説.md . 판례는 이론을 명시하지 않고 「공공의 복지」를 원용해 왔으나, 현재는 개별 이익형량·심사기준으로 구체화 개념 일본국헌법은 인권을 「침해할 수 없는 영구의 권리」 11조·97조 로 선언하면서도, 동시에 12조 「국민은 이를 남용해서는 아니 되며, 항상 公共の福祉 를 위하여 이를 이용할 책임을 진다」 와 13조 「생명, 자유 및 행복추구에 대한 국민의 권리에 대하여는 公共の福祉에 반하지 않는 한 최대의 존중을 필요로 한다」 에서 인권 전반에 관해 「공공의 복지」를 언급한다. 나아가 22조 1항 거주·이전 및 직업선택의 자유는 「公共の福祉에 반하지 않는 한」 과 29조 2항 재산권의 내용은 「公共の福祉에 적합하도록」 법률로 정한다 이라는 경제적 자유 조문에만 「공공의 복지」가 다시 등장한다. 이 조문 배치의 의미를 어떻게 읽느냐가 학설 대립의 출발점이다. 주의할 점은 「공공의 복지」가 인권 위에 군림하는 국가·사회 전체의 이익이 아니라는 것 이다. 만약 그렇게 읽으면 「공익을 위해서라면 법률로 인권을 마음대로 제한할 수 있다」는 결론이 되어, 메이지 헌법의 「 법률의 유보 」와 다를 바 없어진다. 그래서 통설은 공공의 복지를 인권과 인권이 충돌할 때 이를 조정하는 원리 , 즉 인권에 내재하는 제약으로 이해한다 → 一元的内在制約説 용어/一元的内在制約説.md . 다만 「공공의 복지」라는 개념 자체는 매우 추상적이어서 그것만으로는 위헌심사의 기준이 되지 못한다. 초기 최고재는 「공공의 복지에 의한 제약이므로 합헌」이라는 식으로 결론을 내려 「 공공의 복지론 公共の福祉論 」이라 비판받았고, 이후 二重の基準論 용어/二重の基準論.md ·비교형량론·lra 기준 등 구체적 심사기준 으로 논의가 이동했다. 학설 학설 내용 비고 ------ ------ ------ 一元的外在制約説 12·13조의 「공공의 복지」는 모든 인권을 외부에서 제약하는 일반원리. 22·29조의 문구는 주의적 규정에 불과 법률로 인권을 무제한 제한 가능 → 법률의 유보와 같아진다 는 치명적 비판 内在・外在二元的制約説 12·13조는 훈시적·윤리적 규정에 그치고, 「공공의 복지」가 명기된 22조 1항·29조 2항의 경제적 자유와 사회권에만 정책적 외재적 제약이 미친다. 그 밖의 자유권은 내재적 제약만 13조의 재판규범성을 부정 하게 되어 프라이버시권 등 새로운 인권의 근거를 잃는다는 비판 一元的内在制約説 「공공의 복지」는 모든 인권에 논리 필연적으로 내재하는 인권 상호 조정의 실질적 공평 원리. 22·29조는 그중 사회국가적 공공의 복지 가 특히 강하게 작용함을 나타낸 것 👉 통설 （→ 상세는 一元的内在制約説 용어/一元的内在制約説.md ） 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ チャタレイ事件 最大判昭32.3.13 / 刑集11巻3号997頁 『채털리 부인의 연인』 번역·출판（형법 175조 음란문서 반포） 유죄·합헌 . 「성적 질서를 지키고 최소한도의 성도덕을 유지하는 것」은 公共の福祉의 내용이며, 21조의 표현의 자유도 이에 의해 제약된다 薬事法距離制限違憲判決 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설 거리제한 규정 위헌 . 22조 1항의 「공공의 복지」에 의한 제약이라도, 소극목적 국민의 생명·건강 보호 규제인 허가제에는 「보다 완만한 규제로는 목적을 달성할 수 없다」는 정도의 엄격한 합리성 이 요구된다 小売市場距離制限事件 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 개설 허가의 거리제한 합헌 . 적극목적 중소기업 보호 규제는 입법부의 재량이 넓고, 「 현저히 불합리함이 명백 한 경우」에 한해 위헌（明白性の原則） 森林法共有林分割制限違憲判決 最大判昭62.4.22 / 民集41巻3号408頁 지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조 위헌 . 29조 2항의 「공공의 복지」에 적합한 제한인지는 규제 목적·필요성·제한 정도를 비교형량해 판단 泉佐野市民会館事件 最判平7.3.7 / 民集49巻3号687頁 시민회관 사용 불허가（집회의 자유） 합헌·적법 . 조문에 「공공의 복지」가 없는 21조의 집회의 자유도 제약을 받으나, 그 제한은 「인적 위해가 발생할 명백하고 현재의 위험」 에 준하는 경우로 한정 💡 수험 팁 - 「公共の福祉」가 명문으로 등장하는 조문은 4개뿐 : 12조·13조 인권 전반 + 22조 1항·29조 2항 경제적 자유 . 이 조문 번호를 그대로 묻는 문제가 나온다. - 최대 함정 : 「공공의 복지란 사회 전체의 이익을 뜻하며 이를 위해 법률로 인권을 제한할 수 있다」 → 오답 . 통설은 인권 상호의 조정 원리 로 본다 외재적 제약이 아니다 . - 대비: 소극목적 규제 경찰목적 = 엄격한 합리성 기준 → 薬事法 위헌 ↔ 적극목적 규제 사회경제정책 = 명백성의 원칙 → 小売市場 합헌 . 결론과 세트로 암기. - 21조·19조 등 「공공의 복지」가 조문에 쓰여 있지 않은 인권도 제약될 수 있다 . 「명문이 없으므로 절대 무제약」이라는 지문은 오답 チャタレイ·泉佐野가 근거 . - 「공공의 복지」만으로는 심사기준이 되지 못한다는 비판 → 二重の基準論 용어/二重の基準論.md · 合憲性推定の原則 용어/合憲性推定の原則.md 으로 논의가 이어지는 흐름을 함께 잡아 두면 응용 문제에 강하다."},"一元的内在制約説":{"type":"term","subject":"용어","id":"一元的内在制約説","title":"一元的内在制約説","sub":"いちげんてきないざいせいやくせつ","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>いちげんてきないざいせいやくせつ（일원적 내재제약설）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론 — 인권의 한계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003ca href=\"#/e/%E5%85%AC%E5%85%B1%E3%81%AE%E7%A6%8F%E7%A5%89\">公共の福祉\u003c/a>를 \u003cstrong>모든 인권에 논리 필연적으로 내재하는 인권 상호 조정의 실질적 공평 원리\u003c/strong>로 보는 견해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>통설\u003c/strong>（宮沢俊義 등）. 판례는 특정 학설을 명언하지 않으나 이 이해와 모순되지 않는 판시를 해 왔다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>일본국헌법은 12조·13조에서 인권 전반에 대해 「公共の福祉」를 언급하고, 22조 1항·29조 2항에서 경제적 자유에 대해 다시 이를 언급한다. 이 \u003cstrong>이중 배치\u003c/strong>를 어떻게 설명할 것인가가 이 학설군의 출발점이다.\u003c/p>\n\u003cp>일원적 내재제약설은 「공공의 복지」를 \u003cstrong>국가·사회 전체의 이익이라는 외부의 힘이 아니라, 인권 그 자체에 처음부터 붙어 있는 제약\u003c/strong>으로 이해한다. 인권은 모든 사람에게 평등하게 보장되므로, 어떤 사람의 인권과 다른 사람의 인권이 충돌하는 것은 필연적이다. 그 충돌을 조정하기 위해 서로 양보시키는 \u003cstrong>실질적 공평의 원리\u003c/strong>가 바로 공공의 복지라는 것이다. 따라서 공공의 복지는 12조·13조에만 근거를 두는 \u003cstrong>일원적(一元的)\u003c/strong> 원리이며, 모든 인권에 \u003cstrong>내재(内在)\u003c/strong>한다.\u003c/p>\n\u003cp>이 설은 나아가 공공의 복지를 두 가지로 나눈다. ① \u003cstrong>자유국가적 공공의 복지（필요최소한도의 규제）\u003c/strong> — 자유권 상호의 모순·충돌을 조정하기 위해 모든 인권에 작용한다. ② \u003cstrong>사회국가적 공공의 복지（필요한 한도의 규제）\u003c/strong> — 사회권을 실질화하기 위해 경제적 자유를 정책적으로 제약한다. \u003cstrong>22조 1항·29조 2항에 「공공의 복지」가 다시 쓰인 것은, 경제적 자유에는 ②의 정책적 제약까지 작용한다는 점을 특별히 나타낸 것\u003c/strong>이라고 설명한다. 이렇게 하면 13조의 재판규범성을 유지하면서도 조문 배치를 무리 없이 설명할 수 있다.\u003c/p>\n\u003cp>이 설의 결정적 장점은 \u003cstrong>13조를 재판규범으로 살려 둔다\u003c/strong>는 점이다. 그 덕분에 13조 후단의 행복추구권이 프라이버시권·자기결정권 등 「새로운 인권」의 근거 조문이 될 수 있다(→ \u003ca href=\"#/e/%E4%BA%AC%E9%83%BD%E5%BA%9C%E5%AD%A6%E9%80%A3%E4%BA%8B%E4%BB%B6\">京都府学連事件\u003c/a>, \u003cspan>ノンフィクション逆転事件\u003c/span> 등).\u003c/p>\n\u003cp>다만 「인권 상호의 조정」이라는 설명만으로는 구체적 사건에서 어느 쪽이 이기는지 알 수 없다는 비판이 있다. 「공공의 복지에 의한 제약이므로 합헌」이라는 \u003cstrong>결론만의 판단(公共の福祉論)\u003c/strong>을 막지 못한다는 것이다. 그래서 통설은 여기서 더 나아가 \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>·비교형량론·LRA 기준 등 \u003cstrong>구체적 위헌심사기준\u003c/strong>을 세우는 방향으로 전개되었다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>「공공의 복지」의 성격\u003c/th>\u003cth>12·13조의 의미\u003c/th>\u003cth>22·29조의 의미\u003c/th>\u003cth>결정적 비판\u003c/th>\u003c/tr>\u003ctr>\u003ctd>一元的外在制約説\u003c/td>\u003ctd>인권을 \u003cstrong>외부에서\u003c/strong> 제약하는 일반원리\u003c/td>\u003ctd>인권 전반에 대한 \u003cstrong>일반적 제약 근거\u003c/strong>\u003c/td>\u003ctd>주의적 규정에 불과\u003c/td>\u003ctd>법률로 인권을 무제한 제한 가능 → \u003cstrong>메이지 헌법의 「법률의 유보」와 같아진다\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>内在・外在二元的制約説\u003c/td>\u003ctd>원칙은 내재적 제약, 경제적 자유·사회권에는 \u003cstrong>외재적(정책적) 제약\u003c/strong>도\u003c/td>\u003ctd>\u003cstrong>훈시적·윤리적 규정\u003c/strong>에 그침（재판규범성 부정）\u003c/td>\u003ctd>\u003cstrong>외재적 제약의 근거 조문\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>13조가 재판규범이 아니게 되어\u003c/strong> 새로운 인권(프라이버시 등)의 근거를 잃음. 제약 근거를 조문 문언에 의존해 부자연스러움\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>一元的内在制約説\u003c/strong>\u003c/td>\u003ctd>\u003cstrong>모든 인권에 내재\u003c/strong>하는 인권 상호 조정의 실질적 공평 원리\u003c/td>\u003ctd>\u003cstrong>일원적 근거 조문\u003c/strong>（13조는 재판규범）\u003c/td>\u003ctd>\u003cstrong>사회국가적 공공의 복지\u003c/strong>가 특히 강하게 작용함을 나타낸 규정\u003c/td>\u003ctd>추상적이어서 그대로는 심사기준이 못 됨 → \u003cstrong>구체적 기준론으로 보완 필요\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>全逓東京中郵事件\u003c/td>\u003ctd>最大判昭41.10.26 / 刑集20巻8号901頁\u003c/td>\u003ctd>우편 노동자의 쟁의행위 선동\u003c/td>\u003ctd>근로기본권의 제한은 「\u003cstrong>필요최소한도\u003c/strong>」에 그쳐야 한다며 \u003cstrong>이익형량\u003c/strong>으로 판단（내재적 제약의 발상을 구체화한 예. 다만 후에 全農林警職法事件 最大判昭48.4.25가 이를 변경）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>博多駅テレビフィルム提出命令事件\u003c/td>\u003ctd>最大決昭44.11.26 / 刑集23巻11号1490頁\u003c/td>\u003ctd>취재 필름 제출명령과 보도의 자유\u003c/td>\u003ctd>「보도의 자유는 21조의 보장 아래 있고 \u003cstrong>취재의 자유도 충분히 존중할 가치\u003c/strong>가 있다」며 \u003cstrong>공정한 형사재판의 실현이라는 이익과 비교형량\u003c/strong>하여 결정（인권 대 인권·이익의 조정）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限違憲判決\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 거리제한\u003c/td>\u003ctd>규제 목적·필요성·제한 정도를 비교형량. \u003cstrong>소극목적 규제에는 엄격한 합리성\u003c/strong> → 위헌（내재적 제약과 정책적 제약의 구별에 대응）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 거리제한\u003c/td>\u003ctd>\u003cstrong>적극목적(사회국가적 공공의 복지)\u003c/strong> 규제는 넓은 입법재량 → 明白性の原則으로 합헌\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>세 학설의 구별 포인트는 딱 두 가지\u003c/strong>: ① 12·13조에 \u003cstrong>재판규범성\u003c/strong>을 인정하는가, ② 22·29조의 「공공의 복지」를 \u003cstrong>어떻게 설명\u003c/strong>하는가. 이 두 축으로 표를 재구성해 암기하라.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「일원적 내재제약설은 13조를 훈시규정으로 본다」 → \u003cstrong>오답\u003c/strong>. 13조를 \u003cstrong>훈시적·윤리적 규정으로 보는 것은 내재·외재 이원적 제약설\u003c/strong>이다. 두 설이 자주 뒤바뀌어 출제된다.\u003c/li>\u003cli>\u003cstrong>대비: 일원적 「외재」 제약설 ↔ 일원적 「내재」 제약설\u003c/strong>. 이름이 한 글자 차이다. \u003cstrong>외재 = 인권 밖에서 누르는 힘 → 법률의 유보와 같아져 배척\u003c/strong>, \u003cstrong>내재 = 인권 안에 이미 있는 조정 원리 → 통설\u003c/strong>.\u003c/li>\u003cli>「내재·외재 이원설을 취하면 프라이버시권의 헌법상 근거가 곤란해진다」는 논리 연결은 서술·응용 문제의 단골이다.\u003c/li>\u003cli>일원적 내재제약설을 취해도 \u003cstrong>그 자체로는 위헌심사기준이 되지 못한다\u003c/strong>는 점, 그래서 \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>이 필요해진다는 흐름을 기억할 것.\u003c/li>\u003cli>「자유국가적 공공의 복지 = \u003cstrong>필요최소한도\u003c/strong>」 / 「사회국가적 공공의 복지 = \u003cstrong>필요한 한도\u003c/strong>」라는 문구 차이도 지문에 그대로 나온다.\u003c/li>\u003c/ul>","search":"一元的内在制約説 いちげんてきないざいせいやくせつ 항목 내용 ------ ------ 읽기 いちげんてきないざいせいやくせつ（일원적 내재제약설） 과목 헌법（인권총론 — 인권의 한계） 한줄 정의 公共の福祉 용어/公共の福祉.md 를 모든 인권에 논리 필연적으로 내재하는 인권 상호 조정의 실질적 공평 원리 로 보는 견해 통설·판례 통설 （宮沢俊義 등）. 판례는 특정 학설을 명언하지 않으나 이 이해와 모순되지 않는 판시를 해 왔다 개념 일본국헌법은 12조·13조에서 인권 전반에 대해 「公共の福祉」를 언급하고, 22조 1항·29조 2항에서 경제적 자유에 대해 다시 이를 언급한다. 이 이중 배치 를 어떻게 설명할 것인가가 이 학설군의 출발점이다. 일원적 내재제약설은 「공공의 복지」를 국가·사회 전체의 이익이라는 외부의 힘이 아니라, 인권 그 자체에 처음부터 붙어 있는 제약 으로 이해한다. 인권은 모든 사람에게 평등하게 보장되므로, 어떤 사람의 인권과 다른 사람의 인권이 충돌하는 것은 필연적이다. 그 충돌을 조정하기 위해 서로 양보시키는 실질적 공평의 원리 가 바로 공공의 복지라는 것이다. 따라서 공공의 복지는 12조·13조에만 근거를 두는 일원적 一元的 원리이며, 모든 인권에 내재 内在 한다. 이 설은 나아가 공공의 복지를 두 가지로 나눈다. ① 자유국가적 공공의 복지（필요최소한도의 규제） — 자유권 상호의 모순·충돌을 조정하기 위해 모든 인권에 작용한다. ② 사회국가적 공공의 복지（필요한 한도의 규제） — 사회권을 실질화하기 위해 경제적 자유를 정책적으로 제약한다. 22조 1항·29조 2항에 「공공의 복지」가 다시 쓰인 것은, 경제적 자유에는 ②의 정책적 제약까지 작용한다는 점을 특별히 나타낸 것 이라고 설명한다. 이렇게 하면 13조의 재판규범성을 유지하면서도 조문 배치를 무리 없이 설명할 수 있다. 이 설의 결정적 장점은 13조를 재판규범으로 살려 둔다 는 점이다. 그 덕분에 13조 후단의 행복추구권이 프라이버시권·자기결정권 등 「새로운 인권」의 근거 조문이 될 수 있다 → 京都府学連事件 헌법/京都府学連事件.md , ノンフィクション逆転事件 헌법/ノンフィクション逆転事件.md 등 . 다만 「인권 상호의 조정」이라는 설명만으로는 구체적 사건에서 어느 쪽이 이기는지 알 수 없다는 비판이 있다. 「공공의 복지에 의한 제약이므로 합헌」이라는 결론만의 판단 公共の福祉論 을 막지 못한다는 것이다. 그래서 통설은 여기서 더 나아가 二重の基準論 용어/二重の基準論.md ·비교형량론·lra 기준 등 구체적 위헌심사기준 을 세우는 방향으로 전개되었다. 학설 학설 「공공의 복지」의 성격 12·13조의 의미 22·29조의 의미 결정적 비판 ------ ---------------------- ---------------- ---------------- ------------- 一元的外在制約説 인권을 외부에서 제약하는 일반원리 인권 전반에 대한 일반적 제약 근거 주의적 규정에 불과 법률로 인권을 무제한 제한 가능 → 메이지 헌법의 「법률의 유보」와 같아진다 内在・外在二元的制約説 원칙은 내재적 제약, 경제적 자유·사회권에는 외재적 정책적 제약 도 훈시적·윤리적 규정 에 그침（재판규범성 부정） 외재적 제약의 근거 조문 13조가 재판규범이 아니게 되어 새로운 인권 프라이버시 등 의 근거를 잃음. 제약 근거를 조문 문언에 의존해 부자연스러움 一元的内在制約説 모든 인권에 내재 하는 인권 상호 조정의 실질적 공평 원리 일원적 근거 조문 （13조는 재판규범） 사회국가적 공공의 복지 가 특히 강하게 작용함을 나타낸 규정 추상적이어서 그대로는 심사기준이 못 됨 → 구체적 기준론으로 보완 필요 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 全逓東京中郵事件 最大判昭41.10.26 / 刑集20巻8号901頁 우편 노동자의 쟁의행위 선동 근로기본권의 제한은 「 필요최소한도 」에 그쳐야 한다며 이익형량 으로 판단（내재적 제약의 발상을 구체화한 예. 다만 후에 全農林警職法事件 最大判昭48.4.25가 이를 변경） 博多駅テレビフィルム提出命令事件 最大決昭44.11.26 / 刑集23巻11号1490頁 취재 필름 제출명령과 보도의 자유 「보도의 자유는 21조의 보장 아래 있고 취재의 자유도 충분히 존중할 가치 가 있다」며 공정한 형사재판의 실현이라는 이익과 비교형량 하여 결정（인권 대 인권·이익의 조정） 薬事法距離制限違憲判決 最大判昭50.4.30 / 民集29巻4号572頁 약국 거리제한 규제 목적·필요성·제한 정도를 비교형량. 소극목적 규제에는 엄격한 합리성 → 위헌（내재적 제약과 정책적 제약의 구별에 대응） 小売市場距離制限事件 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 거리제한 적극목적 사회국가적 공공의 복지 규제는 넓은 입법재량 → 明白性の原則으로 합헌 💡 수험 팁 - 세 학설의 구별 포인트는 딱 두 가지 : ① 12·13조에 재판규범성 을 인정하는가, ② 22·29조의 「공공의 복지」를 어떻게 설명 하는가. 이 두 축으로 표를 재구성해 암기하라. - 최대 함정 : 「일원적 내재제약설은 13조를 훈시규정으로 본다」 → 오답 . 13조를 훈시적·윤리적 규정으로 보는 것은 내재·외재 이원적 제약설 이다. 두 설이 자주 뒤바뀌어 출제된다. - 대비: 일원적 「외재」 제약설 ↔ 일원적 「내재」 제약설 . 이름이 한 글자 차이다. 외재 = 인권 밖에서 누르는 힘 → 법률의 유보와 같아져 배척 , 내재 = 인권 안에 이미 있는 조정 원리 → 통설 . - 「내재·외재 이원설을 취하면 프라이버시권의 헌법상 근거가 곤란해진다」는 논리 연결은 서술·응용 문제의 단골이다. - 일원적 내재제약설을 취해도 그 자체로는 위헌심사기준이 되지 못한다 는 점, 그래서 二重の基準論 용어/二重の基準論.md 이 필요해진다는 흐름을 기억할 것. - 「자유국가적 공공의 복지 = 필요최소한도 」 / 「사회국가적 공공의 복지 = 필요한 한도 」라는 문구 차이도 지문에 그대로 나온다."},"制度的保障":{"type":"term","subject":"용어","id":"制度的保障","title":"制度的保障","sub":"せいどてきほしょう","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>せいどてきほしょう（제도적 보장）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론 — 인권 보장의 방식）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>헌법이 \u003cstrong>일정한 제도 그 자체를 객관적으로 보장\u003c/strong>하여 법률로도 그 \u003cstrong>핵심(本質的内容)\u003c/strong>을 침해할 수 없게 함으로써, 관련된 인권을 \u003cstrong>간접적으로\u003c/strong> 보호하는 것\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>판례는 \u003cstrong>정교분리 규정\u003c/strong>을 제도적 보장으로 명시（\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a> 最大判昭52.7.13）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>인권 규정은 보통 \u003cstrong>개인의 주관적 권리\u003c/strong>를 직접 보장한다. 이에 비해 제도적 보장은 개인의 권리가 아니라 \u003cstrong>제도(시스템) 그 자체\u003c/strong>를 헌법이 보장하고, 그 제도가 유지됨으로써 결과적으로 개인의 인권이 지켜지도록 하는 보장 방식이다. 독일 바이마르 헌법하에서 카를 슈미트(C. Schmitt)가 주창한 \u003cstrong>제도체 보장(Einrichtungsgarantie)\u003c/strong> 이론에서 유래한다.\u003c/p>\n\u003cp>핵심은 \u003cstrong>입법권의 구속\u003c/strong>이다. 제도적 보장이 인정되면 입법자는 그 제도의 \u003cstrong>핵심(본질적 내용)\u003c/strong>을 법률로 폐지하거나 형해화할 수 없다. 반대로 말하면 \u003cstrong>핵심을 벗어난 주변부는 입법재량에 맡겨진다\u003c/strong>. 여기에 이 이론의 양면성이 있다.\u003c/p>\n\u003cp>일본국헌법에서 제도적 보장으로 설명되는 대표 예는 다음과 같다.\u003c/p>\n\u003cul>\u003cli>\u003cstrong>정교분리（20조 1항 후단·3항, 89조）\u003c/strong> — \u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>이 「정교분리 규정은 이른바 \u003cstrong>제도적 보장의 규정\u003c/strong>으로서, \u003cstrong>신교의 자유 그 자체를 직접 보장하는 것이 아니라\u003c/strong>, 국가와 종교의 분리를 제도로서 보장함으로써 \u003cstrong>간접적으로 신교의 자유의 보장을 확보\u003c/strong>하려는 것」이라고 명시했다.\u003c/li>\u003cli>\u003cstrong>대학의 자치（23조）\u003c/strong> — 학문의 자유를 실효적으로 지키기 위해 대학의 자치(교수·인사의 자주결정, 시설·학생 관리의 자주결정)를 보장한다（東大ポポロ事件）.\u003c/li>\u003cli>\u003cstrong>지방자치（92조）\u003c/strong> — 「지방자치의 본지(本旨)」(주민자치·단체자치)를 법률로도 침해할 수 없다.\u003c/li>\u003cli>\u003cstrong>사유재산제（29조 1항）\u003c/strong> — 개인의 재산권과는 별도로 사유재산제라는 제도 자체를 보장한다는 이해.\u003c/li>\u003c/ul>\n\u003cp>한편 이 이론에는 강한 비판이 있다. \u003cstrong>① 「핵심」의 범위가 불명확\u003c/strong>하고, \u003cstrong>② 핵심만 지키면 된다는 논리가 오히려 인권 제한을 정당화하는 근거로 쓰인다\u003c/strong>는 것이다. 실제로 津地鎮祭事件은 정교분리를 제도적 보장이라고 규정한 뒤 「\u003cstrong>국가와 종교의 완전한 분리는 불가능하며 상당한 한도를 넘는 관계만 금지된다\u003c/strong>」는 논리로 \u003cstrong>\u003ca href=\"#/e/%E7%9B%AE%E7%9A%84%E5%8A%B9%E6%9E%9C%E5%9F%BA%E6%BA%96\">목적효과기준\u003c/a>\u003c/strong>을 도출하여 지진제를 합헌으로 판단했다. 즉 제도적 보장론이 \u003cstrong>인권 보장의 완화\u003c/strong>로 기능한 예다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%B4%A5%E5%9C%B0%E9%8E%AE%E7%A5%AD%E4%BA%8B%E4%BB%B6\">津地鎮祭事件\u003c/a>\u003c/td>\u003ctd>最大判昭52.7.13 / 民集31巻4号533頁\u003c/td>\u003ctd>시(市) 주최 기공식(지진제)에 공금 지출\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 정교분리 규정은 \u003cstrong>제도적 보장\u003c/strong>이며 신교의 자유를 직접 보장하는 것이 아니다 → \u003cstrong>목적효과기준\u003c/strong>으로 판단하여 20조 3항의 「종교적 활동」에 해당하지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%84%9B%E5%AA%9B%E7%8E%89%E4%B8%B2%E6%96%99%E8%A8%B4%E8%A8%9F\">愛媛玉串料訴訟\u003c/a>\u003c/td>\u003ctd>最大判平9.4.2 / 民集51巻4号1673頁\u003c/td>\u003ctd>현(県)이 야스쿠니신사 등에 다마구시료 공금 지출\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（20조 3항·89조）. 같은 제도적 보장·목적효과기준의 틀에서 위헌 결론이 나온 최초의 예\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>孔子廟訴訟\u003c/span>\u003c/td>\u003ctd>最大判令3.2.24 / 民集75巻2号29頁\u003c/td>\u003ctd>나하시가 공자묘 부지 사용료를 전액 면제\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（20조 3항）. 목적효과기준을 명시적으로 쓰지 않고 \u003cstrong>종합고려\u003c/strong>로 판단\u003c/td>\u003c/tr>\u003ctr>\u003ctd>東大ポポロ事件\u003c/td>\u003ctd>最大判昭38.5.22 / 刑集17巻4号370頁\u003c/td>\u003ctd>대학 내 학생 연극 발표회에 사복 경찰관이 잠입\u003c/td>\u003ctd>23조의 학문의 자유를 보장하기 위해 \u003cstrong>대학의 자치\u003c/strong>가 인정된다. 다만 학생의 집회가 \u003cstrong>실사회의 정치적·사회적 활동\u003c/strong>에 해당하면 대학의 자치의 향유 범위 밖 → \u003cstrong>피고인 유죄 방향으로 파기환송\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>정의의 핵심 문구\u003c/strong>: 「제도 자체를 보장하여 \u003cstrong>간접적으로\u003c/strong> 인권을 보호」. \u003cstrong>「직접 보장한다」는 지문은 오답\u003c/strong>이다. 津地鎮祭事件은 명시적으로 「신교의 자유 그 자체를 \u003cstrong>직접 보장하는 것이 아니다\u003c/strong>」라고 했다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 제도적 보장 = 인권 보장을 강화하는 이론이라고 생각하기 쉬우나, 실제로는 \u003cstrong>「핵심 외에는 입법재량」\u003c/strong>이라는 결론으로 이어져 \u003cstrong>보장을 약화시킨다는 비판\u003c/strong>이 있다. 이 비판을 묻는 문제가 나온다.\u003c/li>\u003cli>대표 3종 세트를 조문 번호와 함께 암기: \u003cstrong>정교분리(20조·89조) / 대학의 자치(23조) / 지방자치(92조)\u003c/strong>. 여기에 사유재산제(29조 1항)를 더한다.\u003c/li>\u003cli>\u003cstrong>대비: 제도적 보장(정교분리) ↔ 개인의 주관적 권리(신교의 자유 20조 1항 전단)\u003c/strong>. 정교분리 위반을 다투는 소송이 \u003cstrong>주민소송(지방자치법 242조의2)\u003c/strong> 형태로 제기되는 이유도 여기에 있다(개인의 권리 침해로 구성하기 어렵기 때문).\u003c/li>\u003cli>東大ポポロ事件의 결론을 「학생 측 승소」로 착각하지 말 것. \u003cstrong>정치적·사회적 활동에는 대학의 자치가 미치지 않는다\u003c/strong>고 하여 학생에게 불리한 판단이었다.\u003c/li>\u003cli>정교분리 관련 판례군은 \u003cspan>殉職自衛官合祀拒否訴訟\u003c/span>·\u003cspan>箕面忠魂碑訴訟\u003c/span>까지 세트로 정리해 두면 좋다.\u003c/li>\u003c/ul>","search":"制度的保障 せいどてきほしょう 항목 내용 ------ ------ 읽기 せいどてきほしょう（제도적 보장） 과목 헌법（인권총론 — 인권 보장의 방식） 한줄 정의 헌법이 일정한 제도 그 자체를 객관적으로 보장 하여 법률로도 그 핵심 本質的内容 을 침해할 수 없게 함으로써, 관련된 인권을 간접적으로 보호하는 것 통설·판례 판례는 정교분리 규정 을 제도적 보장으로 명시（ 津地鎮祭事件 헌법/津地鎮祭事件.md 最大判昭52.7.13） 개념 인권 규정은 보통 개인의 주관적 권리 를 직접 보장한다. 이에 비해 제도적 보장은 개인의 권리가 아니라 제도 시스템 그 자체 를 헌법이 보장하고, 그 제도가 유지됨으로써 결과적으로 개인의 인권이 지켜지도록 하는 보장 방식이다. 독일 바이마르 헌법하에서 카를 슈미트 c. schmitt 가 주창한 제도체 보장 einrichtungsgarantie 이론에서 유래한다. 핵심은 입법권의 구속 이다. 제도적 보장이 인정되면 입법자는 그 제도의 핵심 본질적 내용 을 법률로 폐지하거나 형해화할 수 없다. 반대로 말하면 핵심을 벗어난 주변부는 입법재량에 맡겨진다 . 여기에 이 이론의 양면성이 있다. 일본국헌법에서 제도적 보장으로 설명되는 대표 예는 다음과 같다. - 정교분리（20조 1항 후단·3항, 89조） — 津地鎮祭事件 헌법/津地鎮祭事件.md 이 「정교분리 규정은 이른바 제도적 보장의 규정 으로서, 신교의 자유 그 자체를 직접 보장하는 것이 아니라 , 국가와 종교의 분리를 제도로서 보장함으로써 간접적으로 신교의 자유의 보장을 확보 하려는 것」이라고 명시했다. - 대학의 자치（23조） — 학문의 자유를 실효적으로 지키기 위해 대학의 자치 교수·인사의 자주결정, 시설·학생 관리의 자주결정 를 보장한다（東大ポポロ事件）. - 지방자치（92조） — 「지방자치의 본지 本旨 」 주민자치·단체자치 를 법률로도 침해할 수 없다. - 사유재산제（29조 1항） — 개인의 재산권과는 별도로 사유재산제라는 제도 자체를 보장한다는 이해. 한편 이 이론에는 강한 비판이 있다. ① 「핵심」의 범위가 불명확 하고, ② 핵심만 지키면 된다는 논리가 오히려 인권 제한을 정당화하는 근거로 쓰인다 는 것이다. 실제로 津地鎮祭事件은 정교분리를 제도적 보장이라고 규정한 뒤 「 국가와 종교의 완전한 분리는 불가능하며 상당한 한도를 넘는 관계만 금지된다 」는 논리로 목적효과기준 용어/目的効果基準.md 을 도출하여 지진제를 합헌으로 판단했다. 즉 제도적 보장론이 인권 보장의 완화 로 기능한 예다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 津地鎮祭事件 헌법/津地鎮祭事件.md 最大判昭52.7.13 / 民集31巻4号533頁 시 市 주최 기공식 지진제 에 공금 지출 합헌 . 정교분리 규정은 제도적 보장 이며 신교의 자유를 직접 보장하는 것이 아니다 → 목적효과기준 으로 판단하여 20조 3항의 「종교적 활동」에 해당하지 않음 愛媛玉串料訴訟 헌법/愛媛玉串料訴訟.md 最大判平9.4.2 / 民集51巻4号1673頁 현 県 이 야스쿠니신사 등에 다마구시료 공금 지출 위헌 （20조 3항·89조）. 같은 제도적 보장·목적효과기준의 틀에서 위헌 결론이 나온 최초의 예 孔子廟訴訟 헌법/孔子廟訴訟.md 最大判令3.2.24 / 民集75巻2号29頁 나하시가 공자묘 부지 사용료를 전액 면제 위헌 （20조 3항）. 목적효과기준을 명시적으로 쓰지 않고 종합고려 로 판단 東大ポポロ事件 最大判昭38.5.22 / 刑集17巻4号370頁 대학 내 학생 연극 발표회에 사복 경찰관이 잠입 23조의 학문의 자유를 보장하기 위해 대학의 자치 가 인정된다. 다만 학생의 집회가 실사회의 정치적·사회적 활동 에 해당하면 대학의 자치의 향유 범위 밖 → 피고인 유죄 방향으로 파기환송 💡 수험 팁 - 정의의 핵심 문구 : 「제도 자체를 보장하여 간접적으로 인권을 보호」. 「직접 보장한다」는 지문은 오답 이다. 津地鎮祭事件은 명시적으로 「신교의 자유 그 자체를 직접 보장하는 것이 아니다 」라고 했다. - 최대 함정 : 제도적 보장 = 인권 보장을 강화하는 이론이라고 생각하기 쉬우나, 실제로는 「핵심 외에는 입법재량」 이라는 결론으로 이어져 보장을 약화시킨다는 비판 이 있다. 이 비판을 묻는 문제가 나온다. - 대표 3종 세트를 조문 번호와 함께 암기: 정교분리 20조·89조 / 대학의 자치 23조 / 지방자치 92조 . 여기에 사유재산제 29조 1항 를 더한다. - 대비: 제도적 보장 정교분리 ↔ 개인의 주관적 권리 신교의 자유 20조 1항 전단 . 정교분리 위반을 다투는 소송이 주민소송 지방자치법 242조의2 형태로 제기되는 이유도 여기에 있다 개인의 권리 침해로 구성하기 어렵기 때문 . - 東大ポポロ事件의 결론을 「학생 측 승소」로 착각하지 말 것. 정치적·사회적 활동에는 대학의 자치가 미치지 않는다 고 하여 학생에게 불리한 판단이었다. - 정교분리 관련 판례군은 殉職自衛官合祀拒否訴訟 헌법/殉職自衛官合祀拒否訴訟.md · 箕面忠魂碑訴訟 헌법/箕面忠魂碑訴訟.md 까지 세트로 정리해 두면 좋다."},"特別権力関係":{"type":"term","subject":"용어","id":"特別権力関係","title":"特別権力関係","sub":"とくべつけんりょくかんけい","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>とくべつけんりょくかんけい（특별권력관계）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론）· 행정법（행정법 총론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>공무원·재감자 등 특별한 법률관계에 있는 자에 대해서는 \u003cstrong>법률의 근거 없이도 포괄적으로 명령·강제할 수 있고 인권을 넓게 제한할 수 있으며 사법심사도 미치지 않는다\u003c/strong>고 보았던 구(舊)이론\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>현행 헌법하에서는 부정\u003c/strong>. 각 관계마다 헌법상 근거와 목적에 비추어 제약의 허용 범위를 개별 검토한다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>특별권력관계론은 독일 공법학(오토 마이어 등)에서 유래해 메이지 헌법하 일본에 계수된 이론이다. 국가와 국민의 일반적 관계(일반권력관계)와 달리, 법률의 규정이나 본인의 동의에 의해 성립하는 \u003cstrong>특별한 관계\u003c/strong>에서는 국가가 \u003cstrong>포괄적 지배권\u003c/strong>을 갖는다고 보았다.\u003c/p>\n\u003cp>내용은 세 가지로 정리된다. ① \u003cstrong>법치주의의 배제\u003c/strong> — 법률의 근거 없이도 명령·강제할 수 있다. ② \u003cstrong>인권 제한의 확대\u003c/strong> — 법률의 근거 없이 인권을 제한할 수 있다. ③ \u003cstrong>사법심사의 배제\u003c/strong> — 그 관계 내부의 행위에는 재판소의 심사가 미치지 않는다.\u003c/p>\n\u003cp>성립이 인정되던 관계는 ⑴ \u003cstrong>공무원의 근무관계\u003c/strong>, ⑵ \u003cstrong>재감(在監)관계\u003c/strong>(수형자·미결구금자), ⑶ \u003cstrong>국공립학교의 재학관계\u003c/strong> 등이다.\u003c/p>\n\u003cp>그러나 현행 헌법하에서 이 이론은 \u003cstrong>부정된다\u003c/strong>. ① 헌법은 기본적 인권을 「침해할 수 없는 영구의 권리」로 하고(11조·97조), ② \u003cstrong>법의 지배\u003c/strong>와 최고법규성(98조)을 채용했으며, ③ \u003cstrong>재판을 받을 권리(32조)\u003c/strong>를 보장하기 때문에, 「법률 없이 인권 제한, 사법심사 없음」이라는 결론을 일률적으로 인정할 수 없다.\u003c/p>\n\u003cp>현재는 특별권력관계라는 \u003cstrong>통일적 개념을 버리고\u003c/strong>, 각각의 관계마다 \u003cstrong>헌법 자체가 그 관계의 존재와 자율성을 예정하고 있는지\u003c/strong>(공무원은 15조·73조 4호, 수형자는 18조·31조 등)를 확인한 뒤, \u003cstrong>그 목적 달성을 위해 필요최소한도의 제약인지\u003c/strong>를 개별·구체적으로 심사한다. 사법심사에 관해서는 대학·지방의회·정당 등에 대해 \u003cstrong>\u003ca href=\"#/e/%E9%83%A8%E5%88%86%E7%A4%BE%E4%BC%9A%E3%81%AE%E6%B3%95%E7%90%86\">부분사회의 법리\u003c/a>\u003c/strong>가 별도로 논의된다(→ 富山大学単位不認定事件).\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>특별권력관계 긍정설（구이론）\u003c/td>\u003ctd>법치주의 배제·인권 제한 확대·사법심사 배제의 3요소를 인정\u003c/td>\u003ctd>메이지 헌법하의 통설. \u003cstrong>현행 헌법에서는 부정\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>수정설（형식적 부정설）\u003c/td>\u003ctd>개념 자체는 유지하되 법률의 근거와 사법심사를 요구\u003c/td>\u003ctd>과도기의 견해\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>개별적 검토설（전면 부정설）\u003c/strong>\u003c/td>\u003ctd>통일 개념을 부정하고, 관계마다 헌법상 근거·목적·제약 정도를 개별 심사\u003c/td>\u003ctd>👉 \u003cstrong>현재의 통설\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>猿払事件\u003c/td>\u003ctd>最大判昭49.11.6 / 刑集28巻9号393頁\u003c/td>\u003ctd>우편국 직원의 선거 포스터 게시（국가공무원법의 정치적 행위 금지）\u003c/td>\u003ctd>\u003cstrong>합헌·유죄\u003c/strong>. 「행정의 중립적 운영과 그에 대한 국민의 신뢰 확보」라는 목적, 그 목적과 금지되는 정치적 행위의 \u003cstrong>합리적 관련성\u003c/strong>, 얻는 이익과 잃는 이익의 균형으로 판단（\u003cstrong>합리적 관련성의 기준\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>堀越事件\u003c/td>\u003ctd>最判平24.12.7 / 刑集66巻12号1337頁\u003c/td>\u003ctd>사회보험청 직원의 정당 기관지 배포\u003c/td>\u003ctd>\u003cstrong>무죄\u003c/strong>. 금지 대상을 「\u003cstrong>행정의 중립적 운영에 실질적 위험을 미치는 행위\u003c/strong>」로 한정 해석 → 관리직적 지위가 없는 직원의 직무와 무관한 행위는 해당 없음（猿払의 실질적 수정）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>全農林警職法事件\u003c/td>\u003ctd>最大判昭48.4.25 / 刑集27巻4号547頁\u003c/td>\u003ctd>공무원의 쟁의행위 선동\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 공무원의 지위의 특수성과 직무의 공공성, 근무조건 법정주의(재정민주주의), 대상(代償)조치의 존재를 이유로 쟁의행위 일률 금지도 합헌（全逓東京中郵事件 最大判昭41.10.26을 변경）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>よど号ハイジャック記事抹消事件\u003c/td>\u003ctd>最大判昭58.6.22 / 民集37巻5号793頁\u003c/td>\u003ctd>미결구금자가 구독하는 신문의 기사 말소\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>. 열독의 자유는 보장되나, 규율·질서 유지상 장해가 생길 「\u003cstrong>상당의 개연성\u003c/strong>」이 있으면 필요최소한도의 제한이 허용된다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>未決拘禁者喫煙禁止事件\u003c/td>\u003ctd>最大判昭45.9.16 / 民集24巻10号1410頁\u003c/td>\u003ctd>구치소 내 흡연 금지\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 흡연의 자유가 13조로 보장된다 해도 구금 목적(도주·증거인멸·화재 방지)상 필요한 제한\u003c/td>\u003c/tr>\u003ctr>\u003ctd>富山大学単位不認定事件\u003c/td>\u003ctd>最判昭52.3.15\u003c/td>\u003ctd>대학의 학점 불인정 처분의 위법 확인\u003c/td>\u003ctd>\u003cstrong>각하\u003c/strong>. 대학은 일반 시민사회와 다른 \u003cstrong>특수한 부분사회\u003c/strong>를 형성 → 일반 시민법 질서와 직접 관계 없는 내부 문제는 사법심사 대상 밖（\u003cstrong>부분사회의 법리\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>エホバの証人剣道実技拒否訴訟\u003c/span>\u003c/td>\u003ctd>最二小判平8.3.8 / 民集50巻3号469頁\u003c/td>\u003ctd>신앙을 이유로 검도 실기를 거부한 학생의 유급·퇴학\u003c/td>\u003ctd>\u003cstrong>위법\u003c/strong>. 학교의 재량을 인정하면서도 \u003cstrong>재량권의 일탈·남용\u003c/strong>을 인정 → 재학관계에도 사법심사가 미치는 예\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>결론 암기\u003c/strong>: 「현행 헌법하에서 특별권력관계론은 \u003cstrong>부정된다\u003c/strong>」. 「공무원에게는 특별권력관계가 성립하므로 법률의 근거 없이 인권을 제한할 수 있다」는 지문은 \u003cstrong>무조건 오답\u003c/strong>.\u003c/li>\u003cli>다만 \u003cstrong>이론이 부정된다 ≠ 제약이 허용되지 않는다\u003c/strong>. 판례는 공무원·재감자에 대해 \u003cstrong>결과적으로 제약을 넓게 합헌으로 인정\u003c/strong>해 왔다(猿払·全農林·よど号). 「이론은 부정, 결론은 합헌」이 함정 포인트.\u003c/li>\u003cli>\u003cstrong>3요소 암기\u003c/strong>: ① 법치주의 배제 ② 인권 제한 확대 ③ 사법심사 배제. 부정 근거는 ① 11·97조(인권의 불가침) ② 98조·법의 지배 ③ \u003cstrong>32조(재판을 받을 권리)\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>대비: 특별권력관계론(부정) ↔ 부분사회의 법리(판례가 채용)\u003c/strong>. 富山大学事件은 특별권력관계가 아니라 \u003cstrong>부분사회의 법리\u003c/strong>로 각하한 것이다. 두 용어를 바꿔치기한 지문에 주의.\u003c/li>\u003cli>\u003cstrong>대비: 猿払事件(합헌·유죄) ↔ 堀越事件(무죄)\u003c/strong>. 판례 변경이 아니라 \u003cstrong>한정 해석에 의한 사안 구별\u003c/strong>이라는 점이 중요. 관리직적 지위의 유무·직무 관련성이 갈림길.\u003c/li>\u003cli>재감관계 기준어 암기: よど号 = 「\u003cstrong>상당의 개연성\u003c/strong>」. (「명백하고 현재의 위험」이 아니다 — 바꿔치기 함정 빈출.)\u003c/li>\u003c/ul>","search":"特別権力関係 とくべつけんりょくかんけい 항목 내용 ------ ------ 읽기 とくべつけんりょくかんけい（특별권력관계） 과목 헌법（인권총론）· 행정법（행정법 총론） 한줄 정의 공무원·재감자 등 특별한 법률관계에 있는 자에 대해서는 법률의 근거 없이도 포괄적으로 명령·강제할 수 있고 인권을 넓게 제한할 수 있으며 사법심사도 미치지 않는다 고 보았던 구 舊 이론 통설·판례 현행 헌법하에서는 부정 . 각 관계마다 헌법상 근거와 목적에 비추어 제약의 허용 범위를 개별 검토한다 개념 특별권력관계론은 독일 공법학 오토 마이어 등 에서 유래해 메이지 헌법하 일본에 계수된 이론이다. 국가와 국민의 일반적 관계 일반권력관계 와 달리, 법률의 규정이나 본인의 동의에 의해 성립하는 특별한 관계 에서는 국가가 포괄적 지배권 을 갖는다고 보았다. 내용은 세 가지로 정리된다. ① 법치주의의 배제 — 법률의 근거 없이도 명령·강제할 수 있다. ② 인권 제한의 확대 — 법률의 근거 없이 인권을 제한할 수 있다. ③ 사법심사의 배제 — 그 관계 내부의 행위에는 재판소의 심사가 미치지 않는다. 성립이 인정되던 관계는 ⑴ 공무원의 근무관계 , ⑵ 재감 在監 관계 수형자·미결구금자 , ⑶ 국공립학교의 재학관계 등이다. 그러나 현행 헌법하에서 이 이론은 부정된다 . ① 헌법은 기본적 인권을 「침해할 수 없는 영구의 권리」로 하고 11조·97조 , ② 법의 지배 와 최고법규성 98조 을 채용했으며, ③ 재판을 받을 권리 32조 를 보장하기 때문에, 「법률 없이 인권 제한, 사법심사 없음」이라는 결론을 일률적으로 인정할 수 없다. 현재는 특별권력관계라는 통일적 개념을 버리고 , 각각의 관계마다 헌법 자체가 그 관계의 존재와 자율성을 예정하고 있는지 공무원은 15조·73조 4호, 수형자는 18조·31조 등 를 확인한 뒤, 그 목적 달성을 위해 필요최소한도의 제약인지 를 개별·구체적으로 심사한다. 사법심사에 관해서는 대학·지방의회·정당 등에 대해 부분사회의 법리 용어/部分社会の法理.md 가 별도로 논의된다 → 富山大学単位不認定事件 . 학설 학설 내용 비고 ------ ------ ------ 특별권력관계 긍정설（구이론） 법치주의 배제·인권 제한 확대·사법심사 배제의 3요소를 인정 메이지 헌법하의 통설. 현행 헌법에서는 부정 수정설（형식적 부정설） 개념 자체는 유지하되 법률의 근거와 사법심사를 요구 과도기의 견해 개별적 검토설（전면 부정설） 통일 개념을 부정하고, 관계마다 헌법상 근거·목적·제약 정도를 개별 심사 👉 현재의 통설 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 猿払事件 最大判昭49.11.6 / 刑集28巻9号393頁 우편국 직원의 선거 포스터 게시（국가공무원법의 정치적 행위 금지） 합헌·유죄 . 「행정의 중립적 운영과 그에 대한 국민의 신뢰 확보」라는 목적, 그 목적과 금지되는 정치적 행위의 합리적 관련성 , 얻는 이익과 잃는 이익의 균형으로 판단（ 합리적 관련성의 기준 ） 堀越事件 最判平24.12.7 / 刑集66巻12号1337頁 사회보험청 직원의 정당 기관지 배포 무죄 . 금지 대상을 「 행정의 중립적 운영에 실질적 위험을 미치는 행위 」로 한정 해석 → 관리직적 지위가 없는 직원의 직무와 무관한 행위는 해당 없음（猿払의 실질적 수정） 全農林警職法事件 最大判昭48.4.25 / 刑集27巻4号547頁 공무원의 쟁의행위 선동 합헌 . 공무원의 지위의 특수성과 직무의 공공성, 근무조건 법정주의 재정민주주의 , 대상 代償 조치의 존재를 이유로 쟁의행위 일률 금지도 합헌（全逓東京中郵事件 最大判昭41.10.26을 변경） よど号ハイジャック記事抹消事件 最大判昭58.6.22 / 民集37巻5号793頁 미결구금자가 구독하는 신문의 기사 말소 적법 . 열독의 자유는 보장되나, 규율·질서 유지상 장해가 생길 「 상당의 개연성 」이 있으면 필요최소한도의 제한이 허용된다 未決拘禁者喫煙禁止事件 最大判昭45.9.16 / 民集24巻10号1410頁 구치소 내 흡연 금지 합헌 . 흡연의 자유가 13조로 보장된다 해도 구금 목적 도주·증거인멸·화재 방지 상 필요한 제한 富山大学単位不認定事件 最判昭52.3.15 대학의 학점 불인정 처분의 위법 확인 각하 . 대학은 일반 시민사회와 다른 특수한 부분사회 를 형성 → 일반 시민법 질서와 직접 관계 없는 내부 문제는 사법심사 대상 밖（ 부분사회의 법리 ） エホバの証人剣道実技拒否訴訟 헌법/エホバの証人剣道実技拒否訴訟.md 最二小判平8.3.8 / 民集50巻3号469頁 신앙을 이유로 검도 실기를 거부한 학생의 유급·퇴학 위법 . 학교의 재량을 인정하면서도 재량권의 일탈·남용 을 인정 → 재학관계에도 사법심사가 미치는 예 💡 수험 팁 - 결론 암기 : 「현행 헌법하에서 특별권력관계론은 부정된다 」. 「공무원에게는 특별권력관계가 성립하므로 법률의 근거 없이 인권을 제한할 수 있다」는 지문은 무조건 오답 . - 다만 이론이 부정된다 ≠ 제약이 허용되지 않는다 . 판례는 공무원·재감자에 대해 결과적으로 제약을 넓게 합헌으로 인정 해 왔다 猿払·全農林·よど号 . 「이론은 부정, 결론은 합헌」이 함정 포인트. - 3요소 암기 : ① 법치주의 배제 ② 인권 제한 확대 ③ 사법심사 배제. 부정 근거는 ① 11·97조 인권의 불가침 ② 98조·법의 지배 ③ 32조 재판을 받을 권리 . - 대비: 특별권력관계론 부정 ↔ 부분사회의 법리 판례가 채용 . 富山大学事件은 특별권력관계가 아니라 부분사회의 법리 로 각하한 것이다. 두 용어를 바꿔치기한 지문에 주의. - 대비: 猿払事件 합헌·유죄 ↔ 堀越事件 무죄 . 판례 변경이 아니라 한정 해석에 의한 사안 구별 이라는 점이 중요. 관리직적 지위의 유무·직무 관련성이 갈림길. - 재감관계 기준어 암기: よど号 = 「 상당의 개연성 」. 「명백하고 현재의 위험」이 아니다 — 바꿔치기 함정 빈출."},"二重の基準論":{"type":"term","subject":"용어","id":"二重の基準論","title":"二重の基準論","sub":"にじゅうのきじゅんろん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>にじゅうのきじゅんろん（이중의 기준론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（인권총론 — 위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>\u003cstrong>정신적 자유\u003c/strong>를 제한하는 입법은 \u003cstrong>엄격한 기준\u003c/strong>으로, \u003cstrong>경제적 자유\u003c/strong>를 제한하는 입법은 \u003cstrong>완만한 기준\u003c/strong>으로 합헌성을 심사해야 한다는 이론\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003cstrong>통설\u003c/strong>. 최고재는 이 이론을 정면으로 채용한다고 명언한 적은 없으나, 경제적 자유에서 넓은 입법재량을 인정하는 판시(薬事法·小売市場)로 그 발상을 시사\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003ca href=\"#/e/%E5%85%AC%E5%85%B1%E3%81%AE%E7%A6%8F%E7%A5%89\">公共の福祉\u003c/a>나 \u003ca href=\"#/e/%E4%B8%80%E5%85%83%E7%9A%84%E5%86%85%E5%9C%A8%E5%88%B6%E7%B4%84%E8%AA%AC\">一元的内在制約説\u003c/a>만으로는 「이 법률이 위헌인가」를 판단할 수 없다. 그래서 인권의 \u003cstrong>종류에 따라 심사의 엄격도를 나누자\u003c/strong>는 것이 이중의 기준론이다. 미국 연방대법원의 판례(United States v. Carolene Products 사건의 각주 4)에서 유래한다.\u003c/p>\n\u003cp>\u003cstrong>근거는 두 가지\u003c/strong>이며, 시험에서는 이 두 근거를 정확히 쓸 수 있는지가 갈림길이다.\u003c/p>\n\u003cp>\u003cstrong>① 민주정 과정의 회복 곤란성（민주주의론적 근거 — 주된 근거）\u003c/strong>\u003cbr>표현의 자유 등 정신적 자유는 \u003cstrong>민주적 정치과정 그 자체를 지탱하는 권리\u003c/strong>다. 이것이 부당하게 제한되면 국민은 잘못을 지적하고 다수파를 바꿀 수단을 잃게 되어, \u003cstrong>선거를 통한 자기 회복이 불가능\u003c/strong>해진다. 반면 경제적 자유의 규제가 잘못되었다면 국민은 여론과 선거로 입법부에 시정을 요구할 수 있다. 따라서 회복이 어려운 정신적 자유에 대해서는 재판소가 적극적으로 개입해야 한다.\u003c/p>\n\u003cp>\u003cstrong>② 재판소의 능력（기능론적 근거）\u003c/strong>\u003cbr>경제적 자유의 규제는 사회·경제 정책의 문제로서 복잡한 자료 수집과 전문적·정책적 판단을 요한다. 이는 \u003cstrong>입법부가 재판소보다 훨씬 잘할 수 있는 영역\u003c/strong>이다. 재판소에는 그러한 정책 판단의 자료도 능력도 없으므로, 입법부의 재량을 존중해 심사를 완화해야 한다.\u003c/p>\n\u003cp>결과적으로 정신적 자유에서는 \u003cstrong>\u003ca href=\"#/e/%E5%90%88%E6%86%B2%E6%80%A7%E6%8E%A8%E5%AE%9A%E3%81%AE%E5%8E%9F%E5%89%87\">合憲性推定の原則\u003c/a>이 배제\u003c/strong>되어 국가 측이 규제의 합헌성을 논증해야 하고, 사전억제의 원칙적 금지·명확성의 요구·LRA(보다 제한적이지 않은 다른 선택 수단) 기준 등이 적용된다. 반면 경제적 자유에서는 합헌성 추정이 강하게 작용한다.\u003c/p>\n\u003cp>경제적 자유 내부는 다시 \u003cstrong>\u003ca href=\"#/e/%E8%A6%8F%E5%88%B6%E7%9B%AE%E7%9A%84%E4%BA%8C%E5%88%86%E8%AB%96\">규제목적이분론\u003c/a>\u003c/strong>으로 나뉜다. \u003cstrong>\u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">소극목적\u003c/a>(경찰목적: 국민의 생명·건강에 대한 위해 방지) 규제\u003c/strong>에는 \u003cstrong>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">엄격한 합리성의 기준\u003c/a>\u003c/strong>(더 완만한 규제로는 목적을 달성할 수 없음을 요구)이, \u003cstrong>\u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">적극목적\u003c/a>(사회경제정책: 사회적·경제적 약자 보호) 규제\u003c/strong>에는 \u003cstrong>\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">명백성의 원칙\u003c/a>\u003c/strong>(현저히 불합리함이 명백한 경우에만 위헌)이 적용된다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>대상\u003c/th>\u003cth>심사 기준\u003c/th>\u003cth>합헌성 추정\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>정신적 자유\u003c/strong>（19·20·21·23조 등）\u003c/td>\u003ctd>표현의 자유, 사상·양심의 자유 등\u003c/td>\u003ctd>\u003cstrong>엄격한 기준\u003c/strong> — 명백하고 현재의 위험, LRA 기준, 사전억제 금지, 명확성의 요구\u003c/td>\u003ctd>\u003cstrong>배제\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>경제적 자유 — 소극목적\u003c/strong>\u003c/td>\u003ctd>생명·건강 보호를 위한 규제\u003c/td>\u003ctd>\u003cstrong>엄격한 합리성의 기준\u003c/strong>（보다 완만한 규제로 목적 달성 가능한지 심사）\u003c/td>\u003ctd>약하게 작용\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>경제적 자유 — 적극목적\u003c/strong>\u003c/td>\u003ctd>사회·경제 정책적 규제\u003c/td>\u003ctd>\u003cstrong>명백성의 원칙\u003c/strong>（현저히 불합리함이 명백한 경우만 위헌）\u003c/td>\u003ctd>강하게 작용\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限違憲判決\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설의 거리제한（22조 1항）\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 허가제는 직업의 자유에 대한 강력한 제한이므로 「중요한 공공의 이익을 위해 필요하고 합리적인 조치」여야 하며, \u003cstrong>소극목적 규제\u003c/strong>인 이상 「\u003cstrong>보다 완만한 규제로는 목적을 충분히 달성할 수 없다\u003c/strong>」고 인정되어야 한다\u003c/td>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 개설 허가의 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>적극목적(중소기업 보호)\u003c/strong> 규제로서 입법부의 정책적 재량이 넓으며, 「현저히 불합리함이 \u003cstrong>명백\u003c/strong>한 경우」에 한해 위헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>森林法共有林分割制限違憲判決\u003c/td>\u003ctd>最大判昭62.4.22 / 民集41巻3号408頁\u003c/td>\u003ctd>삼림법 186조의 공유물 분할청구 제한（29조）\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 규제 목적·필요성·제한 정도를 비교형량하여 목적과의 합리적 관련성·필요성을 부정\u003c/td>\u003c/tr>\u003ctr>\u003ctd>税関検査事件\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>세관에 의한 수입물 검사（21조 2항 검열）\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>（검열에는 해당하지 않음）. 다만 \u003cstrong>검열은 절대적으로 금지\u003c/strong>되며, 표현의 자유 규제 입법에는 \u003cstrong>명확성\u003c/strong>이 요구된다고 판시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件\u003c/td>\u003ctd>最大判昭61.6.11 / 民集40巻4号872頁\u003c/td>\u003ctd>명예훼손 기사에 대한 출판 사전 차단 가처분\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>（본건 한정）. 표현행위의 \u003cstrong>사전억제는 원칙적으로 허용되지 않으며\u003c/strong>, 예외는 내용이 진실이 아님이 명백하고 피해자가 중대·회복 곤란한 손해를 입을 우려가 있는 경우 등 \u003cstrong>엄격하고 명확한 요건\u003c/strong> 아래에서만\u003c/td>\u003c/tr>\u003ctr>\u003ctd>猿払事件\u003c/td>\u003ctd>最大判昭49.11.6 / 刑集28巻9号393頁\u003c/td>\u003ctd>공무원의 정치적 행위 금지（21조）\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 정신적 자유의 제한임에도 \u003cstrong>합리적 관련성의 기준\u003c/strong>이라는 완만한 심사를 적용 → \u003cstrong>「최고재는 이중의 기준론을 일관되게 채용하지 않는다」는 비판의 대표례\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>근거 2개는 반드시 세트로\u003c/strong>: ① \u003cstrong>민주정 과정의 회복 곤란성\u003c/strong>(주된 근거) ② \u003cstrong>재판소의 능력(정책 판단 능력의 한계)\u003c/strong>. 한쪽만 쓴 지문이나 「입법부의 민주적 정당성이 유일한 근거」라는 지문은 부정확.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「최고재는 이중의 기준론을 채용하고 있다」 → \u003cstrong>주의\u003c/strong>. 경제적 자유에서는 재량을 넓게 인정해 발상을 시사했지만, \u003cstrong>정신적 자유(猿払事件)에서는 오히려 완만한 기준을 써서 비판받는다\u003c/strong>. 「일관되게 채용」은 오답.\u003c/li>\u003cli>\u003cstrong>대비: 소극목적 = 薬事法 = 엄격한 합리성 = 위헌 ↔ 적극목적 = 小売市場 = 명백성의 원칙 = 합헌\u003c/strong>. 목적·기준·결론 3점 세트로 외우면 대부분의 지문을 잡을 수 있다.\u003c/li>\u003cli>방향을 뒤집은 함정 빈출: 「정신적 자유는 완만하게, 경제적 자유는 엄격하게」 → \u003cstrong>오답\u003c/strong>. 어느 쪽이 엄격한지 항상 확인하라.\u003c/li>\u003cli>\u003cstrong>연결 정리\u003c/strong>: 이중의 기준론 → 정신적 자유에서는 \u003ca href=\"#/e/%E5%90%88%E6%86%B2%E6%80%A7%E6%8E%A8%E5%AE%9A%E3%81%AE%E5%8E%9F%E5%89%87\">合憲性推定の原則\u003c/a>이 \u003cstrong>배제\u003c/strong>된다. 이 연결 자체가 자주 출제된다.\u003c/li>\u003cli>조세·재정 분야는 경제적 자유보다도 \u003cstrong>더 넓은 입법재량\u003c/strong>이 인정된다(\u003cspan>サラリーマン税金訴訟\u003c/span> 最大判昭60.3.27).\u003c/li>\u003c/ul>","search":"二重の基準論 にじゅうのきじゅんろん 항목 내용 ------ ------ 읽기 にじゅうのきじゅんろん（이중의 기준론） 과목 헌법（인권총론 — 위헌심사기준） 한줄 정의 정신적 자유 를 제한하는 입법은 엄격한 기준 으로, 경제적 자유 를 제한하는 입법은 완만한 기준 으로 합헌성을 심사해야 한다는 이론 통설·판례 통설 . 최고재는 이 이론을 정면으로 채용한다고 명언한 적은 없으나, 경제적 자유에서 넓은 입법재량을 인정하는 판시 薬事法·小売市場 로 그 발상을 시사 개념 公共の福祉 용어/公共の福祉.md 나 一元的内在制約説 용어/一元的内在制約説.md 만으로는 「이 법률이 위헌인가」를 판단할 수 없다. 그래서 인권의 종류에 따라 심사의 엄격도를 나누자 는 것이 이중의 기준론이다. 미국 연방대법원의 판례 united states v. carolene products 사건의 각주 4 에서 유래한다. 근거는 두 가지 이며, 시험에서는 이 두 근거를 정확히 쓸 수 있는지가 갈림길이다. ① 민주정 과정의 회복 곤란성（민주주의론적 근거 — 주된 근거） 표현의 자유 등 정신적 자유는 민주적 정치과정 그 자체를 지탱하는 권리 다. 이것이 부당하게 제한되면 국민은 잘못을 지적하고 다수파를 바꿀 수단을 잃게 되어, 선거를 통한 자기 회복이 불가능 해진다. 반면 경제적 자유의 규제가 잘못되었다면 국민은 여론과 선거로 입법부에 시정을 요구할 수 있다. 따라서 회복이 어려운 정신적 자유에 대해서는 재판소가 적극적으로 개입해야 한다. ② 재판소의 능력（기능론적 근거） 경제적 자유의 규제는 사회·경제 정책의 문제로서 복잡한 자료 수집과 전문적·정책적 판단을 요한다. 이는 입법부가 재판소보다 훨씬 잘할 수 있는 영역 이다. 재판소에는 그러한 정책 판단의 자료도 능력도 없으므로, 입법부의 재량을 존중해 심사를 완화해야 한다. 결과적으로 정신적 자유에서는 合憲性推定の原則 용어/合憲性推定の原則.md 이 배제 되어 국가 측이 규제의 합헌성을 논증해야 하고, 사전억제의 원칙적 금지·명확성의 요구·lra 보다 제한적이지 않은 다른 선택 수단 기준 등이 적용된다. 반면 경제적 자유에서는 합헌성 추정이 강하게 작용한다. 경제적 자유 내부는 다시 규제목적이분론 용어/規制目的二分論.md 으로 나뉜다. 소극목적 용어/消極目的規制.md 경찰목적: 국민의 생명·건강에 대한 위해 방지 규제 에는 엄격한 합리성의 기준 용어/厳格な合理性の基準.md 더 완만한 규제로는 목적을 달성할 수 없음을 요구 이, 적극목적 용어/積極目的規制.md 사회경제정책: 사회적·경제적 약자 보호 규제 에는 명백성의 원칙 용어/明白性の原則.md 현저히 불합리함이 명백한 경우에만 위헌 이 적용된다. 학설 구분 대상 심사 기준 합헌성 추정 ------ ------ ----------- ------------- 정신적 자유 （19·20·21·23조 등） 표현의 자유, 사상·양심의 자유 등 엄격한 기준 — 명백하고 현재의 위험, lra 기준, 사전억제 금지, 명확성의 요구 배제 경제적 자유 — 소극목적 생명·건강 보호를 위한 규제 엄격한 합리성의 기준 （보다 완만한 규제로 목적 달성 가능한지 심사） 약하게 작용 경제적 자유 — 적극목적 사회·경제 정책적 규제 명백성의 원칙 （현저히 불합리함이 명백한 경우만 위헌） 강하게 작용 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 薬事法距離制限違憲判決 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설의 거리제한（22조 1항） 위헌 . 허가제는 직업의 자유에 대한 강력한 제한이므로 「중요한 공공의 이익을 위해 필요하고 합리적인 조치」여야 하며, 소극목적 규제 인 이상 「 보다 완만한 규제로는 목적을 충분히 달성할 수 없다 」고 인정되어야 한다 小売市場距離制限事件 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 개설 허가의 거리제한 합헌 . 적극목적 중소기업 보호 규제로서 입법부의 정책적 재량이 넓으며, 「현저히 불합리함이 명백 한 경우」에 한해 위헌 森林法共有林分割制限違憲判決 最大判昭62.4.22 / 民集41巻3号408頁 삼림법 186조의 공유물 분할청구 제한（29조） 위헌 . 규제 목적·필요성·제한 정도를 비교형량하여 목적과의 합리적 관련성·필요성을 부정 税関検査事件 最大判昭59.12.12 / 民集38巻12号1308頁 세관에 의한 수입물 검사（21조 2항 검열） 합헌 （검열에는 해당하지 않음）. 다만 검열은 절대적으로 금지 되며, 표현의 자유 규제 입법에는 명확성 이 요구된다고 판시 北方ジャーナル事件 最大判昭61.6.11 / 民集40巻4号872頁 명예훼손 기사에 대한 출판 사전 차단 가처분 적법 （본건 한정）. 표현행위의 사전억제는 원칙적으로 허용되지 않으며 , 예외는 내용이 진실이 아님이 명백하고 피해자가 중대·회복 곤란한 손해를 입을 우려가 있는 경우 등 엄격하고 명확한 요건 아래에서만 猿払事件 最大判昭49.11.6 / 刑集28巻9号393頁 공무원의 정치적 행위 금지（21조） 합헌 . 정신적 자유의 제한임에도 합리적 관련성의 기준 이라는 완만한 심사를 적용 → 「최고재는 이중의 기준론을 일관되게 채용하지 않는다」는 비판의 대표례 💡 수험 팁 - 근거 2개는 반드시 세트로 : ① 민주정 과정의 회복 곤란성 주된 근거 ② 재판소의 능력 정책 판단 능력의 한계 . 한쪽만 쓴 지문이나 「입법부의 민주적 정당성이 유일한 근거」라는 지문은 부정확. - 최대 함정 : 「최고재는 이중의 기준론을 채용하고 있다」 → 주의 . 경제적 자유에서는 재량을 넓게 인정해 발상을 시사했지만, 정신적 자유 猿払事件 에서는 오히려 완만한 기준을 써서 비판받는다 . 「일관되게 채용」은 오답. - 대비: 소극목적 = 薬事法 = 엄격한 합리성 = 위헌 ↔ 적극목적 = 小売市場 = 명백성의 원칙 = 합헌 . 목적·기준·결론 3점 세트로 외우면 대부분의 지문을 잡을 수 있다. - 방향을 뒤집은 함정 빈출: 「정신적 자유는 완만하게, 경제적 자유는 엄격하게」 → 오답 . 어느 쪽이 엄격한지 항상 확인하라. - 연결 정리 : 이중의 기준론 → 정신적 자유에서는 合憲性推定の原則 용어/合憲性推定の原則.md 이 배제 된다. 이 연결 자체가 자주 출제된다. - 조세·재정 분야는 경제적 자유보다도 더 넓은 입법재량 이 인정된다 サラリーマン税金訴訟 헌법/サラリーマン税金訴訟.md 最大判昭60.3.27 ."},"合憲性推定の原則":{"type":"term","subject":"용어","id":"合憲性推定の原則","title":"合憲性推定の原則","sub":"ごうけんせいすいていのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>ごうけんせいすいていのげんそく（합헌성 추정의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（위헌심사기준 / 통치 — 위헌심사권）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>국회가 제정한 법률은 \u003cstrong>일단 합헌으로 추정\u003c/strong>되며, 위헌을 주장하는 측이 그 근거를 논증할 책임을 진다는 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>원칙적으로 타당하나, \u003cstrong>정신적 자유를 규제하는 입법에서는 추정이 배제된다\u003c/strong>（→ \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>법률은 \u003cstrong>국민의 대표기관인 국회\u003c/strong>(41조: 「국회는 국권의 최고기관이며, 국가의 유일한 입법기관」)가 민주적 절차를 거쳐 제정한 것이다. 또한 국회의원은 헌법 존중·옹호 의무를 지므로(99조), 국회는 스스로 합헌성을 판단하여 법률을 만들었다고 볼 수 있다. 이러한 \u003cstrong>민주적 정당성\u003c/strong>과 \u003cstrong>권력분립\u003c/strong>의 요청에서, 재판소가 위헌심사권(81조)을 행사할 때에도 법률을 일단 합헌으로 추정하고, 위헌을 주장하는 측이 그 불합리성을 논증해야 한다는 원칙이 도출된다.\u003c/p>\n\u003cp>실무상 이 원칙은 \u003cstrong>입증책임의 소재\u003c/strong>와 \u003cstrong>심사의 강도\u003c/strong> 두 면에서 작동한다. 합헌성 추정이 작용하면 ① 위헌을 주장하는 원고·피고인이 입증 부담을 지고, ② 재판소는 입법사실의 존재를 다투지 않고 \u003cstrong>입법부의 재량 판단을 존중\u003c/strong>한다. 경제적 자유·조세·사회보장 등 정책적 판단이 필요한 영역에서 「현저히 불합리함이 \u003cstrong>명백\u003c/strong>한 경우에 한해 위헌」이라는 \u003cstrong>명백성의 원칙\u003c/strong>이 나오는 것도 이 원칙의 극단적 형태다.\u003c/p>\n\u003cp>그러나 \u003cstrong>정신적 자유를 규제하는 입법에서는 이 추정이 배제된다\u003c/strong>. \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a>에 따르면, 정신적 자유가 침해되면 민주적 정치과정 자체가 손상되어 \u003cstrong>입법부의 자기 시정을 기대할 수 없다\u003c/strong>. 즉 「국회가 만들었으니 일단 믿는다」는 전제가 무너지는 것이다. 이 경우 \u003cstrong>국가 측이 규제의 합헌성(입법목적의 중요성과 수단의 필요성)을 논증해야 하며\u003c/strong>, 재판소는 입법사실에 스스로 들어가 엄격히 심사한다.\u003c/p>\n\u003cp>합헌성 추정이 배제되는 결과로 표현의 자유 영역에서는 다음 법리가 작동한다. \u003cstrong>① \u003ca href=\"#/e/%E4%BA%8B%E5%89%8D%E6%8A%91%E5%88%B6\">사전억제\u003c/a>의 원칙적 금지\u003c/strong>(북방저널 사건), \u003cstrong>② \u003ca href=\"#/e/%E6%A4%9C%E9%96%B2\">검열\u003c/a>의 절대적 금지\u003c/strong>(21조 2항, 세관검사 사건), \u003cstrong>③ \u003ca href=\"#/e/%E6%98%8E%E7%A2%BA%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">명확성의 원칙\u003c/a> — 막연하기 때문에 무효(漠然性ゆえに無効)의 법리\u003c/strong>(도쿠시마시 공안조례 사건), \u003cstrong>④ \u003ca href=\"#/e/%E9%81%8E%E5%BA%A6%E3%81%AE%E5%BA%83%E6%B1%8E%E6%80%A7%E3%81%AE%E6%B3%95%E7%90%86\">과도하게 광범위하기 때문에 무효의 법리\u003c/a>\u003c/strong>. 통상의 법률이라면 합헌한정해석으로 살려 두겠지만, 정신적 자유 규제에서는 \u003cstrong>불명확한 법률 그 자체가 \u003ca href=\"#/e/%E8%90%8E%E7%B8%AE%E7%9A%84%E5%8A%B9%E6%9E%9C\">위축효과\u003c/a>(chilling effect)를 낳으므로 문면상 무효\u003c/strong>로 할 수 있다는 것이다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매시장 거리제한（경제적 자유）\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 「입법부가 그 재량권을 일탈하여 규제가 \u003cstrong>현저히 불합리함이 명백\u003c/strong>한 경우에 한해 위헌」 → 합헌성 추정이 가장 강하게 작용한 예（\u003cstrong>명백성의 원칙\u003c/strong>）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cspan>サラリーマン税金訴訟\u003c/span>\u003c/td>\u003ctd>最大判昭60.3.27 / 民集39巻2号247頁\u003c/td>\u003ctd>급여소득 과세의 평등 위반 여부\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 조세법의 정립은 국가 재정·경제·사회정책 등의 종합적 판단을 요하므로 \u003cstrong>입법부의 정책적·기술적 판단에 맡겨진다\u003c/strong> → 「현저히 불합리함이 명백」한 경우에만 위헌\u003c/td>\u003c/tr>\u003ctr>\u003ctd>徳島市公安条例事件\u003c/td>\u003ctd>最大判昭50.9.10 / 刑集29巻8号489頁\u003c/td>\u003ctd>「교통질서를 유지할 것」이라는 조례 문언의 명확성\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 명확성 판단 기준을 제시: 「\u003cstrong>통상의 판단능력을 가진 일반인의 이해\u003c/strong>에서, 구체적 경우에 당해 행위가 그 적용을 받는지 여부의 판단을 가능하게 하는 기준이 읽히는가」\u003c/td>\u003c/tr>\u003ctr>\u003ctd>税関検査事件\u003c/td>\u003ctd>最大判昭59.12.12 / 民集38巻12号1308頁\u003c/td>\u003ctd>세관검사와 「풍속을 해할 서적」 문언\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>（검열 아님·한정해석으로 명확성 충족）. 다만 \u003cstrong>검열은 예외 없이 절대적으로 금지\u003c/strong>되며, 표현의 자유를 규제하는 법률에는 \u003cstrong>명확성이 요구된다\u003c/strong>고 판시\u003c/td>\u003c/tr>\u003ctr>\u003ctd>北方ジャーナル事件\u003c/td>\u003ctd>最大判昭61.6.11 / 民集40巻4号872頁\u003c/td>\u003ctd>출판물의 사전 차단 가처분\u003c/td>\u003ctd>\u003cstrong>적법\u003c/strong>（본건 한정）. \u003cstrong>사전억제는 원칙적으로 허용되지 않으며\u003c/strong> 엄격하고 명확한 요건 아래에서만 예외가 인정된다\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>한 문장 암기\u003c/strong>: 「법률은 합헌으로 추정된다. \u003cstrong>단, 정신적 자유를 규제하는 입법에서는 추정이 배제되어 국가 측이 합헌성을 논증한다.\u003c/strong>」 이 단서가 시험의 전부다.\u003c/li>\u003cli>\u003cstrong>최대 함정\u003c/strong>: 「모든 법률은 합헌으로 추정되므로 위헌을 주장하는 자가 언제나 입증책임을 진다」 → \u003cstrong>오답\u003c/strong>. 정신적 자유 규제에서는 배제된다.\u003c/li>\u003cli>근거 조문 정리: 추정의 근거는 \u003cstrong>41조(국회의 지위)·권력분립·민주적 정당성\u003c/strong>, 심사의 근거는 \u003cstrong>81조(위헌심사권)\u003c/strong>.\u003c/li>\u003cli>\u003cstrong>대비: 명백성의 원칙(경제적 자유 — 추정 강함) ↔ 명확성의 원칙(정신적 자유 — 추정 배제)\u003c/strong>. 이름이 비슷해 바꿔치기 함정이 자주 나온다. \u003cstrong>明白性 = 위헌이 「명백」해야 위헌 / 明確性 = 법률이 「명확」해야 합헌\u003c/strong>.\u003c/li>\u003cli>명확성 판단 기준의 키워드는 \u003cstrong>「통상의 판단능력을 가진 일반인의 이해」\u003c/strong>（徳島市公安条例事件）. 「법률 전문가의 이해」로 바꾼 지문은 오답.\u003c/li>\u003cli>\u003cstrong>연결 정리\u003c/strong>: \u003ca href=\"#/e/%E5%85%AC%E5%85%B1%E3%81%AE%E7%A6%8F%E7%A5%89\">公共の福祉\u003c/a> → \u003ca href=\"#/e/%E4%B8%80%E5%85%83%E7%9A%84%E5%86%85%E5%9C%A8%E5%88%B6%E7%B4%84%E8%AA%AC\">一元的内在制約説\u003c/a> → \u003ca href=\"#/e/%E4%BA%8C%E9%87%8D%E3%81%AE%E5%9F%BA%E6%BA%96%E8%AB%96\">二重の基準論\u003c/a> → 합헌성 추정의 배제 → 사전억제 금지·명확성의 원칙. 이 흐름 하나로 인권총론 후반이 정리된다.\u003c/li>\u003c/ul>","search":"合憲性推定の原則 ごうけんせいすいていのげんそく 항목 내용 ------ ------ 읽기 ごうけんせいすいていのげんそく（합헌성 추정의 원칙） 과목 헌법（위헌심사기준 / 통치 — 위헌심사권） 한줄 정의 국회가 제정한 법률은 일단 합헌으로 추정 되며, 위헌을 주장하는 측이 그 근거를 논증할 책임을 진다는 원칙 통설·판례 원칙적으로 타당하나, 정신적 자유를 규제하는 입법에서는 추정이 배제된다 （→ 二重の基準論 용어/二重の基準論.md ） 개념 법률은 국민의 대표기관인 국회 41조: 「국회는 국권의 최고기관이며, 국가의 유일한 입법기관」 가 민주적 절차를 거쳐 제정한 것이다. 또한 국회의원은 헌법 존중·옹호 의무를 지므로 99조 , 국회는 스스로 합헌성을 판단하여 법률을 만들었다고 볼 수 있다. 이러한 민주적 정당성 과 권력분립 의 요청에서, 재판소가 위헌심사권 81조 을 행사할 때에도 법률을 일단 합헌으로 추정하고, 위헌을 주장하는 측이 그 불합리성을 논증해야 한다는 원칙이 도출된다. 실무상 이 원칙은 입증책임의 소재 와 심사의 강도 두 면에서 작동한다. 합헌성 추정이 작용하면 ① 위헌을 주장하는 원고·피고인이 입증 부담을 지고, ② 재판소는 입법사실의 존재를 다투지 않고 입법부의 재량 판단을 존중 한다. 경제적 자유·조세·사회보장 등 정책적 판단이 필요한 영역에서 「현저히 불합리함이 명백 한 경우에 한해 위헌」이라는 명백성의 원칙 이 나오는 것도 이 원칙의 극단적 형태다. 그러나 정신적 자유를 규제하는 입법에서는 이 추정이 배제된다 . 二重の基準論 용어/二重の基準論.md 에 따르면, 정신적 자유가 침해되면 민주적 정치과정 자체가 손상되어 입법부의 자기 시정을 기대할 수 없다 . 즉 「국회가 만들었으니 일단 믿는다」는 전제가 무너지는 것이다. 이 경우 국가 측이 규제의 합헌성 입법목적의 중요성과 수단의 필요성 을 논증해야 하며 , 재판소는 입법사실에 스스로 들어가 엄격히 심사한다. 합헌성 추정이 배제되는 결과로 표현의 자유 영역에서는 다음 법리가 작동한다. ① 사전억제 용어/事前抑制.md 의 원칙적 금지 북방저널 사건 , ② 검열 용어/検閲.md 의 절대적 금지 21조 2항, 세관검사 사건 , ③ 명확성의 원칙 용어/明確性の原則.md — 막연하기 때문에 무효 漠然性ゆえに無効 의 법리 도쿠시마시 공안조례 사건 , ④ 과도하게 광범위하기 때문에 무효의 법리 용어/過度の広汎性の法理.md . 통상의 법률이라면 합헌한정해석으로 살려 두겠지만, 정신적 자유 규제에서는 불명확한 법률 그 자체가 위축효과 용어/萎縮的効果.md chilling effect 를 낳으므로 문면상 무효 로 할 수 있다는 것이다. 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 小売市場距離制限事件 最大判昭47.11.22 / 刑集26巻9号586頁 소매시장 거리제한（경제적 자유） 합헌 . 「입법부가 그 재량권을 일탈하여 규제가 현저히 불합리함이 명백 한 경우에 한해 위헌」 → 합헌성 추정이 가장 강하게 작용한 예（ 명백성의 원칙 ） サラリーマン税金訴訟 헌법/サラリーマン税金訴訟.md 最大判昭60.3.27 / 民集39巻2号247頁 급여소득 과세의 평등 위반 여부 합헌 . 조세법의 정립은 국가 재정·경제·사회정책 등의 종합적 판단을 요하므로 입법부의 정책적·기술적 판단에 맡겨진다 → 「현저히 불합리함이 명백」한 경우에만 위헌 徳島市公安条例事件 最大判昭50.9.10 / 刑集29巻8号489頁 「교통질서를 유지할 것」이라는 조례 문언의 명확성 합헌 . 명확성 판단 기준을 제시: 「 통상의 판단능력을 가진 일반인의 이해 에서, 구체적 경우에 당해 행위가 그 적용을 받는지 여부의 판단을 가능하게 하는 기준이 읽히는가」 税関検査事件 最大判昭59.12.12 / 民集38巻12号1308頁 세관검사와 「풍속을 해할 서적」 문언 합헌 （검열 아님·한정해석으로 명확성 충족）. 다만 검열은 예외 없이 절대적으로 금지 되며, 표현의 자유를 규제하는 법률에는 명확성이 요구된다 고 판시 北方ジャーナル事件 最大判昭61.6.11 / 民集40巻4号872頁 출판물의 사전 차단 가처분 적법 （본건 한정）. 사전억제는 원칙적으로 허용되지 않으며 엄격하고 명확한 요건 아래에서만 예외가 인정된다 💡 수험 팁 - 한 문장 암기 : 「법률은 합헌으로 추정된다. 단, 정신적 자유를 규제하는 입법에서는 추정이 배제되어 국가 측이 합헌성을 논증한다. 」 이 단서가 시험의 전부다. - 최대 함정 : 「모든 법률은 합헌으로 추정되므로 위헌을 주장하는 자가 언제나 입증책임을 진다」 → 오답 . 정신적 자유 규제에서는 배제된다. - 근거 조문 정리: 추정의 근거는 41조 국회의 지위 ·권력분립·민주적 정당성 , 심사의 근거는 81조 위헌심사권 . - 대비: 명백성의 원칙 경제적 자유 — 추정 강함 ↔ 명확성의 원칙 정신적 자유 — 추정 배제 . 이름이 비슷해 바꿔치기 함정이 자주 나온다. 明白性 = 위헌이 「명백」해야 위헌 / 明確性 = 법률이 「명확」해야 합헌 . - 명확성 판단 기준의 키워드는 「통상의 판단능력을 가진 일반인의 이해」 （徳島市公安条例事件）. 「법률 전문가의 이해」로 바꾼 지문은 오답. - 연결 정리 : 公共の福祉 용어/公共の福祉.md → 一元的内在制約説 용어/一元的内在制約説.md → 二重の基準論 용어/二重の基準論.md → 합헌성 추정의 배제 → 사전억제 금지·명확성의 원칙. 이 흐름 하나로 인권총론 후반이 정리된다."},"規制目的二分論":{"type":"term","subject":"용어","id":"規制目的二分論","title":"規制目的二分論","sub":"きせいもくてきにぶんろん","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>きせいもくてきにぶんろん（규제목적 이분론）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（경제적 자유권·위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>경제적 자유에 대한 규제를 \u003cstrong>소극목적(폐해 방지)\u003c/strong>과 \u003cstrong>적극목적(사회정책)\u003c/strong>으로 나누어, 각각 다른 강도의 심사기준을 적용하는 이론\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>학설상 유력하고 수험 도식으로 정착. 다만 \u003cstrong>최고재가 일반 법리로 선언한 적은 없고, 이 틀을 쓰지 않은 판결도 많다\u003c/strong>（酒類販売免許制事件 등）\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>헌법 22조 1항(직업선택의 자유)과 29조(재산권)가 보장하는 \u003cstrong>경제적 자유\u003c/strong>는, 정신적 자유에 비해 완만한 기준으로 심사된다는 것이 이중의 기준론(二重の基準論)이다. 이유는 두 가지다. ① 경제적 자유의 제한은 민주적 정치과정을 통해 시정할 수 있으므로 법원이 나설 필요가 적다. ② 사회경제 정책은 전문기술적·정책적 판단을 요하므로 법원의 판단능력이 미치기 어렵다.\u003c/p>\n\u003cp>規制目的二分論은 그 \u003cstrong>경제적 자유 안에서 다시 한 번 나누는\u003c/strong> 이론이다. 규제의 목적이 무엇이냐에 따라 심사 강도를 달리한다.\u003c/p>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>구분\u003c/th>\u003cth>목적\u003c/th>\u003cth>심사기준\u003c/th>\u003cth>대표 판례\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a>\u003c/td>\u003ctd>생명·건강·안전에 대한 위해 방지（경찰목적）\u003c/td>\u003ctd>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>\u003c/td>\u003ctd>薬事法距離制限事件\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>\u003c/td>\u003ctd>사회경제적 약자 보호·조화로운 경제 발전（정책목적）\u003c/td>\u003ctd>\u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>\u003c/td>\u003ctd>小売市場距離制限事件\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003cp>논리는 이렇다. 소극목적은 「무엇이 위험한가」라는 \u003cstrong>사실적·과학적 판단\u003c/strong>이므로 법원도 검증할 수 있다 → 비교적 엄격히 본다. 반면 적극목적은 「어떤 사회를 만들 것인가」라는 \u003cstrong>정책적 판단\u003c/strong>이므로 입법부의 재량을 존중한다 → 현저히 불합리함이 명백할 때만 위헌으로 한다.\u003c/p>\n\u003cp>이 도식은 어디까지나 小売市場(最大判昭47.11.22)과 薬事法(最大判昭50.4.30) 두 대법정 판결을 학설이 \u003cstrong>사후에 정리해 낸 것\u003c/strong>이며, 최고재가 「모든 경제규제는 두 목적 중 하나에 속한다」고 판시한 일은 없다. 실제로 규제 목적은 복합적인 경우가 많고, 어느 쪽으로도 분류하기 어려운 규제도 있다. 그래서 최고재는 사안에 따라 이분론을 쓰기도 하고 쓰지 않기도 한다. 이 「\u003cstrong>판례가 항상 이분론을 쓰지는 않는다\u003c/strong>」는 점이 시험에서 가장 자주 노려지는 지점이다.\u003c/p>\n\u003cp>이분론을 쓰지 않은 대표 사례가 \u003cstrong>酒類販売免許制事件\u003c/strong>(最三小判平4.12.15)이다. 주류 판매 면허제의 목적은 주세(酒税)의 확실한 징수와 소비자에게의 원활한 전가라는 \u003cstrong>재정목적\u003c/strong>이어서 소극·적극 어느 쪽에도 딱 들어맞지 않는다. 최고재는 「조세의 부과징수에 관한 입법은 조세법의 정립에 관한 국회의 재량적 판단을 존중해야 한다」는 별도의 논리로 합헌 판단을 내렸다. \u003cstrong>森林法共有林事件\u003c/strong>(最大判昭62.4.22) 역시 목적을 소극·적극으로 명시적으로 분류하지 않은 채 수단의 합리성·필요성을 검토해 위헌 결론에 이르렀다.\u003c/p>\n\u003ch2>학설\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>학설\u003c/th>\u003cth>내용\u003c/th>\u003cth>비고\u003c/th>\u003c/tr>\u003ctr>\u003ctd>\u003cstrong>이분론 지지설\u003c/strong>\u003c/td>\u003ctd>규제 목적에 따라 법원의 심사능력이 다르므로, 소극목적은 엄격한 합리성, 적극목적은 명백성의 원칙으로 나누는 것이 합리적\u003c/td>\u003ctd>통설적 수험 도식. 小売市場·薬事法 두 판결의 정합적 설명\u003c/td>\u003c/tr>\u003ctr>\u003ctd>이분론 비판설（다원설）\u003c/td>\u003ctd>현실의 규제 목적은 \u003cstrong>복합적\u003c/strong>이며 이분법은 자의적이다. 목적보다 규제의 \u003cstrong>강도\u003c/strong>(허가제냐 신고제냐, 직업선택의 자유냐 직업수행의 자유냐)나 \u003cstrong>규제 대상\u003c/strong>을 기준으로 심사 강도를 정해야 한다\u003c/td>\u003ctd>유력. 公衆浴場·酒類販売 등 설명이 곤란한 판례가 근거\u003c/td>\u003c/tr>\u003ctr>\u003ctd>판례의 실제\u003c/td>\u003ctd>최고재는 이분론을 일반 법리로 선언한 적이 없고, \u003cstrong>개별 사안마다 규제의 목적·필요성·내용·제한의 정도를 종합 형량\u003c/strong>한다\u003c/td>\u003ctd>👉 「판례는 이분론을 채택했다」는 단정적 지문은 위험\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件（소매시장 거리제한）\u003c/td>\u003ctd>最大判昭47.11.22 / 刑集26巻9号586頁\u003c/td>\u003ctd>소매상업조정특별조치법상 소매시장 개설 허가에 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 중소기업 보호라는 \u003cstrong>적극목적\u003c/strong> → 명백성의 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>薬事法距離制限事件（약사법 거리제한）\u003c/td>\u003ctd>最大判昭50.4.30 / 民集29巻4号572頁\u003c/td>\u003ctd>약국 개설 허가에 적정배치(거리제한) 요건\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>. 불량의약품 방지라는 \u003cstrong>소극목적\u003c/strong> → 엄격한 합리성. 입법사실이 뒷받침되지 않음\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（구 판결）\u003c/td>\u003ctd>最大判昭30.1.26 / 刑集9巻1号89頁\u003c/td>\u003ctd>공중목욕탕 거리제한\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 난립에 따른 경영 불안정과 위생 저하 방지（목적 분류 이전의 판결）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（신 판결）\u003c/td>\u003ctd>最二小判平元.1.20 / 刑集43巻1号1頁\u003c/td>\u003ctd>후쿠오카현 조례의 거리제한(도시부 250m 등)\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 주민의 일상생활에 불가결한 시설의 확보라는 \u003cstrong>적극목적\u003c/strong> → 명백성의 원칙\u003c/td>\u003c/tr>\u003ctr>\u003ctd>公衆浴場距離制限事件（같은 해 별건）\u003c/td>\u003ctd>最三小判平元.3.7 / 判時1308号111頁\u003c/td>\u003ctd>위와 같은 규제의 합헌성\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 다만 위생 확보(소극)와 시설 확보(적극)를 \u003cstrong>함께\u003c/strong> 들어, 목적이 복합적임을 보여 준 예\u003c/td>\u003c/tr>\u003ctr>\u003ctd>酒類販売免許制事件（주류 판매 면허제）\u003c/td>\u003ctd>最三小判平4.12.15 / 民集46巻9号2829頁\u003c/td>\u003ctd>주세법상 주류 판매업 면허제와 면허 거부 처분\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. \u003cstrong>이분론에 의하지 않고\u003c/strong> 조세 정립에 관한 입법재량 존중이라는 별도 논리\u003c/td>\u003c/tr>\u003ctr>\u003ctd>森林法共有林事件（삼림법 공유림）\u003c/td>\u003ctd>最大判昭62.4.22 / 民集41巻3号408頁\u003c/td>\u003ctd>지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조\u003c/td>\u003ctd>\u003cstrong>위헌\u003c/strong>（29조 2항）. 목적을 소극·적극으로 분류하지 않고 수단의 합리성·필요성을 심사\u003c/td>\u003c/tr>\u003ctr>\u003ctd>西陣ネクタイ事件（니시진 넥타이）\u003c/td>\u003ctd>最三小判平2.2.6\u003c/td>\u003ctd>생사(生糸) 일원 수입 조치로 국내 직물업자가 손해\u003c/td>\u003ctd>\u003cstrong>합헌\u003c/strong>. 소매시장 판결을 인용한 \u003cstrong>적극목적\u003c/strong> 판단\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>💡 수험 팁\u003c/h2>\n\u003cul>\u003cli>\u003cstrong>암기 축\u003c/strong>: 「\u003cstrong>消極=薬事法=違憲 / 積極=小売市場=合憲\u003c/strong>」. 이 네 쌍만 확실히 붙여 두면 대부분의 지문이 풀린다. 소극인데 합헌, 적극인데 위헌으로 뒤바꾼 지문이 단골 함정이다.\u003c/li>\u003cli>「최고재는 \u003cstrong>경제적 자유 규제를 항상 규제목적 이분론으로 심사한다\u003c/strong>」는 지문은 \u003cstrong>오답\u003c/strong>. 酒類販売免許制事件(最三小判平4.12.15)처럼 이분론을 쓰지 않은 판례가 있다는 점을 세트로 기억하라.\u003c/li>\u003cli>公衆浴場은 \u003cstrong>같은 규제인데 시기에 따라 이유가 바뀐\u003c/strong> 희귀 사례다. 昭30(위생·경영 안정) → 平元.1.20(적극목적) → 平元.3.7(소극+적극 병존). 결론은 \u003cstrong>전부 합헌\u003c/strong>이라는 점만은 흔들리지 않는다.\u003c/li>\u003cli>대비: \u003cstrong>\u003ca href=\"#/e/%E6%B6%88%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">消極目的規制\u003c/a> ↔ \u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>\u003c/strong> / \u003cstrong>\u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a> ↔ \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>\u003c/strong>. 목적과 기준을 엇갈리게 짝지은 선택지를 조심할 것.\u003c/li>\u003cli>심사 강도 서열은 \u003cstrong>\u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a>·엄격심사(정신적 자유) &gt; \u003ca href=\"#/e/%E5%8E%B3%E6%A0%BC%E3%81%AA%E5%90%88%E7%90%86%E6%80%A7%E3%81%AE%E5%9F%BA%E6%BA%96\">厳格な合理性の基準\u003c/a>(소극목적) &gt; \u003ca href=\"#/e/%E6%98%8E%E7%99%BD%E6%80%A7%E3%81%AE%E5%8E%9F%E5%89%87\">明白性の原則\u003c/a>(적극목적)\u003c/strong> 순. 이분론은 이 서열의 \u003cstrong>아랫부분(경제적 자유) 안에서만\u003c/strong> 작동하는 이론이다.\u003c/li>\u003cli>이분론은 \u003cstrong>경제적 자유(22조·29조)의 이야기\u003c/strong>다. 표현의 자유나 종교의 자유 사안에 「소극목적이므로 엄격한 합리성으로」라고 쓴 지문은 영역 자체가 틀린 것이다.\u003c/li>\u003c/ul>","search":"規制目的二分論 きせいもくてきにぶんろん 항목 내용 ------ ------ 읽기 きせいもくてきにぶんろん（규제목적 이분론） 과목 헌법（경제적 자유권·위헌심사기준） 한줄 정의 경제적 자유에 대한 규제를 소극목적 폐해 방지 과 적극목적 사회정책 으로 나누어, 각각 다른 강도의 심사기준을 적용하는 이론 통설·판례 학설상 유력하고 수험 도식으로 정착. 다만 최고재가 일반 법리로 선언한 적은 없고, 이 틀을 쓰지 않은 판결도 많다 （酒類販売免許制事件 등） 개념 헌법 22조 1항 직업선택의 자유 과 29조 재산권 가 보장하는 경제적 자유 는, 정신적 자유에 비해 완만한 기준으로 심사된다는 것이 이중의 기준론 二重の基準論 이다. 이유는 두 가지다. ① 경제적 자유의 제한은 민주적 정치과정을 통해 시정할 수 있으므로 법원이 나설 필요가 적다. ② 사회경제 정책은 전문기술적·정책적 판단을 요하므로 법원의 판단능력이 미치기 어렵다. 規制目的二分論은 그 경제적 자유 안에서 다시 한 번 나누는 이론이다. 규제의 목적이 무엇이냐에 따라 심사 강도를 달리한다. 구분 목적 심사기준 대표 판례 결론 ------ ------ ---------- ----------- ------ 消極目的規制 용어/消極目的規制.md 생명·건강·안전에 대한 위해 방지（경찰목적） 厳格な合理性の基準 용어/厳格な合理性の基準.md 薬事法距離制限事件 위헌 積極目的規制 용어/積極目的規制.md 사회경제적 약자 보호·조화로운 경제 발전（정책목적） 明白性の原則 용어/明白性の原則.md 小売市場距離制限事件 합헌 논리는 이렇다. 소극목적은 「무엇이 위험한가」라는 사실적·과학적 판단 이므로 법원도 검증할 수 있다 → 비교적 엄격히 본다. 반면 적극목적은 「어떤 사회를 만들 것인가」라는 정책적 판단 이므로 입법부의 재량을 존중한다 → 현저히 불합리함이 명백할 때만 위헌으로 한다. 이 도식은 어디까지나 小売市場 最大判昭47.11.22 과 薬事法 最大判昭50.4.30 두 대법정 판결을 학설이 사후에 정리해 낸 것 이며, 최고재가 「모든 경제규제는 두 목적 중 하나에 속한다」고 판시한 일은 없다. 실제로 규제 목적은 복합적인 경우가 많고, 어느 쪽으로도 분류하기 어려운 규제도 있다. 그래서 최고재는 사안에 따라 이분론을 쓰기도 하고 쓰지 않기도 한다. 이 「 판례가 항상 이분론을 쓰지는 않는다 」는 점이 시험에서 가장 자주 노려지는 지점이다. 이분론을 쓰지 않은 대표 사례가 酒類販売免許制事件 最三小判平4.12.15 이다. 주류 판매 면허제의 목적은 주세 酒税 의 확실한 징수와 소비자에게의 원활한 전가라는 재정목적 이어서 소극·적극 어느 쪽에도 딱 들어맞지 않는다. 최고재는 「조세의 부과징수에 관한 입법은 조세법의 정립에 관한 국회의 재량적 판단을 존중해야 한다」는 별도의 논리로 합헌 판단을 내렸다. 森林法共有林事件 最大判昭62.4.22 역시 목적을 소극·적극으로 명시적으로 분류하지 않은 채 수단의 합리성·필요성을 검토해 위헌 결론에 이르렀다. 학설 학설 내용 비고 ------ ------ ------ 이분론 지지설 규제 목적에 따라 법원의 심사능력이 다르므로, 소극목적은 엄격한 합리성, 적극목적은 명백성의 원칙으로 나누는 것이 합리적 통설적 수험 도식. 小売市場·薬事法 두 판결의 정합적 설명 이분론 비판설（다원설） 현실의 규제 목적은 복합적 이며 이분법은 자의적이다. 목적보다 규제의 강도 허가제냐 신고제냐, 직업선택의 자유냐 직업수행의 자유냐 나 규제 대상 을 기준으로 심사 강도를 정해야 한다 유력. 公衆浴場·酒類販売 등 설명이 곤란한 판례가 근거 판례의 실제 최고재는 이분론을 일반 법리로 선언한 적이 없고, 개별 사안마다 규제의 목적·필요성·내용·제한의 정도를 종합 형량 한다 👉 「판례는 이분론을 채택했다」는 단정적 지문은 위험 관련 판례 판례 인용 사안 결론 ------ ------ ------ ------ 小売市場距離制限事件（소매시장 거리제한） 最大判昭47.11.22 / 刑集26巻9号586頁 소매상업조정특별조치법상 소매시장 개설 허가에 거리제한 합헌 . 중소기업 보호라는 적극목적 → 명백성의 원칙 薬事法距離制限事件（약사법 거리제한） 最大判昭50.4.30 / 民集29巻4号572頁 약국 개설 허가에 적정배치 거리제한 요건 위헌 . 불량의약품 방지라는 소극목적 → 엄격한 합리성. 입법사실이 뒷받침되지 않음 公衆浴場距離制限事件（구 판결） 最大判昭30.1.26 / 刑集9巻1号89頁 공중목욕탕 거리제한 합헌 . 난립에 따른 경영 불안정과 위생 저하 방지（목적 분류 이전의 판결） 公衆浴場距離制限事件（신 판결） 最二小判平元.1.20 / 刑集43巻1号1頁 후쿠오카현 조례의 거리제한 도시부 250m 등 합헌 . 주민의 일상생활에 불가결한 시설의 확보라는 적극목적 → 명백성의 원칙 公衆浴場距離制限事件（같은 해 별건） 最三小判平元.3.7 / 判時1308号111頁 위와 같은 규제의 합헌성 합헌 . 다만 위생 확보 소극 와 시설 확보 적극 를 함께 들어, 목적이 복합적임을 보여 준 예 酒類販売免許制事件（주류 판매 면허제） 最三小判平4.12.15 / 民集46巻9号2829頁 주세법상 주류 판매업 면허제와 면허 거부 처분 합헌 . 이분론에 의하지 않고 조세 정립에 관한 입법재량 존중이라는 별도 논리 森林法共有林事件（삼림법 공유림） 最大判昭62.4.22 / 民集41巻3号408頁 지분 1/2 이하 공유자의 분할청구를 금지한 삼림법 186조 위헌 （29조 2항）. 목적을 소극·적극으로 분류하지 않고 수단의 합리성·필요성을 심사 西陣ネクタイ事件（니시진 넥타이） 最三小判平2.2.6 생사 生糸 일원 수입 조치로 국내 직물업자가 손해 합헌 . 소매시장 판결을 인용한 적극목적 판단 💡 수험 팁 - 암기 축 : 「 消極=薬事法=違憲 / 積極=小売市場=合憲 」. 이 네 쌍만 확실히 붙여 두면 대부분의 지문이 풀린다. 소극인데 합헌, 적극인데 위헌으로 뒤바꾼 지문이 단골 함정이다. - 「최고재는 경제적 자유 규제를 항상 규제목적 이분론으로 심사한다 」는 지문은 오답 . 酒類販売免許制事件 最三小判平4.12.15 처럼 이분론을 쓰지 않은 판례가 있다는 점을 세트로 기억하라. - 公衆浴場은 같은 규제인데 시기에 따라 이유가 바뀐 희귀 사례다. 昭30 위생·경영 안정 → 平元.1.20 적극목적 → 平元.3.7 소극+적극 병존 . 결론은 전부 합헌 이라는 점만은 흔들리지 않는다. - 대비: 消極目的規制 용어/消極目的規制.md ↔ 積極目的規制 용어/積極目的規制.md / 厳格な合理性の基準 용어/厳格な合理性の基準.md ↔ 明白性の原則 용어/明白性の原則.md . 목적과 기준을 엇갈리게 짝지은 선택지를 조심할 것. - 심사 강도 서열은 lra基準 용어/lra基準.md ·엄격심사 정신적 자유 厳格な合理性の基準 용어/厳格な合理性の基準.md 소극목적 明白性の原則 용어/明白性の原則.md 적극목적 순. 이분론은 이 서열의 아랫부분 경제적 자유 안에서만 작동하는 이론이다. - 이분론은 경제적 자유 22조·29조 의 이야기 다. 표현의 자유나 종교의 자유 사안에 「소극목적이므로 엄격한 합리성으로」라고 쓴 지문은 영역 자체가 틀린 것이다."},"明白性の原則":{"type":"term","subject":"용어","id":"明白性の原則","title":"明白性の原則","sub":"めいはくせいのげんそく","chip":null,"html":"\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>항목\u003c/th>\u003cth>내용\u003c/th>\u003c/tr>\u003ctr>\u003ctd>읽기\u003c/td>\u003ctd>めいはくせいのげんそく（명백성의 원칙）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>과목\u003c/td>\u003ctd>헌법（위헌심사기준）\u003c/td>\u003c/tr>\u003ctr>\u003ctd>한줄 정의\u003c/td>\u003ctd>입법부의 재량적 판단을 존중하여, 당해 규제조치가 \u003cstrong>현저히 불합리한 것이 명백한 경우에 한해\u003c/strong> 위헌으로 하는 가장 완만한 심사기준\u003c/td>\u003c/tr>\u003ctr>\u003ctd>통설·판례\u003c/td>\u003ctd>\u003ca href=\"#/e/%E7%A9%8D%E6%A5%B5%E7%9B%AE%E7%9A%84%E8%A6%8F%E5%88%B6\">積極目的規制\u003c/a>와 사회보장 입법에 적용. 小売市場距離制限事件(最大判昭47.11.22)이 정식화\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\u003ch2>개념\u003c/h2>\n\u003cp>\u003cstrong>明白性の原則\u003c/strong>(明白の原則이라고도 한다)은 위헌심사기준 중 \u003cstrong>가장 완만한\u003c/strong> 기준이다. 법원은 규제의 당부를 스스로 판단하지 않고, 국회의 판단이 「\u003cstrong>현저히 불합리한 것이 명백\u003c/strong>」한 경우에만 위헌으로 한다. 바꿔 말하면 \u003cstrong>합헌성 추정(合憲性推定)이 매우 강하게 작동\u003c/strong>하며, 이 기준이 적용되는 순간 결론은 사실상 합헌으로 기운다.\u003c/p>\n\u003cp>정식화한 것이 \u003cstrong>小売市場距離制限事件\u003c/strong>(最大判昭47.11.22)이다. 「개인의 경제활동에 대한 법적 규제조치에 관해서는, 국회의 재량적 판단을 존중하는 것을 원칙으로 하고, 재판소는 입법부가 그 재량권을 일탈하여 당해 법적 규제조치가 현저히 불합리한 것이 명백한 경우에 한하여 이를 위헌으로 한다」는 판시가 그것이다.\u003c/p>\n\u003cp>적용 국면은 크게 둘이다. ① \u003cstrong>적극목적의 경제규제\u003c/strong>(헌법 22조 1항·29조) — 사회경제 정책의 당부는 국회가 정할 일이라는 이유. ② \u003cstrong>사회보장 입법\u003c/strong>(헌법 25조) — 「건강하고 문화적인 최저한도의 생활」이라는 추상적 개념의 구체화는 국회의 광범한 재량에 맡겨져 있다는 이유. 堀木訴訟(最大判昭57.7.7)은 아동부양수당과 장애복지연금의 병급조정 규정을 두고, 25조의 구체화는 입법부의 광범한 재량에 위임되어 있으며 그것이 \u003cstrong>현저히 합리성을 결여하여 명백히 재량의 일탈·남용이라고 볼 수밖에 없는 경우\u003c/strong>를 제외하고는 사법심사의 대상이 되지 않는다고 하여 합헌으로 판단했다.\u003c/p>\n\u003cp>근거가 되는 사고는 \u003cstrong>이중의 기준론(二重の基準論)\u003c/strong>이다. 경제적 자유에 대한 규제는 민주적 정치과정을 통해 시정할 수 있고, 정책적·전문기술적 판단을 요하므로 법원이 나설 필요와 능력이 모두 적다. 반대로 정신적 자유(특히 표현의 자유)는 정치과정 자체를 지탱하는 권리여서 일단 봉쇄되면 민주적 시정이 불가능하므로, 그쪽에는 \u003ca href=\"#/e/LRA%E5%9F%BA%E6%BA%96\">LRA基準\u003c/a> 같은 훨씬 엄격한 기준이 요구된다.\u003c/p>\n\u003ch2>관련 판례\u003c/h2>\n\u003cdiv class=\"tblwrap\">\u003ctable>\u003ctr>\u003cth>판례\u003c/th>\u003cth>인용\u003c/th>\u003cth>사안\u003c/th>\u003cth>결론\u003c/th>\u003c/tr>\u003ctr>\u003ctd>小売市場距離制限事件（소매시장 거리
