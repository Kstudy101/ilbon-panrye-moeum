 선고 2009다19864 남성에게는 심사 없이 총회원 자격을 주면서 여성은 성별만을 이유로 자격 심사에서 원천 배제 상고기각 → 여성 승소 확정 . 평등권 침해가 민법 750조를 통해 인격적 법익 침해로 구체화. 위자료 각 1,000만원 종중 여성 종원 사건 대법원 2005.7.21. 선고 2002다1178 전합 성년 남자만 종중 구성원으로 보던 관습법 파기환송 . 변화된 전체 법질서에 부합하지 않아 관습법의 효력 부정（원칙적 장래효, 당해 사건은 소급 적용） 청담공원 골프연습장 사건 대법원 1995.5.23.자 94마2218 결정 헌법상 환경권을 직접 근거로 공사금지 가처분 신청 재항고 기각 . 환경권 규정만으로는 개개 국민에게 직접 구체적 사법상 권리를 부여한 것이 아님 서울ymca 사건은 위 2008다38288의 간접적용 법리를 그대로 원용하면서 다음을 판시했다. 사적 단체를 포함하여 사회공동체 내에서 개인이 성별에 따른 불합리한 차별을 받지 아니하는 것은 … 인격권 실현의 본질적 부분에 해당하므로 평등권이라는 기본권의 침해도 민법 제750조의 일반규정을 통하여 사법상 보호되는 인격적 법익침해의 형태로 구체화되어 논하여질 수 있다 일본과의 비교 논점 일본 한국 ------ ------ ------ 기본 입장 간접적용설 （三菱樹脂事件 最大判昭48.12.12） 간접적용설 （2008다38288 전합） — 동일 매개 조항 民法 90조（공서양속）, 709조（불법행위）, 1조 민법 103조（공서양속）, 750조·751조（불법행위）, 2조 — 구조 동일 성차별 사안의 처리 日産自動車事件 （最判昭56.3.24）: 남녀 정년 차등 취업규칙을 민법 90조 위반으로 무효 서울ymca 사건 : 민법 750조 불법행위 손해배상 으로 구제 사립학교 사안의 처리 昭和女子大事件 （最判昭49.7.19）: 사립대의 자율성 존중 → 학교 승소 대광고 사건 : 종교교육 강제의 한계 초과 인정 → 학생 승소 위법성 기준 「사회통념상 현저히 타당성을 잃었는지」 「사회공동체의 건전한 상식과 법감정에 비추어 용인될 수 있는 한계를 초과했는지」 비교 포인트 - 총론 간접적용설·매개 조항 은 한일이 거의 동일하다. 일본 민법 90조 ↔ 한국 민법 103조, 일본 709조 ↔ 한국 750조가 대응한다. - 차이는 구제 경로 다. 일본 日産自動車는 공서양속 위반으로 취업규칙 자체를 무효 로 만든 반면, 한국 서울ymca는 불법행위 손해배상 으로 갔다. 「무효 확인이냐 금전배상이냐」가 좋은 대비 소재. - 사립학교의 자율성 국면에서는 결론이 갈린다. 일본 昭和女子大는 학교의 자율성을 우선했고, 한국 대광고는 학생의 종교의 자유를 우선했다. 다만 대광고는 추첨 배정 학교 선택의 자유가 없음 이라는 사정이 결정적이었다는 점에 유의. - 한국 헌법재판소가 대사인효를 정면으로 판시한 대표 결정은 확인되지 않는다. 헌재 차원에서는 국가의 기본권보호의무 법리 기본권 3각관계 로 접근하는 것으로 설명된다. 원문·참고 - casenote: 대법원 2010.4.22. 선고 2008다38288 전원합의체 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2008%eb%8b%a438288 - 국가법령정보센터: 2008다38288 https://www.law.go.kr/lsw/precinfop.do?mode=0&evtno=2008%eb%8b%a438288 - casenote: 대법원 2011.1.27. 선고 2009다19864 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2009%eb%8b%a419864 - 대법원 판례속보: 2009다19864 https://scourt.go.kr/portal/news/newsviewaction.work?gubun=4&seqnum=3013 - casenote: 대법원 2005.7.21. 선고 2002다1178 전원합의체 판결 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/2002%eb%8b%a41178 - casenote: 대법원 1995.5.23.자 94마2218 결정 https://casenote.kr/%eb%8c%80%eb%b2%95%ec%9b%90/94%eb%a7%882218 미확인 사항: 대광고 사건 환송심 판결의 확정 일자, 서울ymca 사건 원고 수 38명 ·위자료 액수는 2차 요약에서 확인한 것으로 인용 시 원문 재확인 필요."}}};
const FLAT = DATA.groups.flatMap(g => g.items);

const $nav = document.getElementById('nav');
const $page = document.getElementById('page');
const $search = document.getElementById('search');
const $sidebar = document.getElementById('sidebar');
const $scrim = document.getElementById('scrim');
const $menuBtn = document.getElementById('menuBtn');

function currentId(){
  const h = location.hash;
  if (h.startsWith('#/e/')) {
    try { return decodeURIComponent(h.slice(4)); } catch { return null; }
  }
  return null;
}

function chipHtml(chip){
  return chip ? '<span class="chip ' + chip.cls + '">' + chip.label + '</span>' : '';
}

function renderNav(){
  const q = $search.value.trim().toLowerCase();
  const cur = currentId();
  let html = '';
  let any = false;
  for (const g of DATA.groups){
    const items = g.items.filter(id => {
      if (!q) return true;
      return DATA.entries[id].search.includes(q);
    });
    if (!items.length) continue;
    any = true;
    html += '<div class="nav-group"><h2>' + g.name + ' · ' + items.length + '</h2>';
    for (const id of items){
      const e = DATA.entries[id];
      html += '<a class="nav-item" href="#/e/' + encodeURIComponent(id) + '"' +
        (id === cur ? ' aria-current="page"' : '') + '>' +
        '<span class="t">' + e.title + '</span>' +
        '<span class="s">' + (e.sub || '') + chipHtml(e.chip) + '</span></a>';
    }
    html += '</div>';
  }
  $nav.innerHTML = any ? html : '<div class="no-result">검색 결과가 없습니다.</div>';
}

function renderCover(){
  const nCases = 22, nTerms = 1, nKr = 1;
  let toc = '';
  for (const g of DATA.groups){
    toc += '<a href="#/e/' + encodeURIComponent(g.items[0]) + '">' +
      '<span>' + g.name + '</span><span class="n">' + g.items.length + '건</span></a>';
  }
  $page.innerHTML =
    '<div class="cover">' +
    '<div class="seal" aria-hidden="true">判例帖</div>' +
    '<h1>行政書士 判例帖</h1>' +
    '<p class="lede">일본 행정서사 시험 대비 — 판례와 용어를 한 곳에서.</p>' +
    '<div class="counts">' +
    '<div><b>' + nCases + '</b><span>판례</span></div>' +
    '<div><b>' + nTerms + '</b><span>용어</span></div>' +
    (nKr ? '<div><b>' + nKr + '</b><span>한국 비교</span></div>' : '') +
    '</div>' +
    '<div class="toc">' + toc + '</div></div>';
  document.title = '行政書士 判例帖';
}

function renderEntry(id){
  const e = DATA.entries[id];
  if (!e){ renderCover(); return; }
  const idx = FLAT.indexOf(id);
  const prev = idx > 0 ? DATA.entries[FLAT[idx-1]] : null;
  const next = idx < FLAT.length-1 ? DATA.entries[FLAT[idx+1]] : null;
  const meta = [];
  if (e.sub) meta.push('<span>' + e.sub + '</span>');
  if (e.chip) meta.push(chipHtml(e.chip));
  let pager = '<nav class="pager">';
  if (prev) pager += '<a href="#/e/' + encodeURIComponent(prev.id) + '"><span class="dir">← 이전</span>' + prev.title + '</a>';
  if (next) pager += '<a class="next" href="#/e/' + encodeURIComponent(next.id) + '"><span class="dir">다음 →</span>' + next.title + '</a>';
  pager += '</nav>';
  $page.innerHTML =
    '<article>' +
    '<header class="doc-head">' +
    '<div class="eyebrow">' + (e.type === 'term' ? '용어' : e.type === 'kr' ? '한국 비교' : e.subject + ' 판례') + '</div>' +
    '<h1>' + e.title + '</h1>' +
    (meta.length ? '<div class="meta-line">' + meta.join('') + '</div>' : '') +
    '</header>' +
    '<div class="doc">' + e.html + '</div>' +
    pager + '</article>';
  document.title = e.title + ' — 行政書士 判例帖';
  window.scrollTo(0, 0);
}

function route(){
  const id = currentId();
  if (id) renderEntry(id); else renderCover();
  renderNav();
  closeSidebar();
}

function openSidebar(){ $sidebar.classList.add('open'); $scrim.classList.add('show'); }
function closeSidebar(){ $sidebar.classList.remove('open'); $scrim.classList.remove('show'); }

$menuBtn.addEventListener('click', openSidebar);
$scrim.addEventListener('click', closeSidebar);
$search.addEventListener('input', renderNav);
document.addEventListener('keydown', ev => {
  if (ev.key === '/' && document.activeElement !== $search){
    ev.preventDefault(); openSidebar(); $search.focus();
  }
  if (ev.key === 'Escape') closeSidebar();
});
window.addEventListener('hashchange', route);
route();
</script>
