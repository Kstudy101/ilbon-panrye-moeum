name: 텔레그램 공부 알리미

on:
  schedule:
    # 20분마다 깨어난다. 실제 발송 여부는 스크립트 안에서
    # config.json의 enabled/startHour/endHour(Asia/Seoul)를 보고 판단한다.
    # 매 실행마다 OX 퀴즈 5건 + 용어 카드 5건을 보낸다(quizBatchSize/termBatchSize).
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '시간대·토글 무시하고 즉시 1건 발송 (테스트용)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: telegram-study-alerts
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 발송
        id: send
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' && 'true' || 'false' }}
        run: node tools/telegram/send.mjs
        # 일부 항목만 실패해도(exit 0) 이력은 커밋해야 하므로 계속 진행한다.
        # 전부 실패했을 때만(exit 1) 이 스텝이 실패로 표시되고, 그래도 이력 커밋은 시도한다.
        continue-on-error: true

      - name: 발송 이력 커밋
        run: |
          if ! git diff --quiet -- tools/telegram/state.json; then
            git config user.name "telegram-study-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tools/telegram/state.json
            git commit -m "chore: 텔레그램 발송 이력 갱신 [skip ci]"
            # 같은 저장소에 다른 커밋이 그사이 들어왔을 수 있으니
            # rebase 후 push, 실패하면 몇 번 재시도한다(레이스 컨디션 방어).
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin master && git push && break
              echo "push 실패, 재시도 ($i/5)"
              sleep $((i * 3))
            done

      - name: 발송이 전부 실패했으면 워크플로도 실패로 표시
        if: steps.send.outcome == 'failure'
        run: exit 1
